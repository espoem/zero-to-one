<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Elasticsearch Algorithms: T-Digest Tail Compression, RRF Hybrid Fusion, and Murmur3 Shard Routing</title>
  <desc id="desc">Animated step-by-step visualization of three Elasticsearch core algorithms: T-Digest extreme-tail centroid compression preserving p1 and p99.9 accuracy, Reciprocal Rank Fusion 1/(k+rank) combining BM25 and kNN results regardless of score scale, and Lucene Murmur3_x86_32 UTF-16LE shard routing via floorMod(h, P).</desc>
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arr-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <style><![CDATA[
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

      /* 12s 4-phase cycle */
      @keyframes ph1 { 0%, 23% { opacity: 1; } 25%, 100% { opacity: 0; } }
      @keyframes ph2 { 0%, 23% { opacity: 0; } 25%, 48% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes ph3 { 0%, 48% { opacity: 0; } 50%, 73% { opacity: 1; } 75%, 100% { opacity: 0; } }
      @keyframes ph4 { 0%, 73% { opacity: 0; } 75%, 100% { opacity: 1; } }

      @keyframes rrf-win-pop {
        0%, 48%   { fill: #f8fafc; stroke: #94a3b8; }
        50%, 100% { fill: #ecfdf5; stroke: #059669; stroke-width: 2.5; }
      }
      @keyframes murmur-pulse {
        0%, 23%   { stroke: #2563eb; stroke-width: 2.5; }
        25%, 48%  { stroke: #7c3aed; stroke-width: 2.5; }
        50%, 73%  { stroke: #d97706; stroke-width: 2.5; }
        75%, 100% { stroke: #059669; stroke-width: 2.5; }
      }
      @keyframes shard-hit {
        0%, 73%   { fill: #f8fafc; stroke: #94a3b8; }
        75%, 100% { fill: #ecfdf5; stroke: #059669; stroke-width: 2.5; }
      }

      .p-1 { animation: ph1 12s linear infinite; }
      .p-2 { animation: ph2 12s linear infinite; }
      .p-3 { animation: ph3 12s linear infinite; }
      .p-4 { animation: ph4 12s linear infinite; }
      .rrf-win { animation: rrf-win-pop 12s linear infinite; }
      .m3-box  { animation: murmur-pulse 12s linear infinite; }
      .sh-2    { animation: shard-hit 12s linear infinite; }

      @media (prefers-reduced-motion: reduce) {
        .p-1, .p-2, .p-3, .p-4, .rrf-win, .m3-box, .sh-2 { animation: none !important; }
        .p-1, .p-2, .p-3 { opacity: 0; }
        .p-4 { opacity: 1; }
        .rrf-win, .sh-2 { fill: #ecfdf5; stroke: #059669; stroke-width: 2.5; }
        .m3-box { stroke: #059669; stroke-width: 2.5; }
      }
    ]]></style>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1200" height="760" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="1200" height="62" rx="12" fill="#0f172a"/>
  <rect x="0" y="46" width="1200" height="16" fill="#0f172a"/>
  <text x="24" y="28" class="sans" font-size="18" font-weight="700" fill="#f8fafc">Elasticsearch Algorithms: T-Digest Tails, RRF Hybrid Fusion &amp; Murmur3 Routing</text>
  <text x="24" y="49" class="sans" font-size="12" fill="#94a3b8">Scale-Function Centroid Compression (q -&gt; 0, 1) + Rank-Only 1 / (k + rank) Fusion + UTF-16LE floorMod(h, P) Sharding</text>

  <!-- TOP-LEFT: T-Digest Extreme-Tail Centroid Compression -->
  <rect x="24" y="78" width="564" height="340" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="24" y="78" width="564" height="36" rx="10" fill="#f1f5f9"/>
  <rect x="24" y="104" width="564" height="10" fill="#f1f5f9"/>
  <text x="40" y="101" class="sans" font-size="13.5" font-weight="700" fill="#0f172a">1. T-Digest Extreme-Tail Centroid Compression</text>
  <text x="572" y="101" class="mono" font-size="11" fill="#2563eb" text-anchor="end">compression = 100</text>

  <text x="40" y="138" class="mono" font-size="11" font-weight="700" fill="#475569">Centroid Weight Cap: k(q) = (delta / 2pi) * arcsin(2q - 1)  (Tiny at Tails!)</text>

  <!-- Quantile axis & centroids -->
  <rect x="40" y="152" width="532" height="130" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <line x1="64" y1="226" x2="548" y2="226" stroke="#64748b" stroke-width="2"/>
  <text x="52" y="250" class="mono" font-size="10.5" font-weight="700" fill="#059669" text-anchor="start">q=0 (p1)</text>
  <text x="306" y="250" class="mono" font-size="10.5" font-weight="700" fill="#d97706" text-anchor="middle">q=0.5 (p50 median)</text>
  <text x="556" y="250" class="mono" font-size="10.5" font-weight="700" fill="#059669" text-anchor="end">q=1 (p99.9)</text>

  <!-- Tight tail centroids at left (q->0) -->
  <circle cx="72" cy="226" r="5" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <circle cx="84" cy="226" r="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <circle cx="98" cy="226" r="7" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <circle cx="116" cy="226" r="9" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>

  <!-- Large merged middle centroids (q~0.5) -->
  <circle cx="176" cy="226" r="18" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <circle cx="242" cy="226" r="24" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <circle cx="306" cy="226" r="27" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
  <text x="306" y="230" class="mono" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">big</text>
  <circle cx="370" cy="226" r="24" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <circle cx="436" cy="226" r="18" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>

  <!-- Tight tail centroids at right (q->1) -->
  <circle cx="496" cy="226" r="9" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="514" cy="226" r="7" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <circle cx="528" cy="226" r="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <circle cx="540" cy="226" r="5" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>

  <text x="306" y="176" class="sans" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">Tail Centroids: tiny weight -&gt; &lt;1% error at p99 / p99.9 (~2 KB/bucket)</text>
  <text x="306" y="272" class="mono" font-size="10.5" fill="#475569" text-anchor="middle">Shards ship sorted centroids; coordinator re-clusters (approx merge vs HDR exact)</text>

  <!-- T-Digest Note -->
  <rect x="40" y="296" width="532" height="106" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="54" y="318" class="sans" font-size="11.5" font-weight="700" fill="#0f172a">Why T-Digest Beats Naive Percentiles:</text>
  <text x="54" y="338" class="sans" font-size="11" fill="#334155">- Exact below ~2,000 samples (compression * 20); bounded memory for billions.</text>
  <text x="54" y="356" class="sans" font-size="11" fill="#334155">- Unbounded float domain (unlike HDRHistogram's fixed integer [min, max]).</text>
  <text x="54" y="374" class="mono" font-size="10.5" fill="#e11d48">- Pitfall: NEVER average p95s across buckets; merge raw T-Digests instead.</text>

  <!-- TOP-RIGHT: Reciprocal Rank Fusion (RRF) -->
  <rect x="612" y="78" width="564" height="340" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="612" y="78" width="564" height="36" rx="10" fill="#f1f5f9"/>
  <rect x="612" y="104" width="564" height="10" fill="#f1f5f9"/>
  <text x="628" y="101" class="sans" font-size="13.5" font-weight="700" fill="#0f172a">2. Reciprocal Rank Fusion: RRF(d) = Sum 1 / (k + rank)</text>
  <text x="1160" y="101" class="mono" font-size="11" fill="#7c3aed" text-anchor="end">rank_constant k = 60</text>

  <!-- BM25 List -->
  <rect x="628" y="128" width="256" height="134" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="642" y="149" class="sans" font-size="11.5" font-weight="700" fill="#1d4ed8">BM25 Retriever (scores ~ 5..30)</text>
  <text x="642" y="172" class="mono" font-size="11" fill="#0f172a">#1 Doc A (24.5) -&gt; 1/61 = 0.01639</text>
  <text x="642" y="194" class="mono" font-size="11" font-weight="700" fill="#065f46">#2 Doc B (18.1) -&gt; 1/62 = 0.01613</text>
  <text x="642" y="216" class="mono" font-size="11" fill="#0f172a">#3 Doc C (15.0) -&gt; 1/63 = 0.01587</text>
  <text x="642" y="246" class="mono" font-size="10" fill="#2563eb">Raw BM25 scale discarded!</text>

  <!-- kNN List -->
  <rect x="904" y="128" width="256" height="134" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="918" y="149" class="sans" font-size="11.5" font-weight="700" fill="#5b21b6">kNN Retriever (cosine in [0, 1])</text>
  <text x="918" y="172" class="mono" font-size="11" font-weight="700" fill="#065f46">#1 Doc B (0.94) -&gt; 1/61 = 0.01639</text>
  <text x="918" y="194" class="mono" font-size="11" fill="#0f172a">#2 Doc D (0.89) -&gt; 1/62 = 0.01613</text>
  <text x="918" y="216" class="mono" font-size="11" fill="#0f172a">#3 Doc A (0.81) -&gt; 1/63 = 0.01587</text>
  <text x="918" y="246" class="mono" font-size="10" fill="#7c3aed">Top rank_window_size = 50 only</text>

  <!-- Fused Consensus Result -->
  <rect x="628" y="276" width="532" height="126" rx="8" class="rrf-win"/>
  <text x="642" y="298" class="sans" font-size="12" font-weight="700" fill="#0f172a">Fused Ranking (Consensus Beats Single-Retriever Spikes):</text>
  <text x="642" y="320" class="mono" font-size="11.5" font-weight="700" fill="#065f46">1st: Doc B = 1/62 + 1/61 = 0.03252  (ranked #2 BM25 + #1 kNN)</text>
  <text x="642" y="342" class="mono" font-size="11.5" fill="#1e293b">2nd: Doc A = 1/61 + 1/63 = 0.03227  (ranked #1 BM25 + #3 kNN)</text>
  <text x="642" y="364" class="mono" font-size="11.5" fill="#475569">3rd: Doc D = 0    + 1/62 = 0.01613  |  4th: Doc C = 0.01587</text>
  <text x="642" y="388" class="sans" font-size="11" fill="#047857">Zero weight tuning needed; invariant to affine scaling of BM25 or cosine scores.</text>

  <!-- BOTTOM FULL-WIDTH PANEL: Lucene Murmur3_x86_32 Shard Routing -->
  <rect x="24" y="434" width="1152" height="248" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="24" y="434" width="1152" height="36" rx="10" fill="#f1f5f9"/>
  <rect x="24" y="460" width="1152" height="10" fill="#f1f5f9"/>
  <text x="40" y="457" class="sans" font-size="13.5" font-weight="700" fill="#0f172a">3. Lucene Murmur3_x86_32 UTF-16LE Shard Routing (Elasticsearch 9+ Direct Modulo)</text>
  <text x="1160" y="457" class="mono" font-size="11" fill="#059669" text-anchor="end">shard = floorMod(h, P)</text>

  <!-- Pipeline Stages -->
  <g transform="translate(44, 488)">
    <!-- Step 1: UTF-16LE -->
    <rect x="0" y="0" width="236" height="96" rx="8" fill="#eff6ff" stroke="#2563eb" class="m3-box"/>
    <text x="14" y="22" class="sans" font-size="11.5" font-weight="700" fill="#1d4ed8">1. _id -&gt; UTF-16LE Bytes</text>
    <text x="14" y="44" class="mono" font-size="11.5" font-weight="700" fill="#0f172a">routing = "654321"</text>
    <text x="14" y="64" class="mono" font-size="10.5" fill="#1e3a8a">Java char[] lo/hi bytes:</text>
    <text x="14" y="82" class="mono" font-size="10.5" fill="#2563eb">36 00 35 00 34 00 33 00 ...</text>

    <line x1="236" y1="48" x2="264" y2="48" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>

    <!-- Step 2: 32-bit Block Mix + fmix32 -->
    <rect x="272" y="0" width="290" height="96" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="286" y="22" class="sans" font-size="11.5" font-weight="700" fill="#5b21b6">2. Murmur3_x86_32 (seed = 0)</text>
    <text x="286" y="44" class="mono" font-size="10.5" fill="#4c1d95">c1=0xcc9e2d51, c2=0x1b873593</text>
    <text x="286" y="64" class="mono" font-size="10.5" fill="#4c1d95">rotl32(15), rotl32(13)*5 + 0xe6546b64</text>
    <text x="286" y="82" class="mono" font-size="11" font-weight="700" fill="#5b21b6">fmix32 -&gt; h = 1,424,940,152</text>

    <line x1="562" y1="48" x2="590" y2="48" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-violet)"/>

    <!-- Step 3: floorMod(h, P) -->
    <rect x="598" y="0" width="236" height="96" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="612" y="22" class="sans" font-size="11.5" font-weight="700" fill="#92400e">3. ES 9+ floorMod(h, P=6)</text>
    <text x="612" y="44" class="mono" font-size="11" font-weight="700" fill="#0f172a">floorMod(1424940152, 6)</text>
    <text x="612" y="64" class="mono" font-size="12" font-weight="700" fill="#b45309">= 2  (in [0, P))</text>
    <text x="612" y="82" class="mono" font-size="10" fill="#78350f">safe even when h &lt; 0</text>

    <line x1="834" y1="48" x2="862" y2="48" stroke="#059669" stroke-width="2" marker-end="url(#arr-emerald)"/>

    <!-- Step 4: 6 Shards -->
    <g transform="translate(870, 0)">
      <rect x="0" y="0" width="240" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="120" y="20" class="sans" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Primary Shards (P = 6)</text>
      <rect x="14" y="34" width="32" height="44" rx="4" fill="#ffffff" stroke="#94a3b8"/>
      <text x="30" y="61" class="mono" font-size="11" fill="#475569" text-anchor="middle">S0</text>
      <rect x="50" y="34" width="32" height="44" rx="4" fill="#ffffff" stroke="#94a3b8"/>
      <text x="66" y="61" class="mono" font-size="11" fill="#475569" text-anchor="middle">S1</text>
      <rect x="86" y="34" width="32" height="44" rx="4" class="sh-2"/>
      <text x="102" y="61" class="mono" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">S2</text>
      <rect x="122" y="34" width="32" height="44" rx="4" fill="#ffffff" stroke="#94a3b8"/>
      <text x="138" y="61" class="mono" font-size="11" fill="#475569" text-anchor="middle">S3</text>
      <rect x="158" y="34" width="32" height="44" rx="4" fill="#ffffff" stroke="#94a3b8"/>
      <text x="174" y="61" class="mono" font-size="11" fill="#475569" text-anchor="middle">S4</text>
      <rect x="194" y="34" width="32" height="44" rx="4" fill="#ffffff" stroke="#94a3b8"/>
      <text x="210" y="61" class="mono" font-size="11" fill="#475569" text-anchor="middle">S5</text>
    </g>
  </g>

  <!-- Animated Bottom Trace Strip -->
  <rect x="44" y="600" width="1112" height="66" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <g class="p-1">
    <text x="60" y="624" class="mono" font-size="12" font-weight="700" fill="#1d4ed8">Stage 1: UTF-16LE Trap &amp; T-Digest Tails</text>
    <text x="60" y="646" class="sans" font-size="11.5" fill="#334155">Standard UTF-8 Murmur3 produces wrong shard IDs ("hello" -&gt; 0x248bfa47 vs Lucene UTF-16LE 0xd7c31989). T-Digest locks small centroids near p1/p99.9.</text>
  </g>
  <g class="p-2">
    <text x="60" y="624" class="mono" font-size="12" font-weight="700" fill="#5b21b6">Stage 2: Avalanche Mixing (fmix32) &amp; Scale-Free RRF</text>
    <text x="60" y="646" class="sans" font-size="11.5" fill="#334155">1-bit _id changes flip ~50% of hash bits for uniform shard distribution. RRF converts incompatible BM25/kNN scores into rank reciprocals 1/(60+rank).</text>
  </g>
  <g class="p-3">
    <text x="60" y="624" class="mono" font-size="12" font-weight="700" fill="#065f46">Stage 3: Consensus Fusion &amp; ES 9+ floorMod(h, P)</text>
    <text x="60" y="646" class="sans" font-size="11.5" fill="#334155">Doc B (#2 BM25 + #1 kNN = 0.03252) beats single-retriever #1 hits. Direct floorMod(h, 6) = 2 (legacy ES 7/8 R=768 routing shards routed to shard 4).</text>
  </g>
  <g class="p-4">
    <text x="60" y="624" class="mono" font-size="12" font-weight="700" fill="#0f172a">Stage 4: Split Arithmetic &amp; Shard-Local Semantics</text>
    <text x="60" y="646" class="sans" font-size="11.5" fill="#334155">Splitting P -&gt; kP shards preserves floorMod(h, kP) == floorMod(h, P) (mod P), isolating copies to child shards without full-cluster reshuffling.</text>
  </g>

  <!-- Footer Legend -->
  <rect x="24" y="698" width="1152" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="40" y="713" width="14" height="14" rx="3" fill="#ecfdf5" stroke="#059669"/>
  <text x="60" y="724" class="sans" font-size="11.5" fill="#334155">Tail Centroids / RRF Winner / Target Shard</text>
  <rect x="330" y="713" width="14" height="14" rx="3" fill="#fffbeb" stroke="#d97706"/>
  <text x="350" y="724" class="sans" font-size="11.5" fill="#334155">Merged Middle / floorMod</text>
  <rect x="526" y="713" width="14" height="14" rx="3" fill="#eff6ff" stroke="#2563eb"/>
  <text x="546" y="724" class="sans" font-size="11.5" fill="#334155">BM25 / UTF-16LE</text>
  <rect x="686" y="713" width="14" height="14" rx="3" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="706" y="724" class="sans" font-size="11.5" fill="#334155">kNN / Murmur3 Mix</text>
  <text x="1160" y="724" class="mono" font-size="11" font-weight="700" fill="#0f172a" text-anchor="end">Elasticsearch 9.x / Lucene 10</text>
</svg>
