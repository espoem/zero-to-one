<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 660" width="1160" height="660" role="img" aria-labelledby="title desc">
  <title id="title">GitLab CI Core Algorithms: Greedy LPT, RFC 6962 Merkle Proof, and Kahn Critical Path DP</title>
  <desc id="desc">Animated 3-panel storyboard showing M05 Greedy LPT test bin-packing onto two runner min-heaps achieving 65s makespan within Graham's bound, M06 RFC 6962 Merkle inclusion proof verification using 0x01 interior domain separation in O(log N) hashes, and M09 Kahn topological sort O(V+E) dynamic programming identifying the 14m critical path e2e to signoff.</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* 12s cycle:
       0-33%  (0-4s): Panel 1 active - Greedy LPT fills R1 (40,15,10=65s) and R2 (30,25=55s)
       33-66% (4-8s): Panel 2 active - Merkle 0x01 inclusion climb L2* + L3 -> H23 -> Root
       66-100%(8-12s):Panel 3 active - Kahn O(V+E) DP propagates ef[] and highlights e2e -> signoff (14m)
    */

    @keyframes card1-hl {
      0%, 33%   { stroke: #0f766e; stroke-width: 2.5; }
      34%, 100% { stroke: #d6d0c4; stroke-width: 1.5; }
    }
    @keyframes card2-hl {
      0%, 33%   { stroke: #d6d0c4; stroke-width: 1.5; }
      34%, 66%  { stroke: #0f766e; stroke-width: 2.5; }
      67%, 100% { stroke: #d6d0c4; stroke-width: 1.5; }
    }
    @keyframes card3-hl {
      0%, 66%   { stroke: #d6d0c4; stroke-width: 1.5; }
      67%, 100% { stroke: #0f766e; stroke-width: 2.5; }
    }

    /* LPT block sequential pop-in */
    @keyframes lpt-b1 { 0%, 4% { opacity: 0.86; } 8%, 94% { opacity: 1; } 100% { opacity: 0.86; } }
    @keyframes lpt-b2 { 0%, 9% { opacity: 0.86; } 13%, 94% { opacity: 1; } 100% { opacity: 0.86; } }
    @keyframes lpt-b3 { 0%, 14% { opacity: 0.86; } 18%, 94% { opacity: 1; } 100% { opacity: 0.86; } }
    @keyframes lpt-b4 { 0%, 19% { opacity: 0.86; } 23%, 94% { opacity: 1; } 100% { opacity: 0.86; } }
    @keyframes lpt-b5 { 0%, 24% { opacity: 0.86; } 28%, 94% { opacity: 1; } 100% { opacity: 0.86; } }

    /* Merkle proof climb */
    @keyframes mk-s1 {
      0%, 34%  { opacity: 0.86; }
      39%, 94% { opacity: 1; }
      100%     { opacity: 0.86; }
    }
    @keyframes mk-s2 {
      0%, 46%  { opacity: 0.86; }
      51%, 94% { opacity: 1; }
      100%     { opacity: 0.86; }
    }
    @keyframes mk-ok {
      0%, 54%  { opacity: 0; }
      58%, 94% { opacity: 1; }
      100%     { opacity: 0; }
    }

    /* Critical path highlight */
    
    @keyframes cp-node {
      0%, 67%   { stroke: #d6d0c4; stroke-width: 1.5; fill: #faf8f5; }
      74%, 97%  { stroke: #dc2626; stroke-width: 2.5; fill: #fef2f2; }
      100%      { stroke: #d6d0c4; stroke-width: 1.5; fill: #faf8f5; }
    }

    .c1 { animation: card1-hl 12s linear infinite; }
    .c2 { animation: card2-hl 12s linear infinite; }
    .c3 { animation: card3-hl 12s linear infinite; }
    .b1 { animation: lpt-b1 12s ease-in-out infinite; }
    .b2 { animation: lpt-b2 12s ease-in-out infinite; }
    .b3 { animation: lpt-b3 12s ease-in-out infinite; }
    .b4 { animation: lpt-b4 12s ease-in-out infinite; }
    .b5 { animation: lpt-b5 12s ease-in-out infinite; }
    .ms1 { animation: mk-s1 12s ease-in-out infinite; }
    .ms2 { animation: mk-s2 12s ease-in-out infinite; }
    .mok { animation: mk-ok 12s ease-in-out infinite; }
    .cp-n { animation: cp-node 12s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .c1, .c2, .c3, .b1, .b2, .b3, .b4, .b5, .ms1, .ms2, .mok, .cp-e, .cp-n {
        animation: none !important;
      }
      .b1, .b2, .b3, .b4, .b5, .ms1, .ms2, .mok { opacity: 1 !important; }
      .cp-e { stroke: #dc2626 !important; stroke-width: 3.5 !important; opacity: 1 !important; }
      .cp-n { stroke: #dc2626 !important; stroke-width: 2.5 !important; fill: #fef2f2 !important; }
    }
  </style>

  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#57534e"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1160" height="660" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>

  <!-- Header -->
  <line x1="24" y1="62" x2="1136" y2="62" stroke="#1c1917" stroke-width="1.2"/>
  
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#1c1917" font-family="Georgia, 'Times New Roman', serif">GitLab CI Core Algorithms: Greedy LPT, Merkle Inclusion &amp; Critical Path DP</text>
  <text x="24" y="47" class="sans" font-size="12" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">M05: Min-Heap LPT Test Sharding · M06: RFC 6962 0x01 Merkle Proof · M09: Kahn O(|V|+|E|) DAG Critical Path</text>

  <!-- PANEL 1 (TOP-LEFT): M05 GREEDY LPT -->
  <rect x="24" y="76" width="546" height="280" rx="10" fill="#ffffff" class="c1"/>
  <rect x="40" y="90" width="44" height="22" rx="5" fill="#0f766e"/>
  <text x="62" y="105" class="mono" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">M05</text>
  <text x="94" y="106" class="sans" font-size="13.5" font-weight="700" fill="#1c1917">Greedy LPT Test Bin-Packing (N = 2 Runners)</text>

  <!-- Sorted input queue -->
  <text x="40" y="133" class="mono" font-size="10.5" font-weight="700" fill="#44403c">Sorted Desc:</text>
  <rect x="130" y="118" width="76" height="21" rx="4" fill="#f0fdf9" stroke="#99f6e4"/>
  <text x="168" y="132" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">e2e 40s</text>
  <rect x="212" y="118" width="76" height="21" rx="4" fill="#f0fdf9" stroke="#99f6e4"/>
  <text x="250" y="132" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">api 30s</text>
  <rect x="294" y="118" width="80" height="21" rx="4" fill="#fffbeb" stroke="#fde68a"/>
  <text x="334" y="132" class="mono" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">auth 25s</text>
  <rect x="380" y="118" width="80" height="21" rx="4" fill="#f0fdf9" stroke="#99f6e4"/>
  <text x="420" y="132" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">unit 15s</text>
  <rect x="466" y="118" width="82" height="21" rx="4" fill="#f5f1e8" stroke="#d6d0c4"/>
  <text x="507" y="132" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">lint 10s</text>

  <!-- Runner 1 -->
  <text x="40" y="177" class="mono" font-size="11.5" font-weight="700" fill="#1c1917">R1</text>
  <rect x="74" y="154" width="410" height="36" rx="6" fill="#f5f1e8" stroke="#d6d0c4"/>
  <g class="b1">
    <rect x="76" y="156" width="220" height="32" rx="4" fill="#0f766e"/>
    <text x="186" y="176" class="mono" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1. e2e (40s)</text>
  </g>
  <g class="b4">
    <rect x="298" y="156" width="82" height="32" rx="4" fill="#0f766e"/>
    <text x="339" y="176" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">4. 15s</text>
  </g>
  <g class="b5">
    <rect x="382" y="156" width="56" height="32" rx="4" fill="#0f766e"/>
    <text x="410" y="176" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">5. 10s</text>
  </g>
  <rect x="494" y="159" width="58" height="26" rx="5" fill="#f0fdf9" stroke="#0f766e"/>
  <text x="523" y="176" class="mono" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">65s</text>

  <!-- Runner 2 -->
  <text x="40" y="225" class="mono" font-size="11.5" font-weight="700" fill="#1c1917">R2</text>
  <rect x="74" y="202" width="410" height="36" rx="6" fill="#f5f1e8" stroke="#d6d0c4"/>
  <g class="b2">
    <rect x="76" y="204" width="165" height="32" rx="4" fill="#0f766e"/>
    <text x="158" y="224" class="mono" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2. api (30s)</text>
  </g>
  <g class="b3">
    <rect x="243" y="204" width="138" height="32" rx="4" fill="#b45309"/>
    <text x="312" y="224" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">3. auth (25s)</text>
  </g>
  <rect x="494" y="207" width="58" height="26" rx="5" fill="#f0fdf9" stroke="#0f766e"/>
  <text x="523" y="224" class="mono" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">55s</text>

  <!-- LPT Summary Box -->
  <rect x="40" y="254" width="514" height="86" rx="8" fill="#f0fdf9" stroke="#bfdbfe"/>
  <text x="54" y="275" class="mono" font-size="10.5" font-weight="700" fill="#065f46">EXTRACT-MIN(workerHeap) Trace:</text>
  <text x="54" y="295" class="mono" font-size="10.5" fill="#44403c">40→R1(40) · 30→R2(30) · 25→R2(55) · 15→R1(55) · 10→R1(65)</text>
  <text x="54" y="315" class="mono" font-size="10.5" font-weight="700" fill="#065f46">Makespan = 65s ≤ (4/3 − 1/3N)·OPT = 7/6·OPT (Graham 1969)</text>
  <text x="54" y="332" class="sans" font-size="10" fill="#44403c">Prevents straggler pileups caused by naive modulo sharding.</text>

  <!-- PANEL 2 (TOP-RIGHT): M06 MERKLE INCLUSION PROOF -->
  <rect x="590" y="76" width="546" height="280" rx="10" fill="#ffffff" class="c2"/>
  <rect x="606" y="90" width="44" height="22" rx="5" fill="#0f766e"/>
  <text x="628" y="105" class="mono" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">M06</text>
  <text x="660" y="106" class="sans" font-size="13.5" font-weight="700" fill="#1c1917">RFC 6962 0x01 Merkle Inclusion Proof</text>

  <!-- Verified badge -->
  <g class="mok">
    <rect x="1028" y="89" width="94" height="24" rx="5" fill="#0f766e"/>
    <text x="1075" y="105" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">VERIFIED</text>
  </g>

  <!-- Tree Edges -->
  <line x1="646" y1="218" x2="676" y2="192" stroke="#d6d0c4" stroke-width="1.8"/>
  <line x1="714" y1="218" x2="684" y2="192" stroke="#d6d0c4" stroke-width="1.8"/>
  <line x1="900" y1="218" x2="946" y2="192" stroke="#0f766e" stroke-width="2" class="ms1"/>
  <line x1="1024" y1="218" x2="974" y2="192" stroke="#b45309" stroke-width="2" class="ms1"/>
  <line x1="680" y1="164" x2="800" y2="144" stroke="#b45309" stroke-width="2" class="ms2"/>
  <line x1="960" y1="164" x2="844" y2="144" stroke="#0f766e" stroke-width="2" class="ms2"/>

  <!-- Root STH -->
  <rect x="742" y="116" width="160" height="28" rx="6" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.8" class="ms2"/>
  <text x="822" y="134" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">Root STH (tree=4)</text>

  <!-- Interior H01 & H23 -->
  <rect x="616" y="164" width="128" height="28" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
  <text x="680" y="182" class="mono" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">H01 (audit[2])</text>

  <rect x="892" y="164" width="136" height="28" rx="6" fill="#f5f1e8" stroke="#0f766e" stroke-width="1.8" class="ms1"/>
  <text x="960" y="182" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">H23 = H(0x01∥L2∥L3)</text>

  <!-- Leaves -->
  <rect x="612" y="218" width="60" height="26" rx="5" fill="#f5f1e8" stroke="#d6d0c4"/>
  <text x="642" y="235" class="mono" font-size="10" fill="#57534e" text-anchor="middle">L0</text>
  <rect x="684" y="218" width="60" height="26" rx="5" fill="#f5f1e8" stroke="#d6d0c4"/>
  <text x="714" y="235" class="mono" font-size="10" fill="#57534e" text-anchor="middle">L1</text>

  <rect x="850" y="218" width="96" height="26" rx="5" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.8"/>
  <text x="898" y="235" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">L2* (idx=2)</text>

  <rect x="970" y="218" width="108" height="26" rx="5" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
  <text x="1024" y="235" class="mono" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">L3 (audit[1])</text>

  <!-- Merkle Summary Box -->
  <rect x="606" y="254" width="514" height="86" rx="8" fill="#f5f1e8" stroke="#ddd6fe"/>
  <text x="620" y="275" class="mono" font-size="10.5" font-weight="700" fill="#065f46">Verify(leaf_hash=L2*, idx=2, size=4, audit=[L3, H01]):</text>
  <text x="620" y="295" class="mono" font-size="10.5" fill="#44403c">1. idx=2 (even,&lt;3): hash ← SHA-256(0x01 ∥ hash ∥ L3)</text>
  <text x="620" y="313" class="mono" font-size="10.5" fill="#44403c">2. idx=1 (odd):     hash ← SHA-256(0x01 ∥ H01 ∥ hash)</text>
  <text x="620" y="331" class="sans" font-size="10" font-weight="700" fill="#065f46">0x01 interior byte vs 0x00 leaf byte blocks second-preimage forgery · O(log N)</text>

  <!-- PANEL 3 (BOTTOM FULL WIDTH): M09 KAHN CRITICAL PATH DP -->
  <rect x="24" y="372" width="1112" height="264" rx="10" fill="#ffffff" class="c3"/>
  <rect x="40" y="386" width="44" height="22" rx="5" fill="#0f766e"/>
  <text x="62" y="401" class="mono" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">M09</text>
  <text x="94" y="402" class="sans" font-size="13.5" font-weight="700" fill="#1c1917">Kahn's O(|V|+|E|) Topological Sort &amp; DAG Critical Path DP (needs:)</text>

  <!-- DAG Edges -->
  <!-- lint -> build -->
  <line x1="194" y1="438" x2="282" y2="438" stroke="#57534e" stroke-width="1.8" marker-end="url(#arr-slate)"/>
  <!-- lint -> unit -->
  <line x1="194" y1="452" x2="282" y2="494" stroke="#57534e" stroke-width="1.8" marker-end="url(#arr-slate)"/>
  <!-- build -> deploy -->
  <line x1="430" y1="438" x2="536" y2="438" stroke="#57534e" stroke-width="1.8" marker-end="url(#arr-slate)"/>
  <!-- unit -> deploy -->
  <line x1="430" y1="494" x2="536" y2="452" stroke="#57534e" stroke-width="1.8" marker-end="url(#arr-slate)"/>
  <!-- build -> signoff -->
  <line x1="430" y1="452" x2="536" y2="554" stroke="#d6d0c4" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-slate)"/>
  <!-- e2e -> signoff (CRITICAL PATH) -->
  <line x1="194" y1="572" x2="536" y2="572" marker-end="url(#arr-rose)" class="cp-e"/>
  <rect x="302" y="556" width="128" height="20" rx="4" fill="#fef2f2" stroke="#fda4af"/>
  <text x="366" y="570" class="mono" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">CRITICAL: 12m → 14m</text>

  <!-- DAG Job Nodes -->
  <!-- lint -->
  <rect x="44" y="418" width="150" height="48" rx="7" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.6"/>
  <text x="119" y="438" class="mono" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">lint (2m)</text>
  <text x="119" y="456" class="mono" font-size="10" fill="#44403c" text-anchor="middle">in:0 · ef=0→2m</text>

  <!-- e2e (critical source) -->
  <rect x="44" y="546" width="150" height="52" rx="7" class="cp-n"/>
  <text x="119" y="567" class="mono" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">e2e (12m)</text>
  <text x="119" y="585" class="mono" font-size="10" fill="#991b1b" text-anchor="middle">in:0 · ef=0→12m</text>

  <!-- build -->
  <rect x="286" y="414" width="144" height="46" rx="7" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.6"/>
  <text x="358" y="433" class="mono" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">build (5m)</text>
  <text x="358" y="450" class="mono" font-size="10" fill="#44403c" text-anchor="middle">in:1 · ef=2→7m</text>

  <!-- unit -->
  <rect x="286" y="472" width="144" height="46" rx="7" fill="#faf8f5" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="358" y="491" class="mono" font-size="11" font-weight="700" fill="#44403c" text-anchor="middle">unit (3m)</text>
  <text x="358" y="508" class="mono" font-size="10" fill="#57534e" text-anchor="middle">in:1 · ef=2→5m</text>

  <!-- deploy -->
  <rect x="540" y="418" width="156" height="48" rx="7" fill="#faf8f5" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="618" y="438" class="mono" font-size="11" font-weight="700" fill="#44403c" text-anchor="middle">deploy (3m)</text>
  <text x="618" y="456" class="mono" font-size="10" fill="#57534e" text-anchor="middle">ef=max(7,5)=7→10m</text>

  <!-- signoff (critical sink) -->
  <rect x="540" y="546" width="156" height="52" rx="7" class="cp-n"/>
  <text x="618" y="567" class="mono" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">signoff (2m)</text>
  <text x="618" y="585" class="mono" font-size="10" fill="#991b1b" text-anchor="middle">ef=max(7,12)=12→14m</text>

  <!-- Right Sub-panel: Kahn DP Trace -->
  <rect x="720" y="414" width="396" height="204" rx="8" fill="#f0fdf9" stroke="#f0fdf9"/>
  <text x="736" y="438" class="sans" font-size="12.5" font-weight="700" fill="#065f46">Kahn Topological DP &amp; Bottleneck Trace</text>
  <line x1="736" y1="448" x2="1100" y2="448" stroke="#f0fdf9" stroke-width="1.2"/>
  <text x="736" y="470" class="mono" font-size="10.5" fill="#44403c">1. Init Q (in_deg=0): [lint(2m), e2e(12m)]</text>
  <text x="736" y="492" class="mono" font-size="10.5" fill="#44403c">2. Relax lint→build,unit: ef=2m; build→deploy: 7m</text>
  <text x="736" y="514" class="mono" font-size="10.5" fill="#44403c">3. Relax e2e→signoff: ef[signoff] = max(7,12) = 12m</text>
  <text x="736" y="536" class="mono" font-size="10.5" fill="#44403c">4. Sink max: signoff (12+2 = 14m) &gt; deploy (10m)</text>
  <rect x="736" y="552" width="364" height="28" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="918" y="570" class="mono" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">T_crit = 14m · Path: [e2e → signoff]</text>
  <text x="736" y="602" class="sans" font-size="10" fill="#065f46">deploy branch has 4m slack; optimizing lint/build won't reduce T_crit.</text>
</svg>
