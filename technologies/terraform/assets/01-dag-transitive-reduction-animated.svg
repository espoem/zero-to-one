<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" width="1120" height="580" role="img" aria-labelledby="title desc">
  <title id="title">Terraform 2-Phase Transitive Reduction and Parallel DAG Walk</title>
  <desc id="desc">Animated Terraform execution graph showing Phase 1 transitive closure and longest-path dynamic programming computing Dist[A][C] equals 2 through intermediate node B, Phase 2 eliminating the redundant edge A to C and reducing in-degree(C) from 2 to 1, and Phase 3 parallel worker-pool execution across Wave 1 (A), Wave 2 (B and D in parallel), and Wave 3 (C) while preserving reachability invariant G_TR+ equals G+.</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* 12s cycle:
       0-25%  (0-3s): Phase 1 - Transitive Closure and Longest Path DP (Dist[A][C] = 2 via B)
       25-50% (3-6s): Phase 2 - Prune redundant edge (A -> C), in-deg(C): 2 -> 1
       50-75% (6-9s): Phase 3a - Worker Pool Wave 1 executes A (in-deg 0), unlocks B and D
       75-100%(9-12s):Phase 3b - Wave 2 executes B || D in parallel, unlocks Wave 3 C
    */

    @keyframes edge-ac-fade {
      0%, 24%   { opacity: 0.9; stroke: #d97706; stroke-width: 2.2; }
      28%, 48%  { opacity: 1; stroke: #e11d48; stroke-width: 2.8; }
      54%, 95%  { opacity: 0.86; stroke: #e11d48; stroke-width: 1.5; }
      100%      { opacity: 0.9; stroke: #d97706; stroke-width: 2.2; }
    }

    @keyframes prune-badge {
      0%, 24%   { opacity: 0; }
      28%, 95%  { opacity: 1; }
      100%      { opacity: 0; }
    }

    @keyframes dp-highlight {
      0%, 24%   { stroke: #7c3aed; stroke-width: 2.5; opacity: 1; }
      28%, 96%  { stroke: #cbd5e1; stroke-width: 1.2; opacity: 0.78; }
      100%      { stroke: #7c3aed; stroke-width: 2.5; opacity: 1; }
    }

    @keyframes node-a-active {
      0%, 49%   { stroke: #2563eb; stroke-width: 1.8; fill: #eff6ff; }
      52%, 74%  { stroke: #059669; stroke-width: 3; fill: #ecfdf5; }
      78%, 96%  { stroke: #059669; stroke-width: 2; fill: #ecfdf5; }
      100%      { stroke: #2563eb; stroke-width: 1.8; fill: #eff6ff; }
    }

    @keyframes node-bd-active {
      0%, 72%   { stroke: #2563eb; stroke-width: 1.8; fill: #eff6ff; }
      75%, 88%  { stroke: #059669; stroke-width: 3; fill: #ecfdf5; }
      90%, 96%  { stroke: #059669; stroke-width: 2; fill: #ecfdf5; }
      100%      { stroke: #2563eb; stroke-width: 1.8; fill: #eff6ff; }
    }

    @keyframes node-c-active {
      0%, 84%   { stroke: #2563eb; stroke-width: 1.8; fill: #eff6ff; }
      87%, 97%  { stroke: #059669; stroke-width: 3; fill: #ecfdf5; }
      100%      { stroke: #2563eb; stroke-width: 1.8; fill: #eff6ff; }
    }

    @keyframes indeg-old {
      0%, 27%   { opacity: 1; }
      31%, 95%  { opacity: 0; }
      100%      { opacity: 1; }
    }

    @keyframes indeg-new {
      0%, 27%   { opacity: 0; }
      31%, 95%  { opacity: 1; }
      100%      { opacity: 0; }
    }

    @keyframes step1-hl {
      0%, 24%   { opacity: 1; stroke: #7c3aed; stroke-width: 2.5; }
      25%, 100% { opacity: 0.86; stroke: #cbd5e1; stroke-width: 1.2; }
    }
    @keyframes step2-hl {
      0%, 24%   { opacity: 0.86; stroke: #cbd5e1; stroke-width: 1.2; }
      25%, 49%  { opacity: 1; stroke: #e11d48; stroke-width: 2.5; }
      50%, 100% { opacity: 0.86; stroke: #cbd5e1; stroke-width: 1.2; }
    }
    @keyframes step3-hl {
      0%, 49%   { opacity: 0.86; stroke: #cbd5e1; stroke-width: 1.2; }
      50%, 74%  { opacity: 1; stroke: #2563eb; stroke-width: 2.5; }
      75%, 100% { opacity: 0.86; stroke: #cbd5e1; stroke-width: 1.2; }
    }
    @keyframes step4-hl {
      0%, 74%   { opacity: 0.86; stroke: #cbd5e1; stroke-width: 1.2; }
      75%, 100% { opacity: 1; stroke: #059669; stroke-width: 2.5; }
    }

    .edge-ac  { animation: edge-ac-fade 12s ease-in-out infinite; }
    .prune-b  { animation: prune-badge 12s ease-in-out infinite; }
    .dp-box   { animation: dp-highlight 12s ease-in-out infinite; }
    .na       { animation: node-a-active 12s ease-in-out infinite; }
    .nbd      { animation: node-bd-active 12s ease-in-out infinite; }
    .nc       { animation: node-c-active 12s ease-in-out infinite; }
    .indeg-2  { animation: indeg-old 12s linear infinite; }
    .indeg-1  { animation: indeg-new 12s linear infinite; }
    .s1       { animation: step1-hl 12s linear infinite; }
    .s2       { animation: step2-hl 12s linear infinite; }
    .s3       { animation: step3-hl 12s linear infinite; }
    .s4       { animation: step4-hl 12s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .edge-ac, .prune-b, .dp-box, .na, .nbd, .nc, .indeg-2, .indeg-1, .s1, .s2, .s3, .s4 {
        animation: none !important;
      }
      .edge-ac  { opacity: 0.86 !important; stroke: #e11d48 !important; stroke-width: 2 !important; }
      .prune-b  { opacity: 1 !important; }
      .dp-box   { opacity: 1 !important; stroke: #7c3aed !important; }
      .na, .nbd, .nc { stroke: #059669 !important; fill: #ecfdf5 !important; }
      .indeg-2  { opacity: 0 !important; }
      .indeg-1  { opacity: 1 !important; }
      .s1, .s2, .s3, .s4 { opacity: 1 !important; }
    }
  </style>

  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1120" height="580" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="1120" height="60" rx="12" fill="#0f172a"/>
  <rect x="0" y="44" width="1120" height="16" fill="#0f172a"/>
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#f8fafc">Terraform 2-Phase Transitive Reduction &amp; Parallel DAG Walk</text>
  <text x="24" y="47" class="sans" font-size="12" fill="#94a3b8">Phase 1: Transitive Closure + Longest Path DP · Phase 2: Prune Redundant (A→C) · Phase 3: Kahn In-Degree Worker Pool</text>

  <!-- LEFT PANEL: INFRASTRUCTURE DAG & DP MATRIX -->
  <rect x="24" y="76" width="520" height="480" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="42" y="102" class="sans" font-size="14" font-weight="700" fill="#0f172a">Dependency Graph (|V| = 4, |E| = 4 → |E_TR| = 3)</text>

  <!-- Retained Edges -->
  <!-- A -> B -->
  <line x1="216" y1="153" x2="326" y2="153" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr-blue)"/>
  <rect x="244" y="131" width="56" height="17" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="272" y="143" class="mono" font-size="10" font-weight="700" fill="#1e40af" text-anchor="middle">vpc_id</text>

  <!-- A -> D -->
  <line x1="134" y1="182" x2="134" y2="254" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr-blue)"/>
  <rect x="64" y="211" width="56" height="17" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="92" y="223" class="mono" font-size="10" font-weight="700" fill="#1e40af" text-anchor="middle">vpc_id</text>

  <!-- B -> C -->
  <line x1="423" y1="182" x2="423" y2="254" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr-blue)"/>
  <rect x="435" y="211" width="70" height="17" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="470" y="223" class="mono" font-size="10" font-weight="700" fill="#1e40af" text-anchor="middle">subnet_id</text>

  <!-- Redundant Edge A -> C -->
  <line x1="214" y1="180" x2="328" y2="256" stroke-dasharray="6 4" marker-end="url(#arr-rose)" class="edge-ac"/>
  <g class="prune-b">
    <rect x="219" y="207" width="108" height="24" rx="5" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
    <text x="273" y="223" class="mono" font-size="10" font-weight="700" fill="#9f1239" text-anchor="middle">PRUNED (A→C)</text>
  </g>

  <!-- Graph Nodes -->
  <!-- Node A -->
  <rect x="52" y="124" width="164" height="58" rx="8" class="na"/>
  <text x="134" y="147" class="mono" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">A: aws_vpc.main</text>
  <rect x="92" y="155" width="84" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="134" y="168" class="mono" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">in-deg: 0</text>

  <!-- Node B -->
  <rect x="330" y="124" width="186" height="58" rx="8" class="nbd"/>
  <text x="423" y="147" class="mono" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">B: aws_subnet.priv</text>
  <rect x="381" y="155" width="84" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="423" y="168" class="mono" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">in-deg: 1</text>

  <!-- Node D -->
  <rect x="52" y="258" width="164" height="58" rx="8" class="nbd"/>
  <text x="134" y="281" class="mono" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">D: aws_igw.edge</text>
  <rect x="92" y="289" width="84" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="134" y="302" class="mono" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">in-deg: 1</text>

  <!-- Node C -->
  <rect x="330" y="258" width="186" height="58" rx="8" class="nc"/>
  <text x="423" y="281" class="mono" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">C: aws_instance.app</text>
  <g class="indeg-2">
    <rect x="369" y="289" width="108" height="18" rx="4" fill="#fffbeb" stroke="#d97706"/>
    <text x="423" y="302" class="mono" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">in-deg: 2 (raw)</text>
  </g>
  <g class="indeg-1">
    <rect x="369" y="289" width="108" height="18" rx="4" fill="#ecfdf5" stroke="#059669"/>
    <text x="423" y="302" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">in-deg: 1 (TR)</text>
  </g>

  <!-- DP & Reachability Matrix Box -->
  <rect x="42" y="338" width="484" height="200" rx="8" fill="#f5f3ff" class="dp-box"/>
  <text x="58" y="362" class="sans" font-size="12.5" font-weight="700" fill="#4c1d95">Phase 1 &amp; 2 State: Reachable[i][j] &amp; Longest Path Dist[i][j]</text>
  <line x1="58" y1="372" x2="510" y2="372" stroke="#ddd6fe" stroke-width="1.2"/>

  <text x="58" y="394" class="mono" font-size="10.5" fill="#334155">Init Edges: Dist[A][B]=1 · Dist[B][C]=1 · Dist[A][D]=1 · Dist[A][C]=1</text>
  <text x="58" y="418" class="mono" font-size="10.5" font-weight="700" fill="#5b21b6">Phase 1 (k = B): Reachable[A][B] ∧ Reachable[B][C]</text>
  <text x="74" y="436" class="mono" font-size="10.5" fill="#1e3a8a">⇒ Dist[A][C] = max(1, Dist[A][B] + Dist[B][C]) = 2</text>
  <text x="58" y="462" class="mono" font-size="10.5" font-weight="700" fill="#9f1239">Phase 2 (edge A→C, m = B): ∃ path len ≥ 2 through B</text>
  <text x="74" y="480" class="mono" font-size="10.5" fill="#be123c">⇒ E_TR = E \ {(A, C)} · in-degree(C): 2 → 1</text>

  <rect x="58" y="496" width="452" height="30" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="284" y="515" class="mono" font-size="10.5" font-weight="700" fill="#4c1d95" text-anchor="middle">Invariant: G_TR⁺ = G⁺ (same reachability, minimal |E_TR| = 3)</text>

  <!-- RIGHT PANEL: STEP-BY-STEP EXECUTION TIMELINE -->
  <rect x="564" y="76" width="532" height="480" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="584" y="102" class="sans" font-size="14" font-weight="700" fill="#0f172a">Animated Execution Timeline (12s Loop)</text>

  <!-- Step 1 -->
  <rect x="584" y="118" width="492" height="96" rx="8" fill="#f5f3ff" class="s1"/>
  <rect x="598" y="130" width="74" height="24" rx="5" fill="#7c3aed"/>
  <text x="635" y="146" class="mono" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Phase 1</text>
  <text x="684" y="146" class="sans" font-size="13" font-weight="700" fill="#4c1d95">1. Transitive Closure &amp; Longest Path DP</text>
  <text x="598" y="172" class="mono" font-size="10.5" fill="#334155">for k in V: if Reachable[i][k] ∧ Reachable[k][j]:</text>
  <text x="598" y="190" class="mono" font-size="10.5" fill="#5b21b6">Dist[A][C] updates 1 → 2 via intermediate vertex k = B</text>
  <text x="598" y="205" class="sans" font-size="10" fill="#6d28d9">O(|V|³) Floyd-Warshall DP tracks longest path length per pair.</text>

  <!-- Step 2 -->
  <rect x="584" y="226" width="492" height="96" rx="8" fill="#fff1f2" class="s2"/>
  <rect x="598" y="238" width="74" height="24" rx="5" fill="#e11d48"/>
  <text x="635" y="254" class="mono" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Phase 2</text>
  <text x="684" y="254" class="sans" font-size="13" font-weight="700" fill="#9f1239">2. Eliminate Redundant Edge (A → C)</text>
  <text x="598" y="280" class="mono" font-size="10.5" fill="#334155">Check (A,C): ∃ m = B ≠ A,C with Reachable[A][B] ∧ [B][C]</text>
  <text x="598" y="298" class="mono" font-size="10.5" fill="#be123c">Drop explicit depends_on edge (A→C) · in-deg(C): 2 → 1</text>
  <text x="598" y="313" class="sans" font-size="10" fill="#be123c">Removes duplicate queue wakeups and locks on C.</text>

  <!-- Step 3 -->
  <rect x="584" y="334" width="492" height="96" rx="8" fill="#eff6ff" class="s3"/>
  <rect x="598" y="346" width="74" height="24" rx="5" fill="#2563eb"/>
  <text x="635" y="362" class="mono" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Wave 1</text>
  <text x="684" y="362" class="sans" font-size="13" font-weight="700" fill="#1e3a8a">3. Initial Frontier (in-degree == 0)</text>
  <text x="598" y="388" class="mono" font-size="10.5" fill="#334155">Queue = [A: aws_vpc.main] · Worker 1 calls ApplyResource(A)</text>
  <text x="598" y="406" class="mono" font-size="10.5" fill="#1d4ed8">On complete: decrement in-deg(B): 1→0, in-deg(D): 1→0</text>
  <text x="598" y="421" class="sans" font-size="10" fill="#1e40af">Both B and D become runnable immediately at the same instant.</text>

  <!-- Step 4 -->
  <rect x="584" y="442" width="492" height="96" rx="8" fill="#ecfdf5" class="s4"/>
  <rect x="598" y="454" width="74" height="24" rx="5" fill="#059669"/>
  <text x="635" y="470" class="mono" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Wave 2-3</text>
  <text x="684" y="470" class="sans" font-size="13" font-weight="700" fill="#065f46">4. Parallel Walk (-parallelism=10) &amp; Converge</text>
  <text x="598" y="496" class="mono" font-size="10.5" fill="#334155">Wave 2: Worker 1 (B: subnet) ∥ Worker 2 (D: igw)</text>
  <text x="598" y="514" class="mono" font-size="10.5" fill="#047857">B completes ⇒ in-deg(C): 1→0 ⇒ Wave 3 runs C → DONE</text>
  <text x="598" y="529" class="sans" font-size="10" fill="#047857">Fixed-point converged: S_actual = S_desired with minimal DAG.</text>
</svg>
