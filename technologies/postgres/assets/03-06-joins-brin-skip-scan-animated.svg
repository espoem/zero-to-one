<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">PostgreSQL Execution and Storage: Physical Joins, BRIN Pruning, and PG 18 B-Tree Skip Scan</title>
  <desc id="desc">Animated step-by-step visualization of PostgreSQL physical join execution (Nested Loop, Grace Hash Join with work_mem batch spill, and Sort-Merge Join), BRIN 128-page min/max block-range pruning, and PostgreSQL 18 B-Tree Skip Scan hopping across low-cardinality leading index prefixes.</desc>
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
    <marker id="arr-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <style><![CDATA[
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

      /* 12s 4-phase loop */
      @keyframes ph1 { 0%, 23% { opacity: 1; } 25%, 100% { opacity: 0; } }
      @keyframes ph2 { 0%, 23% { opacity: 0; } 25%, 48% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes ph3 { 0%, 48% { opacity: 0; } 50%, 73% { opacity: 1; } 75%, 100% { opacity: 0; } }
      @keyframes ph4 { 0%, 73% { opacity: 0; } 75%, 100% { opacity: 1; } }

      @keyframes spill-alert {
        0%, 23%   { fill: #f0fdf9; stroke: #0f766e; }
        25%, 73%  { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
        75%, 100% { fill: #f0fdf9; stroke: #0f766e; stroke-width: 2; }
      }
      @keyframes skip-hop {
        0%, 23%   { transform: translateX(0px); }
        25%, 48%  { transform: translateX(176px); }
        50%, 100% { transform: translateX(352px); }
      }
      @keyframes brin-prune {
        0%, 23%   { opacity: 0.86; }
        25%, 100% { opacity: 1; }
      }

      .p-1 { animation: ph1 12s linear infinite; }
      .p-2 { animation: ph2 12s linear infinite; }
      .p-3 { animation: ph3 12s linear infinite; }
      .p-4 { animation: ph4 12s linear infinite; }
      .hj-mem { animation: spill-alert 12s linear infinite; }
      .bt-cur { animation: skip-hop 12s ease-in-out infinite; }
      .brin-x { animation: brin-prune 12s linear infinite; }

      @media (prefers-reduced-motion: reduce) {
        .p-1, .p-2, .p-3, .p-4, .hj-mem, .bt-cur, .brin-x { animation: none !important; }
        .p-1, .p-2, .p-3 { opacity: 0; }
        .p-4 { opacity: 1; }
        .hj-mem { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
        .bt-cur { transform: translateX(352px); }
        .brin-x { opacity: 1; }
      }
    ]]></style>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1200" height="760" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>

  <!-- Header -->
  <line x1="24" y1="64" x2="1176" y2="64" stroke="#1c1917" stroke-width="1.2"/>
  
  <text x="24" y="28" class="sans" font-size="18" font-weight="700" fill="#1c1917" font-family="Georgia, 'Times New Roman', serif">PostgreSQL Execution &amp; Storage: Physical Joins, BRIN Pruning &amp; PG 18 Skip Scan</text>
  <text x="24" y="49" class="sans" font-size="12" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">Nested Loop vs Grace Hash Join (work_mem Batch Spill) vs Sort-Merge + 128-Page BRIN Min/Max &amp; B-Tree Prefix Hops</text>

  <!-- TOP FULL-WIDTH PANEL: Three Physical Join Algorithms -->
  <rect x="24" y="78" width="1152" height="290" rx="10" fill="#ffffff" stroke="#d6d0c4"/>
  <rect x="24" y="78" width="1152" height="36" rx="10" fill="#f5f1e8"/>
  <rect x="24" y="104" width="1152" height="10" fill="#f5f1e8"/>
  <text x="40" y="101" class="sans" font-size="13.5" font-weight="700" fill="#1c1917">1. Physical SQL Join Algorithms (PostgreSQL Optimizer Selection)</text>
  <text x="1160" y="101" class="mono" font-size="11" fill="#0f766e" text-anchor="end">Nested Loop | Hash | Merge</text>

  <!-- Card 1A: Nested Loop -->
  <rect x="40" y="128" width="356" height="222" rx="8" fill="#faf8f5" stroke="#d6d0c4"/>
  <rect x="40" y="128" width="356" height="30" rx="8" fill="#f0fdf9"/>
  <rect x="40" y="148" width="356" height="10" fill="#f0fdf9"/>
  <text x="54" y="148" class="sans" font-size="12" font-weight="700" fill="#065f46">A. Nested Loop Join</text>
  <text x="382" y="148" class="mono" font-size="10.5" fill="#0f766e" text-anchor="end">O(N log M) · O(1) mem</text>

  <rect x="56" y="172" width="120" height="58" rx="6" fill="#ffffff" stroke="#0f766e"/>
  <text x="116" y="194" class="mono" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">Outer (Small)</text>
  <text x="116" y="214" class="mono" font-size="10.5" fill="#44403c" text-anchor="middle">row r_i -&gt; probe</text>

  <line x1="176" y1="201" x2="212" y2="201" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="220" y="172" width="160" height="58" rx="6" fill="#f0fdf9" stroke="#0f766e"/>
  <text x="300" y="194" class="mono" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">Inner B-Tree Index</text>
  <text x="300" y="214" class="mono" font-size="10.5" fill="#065f46" text-anchor="middle">Index Scan / key=r_i</text>

  <text x="56" y="258" class="sans" font-size="11" fill="#44403c">- Best when outer filter is tiny &amp; inner is indexed.</text>
  <text x="56" y="278" class="sans" font-size="11" fill="#44403c">- Supports non-equijoins (&lt;, &gt;, BETWEEN, LATERAL).</text>
  <text x="56" y="298" class="mono" font-size="10.5" fill="#0f766e">- Streaming output; NEVER spills to disk temp files.</text>
  <text x="56" y="324" class="mono" font-size="10" fill="#57534e">Risk: terrible if bad stats pick NL on huge outer!</text>

  <!-- Card 1B: Grace Hash Join -->
  <rect x="416" y="128" width="372" height="222" rx="8" fill="#faf8f5" stroke="#d6d0c4"/>
  <rect x="416" y="128" width="372" height="30" rx="8" fill="#fffbeb"/>
  <rect x="416" y="148" width="372" height="10" fill="#fffbeb"/>
  <text x="430" y="148" class="sans" font-size="12" font-weight="700" fill="#92400e">B. Grace Hash Join (work_mem Spill)</text>
  <text x="774" y="148" class="mono" font-size="10.5" fill="#b45309" text-anchor="end">O(N + M) · work_mem</text>

  <rect x="432" y="172" width="160" height="58" rx="6" class="hj-mem"/>
  <text x="512" y="193" class="mono" font-size="11" font-weight="700" fill="#1c1917" text-anchor="middle">Hash Table (Batch 0)</text>
  <text x="512" y="213" class="mono" font-size="10" fill="#44403c" text-anchor="middle">fits inside work_mem</text>

  <line x1="592" y1="201" x2="624" y2="201" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-amber)"/>

  <rect x="632" y="172" width="140" height="58" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="4 3"/>
  <text x="702" y="193" class="mono" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">Batch 1..B Spill</text>
  <text x="702" y="213" class="mono" font-size="10" fill="#991b1b" text-anchor="middle">pgsql_tmp disk I/O</text>

  <text x="432" y="258" class="sans" font-size="11" fill="#44403c">- Phase 1 (Build): hashes smaller input into buckets.</text>
  <text x="432" y="278" class="sans" font-size="11" fill="#44403c">- Phase 2 (Probe): streams outer rows &amp; matches hash.</text>
  <text x="432" y="298" class="mono" font-size="10.5" fill="#991b1b">- Exceeding work_mem splits into multi-batch disk spill.</text>
  <text x="432" y="324" class="mono" font-size="10" fill="#57534e">EXPLAIN: "Batches: 4  Memory Usage: 4096kB"</text>

  <!-- Card 1C: Sort-Merge Join -->
  <rect x="808" y="128" width="352" height="222" rx="8" fill="#faf8f5" stroke="#d6d0c4"/>
  <rect x="808" y="128" width="352" height="30" rx="8" fill="#f5f1e8"/>
  <rect x="808" y="148" width="352" height="10" fill="#f5f1e8"/>
  <text x="822" y="148" class="sans" font-size="12" font-weight="700" fill="#065f46">C. Sort-Merge Join</text>
  <text x="1146" y="148" class="mono" font-size="10.5" fill="#0f766e" text-anchor="end">O(N + M) if pre-sorted</text>

  <rect x="824" y="172" width="142" height="26" rx="4" fill="#ffffff" stroke="#0f766e"/>
  <text x="895" y="189" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">Outer [1, 3, 4, 8]</text>
  <rect x="824" y="204" width="142" height="26" rx="4" fill="#ffffff" stroke="#0f766e"/>
  <text x="895" y="221" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">Inner [2, 3, 4, 9]</text>

  <line x1="966" y1="201" x2="998" y2="201" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-violet)"/>

  <rect x="1006" y="172" width="138" height="58" rx="6" fill="#f0fdf9" stroke="#0f766e"/>
  <text x="1075" y="194" class="mono" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">Zipper Match</text>
  <text x="1075" y="214" class="mono" font-size="10.5" fill="#065f46" text-anchor="middle">matches: (3, 4)</text>

  <text x="824" y="258" class="sans" font-size="11" fill="#44403c">- Ideal when B-Tree indexes already supply sort order.</text>
  <text x="824" y="278" class="sans" font-size="11" fill="#44403c">- Advances two pointers lockstep in O(N + M) I/O.</text>
  <text x="824" y="298" class="mono" font-size="10.5" fill="#0f766e">- Output is already sorted for ORDER BY / GROUP BY.</text>
  <text x="824" y="324" class="mono" font-size="10" fill="#57534e">Unindexed huge inputs spill external merge-sort runs.</text>

  <!-- BOTTOM-LEFT: BRIN Block-Range Min/Max Page Pruning -->
  <rect x="24" y="384" width="564" height="300" rx="10" fill="#ffffff" stroke="#d6d0c4"/>
  <rect x="24" y="384" width="564" height="36" rx="10" fill="#f5f1e8"/>
  <rect x="24" y="410" width="564" height="10" fill="#f5f1e8"/>
  <text x="40" y="407" class="sans" font-size="13.5" font-weight="700" fill="#1c1917">2. BRIN Block-Range Min/Max Page Pruning</text>
  <text x="572" y="407" class="mono" font-size="11" fill="#0f766e" text-anchor="end">15 MB vs 25 GB B-Tree</text>

  <text x="40" y="442" class="mono" font-size="11.5" font-weight="700" fill="#065f46">Query: SELECT * FROM audit_logs WHERE ts &gt;= '2026-10-22'</text>

  <!-- 3 Block Ranges (128 pages = 1MB each) -->
  <g transform="translate(40, 458)">
    <!-- Range 0 -->
    <rect x="0" y="0" width="166" height="92" rx="7" fill="#faf8f5" stroke="#d6d0c4"/>
    <text x="83" y="22" class="mono" font-size="11" font-weight="700" fill="#1c1917" text-anchor="middle">Range 0 (128 pgs)</text>
    <text x="83" y="42" class="mono" font-size="10.5" fill="#44403c" text-anchor="middle">min: 2026-10-01</text>
    <text x="83" y="58" class="mono" font-size="10.5" fill="#44403c" text-anchor="middle">max: 2026-10-10</text>
    <g class="brin-x">
      <rect x="14" y="66" width="138" height="20" rx="4" fill="#fef2f2" stroke="#dc2626"/>
      <text x="83" y="80" class="mono" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">PRUNED (max &lt; 22)</text>
    </g>

    <!-- Range 1 -->
    <rect x="182" y="0" width="166" height="92" rx="7" fill="#faf8f5" stroke="#d6d0c4"/>
    <text x="265" y="22" class="mono" font-size="11" font-weight="700" fill="#1c1917" text-anchor="middle">Range 1 (128 pgs)</text>
    <text x="265" y="42" class="mono" font-size="10.5" fill="#44403c" text-anchor="middle">min: 2026-10-11</text>
    <text x="265" y="58" class="mono" font-size="10.5" fill="#44403c" text-anchor="middle">max: 2026-10-20</text>
    <g class="brin-x">
      <rect x="196" y="66" width="138" height="20" rx="4" fill="#fef2f2" stroke="#dc2626"/>
      <text x="265" y="80" class="mono" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">PRUNED (max &lt; 22)</text>
    </g>

    <!-- Range 2 -->
    <rect x="364" y="0" width="166" height="92" rx="7" fill="#f0fdf9" stroke="#0f766e" stroke-width="2"/>
    <text x="447" y="22" class="mono" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">Range 2 (128 pgs)</text>
    <text x="447" y="42" class="mono" font-size="10.5" fill="#065f46" text-anchor="middle">min: 2026-10-21</text>
    <text x="447" y="58" class="mono" font-size="10.5" fill="#065f46" text-anchor="middle">max: 2026-10-30</text>
    <rect x="378" y="66" width="138" height="20" rx="4" fill="#0f766e"/>
    <text x="447" y="80" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">BITMAP HEAP SCAN</text>
  </g>

  <rect x="40" y="566" width="532" height="102" rx="8" fill="#faf8f5" stroke="#d6d0c4"/>
  <text x="54" y="588" class="sans" font-size="11.5" font-weight="700" fill="#1c1917">BRIN Physical Mechanics (Lossy Summary):</text>
  <text x="54" y="608" class="sans" font-size="11" fill="#44403c">- Stores only (min, max) per 128-page (1 MB) physical heap range (&lt;1% table size).</text>
  <text x="54" y="628" class="sans" font-size="11" fill="#44403c">- Fits inside CPU L3 cache on 100 GB append-only time-series tables.</text>
  <text x="54" y="648" class="mono" font-size="10.5" fill="#dc2626">- Warning: random UPDATES scatter values across ranges, destroying pruning.</text>

  <!-- BOTTOM-RIGHT: PostgreSQL 18 B-Tree Skip Scan -->
  <rect x="612" y="384" width="564" height="300" rx="10" fill="#ffffff" stroke="#d6d0c4"/>
  <rect x="612" y="384" width="564" height="36" rx="10" fill="#f5f1e8"/>
  <rect x="612" y="410" width="564" height="10" fill="#f5f1e8"/>
  <text x="628" y="407" class="sans" font-size="13.5" font-weight="700" fill="#1c1917">3. PostgreSQL 18 B-Tree Skip Scan Prefix Jumps</text>
  <text x="1160" y="407" class="mono" font-size="11" fill="#0f766e" text-anchor="end">(status, created_at)</text>

  <text x="628" y="442" class="mono" font-size="11" font-weight="700" fill="#065f46">Query omits leading `status`: WHERE created_at &gt; '2026-10-01'</text>

  <!-- 3 Low-Cardinality Prefix Partitions in Composite B-Tree -->
  <g transform="translate(628, 458)">
    <!-- Prefix 1: done -->
    <rect x="0" y="0" width="164" height="92" rx="7" fill="#f0fdf9" stroke="#0f766e"/>
    <text x="82" y="22" class="mono" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">status = 'done'</text>
    <text x="82" y="42" class="mono" font-size="10.5" fill="#065f46" text-anchor="middle">1. Seek prefix 'done'</text>
    <text x="82" y="60" class="mono" font-size="10.5" fill="#0f766e" text-anchor="middle">2. Probe ts &gt; Oct-01</text>
    <text x="82" y="78" class="mono" font-size="10" fill="#0f766e" text-anchor="middle">O(log N) range</text>

    <!-- Jump arrow 1 -> 2 -->
    <path d="M 164 26 Q 170 8 176 26" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-violet)"/>

    <!-- Prefix 2: pending -->
    <rect x="176" y="0" width="164" height="92" rx="7" fill="#f0fdf9" stroke="#0f766e"/>
    <text x="258" y="22" class="mono" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">status = 'pending'</text>
    <text x="258" y="42" class="mono" font-size="10.5" fill="#065f46" text-anchor="middle">3. Skip to 'pending'</text>
    <text x="258" y="60" class="mono" font-size="10.5" fill="#0f766e" text-anchor="middle">4. Probe ts &gt; Oct-01</text>
    <text x="258" y="78" class="mono" font-size="10" fill="#0f766e" text-anchor="middle">O(log N) range</text>

    <!-- Jump arrow 2 -> 3 -->
    <path d="M 340 26 Q 346 8 352 26" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-violet)"/>

    <!-- Prefix 3: running -->
    <rect x="352" y="0" width="164" height="92" rx="7" fill="#f0fdf9" stroke="#0f766e"/>
    <text x="434" y="22" class="mono" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">status = 'running'</text>
    <text x="434" y="42" class="mono" font-size="10.5" fill="#065f46" text-anchor="middle">5. Skip to 'running'</text>
    <text x="434" y="60" class="mono" font-size="10.5" fill="#0f766e" text-anchor="middle">6. Probe ts &gt; Oct-01</text>
    <text x="434" y="78" class="mono" font-size="10" fill="#0f766e" text-anchor="middle">O(log N) range</text>

    <!-- Animated Skip Scan Cursor -->
    <g class="bt-cur">
      <rect x="-3" y="-3" width="170" height="98" rx="9" fill="none" stroke="#0f766e" stroke-width="3"/>
    </g>
  </g>

  <rect x="628" y="566" width="532" height="102" rx="8" fill="#faf8f5" stroke="#d6d0c4"/>
  <text x="642" y="588" class="sans" font-size="11.5" font-weight="700" fill="#1c1917">Then (PG &lt;= 17) vs Now (PostgreSQL 18):</text>
  <text x="642" y="608" class="sans" font-size="11" fill="#44403c">- PG &lt;= 17: omitting leading `status` forced an O(N) Seq Scan or extra index.</text>
  <text x="642" y="628" class="sans" font-size="11" fill="#065f46">- PG 18: planner hops distinct leading prefixes via O(k log N) B-Tree seeks.</text>
  <text x="642" y="648" class="mono" font-size="10.5" fill="#065f46">- Best when leading column has low NDV (enums, booleans, tenant_id).</text>

  <!-- Footer Legend -->
  <rect x="24" y="698" width="1152" height="46" rx="8" fill="#ffffff" stroke="#d6d0c4"/>
  <rect x="40" y="713" width="14" height="14" rx="3" fill="#f0fdf9" stroke="#0f766e"/>
  <text x="60" y="724" class="sans" font-size="11.5" fill="#44403c">Nested Loop / Skip Prefix</text>
  <rect x="236" y="713" width="14" height="14" rx="3" fill="#fef2f2" stroke="#dc2626"/>
  <text x="256" y="724" class="sans" font-size="11.5" fill="#44403c">Batch Spill / BRIN Pruned</text>
  <rect x="442" y="713" width="14" height="14" rx="3" fill="#f0fdf9" stroke="#0f766e"/>
  <text x="462" y="724" class="sans" font-size="11.5" fill="#44403c">Matched / Scanned Range</text>
  <rect x="650" y="713" width="14" height="14" rx="3" fill="#f5f1e8" stroke="#0f766e"/>
  <text x="670" y="724" class="sans" font-size="11.5" fill="#44403c">Merge Join / Skip Hop</text>
  <text x="1160" y="724" class="mono" font-size="11" font-weight="700" fill="#1c1917" text-anchor="end">PostgreSQL 18 Execution &amp; Access</text>
</svg>
