<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Redis Memory and Keyspace Algorithms: EVPOOL LRU, Morris LFU, and Reverse-Binary SCAN</title>
  <desc id="desc">Animated step-by-step visualization of three Redis core algorithms: 16-slot Approximated LRU eviction pool sampling, 8-bit Morris probabilistic LFU counter with logarithmic increment and lazy minute decay, and resize-safe reverse-binary SCAN cursor traversal (0, 4, 2, 6, 1, 5, 3, 7).</desc>
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arr-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <style><![CDATA[
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

      /* 12s 4-phase loop */
      @keyframes ph1 { 0%, 23% { opacity: 1; } 25%, 100% { opacity: 0; } }
      @keyframes ph2 { 0%, 23% { opacity: 0; } 25%, 48% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes ph3 { 0%, 48% { opacity: 0; } 50%, 73% { opacity: 1; } 75%, 100% { opacity: 0; } }
      @keyframes ph4 { 0%, 73% { opacity: 0; } 75%, 100% { opacity: 1; } }

      /* Top-Left: EVPOOL insert + victim flash */
      @keyframes ev-sample-hl {
        0%, 23%   { stroke: #2563eb; stroke-width: 2.5; }
        25%, 48%  { stroke: #d97706; stroke-width: 2.5; }
        50%, 100% { stroke: #94a3b8; stroke-width: 1.5; }
      }
      @keyframes ev-victim-hl {
        0%, 48%   { fill: #f8fafc; stroke: #94a3b8; }
        50%, 100% { fill: #fff1f2; stroke: #e11d48; stroke-width: 2.5; }
      }

      /* Top-Right: LFU counter growth bar */
      @keyframes lfu-bar {
        0%, 23%   { width: 22px; fill: #2563eb; }   /* c = 5 init */
        25%, 48%  { width: 88px; fill: #059669; }   /* c = 18 (1k hits) */
        50%, 73%  { width: 320px; fill: #7c3aed; }  /* c = 142 (100k hits) */
        75%, 100% { width: 240px; fill: #d97706; }  /* decayed after idle */
      }

      /* Bottom: Reverse-binary SCAN cursor jumping 0 -> 4 -> 2 -> 6 -> 1 -> 5 -> 3 -> 7 */
      @keyframes scan-cur {
        0%, 11%   { transform: translateX(0px); }
        13%, 23%  { transform: translateX(132px); }
        25%, 36%  { transform: translateX(264px); }
        38%, 48%  { transform: translateX(396px); }
        50%, 61%  { transform: translateX(528px); }
        63%, 73%  { transform: translateX(660px); }
        75%, 86%  { transform: translateX(792px); }
        88%, 100% { transform: translateX(924px); }
      }

      .p-1 { animation: ph1 12s linear infinite; }
      .p-2 { animation: ph2 12s linear infinite; }
      .p-3 { animation: ph3 12s linear infinite; }
      .p-4 { animation: ph4 12s linear infinite; }
      .ev-vic { animation: ev-victim-hl 12s linear infinite; }
      .lfu-prog { animation: lfu-bar 12s ease-in-out infinite; }
      .scan-box { animation: scan-cur 12s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .p-1, .p-2, .p-3, .p-4, .ev-vic, .lfu-prog, .scan-box { animation: none !important; }
        .p-1, .p-2, .p-3 { opacity: 0; }
        .p-4 { opacity: 1; }
        .ev-vic { fill: #fff1f2; stroke: #e11d48; stroke-width: 2.5; }
        .lfu-prog { width: 240px; fill: #d97706; }
        .scan-box { transform: translateX(396px); }
      }
    ]]></style>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1200" height="760" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="1200" height="62" rx="12" fill="#0f172a"/>
  <rect x="0" y="46" width="1200" height="16" fill="#0f172a"/>
  <text x="24" y="28" class="sans" font-size="18" font-weight="700" fill="#f8fafc">Redis Memory &amp; Keyspace Algorithms: EVPOOL LRU, Morris LFU &amp; Reverse-Binary SCAN</text>
  <text x="24" y="49" class="sans" font-size="12" fill="#94a3b8">16-Slot Eviction Pool Sampling + 8-Bit Probabilistic LFU Counter (LFU_INIT=5, Lazy Decay) + Resize-Safe Bit-Reversed Cursor</text>

  <!-- TOP-LEFT PANEL: Approximated LRU EVPOOL -->
  <rect x="24" y="78" width="564" height="334" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="24" y="78" width="564" height="36" rx="10" fill="#f1f5f9"/>
  <rect x="24" y="104" width="564" height="10" fill="#f1f5f9"/>
  <text x="40" y="101" class="sans" font-size="13.5" font-weight="700" fill="#0f172a">1. Approximated LRU: Sampling + 16-Slot EVPOOL</text>
  <text x="572" y="101" class="mono" font-size="11" fill="#2563eb" text-anchor="end">maxmemory-samples 5</text>

  <!-- Sampled Keys Box -->
  <rect x="40" y="128" width="236" height="118" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="54" y="148" class="sans" font-size="11.5" font-weight="700" fill="#1d4ed8">Random Dict Sample (5 keys)</text>
  <text x="54" y="168" class="mono" font-size="11" fill="#1e3a8a">k19: idle = 42s   k04: idle = 910s</text>
  <text x="54" y="186" class="mono" font-size="11" fill="#1e3a8a">k88: idle = 12s   k51: idle = 305s</text>
  <text x="54" y="204" class="mono" font-size="11" fill="#1e3a8a">k72: idle = 640s</text>
  <text x="54" y="230" class="mono" font-size="10" fill="#2563eb">idle = (now - robj.lru) mod 2^24</text>

  <line x1="276" y1="186" x2="306" y2="186" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Persistent EVPOOL Sorted Array -->
  <rect x="312" y="128" width="260" height="180" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="326" y="148" class="sans" font-size="11.5" font-weight="700" fill="#0f172a">Persistent EVPOOL (cap = 16, sorted)</text>

  <rect x="326" y="160" width="232" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="336" y="178" class="mono" font-size="10.5" fill="#475569">[0..12]: k51(305s) ... k72(640s)</text>

  <rect x="326" y="194" width="232" height="28" rx="4" fill="#fffbeb" stroke="#d97706"/>
  <text x="336" y="212" class="mono" font-size="10.5" font-weight="700" fill="#92400e">[13]: k04 (idle=910s) &lt;- inserted</text>

  <rect x="326" y="228" width="232" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="336" y="246" class="mono" font-size="10.5" fill="#475569">[14]: k33 (idle=1120s)</text>

  <rect x="326" y="262" width="232" height="32" rx="4" class="ev-vic"/>
  <text x="336" y="282" class="mono" font-size="10.5" font-weight="700" fill="#be123c">[15]: k09 (idle=1840s) -&gt; EVICT!</text>

  <!-- EVPOOL notes -->
  <rect x="40" y="320" width="532" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="54" y="340" class="sans" font-size="11" font-weight="700" fill="#0f172a">Why the Pool Matters (Redis 3.0+):</text>
  <text x="54" y="358" class="sans" font-size="11" fill="#334155">Good candidates persist across eviction calls, so each victim beats a 5-key sample.</text>
  <text x="54" y="376" class="mono" font-size="10.5" fill="#475569">Ghost candidates (deleted/expired) are skipped; time bounded by tenacity (500us).</text>

  <!-- TOP-RIGHT PANEL: 8-Bit Morris Probabilistic LFU -->
  <rect x="612" y="78" width="564" height="334" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="612" y="78" width="564" height="36" rx="10" fill="#f1f5f9"/>
  <rect x="612" y="104" width="564" height="10" fill="#f1f5f9"/>
  <text x="628" y="101" class="sans" font-size="13.5" font-weight="700" fill="#0f172a">2. 8-Bit Morris LFU Counter (LFU-LOG-INCR / DECAY)</text>
  <text x="1160" y="101" class="mono" font-size="11" fill="#7c3aed" text-anchor="end">factor=10 · decay=1m</text>

  <!-- 24-bit robj.lru bit layout -->
  <text x="628" y="138" class="sans" font-size="11.5" font-weight="700" fill="#475569">24-Bit robj.lru Field Repurposed Under LFU Policies:</text>
  <rect x="628" y="148" width="356" height="36" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="806" y="170" class="mono" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">16-bit ldt (Last Decrement Time, mins)</text>
  <rect x="988" y="148" width="172" height="36" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1074" y="170" class="mono" font-size="11.5" font-weight="700" fill="#5b21b6" text-anchor="middle">8-bit counter [0..255]</text>

  <!-- Morris Counter Growth Bar -->
  <text x="628" y="210" class="mono" font-size="11" font-weight="700" fill="#334155">p = 1 / ((c - 5) * factor + 1)  |  c_new = max(0, c - floor(idle_min / decay))</text>
  <rect x="628" y="222" width="532" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="630" y="224" height="30" rx="5" class="lfu-prog"/>
  <text x="640" y="243" class="mono p-1" font-size="11" font-weight="700" fill="#ffffff">c = 5</text>
  <text x="640" y="243" class="mono p-2" font-size="11" font-weight="700" fill="#ffffff">c = 18 (~1k hits)</text>
  <text x="640" y="243" class="mono p-3" font-size="11" font-weight="700" fill="#ffffff">c = 142 (~100k hits, saturates 255)</text>
  <text x="640" y="243" class="mono p-4" font-size="11" font-weight="700" fill="#ffffff">Lazy Decay: 142 - 42 min = 100</text>

  <!-- Morris Step Explanation -->
  <rect x="628" y="272" width="532" height="124" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <g class="p-1">
    <text x="642" y="296" class="mono" font-size="12" font-weight="700" fill="#1d4ed8">Step 1: New Key Initialised at LFU_INIT_VAL = 5</text>
    <text x="642" y="318" class="sans" font-size="11.5" fill="#334155">Starting at 5 protects newly inserted keys from immediate eviction.</text>
    <text x="642" y="338" class="sans" font-size="11.5" fill="#475569">At c = 5, p = 1 / (0 * 10 + 1) = 1.0 (first extra hit increments reliably).</text>
    <text x="642" y="362" class="mono" font-size="10.5" fill="#7c3aed">Closed form: E[hits to reach c] = f*(c-5)*(c-6)/2 + (c-5).</text>
  </g>
  <g class="p-2">
    <text x="642" y="296" class="mono" font-size="12" font-weight="700" fill="#065f46">Step 2: 1,000 Hits -&gt; Counter Reaches ~18</text>
    <text x="642" y="318" class="sans" font-size="11.5" fill="#334155">At c = 18, base = 13, p = 1 / (13 * 10 + 1) = 0.0076 (~1 in 131 hits).</text>
    <text x="642" y="338" class="sans" font-size="11.5" fill="#475569">A single full-keyspace scan adds at most +1, unlike LRU pollution.</text>
    <text x="642" y="362" class="mono" font-size="10.5" fill="#059669">Scan-resistant: hot items keep rank over one-off sequential reads.</text>
  </g>
  <g class="p-3">
    <text x="642" y="296" class="mono" font-size="12" font-weight="700" fill="#5b21b6">Step 3: 100,000 Hits -&gt; ~142 (255 Saturation ~311k)</text>
    <text x="642" y="318" class="sans" font-size="11.5" fill="#334155">8 bits encode orders-of-magnitude access frequency up to 255.</text>
    <text x="642" y="338" class="sans" font-size="11.5" fill="#475569">Higher lfu-log-factor preserves resolution above 100k hits.</text>
    <text x="642" y="362" class="mono" font-size="10.5" fill="#7c3aed">lfu-log-factor 0 sets p=1 (deterministic c = 5 + hits until 255).</text>
  </g>
  <g class="p-4">
    <text x="642" y="296" class="mono" font-size="12" font-weight="700" fill="#92400e">Step 4: Lazy Minute Decay on Access or Sample</text>
    <text x="642" y="318" class="sans" font-size="11.5" fill="#334155">When sampled by evictor or read, LFUDecrAndReturn subtracts idle minutes.</text>
    <text x="642" y="338" class="sans" font-size="11.5" fill="#475569">Stored counter updates only on a real access; untouched keys decay lazily.</text>
    <text x="642" y="362" class="mono" font-size="10.5" fill="#d97706">Prevents yesterday's viral keys from pinning cache memory forever.</text>
  </g>

  <!-- BOTTOM FULL-WIDTH PANEL: Resize-Safe Reverse-Binary SCAN Cursor -->
  <rect x="24" y="428" width="1152" height="250" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="24" y="428" width="1152" height="36" rx="10" fill="#f1f5f9"/>
  <rect x="24" y="454" width="1152" height="10" fill="#f1f5f9"/>
  <text x="40" y="451" class="sans" font-size="13.5" font-weight="700" fill="#0f172a">3. Resize-Safe Reverse-Binary SCAN Cursor (0 -&gt; 4 -&gt; 2 -&gt; 6 -&gt; 1 -&gt; 5 -&gt; 3 -&gt; 7)</text>
  <text x="1160" y="451" class="mono" font-size="11" fill="#059669" text-anchor="end">v |= ~mask; v = rev(rev(v) + 1)</text>

  <!-- Sequence Row of 8 Reverse-Binary Steps -->
  <text x="44" y="488" class="sans" font-size="11.5" font-weight="700" fill="#475569">Traversal Order for 8-Bucket Table (2^3): High Bits Increment First, Low-Bit Siblings Stay Adjacent After 4 -&gt; 8 Resize!</text>

  <g transform="translate(44, 502)">
    <!-- 8 Bucket Cards in Reverse-Binary Visit Order -->
    <rect x="0" y="0" width="124" height="68" rx="7" fill="#eff6ff" stroke="#2563eb"/>
    <text x="62" y="24" class="mono" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">cursor = 0</text>
    <text x="62" y="44" class="mono" font-size="11" fill="#1e3a8a" text-anchor="middle">bin: 000</text>
    <text x="62" y="60" class="mono" font-size="10" fill="#3b82f6" text-anchor="middle">from old 00</text>

    <rect x="132" y="0" width="124" height="68" rx="7" fill="#eff6ff" stroke="#2563eb"/>
    <text x="194" y="24" class="mono" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">cursor = 4</text>
    <text x="194" y="44" class="mono" font-size="11" fill="#1e3a8a" text-anchor="middle">bin: 100</text>
    <text x="194" y="60" class="mono" font-size="10" fill="#3b82f6" text-anchor="middle">from old 00</text>

    <rect x="264" y="0" width="124" height="68" rx="7" fill="#ecfdf5" stroke="#059669"/>
    <text x="326" y="24" class="mono" font-size="14" font-weight="700" fill="#065f46" text-anchor="middle">cursor = 2</text>
    <text x="326" y="44" class="mono" font-size="11" fill="#047857" text-anchor="middle">bin: 010</text>
    <text x="326" y="60" class="mono" font-size="10" fill="#059669" text-anchor="middle">from old 10</text>

    <rect x="396" y="0" width="124" height="68" rx="7" fill="#ecfdf5" stroke="#059669"/>
    <text x="458" y="24" class="mono" font-size="14" font-weight="700" fill="#065f46" text-anchor="middle">cursor = 6</text>
    <text x="458" y="44" class="mono" font-size="11" fill="#047857" text-anchor="middle">bin: 110</text>
    <text x="458" y="60" class="mono" font-size="10" fill="#059669" text-anchor="middle">from old 10</text>

    <rect x="528" y="0" width="124" height="68" rx="7" fill="#fffbeb" stroke="#d97706"/>
    <text x="590" y="24" class="mono" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">cursor = 1</text>
    <text x="590" y="44" class="mono" font-size="11" fill="#b45309" text-anchor="middle">bin: 001</text>
    <text x="590" y="60" class="mono" font-size="10" fill="#d97706" text-anchor="middle">from old 01</text>

    <rect x="660" y="0" width="124" height="68" rx="7" fill="#fffbeb" stroke="#d97706"/>
    <text x="722" y="24" class="mono" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">cursor = 5</text>
    <text x="722" y="44" class="mono" font-size="11" fill="#b45309" text-anchor="middle">bin: 101</text>
    <text x="722" y="60" class="mono" font-size="10" fill="#d97706" text-anchor="middle">from old 01</text>

    <rect x="792" y="0" width="124" height="68" rx="7" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="854" y="24" class="mono" font-size="14" font-weight="700" fill="#5b21b6" text-anchor="middle">cursor = 3</text>
    <text x="854" y="44" class="mono" font-size="11" fill="#6d28d9" text-anchor="middle">bin: 011</text>
    <text x="854" y="60" class="mono" font-size="10" fill="#7c3aed" text-anchor="middle">from old 11</text>

    <rect x="924" y="0" width="124" height="68" rx="7" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="986" y="24" class="mono" font-size="14" font-weight="700" fill="#5b21b6" text-anchor="middle">cursor = 7</text>
    <text x="986" y="44" class="mono" font-size="11" fill="#6d28d9" text-anchor="middle">bin: 111</text>
    <text x="986" y="60" class="mono" font-size="10" fill="#7c3aed" text-anchor="middle">done -&gt; 0</text>

    <!-- Animated cursor outline -->
    <g class="scan-box">
      <rect x="-3" y="-3" width="130" height="74" rx="9" fill="none" stroke="#0f172a" stroke-width="3"/>
    </g>
  </g>

  <!-- Resize Invariant Box -->
  <rect x="44" y="586" width="1112" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="58" y="608" class="sans" font-size="11.5" font-weight="700" fill="#0f172a">Resize Guarantee (4 -&gt; 8 Grow &amp; 8 -&gt; 4 Shrink):</text>
  <text x="58" y="628" class="sans" font-size="11.5" fill="#334155">1. When a 4-bucket table grows to 8, old bucket `00` splits into `000` (0) and `100` (4), which are visited back-to-back before `010` (2).</text>
  <text x="58" y="648" class="sans" font-size="11.5" fill="#334155">2. Continuing from cursor `2` (010) after doubling never misses unvisited keys (zero omissions) and on shrink revisits one small bucket (at-least-once semantics).</text>

  <!-- Footer Legend -->
  <rect x="24" y="694" width="1152" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="40" y="709" width="14" height="14" rx="3" fill="#fff1f2" stroke="#e11d48"/>
  <text x="60" y="720" class="sans" font-size="11.5" fill="#334155">Evicted Victim</text>
  <rect x="172" y="709" width="14" height="14" rx="3" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="192" y="720" class="sans" font-size="11.5" fill="#334155">Morris 8-Bit Counter</text>
  <rect x="342" y="709" width="14" height="14" rx="3" fill="#eff6ff" stroke="#2563eb"/>
  <text x="362" y="720" class="sans" font-size="11.5" fill="#334155">Sampled / Split Sub-Tree</text>
  <rect x="530" y="709" width="14" height="14" rx="3" fill="#fffbeb" stroke="#d97706"/>
  <text x="550" y="720" class="sans" font-size="11.5" fill="#334155">Lazy Decay / Pending Sibling</text>
  <text x="1160" y="720" class="mono" font-size="11" font-weight="700" fill="#0f172a" text-anchor="end">O(1) per SCAN call · At-Least-Once</text>
</svg>
