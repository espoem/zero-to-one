<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540" role="img" aria-labelledby="title desc">
  <title id="title">React 31-Bit Lanes Priority Scheduler</title>
  <desc id="desc">Animated trace of React 31-bit Lanes scheduler executing a TransitionLane across 5ms slices, preempting when SyncLane (bit 1) arrives via getHighestPriorityLane(lanes &amp; -lanes), committing Sync input, and resuming Transition work.</desc>
  <defs>
    <style><![CDATA[
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

      @keyframes ph1 { 0%, 23% { opacity: 1; } 25%, 100% { opacity: 0; } }
      @keyframes ph2 { 0%, 23% { opacity: 0; } 25%, 48% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes ph3 { 0%, 48% { opacity: 0; } 50%, 73% { opacity: 1; } 75%, 100% { opacity: 0; } }
      @keyframes ph4 { 0%, 73% { opacity: 0; } 75%, 100% { opacity: 1; } }

      @keyframes hi-sync { 0%, 23% { opacity: 0.88; } 25%, 73% { opacity: 1; } 75%, 100% { opacity: 0.88; } }
      @keyframes hi-tran { 0%, 23% { opacity: 1; } 25%, 73% { opacity: 0.88; } 75%, 100% { opacity: 1; } }
      @keyframes hi-p2   { 0%, 23% { opacity: 0.88; } 25%, 48% { opacity: 1; } 50%, 100% { opacity: 0.92; } }
      @keyframes hi-p3   { 0%, 48% { opacity: 0.88; } 50%, 73% { opacity: 1; } 75%, 100% { opacity: 0.92; } }
      @keyframes hi-p4   { 0%, 73% { opacity: 0.88; } 75%, 100% { opacity: 1; } }
      @keyframes move-play {
        0%, 23%   { transform: translateX(124px); }
        25%, 48%  { transform: translateX(365px); }
        50%, 73%  { transform: translateX(552px); }
        75%, 100% { transform: translateX(759px); }
      }

      .p1 { animation: ph1 12s linear infinite; }
      .p2 { animation: ph2 12s linear infinite; }
      .p3 { animation: ph3 12s linear infinite; }
      .p4 { animation: ph4 12s linear infinite; }
      .b-sync { animation: hi-sync 12s linear infinite; }
      .b-tran { animation: hi-tran 12s linear infinite; }
      .tl-p2  { animation: hi-p2 12s linear infinite; }
      .tl-p3  { animation: hi-p3 12s linear infinite; }
      .tl-p4  { animation: hi-p4 12s linear infinite; }
      .playhead { animation: move-play 12s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .p1, .p2, .p3, .p4, .b-sync, .b-tran,
        .tl-p2, .tl-p3, .tl-p4, .playhead {
          animation: none !important;
        }
        .p1, .p2, .p3 { opacity: 0; }
        .p4, .b-sync, .b-tran, .tl-p2, .tl-p3, .tl-p4 { opacity: 1; }
        .playhead { transform: translateX(759px); }
      }
    ]]></style>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1080" height="540" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="1080" height="58" rx="12" fill="#0f172a"/>
  <rect x="0" y="42" width="1080" height="16" fill="#0f172a"/>
  <text x="28" y="27" class="sans" font-size="18" font-weight="700" fill="#f8fafc">React 31-Bit Lanes Priority Scheduler</text>
  <text x="28" y="47" class="sans" font-size="12" fill="#94a3b8">Preempting 5 ms Transition Render Slices for Urgent SyncLane Input via lanes &amp; -lanes</text>

  <!-- Top Card: 31-Bit Lane Bitmask -->
  <rect x="32" y="74" width="1016" height="118" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="48" y="96" class="sans" font-size="13" font-weight="700" fill="#334155">31-Bit Lane Bitmask (Lower Bit Index = Higher Priority)</text>
  <text x="1032" y="96" class="mono" font-size="12" font-weight="700" fill="#2563eb" text-anchor="end">getHighestPriorityLane(lanes &amp; -lanes)</text>

  <g transform="translate(48, 108)">
    <rect x="0" y="0" width="150" height="50" rx="7" fill="#f8fafc" stroke="#cbd5e1" opacity="0.9"/>
    <text x="75" y="21" class="mono" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Bit 0: SyncHydr</text>
    <text x="75" y="39" class="mono" font-size="11" fill="#64748b" text-anchor="middle">hydration</text>

    <g class="b-sync">
      <rect x="166" y="0" width="158" height="50" rx="7" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
      <text x="245" y="21" class="mono" font-size="12" font-weight="700" fill="#be123c" text-anchor="middle">Bit 1: SyncLane</text>
      <text x="245" y="39" class="mono" font-size="11" fill="#9f1239" text-anchor="middle">urgent keystroke</text>
    </g>

    <rect x="340" y="0" width="158" height="50" rx="7" fill="#fffbeb" stroke="#fcd34d" opacity="0.9"/>
    <text x="419" y="21" class="mono" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Bit 3: Continuous</text>
    <text x="419" y="39" class="mono" font-size="11" fill="#b45309" text-anchor="middle">scroll / drag</text>

    <rect x="514" y="0" width="150" height="50" rx="7" fill="#eff6ff" stroke="#93c5fd" opacity="0.9"/>
    <text x="589" y="21" class="mono" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">Bit 5: Default</text>
    <text x="589" y="39" class="mono" font-size="11" fill="#1e40af" text-anchor="middle">fetch / timer</text>

    <g class="b-tran">
      <rect x="680" y="0" width="170" height="50" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
      <text x="765" y="21" class="mono" font-size="12" font-weight="700" fill="#5b21b6" text-anchor="middle">Bit 6: Transition</text>
      <text x="765" y="39" class="mono" font-size="11" fill="#6d28d9" text-anchor="middle">5 ms sliceable</text>
    </g>

    <rect x="866" y="0" width="118" height="50" rx="7" fill="#f1f5f9" stroke="#cbd5e1" opacity="0.9"/>
    <text x="925" y="21" class="mono" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Bit 29: Off</text>
    <text x="925" y="39" class="mono" font-size="11" fill="#64748b" text-anchor="middle">&lt;Activity&gt;</text>
  </g>
  <text x="540" y="180" class="mono" font-size="11.5" fill="#334155" text-anchor="middle">pending = SyncLane (1&lt;&lt;1) | TransitionLane (1&lt;&lt;6)  -&gt;  lanes &amp; -lanes isolates bit 1</text>

  <!-- Middle Card: 5 ms Main-Thread Timeline -->
  <rect x="32" y="206" width="1016" height="148" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="48" y="228" class="sans" font-size="13" font-weight="700" fill="#334155">Main-Thread Cooperative Timeline (5 ms Scheduler Slices)</text>

  <!-- Axis -->
  <line x1="52" y1="246" x2="1028" y2="246" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="241" class="mono" font-size="11" fill="#64748b">0ms</text>
  <text x="206" y="241" class="mono" font-size="11" fill="#64748b">5ms</text>
  <text x="466" y="241" class="mono" font-size="11" fill="#64748b">9ms</text>
  <text x="652" y="241" class="mono" font-size="11" fill="#64748b">12ms</text>
  <text x="990" y="241" class="mono" font-size="11" fill="#64748b">22ms</text>

  <!-- Timeline Blocks (all resting >= 0.88) -->
  <rect x="52" y="258" width="144" height="52" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="124" y="280" class="mono" font-size="12" font-weight="700" fill="#5b21b6" text-anchor="middle">Trans Slice 1</text>
  <text x="124" y="298" class="mono" font-size="11" fill="#6d28d9" text-anchor="middle">WIP F1, F2 (5ms)</text>

  <rect x="206" y="258" width="60" height="52" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="236" y="288" class="mono" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">yield</text>

  <g class="tl-p2">
    <rect x="276" y="258" width="178" height="52" rx="7" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
    <text x="365" y="280" class="mono" font-size="12" font-weight="700" fill="#be123c" text-anchor="middle">SyncLane Preempt</text>
    <text x="365" y="298" class="mono" font-size="11" fill="#e11d48" text-anchor="middle">urgent keystroke</text>
  </g>

  <g class="tl-p3">
    <rect x="464" y="258" width="176" height="52" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="552" y="280" class="mono" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">Sync Commit</text>
    <text x="552" y="298" class="mono" font-size="11" fill="#047857" text-anchor="middle">DOM updated now</text>
  </g>

  <g class="tl-p4">
    <rect x="650" y="258" width="218" height="52" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="759" y="280" class="mono" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">Resume Transition</text>
    <text x="759" y="298" class="mono" font-size="11" fill="#1e40af" text-anchor="middle">fresh WIP on new current</text>

    <rect x="878" y="258" width="148" height="52" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="952" y="280" class="mono" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">Trans Commit</text>
    <text x="952" y="298" class="mono" font-size="11" fill="#047857" text-anchor="middle">root.current swap</text>
  </g>

  <!-- Playhead pointer on timeline axis -->
  <g class="playhead">
    <polygon points="-7,246 7,246 0,256" fill="#0f172a"/>
  </g>

  <text x="540" y="338" class="sans" font-size="12" fill="#475569" text-anchor="middle">Double buffering keeps the screen on current while abandoned WIP Transition work is cleanly discarded.</text>

  <!-- Step Trace Box -->
  <rect x="32" y="368" width="1016" height="98" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <g class="p1">
    <rect x="48" y="382" width="112" height="24" rx="5" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="104" y="398" class="mono" font-size="11.5" font-weight="700" fill="#5b21b6" text-anchor="middle">Phase 1 / 4</text>
    <text x="176" y="399" class="mono" font-size="14" font-weight="700" fill="#0f172a">TransitionLane (bit 6) runs in 5 ms cooperative slices</text>
    <text x="48" y="436" class="sans" font-size="13" fill="#334155">workLoopConcurrent renders F1, F2, hits shouldYield() at 5 ms, and returns a continuation.</text>
  </g>
  <g class="p2">
    <rect x="48" y="382" width="112" height="24" rx="5" fill="#fff1f2" stroke="#fda4af"/>
    <text x="104" y="398" class="mono" font-size="11.5" font-weight="700" fill="#be123c" text-anchor="middle">Phase 2 / 4</text>
    <text x="176" y="399" class="mono" font-size="14" font-weight="700" fill="#0f172a">Urgent keystroke sets SyncLane (bit 1) -&gt; lanes &amp; -lanes = bit 1</text>
    <text x="48" y="436" class="sans" font-size="13" fill="#334155">getHighestPriorityLane selects bit 1, canceling the Transition callback and preempting WIP.</text>
  </g>
  <g class="p3">
    <rect x="48" y="382" width="112" height="24" rx="5" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="104" y="398" class="mono" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">Phase 3 / 4</text>
    <text x="176" y="399" class="mono" font-size="14" font-weight="700" fill="#0f172a">prepareFreshStack discards WIP; SyncLane commits input</text>
    <text x="48" y="436" class="sans" font-size="13" fill="#334155">Only Sync updates render; commitRoot swaps root.current so keystrokes never lag.</text>
  </g>
  <g class="p4">
    <rect x="48" y="382" width="112" height="24" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="104" y="398" class="mono" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">Phase 4 / 4</text>
    <text x="176" y="399" class="mono" font-size="14" font-weight="700" fill="#0f172a">TransitionLane (bit 6) restarts &amp; commits on new current</text>
    <text x="48" y="436" class="sans" font-size="13" fill="#334155">Queued transition updates rebase onto the committed Sync state with zero tearing.</text>
  </g>

  <!-- Footer Legend -->
  <rect x="32" y="480" width="1016" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="48" y="495" width="14" height="14" rx="3" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="70" y="506" class="sans" font-size="12" fill="#334155">TransitionLane (bit 6)</text>
  <rect x="220" y="495" width="14" height="14" rx="3" fill="#fff1f2" stroke="#e11d48"/>
  <text x="242" y="506" class="sans" font-size="12" fill="#334155">SyncLane Preempt (bit 1)</text>
  <rect x="424" y="495" width="14" height="14" rx="3" fill="#ecfdf5" stroke="#059669"/>
  <text x="446" y="506" class="sans" font-size="12" fill="#334155">Atomic Commit</text>
  <rect x="566" y="495" width="14" height="14" rx="3" fill="#eff6ff" stroke="#2563eb"/>
  <text x="588" y="506" class="sans" font-size="12" fill="#334155">Resume / Restart</text>
  <text x="1032" y="506" class="mono" font-size="12" font-weight="700" fill="#0f172a" text-anchor="end">React 19.3.1 · Scheduler 0.28.0</text>
</svg>
