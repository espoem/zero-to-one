<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540" role="img" aria-labelledby="title desc">
  <title id="title">React Fiber Two-Pass Keyed Reconciliation</title>
  <desc id="desc">Animated trace of React reconcileChildrenArray transforming Old [A, B, C, D] into New [A, D, B, C] using Pass 1 prefix matching, Pass 2 existingChildren Map, and greedy lastPlacedIndex move detection.</desc>
  <defs>
    <style><![CDATA[
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

      @keyframes ph1 { 0%, 23% { opacity: 1; } 25%, 100% { opacity: 0; } }
      @keyframes ph2 { 0%, 23% { opacity: 0; } 25%, 48% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes ph3 { 0%, 48% { opacity: 0; } 50%, 73% { opacity: 1; } 75%, 100% { opacity: 0; } }
      @keyframes ph4 { 0%, 73% { opacity: 0; } 75%, 100% { opacity: 1; } }

      @keyframes scan-j {
        0%, 23%   { transform: translateX(0px); }
        25%, 48%  { transform: translateX(200px); }
        50%, 73%  { transform: translateX(400px); }
        75%, 100% { transform: translateX(600px); }
      }
      @keyframes lpi-slide {
        0%, 23%   { transform: translateX(0px); }
        25%, 100% { transform: translateX(600px); }
      }
      @keyframes show-p2 { 0%, 23% { opacity: 0; } 25%, 100% { opacity: 1; } }
      @keyframes show-p3 { 0%, 48% { opacity: 0; } 50%, 100% { opacity: 1; } }
      @keyframes show-p4 { 0%, 73% { opacity: 0; } 75%, 100% { opacity: 1; } }
      @keyframes dim-d   { 0%, 23% { opacity: 1; } 25%, 100% { opacity: 0.45; } }
      @keyframes dim-b   { 0%, 48% { opacity: 1; } 50%, 100% { opacity: 0.45; } }
      @keyframes dim-c   { 0%, 73% { opacity: 1; } 75%, 100% { opacity: 0.45; } }

      .p1 { animation: ph1 12s linear infinite; }
      .p2 { animation: ph2 12s linear infinite; }
      .p3 { animation: ph3 12s linear infinite; }
      .p4 { animation: ph4 12s linear infinite; }
      .cur-j { animation: scan-j 12s ease-in-out infinite; }
      .lpi-ptr { animation: lpi-slide 12s ease-in-out infinite; }
      .on-p2 { animation: show-p2 12s linear infinite; }
      .on-p3 { animation: show-p3 12s linear infinite; }
      .on-p4 { animation: show-p4 12s linear infinite; }
      .map-d { animation: dim-d 12s linear infinite; }
      .map-b { animation: dim-b 12s linear infinite; }
      .map-c { animation: dim-c 12s linear infinite; }

      @media (prefers-reduced-motion: reduce) {
        .p1, .p2, .p3, .p4, .cur-j, .lpi-ptr,
        .on-p2, .on-p3, .on-p4, .map-d, .map-b, .map-c {
          animation: none !important;
        }
        .p1, .p2, .p3 { opacity: 0; }
        .p4, .on-p2, .on-p3, .on-p4 { opacity: 1; }
        .cur-j { transform: translateX(600px); }
        .lpi-ptr { transform: translateX(600px); }
        .map-d, .map-b, .map-c { opacity: 0.55; }
      }
    ]]></style>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1080" height="540" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="1080" height="58" rx="12" fill="#0f172a"/>
  <rect x="0" y="42" width="1080" height="16" fill="#0f172a"/>
  <text x="28" y="27" class="sans" font-size="18" font-weight="700" fill="#f8fafc">React Fiber: Two-Pass Keyed Reconciliation</text>
  <text x="28" y="47" class="sans" font-size="12" fill="#94a3b8">reconcileChildrenArray: [A, B, C, D] -&gt; [A, D, B, C] (Greedy lastPlacedIndex, O(m + n))</text>

  <!-- Old Fibers Row -->
  <text x="32" y="88" class="sans" font-size="13" font-weight="700" fill="#334155">Current (Old) Fibers: [A, B, C, D]</text>
  <g transform="translate(32, 100)">
    <rect x="0" y="0" width="152" height="62" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="76" y="27" class="mono" font-size="16" font-weight="700" fill="#065f46" text-anchor="middle">key="A"</text>
    <text x="76" y="48" class="mono" font-size="12" fill="#047857" text-anchor="middle">oldIdx = 0</text>

    <rect x="200" y="0" width="152" height="62" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="276" y="27" class="mono" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">key="B"</text>
    <text x="276" y="48" class="mono" font-size="12" fill="#64748b" text-anchor="middle">oldIdx = 1</text>

    <rect x="400" y="0" width="152" height="62" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="476" y="27" class="mono" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">key="C"</text>
    <text x="476" y="48" class="mono" font-size="12" fill="#64748b" text-anchor="middle">oldIdx = 2</text>

    <rect x="600" y="0" width="152" height="62" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="676" y="27" class="mono" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">key="D"</text>
    <text x="676" y="48" class="mono" font-size="12" fill="#64748b" text-anchor="middle">oldIdx = 3</text>

    <!-- lastPlacedIndex pointer -->
    <g class="lpi-ptr">
      <rect x="12" y="70" width="128" height="24" rx="5" fill="#7c3aed"/>
      <text x="76" y="86" class="mono" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">lastPlacedIndex</text>
    </g>
  </g>

  <!-- Pass 2 existingChildren Map Card -->
  <rect x="820" y="76" width="228" height="242" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="934" y="100" class="sans" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">existingChildren Map</text>
  <text x="934" y="118" class="mono" font-size="11" fill="#6d28d9" text-anchor="middle">Built at mismatch (i = 1)</text>

  <g class="map-b">
    <rect x="838" y="134" width="192" height="44" rx="7" fill="#ffffff" stroke="#a78bfa"/>
    <text x="934" y="161" class="mono" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle">"B" -&gt; Fiber(1)</text>
  </g>
  <g class="map-c">
    <rect x="838" y="190" width="192" height="44" rx="7" fill="#ffffff" stroke="#a78bfa"/>
    <text x="934" y="217" class="mono" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle">"C" -&gt; Fiber(2)</text>
  </g>
  <g class="map-d">
    <rect x="838" y="246" width="192" height="44" rx="7" fill="#ffffff" stroke="#a78bfa"/>
    <text x="934" y="273" class="mono" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle">"D" -&gt; Fiber(3)</text>
  </g>
  <text x="934" y="308" class="mono" font-size="11" fill="#5b21b6" text-anchor="middle">0 leftovers -&gt; 0 deletes</text>

  <!-- New Elements Row -->
  <text x="32" y="220" class="sans" font-size="13" font-weight="700" fill="#334155">New Elements (WIP): [A, D, B, C]</text>
  <g transform="translate(32, 232)">
    <!-- j=0: A -->
    <rect x="0" y="0" width="152" height="76" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="76" y="25" class="mono" font-size="16" font-weight="700" fill="#065f46" text-anchor="middle">key="A"</text>
    <text x="76" y="45" class="mono" font-size="11.5" font-weight="700" fill="#047857" text-anchor="middle">Pass 1 REUSE</text>
    <text x="76" y="64" class="mono" font-size="11" fill="#059669" text-anchor="middle">lastPlaced = 0</text>

    <!-- j=1: D -->
    <rect x="200" y="0" width="152" height="76" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" opacity="0.92"/>
    <text x="276" y="25" class="mono" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">key="D"</text>
    <text x="276" y="48" class="mono" font-size="11.5" fill="#64748b" text-anchor="middle">newIdx = 1</text>
    <g class="on-p2">
      <rect x="200" y="0" width="152" height="76" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
      <text x="276" y="25" class="mono" font-size="16" font-weight="700" fill="#065f46" text-anchor="middle">key="D"</text>
      <text x="276" y="45" class="mono" font-size="11.5" font-weight="700" fill="#047857" text-anchor="middle">3 &gt;= 0 STAYS</text>
      <text x="276" y="64" class="mono" font-size="11" fill="#059669" text-anchor="middle">lastPlaced = 3</text>
    </g>

    <!-- j=2: B -->
    <rect x="400" y="0" width="152" height="76" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" opacity="0.92"/>
    <text x="476" y="25" class="mono" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">key="B"</text>
    <text x="476" y="48" class="mono" font-size="11.5" fill="#64748b" text-anchor="middle">newIdx = 2</text>
    <g class="on-p3">
      <rect x="400" y="0" width="152" height="76" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
      <text x="476" y="25" class="mono" font-size="16" font-weight="700" fill="#92400e" text-anchor="middle">key="B"</text>
      <text x="476" y="45" class="mono" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">1 &lt; 3 MOVE</text>
      <text x="476" y="64" class="mono" font-size="11" fill="#d97706" text-anchor="middle">flags |= Placement</text>
    </g>

    <!-- j=3: C -->
    <rect x="600" y="0" width="152" height="76" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" opacity="0.92"/>
    <text x="676" y="25" class="mono" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">key="C"</text>
    <text x="676" y="48" class="mono" font-size="11.5" fill="#64748b" text-anchor="middle">newIdx = 3</text>
    <g class="on-p4">
      <rect x="600" y="0" width="152" height="76" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
      <text x="676" y="25" class="mono" font-size="16" font-weight="700" fill="#92400e" text-anchor="middle">key="C"</text>
      <text x="676" y="45" class="mono" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">2 &lt; 3 MOVE</text>
      <text x="676" y="64" class="mono" font-size="11" fill="#d97706" text-anchor="middle">flags |= Placement</text>
    </g>

    <!-- Active scan cursor -->
    <g class="cur-j">
      <rect x="-4" y="-4" width="160" height="84" rx="10" fill="none" stroke="#2563eb" stroke-width="2.5"/>
      <rect x="40" y="84" width="72" height="22" rx="5" fill="#2563eb"/>
      <text x="76" y="99" class="mono" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">scan j</text>
    </g>
  </g>

  <!-- Step Trace Box -->
  <rect x="32" y="352" width="1016" height="114" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <g class="p1">
    <rect x="48" y="366" width="128" height="24" rx="5" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="112" y="382" class="mono" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">Pass 1 (j = 0)</text>
    <text x="192" y="383" class="mono" font-size="14" font-weight="700" fill="#0f172a">Prefix match on "A" -&gt; reuse Fiber(0), lastPlacedIndex = 0</text>
    <text x="48" y="416" class="sans" font-size="13" fill="#334155">At j = 1, "D" != "B" breaks Pass 1 and triggers Pass 2 mapRemainingChildren.</text>
    <text x="48" y="444" class="mono" font-size="12" fill="#5b21b6">Map indexes remaining old fibers: { B: 1, C: 2, D: 3 }.</text>
  </g>
  <g class="p2">
    <rect x="48" y="366" width="128" height="24" rx="5" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="112" y="382" class="mono" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">Pass 2 (j = 1)</text>
    <text x="192" y="383" class="mono" font-size="14" font-weight="700" fill="#0f172a">Lookup "D": oldIdx (3) &gt;= lastPlacedIndex (0) -&gt; STAYS</text>
    <text x="48" y="416" class="sans" font-size="13" fill="#334155">Fiber("D") is reused with no Placement flag; lastPlacedIndex jumps 0 -&gt; 3.</text>
    <text x="48" y="444" class="mono" font-size="12" fill="#047857">Greedy heuristic keeps [A, D] stationary in the existing DOM skeleton.</text>
  </g>
  <g class="p3">
    <rect x="48" y="366" width="128" height="24" rx="5" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="112" y="382" class="mono" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle">Pass 2 (j = 2)</text>
    <text x="192" y="383" class="mono" font-size="14" font-weight="700" fill="#0f172a">Lookup "B": oldIdx (1) &lt; lastPlacedIndex (3) -&gt; Placement</text>
    <text x="48" y="416" class="sans" font-size="13" fill="#334155">Fiber("B") is reused, but flagged Placement (MOVE) after "D"; lastPlaced stays 3.</text>
    <text x="48" y="444" class="mono" font-size="12" fill="#b45309">Commit runs insertBefore(B, C_or_next) without unmounting B's state.</text>
  </g>
  <g class="p4">
    <rect x="48" y="366" width="128" height="24" rx="5" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="112" y="382" class="mono" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle">Pass 2 (j = 3)</text>
    <text x="192" y="383" class="mono" font-size="14" font-weight="700" fill="#0f172a">Lookup "C": oldIdx (2) &lt; lastPlacedIndex (3) -&gt; Placement</text>
    <text x="48" y="416" class="sans" font-size="13" fill="#334155">Fiber("C") is reused and flagged Placement (MOVE); moving last item first costs 2 moves.</text>
    <text x="48" y="444" class="mono" font-size="12" fill="#2563eb">All 4 fibers reused via createWorkInProgress; 0 inserts, 0 deletions.</text>
  </g>

  <!-- Footer Legend -->
  <rect x="32" y="480" width="1016" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="48" y="495" width="14" height="14" rx="3" fill="#ecfdf5" stroke="#059669"/>
  <text x="70" y="506" class="sans" font-size="12" fill="#334155">Reuse in Place</text>
  <rect x="184" y="495" width="14" height="14" rx="3" fill="#fffbeb" stroke="#d97706"/>
  <text x="206" y="506" class="sans" font-size="12" fill="#334155">Placement (Move)</text>
  <rect x="342" y="495" width="14" height="14" rx="3" fill="#7c3aed"/>
  <text x="364" y="506" class="sans" font-size="12" fill="#334155">lastPlacedIndex</text>
  <rect x="492" y="495" width="14" height="14" rx="3" fill="#eff6ff" stroke="#2563eb"/>
  <text x="514" y="506" class="sans" font-size="12" fill="#334155">Scan Cursor j</text>
  <text x="1032" y="506" class="mono" font-size="12" font-weight="700" fill="#0f172a" text-anchor="end">React 19.3.1 · ReactChildFiber.js</text>
</svg>
