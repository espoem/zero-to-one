<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 680" width="1160" height="680" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes HPA Reconcile Loop and Kube-Scheduler Framework Pipeline</title>
  <desc id="desc">Animated Kubernetes autoscaling and scheduling architecture showing M05 HPA desiredReplicas equals ceil(cur * metric / target) with plus or minus 10 percent tolerance band and 300s stabilizationWindowSeconds anti-flapping clamp, and M06 Kube-Scheduler Filter, PostFilter preemption with PodDisruptionBudget protection, weighted Score, atomic Reserve, and asynchronous Bind cycle.</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* 12s cycle:
       0-30%   : M05 HPA formula and stabilization window anti-flapping scan
       30-46%  : M06 Stage 1 Filter
       46-60%  : M06 Stage 2 PostFilter (Preemption fallback branch)
       60-74%  : M06 Stage 3 Score (ArgMax)
       74-87%  : M06 Stage 4 Reserve (Atomic commit)
       87-100% : M06 Stage 5 Bind (Async goroutine)
    */

    @keyframes hpa-scan {
      0%, 4%   { transform: translateX(0px); opacity: 0.95; }
      26%, 94% { transform: translateX(265px); opacity: 0.95; }
      100%     { transform: translateX(0px); opacity: 0.95; }
    }

    @keyframes stg-filter {
      0%, 28%  { stroke: #d6d0c4; stroke-width: 1.5; }
      31%, 45% { stroke: #0f766e; stroke-width: 2.8; }
      47%, 100%{ stroke: #d6d0c4; stroke-width: 1.5; }
    }
    @keyframes stg-post {
      0%, 44%  { stroke: #d6d0c4; stroke-width: 1.5; }
      47%, 59% { stroke: #b45309; stroke-width: 2.8; }
      61%, 100%{ stroke: #d6d0c4; stroke-width: 1.5; }
    }
    @keyframes stg-score {
      0%, 58%  { stroke: #d6d0c4; stroke-width: 1.5; }
      61%, 73% { stroke: #0f766e; stroke-width: 2.8; }
      75%, 100%{ stroke: #d6d0c4; stroke-width: 1.5; }
    }
    @keyframes stg-reserve {
      0%, 72%  { stroke: #d6d0c4; stroke-width: 1.5; }
      75%, 86% { stroke: #0f766e; stroke-width: 2.8; }
      88%, 100%{ stroke: #d6d0c4; stroke-width: 1.5; }
    }
    @keyframes stg-bind {
      0%, 85%  { stroke: #d6d0c4; stroke-width: 1.5; }
      88%, 99% { stroke: #0f766e; stroke-width: 2.8; }
      100%     { stroke: #d6d0c4; stroke-width: 1.5; }
    }

    @keyframes pod-runner {
      0%, 29%  { transform: translateX(0px); opacity: 0; }
      33%      { transform: translateX(0px); opacity: 1; }
      48%      { transform: translateX(220px); opacity: 1; }
      62%      { transform: translateX(440px); opacity: 1; }
      76%      { transform: translateX(660px); opacity: 1; }
      90%, 98% { transform: translateX(880px); opacity: 1; }
      100%     { transform: translateX(880px); opacity: 0; }
    }

    .scan-win { animation: hpa-scan 12s ease-in-out infinite; }
    .sf1      { animation: stg-filter 12s linear infinite; }
    .sf2      { animation: stg-post 12s linear infinite; }
    .sf3      { animation: stg-score 12s linear infinite; }
    .sf4      { animation: stg-reserve 12s linear infinite; }
    .sf5      { animation: stg-bind 12s linear infinite; }
    .pod-tok  { animation: pod-runner 12s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .scan-win, .sf1, .sf2, .sf3, .sf4, .sf5, .pod-tok {
        animation: none !important;
      }
      .scan-win { transform: translateX(180px) !important; opacity: 1 !important; }
      .pod-tok  { transform: translateX(440px) !important; opacity: 1 !important; }
      .sf1 { stroke: #0f766e !important; stroke-width: 2 !important; }
      .sf2 { stroke: #b45309 !important; stroke-width: 2 !important; }
      .sf3 { stroke: #0f766e !important; stroke-width: 2 !important; }
      .sf4, .sf5 { stroke: #0f766e !important; stroke-width: 2 !important; }
    }
  </style>

  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#44403c"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1160" height="680" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>

  <!-- Header -->
  <line x1="24" y1="62" x2="1136" y2="62" stroke="#1c1917" stroke-width="1.2"/>
  
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#1c1917" font-family="Georgia, 'Times New Roman', serif">Kubernetes HPA Reconcile Loop &amp; Kube-Scheduler Framework</text>
  <text x="24" y="47" class="sans" font-size="12" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">M05: desiredReplicas = ⌈cur × metric / target⌉ + Stabilization Window · M06: Filter → PostFilter → Score → Reserve → Bind</text>

  <!-- TOP BAND: M05 HPA RECONCILER -->
  <rect x="24" y="76" width="1112" height="274" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <rect x="40" y="90" width="44" height="22" rx="5" fill="#0f766e"/>
  <text x="62" y="105" class="mono" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">M05</text>
  <text x="94" y="106" class="sans" font-size="14" font-weight="700" fill="#1c1917">Horizontal Pod Autoscaler Reconcile Loop &amp; Stabilization Clamp</text>

  <!-- Left Sub-card: Formula & Tolerance -->
  <rect x="40" y="124" width="460" height="210" rx="8" fill="#f0fdf9" stroke="#bfdbfe"/>
  <text x="56" y="146" class="sans" font-size="12.5" font-weight="700" fill="#065f46">1. Tolerance Band &amp; Ratio Formula</text>
  <rect x="56" y="158" width="428" height="32" rx="6" fill="#ffffff" stroke="#99f6e4"/>
  <text x="270" y="178" class="mono" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">desired = ⌈ cur × (metric / target) ⌉</text>

  <text x="56" y="210" class="mono" font-size="10.5" fill="#44403c">Scale-Up Event: cur = 4, metric = 90%, target = 50%</text>
  <text x="56" y="229" class="mono" font-size="10.5" fill="#065f46">ratio = 1.80 (|1.80 − 1.0| &gt; 0.10 tolerance) → ⌈4×1.8⌉ = 8</text>
  <text x="56" y="254" class="mono" font-size="10.5" fill="#44403c">Transient Dip (t=60s): cur = 8, metric = 30%, target = 50%</text>
  <text x="56" y="273" class="mono" font-size="10.5" fill="#92400e">rawDesired = ⌈8 × 0.60⌉ = 5 → buffered in scale-down history</text>

  <rect x="56" y="288" width="428" height="32" rx="6" fill="#f0fdf9" stroke="#99f6e4"/>
  <text x="270" y="308" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">Bounds Invariant: minReplicas (2) ≤ R ≤ maxReplicas (10)</text>

  <!-- Right Sub-card: Stabilization Window Chart -->
  <rect x="516" y="124" width="604" height="210" rx="8" fill="#faf8f5" stroke="#d6d0c4"/>
  <text x="534" y="146" class="sans" font-size="12.5" font-weight="700" fill="#1c1917">2. Anti-Flapping Clamp (stabilizationWindowSeconds = 300s)</text>

  <!-- Sliding 300s Window Highlight -->
  <g class="scan-win">
    <rect x="560" y="160" width="230" height="122" rx="4" fill="#fffbeb" fill-opacity="0.85" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="675" y="176" class="mono" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">300s Window: max = 8</text>
  </g>

  <!-- Chart Axes -->
  <line x1="560" y1="282" x2="1096" y2="282" stroke="#44403c" stroke-width="1.5"/>
  <line x1="560" y1="162" x2="560" y2="282" stroke="#44403c" stroke-width="1.5"/>
  <text x="546" y="182" class="mono" font-size="10" fill="#44403c" text-anchor="end">8</text>
  <text x="546" y="232" class="mono" font-size="10" fill="#44403c" text-anchor="end">5</text>
  <text x="546" y="276" class="mono" font-size="10" fill="#44403c" text-anchor="end">4</text>

  <!-- Time ticks -->
  <text x="566" y="297" class="mono" font-size="10" fill="#44403c">0s</text>
  <text x="670" y="297" class="mono" font-size="10" fill="#44403c">60s</text>
  <text x="780" y="297" class="mono" font-size="10" fill="#44403c">150s</text>
  <text x="955" y="297" class="mono" font-size="10" fill="#92400e" font-weight="700">300s</text>
  <text x="1062" y="297" class="mono" font-size="10" fill="#44403c">360s</text>

  <!-- Raw Desired Polyline (dashed rose) -->
  <polyline points="560,264 590,180 675,180 675,228 785,228 785,196 845,196 845,228 1086,228" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- Stabilized Applied Replicas Polyline (solid emerald) -->
  <polyline points="560,264 590,180 968,180 968,228 1086,228" fill="none" stroke="#0f766e" stroke-width="3"/>

  <!-- Legend pills inside chart -->
  <line x1="534" y1="316" x2="558" y2="316" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="564" y="320" class="mono" font-size="10" fill="#991b1b">Raw desiredReplicas</text>
  <line x1="708" y1="316" x2="732" y2="316" stroke="#0f766e" stroke-width="3"/>
  <text x="738" y="320" class="mono" font-size="10" fill="#065f46">Applied Replicas (max in 300s window)</text>

  <!-- BOTTOM BAND: M06 KUBE-SCHEDULER PIPELINE -->
  <rect x="24" y="366" width="1112" height="290" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <rect x="40" y="380" width="44" height="22" rx="5" fill="#0f766e"/>
  <text x="62" y="395" class="mono" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">M06</text>
  <text x="94" y="396" class="sans" font-size="14" font-weight="700" fill="#1c1917">Kube-Scheduler Framework Pipeline (Scheduling Cycle + Async Binding Cycle)</text>

  <!-- Animated Pod Token gliding across stages -->
  <g class="pod-tok">
    <rect x="96" y="408" width="80" height="20" rx="10" fill="#0f766e"/>
    <text x="136" y="422" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Pod P (4CPU)</text>
  </g>

  <!-- Pipeline Arrows -->
  <line x1="232" y1="498" x2="256" y2="498" stroke="#b45309" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr-amber)"/>
  <line x1="452" y1="498" x2="476" y2="498" stroke="#b45309" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr-amber)"/>
  <!-- Direct normal path Filter -> Score -->
  <path d="M 232 454 Q 356 426 476 454" fill="none" stroke="#44403c" stroke-width="2" marker-end="url(#arr-slate)"/>
  <rect x="304" y="428" width="104" height="16" rx="4" fill="#f0fdf9" stroke="#bfdbfe"/>
  <text x="356" y="439" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">feasible &gt; 0</text>

  <line x1="672" y1="498" x2="696" y2="498" stroke="#44403c" stroke-width="2" marker-end="url(#arr-slate)"/>
  <line x1="892" y1="498" x2="916" y2="498" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Stage 1: Filter -->
  <rect x="40" y="434" width="192" height="150" rx="8" fill="#f0fdf9" class="sf1"/>
  <text x="136" y="456" class="sans" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">1. Filter (Parallel)</text>
  <line x1="54" y1="464" x2="218" y2="464" stroke="#bfdbfe"/>
  <text x="54" y="484" class="mono" font-size="10" fill="#065f46" font-weight="700">Node A: CPU+Taint → PASS</text>
  <text x="54" y="504" class="mono" font-size="10" fill="#991b1b">Node B: Low CPU   → FAIL</text>
  <text x="54" y="524" class="mono" font-size="10" fill="#991b1b">Node C: NoSchedule→ FAIL</text>
  <text x="54" y="544" class="mono" font-size="10" fill="#065f46" font-weight="700">Node D: CPU+Taint → PASS</text>
  <text x="136" y="572" class="sans" font-size="10" fill="#065f46" text-anchor="middle">100% Filter plugins must pass</text>

  <!-- Stage 2: PostFilter (Preemption) -->
  <rect x="260" y="454" width="192" height="130" rx="8" fill="#fffbeb" class="sf2"/>
  <text x="356" y="476" class="sans" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="middle">2. PostFilter (if ∅)</text>
  <line x1="274" y1="484" x2="438" y2="484" stroke="#fde68a"/>
  <text x="274" y="504" class="mono" font-size="10" fill="#92400e">• Preemption candidate scan</text>
  <text x="274" y="522" class="mono" font-size="10" fill="#92400e">• Minimize victim count</text>
  <text x="274" y="540" class="mono" font-size="10" fill="#92400e">• Respect PDB minAvailable</text>
  <text x="274" y="558" class="mono" font-size="10" fill="#991b1b">• Stamp deletionTimestamp</text>
  <text x="356" y="575" class="sans" font-size="10" fill="#92400e" text-anchor="middle">Runs only when feasible = ∅</text>

  <!-- Stage 3: Score -->
  <rect x="480" y="434" width="192" height="150" rx="8" fill="#f5f1e8" class="sf3"/>
  <text x="576" y="456" class="sans" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">3. Score (Weighted)</text>
  <line x1="494" y1="464" x2="658" y2="464" stroke="#ddd6fe"/>
  <text x="494" y="484" class="mono" font-size="10" fill="#44403c">Σ score(P,n) × weight:</text>
  <rect x="494" y="494" width="164" height="24" rx="4" fill="#f0fdf9" stroke="#0f766e"/>
  <text x="576" y="510" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">Node A: 84 pts ★</text>
  <text x="494" y="538" class="mono" font-size="10" fill="#44403c">Node D: 61 pts</text>
  <text x="576" y="572" class="sans" font-size="10" fill="#065f46" text-anchor="middle">ArgMax + random tie-break</text>

  <!-- Stage 4: Reserve -->
  <rect x="700" y="434" width="192" height="150" rx="8" fill="#f0fdf9" class="sf4"/>
  <text x="796" y="456" class="sans" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">4. Reserve (Atomic)</text>
  <line x1="714" y1="464" x2="878" y2="464" stroke="#f0fdf9"/>
  <text x="714" y="486" class="mono" font-size="10" fill="#44403c">In-memory cache update:</text>
  <text x="714" y="506" class="mono" font-size="10" font-weight="700" fill="#065f46">NodeA.free -= 4 CPU</text>
  <text x="714" y="528" class="mono" font-size="10" fill="#44403c">Serialized before next</text>
  <text x="714" y="544" class="mono" font-size="10" fill="#44403c">ScheduleOne() cycle</text>
  <text x="796" y="572" class="sans" font-size="10" fill="#065f46" text-anchor="middle">Roll back via Unreserve on err</text>

  <!-- Stage 5: Bind -->
  <rect x="920" y="434" width="192" height="150" rx="8" fill="#f0fdf9" class="sf5"/>
  <text x="1016" y="456" class="sans" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">5. Bind (Async Go)</text>
  <line x1="934" y1="464" x2="1098" y2="464" stroke="#f0fdf9"/>
  <text x="934" y="486" class="mono" font-size="10" fill="#44403c">1. Permit (wait/approve)</text>
  <text x="934" y="506" class="mono" font-size="10" fill="#44403c">2. PreBind (attach PV)</text>
  <text x="934" y="526" class="mono" font-size="10" font-weight="700" fill="#065f46">3. CreateBinding(P→A)</text>
  <text x="934" y="546" class="mono" font-size="10" fill="#44403c">4. PostBind (commit)</text>
  <text x="1016" y="572" class="sans" font-size="10" fill="#065f46" text-anchor="middle">Runs off critical serial path</text>

  <!-- Bottom Invariant Bar -->
  <rect x="40" y="598" width="1072" height="42" rx="7" fill="#f5f1e8" stroke="#d6d0c4"/>
  <text x="576" y="616" class="mono" font-size="10.5" font-weight="700" fill="#1c1917" text-anchor="middle">Invariant 1: Filter→Score→Reserve serialized per Pod · Invariant 2: Bind executes asynchronously</text>
  <text x="576" y="632" class="sans" font-size="10" fill="#44403c" text-anchor="middle">Scale-up reacts immediately; scale-down waits for stabilizationWindowSeconds (300s) · Preemption evicts only if no node passes Filter</text>
</svg>
