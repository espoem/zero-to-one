# Toolchain for technologies/kubernetes. Run everything through mise:
#   mise install && mise exec -- npm install && mise exec -- npm test
[tools]
node = "26"
"npm:typescript" = "7.0.2"
kubectl = "1.37.2"
kind = "0.33.0"
helm = "4.3.1"
kustomize = "5.8.3"
kubeconform = "v0.8.0"
"github:k3d-io/k3d" = "5.9.0"
"github:kyverno/chainsaw" = "0.2.15"
"github:kyverno/kyverno" = "1.19.2"
"github:kubernetes-sigs/kwok" = "0.8.0"
