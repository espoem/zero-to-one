<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 590" width="1180" height="590" role="img" aria-labelledby="title desc">
  <title id="title">URL Shortener Architecture Evolution: 2021 vs 2026</title>
  <desc id="desc">Six-layer comparison of URL shortener architecture between 2021 legacy defaults and 2026 modern cloud-native standards, covering code generation predictability, edge redirection latency, HTTP redirection semantics, real-time phishing defense, privacy-preserving analytics, and storage lifecycle tiering.</desc>

  <!-- Background -->
  <rect x="0" y="0" width="1180" height="590" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="1180" height="56" rx="12" fill="#0f172a"/>
  <rect x="0" y="40" width="1180" height="16" fill="#0f172a"/>
  <text x="24" y="27" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">URL Shortener Architecture Evolution: 2021 Default vs. 2026 Modern Standard</text>
  <text x="24" y="46" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Eliminating Sequential Alias Enumeration, Cross-Continent Redirect Latency, and Privacy/Phishing Liabilities</text>

  <!-- Column Headers -->
  <rect x="20" y="70" width="220" height="32" rx="6" fill="#e2e8f0"/>
  <text x="34" y="91" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e293b">Architectural Layer</text>

  <rect x="252" y="70" width="440" height="32" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="266" y="91" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b">2021 Legacy Default (Pain Points)</text>

  <rect x="704" y="70" width="456" height="32" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="718" y="91" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534">2026 Modern Standard (Primary Shifts)</text>

  <!-- Row 1: Code Generation & Security -->
  <rect x="20" y="112" width="220" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="32" y="137" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">1. Code Generation</text>
  <text x="32" y="155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b">Enumeration &amp; Collisions</text>

  <rect x="252" y="112" width="440" height="62" rx="6" fill="#fff5f5" stroke="#fecaca"/>
  <text x="264" y="136" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">Sequential Auto-Increment ID + Base62</text>
  <text x="264" y="155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#475569">Incremental IDs (1, 2, 3...) leak volume; trivial to scrape all URLs</text>

  <rect x="704" y="112" width="456" height="62" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="716" y="136" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#166534">Feistel-Permuted / Sqids Bijective Mapping</text>
  <text x="716" y="155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#334155">Non-sequential 42-bit permutation; zero collisions, tamper-resistant</text>

  <!-- Row 2: Edge Routing & Latency -->
  <rect x="20" y="182" width="220" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="32" y="207" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">2. Edge &amp; Latency</text>
  <text x="32" y="225" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b">Global Redirection RTT</text>

  <rect x="252" y="182" width="440" height="62" rx="6" fill="#fff5f5" stroke="#fecaca"/>
  <text x="264" y="206" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">Single-Region Origin RDBMS + Redis Cluster</text>
  <text x="264" y="225" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#475569">Cross-continent users pay 120-250 ms RTT; origin bottleneck</text>

  <rect x="704" y="182" width="456" height="62" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="716" y="206" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#166534">Cloudflare Workers KV / DynamoDB Global Tables</text>
  <text x="716" y="225" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#334155">&lt; 10 ms edge redirects at 300+ PoPs; multi-region active-active</text>

  <!-- Row 3: HTTP Redirection Semantics -->
  <rect x="20" y="252" width="220" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="32" y="277" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">3. HTTP Semantics</text>
  <text x="32" y="295" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b">Redirection &amp; Caching</text>

  <rect x="252" y="252" width="440" height="62" rx="6" fill="#fff5f5" stroke="#fecaca"/>
  <text x="264" y="276" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">Naive 301 Permanent or Unhedged 302</text>
  <text x="264" y="295" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#475569">301 permanently blinds analytics; browsers mutate POST to GET</text>

  <rect x="704" y="252" width="456" height="62" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="716" y="276" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#166534">RFC 9110 307 / 308 + Cache-Control: no-store</text>
  <text x="716" y="295" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#334155">Method-preserving 307/308; 100% analytics capture &amp; instant kill switch</text>

  <!-- Row 4: Abuse & Phishing Defense -->
  <rect x="20" y="322" width="220" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="32" y="347" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">4. Trust &amp; Safety</text>
  <text x="32" y="365" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b">Phishing &amp; Malware</text>

  <rect x="252" y="322" width="440" height="62" rx="6" fill="#fff5f5" stroke="#fecaca"/>
  <text x="264" y="346" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">Post-Hoc Batch Scrapers &amp; Reactive Reports</text>
  <text x="264" y="365" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#475569">Malware links active for hours; root domain blacklisted by browsers</text>

  <rect x="704" y="322" width="456" height="62" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="716" y="346" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#166534">Real-Time Safe Browsing &amp; AI Reputation Gates</text>
  <text x="716" y="365" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#334155">Sync check at POST; ML-driven quarantine &amp; interstitial warning</text>

  <!-- Row 5: Telemetry & Privacy -->
  <rect x="20" y="392" width="220" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="32" y="417" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">5. Analytics &amp; Privacy</text>
  <text x="32" y="435" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b">Click-Stream Telemetry</text>

  <rect x="252" y="392" width="440" height="62" rx="6" fill="#fff5f5" stroke="#fecaca"/>
  <text x="264" y="416" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">Raw IP &amp; User-Agent Logged into Relational DB</text>
  <text x="264" y="435" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#475569">GDPR/ePrivacy liabilities; write locks on click tables during bursts</text>

  <rect x="704" y="392" width="456" height="62" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="716" y="416" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#166534">Privacy-Preserving Kafka + ClickHouse Stream</text>
  <text x="716" y="435" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#334155">IP subnet truncation (/24); decoupled Kafka buffer; sub-sec OLAP</text>

  <!-- Row 6: Storage Economics & Sweeping -->
  <rect x="20" y="462" width="220" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="32" y="487" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">6. Storage Economics</text>
  <text x="32" y="505" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b">10-Year Scale (365 TB)</text>

  <rect x="252" y="462" width="440" height="62" rx="6" fill="#fff5f5" stroke="#fecaca"/>
  <text x="264" y="486" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">Monolithic Sharded DB + Periodic DELETE Sweeps</text>
  <text x="264" y="505" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#475569">High SSD cost for dead links; massive cron sweeps lock DB rows</text>

  <rect x="704" y="462" width="456" height="62" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="716" y="486" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#166534">Tiered Active KV + S3 Iceberg + Lazy Read Sweeping</text>
  <text x="716" y="505" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#334155">Hot KV tier; cold links archived to S3 (90% savings); lazy 410 check</text>
</svg>
