<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" width="1120" height="580" role="img" aria-labelledby="title desc">
  <title id="title">JWZ Email Threading Algorithm Step-by-Step Animated Graph Assembly</title>
  <desc id="desc">Animated Jamie Zawinski JWZ Email Threading algorithm reconstructing out-of-order RFC 5322 email threads: Step 1 indexes arrived message m3 referencing missing ancestors m1 and m2; Step 2 synthesizes placeholder container nodes for m1 and m2 and links References edges; Step 3 enforces a cycle check rejecting forged cyclic header m3 to m1 while hydrating m1 upon late arrival; Step 4 promotes the clean thread root and collapses unneeded empty placeholders into a deterministic thread_id tree.</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* 12s cycle:
       0-25%  (0-3s): Step 1 — Out-of-order m3 arrives first (References: [m1, m2])
       25-50% (3-6s): Step 2 — Synthesize dummy placeholders [?] m1 and [?] m2
       50-75% (6-9s): Step 3 — Cycle guard blocks m3 -> m1 back-edge; m1 arrives and hydrates
       75-100%(9-12s):Step 4 — m4 reply links under [?] m2 bridge; root m1 promoted
    */

    @keyframes ph-appear {
      0%, 22%  { opacity: 0.86; }
      28%, 96% { opacity: 1; }
      100%     { opacity: 0.86; }
    }

    @keyframes m1-hydrate {
      0%, 54%  { fill: #fffbeb; stroke: #d97706; stroke-dasharray: 5 3; }
      62%, 98% { fill: #ecfdf5; stroke: #059669; stroke-dasharray: none; }
      100%     { fill: #fffbeb; stroke: #d97706; stroke-dasharray: 5 3; }
    }

    @keyframes cycle-flash {
      0%, 48%  { opacity: 0; }
      54%, 70% { opacity: 1; }
      76%, 100%{ opacity: 0.86; }
    }

    @keyframes m4-pop {
      0%, 72%  { opacity: 0.86; }
      78%, 98% { opacity: 1; }
      100%     { opacity: 0.86; }
    }

    @keyframes s1-hl { 0%, 24% { stroke: #2563eb; stroke-width: 2.2; opacity: 1; } 25%, 100% { stroke: #cbd5e1; stroke-width: 1; opacity: 0.86; } }
    @keyframes s2-hl { 0%, 24% { stroke: #cbd5e1; stroke-width: 1; opacity: 0.86; } 25%, 49% { stroke: #d97706; stroke-width: 2.2; opacity: 1; } 50%, 100% { stroke: #cbd5e1; stroke-width: 1; opacity: 0.86; } }
    @keyframes s3-hl { 0%, 49% { stroke: #cbd5e1; stroke-width: 1; opacity: 0.86; } 50%, 74% { stroke: #e11d48; stroke-width: 2.2; opacity: 1; } 75%, 100% { stroke: #cbd5e1; stroke-width: 1; opacity: 0.86; } }
    @keyframes s4-hl { 0%, 74% { stroke: #cbd5e1; stroke-width: 1; opacity: 0.86; } 75%, 100% { stroke: #059669; stroke-width: 2.2; opacity: 1; } }

    .ph { animation: ph-appear 12s ease-in-out infinite; }
    .m1-box { animation: m1-hydrate 12s ease-in-out infinite; }
    .cyc { animation: cycle-flash 12s ease-in-out infinite; }
    .m4 { animation: m4-pop 12s ease-in-out infinite; }
    .s1 { animation: s1-hl 12s linear infinite; }
    .s2 { animation: s2-hl 12s linear infinite; }
    .s3 { animation: s3-hl 12s linear infinite; }
    .s4 { animation: s4-hl 12s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .ph, .m1-box, .cyc, .m4, .s1, .s2, .s3, .s4 { animation: none !important; }
      .ph, .cyc, .m4, .s1, .s2, .s3, .s4 { opacity: 1 !important; }
      .m1-box { fill: #ecfdf5 !important; stroke: #059669 !important; stroke-dasharray: none !important; }
    }
  </style>

  <defs>
    <marker id="arr-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1120" height="580" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="1120" height="60" rx="12" fill="#0f172a"/>
  <rect x="0" y="44" width="1120" height="16" fill="#0f172a"/>
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#f8fafc">JWZ Email Threading Algorithm (Jamie Zawinski, 1997)</text>
  <text x="24" y="47" class="sans" font-size="12" fill="#94a3b8">M20 §3.3 · RFC 5322 Message-Id / In-Reply-To / References · Placeholder Synthesis · Cycle-Guard Check · Root Promotion</text>

  <!-- LEFT PANEL: 4-STEP TIMELINE -->
  <rect x="24" y="76" width="440" height="432" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="42" y="102" class="sans" font-size="14" font-weight="700" fill="#0f172a">JWZ Thread Assembly Steps (12s Loop)</text>

  <rect x="42" y="118" width="404" height="84" rx="8" fill="#eff6ff" class="s1"/>
  <text x="56" y="139" class="sans" font-size="12" font-weight="700" fill="#1e3a8a">1. Out-of-Order Arrival (m3 arrives first)</text>
  <text x="56" y="159" class="mono" font-size="10" fill="#334155">Message-Id: &lt;m3&gt;, In-Reply-To: &lt;m2&gt;</text>
  <text x="56" y="175" class="mono" font-size="10" fill="#334155">References: [&lt;m1&gt;, &lt;m2&gt;]</text>
  <text x="56" y="191" class="sans" font-size="10" fill="#1d4ed8">Naive parent_id lookup breaks thread into orphans.</text>

  <rect x="42" y="212" width="404" height="84" rx="8" fill="#fffbeb" class="s2"/>
  <text x="56" y="233" class="sans" font-size="12" font-weight="700" fill="#92400e">2. Synthesize Placeholder Containers</text>
  <text x="56" y="253" class="mono" font-size="10" fill="#334155">Create dummy nodes [?] m1, [?] m2 in id_table</text>
  <text x="56" y="269" class="mono" font-size="10" fill="#334155">(isPlaceholder = true); link m1 → m2 → m3.</text>
  <text x="56" y="285" class="sans" font-size="10" fill="#b45309">Links consecutive References[i] → References[i+1].</text>

  <rect x="42" y="306" width="404" height="84" rx="8" fill="#fff1f2" class="s3"/>
  <text x="56" y="327" class="sans" font-size="12" font-weight="700" fill="#9f1239">3. Cycle Guard + Late Ancestor Hydration</text>
  <text x="56" y="347" class="mono" font-size="10" fill="#334155">Reject forged header &lt;m1&gt; citing &lt;m3&gt; as parent</text>
  <text x="56" y="363" class="mono" font-size="10" fill="#be123c">(DFS reaches m1 from m3 → CYCLE PRUNED!).</text>
  <text x="56" y="379" class="sans" font-size="10" fill="#065f46">Real &lt;m1&gt; hydrates [?] m1 placeholder cleanly.</text>

  <rect x="42" y="400" width="404" height="84" rx="8" fill="#ecfdf5" class="s4"/>
  <text x="56" y="421" class="sans" font-size="12" font-weight="700" fill="#065f46">4. Prune Dummies &amp; Promote Thread Root</text>
  <text x="56" y="441" class="mono" font-size="10" fill="#334155">m4 also cites &lt;m2&gt;: dummy [?] m2 has ≥2 kids,</text>
  <text x="56" y="457" class="mono" font-size="10" fill="#334155">so [?] m2 stays as bridge under root &lt;m1&gt;.</text>
  <text x="56" y="473" class="sans" font-size="10" fill="#047857">Assign deterministic thread_id = &lt;m1&gt;.</text>

  <!-- RIGHT PANEL: CONTAINER GRAPH -->
  <rect x="484" y="76" width="612" height="432" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="504" y="102" class="sans" font-size="14" font-weight="700" fill="#0f172a">Container Graph Assembly (id_table DAG → Thread Tree)</text>

  <!-- Root Container <m1> -->
  <g class="ph">
    <rect x="650" y="126" width="244" height="62" rx="8" class="m1-box" stroke-width="2"/>
    <text x="772" y="148" class="mono" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">Root Container: &lt;m1&gt;</text>
    <text x="772" y="166" class="mono" font-size="10" fill="#047857" text-anchor="middle">[?] Placeholder → Hydrated (isPlaceholder=false)</text>
    <text x="772" y="180" class="mono" font-size="10" fill="#334155" text-anchor="middle">Promoted thread_id = &lt;m1&gt;</text>
  </g>

  <!-- Edge m1 -> m2 -->
  <g class="ph">
    <line x1="772" y1="188" x2="772" y2="232" stroke="#475569" stroke-width="2" marker-end="url(#arr-s)"/>
    <text x="786" y="214" class="mono" font-size="10" fill="#475569">References[0→1]</text>
  </g>

  <!-- Missing Parent Container [?] <m2> -->
  <g class="ph">
    <rect x="640" y="238" width="264" height="58" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2" stroke-dasharray="6 3"/>
    <text x="772" y="260" class="mono" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle">Dummy Container: [?] &lt;m2&gt;</text>
    <text x="772" y="278" class="mono" font-size="10" fill="#b45309" text-anchor="middle">isPlaceholder = true (Deleted / Not CC'd)</text>
    <text x="772" y="290" class="mono" font-size="10" fill="#78350f" text-anchor="middle">Kept as structural bridge (children ≥ 2)</text>
  </g>

  <!-- Edges m2 -> m3 and m2 -> m4 -->
  <g class="ph">
    <line x1="712" y1="296" x2="640" y2="352" stroke="#475569" stroke-width="2" marker-end="url(#arr-s)"/>
  </g>
  <g class="m4">
    <line x1="832" y1="296" x2="904" y2="352" stroke="#475569" stroke-width="2" marker-end="url(#arr-s)"/>
  </g>

  <!-- Arrived <m3> -->
  <rect x="514" y="358" width="228" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="628" y="380" class="mono" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">Arrived Email: &lt;m3&gt;</text>
  <text x="628" y="397" class="mono" font-size="10" fill="#1e40af" text-anchor="middle">Arrived 1st (Out-of-Order)</text>
  <text x="628" y="411" class="mono" font-size="10" fill="#334155" text-anchor="middle">In-Reply-To: &lt;m2&gt;</text>

  <!-- Arrived <m4> -->
  <g class="m4">
    <rect x="794" y="358" width="248" height="62" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="918" y="380" class="mono" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">Arrived Email: &lt;m4&gt;</text>
    <text x="918" y="397" class="mono" font-size="10" fill="#047857" text-anchor="middle">Sibling Reply under [?] &lt;m2&gt;</text>
    <text x="918" y="411" class="mono" font-size="10" fill="#334155" text-anchor="middle">In-Reply-To: &lt;m2&gt;</text>
  </g>

  <!-- Forged Cycle Back-Edge m3 -> m1 -->
  <g class="cyc">
    <path d="M 514,388 C 492,388 492,156 644,156" fill="none" stroke="#e11d48" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arr-r)"/>
    <rect x="498" y="250" width="128" height="38" rx="5" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
    <text x="562" y="266" class="mono" font-size="10" font-weight="700" fill="#9f1239" text-anchor="middle">CYCLE GUARD!</text>
    <text x="562" y="280" class="mono" font-size="10" fill="#be123c" text-anchor="middle">m3→m1 Pruned</text>
  </g>

  <!-- Prune Rule Summary -->
  <rect x="504" y="438" width="572" height="54" rx="7" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="518" y="458" class="mono" font-size="10.5" font-weight="700" fill="#5b21b6">Empty Container Pruning Rule (Step 4):</text>
  <text x="518" y="476" class="sans" font-size="10.5" fill="#334155">• 0 children → delete dummy · 1 child → splice child up · ≥ 2 children → keep bridge!</text>

  <!-- FOOTER -->
  <rect x="24" y="520" width="1072" height="44" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="42" y="546" class="sans" font-size="11.5" font-weight="600" fill="#1e3a8a">Takeaway: JWZ builds a cycle-free DAG using placeholder containers so out-of-order replies and missing intermediate parents still render one unified thread.</text>
</svg>
