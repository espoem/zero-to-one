<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 590" width="1160" height="590" role="img" aria-labelledby="title desc">
  <title id="title">Distributed Message Queue Stack Evolution: 2021 vs 2026</title>
  <desc id="desc">Six-layer comparison of distributed message queue architecture between 2021 legacy defaults and 2026 modern cloud-native standards, covering ZooKeeper vs KRaft, eager vs KIP-848 rebalancing, local disk vs tiered/diskless S3 brokers, queue-stream convergence via KIP-932, JVM vs thread-per-core/follower fetching, and delayed delivery.</desc>

  <!-- Background -->
  <rect x="0" y="0" width="1160" height="590" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="1160" height="56" rx="12" fill="#0f172a"/>
  <rect x="0" y="40" width="1160" height="16" fill="#0f172a"/>
  <text x="24" y="27" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Distributed Message Queue Evolution: 2021 Default vs. 2026 Modern Standard</text>
  <text x="24" y="46" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Eliminating ZooKeeper, Stop-the-World Rebalances, and Six-Figure Cloud Cross-AZ Replication Bills</text>

  <!-- Column Headers -->
  <rect x="20" y="70" width="210" height="32" rx="6" fill="#e2e8f0"/>
  <text x="34" y="91" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e293b">Architectural Layer</text>

  <rect x="242" y="70" width="440" height="32" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="256" y="91" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b">2021 Legacy Default (Pain Points)</text>

  <rect x="694" y="70" width="446" height="32" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="708" y="91" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534">2026 Modern Standard (Primary Shifts)</text>

  <!-- Row 1 -->
  <rect x="20" y="112" width="210" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="32" y="138" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">1. Cluster Coordination</text>
  <text x="32" y="156" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b">Metadata &amp; Controller</text>

  <rect x="242" y="112" width="440" height="62" rx="6" fill="#fff5f5" stroke="#fecaca"/>
  <text x="254" y="136" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">External Apache ZooKeeper Ensemble</text>
  <text x="254" y="155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#475569">Split-brain metadata drift; ~200k partition cap; slow failovers</text>

  <rect x="694" y="112" width="446" height="62" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="706" y="136" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#166534">KRaft Raft Quorum (Kafka 4.0+ ZK Removed)</text>
  <text x="706" y="155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#334155">Event-sourced @metadata log; 1M+ partitions; &lt; 1 s failover</text>

  <!-- Row 2 -->
  <rect x="20" y="182" width="210" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="32" y="208" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">2. Group Rebalancing</text>
  <text x="32" y="226" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b">Partition Assignment</text>

  <rect x="242" y="182" width="440" height="62" rx="6" fill="#fff5f5" stroke="#fecaca"/>
  <text x="254" y="206" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">Eager Stop-the-World Client-Leader Sync</text>
  <text x="254" y="225" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#475569">Revokes all partitions on join/leave; cascades lag spikes</text>

  <rect x="694" y="182" width="446" height="62" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="706" y="206" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#166534">KIP-848 Server-Side Incremental Protocol</text>
  <text x="706" y="225" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#334155">Broker computes target diff via heartbeats; zero global pause</text>

  <!-- Row 3 -->
  <rect x="20" y="252" width="210" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="32" y="278" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">3. Storage &amp; Cross-AZ</text>
  <text x="32" y="296" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b">Retention &amp; Cloud Egress</text>

  <rect x="242" y="252" width="440" height="62" rx="6" fill="#fff5f5" stroke="#fecaca"/>
  <text x="254" y="276" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">Local EBS/NVMe Only + 3-AZ Broker Tax</text>
  <text x="254" y="295" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#475569">Couples compute &amp; 14d storage; $34k-$104k/mo AZ transfer</text>

  <rect x="694" y="252" width="446" height="62" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="706" y="276" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#166534">KIP-405 Tiered Storage &amp; Diskless S3 Brokers</text>
  <text x="706" y="295" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#334155">WarpStream / AutoMQ / Bufstream: S3 durable log, $0 AZ rep</text>

  <!-- Row 4 -->
  <rect x="20" y="322" width="210" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="32" y="348" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">4. Queue vs. Stream</text>
  <text x="32" y="366" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b">Consumption Semantics</text>

  <rect x="242" y="322" width="440" height="62" rx="6" fill="#fff5f5" stroke="#fecaca"/>
  <text x="254" y="346" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">Separate SQS/RabbitMQ + Kafka Stacks</text>
  <text x="254" y="365" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#475569">Logs hard-capped at N partitions; dual ops &amp; bridges</text>

  <rect x="694" y="322" width="446" height="62" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="706" y="346" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#166534">KIP-932 Share Groups (Queues on Logs)</text>
  <text x="706" y="365" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#334155">Per-record ACK/NACK &amp; competing workers over 1 partition</text>

  <!-- Row 5 -->
  <rect x="20" y="392" width="210" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="32" y="418" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">5. Engine &amp; Read Path</text>
  <text x="32" y="436" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b">Runtime &amp; Locality</text>

  <rect x="242" y="392" width="440" height="62" rx="6" fill="#fff5f5" stroke="#fecaca"/>
  <text x="254" y="416" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">JVM G1GC Tuning + Leader-Only Reads</text>
  <text x="254" y="435" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#475569">2/3 consumer reads cross AZs; GC tail pauses on hot topics</text>

  <rect x="694" y="392" width="446" height="62" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="706" y="416" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#166534">Thread-per-Core C++ / Gen ZGC + KIP-392</text>
  <text x="706" y="435" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#334155">Redpanda Seastar / Raft; rack-aware local AZ follower fetch</text>

  <!-- Row 6 -->
  <rect x="20" y="462" width="210" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="32" y="488" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">6. Latency vs. Cost</text>
  <text x="32" y="506" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b">Tail Behavior</text>

  <rect x="242" y="462" width="440" height="62" rx="6" fill="#fff5f5" stroke="#fecaca"/>
  <text x="254" y="486" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">One-Size-Fits-All Local-Disk Brokers</text>
  <text x="254" y="505" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#475569">Pays ultra-low-latency EBS/AZ prices even for analytics logs</text>

  <rect x="694" y="462" width="446" height="62" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="706" y="486" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#166534">Workload-Matched Broker Tiering</text>
  <text x="706" y="505" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#334155">&lt; 5 ms local NVMe/S3 Express vs. 200-500 ms S3-native</text>

  <!-- Bottom Migration Warning Strip -->
  <rect x="20" y="536" width="1120" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="34" y="560" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400e">Migration Trap: Upgrade Kafka &lt; 3.9 via 3.9 KRaft bridge before 4.0; diskless S3 trades ~300 ms p99 for 80% lower TCO.</text>
</svg>
