<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 550" width="1120" height="550" role="img" aria-labelledby="title desc">
  <title id="title">Stage 4a: In-Memory Cache Tier (Cache-Aside &amp; Read-Through)</title>
  <desc id="desc">Animated schematic of a Stage 4 Valkey or Redis cache-aside workflow showing both the green sub-millisecond cache hit fast-path and the amber cache miss path with singleflight coalescing, database read, and TTL jitter cache population.</desc>
  <defs>
    <style>
      .flow-green { stroke-dasharray: 8 6;  }
      .flow-amber { stroke-dasharray: 8 6;  }
      
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
        .smil-packet { display: none !important; }
      }
    </style>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1120" height="550" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>

  <!-- Header -->
  <line x1="24" y1="64" x2="1096" y2="64" stroke="#1c1917" stroke-width="1.2"/>
  
  <text x="24" y="29" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#1c1917">Stage 4 · In-Memory Cache Tier: Cache-Aside &amp; Read-Through (1M–3M DAU)</text>
  <text x="24" y="49" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#57534e">Absorb 80%–98% of hot reads in &lt;1 ms using Valkey 9.2 / Redis 8.10 while guarding against stampedes, stale races, and eviction storms</text>

  <!-- LEFT: WEB SERVER -->
  <g transform="translate(24, 108)">
    <rect x="0" y="0" width="236" height="302" rx="12" fill="#f0fdf9" stroke="#0f766e" stroke-width="2"/>
    <rect x="0" y="0" width="236" height="34" rx="12" fill="#065f46"/>
    <rect x="0" y="20" width="236" height="14" fill="#065f46"/>
    <text x="118" y="22" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Web Server Tier</text>

    <rect x="16" y="50" width="204" height="68" rx="6" fill="#ffffff" stroke="#99f6e4"/>
    <text x="28" y="70" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">Incoming Read Request</text>
    <text x="28" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#0f766e">GET /users/42/profile</text>
    <text x="28" y="106" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#44403c">Checks cache before DB</text>

    <rect x="16" y="132" width="204" height="72" rx="6" fill="#f0fdf9" stroke="#99f6e4"/>
    <text x="28" y="152" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#065f46">Singleflight Coalescing</text>
    <text x="28" y="170" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#44403c">Collapses N concurrent</text>
    <text x="28" y="185" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#44403c">cache misses on hot key</text>
    <text x="28" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#065f46">into 1 DB query</text>

    <rect x="16" y="218" width="204" height="68" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <text x="28" y="238" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400e">Fail-Open Degradation</text>
    <text x="28" y="256" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#44403c">Cache is NOT a SPOF:</text>
    <text x="28" y="272" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#92400e">Multi-AZ + warm-up cap</text>
  </g>

  <!-- TOP LANE: GREEN FAST-PATH (CACHE HIT) -->
  <g transform="translate(324, 86)">
    <rect x="0" y="0" width="772" height="156" rx="12" fill="#f0fdf9" stroke="#0f766e" stroke-width="2"/>
    <rect x="16" y="14" width="224" height="24" rx="12" fill="#0f766e"/>
    <text x="128" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">FAST-PATH · CACHE HIT (&lt; 1 ms)</text>

    <!-- Cache Cluster Box -->
    <rect x="24" y="52" width="290" height="86" rx="8" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
    <text x="38" y="74" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#065f46">Valkey 9.2 / Redis 8.10 Cluster</text>
    <text x="38" y="93" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#065f46">GET user:42 -&gt; HIT (0.4 ms)</text>
    <text x="38" y="112" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#44403c">Multi-AZ · Multi-threaded I/O</text>
    <text x="38" y="127" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#44403c">Eviction: W-TinyLFU / allkeys-lfu</text>

    <!-- Return Payload Box -->
    <rect x="444" y="52" width="304" height="86" rx="8" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
    <text x="458" y="74" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#065f46">Immediate Return to Client</text>
    <text x="458" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#0f766e">200 OK · Zero DB load</text>
    <text x="458" y="113" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#44403c">• 80%–98% of reads stop here</text>
    <text x="458" y="128" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#44403c">• Probabilistic XFetch early refresh</text>

    <path d="M 314 95 L 440 95" fill="none" stroke="#0f766e" stroke-width="2.4" class="flow-green" marker-end="url(#arr-green)"/>
    <circle class="smil-packet" r="5" fill="#0f766e" opacity="0">
      <animateMotion dur="1.3s" repeatCount="indefinite" path="M 314 95 L 440 95"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="1.3s" repeatCount="indefinite"/>
    </circle>
    <text x="377" y="84" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#065f46">HIT Return</text>
  </g>

  <!-- Step 1 Green Check Cache -->
  <path d="M 260 176 L 344 176" fill="none" stroke="#0f766e" stroke-width="2.4" class="flow-green" marker-end="url(#arr-green)"/>
  <circle class="smil-packet" r="5" fill="#0f766e" opacity="0">
    <animateMotion dur="1.2s" repeatCount="indefinite" path="M 260 176 L 344 176"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <g class="pulse-badge" transform="translate(294, 152)">
    <circle cx="0" cy="0" r="11" fill="#0f766e"/>
    <text x="0" y="4" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">1</text>
  </g>
  <text x="294" y="196" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#065f46">Check</text>

  <!-- BOTTOM LANE: AMBER MISS-PATH -->
  <g transform="translate(324, 266)">
    <rect x="0" y="0" width="772" height="172" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
    <rect x="16" y="14" width="278" height="24" rx="12" fill="#b45309"/>
    <text x="155" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">MISS-PATH · DB READ + POPULATE (5–20 ms)</text>

    <!-- 1. Cache Miss -->
    <rect x="20" y="54" width="206" height="98" rx="8" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
    <text x="34" y="76" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#92400e">1. Cache MISS</text>
    <text x="34" y="95" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#b45309">GET user:42 -&gt; nil</text>
    <text x="34" y="114" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#44403c">Acquire lease / singleflight</text>
    <text x="34" y="130" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#44403c">lock before querying DB</text>

    <!-- 2. Read DB -->
    <rect x="282" y="54" width="212" height="98" rx="8" fill="#f5f1e8" stroke="#0f766e" stroke-width="1.5"/>
    <text x="296" y="76" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#065f46">2. Read Database</text>
    <text x="296" y="95" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#065f46">SELECT * FROM users</text>
    <text x="296" y="114" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#44403c">Routes to Read Replica</text>
    <text x="296" y="130" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#44403c">(or Primary if LSN-pinned)</text>

    <!-- 3. Populate Cache -->
    <rect x="550" y="54" width="202" height="98" rx="8" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
    <text x="564" y="76" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#92400e">3. Populate + Jitter</text>
    <text x="564" y="95" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#b45309">SETEX 300s + rand(0..60s)</text>
    <text x="564" y="114" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#44403c">Prevents synchronized</text>
    <text x="564" y="130" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#44403c">expiry storms -&gt; return</text>

    <!-- Arrows between 1->2->3 -->
    <path d="M 226 103 L 278 103" fill="none" stroke="#b45309" stroke-width="2.2" class="flow-amber" marker-end="url(#arr-amber)"/>
    <path d="M 494 103 L 546 103" fill="none" stroke="#b45309" stroke-width="2.2" class="flow-amber" marker-end="url(#arr-amber)"/>
    <circle class="smil-packet" r="4.5" fill="#b45309" opacity="0">
      <animateMotion dur="2.2s" repeatCount="indefinite" path="M 226 103 L 278 103"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle class="smil-packet" r="4.5" fill="#b45309" opacity="0">
      <animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite" path="M 494 103 L 546 103"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Web -> Miss Path -->
  <path d="M 260 368 L 342 368" fill="none" stroke="#b45309" stroke-width="2.2" class="flow-amber" marker-end="url(#arr-amber)"/>
  <circle class="smil-packet" r="4.5" fill="#b45309" opacity="0">
    <animateMotion dur="1.6s" repeatCount="indefinite" path="M 260 368 L 342 368"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <g class="pulse-badge" transform="translate(294, 344)">
    <circle cx="0" cy="0" r="11" fill="#b45309"/>
    <text x="0" y="4" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">2</text>
  </g>
  <text x="294" y="388" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#b45309">Miss</text>

  <!-- Return path from 3. Populate back to Web -->
  <path d="M 975 420 L 975 450 L 142 450 L 142 414" fill="none" stroke="#0f766e" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr-blue)"/>
  <circle class="smil-packet" r="4.5" fill="#0f766e" opacity="0">
    <animateMotion dur="3.0s" repeatCount="indefinite" path="M 975 420 L 975 450 L 142 450 L 142 414"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="3.0s" repeatCount="indefinite"/>
  </circle>
  <g class="pulse-badge" transform="translate(564, 450)">
    <circle cx="0" cy="0" r="11" fill="#0f766e"/>
    <text x="0" y="4" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">3</text>
  </g>
  <text x="646" y="444" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#065f46">Return Fresh Data to Caller</text>

  <!-- Footer Notes: Stampede / Eviction / Staleness -->
  <rect x="24" y="466" width="1072" height="68" rx="8" fill="#f5f1e8" stroke="#d6d0c4" stroke-width="1"/>
  <text x="42" y="488" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#991b1b">Key Failure Modes &amp; Mitigations:</text>
  <text x="234" y="488" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#44403c"><tspan font-weight="700" fill="#b45309">Stampede:</tspan> Use singleflight + TTL jitter + XFetch.</text>
  <text x="536" y="488" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#44403c"><tspan font-weight="700" fill="#065f46">Eviction:</tspan> Size RAM for hot working set + W-TinyLFU.</text>
  <text x="866" y="488" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#44403c"><tspan font-weight="700" fill="#065f46">Staleness:</tspan> Memcache Leases / CDC.</text>
  <text x="42" y="514" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1c1917"><tspan font-weight="700">Takeaway:</tspan> Always guard cache-aside writes against concurrent stale overwrites using lease tokens or versioned keys, and never let cache restarts trigger an unthrottled DB stampede.</text>
</svg>
