<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Backend Architecture Patterns: Dependency Inversion, Outbox Decoupling, and CQRS / Serverless Trade-offs</title>
  <desc id="desc">Animated schematic illustrating three core backend architecture mechanics: Panel 1 shows Hexagonal Ports and Adapters enforcing inward dependency arrows toward the pure domain core alongside Modular Monolith strict schema ownership; Panel 2 shows Event-Driven Transactional Outbox committing domain state and event record in one ACID transaction with sequential relay and idempotent deduplication; Panel 3 shows CQRS write-to-read projection lag convergence alongside Serverless FaaS cold-start versus container crossover utilization.</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* 12s cycle across 3 panels */
    @keyframes p1-hl { 0%, 32% { stroke: #2563eb; stroke-width: 2.2; } 34%, 100% { stroke: #cbd5e1; stroke-width: 1.5; } }
    @keyframes p2-hl { 0%, 32% { stroke: #cbd5e1; stroke-width: 1.5; } 34%, 65% { stroke: #059669; stroke-width: 2.2; } 67%, 100% { stroke: #cbd5e1; stroke-width: 1.5; } }
    @keyframes p3-hl { 0%, 65% { stroke: #cbd5e1; stroke-width: 1.5; } 67%, 100% { stroke: #7c3aed; stroke-width: 2.2; } }

    @keyframes hex-pulse {
      0%, 32%  { opacity: 1; }
      35%, 100%{ opacity: 0.78; }
    }

    @keyframes outbox-pulse {
      0%, 33%  { opacity: 0.78; }
      35%, 65% { opacity: 1; }
      68%, 100%{ opacity: 0.78; }
    }

    @keyframes cqrs-pulse {
      0%, 66%  { opacity: 0.78; }
      68%, 99% { opacity: 1; }
      100%     { opacity: 0.78; }
    }

    .p1 { animation: p1-hl 12s linear infinite; }
    .p2 { animation: p2-hl 12s linear infinite; }
    .p3 { animation: p3-hl 12s linear infinite; }
    .h-foc { animation: hex-pulse 12s ease-in-out infinite; }
    .o-foc { animation: outbox-pulse 12s ease-in-out infinite; }
    .c-foc { animation: cqrs-pulse 12s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .p1, .p2, .p3, .h-foc, .o-foc, .c-foc { animation: none !important; opacity: 1 !important; }
    }
  </style>

  <!-- Canvas -->
  <rect x="0" y="0" width="1120" height="600" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="1120" height="60" rx="12" fill="#0f172a"/>
  <rect x="0" y="44" width="1120" height="16" fill="#0f172a"/>
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#f8fafc">Backend Architecture Patterns: Boundaries, Outbox &amp; CQRS / FaaS Mechanics</text>
  <text x="24" y="47" class="sans" font-size="12" fill="#94a3b8">M27 §1–§4 · Hexagonal Dependency Inversion &amp; Modular Schema Isolation · Atomic Outbox + Idempotent Consumer · CQRS Lag &amp; Serverless Crossover</text>

  <!-- PANEL 1: HEXAGONAL PORTS & ADAPTERS + MODULAR MONOLITH -->
  <rect x="24" y="76" width="344" height="448" rx="10" fill="#ffffff" class="p1"/>
  <text x="40" y="102" class="sans" font-size="13.5" font-weight="700" fill="#0f172a">1. Hexagonal Core &amp; Module Isolation</text>

  <g class="h-foc">
    <!-- Driving Adapters -->
    <rect x="40" y="118" width="148" height="48" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <text x="114" y="138" class="mono" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">HTTP / gRPC Adapter</text>
    <text x="114" y="155" class="mono" font-size="9.5" fill="#1e40af" text-anchor="middle">Driving (Primary)</text>

    <rect x="204" y="118" width="148" height="48" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <text x="278" y="138" class="mono" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">Queue / CLI Adapter</text>
    <text x="278" y="155" class="mono" font-size="9.5" fill="#1e40af" text-anchor="middle">Driving (Primary)</text>

    <!-- Arrows inward -->
    <line x1="114" y1="166" x2="144" y2="194" stroke="#2563eb" stroke-width="1.8"/>
    <line x1="278" y1="166" x2="248" y2="194" stroke="#2563eb" stroke-width="1.8"/>

    <!-- Pure Domain Core Hexagon-styled Box -->
    <rect x="48" y="196" width="296" height="114" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="196" y="218" class="sans" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">Pure Domain Core (Zero Infra Imports)</text>
    <text x="64" y="240" class="mono" font-size="10" fill="#334155">Inbound Port:  PlaceOrderUseCase</text>
    <text x="64" y="258" class="mono" font-size="10" fill="#334155">Outbound Port: OrderRepoPort (IF)</text>
    <text x="64" y="276" class="mono" font-size="10" fill="#334155">Outbound Port: PaymentGatewayPort</text>
    <text x="64" y="296" class="sans" font-size="10" font-weight="700" fill="#047857">All deps point INWARD → test in 0.5 ms</text>

    <!-- Arrows from Driven Adapters pointing UP/INWARD to Ports -->
    <line x1="114" y1="336" x2="144" y2="310" stroke="#059669" stroke-width="1.8"/>
    <line x1="278" y1="336" x2="248" y2="310" stroke="#059669" stroke-width="1.8"/>
    <text x="196" y="328" class="mono" font-size="9.5" font-weight="700" fill="#065f46" text-anchor="middle">implements port ↑</text>

    <!-- Driven Adapters -->
    <rect x="40" y="338" width="148" height="48" rx="6" fill="#fffbeb" stroke="#d97706"/>
    <text x="114" y="358" class="mono" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">PostgreSQL Adapter</text>
    <text x="114" y="375" class="mono" font-size="9.5" fill="#b45309" text-anchor="middle">Prod Driven (Secondary)</text>

    <rect x="204" y="338" width="148" height="48" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="278" y="358" class="mono" font-size="10" font-weight="700" fill="#5b21b6" text-anchor="middle">In-Memory Fake</text>
    <text x="278" y="375" class="mono" font-size="9.5" fill="#6d28d9" text-anchor="middle">Deterministic Test Double</text>
  </g>

  <!-- Modular Monolith Schema Rule -->
  <rect x="40" y="400" width="312" height="108" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="54" y="420" class="sans" font-size="11" font-weight="700" fill="#0f172a">Modular Monolith Invariant</text>
  <text x="54" y="439" class="mono" font-size="10" fill="#334155">Tables(M_i) ∩ Tables(M_j) = ∅</text>
  <text x="54" y="457" class="mono" font-size="10" fill="#334155">Zero cross-module SQL joins;</text>
  <text x="54" y="475" class="mono" font-size="10" fill="#047857">ACID local tx + CI import boundary gate</text>
  <text x="54" y="494" class="sans" font-size="10" font-weight="700" fill="#1e3a8a">Pre-wired seam for 1-sprint service split</text>

  <!-- PANEL 2: EVENT-DRIVEN TRANSACTIONAL OUTBOX -->
  <rect x="384" y="76" width="352" height="448" rx="10" fill="#ffffff" class="p2"/>
  <text x="400" y="102" class="sans" font-size="13.5" font-weight="700" fill="#0f172a">2. Event-Driven Outbox &amp; Deduplication</text>

  <g class="o-foc">
    <!-- Trap box -->
    <rect x="400" y="118" width="320" height="62" rx="7" fill="#fff1f2" stroke="#e11d48"/>
    <text x="414" y="138" class="sans" font-size="11" font-weight="700" fill="#9f1239">Dual-Write Split-Brain Trap</text>
    <text x="414" y="156" class="mono" font-size="10" fill="#334155">DB.commit() OK + Broker.publish() FAIL</text>
    <text x="414" y="171" class="mono" font-size="9.5" fill="#be123c">→ silent lost event (or phantom on rollback)</text>

    <!-- Single ACID Tx -->
    <rect x="400" y="192" width="320" height="92" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
    <text x="414" y="212" class="sans" font-size="11" font-weight="700" fill="#065f46">1. Single Local ACID Transaction</text>
    <text x="414" y="232" class="mono" font-size="10" fill="#334155">INSERT INTO orders (...) VALUES (...)</text>
    <text x="414" y="250" class="mono" font-size="10" fill="#334155">INSERT INTO outbox (id, agg_id, seq, ev)</text>
    <text x="414" y="270" class="mono" font-size="10" font-weight="700" fill="#047857">COMMIT → both persist or both roll back</text>

    <!-- Relay -> Partitioned Broker -->
    <line x1="560" y1="284" x2="560" y2="306" stroke="#059669" stroke-width="1.8"/>
    <rect x="400" y="308" width="320" height="72" rx="7" fill="#eff6ff" stroke="#2563eb"/>
    <text x="414" y="328" class="sans" font-size="11" font-weight="700" fill="#1e3a8a">2. CDC / Polling Relay → Partitioned Log</text>
    <text x="414" y="346" class="mono" font-size="10" fill="#334155">ORDER BY seq ASC · key = aggregate_id</text>
    <text x="414" y="364" class="mono" font-size="10" fill="#1e40af">At-least-once delivery (retries safe)</text>

    <!-- Idempotent Consumer -->
    <line x1="560" y1="380" x2="560" y2="402" stroke="#2563eb" stroke-width="1.8"/>
    <rect x="400" y="404" width="320" height="104" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="414" y="424" class="sans" font-size="11" font-weight="700" fill="#5b21b6">3. Idempotent Consumer Guard</text>
    <text x="414" y="444" class="mono" font-size="10" fill="#334155">INSERT INTO processed_events(event_id)</text>
    <text x="414" y="462" class="mono" font-size="10" fill="#334155">ON CONFLICT DO NOTHING + seq check</text>
    <text x="414" y="482" class="mono" font-size="10" font-weight="700" fill="#6d28d9">Duplicate / out-of-order replay → NO-OP</text>
    <text x="414" y="498" class="sans" font-size="9.5" fill="#4c1d95">Poison pills isolated to DLQ after max retries</text>
  </g>

  <!-- PANEL 3: CQRS LAG CONVERGENCE & SERVERLESS CROSSOVER -->
  <rect x="752" y="76" width="344" height="448" rx="10" fill="#ffffff" class="p3"/>
  <text x="768" y="102" class="sans" font-size="13.5" font-weight="700" fill="#0f172a">3. CQRS Projection &amp; FaaS Crossover</text>

  <g class="c-foc">
    <!-- CQRS Split -->
    <rect x="768" y="118" width="312" height="184" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="782" y="138" class="sans" font-size="11" font-weight="700" fill="#0f172a">CQRS Write / Read Split</text>

    <rect x="782" y="148" width="136" height="58" rx="6" fill="#ecfdf5" stroke="#059669"/>
    <text x="850" y="168" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">Command Model</text>
    <text x="850" y="185" class="mono" font-size="9.5" fill="#334155" text-anchor="middle">v_write = 42 (ACID)</text>
    <text x="850" y="199" class="mono" font-size="9" fill="#047857" text-anchor="middle">Enforces invariants</text>

    <rect x="932" y="148" width="136" height="58" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <text x="1000" y="168" class="mono" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">Read Projection</text>
    <text x="1000" y="185" class="mono" font-size="9.5" fill="#334155" text-anchor="middle">v_read &lt;= v_write</text>
    <text x="1000" y="199" class="mono" font-size="9" fill="#1e40af" text-anchor="middle">Denormalized view</text>

    <line x1="918" y1="177" x2="932" y2="177" stroke="#7c3aed" stroke-width="2"/>

    <rect x="782" y="218" width="286" height="72" rx="6" fill="#fffbeb" stroke="#d97706"/>
    <text x="794" y="237" class="mono" font-size="10" font-weight="700" fill="#92400e">Lag Window: Δt = t_proj − t_commit</text>
    <text x="794" y="255" class="mono" font-size="9.5" fill="#334155">Read-your-writes: pass minVersion=42</text>
    <text x="794" y="272" class="mono" font-size="9.5" fill="#b45309">or push SSE delta on projection apply</text>

    <!-- Serverless Crossover -->
    <rect x="768" y="314" width="312" height="194" rx="8" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="782" y="336" class="sans" font-size="11" font-weight="700" fill="#5b21b6">Serverless (FaaS) vs Always-On Pods</text>
    <text x="782" y="357" class="mono" font-size="10" fill="#065f46">Spiky / &lt; 15% duty cycle → FaaS wins</text>
    <text x="782" y="375" class="mono" font-size="9.5" fill="#334155">Scale-to-zero, zero idle compute bill</text>
    <text x="782" y="399" class="mono" font-size="10" fill="#9f1239">Steady &gt; 25% duty cycle → Containers win</text>
    <text x="782" y="417" class="mono" font-size="9.5" fill="#334155">Avoids cold starts (100–900 ms) and</text>
    <text x="782" y="434" class="mono" font-size="9.5" fill="#334155">DB connection exhaustion (needs Proxy)</text>
    <rect x="782" y="450" width="284" height="44" rx="5" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="794" y="468" class="mono" font-size="9.5" font-weight="700" fill="#5b21b6">Rule: Start Modular Monolith (Hexagonal)</text>
    <text x="794" y="484" class="mono" font-size="9.5" fill="#334155">Split via Outbox/CQRS only on trigger.</text>
  </g>

  <!-- FOOTER -->
  <rect x="24" y="542" width="1072" height="44" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="42" y="568" class="sans" font-size="11.5" font-weight="600" fill="#1e3a8a">Takeaway: Enforce domain boundaries inside one process first; pay distribution costs (Outbox, CQRS, Microservices, FaaS) only when a concrete trigger fires.</text>
</svg>
