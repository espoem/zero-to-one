<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Backend Architecture Patterns: Boundaries, Outbox &amp; CQRS / FaaS Mechanics</title>
  <desc id="desc">Static Editorial Paper diagram across three columns: Panel 1 shows Hexagonal Ports and Adapters enforcing inward dependency inversion and Modular Monolith disjoint table ownership; Panel 2 shows Transactional Outbox atomic state-plus-event commit, CDC relay, and idempotent consumer deduplication; Panel 3 shows CQRS write/read lag convergence and Serverless FaaS vs container utilization crossover.</desc>
  <defs>
    <marker id="ed-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,2 L9,5 L1,8" fill="none" stroke="#1c1917" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ed-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,2 L9,5 L1,8" fill="none" stroke="#0f766e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .ed-serif { font-family: Georgia, "Times New Roman", serif; }
    .ed-sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .ed-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>

  <rect x="0" y="0" width="1120" height="560" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>
  <text x="32" y="32" class="ed-mono" font-size="10.5" fill="#78716c" letter-spacing="1.4">MODULE 27 · HEXAGONAL PORTS · MODULAR SCHEMA ISOLATION · OUTBOX · CQRS &amp; FAAS</text>
  <text x="32" y="56" class="ed-serif" font-size="19.5" font-weight="700" fill="#1c1917">Backend Architecture Patterns: Boundary Invariants &amp; Crossover Trade-Offs</text>
  <line x1="32" y1="68" x2="1088" y2="68" stroke="#1c1917" stroke-width="1.2"/>

  <!-- COLUMN 1: HEXAGONAL + MODULAR MONOLITH -->
  <text x="32" y="94" class="ed-mono" font-size="10.5" font-weight="700" fill="#0f766e" letter-spacing="0.8">1 · HEXAGONAL CORE &amp; MODULE BOUNDARIES</text>
  <line x1="32" y1="101" x2="364" y2="101" stroke="#d6d0c4"/>

  <g transform="translate(32, 114)">
    <rect x="0" y="0" width="158" height="46" rx="3" fill="#ffffff" stroke="#a8a29e"/>
    <text x="79" y="20" class="ed-sans" font-size="11.5" font-weight="700" fill="#1c1917" text-anchor="middle">HTTP / gRPC</text>
    <text x="79" y="36" class="ed-mono" font-size="9.5" fill="#78716c" text-anchor="middle">Driving Adapter</text>

    <rect x="174" y="0" width="158" height="46" rx="3" fill="#ffffff" stroke="#a8a29e"/>
    <text x="253" y="20" class="ed-sans" font-size="11.5" font-weight="700" fill="#1c1917" text-anchor="middle">Queue / CLI</text>
    <text x="253" y="36" class="ed-mono" font-size="9.5" fill="#78716c" text-anchor="middle">Driving Adapter</text>

    <line x1="79" y1="46" x2="112" y2="74" stroke="#1c1917" stroke-width="1.2" marker-end="url(#ed-arr)"/>
    <line x1="253" y1="46" x2="220" y2="74" stroke="#1c1917" stroke-width="1.2" marker-end="url(#ed-arr)"/>

    <rect x="8" y="78" width="316" height="106" rx="4" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.4"/>
    <text x="166" y="100" class="ed-serif" font-size="13.5" font-weight="700" fill="#0f766e" text-anchor="middle">Pure Domain Core + Owned Ports</text>
    <line x1="24" y1="108" x2="308" y2="108" stroke="#99f6e4"/>
    <text x="24" y="126" class="ed-mono" font-size="10" fill="#1c1917">r(Core) = r(Ports) &gt; r(Adapters)</text>
    <text x="24" y="144" class="ed-sans" font-size="11" fill="#44403c">• Inbound: PlaceOrderUseCase</text>
    <text x="24" y="161" class="ed-sans" font-size="11" fill="#44403c">• Outbound: OrderRepoPort · PaymentPort</text>
    <text x="24" y="177" class="ed-mono" font-size="9.5" fill="#0f766e">Zero infra imports → 0.5 ms unit tests</text>

    <line x1="88" y1="218" x2="88" y2="188" stroke="#0f766e" stroke-width="1.2" marker-end="url(#ed-arr-teal)"/>
    <line x1="244" y1="218" x2="244" y2="188" stroke="#0f766e" stroke-width="1.2" marker-end="url(#ed-arr-teal)"/>
    <text x="166" y="208" class="ed-mono" font-size="9.5" fill="#0f766e" text-anchor="middle">implements port ↑</text>

    <rect x="0" y="222" width="158" height="46" rx="3" fill="#ffffff" stroke="#a8a29e"/>
    <text x="79" y="242" class="ed-sans" font-size="11.5" font-weight="700" fill="#1c1917" text-anchor="middle">PostgreSQL Repo</text>
    <text x="79" y="258" class="ed-mono" font-size="9.5" fill="#78716c" text-anchor="middle">Prod Driven</text>

    <rect x="174" y="222" width="158" height="46" rx="3" fill="#fffbeb" stroke="#b45309"/>
    <text x="253" y="242" class="ed-sans" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle">In-Memory Fake</text>
    <text x="253" y="258" class="ed-mono" font-size="9.5" fill="#b45309" text-anchor="middle">Test Double</text>

    <!-- Modular Monolith box -->
    <rect x="0" y="286" width="332" height="96" rx="3" fill="#ffffff" stroke="#d6d0c4"/>
    <text x="14" y="307" class="ed-sans" font-size="12" font-weight="700" fill="#1c1917">Modular Monolith Data Invariant</text>
    <text x="14" y="326" class="ed-mono" font-size="10" fill="#0f766e">WriteTables(M_i) ∩ WriteTables(M_j) = ∅</text>
    <text x="14" y="344" class="ed-sans" font-size="11" fill="#44403c">No cross-module SQL joins or FK locks;</text>
    <text x="14" y="362" class="ed-sans" font-size="11" fill="#44403c">local ACID tx + pre-wired extraction seam.</text>
  </g>

  <line x1="382" y1="88" x2="382" y2="500" stroke="#e7e2d8"/>

  <!-- COLUMN 2: OUTBOX -->
  <text x="400" y="94" class="ed-mono" font-size="10.5" font-weight="700" fill="#b45309" letter-spacing="0.8">2 · TRANSACTIONAL OUTBOX &amp; DEDUP</text>
  <line x1="400" y1="101" x2="732" y2="101" stroke="#d6d0c4"/>

  <g transform="translate(400, 114)">
    <rect x="0" y="0" width="332" height="52" rx="3" fill="#fef2f2" stroke="#dc2626"/>
    <text x="14" y="19" class="ed-sans" font-size="11.5" font-weight="700" fill="#991b1b">Avoid Dual-Write Split-Brain:</text>
    <text x="14" y="38" class="ed-mono" font-size="10" fill="#7f1d1d">DB.commit() + Kafka.send() loses events</text>

    <rect x="0" y="68" width="332" height="86" rx="3" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.3"/>
    <text x="14" y="89" class="ed-sans" font-size="12" font-weight="700" fill="#0f766e">1. Single Local ACID Transaction</text>
    <text x="14" y="108" class="ed-mono" font-size="10" fill="#1c1917">INSERT INTO orders (...) VALUES (...);</text>
    <text x="14" y="125" class="ed-mono" font-size="10" fill="#1c1917">INSERT INTO outbox (agg_id, seq, ev);</text>
    <text x="14" y="143" class="ed-mono" font-size="10" font-weight="700" fill="#0f766e">COMMIT → atomic or full rollback</text>

    <line x1="166" y1="154" x2="166" y2="180" stroke="#1c1917" stroke-width="1.2" marker-end="url(#ed-arr)"/>

    <rect x="0" y="184" width="332" height="72" rx="3" fill="#ffffff" stroke="#1c1917"/>
    <text x="14" y="205" class="ed-sans" font-size="12" font-weight="700" fill="#1c1917">2. CDC / WAL Relay → Partitioned Log</text>
    <text x="14" y="224" class="ed-mono" font-size="10" fill="#44403c">ORDER BY seq ASC · key = aggregate_id</text>
    <text x="14" y="242" class="ed-sans" font-size="11" fill="#78716c">At-least-once broker retries safe</text>

    <line x1="166" y1="256" x2="166" y2="282" stroke="#1c1917" stroke-width="1.2" marker-end="url(#ed-arr)"/>

    <rect x="0" y="286" width="332" height="96" rx="3" fill="#fffbeb" stroke="#b45309"/>
    <text x="14" y="307" class="ed-sans" font-size="12" font-weight="700" fill="#92400e">3. Idempotent Consumer Guard</text>
    <text x="14" y="326" class="ed-mono" font-size="10" fill="#1c1917">INSERT processed_events(event_id)</text>
    <text x="14" y="344" class="ed-mono" font-size="10" fill="#1c1917">ON CONFLICT DO NOTHING + seq gate</text>
    <text x="14" y="364" class="ed-sans" font-size="11" fill="#92400e">Duplicate/stale replay → NO-OP + DLQ</text>
  </g>

  <line x1="750" y1="88" x2="750" y2="500" stroke="#e7e2d8"/>

  <!-- COLUMN 3: CQRS + SERVERLESS CROSSOVER -->
  <text x="768" y="94" class="ed-mono" font-size="10.5" font-weight="700" fill="#1c1917" letter-spacing="0.8">3 · CQRS LAG &amp; SERVERLESS CROSSOVER</text>
  <line x1="768" y1="101" x2="1088" y2="101" stroke="#d6d0c4"/>

  <g transform="translate(768, 114)">
    <rect x="0" y="0" width="320" height="178" rx="3" fill="#ffffff" stroke="#d6d0c4"/>
    <text x="14" y="22" class="ed-sans" font-size="12" font-weight="700" fill="#1c1917">CQRS Write / Read Separation</text>

    <rect x="14" y="34" width="138" height="58" rx="3" fill="#f0fdf9" stroke="#0f766e"/>
    <text x="83" y="54" class="ed-mono" font-size="10" font-weight="700" fill="#0f766e" text-anchor="middle">Command Model</text>
    <text x="83" y="71" class="ed-mono" font-size="9.5" fill="#1c1917" text-anchor="middle">v_write = 42 (ACID)</text>

    <line x1="152" y1="63" x2="166" y2="63" stroke="#1c1917" stroke-width="1.2" marker-end="url(#ed-arr)"/>

    <rect x="168" y="34" width="138" height="58" rx="3" fill="#faf8f5" stroke="#1c1917"/>
    <text x="237" y="54" class="ed-mono" font-size="10" font-weight="700" fill="#1c1917" text-anchor="middle">Read Projection</text>
    <text x="237" y="71" class="ed-mono" font-size="9.5" fill="#44403c" text-anchor="middle">v_read ≤ v_write</text>

    <rect x="14" y="106" width="292" height="58" rx="3" fill="#fffbeb" stroke="#b45309"/>
    <text x="26" y="125" class="ed-mono" font-size="10" font-weight="700" fill="#92400e">Lag Window: Δt = t_proj − t_commit</text>
    <text x="26" y="143" class="ed-mono" font-size="9.5" fill="#44403c">Read-your-writes: check minVersion=42</text>

    <!-- Serverless Crossover -->
    <rect x="0" y="196" width="320" height="186" rx="3" fill="#ffffff" stroke="#1c1917"/>
    <text x="14" y="218" class="ed-sans" font-size="12" font-weight="700" fill="#1c1917">Serverless (FaaS) vs Containers</text>
    <line x1="14" y1="226" x2="306" y2="226" stroke="#d6d0c4"/>
    <text x="14" y="246" class="ed-mono" font-size="10" font-weight="700" fill="#0f766e">Spiky / &lt; 15% duty → FaaS wins</text>
    <text x="14" y="263" class="ed-sans" font-size="11" fill="#44403c">Scale-to-zero; no idle pod cost</text>
    <text x="14" y="287" class="ed-mono" font-size="10" font-weight="700" fill="#dc2626">Steady &gt; 25% duty → Containers win</text>
    <text x="14" y="304" class="ed-sans" font-size="11" fill="#44403c">Avoids 100–900 ms cold starts &amp;</text>
    <text x="14" y="320" class="ed-sans" font-size="11" fill="#44403c">DB connection storms (needs Proxy)</text>
    <text x="14" y="346" class="ed-mono" font-size="9.5" fill="#1c1917">Rule: Start Modular Monolith (Hexagonal);</text>
    <text x="14" y="362" class="ed-mono" font-size="9.5" fill="#78716c">split Outbox/CQRS/MS only on trigger.</text>
  </g>

  <line x1="32" y1="516" x2="1088" y2="516" stroke="#e7e2d8"/>
  <text x="32" y="538" class="ed-sans" font-size="11.5" fill="#57534e">Enforce in-process module &amp; hexagonal port invariants first; pay distributed Outbox, CQRS, Microservice, or FaaS costs only when quantified triggers fire.</text>
</svg>
