<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" width="1120" height="580" role="img" aria-labelledby="title desc">
  <title id="title">Anti-Stalking Privacy Defense: Thwarting 3-Circle Trilateration with Laplace Noise and Hysteresis</title>
  <desc id="desc">Animated location-privacy architecture neutralizing the 3-circle trilateration stalking attack: Step 1 shows how raw meter distances from three spoofed points P1, P2, P3 intersect at a victim's exact 1-meter coordinates; Step 2 applies 0.5-mile distance bucketing (floor less than or equal to 0.5 miles) widening thin circles into thick multi-km2 annuli; Step 3 injects Planar Laplace epsilon-differential-privacy polar jitter (r, theta); Step 4 enforces a 5.0-mile enter vs. 5.2-mile exit hysteresis deadband and rejects impossible GPS velocity teleports exceeding 300 m/s.</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* 12s cycle:
       0-25%  (0-3s): Step 1 — 3-circle exact trilateration attack (1m pinpoint)
       25-50% (3-6s): Step 2 — 0.5-mile bucketing widens circles into thick annuli
       50-75% (6-9s): Step 3 — Planar Laplace polar noise (r, theta) blurs true point
       75-100%(9-12s):Step 4 — 5.0/5.2 mi hysteresis deadband + >300 m/s spoof block
    */

    @keyframes annuli-widen {
      0%, 24%   { stroke-width: 1.8; stroke-opacity: 0.9; stroke: #dc2626; }
      32%, 96%  { stroke-width: 22; stroke-opacity: 0.86; stroke: #0f766e; }
      100%      { stroke-width: 1.8; stroke-opacity: 0.9; stroke: #dc2626; }
    }

    @keyframes laplace-blur {
      0%, 48%   { transform: translate(0px, 0px); opacity: 0.86; }
      56%, 72%  { transform: translate(26px, -18px); opacity: 1; }
      78%, 96%  { transform: translate(-18px, 14px); opacity: 0.9; }
      100%      { transform: translate(0px, 0px); opacity: 0.86; }
    }

    @keyframes hyst-dot {
      0%, 74%   { transform: translateX(0px); }
      82%       { transform: translateX(36px); }
      90%       { transform: translateX(18px); }
      96%, 100% { transform: translateX(0px); }
    }

    @keyframes s1-hl { 0%, 24% { stroke: #dc2626; stroke-width: 2.2; opacity: 1; } 25%, 100% { stroke: #d6d0c4; stroke-width: 1; opacity: 0.86; } }
    @keyframes s2-hl { 0%, 24% { stroke: #d6d0c4; stroke-width: 1; opacity: 0.86; } 25%, 49% { stroke: #0f766e; stroke-width: 2.2; opacity: 1; } 50%, 100% { stroke: #d6d0c4; stroke-width: 1; opacity: 0.86; } }
    @keyframes s3-hl { 0%, 49% { stroke: #d6d0c4; stroke-width: 1; opacity: 0.86; } 50%, 74% { stroke: #0f766e; stroke-width: 2.2; opacity: 1; } 75%, 100% { stroke: #d6d0c4; stroke-width: 1; opacity: 0.86; } }
    @keyframes s4-hl { 0%, 74% { stroke: #d6d0c4; stroke-width: 1; opacity: 0.86; } 75%, 100% { stroke: #0f766e; stroke-width: 2.2; opacity: 1; } }

    .ann { animation: annuli-widen 12s ease-in-out infinite; }
    .lap { animation: laplace-blur 12s ease-in-out infinite; }
    .hdot { animation: hyst-dot 12s ease-in-out infinite; }
    .s1 { animation: s1-hl 12s linear infinite; }
    .s2 { animation: s2-hl 12s linear infinite; }
    .s3 { animation: s3-hl 12s linear infinite; }
    .s4 { animation: s4-hl 12s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .ann, .lap, .hdot, .s1, .s2, .s3, .s4 { animation: none !important; }
      .ann { stroke-width: 20 !important; stroke-opacity: 0.86 !important; stroke: #0f766e !important; }
      .lap { transform: translate(22px, -14px) !important; opacity: 1 !important; }
      .hdot { transform: translateX(24px) !important; }
      .s1, .s2, .s3, .s4 { opacity: 1 !important; }
    }
  </style>

  <defs>
    <clipPath id="map-clip">
      <rect x="42" y="118" width="490" height="316" rx="8"/>
    </clipPath>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1120" height="580" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>

  <!-- Header -->
  <line x1="24" y1="62" x2="1096" y2="62" stroke="#1c1917" stroke-width="1.2"/>
  
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#1c1917" font-family="Georgia, 'Times New Roman', serif">Anti-Stalking Privacy Defense: Thwarting 3-Circle Trilateration</text>
  <text x="24" y="47" class="sans" font-size="12" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">M23 §5.4 · 0.5-Mile Distance Buckets (≤ 0.5 mi Floor) · Planar Laplace ε-DP Noise · 5.0 / 5.2 mi Hysteresis · v &gt; 300 m/s Spoof Block</text>

  <!-- LEFT PANEL: TRILATERATION GEOMETRY VS QUANTIZED ANNULI -->
  <rect x="24" y="76" width="526" height="432" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="42" y="102" class="sans" font-size="14" font-weight="700" fill="#1c1917">1. Attack Geometry vs. Quantized Annuli + Laplace Blur</text>

  <rect x="42" y="118" width="490" height="316" rx="8" fill="#faf8f5" stroke="#d6d0c4"/>
  <g clip-path="url(#map-clip)">
    <!-- Subtle grid -->
    <line x1="164" y1="118" x2="164" y2="434" stroke="#e7e2d8"/>
    <line x1="286" y1="118" x2="286" y2="434" stroke="#e7e2d8"/>
    <line x1="408" y1="118" x2="408" y2="434" stroke="#e7e2d8"/>
    <line x1="42" y1="224" x2="532" y2="224" stroke="#e7e2d8"/>
    <line x1="42" y1="330" x2="532" y2="330" stroke="#e7e2d8"/>

    <!-- Victim true coordinate at (286, 276) -->
    <!-- P1=(186, 226) r=111.8; P2=(386, 226) r=111.8; P3=(286, 376) r=100 -->
    <circle cx="186" cy="226" r="112" fill="none" class="ann"/>
    <circle cx="386" cy="226" r="112" fill="none" class="ann"/>
    <circle cx="286" cy="376" r="100" fill="none" class="ann"/>

    <!-- Attacker Spoofed Points P1, P2, P3 -->
    <circle cx="186" cy="226" r="6" fill="#dc2626"/>
    <rect x="122" y="198" width="76" height="20" rx="4" fill="#fef2f2" stroke="#dc2626"/>
    <text x="160" y="212" class="mono" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">Spoof P1</text>

    <circle cx="386" cy="226" r="6" fill="#dc2626"/>
    <rect x="376" y="198" width="76" height="20" rx="4" fill="#fef2f2" stroke="#dc2626"/>
    <text x="414" y="212" class="mono" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">Spoof P2</text>

    <circle cx="286" cy="376" r="6" fill="#dc2626"/>
    <rect x="248" y="388" width="76" height="20" rx="4" fill="#fef2f2" stroke="#dc2626"/>
    <text x="286" y="402" class="mono" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">Spoof P3</text>

    <!-- True Victim Center -->
    <circle cx="286" cy="276" r="5.5" fill="#1c1917"/>
    <text x="286" y="294" class="mono" font-size="10" font-weight="700" fill="#1c1917" text-anchor="middle">True (x, y)</text>

    <!-- Laplace Perturbed Coordinate -->
    <g class="lap">
      <circle cx="286" cy="276" r="24" fill="#0f766e" fill-opacity="0.16" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="4 2"/>
      <circle cx="286" cy="276" r="5" fill="#0f766e"/>
      <rect x="296" y="252" width="118" height="20" rx="4" fill="#f5f1e8" stroke="#0f766e"/>
      <text x="355" y="266" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">Laplace (x', y')</text>
    </g>
  </g>

  <rect x="42" y="444" width="490" height="50" rx="7" fill="#f0fdf9" stroke="#99f6e4"/>
  <text x="56" y="464" class="mono" font-size="10" font-weight="700" fill="#065f46">Annuli intersection covers multi-km² zone instead of 1-meter house!</text>
  <text x="56" y="481" class="sans" font-size="10" fill="#065f46">Distances &lt; 0.5 mi clamp to "&lt;= 0.5 miles" floor; step = 0.5 mi.</text>

  <!-- RIGHT PANEL: HYSTERESIS DEADBAND & LAYERED DEFENSES -->
  <rect x="570" y="76" width="526" height="432" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="588" y="102" class="sans" font-size="14" font-weight="700" fill="#1c1917">2. Boundary Hysteresis Deadband &amp; Layered Controls</text>

  <!-- Hysteresis Deadband Axis -->
  <rect x="588" y="118" width="490" height="106" rx="8" fill="#faf8f5" stroke="#d6d0c4"/>
  <text x="602" y="138" class="sans" font-size="11.5" font-weight="700" fill="#1c1917">Boundary Hysteresis Deadband (5.0 mi Enter vs. 5.2 mi Exit)</text>

  <rect x="606" y="152" width="180" height="32" rx="4" fill="#f0fdf9" stroke="#0f766e"/>
  <text x="696" y="172" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">d ≤ 5.0 mi (VISIBLE)</text>

  <rect x="786" y="152" width="144" height="32" rx="0" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="858" y="172" class="mono" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">DEADBAND [5.0..5.2]</text>

  <rect x="930" y="152" width="132" height="32" rx="4" fill="#fef2f2" stroke="#dc2626"/>
  <text x="996" y="172" class="mono" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">&gt; 5.2 LEFT_RADIUS</text>

  <!-- Oscillating Friend Dot inside Deadband -->
  <g class="hdot">
    <circle cx="826" cy="196" r="6" fill="#0f766e" stroke="#ffffff" stroke-width="1.5"/>
  </g>
  <text x="836" y="214" class="sans" font-size="10" fill="#44403c" text-anchor="middle">Walking near 5.0 mi causes zero flicker &amp; hides exact boundary crossing.</text>

  <!-- 4 Defense Step Cards -->
  <rect x="588" y="236" width="490" height="58" rx="7" fill="#fef2f2" class="s1"/>
  <text x="602" y="256" class="sans" font-size="11.5" font-weight="700" fill="#991b1b">1. Threat: Raw Meter Trilateration ((x−x_i)² + (y−y_i)² = r_i²)</text>
  <text x="602" y="275" class="mono" font-size="10" fill="#44403c">3 spoofed GPS coordinates in 10s pinpoint victim to &lt; 1 meter.</text>

  <rect x="588" y="302" width="490" height="58" rx="7" fill="#f0fdf9" class="s2"/>
  <text x="602" y="322" class="sans" font-size="11.5" font-weight="700" fill="#065f46">2. Coarse 0.5-Mile Distance Bucketing (quantizeDistanceMiles)</text>
  <text x="602" y="341" class="mono" font-size="10" fill="#44403c">Clamps &lt; 0.5 mi to "&lt;= 0.5 mi"; widens circles into thick rings.</text>

  <rect x="588" y="368" width="490" height="58" rx="7" fill="#f5f1e8" class="s3"/>
  <text x="602" y="388" class="sans" font-size="11.5" font-weight="700" fill="#065f46">3. Planar Laplace Geo-Indistinguishability (ε-Differential Privacy)</text>
  <text x="602" y="407" class="mono" font-size="10" fill="#44403c">Adds polar noise (r, θ) before computing friend distances.</text>

  <rect x="588" y="434" width="490" height="58" rx="7" fill="#f0fdf9" class="s4"/>
  <text x="602" y="454" class="sans" font-size="11.5" font-weight="700" fill="#065f46">4. Hysteresis Deadband + Velocity Spoof Gate (v &gt; 300 m/s)</text>
  <text x="602" y="473" class="mono" font-size="10" fill="#44403c">Rejects impossible GPS teleports across 3 non-collinear points.</text>

  <!-- FOOTER -->
  <rect x="24" y="520" width="1072" height="44" rx="8" fill="#f0fdf9" stroke="#99f6e4" stroke-width="1"/>
  <text x="42" y="546" class="sans" font-size="11.5" font-weight="600" fill="#065f46">Takeaway: Coarse 0.5-mi bucketing, Planar Laplace noise, 5.0/5.2-mi hysteresis, and &gt;300 m/s spoof rejection close 3-circle trilateration stalking.</text>
</svg>
