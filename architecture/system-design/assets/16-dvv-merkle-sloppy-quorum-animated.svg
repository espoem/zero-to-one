<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Dotted Version Vectors, Sloppy Quorum Hinted Handoff, and Merkle Tree Anti-Entropy</title>
  <desc id="desc">Animated step-by-step Dynamo and modern KV store consistency mechanics: Dotted Version Vectors separating single-write dots from causal contexts to reconcile concurrent siblings without false conflicts; Sloppy Quorum writing hint envelopes to standby node N4 during N2 outage and draining via Hinted Handoff upon recovery; and Merkle Tree top-down hash traversal locating a single divergent bucket in O(k log B) comparisons.</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* 12s cycle:
       0-33%  (0-4s):  Phase 1 — DVV sibling detection and merge
       33-66% (4-8s):  Phase 2 — Sloppy Quorum hint write and Hinted Handoff replay
       66-100%(8-12s): Phase 3 — Merkle Tree top-down hash diff (skip clean, descend mismatch)
    */

    @keyframes p1-hl { 0%, 32% { stroke: #0f766e; stroke-width: 2.2; } 34%, 100% { stroke: #d6d0c4; stroke-width: 1.5; } }
    @keyframes p2-hl { 0%, 32% { stroke: #d6d0c4; stroke-width: 1.5; } 34%, 65% { stroke: #b45309; stroke-width: 2.2; } 67%, 100% { stroke: #d6d0c4; stroke-width: 1.5; } }
    @keyframes p3-hl { 0%, 65% { stroke: #d6d0c4; stroke-width: 1.5; } 67%, 100% { stroke: #0f766e; stroke-width: 2.2; } }

    @keyframes hint-pkt {
      0%, 34% { transform: translate(0px, 0px); opacity: 0; }
      38%     { transform: translate(0px, 0px); opacity: 1; }
      48%     { transform: translate(195px, 64px); opacity: 1; }
      52%     { transform: translate(195px, 64px); opacity: 0.9; }
      62%     { transform: translate(195px, -34px); opacity: 1; }
      66%, 100% { transform: translate(195px, -34px); opacity: 0; }
    }

    @keyframes dvv-merge-pop {
      0%, 14% { opacity: 0.86; }
      18%, 32%{ opacity: 1; }
      36%, 100%{ opacity: 0.6; }
    }

    .p1 { animation: p1-hl 12s linear infinite; }
    .p2 { animation: p2-hl 12s linear infinite; }
    .p3 { animation: p3-hl 12s linear infinite; }
    .hpkt { animation: hint-pkt 12s ease-in-out infinite; }
    .dvv-m { animation: dvv-merge-pop 12s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .p1, .p2, .p3, .hpkt, .mk-hi, .dvv-m { animation: none !important; }
      .hpkt { transform: translate(195px, 64px) !important; opacity: 1 !important; }
      .mk-hi, .dvv-m { opacity: 1 !important; }
    }
  </style>

  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#44403c"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1120" height="600" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>

  <!-- Header -->
  <line x1="24" y1="62" x2="1096" y2="62" stroke="#1c1917" stroke-width="1.2"/>
  
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#1c1917" font-family="Georgia, 'Times New Roman', serif">Distributed KV Store: Dotted Version Vectors, Sloppy Quorums &amp; Merkle Sync</text>
  <text x="24" y="47" class="sans" font-size="12" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">M16 §4 · DVV (dot + context) Sibling Reconciliation · Hinted Handoff Replay · Merkle Tree O(k log B) Anti-Entropy Repair</text>

  <!-- PANEL 1 (TOP-LEFT): DOTTED VERSION VECTORS -->
  <rect x="24" y="76" width="526" height="240" rx="10" fill="#ffffff" class="p1"/>
  <text x="42" y="100" class="sans" font-size="13.5" font-weight="700" fill="#1c1917">1. Dotted Version Vectors (DVV) Sibling Reconciliation</text>

  <!-- Ancestor D2 -->
  <rect x="42" y="114" width="134" height="46" rx="6" fill="#f0fdf9" stroke="#0f766e"/>
  <text x="109" y="133" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">D2: ctx [S1:2]</text>
  <text x="109" y="149" class="mono" font-size="10" fill="#44403c" text-anchor="middle">Shared ancestor</text>

  <line x1="176" y1="128" x2="210" y2="118" stroke="#44403c" stroke-width="1.5" marker-end="url(#arr-slate)"/>
  <line x1="176" y1="146" x2="210" y2="168" stroke="#44403c" stroke-width="1.5" marker-end="url(#arr-slate)"/>

  <!-- Concurrent Siblings D3 & D4 -->
  <rect x="216" y="106" width="166" height="44" rx="6" fill="#fffbeb" stroke="#b45309"/>
  <text x="299" y="124" class="mono" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">D3 dot:(S2,1)</text>
  <text x="299" y="140" class="mono" font-size="10" fill="#92400e" text-anchor="middle">ctx:[S1:2] · val=v3</text>

  <rect x="216" y="156" width="166" height="44" rx="6" fill="#fffbeb" stroke="#b45309"/>
  <text x="299" y="174" class="mono" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">D4 dot:(S3,1)</text>
  <text x="299" y="190" class="mono" font-size="10" fill="#92400e" text-anchor="middle">ctx:[S1:2] · val=v4</text>

  <line x1="382" y1="128" x2="404" y2="146" stroke="#b45309" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <line x1="382" y1="178" x2="404" y2="158" stroke="#b45309" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <!-- Sibling Merge D5 -->
  <g class="dvv-m">
    <rect x="410" y="114" width="124" height="78" rx="6" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.5"/>
    <text x="472" y="133" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">300 Siblings</text>
    <text x="472" y="150" class="mono" font-size="10" fill="#44403c" text-anchor="middle">Client merge →</text>
    <text x="472" y="167" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">D5 dot:(S1,3)</text>
    <text x="472" y="182" class="mono" font-size="10" fill="#065f46" text-anchor="middle">ctx:[S1:3,S2:1,S3:1]</text>
  </g>

  <!-- DVV Insight Box -->
  <rect x="42" y="210" width="492" height="92" rx="7" fill="#f5f1e8" stroke="#d6d0c4"/>
  <text x="56" y="230" class="mono" font-size="10.5" font-weight="700" fill="#065f46">Why DVV beats naive Vector Clocks &amp; LWW:</text>
  <text x="56" y="249" class="sans" font-size="10.5" fill="#44403c">• Separates single-write dot (node, seq) from compact causal context.</text>
  <text x="56" y="267" class="sans" font-size="10.5" fill="#44403c">• Eliminates false siblings when concurrent clients share 1 coordinator.</text>
  <text x="56" y="285" class="sans" font-size="10.5" fill="#991b1b">• Avoids LWW NTP clock-skew trap (250 ms clock lag silently drops writes).</text>

  <!-- PANEL 2 (TOP-RIGHT): SLOPPY QUORUM & HINTED HANDOFF -->
  <rect x="570" y="76" width="526" height="240" rx="10" fill="#ffffff" class="p2"/>
  <text x="588" y="100" class="sans" font-size="13.5" font-weight="700" fill="#1c1917">2. Sloppy Quorum (W=2) &amp; Hinted Handoff Replay</text>

  <!-- Coordinator -->
  <rect x="588" y="138" width="118" height="58" rx="7" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.5"/>
  <text x="647" y="162" class="sans" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">Coordinator</text>
  <text x="647" y="180" class="mono" font-size="10" fill="#065f46" text-anchor="middle">PUT k=v (W=2)</text>

  <!-- Home N1 -->
  <rect x="780" y="108" width="132" height="38" rx="6" fill="#f0fdf9" stroke="#0f766e"/>
  <text x="846" y="131" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">Home N1 (OK)</text>

  <!-- Home N2 (Down -> Recovered) -->
  <rect x="780" y="156" width="132" height="44" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="846" y="175" class="mono" font-size="10.5" font-weight="700" fill="#991b1b" text-anchor="middle">Home N2</text>
  <text x="846" y="191" class="mono" font-size="10" fill="#991b1b" text-anchor="middle">Down → Up via Gossip</text>

  <!-- Standby N4 -->
  <rect x="780" y="210" width="132" height="44" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="846" y="229" class="mono" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="middle">Standby N4</text>
  <text x="846" y="245" class="mono" font-size="10" fill="#b45309" text-anchor="middle">Hint {target: N2}</text>

  <!-- Arrows -->
  <line x1="706" y1="150" x2="774" y2="128" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="706" y1="168" x2="774" y2="176" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-rose)"/>
  <line x1="706" y1="184" x2="774" y2="226" stroke="#b45309" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <!-- Handoff Arrow N4 -> N2 -->
  <path d="M 912,232 C 946,232 946,178 918,178" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="954" y="200" class="mono" font-size="10" font-weight="700" fill="#065f46">4. Hinted</text>
  <text x="954" y="213" class="mono" font-size="10" font-weight="700" fill="#065f46">Handoff</text>
  <text x="954" y="226" class="mono" font-size="10" fill="#065f46">&amp; purge</text>

  <!-- Animated Hint Packet -->
  <g class="hpkt">
    <rect x="601" y="156" width="96" height="22" rx="4" fill="#b45309" stroke="#ffffff" stroke-width="1.5"/>
    <text x="649" y="171" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">HINT(N2)</text>
  </g>

  <!-- Sloppy Quorum Warning -->
  <rect x="588" y="264" width="490" height="38" rx="6" fill="#fef2f2" stroke="#fda4af"/>
  <text x="602" y="287" class="sans" font-size="10.5" font-weight="600" fill="#991b1b">Trade-off: Sloppy quorum breaks W+R &gt; N until N4 drains hints to N2 (3h hint TTL).</text>

  <!-- PANEL 3 (BOTTOM): MERKLE TREE ANTI-ENTROPY -->
  <rect x="24" y="330" width="1072" height="196" rx="10" fill="#ffffff" class="p3"/>
  <text x="42" y="354" class="sans" font-size="13.5" font-weight="700" fill="#1c1917">3. Merkle Tree Top-Down Anti-Entropy Repair (B = 64 Buckets, 1,024 Keys → Only 13 Nodes Compared!)</text>

  <!-- Root -->
  <rect x="396" y="366" width="328" height="34" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="560" y="387" class="mono" font-size="10.5" font-weight="700" fill="#991b1b" text-anchor="middle">Root [0..63]: A=0x9F ≠ B=0x4C (Descend)</text>

  <!-- Level 1 -->
  <line x1="480" y1="400" x2="290" y2="424" stroke="#0f766e" stroke-width="1.5"/>
  <line x1="640" y1="400" x2="800" y2="424" stroke="#dc2626" stroke-width="2"/>

  <rect x="116" y="424" width="340" height="32" rx="6" fill="#f0fdf9" stroke="#0f766e"/>
  <text x="286" y="444" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">Left [0..31]: 0x11 == 0x11 (SKIP 512 keys)</text>

  <rect x="640" y="424" width="340" height="32" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="810" y="444" class="mono" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">Right [32..63]: 0x2A ≠ 0x8E (Descend)</text>

  <!-- Level 2 -->
  <line x1="720" y1="456" x2="550" y2="478" stroke="#0f766e" stroke-width="1.5"/>
  <line x1="880" y1="456" x2="920" y2="478" stroke="#dc2626" stroke-width="2"/>

  <rect x="382" y="478" width="290" height="32" rx="6" fill="#f0fdf9" stroke="#0f766e"/>
  <text x="527" y="498" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">Sub [32..47]: 0x77 == 0x77 (SKIP 256)</text>

  <g class="mk-hi">
    <rect x="692" y="478" width="376" height="32" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
    <text x="880" y="498" class="mono" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">Leaf Bucket 51: 0x3C ≠ 0xD1 → Stream Bucket 51 Only!</text>
  </g>

  <!-- FOOTER -->
  <rect x="24" y="540" width="1072" height="44" rx="8" fill="#f0fdf9" stroke="#99f6e4" stroke-width="1"/>
  <text x="42" y="566" class="sans" font-size="11.5" font-weight="600" fill="#065f46">Takeaway: DVVs reconcile causal siblings without clock skew, Sloppy Quorums keep writes available via Hinted Handoff, and Merkle Trees repair divergence in O(k log B).</text>
</svg>
