<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" width="1120" height="580" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid Celebrity Fan-Out and k-Way Min-Heap Merge</title>
  <desc id="desc">Animated step-by-step visualization of Hybrid Celebrity Fan-Out: regular accounts with fewer than 10,000 followers push posts on write into followers' Redis timelines for O(1) reads, while celebrity accounts with 10,000 or more followers write once and are merged at read time via an O(N log k) k-way min-heap merge with post-ID deduplication.</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* 12s cycle:
       0-45%:  Write Path — Alice (F=420 below 10k) fans out push to followers; Star (F=50M above 10k) writes once
       50-95%: Read Path — Follower Bob fetches pushed timeline + Star/VIP pull lists -> k-way heap merge
    */
    @keyframes push-packet {
      0%, 6% { transform: translate(0px, 0px); opacity: 0; }
      14% { transform: translate(0px, 0px); opacity: 1; }
      38% { transform: translate(152px, 0px); opacity: 1; }
      45%, 100% { transform: translate(152px, 0px); opacity: 0; }
    }
    @keyframes heap-step1 {
      0%, 48% { opacity: 0.86; stroke-width: 1; }
      52%, 68% { opacity: 1; stroke: #7c3aed; stroke-width: 2.5; }
      72%, 100% { opacity: 0.85; stroke-width: 1.5; }
    }
    @keyframes heap-step2 {
      0%, 66% { opacity: 0.86; stroke-width: 1; }
      70%, 84% { opacity: 1; stroke: #2563eb; stroke-width: 2.5; }
      88%, 100% { opacity: 0.85; stroke-width: 1.5; }
    }
    @keyframes heap-step3 {
      0%, 82% { opacity: 0.86; stroke-width: 1; }
      86%, 98% { opacity: 1; stroke: #059669; stroke-width: 2.5; }
      100% { opacity: 0.86; stroke-width: 1; }
    }

    .push-dot { animation: push-packet 12s ease-in-out infinite; }
    .hm1 { animation: heap-step1 12s linear infinite; }
    .hm2 { animation: heap-step2 12s linear infinite; }
    .hm3 { animation: heap-step3 12s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .push-dot, .hm1, .hm2, .hm3 {
        animation: none !important;
      }
      .push-dot { opacity: 1 !important; transform: translate(76px, 0px) !important; }
      .hm1, .hm2, .hm3 { opacity: 1 !important; }
    }
  </style>

  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arr-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1120" height="580" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="1120" height="60" rx="12" fill="#0f172a"/>
  <rect x="0" y="44" width="1120" height="16" fill="#0f172a"/>
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#f8fafc">Hybrid Celebrity Fan-Out &amp; Read-Time k-Way Heap Merge</text>
  <text x="24" y="47" class="sans" font-size="12" fill="#94a3b8">Push-on-write for regular users (F &lt; 10,000) · Pull-on-read O(N log k) merge for celebrities (avoids 50M-write storms)</text>

  <!-- LEFT PANEL: WRITE PATH THRESHOLD -->
  <rect x="24" y="76" width="524" height="426" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="42" y="102" class="sans" font-size="14" font-weight="700" fill="#0f172a">1. Write Path: Hysteresis Gate (Promote ≥ 10k, Demote &lt; 9k)</text>

  <!-- Branch A: Regular User Push -->
  <rect x="42" y="122" width="488" height="164" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="58" y="144" class="sans" font-size="12.5" font-weight="700" fill="#1e3a8a">A. Regular Author (Alice · F = 420 &lt; 10,000) → PUSH</text>

  <rect x="58" y="162" width="112" height="58" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="114" y="185" class="sans" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">Post P101</text>
  <text x="114" y="203" class="mono" font-size="10" fill="#475569" text-anchor="middle">t = 98 (Alice)</text>

  <line x1="170" y1="191" x2="342" y2="191" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <g class="push-dot">
    <circle cx="182" cy="191" r="8" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
  </g>
  <text x="256" y="178" class="mono" font-size="10" font-weight="700" fill="#1e40af" text-anchor="middle">420 ZADD writes</text>

  <!-- Follower Redis Timelines -->
  <rect x="350" y="152" width="164" height="34" rx="5" fill="#ecfdf5" stroke="#059669"/>
  <text x="432" y="173" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">timeline:Bob ← P101</text>
  <rect x="350" y="194" width="164" height="34" rx="5" fill="#ecfdf5" stroke="#059669"/>
  <text x="432" y="215" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">timeline:Dan ← P101</text>
  <text x="58" y="270" class="sans" font-size="10.5" fill="#1e3a8a">Follower read path is O(1) single Redis ZREVRANGE query.</text>

  <!-- Branch B: Celebrity User Pull -->
  <rect x="42" y="302" width="488" height="184" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="58" y="324" class="sans" font-size="12.5" font-weight="700" fill="#92400e">B. Celebrity Author (Star · F = 50,000,000 ≥ 10,000) → PULL</text>

  <rect x="58" y="342" width="112" height="58" rx="6" fill="#ffffff" stroke="#d97706"/>
  <text x="114" y="365" class="sans" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle">Post P999</text>
  <text x="114" y="383" class="mono" font-size="10" fill="#475569" text-anchor="middle">t = 99 (Star)</text>

  <line x1="170" y1="371" x2="292" y2="371" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)"/>
  <text x="232" y="358" class="mono" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">1 write O(1)</text>

  <rect x="300" y="342" width="214" height="58" rx="6" fill="#ffffff" stroke="#d97706"/>
  <text x="407" y="365" class="mono" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="middle">author_tl:Star ← P999</text>
  <text x="407" y="385" class="sans" font-size="10" fill="#b45309" text-anchor="middle">Avoids 50M fan-out writes!</text>

  <text x="58" y="428" class="sans" font-size="10.5" fill="#78350f">• Hysteresis (10k promote / 9k demote) stops threshold flapping.</text>
  <text x="58" y="448" class="sans" font-size="10.5" fill="#78350f">• Sharded follower counters track threshold crossings reliably.</text>
  <text x="58" y="468" class="sans" font-size="10.5" fill="#78350f">• Read path deduplicates by post_id across transition overlap.</text>

  <!-- RIGHT PANEL: READ PATH K-WAY MERGE -->
  <rect x="572" y="76" width="524" height="426" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="590" y="102" class="sans" font-size="14" font-weight="700" fill="#0f172a">2. Read Path (Bob): k-Way Min-Heap Merge O(N log k)</text>
  <text x="590" y="120" class="sans" font-size="11" fill="#475569">Merges Bob's pre-pushed timeline with k followed celebrity lists</text>

  <!-- Input Sorted Lists (k=3) -->
  <rect x="592" y="140" width="216" height="54" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="604" y="160" class="mono" font-size="10.5" font-weight="700" fill="#1e3a8a">timeline:Bob (pushed)</text>
  <text x="604" y="180" class="mono" font-size="10.5" fill="#334155">[ t=98 (P101), t=91 (P088) ]</text>

  <rect x="592" y="206" width="216" height="54" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="604" y="226" class="mono" font-size="10.5" font-weight="700" fill="#5b21b6">author_tl:Star (celeb 1)</text>
  <text x="604" y="246" class="mono" font-size="10.5" fill="#334155">[ t=99 (P999), t=94 (P950) ]</text>

  <rect x="592" y="272" width="216" height="54" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <text x="604" y="292" class="mono" font-size="10.5" font-weight="700" fill="#065f46">author_tl:VIP2 (celeb 2)</text>
  <text x="604" y="312" class="mono" font-size="10.5" fill="#334155">[ t=96 (P702), t=90 (P680) ]</text>

  <!-- Arrows into Heap -->
  <line x1="808" y1="167" x2="862" y2="216" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <line x1="808" y1="233" x2="862" y2="233" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arr-violet)"/>
  <line x1="808" y1="299" x2="862" y2="250" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- Size-k Heap Box -->
  <rect x="868" y="186" width="208" height="94" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="972" y="210" class="sans" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Priority Heap (size k=3)</text>
  <text x="972" y="232" class="mono" font-size="10.5" fill="#5b21b6" text-anchor="middle">Pop max ts + advance ptr</text>
  <text x="972" y="252" class="mono" font-size="10" fill="#475569" text-anchor="middle">Dedupe seen post_id</text>
  <text x="972" y="268" class="mono" font-size="10" fill="#059669" text-anchor="middle">O(N log k) total</text>

  <!-- Merged Output Feed -->
  <text x="592" y="356" class="sans" font-size="12" font-weight="700" fill="#0f172a">Bob's Merged Chronological Feed Output (Top 3)</text>

  <rect x="592" y="368" width="484" height="32" rx="6" fill="#f5f3ff" stroke="#7c3aed" class="hm1"/>
  <text x="606" y="389" class="mono" font-size="10.5" font-weight="700" fill="#5b21b6">1. Pop t=99 · P999 (Star — pulled)  →  advance Star ptr to t=94</text>

  <rect x="592" y="408" width="484" height="32" rx="6" fill="#eff6ff" stroke="#2563eb" class="hm2"/>
  <text x="606" y="429" class="mono" font-size="10.5" font-weight="700" fill="#1e3a8a">2. Pop t=98 · P101 (Alice — pushed) →  advance Bob ptr to t=91</text>

  <rect x="592" y="448" width="484" height="32" rx="6" fill="#ecfdf5" stroke="#059669" class="hm3"/>
  <text x="606" y="469" class="mono" font-size="10.5" font-weight="700" fill="#065f46">3. Pop t=96 · P702 (VIP2 — pulled)  →  advance VIP2 ptr to t=90</text>

  <!-- FOOTER -->
  <rect x="24" y="516" width="1072" height="46" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="42" y="544" class="sans" font-size="11.5" font-weight="600" fill="#5b21b6">Takeaway: Hybrid Fan-Out keeps 99.9% of reads O(1) via push while bounding celebrity write amplification via read-time k-way merge.</text>
</svg>
