<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Hotel Inventory: Half-Open Intervals, Littlewood/EMSR_b Overbooking, and Canonical Lock Ordering</title>
  <desc id="desc">Animated step-by-step hospitality inventory correctness mechanics: half-open [checkIn, checkOut) intervals preventing checkout-night theft compared to SQL BETWEEN; Littlewood critical-fractile and Belobaba EMSR_b controlled 10% integer overbooking floor cap ((total_inventory * 110) / 100); and canonical ORDER BY hotel_id, room_type_id, date ASC row locking eliminating Coffman circular-wait SQLSTATE 40P01 deadlocks.</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* 12s cycle:
       0-33%  (0-4s):  Phase 1 — Half-open [June 01, June 03) vs BETWEEN bug
       33-66% (4-8s):  Phase 2 — Littlewood / EMSR_b 10% integer cap (109->110 OK, 111->409)
       66-100%(8-12s): Phase 3 — Canonical ORDER BY date ASC defeats 40P01 deadlock
    */

    @keyframes p1-hl { 0%, 32% { stroke: #0f766e; stroke-width: 2.2; } 34%, 100% { stroke: #d6d0c4; stroke-width: 1.5; } }
    @keyframes p2-hl { 0%, 32% { stroke: #d6d0c4; stroke-width: 1.5; } 34%, 65% { stroke: #b45309; stroke-width: 2.2; } 67%, 100% { stroke: #d6d0c4; stroke-width: 1.5; } }
    @keyframes p3-hl { 0%, 65% { stroke: #d6d0c4; stroke-width: 1.5; } 67%, 100% { stroke: #0f766e; stroke-width: 2.2; } }

    @keyframes emsr-fill {
      0%, 34%  { width: 224px; fill: #0f766e; }
      46%, 54% { width: 254px; fill: #0f766e; }
      58%, 66% { width: 274px; fill: #dc2626; }
      70%, 100%{ width: 254px; fill: #0f766e; }
    }

    .p1 { animation: p1-hl 12s linear infinite; }
    .p2 { animation: p2-hl 12s linear infinite; }
    .p3 { animation: p3-hl 12s linear infinite; }
    .cap-bar { animation: emsr-fill 12s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .p1, .p2, .p3, .cap-bar, .lk-ok { animation: none !important; }
      .cap-bar { width: 254px !important; fill: #0f766e !important; }
      .lk-ok { opacity: 1 !important; }
    }
  </style>

  <defs>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1120" height="600" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>

  <!-- Header -->
  <line x1="24" y1="62" x2="1096" y2="62" stroke="#1c1917" stroke-width="1.2"/>
  
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#1c1917" font-family="Georgia, 'Times New Roman', serif">Hotel Inventory: Half-Open [checkIn, checkOut), EMSR_b Cap &amp; Canonical Locks</text>
  <text x="24" y="47" class="sans" font-size="12" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">M19 §2.3 &amp; §3.2 · date &gt;= checkIn AND date &lt; checkOut · Floor Cap ⌊I·(100+p)/100⌋ · ORDER BY hotel_id, room_type_id, date ASC</text>

  <!-- PANEL 1 (TOP-LEFT): HALF-OPEN [checkIn, checkOut) -->
  <rect x="24" y="76" width="526" height="222" rx="10" fill="#ffffff" class="p1"/>
  <text x="42" y="100" class="sans" font-size="13.5" font-weight="700" fill="#1c1917">1. Half-Open [checkIn, checkOut) vs. SQL BETWEEN Bug</text>

  <!-- Calendar Header -->
  <rect x="44" y="114" width="118" height="28" rx="4" fill="#f5f1e8" stroke="#d6d0c4"/>
  <text x="103" y="132" class="mono" font-size="10.5" font-weight="700" fill="#44403c" text-anchor="middle">June 01</text>
  <rect x="166" y="114" width="118" height="28" rx="4" fill="#f5f1e8" stroke="#d6d0c4"/>
  <text x="225" y="132" class="mono" font-size="10.5" font-weight="700" fill="#44403c" text-anchor="middle">June 02</text>
  <rect x="288" y="114" width="118" height="28" rx="4" fill="#f5f1e8" stroke="#d6d0c4"/>
  <text x="347" y="132" class="mono" font-size="10.5" font-weight="700" fill="#44403c" text-anchor="middle">June 03</text>
  <rect x="410" y="114" width="118" height="28" rx="4" fill="#f5f1e8" stroke="#d6d0c4"/>
  <text x="469" y="132" class="mono" font-size="10.5" font-weight="700" fill="#44403c" text-anchor="middle">June 04</text>

  <!-- Bug Row: BETWEEN -->
  <rect x="44" y="150" width="362" height="42" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="56" y="167" class="mono" font-size="10" font-weight="700" fill="#991b1b">BUG: BETWEEN '06-01' AND '06-03' (Locks 3 nights!)</text>
  <text x="56" y="183" class="sans" font-size="10" fill="#991b1b">Steals June 03 checkout night → 33% lost occupancy</text>
  <rect x="412" y="150" width="116" height="42" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="470" y="175" class="mono" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">June 03 BLOCKED</text>

  <!-- Standard Row: Half-Open -->
  <rect x="44" y="202" width="240" height="42" rx="6" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.5"/>
  <text x="54" y="219" class="mono" font-size="10" font-weight="700" fill="#065f46">Guest A: [06-01, 06-03)</text>
  <text x="54" y="235" class="mono" font-size="10" fill="#065f46">date &gt;= $1 AND date &lt; $2</text>

  <rect x="288" y="202" width="240" height="42" rx="6" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.5"/>
  <text x="298" y="219" class="mono" font-size="10" font-weight="700" fill="#065f46">Guest B: [06-03, 06-05)</text>
  <text x="298" y="235" class="sans" font-size="10" fill="#065f46">Checkout 11AM → Clean handoff!</text>

  <rect x="44" y="252" width="484" height="32" rx="5" fill="#faf8f5" stroke="#d6d0c4"/>
  <text x="56" y="272" class="mono" font-size="10" fill="#44403c">Assert rows_affected == (checkOut − checkIn) days, else ROLLBACK.</text>

  <!-- PANEL 2 (TOP-RIGHT): LITTLEWOOD / EMSR_b OVERBOOKING -->
  <rect x="570" y="76" width="526" height="222" rx="10" fill="#ffffff" class="p2"/>
  <text x="588" y="100" class="sans" font-size="13.5" font-weight="700" fill="#1c1917">2. Littlewood / EMSR_b Protection &amp; 10% Integer Cap</text>

  <!-- Capacity Bar -->
  <text x="588" y="124" class="mono" font-size="10" font-weight="700" fill="#44403c">Physical I = 100 rooms · Overbooking p = 10% · Cap = (100 × 110) / 100 = 110</text>
  <rect x="588" y="132" width="280" height="24" rx="5" fill="#e7e2d8" stroke="#d6d0c4"/>
  <rect x="588" y="132" width="224" height="24" rx="5" class="cap-bar"/>
  <!-- Threshold line at I=100 (x=588 + 232 = 820) and Cap=110 (x=842) -->
  <line x1="818" y1="128" x2="818" y2="162" stroke="#1c1917" stroke-width="2" stroke-dasharray="3 2"/>
  <line x1="842" y1="128" x2="842" y2="162" stroke="#dc2626" stroke-width="2"/>
  <text x="880" y="148" class="mono" font-size="10" font-weight="700" fill="#065f46">110 OK · 111 → 409 CHECK</text>

  <!-- EMSR_b Fare Buckets -->
  <rect x="588" y="168" width="156" height="44" rx="6" fill="#f0fdf9" stroke="#99f6e4"/>
  <text x="666" y="186" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">Advance $180</text>
  <text x="666" y="202" class="mono" font-size="10" fill="#44403c" text-anchor="middle">Capped below y_2</text>

  <rect x="754" y="168" width="156" height="44" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="832" y="186" class="mono" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">Flexible $240</text>
  <text x="832" y="202" class="mono" font-size="10" fill="#44403c" text-anchor="middle">Protected y_2 rooms</text>

  <rect x="920" y="168" width="158" height="44" rx="6" fill="#f0fdf9" stroke="#99f6e4"/>
  <text x="999" y="186" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">Corporate $420</text>
  <text x="999" y="202" class="mono" font-size="10" fill="#44403c" text-anchor="middle">Protected y_1 rooms</text>

  <rect x="588" y="220" width="490" height="64" rx="7" fill="#f5f1e8" stroke="#d6d0c4"/>
  <text x="602" y="239" class="mono" font-size="10.5" font-weight="700" fill="#065f46">Littlewood Critical Fractile: P(X ≥ b) ≥ C_walk / (R + C_walk)</text>
  <text x="602" y="257" class="sans" font-size="10" fill="#44403c">Balances perishable empty-room loss ($0) vs. guest walk penalty ($350–$600).</text>
  <text x="602" y="273" class="mono" font-size="10" fill="#991b1b">Never use float 1.1 * I (1.1 * 10 = 11.000000000000002); use integer floor!</text>

  <!-- PANEL 3 (BOTTOM): COFFMAN DEADLOCK VS CANONICAL LOCK ORDERING -->
  <rect x="24" y="314" width="1072" height="214" rx="10" fill="#ffffff" class="p3"/>
  <text x="42" y="338" class="sans" font-size="13.5" font-weight="700" fill="#1c1917">3. Eliminating Multi-Night Row Deadlocks: Unsorted Circular Wait vs. Canonical Lock Ordering</text>

  <!-- Left: Unsorted Bug (40P01) -->
  <rect x="42" y="352" width="490" height="162" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="58" y="374" class="sans" font-size="12" font-weight="700" fill="#991b1b">UNSORTED BUG → Coffman Circular Wait (SQLSTATE 40P01)</text>

  <rect x="64" y="388" width="180" height="44" rx="6" fill="#ffffff" stroke="#dc2626"/>
  <text x="154" y="407" class="mono" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">Tx A locks June 01</text>
  <text x="154" y="423" class="mono" font-size="10" fill="#991b1b" text-anchor="middle">waits for June 02 →</text>

  <rect x="330" y="388" width="180" height="44" rx="6" fill="#ffffff" stroke="#dc2626"/>
  <text x="420" y="407" class="mono" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">Tx B locks June 02</text>
  <text x="420" y="423" class="mono" font-size="10" fill="#991b1b" text-anchor="middle">← waits for June 01</text>

  <line x1="244" y1="402" x2="324" y2="402" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-r)"/>
  <line x1="330" y1="420" x2="250" y2="420" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-r)"/>

  <rect x="64" y="446" width="446" height="52" rx="6" fill="#fef2f2" stroke="#fda4af"/>
  <text x="78" y="466" class="mono" font-size="10" font-weight="700" fill="#991b1b">DEADLOCK! DB Lock Manager aborts victim tx (40P01).</text>
  <text x="78" y="484" class="sans" font-size="10" fill="#991b1b">Triggered by unsorted IN (...) lists or reverse itinerary edits.</text>

  <!-- Right: Canonical ASC Ordering -->
  <g class="lk-ok">
    <rect x="560" y="352" width="518" height="162" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.8"/>
    <text x="576" y="374" class="sans" font-size="12" font-weight="700" fill="#065f46">CANONICAL FIX → ORDER BY hotel_id, room_type_id, date ASC</text>

    <rect x="578" y="388" width="228" height="44" rx="6" fill="#ffffff" stroke="#0f766e"/>
    <text x="692" y="407" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">Tx A: Lock June 01 → June 02</text>
    <text x="692" y="423" class="mono" font-size="10" fill="#065f46" text-anchor="middle">reserved: 109 → 110 (COMMIT)</text>

    <line x1="806" y1="410" x2="834" y2="410" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-g)"/>

    <rect x="840" y="388" width="220" height="44" rx="6" fill="#ffffff" stroke="#0f766e"/>
    <text x="950" y="407" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">Tx B: Queues on June 01</text>
    <text x="950" y="423" class="mono" font-size="10" fill="#991b1b" text-anchor="middle">Wakes: 110+1 &gt; 110 → 409</text>

    <rect x="578" y="446" width="482" height="52" rx="6" fill="#f0fdf9" stroke="#99f6e4"/>
    <text x="592" y="466" class="mono" font-size="10" font-weight="700" fill="#065f46">Zero Circular Wait! Every writer acquires PK locks monotonically.</text>
    <text x="592" y="484" class="sans" font-size="10" fill="#065f46">Sharding by hotel_id keeps all [checkIn, checkOut) nights on 1 local shard.</text>
  </g>

  <!-- FOOTER -->
  <rect x="24" y="542" width="1072" height="44" rx="8" fill="#f0fdf9" stroke="#99f6e4" stroke-width="1"/>
  <text x="42" y="568" class="sans" font-size="11.5" font-weight="600" fill="#065f46">Takeaway: Half-open [checkIn, checkOut) protects occupancy, integer EMSR_b caps optimize yield, and canonical ASC lock ordering eliminates 40P01 deadlocks.</text>
</svg>
