<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Google Maps: 4^z Tile Pyramid, CH vs. CRP, HMM Viterbi &amp; Super-Tile Rerouting</title>
  <desc id="desc">Animated Google Maps algorithmic subsystems: Web Mercator EPSG:3857 4^z tile pyramid across zoom 0 to 21; Contraction Hierarchies static shortcut edges versus Customizable Route Planning (CRP) less than 1 second cell overlay refresh; HMM Viterbi map matching using emission and heading continuity to prevent elevated highway mis-snapping; and Hierarchical Super-Tile ancestor chain indexing (at most 22 lookups) for incident reroute WebSocket push.</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* 12s cycle:
       0-25%  (0-3s): Q1 — Web Mercator 4^z pyramid drill-down
       25-50% (3-6s): Q2 — CH vs CRP live traffic sub-1s cell refresh
       50-75% (6-9s): Q3 — HMM Viterbi heading continuity snaps to I-80 E
       75-100%(9-12s):Q4 — Super-Tile ancestor walk + WebSocket reroute
    */

    @keyframes q1-hl { 0%, 24% { stroke: #0f766e; stroke-width: 2.2; } 25%, 100% { stroke: #d6d0c4; stroke-width: 1.5; } }
    @keyframes q2-hl { 0%, 24% { stroke: #d6d0c4; stroke-width: 1.5; } 25%, 49% { stroke: #b45309; stroke-width: 2.2; } 50%, 100% { stroke: #d6d0c4; stroke-width: 1.5; } }
    @keyframes q3-hl { 0%, 49% { stroke: #d6d0c4; stroke-width: 1.5; } 50%, 74% { stroke: #0f766e; stroke-width: 2.2; } 75%, 100% { stroke: #d6d0c4; stroke-width: 1.5; } }
    @keyframes q4-hl { 0%, 74% { stroke: #d6d0c4; stroke-width: 1.5; } 75%, 100% { stroke: #0f766e; stroke-width: 2.2; } }

    @keyframes car-move {
      0%, 48%  { transform: translateX(0px); opacity: 0.86; }
      52%      { transform: translateX(0px); opacity: 1; }
      72%, 96% { transform: translateX(170px); opacity: 1; }
      100%     { transform: translateX(0px); opacity: 0.86; }
    }

    @keyframes crp-flash {
      0%, 25%  { fill: #f0fdf9; stroke: #0f766e; }
      32%, 48% { fill: #fffbeb; stroke: #b45309; }
      52%, 100%{ fill: #f0fdf9; stroke: #0f766e; }
    }

    .q1 { animation: q1-hl 12s linear infinite; }
    .q2 { animation: q2-hl 12s linear infinite; }
    .q3 { animation: q3-hl 12s linear infinite; }
    .q4 { animation: q4-hl 12s linear infinite; }
    .car { animation: car-move 12s ease-in-out infinite; }
    .crp-cell { animation: crp-flash 12s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .q1, .q2, .q3, .q4, .car, .crp-cell, .ws-pop { animation: none !important; }
      .car { transform: translateX(95px) !important; opacity: 1 !important; }
      .ws-pop { opacity: 1 !important; }
    }
  </style>

  <defs>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-v" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1120" height="600" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>

  <!-- Header -->
  <line x1="24" y1="62" x2="1096" y2="62" stroke="#1c1917" stroke-width="1.2"/>
  
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#1c1917" font-family="Georgia, 'Times New Roman', serif">Google Maps: 4^z Tile Pyramid, CH vs. CRP, HMM Viterbi &amp; Super-Tile Rerouting</text>
  <text x="24" y="47" class="sans" font-size="12" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">M17 §1.2, §3.2, §4.1 &amp; §4.3 · Web Mercator EPSG:3857 · Customizable Route Planning · Newson-Krumm Viterbi · Super-Tile Index</text>

  <!-- Q1 (TOP-LEFT): WEB MERCATOR 4^z PYRAMID -->
  <rect x="24" y="76" width="526" height="218" rx="10" fill="#ffffff" class="q1"/>
  <text x="42" y="100" class="sans" font-size="13.5" font-weight="700" fill="#1c1917">1. Web Mercator (EPSG:3857) 4^z Tile Pyramid</text>

  <!-- z=0, z=1, z=2 visual tiles -->
  <rect x="44" y="116" width="56" height="56" rx="4" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.5"/>
  <text x="72" y="148" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">z=0 (1)</text>

  <line x1="100" y1="144" x2="124" y2="144" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <rect x="130" y="116" width="56" height="56" rx="4" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.5"/>
  <line x1="158" y1="116" x2="158" y2="172" stroke="#99f6e4"/>
  <line x1="130" y1="144" x2="186" y2="144" stroke="#99f6e4"/>
  <rect x="130" y="144" width="28" height="28" fill="#0f766e" opacity="0.25"/>
  <text x="158" y="188" class="mono" font-size="10" fill="#065f46" text-anchor="middle">z=1 (4)</text>

  <line x1="186" y1="144" x2="210" y2="144" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <rect x="216" y="116" width="56" height="56" rx="4" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.5"/>
  <line x1="230" y1="116" x2="230" y2="172" stroke="#bfdbfe"/>
  <line x1="244" y1="116" x2="244" y2="172" stroke="#bfdbfe"/>
  <line x1="258" y1="116" x2="258" y2="172" stroke="#bfdbfe"/>
  <line x1="216" y1="130" x2="272" y2="130" stroke="#bfdbfe"/>
  <line x1="216" y1="144" x2="272" y2="144" stroke="#bfdbfe"/>
  <line x1="216" y1="158" x2="272" y2="158" stroke="#bfdbfe"/>
  <rect x="230" y="130" width="14" height="14" fill="#0f766e"/>
  <text x="244" y="188" class="mono" font-size="10" fill="#065f46" text-anchor="middle">z=2 (16)</text>

  <!-- Zoom stats & formula -->
  <rect x="290" y="114" width="242" height="104" rx="7" fill="#faf8f5" stroke="#d6d0c4"/>
  <text x="302" y="133" class="mono" font-size="10" font-weight="700" fill="#1c1917">x = ⌊((λ + 180) / 360) · 2^z⌋</text>
  <text x="302" y="151" class="mono" font-size="10" fill="#44403c">z=10 → 4^10 = 1.05M tiles</text>
  <text x="302" y="168" class="mono" font-size="10" fill="#44403c">z=21 → 4^21 = 4.40 × 10¹² tiles</text>
  <text x="302" y="186" class="mono" font-size="10" font-weight="700" fill="#991b1b">Raw PNG: ~440 PB (untenable)</text>
  <text x="302" y="204" class="mono" font-size="10" font-weight="700" fill="#065f46">MVT + Sparse Dedupe: &gt;90% cut</text>

  <rect x="42" y="232" width="490" height="46" rx="6" fill="#f0fdf9" stroke="#99f6e4"/>
  <text x="54" y="251" class="sans" font-size="10.5" fill="#065f46">PMTiles / MVT served via HTTP Range from CDN (&gt;95% cache hit, &lt;50 ms p95).</text>
  <text x="54" y="267" class="mono" font-size="10" fill="#065f46">Sum of pyramid 0..z = (4^(z+1) − 1) / 3 · Clamped ±85.0511° lat</text>

  <!-- Q2 (TOP-RIGHT): CH vs CRP -->
  <rect x="570" y="76" width="526" height="218" rx="10" fill="#ffffff" class="q2"/>
  <text x="588" y="100" class="sans" font-size="13.5" font-weight="700" fill="#1c1917">2. Contraction Hierarchies (CH) vs. Customizable Route Planning (CRP)</text>

  <!-- CH box -->
  <rect x="588" y="114" width="236" height="122" rx="7" fill="#fef2f2" stroke="#fda4af"/>
  <text x="602" y="133" class="sans" font-size="11.5" font-weight="700" fill="#991b1b">CH (Static Profiles Only)</text>
  <circle cx="622" cy="166" r="10" fill="#ffffff" stroke="#44403c" stroke-width="1.5"/>
  <text x="622" y="170" class="mono" font-size="10" text-anchor="middle">A</text>
  <circle cx="706" cy="182" r="10" fill="#e7e2d8" stroke="#d6d0c4" stroke-dasharray="2 2"/>
  <text x="706" y="186" class="mono" font-size="10" fill="#57534e" text-anchor="middle">B</text>
  <circle cx="790" cy="166" r="10" fill="#ffffff" stroke="#44403c" stroke-width="1.5"/>
  <text x="790" y="170" class="mono" font-size="10" text-anchor="middle">C</text>
  <path d="M 632,162 Q 706,136 780,162" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="706" y="148" class="mono" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">Baked Shortcut</text>
  <text x="602" y="208" class="mono" font-size="10" fill="#44403c">Query: &lt;1 ms</text>
  <text x="602" y="224" class="mono" font-size="10" font-weight="700" fill="#dc2626">Traffic Update: HOURS</text>

  <!-- CRP box -->
  <rect x="840" y="114" width="238" height="122" rx="7" fill="#f0fdf9" stroke="#99f6e4"/>
  <text x="854" y="133" class="sans" font-size="11.5" font-weight="700" fill="#065f46">CRP / MLD (Live Traffic)</text>
  <rect x="858" y="146" width="90" height="44" rx="5" fill="#ffffff" stroke="#0f766e"/>
  <text x="903" y="172" class="mono" font-size="10" fill="#065f46" text-anchor="middle">Cell 1 (Clean)</text>
  <rect x="968" y="146" width="94" height="44" rx="5" class="crp-cell" stroke-width="2"/>
  <text x="1015" y="165" class="mono" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">Cell 2</text>
  <text x="1015" y="180" class="mono" font-size="10" fill="#b45309" text-anchor="middle">Overlay Refresh</text>
  <text x="854" y="208" class="mono" font-size="10" fill="#44403c">Query: 1–5 ms (Boundary graph)</text>
  <text x="854" y="224" class="mono" font-size="10" font-weight="700" fill="#0f766e">Traffic Update: &lt; 1 second!</text>

  <rect x="588" y="246" width="490" height="32" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="600" y="266" class="sans" font-size="10.5" font-weight="600" fill="#92400e">CRP decouples metric-independent cell partitioning from live weight customization.</text>

  <!-- Q3 (BOTTOM-LEFT): HMM VITERBI MAP MATCHING -->
  <rect x="24" y="310" width="526" height="218" rx="10" fill="#ffffff" class="q3"/>
  <text x="42" y="334" class="sans" font-size="13.5" font-weight="700" fill="#1c1917">3. HMM Viterbi Map Matching O(T·S²) — Overpass Immunity</text>

  <!-- Road geometry -->
  <rect x="42" y="348" width="490" height="114" rx="7" fill="#faf8f5" stroke="#d6d0c4"/>
  <!-- Surface street N-S -->
  <line x1="250" y1="356" x2="250" y2="454" stroke="#d6d0c4" stroke-width="10"/>
  <text x="262" y="446" class="mono" font-size="10" fill="#44403c">Surface St (0° N-S)</text>
  <!-- Elevated I-80 E -->
  <line x1="60" y1="396" x2="512" y2="396" stroke="#44403c" stroke-width="14"/>
  <line x1="60" y1="396" x2="512" y2="396" stroke="#faf8f5" stroke-width="1.5" stroke-dasharray="10 8"/>
  <text x="72" y="378" class="mono" font-size="10" font-weight="700" fill="#1c1917">I-80 E Elevated (90° E)</text>

  <!-- Raw GPS with 6m drift closer to surface street -->
  <circle cx="242" cy="414" r="6" fill="#dc2626"/>
  <text x="92" y="424" class="mono" font-size="10" font-weight="700" fill="#991b1b">Raw GPS (4m Surface vs 6m I-80)</text>
  <rect x="348" y="410" width="172" height="24" rx="4" fill="#fef2f2" stroke="#dc2626"/>
  <text x="434" y="426" class="mono" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">Naive Euclidean → WRONG!</text>

  <!-- Animated car snapped onto I-80 E -->
  <g class="car">
    <rect x="148" y="388" width="26" height="16" rx="4" fill="#0f766e" stroke="#ffffff" stroke-width="1.5"/>
    <text x="161" y="399" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">90°</text>
  </g>

  <rect x="42" y="472" width="490" height="40" rx="6" fill="#f0fdf9" stroke="#99f6e4"/>
  <text x="54" y="490" class="mono" font-size="10" font-weight="700" fill="#065f46">HMM Cost = (dist/10)² + (Δheading/30°)² + road_switch_penalty</text>
  <text x="54" y="505" class="sans" font-size="10" fill="#065f46">Emission (σ ≈ 5–10 m) + Transition heading continuity rejects 90° overpass jumps.</text>

  <!-- Q4 (BOTTOM-RIGHT): SUPER-TILE INVERTED INDEX -->
  <rect x="570" y="310" width="526" height="218" rx="10" fill="#ffffff" class="q4"/>
  <text x="588" y="334" class="sans" font-size="13.5" font-weight="700" fill="#1c1917">4. Super-Tile Ancestor Chain &amp; WebSocket Reroute Push</text>

  <!-- Chain diagram -->
  <rect x="588" y="350" width="110" height="44" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="643" y="369" class="mono" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">Incident Tile</text>
  <text x="643" y="384" class="mono" font-size="10" fill="#991b1b" text-anchor="middle">14/2623/6331</text>

  <line x1="698" y1="372" x2="722" y2="372" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arr-v)"/>

  <rect x="728" y="350" width="154" height="44" rx="6" fill="#f5f1e8" stroke="#0f766e"/>
  <text x="805" y="369" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">Walk Ancestors</text>
  <text x="805" y="384" class="mono" font-size="10" fill="#065f46" text-anchor="middle">≤ z_base + 1 (≤22 IDs)</text>

  <line x1="882" y1="372" x2="906" y2="372" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arr-v)"/>

  <rect x="912" y="350" width="166" height="44" rx="6" fill="#f0fdf9" stroke="#0f766e"/>
  <text x="995" y="369" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">Exact Edge Filter</text>
  <text x="995" y="384" class="mono" font-size="10" fill="#065f46" text-anchor="middle">Verify routeEdges hit</text>

  <!-- Super-Tile inverted map explanation -->
  <rect x="588" y="406" width="490" height="54" rx="6" fill="#faf8f5" stroke="#d6d0c4"/>
  <text x="602" y="426" class="mono" font-size="10" fill="#44403c">Chain: [r_1, super(r_1), ..., root] stops when originAnc == destAnc.</text>
  <text x="602" y="445" class="mono" font-size="10" font-weight="700" fill="#065f46">Avoids O(100M users · K route tiles) memory &amp; scan explosion.</text>

  <g class="ws-pop">
    <rect x="588" y="470" width="490" height="42" rx="6" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.5"/>
    <text x="602" y="489" class="mono" font-size="10" font-weight="700" fill="#065f46">WebSocket Reroute Push: GNN Supersegment ETA saves &gt; 3–5 min</text>
    <text x="602" y="504" class="sans" font-size="10" fill="#065f46">Anti-herd split cap spreads detours across alternates to prevent side-street gridlock.</text>
  </g>

  <!-- FOOTER -->
  <rect x="24" y="540" width="1072" height="44" rx="8" fill="#f0fdf9" stroke="#99f6e4" stroke-width="1"/>
  <text x="42" y="566" class="sans" font-size="11.5" font-weight="600" fill="#065f46">Takeaway: CRP refreshes live cell weights in &lt;1 s, HMM Viterbi prevents overpass mis-snaps via heading continuity, and Super-Tiles bound incident filtering to ≤22 lookups.</text>
</svg>
