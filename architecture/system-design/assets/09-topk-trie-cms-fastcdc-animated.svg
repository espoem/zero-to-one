<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" role="img" aria-labelledby="title desc">
  <title id="title">Typeahead Prefix Trie Top-K, Count-Min Sketch Heavy Hitters, and FastCDC Chunking</title>
  <desc id="desc">Animated step-by-step visualization of three specialized Module 09 algorithms: an O(P) Typeahead Prefix Trie with precomputed Top-K per node, a Count-Min Sketch (w=2719, d=5) paired with a bounded K-element Min-Heap for heavy hitters, and FastCDC rolling-hash content-defined chunking where a 1-byte insertion at offset 0 alters only the first chunk while subsequent chunk boundaries resynchronize for content-addressed deduplication.</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    @keyframes trie-p1 {
      0%, 24% { stroke: #2563eb; stroke-width: 2.5; opacity: 1; }
      28%, 100% { stroke: #cbd5e1; stroke-width: 1.5; opacity: 0.7; }
    }
    @keyframes trie-p2 {
      0%, 24% { stroke: #cbd5e1; stroke-width: 1.5; opacity: 0.7; }
      28%, 54% { stroke: #2563eb; stroke-width: 2.5; opacity: 1; }
      58%, 100% { stroke: #cbd5e1; stroke-width: 1.5; opacity: 0.7; }
    }
    @keyframes trie-p3 {
      0%, 54% { stroke: #cbd5e1; stroke-width: 1.5; opacity: 0.7; }
      58%, 94% { stroke: #059669; stroke-width: 2.8; opacity: 1; }
      98%, 100% { stroke: #cbd5e1; stroke-width: 1.5; opacity: 0.7; }
    }
    @keyframes cms-hash {
      0%, 20% { opacity: 0.86; }
      30%, 70% { opacity: 1; }
      80%, 100% { opacity: 0.86; }
    }
    @keyframes cdc-sync {
      0%, 30% { transform: translateX(0px); }
      45%, 90% { transform: translateX(14px); }
      100% { transform: translateX(0px); }
    }
    @keyframes cdc-match {
      0%, 40% { opacity: 0.86; }
      50%, 92% { opacity: 1; }
      100% { opacity: 0.86; }
    }

    .tp1 { animation: trie-p1 12s linear infinite; }
    .tp2 { animation: trie-p2 12s linear infinite; }
    .tp3 { animation: trie-p3 12s linear infinite; }
    .cms-hi { animation: cms-hash 12s ease-in-out infinite; }
    .fix-shift { animation: cdc-sync 12s ease-in-out infinite; }
    .cdc-ok { animation: cdc-match 12s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .tp1, .tp2, .tp3, .cms-hi, .fix-shift, .cdc-ok {
        animation: none !important;
      }
      .tp1, .tp2, .tp3, .cms-hi, .cdc-ok { opacity: 1 !important; }
      .fix-shift { transform: translateX(14px) !important; }
    }
  </style>

  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1120" height="620" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="1120" height="60" rx="12" fill="#0f172a"/>
  <rect x="0" y="44" width="1120" height="16" fill="#0f172a"/>
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#f8fafc">Typeahead Prefix Trie, CMS + Min-Heap &amp; FastCDC Deduplication</text>
  <text x="24" y="47" class="sans" font-size="12" fill="#94a3b8">O(P) Top-K trie lookup · 54 KB Count-Min Sketch + Min-Heap heavy hitters · Rolling-hash boundary resynchronization</text>

  <!-- TOP-LEFT: PREFIX TRIE TOP-K -->
  <rect x="24" y="76" width="524" height="232" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="42" y="100" class="sans" font-size="13.5" font-weight="700" fill="#0f172a">1. Typeahead Prefix Trie with Pre-Computed Top-K</text>
  <text x="42" y="118" class="sans" font-size="11" fill="#475569">Materialized topK per node turns O(P + M log K) DFS into O(P) &lt; 1 ms</text>

  <!-- Trie Nodes -->
  <rect x="42" y="138" width="58" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="71" y="160" class="mono" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Root</text>
  <line x1="100" y1="156" x2="128" y2="156" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <rect x="134" y="134" width="142" height="44" rx="6" fill="#eff6ff" class="tp1"/>
  <text x="144" y="152" class="mono" font-size="11" font-weight="700" fill="#1e3a8a">"s"</text>
  <text x="144" y="168" class="mono" font-size="10" fill="#475569">[shoes, spotify...]</text>
  <line x1="205" y1="178" x2="205" y2="196" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <rect x="134" y="200" width="166" height="44" rx="6" fill="#eff6ff" class="tp2"/>
  <text x="144" y="218" class="mono" font-size="11" font-weight="700" fill="#1e3a8a">"sy"</text>
  <text x="144" y="234" class="mono" font-size="10" fill="#475569">[system design, sync...]</text>
  <line x1="300" y1="222" x2="328" y2="222" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <rect x="334" y="196" width="198" height="54" rx="6" fill="#ecfdf5" class="tp3"/>
  <text x="344" y="216" class="mono" font-size="11.5" font-weight="700" fill="#065f46">"sys" → O(3) HIT!</text>
  <text x="344" y="234" class="mono" font-size="10" fill="#047857">[system design, system update,</text>
  <text x="344" y="246" class="mono" font-size="10" fill="#047857"> sysadmin, systemd, sysctl]</text>

  <text x="42" y="286" class="sans" font-size="10.5" fill="#334155">Offline Flink time-decay scores compile immutable FST snapshots → atomic swap.</text>

  <!-- TOP-RIGHT: CMS + MIN-HEAP HEAVY HITTERS -->
  <rect x="572" y="76" width="524" height="232" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="590" y="100" class="sans" font-size="13.5" font-weight="700" fill="#0f172a">2. Count-Min Sketch (w=2719, d=5) + Bounded Min-Heap</text>
  <text x="590" y="118" class="sans" font-size="11" fill="#475569">54 KB L1-resident matrix · Linear merge C_global = C1 + C2</text>

  <!-- CMS 3x5 Grid excerpt -->
  <rect x="590" y="136" width="90" height="32" rx="5" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="635" y="156" class="mono" font-size="10.5" font-weight="700" fill="#5b21b6" text-anchor="middle">key "sys"</text>
  <line x1="680" y1="152" x2="716" y2="152" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arr-violet)"/>

  <g transform="translate(722, 134)">
    <rect x="0" y="0" width="166" height="24" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="44" y="0" width="38" height="24" rx="3" fill="#7c3aed" class="cms-hi"/>
    <text x="63" y="16" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">490</text>
    <text x="12" y="16" class="mono" font-size="10" fill="#64748b">h0</text>

    <rect x="0" y="28" width="166" height="24" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="102" y="28" width="38" height="24" rx="3" fill="#059669" class="cms-hi"/>
    <text x="121" y="44" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">482</text>
    <text x="12" y="44" class="mono" font-size="10" fill="#64748b">h1</text>

    <rect x="0" y="56" width="166" height="24" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="70" y="56" width="38" height="24" rx="3" fill="#7c3aed" class="cms-hi"/>
    <text x="89" y="72" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">510</text>
    <text x="12" y="72" class="mono" font-size="10" fill="#64748b">h2</text>
  </g>

  <!-- Min-Heap Box -->
  <rect x="908" y="134" width="172" height="86" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="994" y="154" class="sans" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">Top-K Min-Heap</text>
  <text x="994" y="174" class="mono" font-size="10" fill="#334155" text-anchor="middle">f̂ = min(490,482,510)</text>
  <text x="994" y="191" class="mono" font-size="10.5" font-weight="700" fill="#059669" text-anchor="middle">482 &gt; root(310)</text>
  <text x="994" y="208" class="mono" font-size="10" fill="#047857" text-anchor="middle">pop(310) · push(sys)</text>

  <rect x="590" y="232" width="490" height="58" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="602" y="252" class="mono" font-size="10.5" font-weight="700" fill="#5b21b6">Upper-Bound Guarantee: f(x) ≤ f̂(x) ≤ f(x) + ε·N  (w.p. 1 − δ)</text>
  <text x="602" y="272" class="sans" font-size="10.5" fill="#334155">Zero cross-partition raw key shuffle at 2M events/s across 50 Kafka partitions.</text>

  <!-- BOTTOM FULL PANEL: FASTCDC ROLLING HASH -->
  <rect x="24" y="324" width="1072" height="222" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="42" y="350" class="sans" font-size="13.5" font-weight="700" fill="#0f172a">3. FastCDC Content-Defined Chunking: 1-Byte Insertion at Offset 0</text>
  <text x="42" y="368" class="sans" font-size="11" fill="#475569">Boundary declared when (rolling_hash(48B_window) &amp; MASK) == 0 · Content-addressed SHA-256 deduplication</text>

  <!-- Row A: Fixed-Size Chunking (FAILS) -->
  <text x="42" y="398" class="mono" font-size="11" font-weight="700" fill="#9f1239">Fixed 4 MB Offsets:</text>
  <rect x="200" y="380" width="14" height="32" rx="3" fill="#e11d48"/>
  <text x="207" y="400" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">+B</text>
  <g class="fix-shift">
    <rect x="204" y="380" width="206" height="32" rx="4" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
    <text x="307" y="400" class="mono" font-size="10" font-weight="700" fill="#9f1239" text-anchor="middle">Chunk 1' (SHA changed)</text>
    <rect x="416" y="380" width="206" height="32" rx="4" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
    <text x="519" y="400" class="mono" font-size="10" font-weight="700" fill="#9f1239" text-anchor="middle">Chunk 2' (SHA changed)</text>
    <rect x="628" y="380" width="206" height="32" rx="4" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
    <text x="731" y="400" class="mono" font-size="10" font-weight="700" fill="#9f1239" text-anchor="middle">Chunk 3' (SHA changed)</text>
  </g>
  <rect x="862" y="380" width="214" height="32" rx="5" fill="#e11d48"/>
  <text x="969" y="400" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">0% Dedup (re-upload 4 GB!)</text>

  <!-- Row B: FastCDC Rolling Hash (RESYNCS) -->
  <text x="42" y="454" class="mono" font-size="11" font-weight="700" fill="#065f46">FastCDC Rolling Hash:</text>
  <rect x="200" y="436" width="210" height="32" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="305" y="456" class="mono" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">+1B → Chunk 1' (only 1 dirty)</text>

  <g class="cdc-ok">
    <rect x="416" y="436" width="206" height="32" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="519" y="456" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">Chunk 2 (UNCHANGED ✓)</text>
    <rect x="628" y="436" width="206" height="32" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="731" y="456" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">Chunk 3 (UNCHANGED ✓)</text>
    <rect x="862" y="436" width="214" height="32" rx="5" fill="#059669"/>
    <text x="969" y="456" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Upload Chunk 1' ONLY!</text>
  </g>

  <rect x="42" y="484" width="1034" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="504" class="mono" font-size="10.5" fill="#334155">Boundary Condition: (hash &amp; 0x1FFF) == 0  →  E[chunk] = 2¹³ = 8 KB (or 22-bit mask for 4 MB), clamped to [minChunk, maxChunk]</text>
  <text x="56" y="521" class="sans" font-size="10.5" fill="#065f46">Because cut points depend solely on local byte content, identical trailing bytes converge on the exact same SHA-256 chunks.</text>

  <!-- FOOTER -->
  <rect x="24" y="560" width="1072" height="44" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="42" y="587" class="sans" font-size="11.5" font-weight="600" fill="#1e3a8a">Takeaway: Pre-computed Top-K tries deliver &lt;1 ms typeahead, CMS+Heap tracks heavy hitters in 54 KB, and FastCDC isolates edits to 1 chunk.</text>
</svg>
