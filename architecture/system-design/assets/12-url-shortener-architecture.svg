<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" width="1180" height="720" role="img" aria-labelledby="title desc">
  <title id="title">Globally Distributed URL Shortener — End-to-End Architecture</title>
  <desc id="desc">Comprehensive system architecture diagram for a high-scale URL shortener showing Write Path with ID generation and collision options, Read Path with multi-tier caching and redirection semantics, and asynchronous click-stream analytics.</desc>
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="1180" height="720" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect x="0" y="0" width="1180" height="60" rx="12" fill="#0f172a"/>
  <rect x="0" y="44" width="1180" height="16" fill="#0f172a"/>
  <text x="24" y="28" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Globally Distributed URL Shortener — End-to-End Architecture (100M Writes/Day · 10B Reads/Day)</text>
  <text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Write Path (Base62 KGS vs Hash+Collision) · Multi-Tier Edge Read Path (HTTP 301 vs 302/307) · Async ClickHouse Analytics</text>

  <!-- ========================================== -->
  <!-- SECTION 1: WRITE PATH (TOP HALF) -->
  <!-- ========================================== -->
  <rect x="20" y="76" width="760" height="294" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="36" y="98" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">1. WRITE PATH — Short Link Creation &amp; Code Generation Pipeline</text>

  <!-- Client Write Box -->
  <rect x="36" y="112" width="140" height="70" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="46" y="132" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af">API Client / App</text>
  <text x="46" y="149" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" fill="#334155">POST /v1/urls</text>
  <text x="46" y="165" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#64748b">{ long_url, custom? }</text>

  <!-- API Gateway & Safety Scanner -->
  <rect x="210" y="112" width="170" height="70" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="220" y="132" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af">API Gateway &amp; Write Svc</text>
  <text x="220" y="149" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">Auth, Rate Limit (100 req/m)</text>
  <text x="220" y="165" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#047857">Google Safe Browsing API</text>

  <!-- Arrow Client -> Gateway -->
  <line x1="176" y1="147" x2="208" y2="147" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- Approach A: Distributed ID + Base62 -->
  <rect x="415" y="110" width="345" height="114" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="415" y="110" width="345" height="22" rx="6" fill="#dbeafe"/>
  <text x="425" y="126" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e40af">Option A: KGS / Snowflake + Feistel + Base62</text>
  
  <text x="425" y="148" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">1. Pre-allocated 1M ID blocks (etcd / Snowflake 64b)</text>
  <text x="425" y="164" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#475569">2. 42-bit Feistel / Sqids (prevents enumeration)</text>
  <text x="425" y="180" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" fill="#1e40af">3. Base62: 2009215674938 -&gt; zn9edcu (62^7 = 3.52T)</text>
  <text x="425" y="200" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#15803d">Zero Collisions · Zero R-B-W Penalty · O(1) CPU</text>

  <!-- Approach B: Hash + Collision -->
  <rect x="415" y="234" width="345" height="122" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <rect x="415" y="234" width="345" height="22" rx="6" fill="#fef3c7"/>
  <text x="425" y="250" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400e">Option B: Hash + Collision + Bloom Filter</text>
  
  <text x="425" y="272" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" fill="#78350f">1. SHA-256(long_url) -&gt; 7 chars (41 bits)</text>
  <text x="425" y="288" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#475569">2. Bloom Filter check (0.1% false positive rate)</text>
  <text x="425" y="304" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#b45309">3. Bloom hit: SELECT short_code FROM DB</text>
  <text x="425" y="322" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#dc2626">On Collision: append salt &amp; re-hash (high tail p99)</text>
  <text x="425" y="340" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#b45309">Requires DB read-before-write &amp; retry coordination</text>

  <!-- Arrows from Gateway to Options -->
  <path d="M 380 140 L 413 140" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <path d="M 340 182 L 340 280 L 413 280" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-amber)"/>

  <!-- ========================================== -->
  <!-- SECTION 2: STORAGE TIER (TOP RIGHT) -->
  <!-- ========================================== -->
  <rect x="800" y="76" width="360" height="294" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="816" y="98" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">2. PERSISTENCE &amp; CACHE WARMING</text>

  <!-- Primary Sharded SQL / KV -->
  <rect x="816" y="112" width="328" height="114" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <rect x="816" y="112" width="328" height="22" rx="6" fill="#e2e8f0"/>
  <text x="826" y="128" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e293b">Sharded Relational / DynamoDB (10-Yr: 365 TB)</text>
  <text x="826" y="150" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" fill="#0f172a">PK: short_code (CHAR(7)) | long_url (TEXT)</text>
  <text x="826" y="166" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">Partition Key: short_code[0] (62 shards) or consistent hash</text>
  <text x="826" y="182" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#475569">Write: Primary DB + async cross-region replication</text>
  <text x="826" y="198" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#64748b">Retention: 365B rows @ 1 KB = 365 TB (S3 Iceberg)</text>
  <text x="826" y="214" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#047857">ACK: 201 Created { short_url: "bit.ly/zn9edcu" }</text>

  <!-- Cache Warming Line -->
  <rect x="816" y="238" width="328" height="118" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="826" y="258" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">L2 Distributed Cache (Valkey / Redis)</text>
  <text x="826" y="276" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">80/20 Rule: 20% hot links generate 80% traffic</text>
  <text x="826" y="294" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">Working Set: 100M hot links x 500 B = ~50 GB RAM cluster</text>
  <text x="826" y="312" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#475569">Write-through or lazy read-populate with TTL (e.g., 7 days)</text>
  <text x="826" y="330" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#059669">Bloom Filter in Redis / Edge blocks 100% invalid 404 scans</text>

  <!-- Arrow Option A to DB -->
  <path d="M 760 160 L 814 160" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <!-- Arrow DB write to Cache populate -->
  <line x1="980" y1="226" x2="980" y2="236" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- ========================================== -->
  <!-- SECTION 3: READ PATH (BOTTOM LEFT) -->
  <!-- ========================================== -->
  <rect x="20" y="386" width="760" height="318" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="36" y="408" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#065f46">3. READ PATH — High-Throughput Redirection Flow (115k-350k QPS)</text>

  <!-- Client Browser / User -->
  <rect x="36" y="422" width="130" height="74" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="46" y="442" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#065f46">User Browser</text>
  <text x="46" y="460" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" fill="#334155">GET /{code}</text>
  <text x="46" y="476" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#64748b">Clicks short link</text>

  <!-- Cloudflare / Edge Worker -->
  <rect x="200" y="422" width="170" height="74" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="210" y="442" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#065f46">Global Edge PoP</text>
  <text x="210" y="458" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">Cloudflare Workers KV</text>
  <text x="210" y="474" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#059669">L1 Edge Cache: &lt; 10 ms RTT</text>

  <!-- Arrow Client -> Edge -->
  <line x1="166" y1="459" x2="198" y2="459" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>

  <!-- Read Miss to L2 Cache / DB -->
  <rect x="405" y="422" width="170" height="74" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="415" y="442" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af">Origin Redirect Svc</text>
  <text x="415" y="458" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">1. Check L2 Redis Cache</text>
  <text x="415" y="474" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#475569">2. Miss: DB Read Replica</text>

  <!-- Arrow Edge Miss -> Origin Svc -->
  <line x1="370" y1="459" x2="403" y2="459" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Bloom Filter Gate -->
  <rect x="610" y="422" width="150" height="74" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="620" y="442" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#b45309">Negative Filter</text>
  <text x="620" y="458" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">Bloom Filter check</text>
  <text x="620" y="474" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#dc2626">404 Gone / Unknown</text>

  <line x1="575" y1="459" x2="608" y2="459" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <!-- HTTP 301 vs 302/307 Callout Cards -->
  <rect x="36" y="512" width="350" height="176" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="36" y="512" width="350" height="24" rx="6" fill="#f1f5f9"/>
  <text x="48" y="528" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e293b">HTTP 301 Moved Permanently (RFC 9110 §15.4.2)</text>
  <text x="48" y="550" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#dc2626">Behavior: Browser aggressively caches redirect response</text>
  <text x="48" y="568" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#334155">+ Server offload: repeat clicks bypass origin</text>
  <text x="48" y="586" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#334155">+ Lowest latency on repeat clicks (0 ms disk cache)</text>
  <text x="48" y="604" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#b91c1c">- BLINDS ANALYTICS: repeat hits bypass tracking</text>
  <text x="48" y="622" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#b91c1c">- IRREVOCABLE: malicious links stay cached</text>
  <text x="48" y="640" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#475569">Method rewriting: RFC permits POST -&gt; GET silent mutation</text>
  <text x="48" y="658" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#64748b">Use Case: Static link migrations with zero analytics interest</text>
  <text x="48" y="674" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#047857">Header: Location: https://target.com/long-page</text>

  <rect x="405" y="512" width="355" height="176" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <rect x="405" y="512" width="355" height="24" rx="6" fill="#dcfce7"/>
  <text x="417" y="528" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#166534">HTTP 302 Found / 307 Temp Redirect (Recommended)</text>
  <text x="417" y="550" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#047857">Behavior: Browser does not cache; every hit visits edge</text>
  <text x="417" y="568" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#334155">+ 100% ANALYTICS: every click logged in real time</text>
  <text x="417" y="586" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#334155">+ INSTANT REVOCATION: kill switch blocks bad links</text>
  <text x="417" y="604" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#334155">+ Dynamic A/B routing &amp; geo-targeted landing pages</text>
  <text x="417" y="622" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#166534">+ RFC 9110 §15.4.8 (307): preserves HTTP method</text>
  <text x="417" y="640" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#475569">- Edge QPS: Workers handle full redirect volume</text>
  <text x="417" y="658" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#047857">Mitigation: Workers KV serves 99.5% at edge (&lt;10 ms)</text>
  <text x="417" y="674" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#065f46">Header: Cache-Control: private, no-store | Location: ...</text>

  <!-- ========================================== -->
  <!-- SECTION 4: ASYNC ANALYTICS PIPELINE (BOTTOM RIGHT) -->
  <!-- ========================================== -->
  <rect x="800" y="386" width="360" height="318" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="816" y="408" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#581c87">4. ASYNC CLICK ANALYTICS (Zero-Impact Telemetry)</text>

  <!-- Decoupled Event Emitter -->
  <rect x="816" y="422" width="328" height="64" rx="6" fill="#ffffff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="826" y="442" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#6b21a8">Non-Blocking Event Emitter</text>
  <text x="826" y="458" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">Fires background HTTP request / UDP / ring buffer</text>
  <text x="826" y="474" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#7e22ce">Never delays user HTTP 302 response (&lt;1 ms fire-and-forget)</text>

  <!-- Kafka / Redpanda Buffer -->
  <rect x="816" y="498" width="328" height="66" rx="6" fill="#ffffff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="826" y="518" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#6b21a8">Distributed Buffer (Kafka / Redpanda)</text>
  <text x="826" y="534" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">Topic: click-events (Partitioned by short_code)</text>
  <text x="826" y="550" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#475569">Absorbs 350k QPS traffic bursts; at-least-once ingestion</text>

  <!-- Arrow Emitter -> Kafka -->
  <line x1="980" y1="486" x2="980" y2="496" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>

  <!-- ClickHouse & Flink Rollups -->
  <rect x="816" y="576" width="328" height="114" rx="6" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5"/>
  <text x="826" y="596" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#581c87">OLAP Engine (ClickHouse / Apache Iceberg)</text>
  <text x="826" y="612" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">ReplacingMergeTree engine: deduplicates retry clicks</text>
  <text x="826" y="628" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#475569">Dimensions: country_iso, referrer_domain, OS, device, IP subnet</text>
  <text x="826" y="644" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#7e22ce">Materialized Views: 1-minute, 1-hour, 1-day rollups</text>
  <text x="826" y="660" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#334155">Queries: sub-second aggregation over billions of rows</text>
  <text x="826" y="678" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#059669">Privacy Gate: Truncates IP (/24 IPv4) for GDPR compliance</text>

  <!-- Arrow Kafka -> ClickHouse -->
  <line x1="980" y1="564" x2="980" y2="574" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>

  <!-- Async Connection Read Svc to Analytics -->
  <path d="M 575 435 L 595 435 L 595 405 L 785 405 L 785 450 L 814 450" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr-purple)"/>
  <rect x="650" y="396" width="80" height="18" rx="4" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="690" y="409" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#7c3aed">Async Event</text>
</svg>
