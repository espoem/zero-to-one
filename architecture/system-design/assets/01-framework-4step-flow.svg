<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" width="1160" height="520" role="img" aria-labelledby="title desc">
  <title id="title">ByteByteGo 4-Step System Design Framework with Level Signal</title>
  <desc id="desc">Four-step interview framework: scope 3 to 10 minutes, high-level design and buy-in 10 to 15 minutes, deep dive 10 to 25 minutes, wrap-up 3 to 5 minutes, with the signal expected at Senior, Staff and Principal levels.</desc>

  <rect x="0" y="0" width="1160" height="520" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="0" y="0" width="1160" height="56" rx="12" fill="#0f172a"/>
  <rect x="0" y="40" width="1160" height="16" rx="0" fill="#0f172a"/>
  <text x="24" y="27" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">System Design Interview Framework: 4 Steps, Timeboxes, and Level Signal</text>
  <text x="24" y="46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">ByteByteGo Chapter 3 steps calibrated to a 45-60 minute loop; the time shifts toward deep dive as level rises</text>
  <rect x="20" y="76" width="262" height="236" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
  <circle cx="44" cy="102" r="14" fill="#1e3a8a"/>
  <text x="44" y="107" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
  <text x="66" y="98" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1e3a8a">Understand &amp; Scope</text>
  <text x="66" y="116" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">3-10 min</text>
  <text x="36" y="150" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#334155">• Ask clarifying questions</text>
  <text x="36" y="176" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#334155">• Write FRs, NFR numbers</text>
  <text x="36" y="202" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#334155">• Log assumptions, cut scope</text>
  <rect x="32" y="236" width="238" height="1" rx="0" fill="#93c5fd"/>
  <text x="36" y="262" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1e3a8a">Output: FR list + NFR table</text>
  <text x="36" y="284" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b">Timebox share of 45 min: 7-22%</text>
  <path d="M285 194 L303 194" stroke="#475569" stroke-width="2"/>
  <path d="M297 188 L303 194 L297 200" fill="none" stroke="#475569" stroke-width="2"/>
  <rect x="306" y="76" width="262" height="236" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
  <circle cx="330" cy="102" r="14" fill="#166534"/>
  <text x="330" y="107" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
  <text x="352" y="98" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#166534">High-Level Design + Buy-In</text>
  <text x="352" y="116" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">10-15 min</text>
  <text x="322" y="150" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#334155">• Boxes, data stores, flows</text>
  <text x="322" y="176" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#334155">• Back-of-envelope if it matters</text>
  <text x="322" y="202" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#334155">• Walk core use cases</text>
  <rect x="318" y="236" width="238" height="1" rx="0" fill="#86efac"/>
  <text x="322" y="262" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#166534">Output: diagram with buy-in</text>
  <text x="322" y="284" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b">Timebox share of 45 min: 22-33%</text>
  <path d="M571 194 L589 194" stroke="#475569" stroke-width="2"/>
  <path d="M583 188 L589 194 L583 200" fill="none" stroke="#475569" stroke-width="2"/>
  <rect x="592" y="76" width="262" height="236" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.2"/>
  <circle cx="616" cy="102" r="14" fill="#92400e"/>
  <text x="616" y="107" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
  <text x="638" y="98" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#92400e">Design Deep Dive</text>
  <text x="638" y="116" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">10-25 min</text>
  <text x="608" y="150" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#334155">• Pick 1-2 hard components</text>
  <text x="608" y="176" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#334155">• Quantify bottleneck and cost</text>
  <text x="608" y="202" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#334155">• Name failure modes, mitigations</text>
  <rect x="604" y="236" width="238" height="1" rx="0" fill="#fcd34d"/>
  <text x="608" y="262" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#92400e">Output: defended trade-offs</text>
  <text x="608" y="284" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b">Timebox share of 45 min: 22-56%</text>
  <path d="M857 194 L875 194" stroke="#475569" stroke-width="2"/>
  <path d="M869 188 L875 194 L869 200" fill="none" stroke="#475569" stroke-width="2"/>
  <rect x="878" y="76" width="262" height="236" rx="8" fill="#fae8ff" stroke="#e879f9" stroke-width="1.2"/>
  <circle cx="902" cy="102" r="14" fill="#86198c"/>
  <text x="902" y="107" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
  <text x="924" y="98" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#86198c">Wrap-Up</text>
  <text x="924" y="116" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">3-5 min</text>
  <text x="894" y="150" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#334155">• Recap decisions and risks</text>
  <text x="894" y="176" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#334155">• Error handling, monitoring</text>
  <text x="894" y="202" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#334155">• Scale 10x, next steps</text>
  <rect x="890" y="236" width="238" height="1" rx="0" fill="#e879f9"/>
  <text x="894" y="262" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#86198c">Output: honest limits + roadmap</text>
  <text x="894" y="284" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b">Timebox share of 45 min: 7-11%</text>
  <rect x="20" y="330" width="1120" height="30" rx="6" fill="#e2e8f0"/>
  <text x="34" y="350" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e293b">Signal graded by level (same four steps, different evidence)</text>
  <rect x="20" y="372" width="364" height="112" rx="8" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.2"/>
  <text x="34" y="396" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#075985">Senior</text>
  <text x="34" y="420" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#334155">• Complete, working design</text>
  <text x="34" y="440" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#334155">• Correct data model and APIs</text>
  <text x="34" y="460" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#334155">• Names trade-offs when asked</text>
  <rect x="398" y="372" width="364" height="112" rx="8" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="412" y="396" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#5b21b6">Staff</text>
  <text x="412" y="420" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#334155">• Drives the agenda, owns the clock</text>
  <text x="412" y="440" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#334155">• Quantified SLOs and cost per request</text>
  <text x="412" y="460" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#334155">• Failure modes before being asked</text>
  <rect x="776" y="372" width="364" height="112" rx="8" fill="#ffe4e6" stroke="#fda4af" stroke-width="1.2"/>
  <text x="790" y="396" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#9f1239">Principal</text>
  <text x="790" y="420" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#334155">• Reframes the problem and org fit</text>
  <text x="790" y="440" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#334155">• Blast radius, cells, FinOps, migration</text>
  <text x="790" y="460" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#334155">• Survives adversarial pivots calmly</text>
  <rect x="20" y="492" width="1120" height="18" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="34" y="505" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#92400e">Trap: a 25-minute scope phase leaves no time for the deep dive, where Staff and Principal signal is generated.</text>
</svg>
