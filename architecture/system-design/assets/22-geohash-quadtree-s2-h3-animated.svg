<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Spatial Indexing: Geohash Morton Z-Order, Adaptive Quadtree k-NN, Google S2, and Uber H3</title>
  <desc id="desc">Animated spatial indexing comparison for proximity services: Geohash Morton Z-order bit interleaving (even longitude bits, odd latitude bits) with 9-cell neighbor lookup and exact Haversine post-filtering removing corner false positives; Adaptive Point Quadtree (leaf at most 100 POIs) with branch-and-bound k-NN quadrant pruning; Google S2 64-bit Hilbert space-filling curve for polygon covering; and Uber H3 hexagonal gridDisk eliminating square diagonal root-2 corner skew.</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* 12s cycle:
       0-25%  (0-3s): Q1 — Geohash Z-order + 9-cell + Haversine corner filter
       25-50% (3-6s): Q2 — Adaptive Quadtree (leaf at most 100) branch-and-bound k-NN prune
       50-75% (6-9s): Q3 — Google S2 64-bit Hilbert curve + S2RegionCoverer
       75-100%(9-12s):Q4 — Uber H3 hexagonal gridDisk(1) uniform neighbor distance
    */

    @keyframes q1-hl { 0%, 24% { stroke: #2563eb; stroke-width: 2.2; } 25%, 100% { stroke: #cbd5e1; stroke-width: 1.5; } }
    @keyframes q2-hl { 0%, 24% { stroke: #cbd5e1; stroke-width: 1.5; } 25%, 49% { stroke: #059669; stroke-width: 2.2; } 50%, 100% { stroke: #cbd5e1; stroke-width: 1.5; } }
    @keyframes q3-hl { 0%, 49% { stroke: #cbd5e1; stroke-width: 1.5; } 50%, 74% { stroke: #7c3aed; stroke-width: 2.2; } 75%, 100% { stroke: #cbd5e1; stroke-width: 1.5; } }
    @keyframes q4-hl { 0%, 74% { stroke: #cbd5e1; stroke-width: 1.5; } 75%, 100% { stroke: #d97706; stroke-width: 2.2; } }

    @keyframes knn-ring {
      0%, 24%  { r: 16px; opacity: 0.86; }
      35%, 49% { r: 44px; opacity: 1; }
      52%, 100%{ r: 44px; opacity: 0.65; }
    }

    @keyframes corner-reject {
      0%, 8%   { opacity: 0.86; }
      14%, 24% { opacity: 1; }
      28%, 100%{ opacity: 0.65; }
    }

    .q1 { animation: q1-hl 12s linear infinite; }
    .q2 { animation: q2-hl 12s linear infinite; }
    .q3 { animation: q3-hl 12s linear infinite; }
    .q4 { animation: q4-hl 12s linear infinite; }
    .knn { animation: knn-ring 12s ease-in-out infinite; }
    .crej { animation: corner-reject 12s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .q1, .q2, .q3, .q4, .knn, .crej { animation: none !important; }
      .knn { r: 44px !important; opacity: 1 !important; }
      .crej { opacity: 1 !important; }
    }
  </style>

  <!-- Canvas -->
  <rect x="0" y="0" width="1120" height="600" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="1120" height="60" rx="12" fill="#0f172a"/>
  <rect x="0" y="44" width="1120" height="16" fill="#0f172a"/>
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#f8fafc">Spatial Indexing: Geohash Z-Order, Adaptive Quadtree, Google S2 &amp; Uber H3</text>
  <text x="24" y="47" class="sans" font-size="12" fill="#94a3b8">M22 §3.3–3.5 · Morton Bit-Interleaving + 9-Cell Haversine Filter · Quadtree (leaf ≤ 100) k-NN Prune · S2 Hilbert vs. H3 gridDisk</text>

  <!-- Q1 (TOP-LEFT): GEOHASH MORTON + 9-CELL + HAVERSINE -->
  <rect x="24" y="76" width="526" height="222" rx="10" fill="#ffffff" class="q1"/>
  <text x="42" y="100" class="sans" font-size="13.5" font-weight="700" fill="#0f172a">1. Geohash: Morton Z-Order + 9-Cell + Haversine Filter</text>

  <!-- 3x3 Geohash Grid -->
  <rect x="48" y="116" width="132" height="132" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="92" y1="116" x2="92" y2="248" stroke="#93c5fd"/>
  <line x1="136" y1="116" x2="136" y2="248" stroke="#93c5fd"/>
  <line x1="48" y1="160" x2="180" y2="160" stroke="#93c5fd"/>
  <line x1="48" y1="204" x2="180" y2="204" stroke="#93c5fd"/>
  <!-- Z-order curve hint -->
  <polyline points="70,138 114,138 70,182 114,182" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="3 2"/>
  <!-- Inscribed R=500m circle -->
  <circle cx="114" cy="182" r="42" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="2"/>
  <circle cx="114" cy="182" r="4" fill="#0f172a"/>
  <!-- Boundary point inside R -->
  <circle cx="144" cy="182" r="4.5" fill="#059669"/>
  <!-- Corner false positive outside R -->
  <g class="crej">
    <circle cx="170" cy="126" r="5" fill="#e11d48"/>
    <text x="164" y="138" class="mono" font-size="10" font-weight="700" fill="#9f1239">× 780m</text>
  </g>
  <text x="114" y="264" class="mono" font-size="10" fill="#1e3a8a" text-anchor="middle">9 Cells (Center + 8 Neighbors)</text>

  <!-- Morton interleaving & rules -->
  <rect x="196" y="116" width="336" height="162" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="210" y="136" class="mono" font-size="10" font-weight="700" fill="#1e3a8a">Morton Bit Interleave (5b → base32):</text>
  <text x="210" y="154" class="mono" font-size="10" fill="#334155">Lon (even): 1 0 1 · Lat (odd): 0 1 → 9q8yy</text>
  <text x="210" y="176" class="sans" font-size="10.5" font-weight="700" fill="#065f46">1. Query 9 cells: fixes boundary splits</text>
  <text x="210" y="194" class="sans" font-size="10.5" font-weight="700" fill="#9f1239">2. Exact Haversine d ≤ R: drops corners</text>
  <text x="210" y="211" class="mono" font-size="10" fill="#be123c">   (L=6 box corners reach 2.05 km &gt; 500 m!)</text>
  <text x="210" y="232" class="sans" font-size="10.5" font-weight="700" fill="#2563eb">3. Rural step-down: L → L−1 if &lt; min</text>
  <text x="210" y="252" class="mono" font-size="10" fill="#475569">Role: Two-Tier Valkey Cache (L=4..6)</text>

  <!-- Q2 (TOP-RIGHT): ADAPTIVE POINT QUADTREE -->
  <rect x="570" y="76" width="526" height="222" rx="10" fill="#ffffff" class="q2"/>
  <text x="588" y="100" class="sans" font-size="13.5" font-weight="700" fill="#0f172a">2. Adaptive Point Quadtree (leaf ≤ 100) &amp; k-NN Pruning</text>

  <!-- Quadtree Grid Box -->
  <rect x="588" y="116" width="150" height="150" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <!-- Root split -->
  <line x1="663" y1="116" x2="663" y2="266" stroke="#64748b" stroke-width="1.2"/>
  <line x1="588" y1="191" x2="738" y2="191" stroke="#64748b" stroke-width="1.2"/>
  <!-- Dense NW city split deeper -->
  <line x1="625" y1="116" x2="625" y2="191" stroke="#059669" stroke-width="1"/>
  <line x1="588" y1="153" x2="663" y2="153" stroke="#059669" stroke-width="1"/>
  <line x1="606" y1="116" x2="606" y2="153" stroke="#059669" stroke-width="0.8"/>
  <line x1="588" y1="134" x2="625" y2="134" stroke="#059669" stroke-width="0.8"/>
  <!-- Pruned SE desert box -->
  <rect x="665" y="193" width="71" height="71" fill="#fff1f2" stroke="#e11d48" stroke-dasharray="3 2"/>
  <text x="700" y="232" class="mono" font-size="10" font-weight="700" fill="#9f1239" text-anchor="middle">PRUNED</text>
  <!-- Animated k-NN radius -->
  <circle cx="614" cy="144" r="44" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.8" class="knn"/>
  <circle cx="614" cy="144" r="4" fill="#059669"/>

  <rect x="754" y="116" width="324" height="162" rx="7" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="768" y="136" class="mono" font-size="10" font-weight="700" fill="#065f46">Density-Adaptive Subdivision:</text>
  <text x="768" y="154" class="sans" font-size="10.5" fill="#334155">• Downtown SF: Depth 14 (150m leaf)</text>
  <text x="768" y="172" class="sans" font-size="10.5" fill="#334155">• Rural NV Desert: Depth 5 (80km leaf)</text>
  <text x="768" y="194" class="mono" font-size="10" font-weight="700" fill="#065f46">Branch-and-Bound k-NN:</text>
  <text x="768" y="212" class="mono" font-size="10" fill="#334155">Prune if minDist(bounds) &gt; d_kth</text>
  <text x="768" y="234" class="mono" font-size="10" fill="#047857">200M POIs ≈ 3.5–4.5 GB RAM/pod</text>
  <text x="768" y="252" class="mono" font-size="10" fill="#92400e">Immutable CoW + Hot Delta + /readyz</text>

  <!-- Q3 (BOTTOM-LEFT): GOOGLE S2 HILBERT CURVE -->
  <rect x="24" y="314" width="526" height="214" rx="10" fill="#ffffff" class="q3"/>
  <text x="42" y="338" class="sans" font-size="13.5" font-weight="700" fill="#0f172a">3. Google S2: 64-Bit Hilbert Curve on Cube Faces</text>

  <!-- Hilbert Curve Box -->
  <rect x="44" y="354" width="136" height="136" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <!-- Order-2 Hilbert Curve path -->
  <polyline points="61,473 61,439 95,439 95,473 129,473 163,473 163,439 129,439 129,405 163,405 163,371 129,371 95,371 95,405 61,405 61,371" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="112" y="508" class="mono" font-size="10" fill="#5b21b6" text-anchor="middle">Continuous 1D Hilbert</text>

  <rect x="196" y="354" width="336" height="154" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="210" y="375" class="mono" font-size="10" font-weight="700" fill="#5b21b6">uint64 S2CellId (6 Cube Faces + Hilbert)</text>
  <text x="210" y="395" class="sans" font-size="10.5" fill="#334155">• Zero Z-order boundary jumps → sequential</text>
  <text x="210" y="411" class="sans" font-size="10.5" fill="#334155">  B-tree / LSM-tree disk range scans.</text>
  <text x="210" y="433" class="sans" font-size="10.5" font-weight="700" fill="#5b21b6">• S2RegionCoverer (Best for Polygons):</text>
  <text x="210" y="451" class="mono" font-size="10" fill="#334155">  Covers delivery geofences with bounded</text>
  <text x="210" y="467" class="mono" font-size="10" fill="#334155">  max_cells across min_level..max_level.</text>
  <text x="210" y="491" class="mono" font-size="10" fill="#4c1d95">Role: Geofences, Spanner/RocksDB ranges</text>

  <!-- Q4 (BOTTOM-RIGHT): UBER H3 HEXAGONAL GRIDDISK -->
  <rect x="570" y="314" width="526" height="214" rx="10" fill="#ffffff" class="q4"/>
  <text x="588" y="338" class="sans" font-size="13.5" font-weight="700" fill="#0f172a">4. Uber H3: Hexagonal gridDisk(1) Uniform Distance</text>

  <!-- 7-Hexagon Cluster (center 674, 424) -->
  <!-- Center hex -->
  <polygon points="694,424 684,441 664,441 654,424 664,407 684,407" fill="#d97706" fill-opacity="0.25" stroke="#d97706" stroke-width="2"/>
  <text x="674" y="428" class="mono" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">C</text>
  <!-- Top & Bottom hexes -->
  <polygon points="694,390 684,407 664,407 654,390 664,373 684,373" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <polygon points="694,458 684,475 664,475 654,458 664,441 684,441" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <!-- Right 2 hexes -->
  <polygon points="724,407 714,424 694,424 684,407 694,390 714,390" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <polygon points="724,441 714,458 694,458 684,441 694,424 714,424" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <!-- Left 2 hexes -->
  <polygon points="664,407 654,424 634,424 624,407 634,390 654,390" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <polygon points="664,441 654,458 634,458 624,441 634,424 654,424" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="674" y="508" class="mono" font-size="10" fill="#92400e" text-anchor="middle">1 + 6 = 7 Uniform Neighbors</text>

  <rect x="754" y="354" width="324" height="154" rx="7" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="768" y="375" class="mono" font-size="10" font-weight="700" fill="#92400e">Icosahedron Aperture-7 Hexagons (res 0..15)</text>
  <text x="768" y="395" class="sans" font-size="10.5" fill="#334155">• All 6 neighbors sit at exact equal</text>
  <text x="768" y="411" class="sans" font-size="10.5" fill="#334155">  center-to-center distance d!</text>
  <text x="768" y="433" class="sans" font-size="10.5" font-weight="700" fill="#9f1239">• Eliminates square √2·d diagonal skew</text>
  <text x="768" y="451" class="mono" font-size="10" fill="#334155">  and cuts k-ring channels 22% (7 vs 9).</text>
  <text x="768" y="491" class="mono" font-size="10" fill="#b45309">Role: Surge heatmaps, dispatch rings</text>

  <!-- FOOTER -->
  <rect x="24" y="542" width="1072" height="44" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="42" y="568" class="sans" font-size="11.5" font-weight="600" fill="#1e3a8a">Takeaway: Geohash 9-cell + Haversine powers Valkey caches; Quadtrees serve native k-NN; S2 covers arbitrary polygons; H3 removes √2 corner bias.</text>
</svg>
