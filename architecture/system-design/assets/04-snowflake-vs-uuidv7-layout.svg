<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 600" width="1160" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Snowflake vs UUIDv7 vs ULID bit layouts and B-tree impact</title>
  <desc id="desc">Bit-level layouts of a 64-bit Snowflake ID, a 128-bit RFC 9562 UUIDv7 and a 128-bit ULID, plus B-tree leaf page split behaviour for random UUIDv4 versus time-ordered inserts.</desc>
  <rect x="0" y="0" width="1160" height="600" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>
  <line x1="24" y1="58" x2="1136" y2="58" stroke="#1c1917" stroke-width="1.2"/>
  
  <text x="24" y="27" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#1c1917">ID Bit Layouts: Snowflake vs. UUIDv7 vs. ULID</text>
  <text x="24" y="46" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#57534e">Where the millisecond timestamp sits decides index locality; the remaining bits decide coordination cost</text>
  <text x="100" y="88" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1c1917">Twitter Snowflake — 64 bit</text>
  <text x="1060" y="88" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" text-anchor="end" fill="#57534e">2^41 ms ≈ 69.7 y · 4,096 IDs/ms/worker · 1,024 workers</text>
  <rect x="100" y="96" width="15" height="34" rx="3" fill="#e7e2d8" stroke="#d6d0c4"/>
  <text x="107.5" y="146" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" text-anchor="middle" fill="#44403c">1 sign</text>
  <rect x="115" y="96" width="615" height="34" rx="3" fill="#f0fdf9" stroke="#99f6e4"/>
  <text x="422.5" y="117" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#1c1917">41 b · timestamp (ms since custom epoch)</text>
  <rect x="730" y="96" width="75" height="34" rx="3" fill="#dcfce7" stroke="#86efac"/>
  <text x="767.5" y="117" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#1c1917">5 DC</text>
  <rect x="805" y="96" width="75" height="34" rx="3" fill="#dcfce7" stroke="#86efac"/>
  <text x="842.5" y="117" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#1c1917">5 wkr</text>
  <rect x="880" y="96" width="180" height="34" rx="3" fill="#fffbeb" stroke="#fde68a"/>
  <text x="970.0" y="117" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#1c1917">12 b · seq</text>
  <text x="100" y="192" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1c1917">UUIDv7 (RFC 9562) — 128 bit</text>
  <text x="1060" y="192" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" text-anchor="end" fill="#57534e">version = 7 · variant = 10</text>
  <rect x="100" y="200" width="360.0" height="34" rx="3" fill="#f0fdf9" stroke="#99f6e4"/>
  <text x="280.0" y="221" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#1c1917">48 b · unix_ts_ms</text>
  <rect x="460.0" y="200" width="30.0" height="34" rx="3" fill="#e7e2d8" stroke="#d6d0c4"/>
  <text x="475.0" y="250" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" text-anchor="middle" fill="#44403c">ver 4b</text>
  <rect x="490.0" y="200" width="90.0" height="34" rx="3" fill="#fffbeb" stroke="#fde68a"/>
  <text x="535.0" y="221" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#1c1917">12 b · rand_a</text>
  <rect x="580.0" y="200" width="15.0" height="34" rx="3" fill="#e7e2d8" stroke="#d6d0c4"/>
  <text x="587.5" y="250" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" text-anchor="middle" fill="#44403c">var 2b</text>
  <rect x="595.0" y="200" width="465.0" height="34" rx="3" fill="#fffbeb" stroke="#fde68a"/>
  <text x="827.5" y="221" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#1c1917">62 b · rand_b</text>
  <text x="100" y="296" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1c1917">ULID — 128 bit</text>
  <text x="1060" y="296" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" text-anchor="end" fill="#57534e">no version or variant bits</text>
  <rect x="100" y="304" width="360.0" height="34" rx="3" fill="#f0fdf9" stroke="#99f6e4"/>
  <text x="280.0" y="325" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#1c1917">48 b · timestamp (ms)</text>
  <rect x="460.0" y="304" width="600.0" height="34" rx="3" fill="#fffbeb" stroke="#fde68a"/>
  <text x="760.0" y="325" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#1c1917">80 b · randomness (Crockford base32, 26 chars)</text>
  <text x="100" y="376" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#44403c">Legend:</text>
  <rect x="170" y="366" width="12" height="12" rx="2" fill="#f0fdf9" stroke="#99f6e4"/>
  <text x="188" y="376" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" fill="#44403c">time prefix</text>
  <rect x="360" y="366" width="12" height="12" rx="2" fill="#dcfce7" stroke="#86efac"/>
  <text x="378" y="376" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" fill="#44403c">worker identity</text>
  <rect x="550" y="366" width="12" height="12" rx="2" fill="#fffbeb" stroke="#fde68a"/>
  <text x="568" y="376" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" fill="#44403c">sequence / random entropy</text>
  <rect x="740" y="366" width="12" height="12" rx="2" fill="#e7e2d8" stroke="#d6d0c4"/>
  <text x="758" y="376" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" fill="#44403c">fixed bits</text>
  <rect x="20" y="396" width="500" height="184" rx="6" fill="#fff5f5" stroke="#fecaca"/>
  <text x="34" y="418" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#991b1b">UUIDv4 (random): inserts hit any leaf</text>
  <text x="34" y="436" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" fill="#44403c">Every leaf stays hot; full leaves split mid-tree</text>
  <rect x="34" y="452" width="52" height="48" rx="4" fill="#fecaca" stroke="#d6d0c4"/>
  <text x="60" y="481" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#44403c">leaf1</text>
  <rect x="94" y="452" width="52" height="48" rx="4" fill="#fecaca" stroke="#d6d0c4"/>
  <text x="120" y="481" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#44403c">leaf2</text>
  <rect x="154" y="452" width="52" height="48" rx="4" fill="#fecaca" stroke="#d6d0c4"/>
  <text x="180" y="481" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#44403c">leaf3</text>
  <rect x="214" y="452" width="52" height="48" rx="4" fill="#fecaca" stroke="#d6d0c4"/>
  <text x="240" y="481" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#44403c">leaf4</text>
  <rect x="274" y="452" width="52" height="48" rx="4" fill="#fecaca" stroke="#d6d0c4"/>
  <text x="300" y="481" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#44403c">leaf5</text>
  <rect x="334" y="452" width="52" height="48" rx="4" fill="#fecaca" stroke="#d6d0c4"/>
  <text x="360" y="481" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#44403c">leaf6</text>
  <rect x="394" y="452" width="52" height="48" rx="4" fill="#fecaca" stroke="#d6d0c4"/>
  <text x="420" y="481" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#44403c">leaf7</text>
  <rect x="454" y="452" width="52" height="48" rx="4" fill="#fecaca" stroke="#d6d0c4"/>
  <text x="480" y="481" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#44403c">leaf8</text>
  <text x="34" y="524" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" fill="#44403c">Pages ~50-70% full after splits; extra WAL and write amplification</text>
  <text x="34" y="542" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" fill="#44403c">Working set = entire index, so buffer-pool misses and random IO</text>
  <text x="34" y="560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" fill="#44403c">Fix: UUIDv7 / Snowflake / ULID, or accept it only for small tables</text>
  <rect x="640" y="396" width="500" height="184" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="654" y="418" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#166534">Time-ordered (v7, ULID, Snowflake): append right</text>
  <text x="654" y="436" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" fill="#44403c">Only the rightmost leaf is hot; old leaves stay cold</text>
  <rect x="654" y="452" width="52" height="48" rx="4" fill="#ffffff" stroke="#d6d0c4"/>
  <text x="680" y="481" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#44403c">leaf1</text>
  <rect x="714" y="452" width="52" height="48" rx="4" fill="#ffffff" stroke="#d6d0c4"/>
  <text x="740" y="481" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#44403c">leaf2</text>
  <rect x="774" y="452" width="52" height="48" rx="4" fill="#ffffff" stroke="#d6d0c4"/>
  <text x="800" y="481" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#44403c">leaf3</text>
  <rect x="834" y="452" width="52" height="48" rx="4" fill="#ffffff" stroke="#d6d0c4"/>
  <text x="860" y="481" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#44403c">leaf4</text>
  <rect x="894" y="452" width="52" height="48" rx="4" fill="#ffffff" stroke="#d6d0c4"/>
  <text x="920" y="481" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#44403c">leaf5</text>
  <rect x="954" y="452" width="52" height="48" rx="4" fill="#ffffff" stroke="#d6d0c4"/>
  <text x="980" y="481" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#44403c">leaf6</text>
  <rect x="1014" y="452" width="52" height="48" rx="4" fill="#ffffff" stroke="#d6d0c4"/>
  <text x="1040" y="481" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#44403c">leaf7</text>
  <rect x="1074" y="452" width="52" height="48" rx="4" fill="#bbf7d0" stroke="#d6d0c4"/>
  <text x="1100" y="481" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#44403c">leaf8</text>
  <text x="654" y="524" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" fill="#44403c">Appends fill leaves near 100% (fillfactor), few mid-tree splits</text>
  <text x="654" y="542" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" fill="#44403c">Working set = right edge; sequential WAL; cache-friendly</text>
  <text x="654" y="560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" fill="#44403c">Trade-off: creation time leaks; hot right edge under extreme rates</text>
</svg>
