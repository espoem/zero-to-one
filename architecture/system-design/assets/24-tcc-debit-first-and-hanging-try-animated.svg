<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" width="1120" height="580" role="img" aria-labelledby="title desc">
  <title id="title">TC/C Debit-First Phase 1 and Out-of-Order Hanging-Try Tombstone</title>
  <desc id="desc">Animated Try-Confirm/Cancel (TC/C) distributed wallet transaction protocol: Top panel illustrates the valid debit-first Phase 1 (deduct -$1 from Account A immediately while performing NOP on Account C, zero locks held between phases, followed by Confirm +$1 on C or Cancel +$1 refund on A), contrasted against the invalid credit-receiver-first phantom double-spend bug. Bottom panel illustrates the Out-of-Order Hanging-Try race where Cancel arrives at Shard A before a delayed Try packet, persists out_of_order_flag = TRUE in the co-located phase_status table, and causes the late Try packet to abort with OUT_OF_ORDER_CANCEL_TOMBSTONE without debiting Account A.</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* 12s cycle:
       0-25%  (0-3s): Step 1 — Normal TC/C Debit-First Try (A -$1, C NOP) + Confirm (C +$1)
       25-50% (3-6s): Step 2 — Delayed Try(tx_9) stalls in network; Coordinator times out
       50-75% (6-9s): Step 3 — Cancel(tx_9) arrives FIRST -> writes out_of_order_flag=TRUE tombstone
       75-100%(9-12s):Step 4 — Late Hanging Try arrives -> sees tombstone -> ABORTED ($0 lost!)
    */

    @keyframes try-delay-pkt {
      0%, 24%  { transform: translate(0px, 0px); opacity: 0; }
      28%      { transform: translate(0px, 0px); opacity: 1; }
      48%, 70% { transform: translate(190px, 0px); opacity: 1; }
      84%, 96% { transform: translate(396px, 0px); opacity: 1; }
      100%     { transform: translate(396px, 0px); opacity: 0; }
    }

    @keyframes cancel-fast-pkt {
      0%, 48%  { transform: translate(0px, 0px); opacity: 0; }
      52%      { transform: translate(0px, 0px); opacity: 1; }
      68%, 92% { transform: translate(396px, 0px); opacity: 1; }
      100%     { transform: translate(396px, 0px); opacity: 0; }
    }

    @keyframes tomb-glow {
      0%, 62%  { opacity: 0.86; }
      68%, 98% { opacity: 1; }
      100%     { opacity: 0.86; }
    }

    @keyframes s1-hl { 0%, 24% { stroke: #059669; stroke-width: 2.2; opacity: 1; } 25%, 100% { stroke: #cbd5e1; stroke-width: 1; opacity: 0.86; } }
    @keyframes s2-hl { 0%, 24% { stroke: #cbd5e1; stroke-width: 1; opacity: 0.86; } 25%, 49% { stroke: #d97706; stroke-width: 2.2; opacity: 1; } 50%, 100% { stroke: #cbd5e1; stroke-width: 1; opacity: 0.86; } }
    @keyframes s3-hl { 0%, 49% { stroke: #cbd5e1; stroke-width: 1; opacity: 0.86; } 50%, 74% { stroke: #7c3aed; stroke-width: 2.2; opacity: 1; } 75%, 100% { stroke: #cbd5e1; stroke-width: 1; opacity: 0.86; } }
    @keyframes s4-hl { 0%, 74% { stroke: #cbd5e1; stroke-width: 1; opacity: 0.86; } 75%, 100% { stroke: #e11d48; stroke-width: 2.2; opacity: 1; } }

    .pkt-try { animation: try-delay-pkt 12s ease-in-out infinite; }
    .pkt-can { animation: cancel-fast-pkt 12s ease-in-out infinite; }
    .tomb    { animation: tomb-glow 12s ease-in-out infinite; }
    .s1 { animation: s1-hl 12s linear infinite; }
    .s2 { animation: s2-hl 12s linear infinite; }
    .s3 { animation: s3-hl 12s linear infinite; }
    .s4 { animation: s4-hl 12s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .pkt-try, .pkt-can, .tomb, .s1, .s2, .s3, .s4 { animation: none !important; }
      .pkt-try { transform: translate(190px, 0px) !important; opacity: 1 !important; }
      .pkt-can { transform: translate(396px, 0px) !important; opacity: 1 !important; }
      .tomb, .s1, .s2, .s3, .s4 { opacity: 1 !important; }
    }
  </style>

  <defs>
    <marker id="arr-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arr-v" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1120" height="580" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="1120" height="60" rx="12" fill="#0f172a"/>
  <rect x="0" y="44" width="1120" height="16" fill="#0f172a"/>
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#f8fafc">Try-Confirm/Cancel (TC/C): Debit-First Phase 1 &amp; Hanging-Try Tombstone</text>
  <text x="24" y="47" class="sans" font-size="12" fill="#94a3b8">M24 §2.2 &amp; §2.3 · Try (A −$1, C NOP) · Co-Located phase_status Table · out_of_order_flag = TRUE Neutralizes Delayed Try</text>

  <!-- TOP PANEL: DEBIT-FIRST INVARIANT -->
  <rect x="24" y="76" width="1072" height="168" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="42" y="100" class="sans" font-size="13.5" font-weight="700" fill="#0f172a">1. Debit-First TC/C Protocol (Zero Locks Held Across Network RTTs)</text>

  <!-- Phase 1 Try -->
  <rect x="42" y="114" width="320" height="114" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="56" y="135" class="sans" font-size="12" font-weight="700" fill="#065f46">Phase 1: Try (Local TX &lt; 2 ms)</text>
  <text x="56" y="155" class="mono" font-size="10.5" font-weight="700" fill="#047857">Shard A: balance -= $1.00 (FREEZE)</text>
  <text x="56" y="173" class="mono" font-size="10.5" fill="#334155">Shard C: NOP (Do nothing!)</text>
  <text x="56" y="194" class="sans" font-size="10" fill="#065f46">Valid: Neither A nor C can spend the</text>
  <text x="56" y="209" class="sans" font-size="10" fill="#065f46">in-flight $1.00 while Confirm runs.</text>

  <line x1="362" y1="154" x2="394" y2="140" stroke="#059669" stroke-width="2" marker-end="url(#arr-g)"/>
  <line x1="362" y1="184" x2="394" y2="196" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-s)"/>

  <!-- Phase 2a / 2b -->
  <rect x="400" y="114" width="328" height="52" rx="7" fill="#eff6ff" stroke="#2563eb"/>
  <text x="414" y="135" class="sans" font-size="11.5" font-weight="700" fill="#1e3a8a">Phase 2a: Confirm (All Try OK)</text>
  <text x="414" y="153" class="mono" font-size="10" fill="#1e40af">Shard A: NOP · Shard C: balance += $1.00</text>

  <rect x="400" y="176" width="328" height="52" rx="7" fill="#fffbeb" stroke="#d97706"/>
  <text x="414" y="197" class="sans" font-size="11.5" font-weight="700" fill="#92400e">Phase 2b: Cancel (Failure / Timeout)</text>
  <text x="414" y="215" class="mono" font-size="10" fill="#b45309">Shard A: balance += $1.00 · Shard C: NOP</text>

  <!-- Invalid Credit-First Warning -->
  <rect x="746" y="114" width="332" height="114" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="760" y="135" class="sans" font-size="12" font-weight="700" fill="#9f1239">ANTI-PATTERN: Credit C First in Try</text>
  <text x="760" y="155" class="mono" font-size="10" fill="#be123c">If Try runs A: NOP, C: +$1.00:</text>
  <text x="760" y="175" class="sans" font-size="10" fill="#334155">1. C sees phantom +$1 and withdraws it!</text>
  <text x="760" y="193" class="sans" font-size="10" fill="#334155">2. Phase 2 finds A had $0 → Cancel fails.</text>
  <text x="760" y="213" class="mono" font-size="10" font-weight="700" fill="#e11d48">Result: Unbacked Double-Spend Loss!</text>

  <!-- BOTTOM PANEL: OUT-OF-ORDER HANGING-TRY RACE & TOMBSTONE -->
  <rect x="24" y="260" width="1072" height="248" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="42" y="284" class="sans" font-size="13.5" font-weight="700" fill="#0f172a">2. Out-of-Order Execution Race ("Hanging Try") &amp; out_of_order_flag Tombstone Defense</text>

  <!-- Sequence Lanes -->
  <rect x="42" y="300" width="160" height="148" rx="7" fill="#eff6ff" stroke="#2563eb"/>
  <text x="122" y="324" class="sans" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Coordinator</text>
  <text x="122" y="352" class="mono" font-size="10" fill="#334155" text-anchor="middle">1. Send Try(tx_9)</text>
  <text x="122" y="376" class="mono" font-size="10" fill="#92400e" text-anchor="middle">2. Timeout waiting</text>
  <text x="122" y="400" class="mono" font-size="10" fill="#7c3aed" text-anchor="middle">3. Send Cancel(tx_9)</text>

  <!-- Network Track Lines -->
  <line x1="202" y1="348" x2="646" y2="348" stroke="#d97706" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arr-s)"/>
  <text x="424" y="338" class="mono" font-size="10" fill="#92400e" text-anchor="middle">Network Delay / Reordering (Try arrives AFTER Cancel!)</text>

  <line x1="202" y1="398" x2="646" y2="398" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-v)"/>
  <text x="424" y="422" class="mono" font-size="10" font-weight="700" fill="#5b21b6" text-anchor="middle">Cancel(tx_9) overtakes Try &amp; arrives FIRST at Shard A</text>

  <!-- Animated Packets -->
  <g class="pkt-try">
    <rect x="206" y="336" width="96" height="22" rx="4" fill="#d97706" stroke="#ffffff" stroke-width="1.5"/>
    <text x="254" y="351" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Try(tx_9,-$1)</text>
  </g>
  <g class="pkt-can">
    <rect x="206" y="386" width="96" height="22" rx="4" fill="#7c3aed" stroke="#ffffff" stroke-width="1.5"/>
    <text x="254" y="401" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Cancel(tx_9)</text>
  </g>

  <!-- Shard A + phase_status Table -->
  <g class="tomb">
    <rect x="652" y="300" width="426" height="148" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="668" y="322" class="sans" font-size="12" font-weight="700" fill="#5b21b6">Shard A (Co-Located phase_status Table)</text>
    <rect x="668" y="334" width="394" height="58" rx="5" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="680" y="352" class="mono" font-size="10" font-weight="700" fill="#0f172a">tx_9 | try: NOT_SENT | 2nd: CANCEL | out_of_order_flag: TRUE</text>
    <text x="680" y="370" class="mono" font-size="10" fill="#5b21b6">Cancel sees NOT_SENT → persists tombstone row instead of no-op!</text>
    <text x="680" y="384" class="mono" font-size="10" fill="#64748b">(Also rejects Cancel if already CONFIRMED)</text>

    <rect x="668" y="400" width="394" height="38" rx="5" fill="#fff1f2" stroke="#e11d48"/>
    <text x="865" y="416" class="mono" font-size="10" font-weight="700" fill="#9f1239" text-anchor="middle">4. Delayed Try arrives → checks out_of_order_flag == TRUE</text>
    <text x="865" y="431" class="mono" font-size="10" font-weight="700" fill="#e11d48" text-anchor="middle">ABORT: OUT_OF_ORDER_CANCEL_TOMBSTONE ($0 debited!)</text>
  </g>

  <!-- 4-step bottom strip -->
  <rect x="42" y="460" width="248" height="34" rx="5" fill="#ecfdf5" class="s1"/>
  <text x="166" y="481" class="mono" font-size="10" fill="#065f46" text-anchor="middle">1. Debit A (-$1) first in Try</text>

  <rect x="304" y="460" width="248" height="34" rx="5" fill="#fffbeb" class="s2"/>
  <text x="428" y="481" class="mono" font-size="10" fill="#92400e" text-anchor="middle">2. Try(tx_9) stalls → timeout</text>

  <rect x="566" y="460" width="254" height="34" rx="5" fill="#f5f3ff" class="s3"/>
  <text x="693" y="481" class="mono" font-size="10" fill="#5b21b6" text-anchor="middle">3. Cancel writes Tombstone</text>

  <rect x="834" y="460" width="244" height="34" rx="5" fill="#fff1f2" class="s4"/>
  <text x="956" y="481" class="mono" font-size="10" fill="#9f1239" text-anchor="middle">4. Late Try aborts safely</text>

  <!-- FOOTER -->
  <rect x="24" y="522" width="1072" height="44" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="42" y="548" class="sans" font-size="11.5" font-weight="600" fill="#1e3a8a">Takeaway: Debit-first Phase 1 prevents phantom spend without 2PC locks, and persistent out_of_order_flag tombstones neutralize Hanging-Try packets.</text>
</svg>
