<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Stage 9: Logging, Metrics, SLO Alerting, and Autoscaling Feedback Loop</title>
  <desc id="desc">Animated schematic of Stage 9 observability and automation showing the production fleet emitting structured logs, Prometheus/OpenTelemetry metrics, and traces through an ingestion pipeline into centralized log storage, TSDB with multi-window SLO burn-rate alerting, and CI/CD plus HPA/KEDA autoscaling feedback loops.</desc>
  <defs>
    <style>
      .flow-blue { stroke-dasharray: 8 6;  }
      .flow-green { stroke-dasharray: 8 6;  }
      .flow-amber { stroke-dasharray: 7 5;  }
      .flow-violet { stroke-dasharray: 8 6;  }
      
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
        .smil-packet { display: none !important; }
      }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
    <marker id="arr-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1120" height="560" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>

  <!-- Header -->
  <line x1="24" y1="64" x2="1096" y2="64" stroke="#1c1917" stroke-width="1.2"/>
  
  <text x="24" y="29" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#1c1917">Stage 9 · Observability, SLO Burn-Rate Alerting &amp; Autoscaling Automation (10M+ DAU)</text>
  <text x="24" y="49" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#57534e">Unified OpenTelemetry pipelines drive centralized logs, Prometheus 3.16 TSDB histograms, SLO burn-rate alerts, and stabilized HPA/KEDA scaling</text>

  <!-- 1. PRODUCTION FLEET -->
  <g transform="translate(24, 92)">
    <rect x="0" y="0" width="234" height="314" rx="12" fill="#f0fdf9" stroke="#0f766e" stroke-width="2"/>
    <rect x="0" y="0" width="234" height="34" rx="12" fill="#065f46"/>
    <rect x="0" y="20" width="234" height="14" fill="#065f46"/>
    <text x="117" y="22" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Production Fleet</text>

    <rect x="16" y="48" width="202" height="66" rx="6" fill="#ffffff" stroke="#99f6e4"/>
    <text x="28" y="68" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">Stateless Web Pods</text>
    <text x="28" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#44403c">• OTel SDK spans + red/use</text>
    <text x="28" y="102" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#44403c">• Structured JSON logs</text>

    <rect x="16" y="126" width="202" height="66" rx="6" fill="#ffffff" stroke="#99f6e4"/>
    <text x="28" y="146" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">Async Worker Pool</text>
    <text x="28" y="164" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#44403c">• Queue lag &amp; retry counts</text>
    <text x="28" y="180" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#44403c">• Trace context propagation</text>

    <rect x="16" y="204" width="202" height="66" rx="6" fill="#ffffff" stroke="#99f6e4"/>
    <text x="28" y="224" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">DB, Cache &amp; eBPF Host</text>
    <text x="28" y="242" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#44403c">• WAL lag, lock wait, IOPS</text>
    <text x="28" y="258" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#44403c">• Continuous CPU profiling</text>

    <text x="117" y="295" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#065f46">OTLP gRPC / HTTP</text>
  </g>

  <!-- 2. INGESTION PIPELINE -->
  <g transform="translate(314, 114)">
    <rect x="0" y="0" width="200" height="270" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
    <rect x="0" y="0" width="200" height="34" rx="12" fill="#b45309"/>
    <rect x="0" y="20" width="200" height="14" fill="#b45309"/>
    <text x="100" y="22" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">OTel Ingestion</text>

    <rect x="14" y="48" width="172" height="60" rx="6" fill="#ffffff" stroke="#fde68a"/>
    <text x="24" y="68" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400e">Tail-Based Sampling</text>
    <text x="24" y="85" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#44403c">Keep 100% errors &amp; slow</text>
    <text x="24" y="99" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#44403c">traces; sample 1% normal</text>

    <rect x="14" y="120" width="172" height="66" rx="6" fill="#ffffff" stroke="#fde68a"/>
    <text x="24" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400e">Cardinality Guard</text>
    <text x="24" y="157" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#991b1b">Strip user_id / request_id</text>
    <text x="24" y="172" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#44403c">from TSDB metric labels</text>

    <rect x="14" y="198" width="172" height="54" rx="6" fill="#fffbeb" stroke="#b45309"/>
    <text x="100" y="220" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#92400e">PII Redaction &amp; Buffer</text>
    <text x="100" y="237" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#92400e">Kafka / Memory batching</text>
  </g>

  <!-- Step 1: Fleet -> Ingestion -->
  <path d="M 258 248 L 310 248" fill="none" stroke="#0f766e" stroke-width="2.4" class="flow-blue" marker-end="url(#arr-blue)"/>
  <circle class="smil-packet" r="5" fill="#0f766e" opacity="0">
    <animateMotion dur="1.4s" repeatCount="indefinite" path="M 258 248 L 310 248"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <g class="pulse-badge" transform="translate(284, 222)">
    <circle cx="0" cy="0" r="11" fill="#0f766e"/>
    <text x="0" y="4" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">1</text>
  </g>

  <!-- 3. CENTRALIZED STORES & SLO ENGINE -->
  <g transform="translate(572, 86)">
    <!-- Log Store -->
    <rect x="0" y="0" width="256" height="94" rx="10" fill="#f5f1e8" stroke="#0f766e" stroke-width="1.6"/>
    <text x="16" y="24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#065f46">Centralized Log Store</text>
    <text x="16" y="43" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#065f46">ClickHouse / Loki / OpenSearch</text>
    <text x="16" y="62" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#44403c">• Correlated by trace_id</text>
    <text x="16" y="79" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#44403c">• Hot/Cold S3 tiered retention</text>

    <!-- TSDB + SLO Burn-Rate Alerting -->
    <rect x="0" y="110" width="256" height="122" rx="10" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.8"/>
    <text x="16" y="134" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#065f46">TSDB + SLO Burn-Rate</text>
    <text x="16" y="153" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#065f46">Prometheus 3.16 Native Hist.</text>
    <rect x="16" y="164" width="224" height="54" rx="6" fill="#fef2f2" stroke="#fda4af"/>
    <text x="26" y="182" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#991b1b">Multi-Window Burn Alerting</text>
    <text x="26" y="198" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#44403c">Page on error-budget burn (2% in</text>
    <text x="26" y="211" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#44403c">1h), NOT noisy raw CPU spikes</text>

    <!-- Traces & Profiling -->
    <rect x="0" y="248" width="256" height="82" rx="10" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.6"/>
    <text x="16" y="272" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#065f46">Traces &amp; eBPF Profiles</text>
    <text x="16" y="291" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#0f766e">Tempo / Jaeger + Pyroscope</text>
    <text x="16" y="311" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#44403c">Pinpoints p99 tail-latency spans</text>
  </g>

  <!-- Step 2: Ingestion -> 3 Stores -->
  <path d="M 514 196 L 568 134" fill="none" stroke="#0f766e" stroke-width="2" class="flow-violet" marker-end="url(#arr-violet)"/>
  <path d="M 514 252 L 568 252" fill="none" stroke="#0f766e" stroke-width="2.2" class="flow-green" marker-end="url(#arr-green)"/>
  <path d="M 514 306 L 568 370" fill="none" stroke="#0f766e" stroke-width="2" class="flow-blue" marker-end="url(#arr-blue)"/>

  <circle class="smil-packet" r="4" fill="#0f766e" opacity="0">
    <animateMotion dur="1.6s" repeatCount="indefinite" path="M 514 196 L 568 134"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle class="smil-packet" r="4.5" fill="#0f766e" opacity="0">
    <animateMotion dur="1.4s" repeatCount="indefinite" path="M 514 252 L 568 252"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle class="smil-packet" r="4" fill="#0f766e" opacity="0">
    <animateMotion dur="1.6s" begin="0.5s" repeatCount="indefinite" path="M 514 306 L 568 370"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="1.6s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <g class="pulse-badge" transform="translate(541, 224)">
    <circle cx="0" cy="0" r="11" fill="#b45309"/>
    <text x="0" y="4" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">2</text>
  </g>

  <!-- 4. AUTOMATION: CI/CD + HPA / KEDA -->
  <g transform="translate(882, 86)">
    <rect x="0" y="0" width="214" height="330" rx="12" fill="#f5f1e8" stroke="#0f766e" stroke-width="2"/>
    <rect x="0" y="0" width="214" height="34" rx="12" fill="#065f46"/>
    <rect x="0" y="20" width="214" height="14" fill="#065f46"/>
    <text x="107" y="22" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">Automation &amp; Scaling</text>

    <rect x="14" y="48" width="186" height="114" rx="8" fill="#ffffff" stroke="#d6d0c4"/>
    <text x="24" y="68" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">HPA v2 + KEDA</text>
    <text x="24" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#44403c">• Scales on queue depth &amp;</text>
    <text x="24" y="100" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#44403c">  RPS (not laggy CPU)</text>
    <text x="24" y="117" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#0f766e">scaleDown: 300s window</text>
    <text x="24" y="133" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#44403c">• Tracks in-flight boots</text>
    <text x="24" y="148" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#44403c">• Stops sawtooth thrashing</text>

    <rect x="14" y="176" width="186" height="90" rx="8" fill="#ffffff" stroke="#d6d0c4"/>
    <text x="24" y="196" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">CI/CD Wave Rollouts</text>
    <text x="24" y="214" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#44403c">• Canary Cell 0 -&gt; 1 -&gt; All</text>
    <text x="24" y="230" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#991b1b">• Auto-rollback on SLO</text>
    <text x="24" y="245" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#991b1b">  burn-rate breach</text>

    <rect x="14" y="278" width="186" height="38" rx="6" fill="#f0fdf9" stroke="#99f6e4"/>
    <text x="107" y="301" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#065f46">Karpenter Rapid Nodes</text>
  </g>

  <!-- Step 3: TSDB/SLO -> Automation -->
  <path d="M 828 256 L 878 256" fill="none" stroke="#0f766e" stroke-width="2.4" class="flow-green" marker-end="url(#arr-green)"/>
  <circle class="smil-packet" r="4.5" fill="#0f766e" opacity="0">
    <animateMotion dur="1.4s" repeatCount="indefinite" path="M 828 256 L 878 256"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <g class="pulse-badge" transform="translate(853, 232)">
    <circle cx="0" cy="0" r="11" fill="#0f766e"/>
    <text x="0" y="4" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">3</text>
  </g>

  <!-- Step 4: Feedback Loop Automation -> Fleet -->
  <path d="M 989 416 L 989 448 L 141 448 L 141 410" fill="none" stroke="#0f766e" stroke-width="2.4" class="flow-violet" marker-end="url(#arr-violet)"/>
  <circle class="smil-packet" r="5" fill="#0f766e" opacity="0">
    <animateMotion dur="3.0s" repeatCount="indefinite" path="M 989 416 L 989 448 L 141 448 L 141 410"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="3.0s" repeatCount="indefinite"/>
  </circle>
  <g class="pulse-badge" transform="translate(560, 448)">
    <circle cx="0" cy="0" r="11" fill="#0f766e"/>
    <text x="0" y="4" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">4</text>
  </g>
  <rect x="580" y="435" width="290" height="24" rx="12" fill="#f5f1e8" stroke="#d6d0c4"/>
  <text x="725" y="451" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#065f46">Closed-Loop Autoscale &amp; Canary Rollback</text>

  <!-- Footer -->
  <rect x="24" y="476" width="1072" height="66" rx="8" fill="#f5f1e8" stroke="#d6d0c4" stroke-width="1"/>
  <circle cx="46" cy="498" r="5" fill="#0f766e"/>
  <text x="58" y="502" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#44403c">1. Emit OTLP Telemetry</text>
  <circle cx="222" cy="498" r="5" fill="#b45309"/>
  <text x="234" y="502" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#44403c">2. Scrub &amp; Guard Cardinality</text>
  <circle cx="430" cy="498" r="5" fill="#0f766e"/>
  <text x="442" y="502" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#44403c">3. SLO Burn-Rate Triggers</text>
  <circle cx="628" cy="498" r="5" fill="#0f766e"/>
  <text x="640" y="502" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#065f46">4. Stabilized HPA/KEDA &amp; Rollback</text>
  <text x="42" y="526" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1c1917"><tspan font-weight="700">Engineering Takeaway:</tspan> Page on multi-window SLO error-budget burn instead of CPU spikes, enforce 300 s scale-down hysteresis, and keep /readyz shallow.</text>
</svg>
