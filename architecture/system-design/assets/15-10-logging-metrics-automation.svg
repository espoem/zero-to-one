<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Stage 9: Logging, Metrics, SLO Alerting, and Autoscaling Feedback Loop</title>
  <desc id="desc">Animated schematic of Stage 9 observability and automation showing the production fleet emitting structured logs, Prometheus/OpenTelemetry metrics, and traces through an ingestion pipeline into centralized log storage, TSDB with multi-window SLO burn-rate alerting, and CI/CD plus HPA/KEDA autoscaling feedback loops.</desc>
  <defs>
    <style>
      .flow-blue { stroke-dasharray: 8 6; animation: dash-flow 1.4s linear infinite; }
      .flow-green { stroke-dasharray: 8 6; animation: dash-flow 1.4s linear infinite; }
      .flow-amber { stroke-dasharray: 7 5; animation: dash-flow 1.6s linear infinite; }
      .flow-violet { stroke-dasharray: 8 6; animation: dash-flow 1.5s linear infinite; }
      .pulse-badge { animation: badge-pulse 2.2s ease-in-out infinite; }
      @keyframes dash-flow { to { stroke-dashoffset: -28; } }
      @keyframes badge-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.72; } }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
        .smil-packet { display: none !important; }
      }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arr-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1120" height="560" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="1120" height="62" rx="12" fill="#0f172a"/>
  <rect x="0" y="46" width="1120" height="16" fill="#0f172a"/>
  <text x="24" y="29" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Stage 9 · Observability, SLO Burn-Rate Alerting &amp; Autoscaling Automation (10M+ DAU)</text>
  <text x="24" y="49" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Unified OpenTelemetry pipelines drive centralized logs, Prometheus 3.16 TSDB histograms, SLO burn-rate alerts, and stabilized HPA/KEDA scaling</text>

  <!-- 1. PRODUCTION FLEET -->
  <g transform="translate(24, 92)">
    <rect x="0" y="0" width="234" height="314" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="0" y="0" width="234" height="34" rx="12" fill="#1d4ed8"/>
    <rect x="0" y="20" width="234" height="14" fill="#1d4ed8"/>
    <text x="117" y="22" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Production Fleet</text>

    <rect x="16" y="48" width="202" height="66" rx="6" fill="#ffffff" stroke="#93c5fd"/>
    <text x="28" y="68" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">Stateless Web Pods</text>
    <text x="28" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">• OTel SDK spans + red/use</text>
    <text x="28" y="102" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">• Structured JSON logs</text>

    <rect x="16" y="126" width="202" height="66" rx="6" fill="#ffffff" stroke="#93c5fd"/>
    <text x="28" y="146" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">Async Worker Pool</text>
    <text x="28" y="164" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">• Queue lag &amp; retry counts</text>
    <text x="28" y="180" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">• Trace context propagation</text>

    <rect x="16" y="204" width="202" height="66" rx="6" fill="#ffffff" stroke="#93c5fd"/>
    <text x="28" y="224" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">DB, Cache &amp; eBPF Host</text>
    <text x="28" y="242" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">• WAL lag, lock wait, IOPS</text>
    <text x="28" y="258" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">• Continuous CPU profiling</text>

    <text x="117" y="295" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#1e40af">OTLP gRPC / HTTP</text>
  </g>

  <!-- 2. INGESTION PIPELINE -->
  <g transform="translate(314, 114)">
    <rect x="0" y="0" width="200" height="270" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
    <rect x="0" y="0" width="200" height="34" rx="12" fill="#b45309"/>
    <rect x="0" y="20" width="200" height="14" fill="#b45309"/>
    <text x="100" y="22" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">OTel Ingestion</text>

    <rect x="14" y="48" width="172" height="60" rx="6" fill="#ffffff" stroke="#fcd34d"/>
    <text x="24" y="68" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400e">Tail-Based Sampling</text>
    <text x="24" y="85" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">Keep 100% errors &amp; slow</text>
    <text x="24" y="99" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">traces; sample 1% normal</text>

    <rect x="14" y="120" width="172" height="66" rx="6" fill="#ffffff" stroke="#fcd34d"/>
    <text x="24" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400e">Cardinality Guard</text>
    <text x="24" y="157" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#9f1239">Strip user_id / request_id</text>
    <text x="24" y="172" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">from TSDB metric labels</text>

    <rect x="14" y="198" width="172" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="100" y="220" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#78350f">PII Redaction &amp; Buffer</text>
    <text x="100" y="237" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#92400e">Kafka / Memory batching</text>
  </g>

  <!-- Step 1: Fleet -> Ingestion -->
  <path d="M 258 248 L 310 248" fill="none" stroke="#2563eb" stroke-width="2.4" class="flow-blue" marker-end="url(#arr-blue)"/>
  <circle class="smil-packet" r="5" fill="#2563eb" opacity="0">
    <animateMotion dur="1.4s" repeatCount="indefinite" path="M 258 248 L 310 248"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <g class="pulse-badge" transform="translate(284, 222)">
    <circle cx="0" cy="0" r="11" fill="#2563eb"/>
    <text x="0" y="4" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">1</text>
  </g>

  <!-- 3. CENTRALIZED STORES & SLO ENGINE -->
  <g transform="translate(572, 86)">
    <!-- Log Store -->
    <rect x="0" y="0" width="256" height="94" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
    <text x="16" y="24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#4c1d95">Centralized Log Store</text>
    <text x="16" y="43" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#6d28d9">ClickHouse / Loki / OpenSearch</text>
    <text x="16" y="62" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">• Correlated by trace_id</text>
    <text x="16" y="79" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">• Hot/Cold S3 tiered retention</text>

    <!-- TSDB + SLO Burn-Rate Alerting -->
    <rect x="0" y="110" width="256" height="122" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
    <text x="16" y="134" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#065f46">TSDB + SLO Burn-Rate</text>
    <text x="16" y="153" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#047857">Prometheus 3.16 Native Hist.</text>
    <rect x="16" y="164" width="224" height="54" rx="6" fill="#fff1f2" stroke="#fda4af"/>
    <text x="26" y="182" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#9f1239">Multi-Window Burn Alerting</text>
    <text x="26" y="198" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">Page on error-budget burn (2% in</text>
    <text x="26" y="211" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">1h), NOT noisy raw CPU spikes</text>

    <!-- Traces & Profiling -->
    <rect x="0" y="248" width="256" height="82" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
    <text x="16" y="272" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1e3a8a">Traces &amp; eBPF Profiles</text>
    <text x="16" y="291" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#2563eb">Tempo / Jaeger + Pyroscope</text>
    <text x="16" y="311" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">Pinpoints p99 tail-latency spans</text>
  </g>

  <!-- Step 2: Ingestion -> 3 Stores -->
  <path d="M 514 196 L 568 134" fill="none" stroke="#7c3aed" stroke-width="2" class="flow-violet" marker-end="url(#arr-violet)"/>
  <path d="M 514 252 L 568 252" fill="none" stroke="#059669" stroke-width="2.2" class="flow-green" marker-end="url(#arr-green)"/>
  <path d="M 514 306 L 568 370" fill="none" stroke="#2563eb" stroke-width="2" class="flow-blue" marker-end="url(#arr-blue)"/>

  <circle class="smil-packet" r="4" fill="#7c3aed" opacity="0">
    <animateMotion dur="1.6s" repeatCount="indefinite" path="M 514 196 L 568 134"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle class="smil-packet" r="4.5" fill="#059669" opacity="0">
    <animateMotion dur="1.4s" repeatCount="indefinite" path="M 514 252 L 568 252"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle class="smil-packet" r="4" fill="#2563eb" opacity="0">
    <animateMotion dur="1.6s" begin="0.5s" repeatCount="indefinite" path="M 514 306 L 568 370"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="1.6s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <g class="pulse-badge" transform="translate(541, 224)">
    <circle cx="0" cy="0" r="11" fill="#d97706"/>
    <text x="0" y="4" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">2</text>
  </g>

  <!-- 4. AUTOMATION: CI/CD + HPA / KEDA -->
  <g transform="translate(882, 86)">
    <rect x="0" y="0" width="214" height="330" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="0" y="0" width="214" height="34" rx="12" fill="#6d28d9"/>
    <rect x="0" y="20" width="214" height="14" fill="#6d28d9"/>
    <text x="107" y="22" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">Automation &amp; Scaling</text>

    <rect x="14" y="48" width="186" height="114" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="24" y="68" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#4c1d95">HPA v2 + KEDA</text>
    <text x="24" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">• Scales on queue depth &amp;</text>
    <text x="24" y="100" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">  RPS (not laggy CPU)</text>
    <text x="24" y="117" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#059669">scaleDown: 300s window</text>
    <text x="24" y="133" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">• Tracks in-flight boots</text>
    <text x="24" y="148" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">• Stops sawtooth thrashing</text>

    <rect x="14" y="176" width="186" height="90" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="24" y="196" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#4c1d95">CI/CD Wave Rollouts</text>
    <text x="24" y="214" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">• Canary Cell 0 -&gt; 1 -&gt; All</text>
    <text x="24" y="230" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#be123c">• Auto-rollback on SLO</text>
    <text x="24" y="245" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#be123c">  burn-rate breach</text>

    <rect x="14" y="278" width="186" height="38" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="107" y="301" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#065f46">Karpenter Rapid Nodes</text>
  </g>

  <!-- Step 3: TSDB/SLO -> Automation -->
  <path d="M 828 256 L 878 256" fill="none" stroke="#059669" stroke-width="2.4" class="flow-green" marker-end="url(#arr-green)"/>
  <circle class="smil-packet" r="4.5" fill="#059669" opacity="0">
    <animateMotion dur="1.4s" repeatCount="indefinite" path="M 828 256 L 878 256"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <g class="pulse-badge" transform="translate(853, 232)">
    <circle cx="0" cy="0" r="11" fill="#059669"/>
    <text x="0" y="4" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">3</text>
  </g>

  <!-- Step 4: Feedback Loop Automation -> Fleet -->
  <path d="M 989 416 L 989 448 L 141 448 L 141 410" fill="none" stroke="#7c3aed" stroke-width="2.4" class="flow-violet" marker-end="url(#arr-violet)"/>
  <circle class="smil-packet" r="5" fill="#7c3aed" opacity="0">
    <animateMotion dur="3.0s" repeatCount="indefinite" path="M 989 416 L 989 448 L 141 448 L 141 410"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="3.0s" repeatCount="indefinite"/>
  </circle>
  <g class="pulse-badge" transform="translate(560, 448)">
    <circle cx="0" cy="0" r="11" fill="#7c3aed"/>
    <text x="0" y="4" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">4</text>
  </g>
  <rect x="580" y="435" width="290" height="24" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="725" y="451" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#4c1d95">Closed-Loop Autoscale &amp; Canary Rollback</text>

  <!-- Footer -->
  <rect x="24" y="476" width="1072" height="66" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="46" cy="498" r="5" fill="#2563eb"/>
  <text x="58" y="502" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#334155">1. Emit OTLP Telemetry</text>
  <circle cx="222" cy="498" r="5" fill="#d97706"/>
  <text x="234" y="502" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#334155">2. Scrub &amp; Guard Cardinality</text>
  <circle cx="430" cy="498" r="5" fill="#059669"/>
  <text x="442" y="502" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#334155">3. SLO Burn-Rate Triggers</text>
  <circle cx="628" cy="498" r="5" fill="#7c3aed"/>
  <text x="640" y="502" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#4c1d95">4. Stabilized HPA/KEDA &amp; Rollback</text>
  <text x="42" y="526" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#0f172a"><tspan font-weight="700">Engineering Takeaway:</tspan> Page on multi-window SLO error-budget burn instead of CPU spikes, enforce 300 s scale-down hysteresis, and keep /readyz shallow.</text>
</svg>
