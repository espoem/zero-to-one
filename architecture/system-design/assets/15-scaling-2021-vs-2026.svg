<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 684" width="1200" height="684" role="img" aria-labelledby="title desc">
  <title id="title">Scaling Stack Evolution: 2021 vs 2026</title>
  <desc id="desc">Side-by-side comparison of default web-scale infrastructure choices in 2021 versus 2026 across 7 architectural layers: Edge, Load Balancing, Cache/Sessions, Relational DB, Async Queues, Blast Radius, and Ops/Scaling.</desc>
  <defs>
    <marker id="shiftArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="684" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>

  <!-- Header -->
  <text x="36" y="42" fill="#1c1917" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700">Scaling Stack Comparison: 2021 Default vs. 2026 Modern Standard</text>
  <text x="36" y="65" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12.5">Five years of hardware density, kernel (eBPF/io_uring), protocol (HTTP/3, KRaft), and isolation changes across 7 layers.</text>
  <line x1="36" y1="76" x2="1164" y2="76" stroke="#1c1917" stroke-width="1.2"/>

  <!-- Column Headers -->
  <rect x="36" y="84" width="176" height="32" rx="6" fill="#f5f1e8" stroke="#d6d0c4"/>
  <text x="124" y="105" text-anchor="middle" fill="#1c1917" font-family="ui-monospace, monospace" font-size="12" font-weight="700">LAYER</text>

  <rect x="224" y="84" width="424" height="32" rx="6" fill="#fffbeb" stroke="#b45309"/>
  <text x="436" y="105" text-anchor="middle" fill="#92400e" font-family="ui-monospace, monospace" font-size="12" font-weight="700">THEN (c. 2021 DEFAULT)</text>

  <rect x="692" y="84" width="472" height="32" rx="6" fill="#f0fdf9" stroke="#0f766e"/>
  <text x="928" y="105" text-anchor="middle" fill="#065f46" font-family="ui-monospace, monospace" font-size="12" font-weight="700">NOW (2026 PRODUCTION STANDARD)</text>

  <!-- Row 1: Edge & Transport -->
  <g transform="translate(36, 128)">
    <rect width="176" height="54" rx="6" fill="#f5f1e8" stroke="#d6d0c4"/>
    <text x="12" y="24" fill="#0f766e" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">1. Edge &amp; CDN</text>
    <text x="12" y="42" fill="#57534e" font-family="system-ui, sans-serif" font-size="10">Static + Dynamic Edge</text>

    <rect x="188" width="424" height="54" rx="6" fill="#fffbeb" stroke="#b45309"/>
    <text x="200" y="22" fill="#92400e" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Static-file CDN + HTTP/2 (TCP HoL blocking)</text>
    <text x="200" y="40" fill="#57534e" font-family="system-ui, sans-serif" font-size="9.5">Origin handles auth &amp; routing; unshielded misses hit origin</text>

    <line x1="618" y1="27" x2="648" y2="27" stroke="#0f766e" stroke-width="2" marker-end="url(#shiftArrow)"/>

    <rect x="656" width="472" height="54" rx="6" fill="#f0fdf9" stroke="#0f766e"/>
    <text x="668" y="22" fill="#065f46" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Anycast HTTP/3 (QUIC) + Origin Shield + Edge Isolates</text>
    <text x="668" y="40" fill="#44403c" font-family="system-ui, sans-serif" font-size="9.5">1-RTT mobile handshakes, tiered miss coalescing, edge WAF/auth</text>
  </g>

  <!-- Row 2: Load Balancing -->
  <g transform="translate(36, 192)">
    <rect width="176" height="54" rx="6" fill="#f5f1e8" stroke="#d6d0c4"/>
    <text x="12" y="24" fill="#0f766e" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">2. Load Balancing</text>
    <text x="12" y="42" fill="#57534e" font-family="system-ui, sans-serif" font-size="10">L4/L7 &amp; Ingress</text>

    <rect x="188" width="424" height="54" rx="6" fill="#fffbeb" stroke="#b45309"/>
    <text x="200" y="22" fill="#92400e" font-family="system-ui, sans-serif" font-size="11" font-weight="600">iptables kube-proxy + Nginx Ingress + Round Robin</text>
    <text x="200" y="40" fill="#57534e" font-family="system-ui, sans-serif" font-size="9.5">O(N) iptables chains; blind RR overloads slow hosts</text>

    <line x1="618" y1="27" x2="648" y2="27" stroke="#0f766e" stroke-width="2" marker-end="url(#shiftArrow)"/>

    <rect x="656" width="472" height="54" rx="6" fill="#f0fdf9" stroke="#0f766e"/>
    <text x="668" y="22" fill="#065f46" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Cilium eBPF Maglev L4 + Gateway API + Envoy P2C</text>
    <text x="668" y="40" fill="#44403c" font-family="system-ui, sans-serif" font-size="9.5">O(1) kernel DSR lookups + Power-of-Two-Choices outlier ejection</text>
  </g>

  <!-- Row 3: Cache & Sessions -->
  <g transform="translate(36, 256)">
    <rect width="176" height="54" rx="6" fill="#f5f1e8" stroke="#d6d0c4"/>
    <text x="12" y="24" fill="#0f766e" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">3. Cache &amp; Sessions</text>
    <text x="12" y="42" fill="#57534e" font-family="system-ui, sans-serif" font-size="10">In-Memory Tier</text>

    <rect x="188" width="424" height="54" rx="6" fill="#fffbeb" stroke="#b45309"/>
    <text x="200" y="22" fill="#92400e" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Single-threaded Redis 6 / Memcached + fixed TTL</text>
    <text x="200" y="40" fill="#57534e" font-family="system-ui, sans-serif" font-size="9.5">Single-core bottleneck, manual stampede locks, sticky web RAM</text>

    <line x1="618" y1="27" x2="648" y2="27" stroke="#0f766e" stroke-width="2" marker-end="url(#shiftArrow)"/>

    <rect x="656" width="472" height="54" rx="6" fill="#f0fdf9" stroke="#0f766e"/>
    <text x="668" y="22" fill="#065f46" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Valkey 9 / Redis 8 (I/O threads) + L1 Cache + XFetch</text>
    <text x="668" y="40" fill="#44403c" font-family="system-ui, sans-serif" font-size="9.5">Hybrid L1 (W-TinyLFU) + multi-AZ L2 cluster + lease tokens</text>
  </g>

  <!-- Row 4: Relational Scaling -->
  <g transform="translate(36, 320)">
    <rect width="176" height="54" rx="6" fill="#f5f1e8" stroke="#d6d0c4"/>
    <text x="12" y="24" fill="#0f766e" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">4. Relational DB</text>
    <text x="12" y="42" fill="#57534e" font-family="system-ui, sans-serif" font-size="10">Primary + Replicas</text>

    <rect x="188" width="424" height="54" rx="6" fill="#fffbeb" stroke="#b45309"/>
    <text x="200" y="22" fill="#92400e" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Early app-layer sharding on 32-core EBS boxes</text>
    <text x="200" y="40" fill="#57534e" font-family="system-ui, sans-serif" font-size="9.5">App code handles shard routing; painful manual resharding</text>

    <line x1="618" y1="27" x2="648" y2="27" stroke="#0f766e" stroke-width="2" marker-end="url(#shiftArrow)"/>

    <rect x="656" width="472" height="54" rx="6" fill="#f0fdf9" stroke="#0f766e"/>
    <text x="668" y="22" fill="#065f46" font-family="system-ui, sans-serif" font-size="11" font-weight="600">PG 18 Async I/O + 192-core NVMe Scale-Up + Vitess</text>
    <text x="668" y="40" fill="#44403c" font-family="system-ui, sans-serif" font-size="9.5">Decoupled storage (Aurora/Neon), LSN-pinned reads, vertical-first</text>
  </g>

  <!-- Row 5: Queues & Streaming -->
  <g transform="translate(36, 384)">
    <rect width="176" height="54" rx="6" fill="#f5f1e8" stroke="#d6d0c4"/>
    <text x="12" y="24" fill="#0f766e" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">5. Async Queues</text>
    <text x="12" y="42" fill="#57534e" font-family="system-ui, sans-serif" font-size="10">Event Decoupling</text>

    <rect x="188" width="424" height="54" rx="6" fill="#fffbeb" stroke="#b45309"/>
    <text x="200" y="22" fill="#92400e" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Kafka + ZooKeeper quorum + local-disk retention</text>
    <text x="200" y="40" fill="#57534e" font-family="system-ui, sans-serif" font-size="9.5">Dual-cluster ops, costly broker rebalances, ad-hoc retries</text>

    <line x1="618" y1="27" x2="648" y2="27" stroke="#0f766e" stroke-width="2" marker-end="url(#shiftArrow)"/>

    <rect x="656" width="472" height="54" rx="6" fill="#f0fdf9" stroke="#0f766e"/>
    <text x="668" y="22" fill="#065f46" font-family="system-ui, sans-serif" font-size="11" font-weight="600">KRaft / Diskless S3 Logs + Durable Workflows (Temporal)</text>
    <text x="668" y="40" fill="#44403c" font-family="system-ui, sans-serif" font-size="9.5">No ZooKeeper, S3 tiered storage cuts cross-AZ bills, CDC outbox</text>
  </g>

  <!-- Row 6: Multi-Region & Isolation -->
  <g transform="translate(36, 448)">
    <rect width="176" height="54" rx="6" fill="#f5f1e8" stroke="#d6d0c4"/>
    <text x="12" y="24" fill="#0f766e" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">6. Blast Radius</text>
    <text x="12" y="42" fill="#57534e" font-family="system-ui, sans-serif" font-size="10">Multi-Tenant Scale</text>

    <rect x="188" width="424" height="54" rx="6" fill="#fffbeb" stroke="#b45309"/>
    <text x="200" y="22" fill="#92400e" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Single giant multi-tenant region + shared pools</text>
    <text x="200" y="40" fill="#57534e" font-family="system-ui, sans-serif" font-size="9.5">One noisy tenant or bad rollout hits 100% of global traffic</text>

    <line x1="618" y1="27" x2="648" y2="27" stroke="#0f766e" stroke-width="2" marker-end="url(#shiftArrow)"/>

    <rect x="656" width="472" height="54" rx="6" fill="#f0fdf9" stroke="#0f766e"/>
    <text x="668" y="22" fill="#065f46" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Cell-Based Architecture + Shuffle Sharding + Static Stability</text>
    <text x="668" y="40" fill="#44403c" font-family="system-ui, sans-serif" font-size="9.5">Hard 1/C blast-radius cap, C(N,k) virtual shards, zonal shift</text>
  </g>

  <!-- Row 7: Autoscaling & Telemetry -->
  <g transform="translate(36, 512)">
    <rect width="176" height="54" rx="6" fill="#f5f1e8" stroke="#d6d0c4"/>
    <text x="12" y="24" fill="#0f766e" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">7. Ops &amp; Scaling</text>
    <text x="12" y="42" fill="#57534e" font-family="system-ui, sans-serif" font-size="10">Metrics &amp; Capacity</text>

    <rect x="188" width="424" height="54" rx="6" fill="#fffbeb" stroke="#b45309"/>
    <text x="200" y="22" fill="#92400e" font-family="system-ui, sans-serif" font-size="11" font-weight="600">CPU-% ASG/HPA + threshold paging + siloed ELK</text>
    <text x="200" y="40" fill="#57534e" font-family="system-ui, sans-serif" font-size="9.5">Cold-boot thrashing, noisy alerts, invalid per-host avg p99</text>

    <line x1="618" y1="27" x2="648" y2="27" stroke="#0f766e" stroke-width="2" marker-end="url(#shiftArrow)"/>

    <rect x="656" width="472" height="54" rx="6" fill="#f0fdf9" stroke="#0f766e"/>
    <text x="668" y="22" fill="#065f46" font-family="system-ui, sans-serif" font-size="11" font-weight="600">KEDA Queue-Depth + Karpenter + OTel + Native Histograms</text>
    <text x="668" y="40" fill="#44403c" font-family="system-ui, sans-serif" font-size="9.5">Multi-window SLO burn-rate alerts, HPA hysteresis, eBPF profiles</text>
  </g>

  <!-- Footer takeaway (two clean lines well inside 1128px box) -->
  <rect x="36" y="582" width="1128" height="72" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1"/>
  <text x="54" y="609" fill="#1c1917" font-family="system-ui, sans-serif" font-size="12"><tspan fill="#0f766e" font-weight="700">2026 Architect Rule of Thumb:</tspan> Scale vertically further on NVMe Gen5 hardware before paying distributed sharding tax, and decouple storage from compute early.</text>
  <text x="54" y="633" fill="#44403c" font-family="system-ui, sans-serif" font-size="12">Bound multi-tenant blast radius with shared-nothing cells and shuffle sharding, and budget cross-AZ transfer and NAT Gateway egress from Day 1.</text>
</svg>
