<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Sliding Window Log Algorithm — Exact Eviction Animation</title>
  <desc id="desc">Animated Sliding Window Log rate limiter with limit L equals 3 requests per 60-second window. Shows a translucent [t-60s, t] bracket sliding across timestamped log entries at 10s, 25s, and 55s. At t equals 60s a new request is rejected with 429; as the window slides to t equals 72s, the 10s entry falls outside the window and is evicted, reducing count to 2 and admitting the 72s arrival with 200 OK at O(L) memory cost.</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* 12s cycle:
       0-25%  (0-3s): Window [0s, 60s], 3 entries [10s, 25s, 55s] active
       25-50% (3-6s): At t=60s arrival sees len=3 == L -> 429 REJECT
       50-75% (6-9s): Bracket slides right to [12s, 72s]; t=10s is evicted (fades rose + crossed out)
       75-100%(9-12s):At t=72s len=2 below 3 -> 72s appended -> 200 OK
    */

    @keyframes bracket-slide {
      0%, 48% { transform: translateX(0px); }
      65%, 100% { transform: translateX(144px); }
    }

    @keyframes evict-10s {
      0%, 52% { opacity: 1; }
      66%, 100% { opacity: 0.86; }
    }
    @keyframes cross-10s {
      0%, 54% { opacity: 0; }
      66%, 98% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes rej-60s {
      0%, 22% { opacity: 0.86; }
      28%, 52% { opacity: 1; }
      62%, 100% { opacity: 0.86; }
    }
    @keyframes adm-72s {
      0%, 72% { opacity: 0.86; }
      78%, 98% { opacity: 1; }
      100% { opacity: 0.86; }
    }

    @keyframes row-1 {
      0%, 24% { opacity: 1; stroke: #0f766e; stroke-width: 2; }
      25%, 100% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1; }
    }
    @keyframes row-2 {
      0%, 24% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1; }
      25%, 49% { opacity: 1; stroke: #dc2626; stroke-width: 2; }
      50%, 100% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1; }
    }
    @keyframes row-3 {
      0%, 49% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1; }
      50%, 74% { opacity: 1; stroke: #b45309; stroke-width: 2; }
      75%, 100% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1; }
    }
    @keyframes row-4 {
      0%, 74% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1; }
      75%, 100% { opacity: 1; stroke: #0f766e; stroke-width: 2; }
    }

    .bracket { animation: bracket-slide 12s ease-in-out infinite; }
    .dot10   { animation: evict-10s 12s linear infinite; }
    .x10     { animation: cross-10s 12s linear infinite; }
    .dot60   { animation: rej-60s 12s linear infinite; }
    .dot72   { animation: adm-72s 12s linear infinite; }
    .r1 { animation: row-1 12s linear infinite; }
    .r2 { animation: row-2 12s linear infinite; }
    .r3 { animation: row-3 12s linear infinite; }
    .r4 { animation: row-4 12s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .bracket, .dot10, .x10, .dot60, .dot72, .r1, .r2, .r3, .r4 {
        animation: none !important;
      }
      .bracket { transform: translateX(144px) !important; }
      .dot10 { opacity: 0.86 !important; }
      .x10, .dot60, .dot72, .r1, .r2, .r3, .r4 { opacity: 1 !important; }
    }
  </style>

  <!-- Canvas -->
  <rect x="0" y="0" width="1120" height="560" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>

  <!-- Header -->
  <line x1="24" y1="62" x2="1096" y2="62" stroke="#1c1917" stroke-width="1.2"/>
  
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#1c1917" font-family="Georgia, 'Times New Roman', serif">Sliding Window Log — Exact [t − W, t] Timestamp Eviction</text>
  <text x="24" y="47" class="sans" font-size="12" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">Parameters: Limit L = 3 req / Window W = 60s · Sorted Per-Key Timestamp Log · Memory: O(L) per key</text>

  <!-- TOP PANEL: TIME AXIS & SLIDING BRACKET -->
  <rect x="24" y="76" width="1072" height="224" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="42" y="102" class="sans" font-size="14" font-weight="700" fill="#1c1917">Sliding Window [t − 60s, t] Gliding Over Timestamp Log (Scale: 12px = 1s)</text>

  <!-- Sliding Translucent Bracket (width 720px = 60s) -->
  <g class="bracket">
    <rect x="80" y="118" width="720" height="126" rx="8" fill="#f0fdf9" fill-opacity="0.45" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 3"/>
    <rect x="330" y="124" width="220" height="24" rx="5" fill="#0f766e"/>
    <text x="440" y="140" class="mono" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Active Window (W = 60s)</text>
  </g>

  <!-- Time Axis Line (t=0s at x=80 .. t=80s at x=1040) -->
  <line x1="60" y1="210" x2="1060" y2="210" stroke="#44403c" stroke-width="2"/>
  <text x="90" y="232" class="mono" font-size="10.5" fill="#57534e" text-anchor="middle">0s</text>
  <text x="200" y="232" class="mono" font-size="10.5" fill="#57534e" text-anchor="middle">10s</text>
  <text x="380" y="232" class="mono" font-size="10.5" fill="#57534e" text-anchor="middle">25s</text>
  <text x="740" y="232" class="mono" font-size="10.5" fill="#57534e" text-anchor="middle">55s</text>
  <text x="788" y="232" class="mono" font-size="10.5" fill="#991b1b" text-anchor="middle">60s</text>
  <text x="944" y="232" class="mono" font-size="10.5" fill="#065f46" text-anchor="middle">72s</text>

  <!-- Timestamp Entries -->
  <!-- t=10s (x=200) -> gets evicted when bracket passes 12s -->
  <g class="dot10">
    <circle cx="200" cy="210" r="11" fill="#0f766e" stroke="#ffffff" stroke-width="2"/>
    <text x="200" y="192" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">10s</text>
  </g>
  <g class="x10">
    <line x1="186" y1="196" x2="214" y2="224" stroke="#dc2626" stroke-width="3"/>
    <line x1="214" y1="196" x2="186" y2="224" stroke="#dc2626" stroke-width="3"/>
    <rect x="158" y="248" width="84" height="22" rx="4" fill="#fef2f2" stroke="#dc2626"/>
    <text x="200" y="263" class="mono" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">EVICTED</text>
  </g>

  <!-- t=25s (x=380) -->
  <circle cx="380" cy="210" r="11" fill="#0f766e" stroke="#ffffff" stroke-width="2"/>
  <text x="380" y="192" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">25s (OK)</text>

  <!-- t=55s (x=740) -->
  <circle cx="740" cy="210" r="11" fill="#0f766e" stroke="#ffffff" stroke-width="2"/>
  <text x="740" y="192" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">55s (OK)</text>

  <!-- t=60s (x=800) -> 429 REJECT -->
  <g class="dot60">
    <circle cx="800" cy="210" r="11" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
    <text x="800" y="192" class="mono" font-size="10.5" font-weight="700" fill="#991b1b" text-anchor="middle">60s → 429</text>
    <rect x="756" y="248" width="88" height="22" rx="4" fill="#fef2f2" stroke="#dc2626"/>
    <text x="800" y="263" class="mono" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">REJECT (3/3)</text>
  </g>

  <!-- t=72s (x=944) -> 200 OK -->
  <g class="dot72">
    <circle cx="944" cy="210" r="11" fill="#0f766e" stroke="#ffffff" stroke-width="2"/>
    <text x="944" y="192" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">72s → 200</text>
    <rect x="898" y="248" width="92" height="22" rx="4" fill="#f0fdf9" stroke="#0f766e"/>
    <text x="944" y="263" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">ADMIT (3/3)</text>
  </g>

  <!-- BOTTOM LEFT: LOG ARRAY & O(L) MEMORY -->
  <rect x="24" y="314" width="526" height="166" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="42" y="338" class="sans" font-size="13.5" font-weight="700" fill="#1c1917">Sorted Timestamp Log State &amp; O(L) Cost</text>

  <rect x="42" y="350" width="490" height="36" rx="6" fill="#fef2f2" stroke="#fda4af"/>
  <text x="54" y="372" class="mono" font-size="10.5" fill="#991b1b">t=60s: cutoff=0s · log=[10, 25, 55] (len=3 == L) → 429</text>

  <rect x="42" y="394" width="490" height="36" rx="6" fill="#f0fdf9" stroke="#99f6e4"/>
  <text x="54" y="416" class="mono" font-size="10.5" fill="#065f46">t=72s: evict ≤12s → [25, 55] → push(72) → [25, 55, 72] → 200</text>

  <rect x="42" y="438" width="490" height="30" rx="6" fill="#f5f1e8" stroke="#d6d0c4"/>
  <text x="54" y="457" class="sans" font-size="10.5" font-weight="600" fill="#065f46">Memory: O(L) timestamps/key (e.g., 1M keys × 1000 req = 8 GB RAM)</text>

  <!-- BOTTOM RIGHT: 4-STEP TRACE -->
  <rect x="570" y="314" width="526" height="166" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="588" y="338" class="sans" font-size="13.5" font-weight="700" fill="#1c1917">Step-by-Step Eviction &amp; Admission Cycle</text>

  <rect x="588" y="348" width="490" height="27" rx="5" fill="#f0fdf9" class="r1"/>
  <text x="600" y="366" class="mono" font-size="10.5" fill="#065f46">1. t=10s,25s,55s: 3 arrivals logged → [10, 25, 55] (3/3)</text>

  <rect x="588" y="380" width="490" height="27" rx="5" fill="#fef2f2" class="r2"/>
  <text x="600" y="398" class="mono" font-size="10.5" fill="#991b1b">2. t=60s: 0 entries evicted → len=3 → 429 (Retry-After: 10s)</text>

  <rect x="588" y="412" width="490" height="27" rx="5" fill="#fffbeb" class="r3"/>
  <text x="600" y="430" class="mono" font-size="10.5" fill="#92400e">3. t=72s: Bracket slides to [12s, 72s] → 10s ≤ 12s evicted</text>

  <rect x="588" y="444" width="490" height="27" rx="5" fill="#f0fdf9" class="r4"/>
  <text x="600" y="462" class="mono" font-size="10.5" fill="#065f46">4. t=72s: len=2 &lt; 3 → append 72s → 200 OK (remaining: 0)</text>

  <!-- FOOTER -->
  <rect x="24" y="494" width="1072" height="46" rx="8" fill="#f5f1e8" stroke="#d6d0c4" stroke-width="1"/>
  <text x="42" y="522" class="sans" font-size="11.5" font-weight="600" fill="#065f46">Takeaway: Sliding Window Log guarantees 100% exactness across any rolling interval at O(L) memory — ideal for low-limit security endpoints.</text>
</svg>
