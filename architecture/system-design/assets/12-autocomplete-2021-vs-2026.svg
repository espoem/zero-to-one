<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 570" width="1180" height="570" role="img" aria-labelledby="title desc">
  <title id="title">Search Autocomplete Architecture Evolution: 2021 Default vs. 2026 Modern Standard</title>
  <desc id="desc">Six-dimension architectural matrix comparing 2021 legacy autocomplete systems against 2026 modern production standards across data structure compaction, query freshness, ranking mechanisms, sharding skew management, typo tolerance and internationalization, and trust and safety policy enforcement.</desc>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="1180" height="570" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect x="0" y="0" width="1180" height="56" rx="12" fill="#0f172a"/>
  <rect x="0" y="40" width="1180" height="16" fill="#0f172a"/>
  <text x="24" y="27" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Search Autocomplete Architecture Evolution: 2021 Default vs. 2026 Modern Standard</text>
  <text x="24" y="46" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Finite State Transducers, Real-Time Exponential Decay, Levenshtein Automata, and Inline Safety Governance</text>

  <!-- Column Headers -->
  <rect x="20" y="70" width="220" height="32" rx="6" fill="#e2e8f0"/>
  <text x="34" y="91" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e293b">Architectural Dimension</text>

  <rect x="252" y="70" width="440" height="32" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="266" y="91" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b">2021 Legacy Default (Pain Points)</text>

  <rect x="704" y="70" width="456" height="32" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="718" y="91" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534">2026 Modern Standard (Primary Shifts)</text>

  <!-- Row 1: Index Structure & Memory -->
  <rect x="20" y="112" width="220" height="64" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="32" y="137" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">1. Index Structure</text>
  <text x="32" y="156" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b">Pointer Trie vs. FST</text>

  <rect x="252" y="112" width="440" height="64" rx="6" fill="#fff5f5" stroke="#fecaca"/>
  <text x="264" y="136" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">ASCII Lowercase Pointer Trie in Memory</text>
  <text x="264" y="155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#475569">Raw 26-pointer arrays; 50+ GB RAM overhead; rigid ASCII English only</text>

  <rect x="704" y="112" width="456" height="64" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="716" y="136" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#166534">Lucene / Rust Finite State Transducer (FST)</text>
  <text x="716" y="155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#334155">10x-20x RAM compression; Radix/DAWG suffix sharing; zero-copy mmap</text>

  <!-- Row 2: Freshness & Aggregation -->
  <rect x="20" y="186" width="220" height="64" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="32" y="211" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">2. Query Freshness</text>
  <text x="32" y="230" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b">Batch vs. Streaming</text>

  <rect x="252" y="186" width="440" height="64" rx="6" fill="#fff5f5" stroke="#fecaca"/>
  <text x="264" y="210" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">Weekly Offline Batch Rebuilds</text>
  <text x="264" y="229" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#475569">Hadoop/Spark weekly batches; blind to breaking news &amp; viral spikes</text>

  <rect x="704" y="186" width="456" height="64" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="716" y="210" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#166534">Real-Time Kafka/Flink Stream + Exponential Decay</text>
  <text x="716" y="229" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#334155">Sliding window decay: Wt = a*Ct + (1-a)W; promotes viral news in min</text>

  <!-- Row 3: Ranking Signals -->
  <rect x="20" y="260" width="220" height="64" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="32" y="285" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">3. Ranking Signals</text>
  <text x="32" y="304" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b">Static vs. Personalized</text>

  <rect x="252" y="260" width="440" height="64" rx="6" fill="#fff5f5" stroke="#fecaca"/>
  <text x="264" y="284" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">Raw Global Frequency Sorting</text>
  <text x="264" y="303" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#475569">Static counter sorting; identical results ignoring user geo &amp; intent</text>

  <rect x="704" y="260" width="456" height="64" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="716" y="284" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#166534">Hybrid Lexical Prefix + Neural Semantic Re-Ranking</text>
  <text x="716" y="303" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#334155">Blends global frequency with local geo-intent and session history</text>

  <!-- Row 4: Sharding & Load Balancing -->
  <rect x="20" y="334" width="220" height="64" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="32" y="359" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">4. Sharding Strategy</text>
  <text x="32" y="378" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b">Prefix Partitioning</text>

  <rect x="252" y="334" width="440" height="64" rx="6" fill="#fff5f5" stroke="#fecaca"/>
  <text x="264" y="358" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">Naive Letter-Range Sharding (a-m, n-z)</text>
  <text x="264" y="377" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#475569">Severe traffic skew; 's'/'c' nodes overload while 'x'/'z' sit idle</text>

  <rect x="704" y="334" width="456" height="64" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="716" y="358" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#166534">Uneven Shard Map Manager + Consistent Hashing</text>
  <text x="716" y="377" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#334155">Dynamic histogram splits: 'aa-ag', 'ah-an', 's*' split, 'u-z' merged</text>

  <!-- Row 5: Typo & I18N -->
  <rect x="20" y="408" width="220" height="64" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="32" y="433" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">5. Typo &amp; I18N</text>
  <text x="32" y="452" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b">Error Tolerance &amp; Unicode</text>

  <rect x="252" y="408" width="440" height="64" rx="6" fill="#fff5f5" stroke="#fecaca"/>
  <text x="264" y="432" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">Exact Prefix Matching · ASCII Lowercase</text>
  <text x="264" y="451" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#475569">Single typo returns 0 results; CJK / diacritics / emoji unsupported</text>

  <rect x="704" y="408" width="456" height="64" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="716" y="432" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#166534">Levenshtein Automata (d&lt;=2) + Full Unicode NFKC</text>
  <text x="716" y="451" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#334155">Fuzzy edit distance probe O(1); CJK IME pinyin/romaji composition</text>

  <!-- Row 6: Trust, Safety & Policy -->
  <rect x="20" y="482" width="220" height="64" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="32" y="507" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">6. Trust &amp; Safety</text>
  <text x="32" y="526" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b">Policy Enforcement</text>

  <rect x="252" y="482" width="440" height="64" rx="6" fill="#fff5f5" stroke="#fecaca"/>
  <text x="264" y="506" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">Post-Hoc Manual Database Deletions</text>
  <text x="264" y="525" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#475569">Trie rebuilt weekly; offensive or PII terms remain visible for days</text>

  <rect x="704" y="482" width="456" height="64" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="716" y="506" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#166534">Inline Real-Time Policy &amp; Safety Filter Layer</text>
  <text x="716" y="525" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#334155">Instant Bloom/Aho-Corasick gate; dynamic CDN purge &amp; PII suppression</text>
</svg>
