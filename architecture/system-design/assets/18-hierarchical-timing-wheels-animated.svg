<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" width="1120" height="580" role="img" aria-labelledby="title desc">
  <title id="title">Hierarchical Timing Wheels Step-by-Step Animated Mechanics</title>
  <desc id="desc">Animated Varghese and Lauck (SOSP 1987) Hierarchical Timing Wheels for O(1) delayed message scheduling across Level-2 Hours, Level-1 Minutes (16 slots times 16s equals 256s), and Level-0 Seconds (16 slots times 1s equals 16s). Demonstrates persisting a 65-tick delayed order-expiry message into durable __delay_log, O(1) modulo insertion into Level-1 slot 4, tick pointer advancement, bucket overflow cascade down to Level-0 slot 1, and exact tick-65 delivery into the target ready partition.</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* 12s cycle:
       0-25%  (0-3s): Step 1 — Persist __delay_log + O(1) schedule delay=65 into L1 slot 4
       25-50% (3-6s): Step 2 — L0 tick pointer advances (1s stride)
       50-75% (6-9s): Step 3 — L0 completes revolution -> L1 slot 4 cascades down to L0 slot 1
       75-100%(9-12s):Step 4 — L0 pointer hits slot 1 at tick 65 -> Ready Partition fire!
    */

    @keyframes l0-spin {
      0%, 22%   { transform: rotate(0deg); }
      48%, 68%  { transform: rotate(360deg); }
      78%, 98%  { transform: rotate(382.5deg); }
      100%      { transform: rotate(0deg); }
    }

    @keyframes l1-tick {
      0%, 48%   { transform: rotate(67.5deg); }
      55%, 96%  { transform: rotate(90deg); }
      100%      { transform: rotate(67.5deg); }
    }

    @keyframes cascade-pkt {
      0%, 48%   { transform: translate(0px, 0px); opacity: 0; }
      54%       { transform: translate(0px, 0px); opacity: 1; }
      70%       { transform: translate(-208px, 12px); opacity: 1; }
      74%, 100% { transform: translate(-208px, 12px); opacity: 0; }
    }

    @keyframes ready-fire {
      0%, 74%   { opacity: 0.86; }
      80%, 98%  { opacity: 1; }
      100%      { opacity: 0.86; }
    }

    @keyframes s1-hl { 0%, 24% { stroke: #0f766e; stroke-width: 2.2; opacity: 1; } 25%, 100% { stroke: #d6d0c4; stroke-width: 1; opacity: 0.86; } }
    @keyframes s2-hl { 0%, 24% { stroke: #d6d0c4; stroke-width: 1; opacity: 0.86; } 25%, 49% { stroke: #0f766e; stroke-width: 2.2; opacity: 1; } 50%, 100% { stroke: #d6d0c4; stroke-width: 1; opacity: 0.86; } }
    @keyframes s3-hl { 0%, 49% { stroke: #d6d0c4; stroke-width: 1; opacity: 0.86; } 50%, 74% { stroke: #b45309; stroke-width: 2.2; opacity: 1; } 75%, 100% { stroke: #d6d0c4; stroke-width: 1; opacity: 0.86; } }
    @keyframes s4-hl { 0%, 74% { stroke: #d6d0c4; stroke-width: 1; opacity: 0.86; } 75%, 100% { stroke: #0f766e; stroke-width: 2.2; opacity: 1; } }

    .needle-l0 { transform-origin: 170px 236px; animation: l0-spin 12s ease-in-out infinite; }
    .needle-l1 { transform-origin: 390px 236px; animation: l1-tick 12s ease-in-out infinite; }
    .casc-msg  { animation: cascade-pkt 12s ease-in-out infinite; }
    .rdy-box   { animation: ready-fire 12s ease-in-out infinite; }
    .s1 { animation: s1-hl 12s linear infinite; }
    .s2 { animation: s2-hl 12s linear infinite; }
    .s3 { animation: s3-hl 12s linear infinite; }
    .s4 { animation: s4-hl 12s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .needle-l0, .needle-l1, .casc-msg, .rdy-box, .s1, .s2, .s3, .s4 { animation: none !important; }
      .needle-l0 { transform: rotate(22.5deg) !important; }
      .needle-l1 { transform: rotate(90deg) !important; }
      .casc-msg  { transform: translate(-104px, 6px) !important; opacity: 1 !important; }
      .rdy-box, .s1, .s2, .s3, .s4 { opacity: 1 !important; }
    }
  </style>

  <defs>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1120" height="580" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>

  <!-- Header -->
  <line x1="24" y1="62" x2="1096" y2="62" stroke="#1c1917" stroke-width="1.2"/>
  
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#1c1917" font-family="Georgia, 'Times New Roman', serif">Hierarchical Timing Wheels (Varghese &amp; Lauck, SOSP 1987)</text>
  <text x="24" y="47" class="sans" font-size="12" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">M18 §4.6 · O(1) Modulo Insertion &amp; Expiry · Level-0 (1s/tick) ← Level-1 (16s/slot) ← Level-2 (256s/slot) · Durable __delay_log</text>

  <!-- LEFT PANEL: 3-TIER TIMING WHEELS -->
  <rect x="24" y="76" width="664" height="432" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="42" y="102" class="sans" font-size="14" font-weight="700" fill="#1c1917">Three-Tier Wheel Cascade (16 Slots/Wheel, Delay = 65 Ticks)</text>

  <!-- Wheel L0 (Seconds: center 170, 236) -->
  <circle cx="170" cy="236" r="90" fill="#f0fdf9" stroke="#0f766e" stroke-width="2.5"/>
  <circle cx="170" cy="236" r="56" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
  <!-- Highlight Slot 1 (top-right ~22.5 deg) -->
  <circle cx="200" cy="166" r="13" fill="#0f766e" stroke="#ffffff" stroke-width="2"/>
  <text x="200" y="170" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">s1</text>
  <text x="170" y="158" class="mono" font-size="10" fill="#065f46" text-anchor="middle">s0</text>
  <text x="244" y="240" class="mono" font-size="10" fill="#065f46" text-anchor="middle">s4</text>
  <text x="170" y="318" class="mono" font-size="10" fill="#065f46" text-anchor="middle">s8</text>
  <text x="96"  y="240" class="mono" font-size="10" fill="#065f46" text-anchor="middle">s12</text>
  <text x="170" y="232" class="sans" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">Level-0 (Sec)</text>
  <text x="170" y="248" class="mono" font-size="10" fill="#0f766e" text-anchor="middle">stride = 1 s</text>
  <!-- Rotating L0 needle -->
  <g class="needle-l0">
    <line x1="170" y1="236" x2="170" y2="156" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
    <circle cx="170" cy="236" r="6" fill="#1c1917"/>
  </g>

  <!-- Wheel L1 (Minutes: center 390, 236) -->
  <circle cx="390" cy="236" r="84" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
  <circle cx="390" cy="236" r="50" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
  <!-- Highlight Slot 4 (right ~90 deg) -->
  <circle cx="458" cy="236" r="14" fill="#b45309" stroke="#ffffff" stroke-width="2"/>
  <text x="458" y="240" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">m4</text>
  <text x="390" y="164" class="mono" font-size="10" fill="#92400e" text-anchor="middle">m0</text>
  <text x="390" y="312" class="mono" font-size="10" fill="#92400e" text-anchor="middle">m8</text>
  <text x="390" y="232" class="sans" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle">Level-1 (Min)</text>
  <text x="390" y="248" class="mono" font-size="10" fill="#b45309" text-anchor="middle">stride = 16 s</text>
  <!-- Rotating L1 needle -->
  <g class="needle-l1">
    <line x1="390" y1="236" x2="390" y2="162" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
    <circle cx="390" cy="236" r="6" fill="#1c1917"/>
  </g>

  <!-- Wheel L2 (Hours: center 592, 236) -->
  <circle cx="592" cy="236" r="72" fill="#f5f1e8" stroke="#0f766e" stroke-width="2"/>
  <circle cx="592" cy="236" r="42" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="592" y="232" class="sans" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">Level-2 (Hr)</text>
  <text x="592" y="248" class="mono" font-size="10" fill="#0f766e" text-anchor="middle">stride = 256 s</text>
  <line x1="592" y1="236" x2="592" y2="174" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="592" cy="236" r="5" fill="#1c1917"/>

  <!-- Cascade Arrows (L2 -> L1 -> L0) -->
  <line x1="518" y1="236" x2="478" y2="236" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-violet)"/>
  <path d="M 306,236 L 266,236" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arr-amber)"/>
  <text x="286" y="226" class="mono" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">Cascade</text>

  <!-- Animated Cascading Timer Packet -->
  <g class="casc-msg">
    <rect x="422" y="206" width="62" height="22" rx="4" fill="#b45309" stroke="#ffffff" stroke-width="1.5"/>
    <text x="453" y="221" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">tick=65</text>
  </g>

  <!-- Durable Delay Log & Ready Partition Boxes at bottom of left panel -->
  <rect x="42" y="356" width="290" height="68" rx="8" fill="#f5f1e8" stroke="#0f766e" stroke-width="1.5"/>
  <text x="56" y="376" class="sans" font-size="11.5" font-weight="700" fill="#065f46">Durable Delay Topic (__delay_log)</text>
  <text x="56" y="394" class="mono" font-size="10" fill="#44403c">1. Persist (msg, expireAt=now+65s)</text>
  <text x="56" y="410" class="sans" font-size="10" fill="#065f46">Rebuilds volatile wheels on broker crash.</text>

  <line x1="332" y1="390" x2="368" y2="390" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-green)"/>

  <g class="rdy-box">
    <rect x="374" y="356" width="296" height="68" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="2"/>
    <text x="388" y="376" class="sans" font-size="11.5" font-weight="700" fill="#065f46">Target Ready Partition (Fired!)</text>
    <text x="388" y="394" class="mono" font-size="10" fill="#065f46">Tick 65 reached: order_expire → Ready</text>
    <text x="388" y="410" class="sans" font-size="10" fill="#065f46">Consumers pull normally from ready topic.</text>
  </g>

  <rect x="42" y="438" width="628" height="54" rx="7" fill="#faf8f5" stroke="#d6d0c4"/>
  <text x="56" y="458" class="mono" font-size="10.5" font-weight="700" fill="#1c1917">Slot Math for delay = 65 ticks (W = 16):</text>
  <text x="56" y="477" class="mono" font-size="10" fill="#44403c">L1 bucket = ⌊65 / 16⌋ = slot 4  (inserted in O(1))   →   L0 remainder = 65 mod 16 = slot 1</text>

  <!-- RIGHT PANEL: 4-STEP TIMELINE -->
  <rect x="706" y="76" width="390" height="432" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="724" y="102" class="sans" font-size="14" font-weight="700" fill="#1c1917">Execution Timeline (12s Loop)</text>

  <!-- Step 1 -->
  <rect x="724" y="118" width="354" height="84" rx="8" fill="#f5f1e8" class="s1"/>
  <text x="738" y="139" class="sans" font-size="12" font-weight="700" fill="#065f46">1. Durable Append &amp; O(1) Schedule</text>
  <text x="738" y="159" class="mono" font-size="10" fill="#44403c">Persist to __delay_log, compute</text>
  <text x="738" y="175" class="mono" font-size="10" fill="#44403c">bucket = ⌊65 / 16⌋ = L1[4] in O(1).</text>
  <text x="738" y="191" class="sans" font-size="10" fill="#065f46">Zero O(log M) priority-heap rebalancing.</text>

  <!-- Step 2 -->
  <rect x="724" y="212" width="354" height="84" rx="8" fill="#f0fdf9" class="s2"/>
  <text x="738" y="233" class="sans" font-size="12" font-weight="700" fill="#065f46">2. Fine Wheel Pointer Advances</text>
  <text x="738" y="253" class="mono" font-size="10" fill="#44403c">L0 pointer steps 1 tick/sec across</text>
  <text x="738" y="269" class="mono" font-size="10" fill="#44403c">slots 0..15, firing immediate timers.</text>
  <text x="738" y="285" class="sans" font-size="10" fill="#065f46">Coarse slots remain untouched until due.</text>

  <!-- Step 3 -->
  <rect x="724" y="306" width="354" height="84" rx="8" fill="#fffbeb" class="s3"/>
  <text x="738" y="327" class="sans" font-size="12" font-weight="700" fill="#92400e">3. Revolution Boundary Cascade</text>
  <text x="738" y="347" class="mono" font-size="10" fill="#44403c">After 4 L0 turns (t=64s), L1[4] bucket</text>
  <text x="738" y="363" class="mono" font-size="10" fill="#44403c">cascades down into L0[65 mod 16 = 1].</text>
  <text x="738" y="379" class="sans" font-size="10" fill="#b45309">O(1) amortized work per timer re-insert.</text>

  <!-- Step 4 -->
  <rect x="724" y="400" width="354" height="84" rx="8" fill="#f0fdf9" class="s4"/>
  <text x="738" y="421" class="sans" font-size="12" font-weight="700" fill="#065f46">4. Exact Tick-65 Expiry Firing</text>
  <text x="738" y="441" class="mono" font-size="10" fill="#44403c">L0 pointer reaches L0[1] at tick 65,</text>
  <text x="738" y="457" class="mono" font-size="10" fill="#44403c">promotes msg to Target Ready Partition.</text>
  <text x="738" y="473" class="sans" font-size="10" fill="#065f46">Scales cleanly to millions of active timers.</text>

  <!-- FOOTER -->
  <rect x="24" y="520" width="1072" height="44" rx="8" fill="#f0fdf9" stroke="#99f6e4" stroke-width="1"/>
  <text x="42" y="546" class="sans" font-size="11.5" font-weight="600" fill="#065f46">Takeaway: Hierarchical Timing Wheels schedule millions of delayed messages in O(1) time without DB polling or O(log M) heap lock contention.</text>
</svg>
