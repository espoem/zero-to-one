<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 590" width="1160" height="590" role="img" aria-labelledby="title desc">
  <title id="title">Real-Time Gaming Leaderboard Evolution: 2021 vs 2026</title>
  <desc id="desc">Six-layer comparison of real-time gaming leaderboard architecture between 2021 legacy defaults and 2026 modern cloud standards, covering single-threaded Redis 6 vs Valkey 9 multi-threaded I/O, lossy float tie-breaking vs 53-bit integer Lua composite encoding, INFO keyspace bugs vs ZCARD and parallel ZCOUNT, hybrid Top-K + DDSketch percentiles, async UNLINK season rollovers, and authoritative anti-cheat match ingestion.</desc>

  <!-- Background -->
  <rect x="0" y="0" width="1160" height="590" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>

  <!-- Header -->
  <line x1="24" y1="58" x2="1136" y2="58" stroke="#1c1917" stroke-width="1.2"/>
  
  <text x="24" y="27" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#1c1917">Real-Time Gaming Leaderboard Evolution: 2021 Default vs. 2026 Modern Standard</text>
  <text x="24" y="46" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#57534e">From Lossy Float Tie-Breakers, Blocking Season Resets &amp; Single-Core Bottlenecks to 53-Bit Lua Atomics, Valkey 9 &amp; DDSketch Tiers</text>

  <!-- Column Headers -->
  <rect x="20" y="70" width="210" height="32" rx="6" fill="#e7e2d8"/>
  <text x="34" y="91" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1c1917">Architectural Layer</text>

  <rect x="242" y="70" width="440" height="32" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="256" y="91" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b">2021 Legacy Default (Pain Points)</text>

  <rect x="694" y="70" width="446" height="32" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="708" y="91" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534">2026 Modern Standard (Primary Shifts)</text>

  <!-- Row 1 -->
  <rect x="20" y="112" width="210" height="62" rx="6" fill="#ffffff" stroke="#d6d0c4"/>
  <text x="32" y="138" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1c1917">1. In-Memory Engine</text>
  <text x="32" y="156" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#57534e">ZSET Runtime &amp; RAM</text>

  <rect x="242" y="112" width="440" height="62" rx="6" fill="#fff5f5" stroke="#fecaca"/>
  <text x="254" y="136" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">Single-Threaded Redis 6 + Naive 26 B Sizing</text>
  <text x="254" y="155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#44403c">Underestimates 128 B ZSET nodes; OOMs during fork() CoW</text>

  <rect x="694" y="112" width="446" height="62" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="706" y="136" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#166534">Valkey 9 / Dragonfly + 2x CoW RAM Budget</text>
  <text x="706" y="155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#44403c">Multi-threaded I/O; budgets 128 B/member * 2x (6.4 GB/25M)</text>

  <!-- Row 2 -->
  <rect x="20" y="182" width="210" height="62" rx="6" fill="#ffffff" stroke="#d6d0c4"/>
  <text x="32" y="208" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1c1917">2. Tie-Breaking Math</text>
  <text x="32" y="226" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#57534e">Earliest Achiever Wins</text>

  <rect x="242" y="182" width="440" height="62" rx="6" fill="#fff5f5" stroke="#fecaca"/>
  <text x="254" y="206" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">Lexicographical Default or &gt;53-Bit Float Packing</text>
  <text x="254" y="225" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#44403c">64-bit score+epoch overflows 2^53-1 and rounds away ties</text>

  <rect x="694" y="182" width="446" height="62" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="706" y="206" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#166534">53-Bit Safe Integer Packing via Atomic Lua</text>
  <text x="706" y="225" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#44403c">score * 2^32 + (MAX_REL_MS - elapsed_ms) &lt;= 2^53 - 1</text>

  <!-- Row 3 -->
  <rect x="20" y="252" width="210" height="62" rx="6" fill="#ffffff" stroke="#d6d0c4"/>
  <text x="32" y="278" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1c1917">3. Sharded Global Rank</text>
  <text x="32" y="296" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#57534e">500M DAU Partitioning</text>

  <rect x="242" y="252" width="440" height="62" rx="6" fill="#fff5f5" stroke="#fecaca"/>
  <text x="254" y="276" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">Naive INFO keyspace or ZREVRANK Summation</text>
  <text x="254" y="295" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#44403c">INFO keyspace counts keys, not members; non-atomic ghosts</text>

  <rect x="694" y="252" width="446" height="62" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="706" y="276" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#166534">Range ZCARD Prefix Sums or Hash ZSCORE + ZCOUNT</text>
  <text x="706" y="295" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#44403c">Atomic ZREM+ZADD range moves; parallel ZCOUNT (s, +inf)</text>

  <!-- Row 4 -->
  <rect x="20" y="322" width="210" height="62" rx="6" fill="#ffffff" stroke="#d6d0c4"/>
  <text x="32" y="348" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1c1917">4. Long-Tail Ranking</text>
  <text x="32" y="366" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#57534e">Players #1,001..500M</text>

  <rect x="242" y="322" width="440" height="62" rx="6" fill="#fff5f5" stroke="#fecaca"/>
  <text x="254" y="346" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">Exact Rank Query or Nightly Batch Cron</text>
  <text x="254" y="365" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#44403c">Expensive cross-shard fan-out for rank #48,912,104; stale cron</text>

  <rect x="694" y="322" width="446" height="62" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="706" y="346" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#166534">Hybrid Exact Top-1,000 + Streaming DDSketch</text>
  <text x="706" y="365" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#44403c">Exact ZSET rank for leaders; O(1) relative-error percentile tier</text>

  <!-- Row 5 -->
  <rect x="20" y="392" width="210" height="62" rx="6" fill="#ffffff" stroke="#d6d0c4"/>
  <text x="32" y="418" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1c1917">5. Season Rollover</text>
  <text x="32" y="436" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#57534e">Monthly Tournament Reset</text>

  <rect x="242" y="392" width="440" height="62" rx="6" fill="#fff5f5" stroke="#fecaca"/>
  <text x="254" y="416" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">Synchronous DEL on 25M-Entry ZSET + New SQL Table</text>
  <text x="254" y="435" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#44403c">Freezes single-threaded event loop for seconds at midnight</text>

  <rect x="694" y="392" width="446" height="62" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="706" y="416" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#166534">Time-Namespaced Keys + Async UNLINK + S3 Archive</text>
  <text x="706" y="435" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#44403c">Instant cutover to leaderboard:2026-12; background lazy free</text>

  <!-- Row 6 -->
  <rect x="20" y="462" width="210" height="62" rx="6" fill="#ffffff" stroke="#d6d0c4"/>
  <text x="32" y="488" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1c1917">6. Anti-Cheat &amp; DR</text>
  <text x="32" y="506" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#57534e">Trust &amp; Crash Recovery</text>

  <rect x="242" y="462" width="440" height="62" rx="6" fill="#fff5f5" stroke="#fecaca"/>
  <text x="254" y="486" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">Client-Direct Score API + Ad-Hoc MySQL Rebuild</text>
  <text x="254" y="505" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#44403c">Vulnerable to MITM proxy score spoofing and retry double-count</text>

  <rect x="694" y="462" width="446" height="62" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="706" y="486" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#166534">Game-Server Signed match_id + Pipelined WAL Replay</text>
  <text x="706" y="505" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#44403c">mTLS/HMAC authority + idempotent match_id + &lt;5m ZSET rebuild</text>

  <!-- Bottom Migration Warning Strip -->
  <rect x="20" y="536" width="1120" height="40" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <text x="34" y="560" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400e">Migration Trap: Replace ZINCRBY with atomic Lua when switching to 53-bit composite scores (raw ZINCRBY corrupts low timestamp bits!).</text>
</svg>
