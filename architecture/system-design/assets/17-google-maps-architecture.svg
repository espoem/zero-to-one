<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Google Maps End-to-End Architecture Blueprint</title>
  <desc id="desc">Architecture blueprint of a planetary-scale navigation and mapping service showing vector tile CDN delivery, client-batched GPS telemetry with HMM map matching, 3-tier hierarchical routing tiles with CRP and GNN ETA prediction, and hierarchical super-tile adaptive WebSocket rerouting.</desc>
  <defs>
    <marker id="mapCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="mapGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="mapAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
    <marker id="mapPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="760" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>

  <!-- Header -->
  <text x="36" y="42" fill="#1c1917" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700">Google Maps: Vector Tiles, Hierarchical Routing &amp; Adaptive Navigation</text>
  <text x="36" y="65" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12.5">1B DAU architecture separating CDN vector tiles, batched GPS telemetry, CRP/CH routing tiles, GNN ETA, and super-tile WebSocket reroutes.</text>
  <line x1="36" y1="76" x2="1164" y2="76" stroke="#1c1917" stroke-width="1.2"/>

  <!-- PANEL 1 (TOP LEFT): Vector Tile CDN & Zoom Pyramid -->
  <g transform="translate(36, 86)">
    <rect width="546" height="202" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
    <rect width="546" height="28" rx="6" fill="#f5f1e8"/>
    <text x="14" y="19" fill="#0f766e" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">1. MAP RENDERING: WEB MERCATOR PYRAMID &amp; VECTOR TILE CDN</text>

    <!-- Client -->
    <rect x="16" y="44" width="112" height="58" rx="8" fill="#f5f1e8" stroke="#57534e"/>
    <text x="72" y="65" text-anchor="middle" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">Mobile / Web</text>
    <text x="72" y="81" text-anchor="middle" fill="#0f766e" font-family="ui-monospace, monospace" font-size="9">WebGL / WebGPU</text>
    <text x="72" y="94" text-anchor="middle" fill="#57534e" font-family="system-ui, sans-serif" font-size="8.5">Renders MVT client</text>

    <line x1="128" y1="73" x2="156" y2="73" stroke="#0f766e" stroke-width="1.6" marker-end="url(#mapCyan)"/>

    <!-- CDN -->
    <rect x="160" y="44" width="128" height="58" rx="8" fill="#f0fdf9" stroke="#0f766e"/>
    <text x="224" y="64" text-anchor="middle" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">CDN Edge PoPs</text>
    <text x="224" y="80" text-anchor="middle" fill="#065f46" font-family="ui-monospace, monospace" font-size="9">GET /z/x/y.mvt</text>
    <text x="224" y="94" text-anchor="middle" fill="#44403c" font-family="system-ui, sans-serif" font-size="8.5">or PMTiles Range</text>

    <line x1="288" y1="73" x2="314" y2="73" stroke="#0f766e" stroke-width="1.6" marker-end="url(#mapCyan)"/>

    <!-- S3 Storage -->
    <rect x="318" y="44" width="212" height="58" rx="8" fill="#f0fdf9" stroke="#0f766e"/>
    <text x="424" y="63" text-anchor="middle" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">Object Storage (S3 / R2)</text>
    <text x="424" y="79" text-anchor="middle" fill="#44403c" font-family="system-ui, sans-serif" font-size="9">Precomputed MVT + deduplicated</text>
    <text x="424" y="93" text-anchor="middle" fill="#44403c" font-family="system-ui, sans-serif" font-size="9">sparse ocean / desert tiles</text>

    <!-- Zoom math strip -->
    <rect x="16" y="116" width="514" height="72" rx="8" fill="#f5f1e8" stroke="#d6d0c4"/>
    <text x="26" y="135" fill="#b45309" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700">ZOOM PYRAMID (4^z):</text>
    <text x="162" y="135" fill="#44403c" font-family="ui-monospace, monospace" font-size="9.5">z=0: 1 | z=10: 1.05M | z=21: 4.40x10^12</text>
    <text x="26" y="154" fill="#44403c" font-family="system-ui, sans-serif" font-size="9.5">• z=21 rasters (~100 KB) = ~440 PB -&gt; MVT + ocean dedupe cuts &gt;90%</text>
    <text x="26" y="172" fill="#0f766e" font-family="system-ui, sans-serif" font-size="9.5">• Tile URL API / versioned keys decouple apps from S3/CDN sharding</text>
  </g>

  <!-- PANEL 2 (TOP RIGHT): Batched GPS Telemetry & HMM Map Matching -->
  <g transform="translate(602, 86)">
    <rect width="562" height="202" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
    <rect width="562" height="28" rx="6" fill="#fffbeb"/>
    <text x="14" y="19" fill="#b45309" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">2. LOCATION TELEMETRY: 15s BATCHING -&gt; KAFKA -&gt; HMM MAP MATCH</text>

    <rect x="16" y="44" width="112" height="58" rx="8" fill="#fffbeb" stroke="#b45309"/>
    <text x="72" y="64" text-anchor="middle" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">15s GPS Batch</text>
    <text x="72" y="79" text-anchor="middle" fill="#92400e" font-family="ui-monospace, monospace" font-size="9">15x fewer QPS</text>
    <text x="72" y="93" text-anchor="middle" fill="#44403c" font-family="system-ui, sans-serif" font-size="8.5">1M peak req/s</text>

    <line x1="128" y1="73" x2="150" y2="73" stroke="#b45309" stroke-width="1.6" marker-end="url(#mapAmber)"/>

    <rect x="154" y="44" width="114" height="58" rx="8" fill="#f5f1e8" stroke="#0f766e"/>
    <text x="211" y="64" text-anchor="middle" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">Location Svc</text>
    <text x="211" y="80" text-anchor="middle" fill="#57534e" font-family="system-ui, sans-serif" font-size="8.5">Cassandra write</text>
    <text x="211" y="93" text-anchor="middle" fill="#0f766e" font-family="ui-monospace, monospace" font-size="8.5">(uid, bucket, ts)</text>

    <line x1="268" y1="73" x2="290" y2="73" stroke="#0f766e" stroke-width="1.6" marker-end="url(#mapCyan)"/>

    <rect x="294" y="44" width="96" height="58" rx="8" fill="#f5f1e8" stroke="#0f766e"/>
    <text x="342" y="65" text-anchor="middle" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">Kafka</text>
    <text x="342" y="81" text-anchor="middle" fill="#065f46" font-family="system-ui, sans-serif" font-size="8.5">Partitioned by</text>
    <text x="342" y="94" text-anchor="middle" fill="#065f46" font-family="ui-monospace, monospace" font-size="8.5">user_id</text>

    <line x1="390" y1="73" x2="412" y2="73" stroke="#0f766e" stroke-width="1.6" marker-end="url(#mapPurple)"/>

    <rect x="416" y="44" width="130" height="58" rx="8" fill="#f0fdf9" stroke="#0f766e"/>
    <text x="481" y="63" text-anchor="middle" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">HMM Map Match</text>
    <text x="481" y="79" text-anchor="middle" fill="#065f46" font-family="system-ui, sans-serif" font-size="8.5">Viterbi snap to road</text>
    <text x="481" y="93" text-anchor="middle" fill="#065f46" font-family="system-ui, sans-serif" font-size="8.5">-&gt; Live Traffic DB</text>

    <!-- Bottom telemetry strip -->
    <rect x="16" y="116" width="530" height="72" rx="8" fill="#f5f1e8" stroke="#d6d0c4"/>
    <text x="28" y="136" fill="#0f766e" font-family="ui-monospace, monospace" font-size="10" font-weight="700">WHY HMM OVER EUCLIDEAN SNAP:</text>
    <text x="28" y="155" fill="#44403c" font-family="system-ui, sans-serif" font-size="10">• Raw urban GPS drifts 5-20 m; nearest-edge snap jumps falsely onto overpasses/side streets</text>
    <text x="28" y="173" fill="#44403c" font-family="system-ui, sans-serif" font-size="10">• HMM combines distance emission + heading/topology transitions -&gt; clean speed probes</text>
  </g>

  <!-- PANEL 3 (MIDDLE): Hierarchical Routing Engine (CRP/CH + GNN ETA + Ranker) -->
  <g transform="translate(36, 308)">
    <rect width="1128" height="214" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
    <rect width="1128" height="28" rx="6" fill="#f0fdf9"/>
    <text x="14" y="19" fill="#0f766e" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">3. NAVIGATION SERVICE: HIERARCHICAL ROUTING TILES, CRP METRIC CUSTOMIZATION &amp; GNN ETA</text>

    <!-- Geocoding -->
    <rect x="18" y="46" width="144" height="74" rx="8" fill="#f5f1e8" stroke="#0f766e"/>
    <text x="90" y="66" text-anchor="middle" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">Geocoding Svc</text>
    <text x="90" y="83" text-anchor="middle" fill="#44403c" font-family="system-ui, sans-serif" font-size="9">Address -&gt; (lat, lon)</text>
    <text x="90" y="99" text-anchor="middle" fill="#57534e" font-family="ui-monospace, monospace" font-size="8.5">Valkey / Redis cache</text>
    <text x="90" y="112" text-anchor="middle" fill="#57534e" font-family="system-ui, sans-serif" font-size="8.5">Read-heavy KV</text>

    <line x1="162" y1="83" x2="188" y2="83" stroke="#0f766e" stroke-width="1.8" marker-end="url(#mapGreen)"/>

    <!-- Route Planner -->
    <rect x="192" y="46" width="146" height="74" rx="8" fill="#f0fdf9" stroke="#0f766e"/>
    <text x="265" y="66" text-anchor="middle" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">Route Planner</text>
    <text x="265" y="83" text-anchor="middle" fill="#065f46" font-family="system-ui, sans-serif" font-size="9">Orchestrates Top-K</text>
    <text x="265" y="98" text-anchor="middle" fill="#065f46" font-family="system-ui, sans-serif" font-size="9">candidate paths +</text>
    <text x="265" y="112" text-anchor="middle" fill="#065f46" font-family="system-ui, sans-serif" font-size="9">travel modes</text>

    <line x1="338" y1="83" x2="364" y2="83" stroke="#0f766e" stroke-width="1.8" marker-end="url(#mapGreen)"/>

    <!-- Shortest-Path CRP/CH Engine -->
    <rect x="368" y="42" width="332" height="84" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.5"/>
    <text x="534" y="61" text-anchor="middle" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Shortest-Path Service (CRP / CH + Routing Tiles)</text>
    <rect x="380" y="70" width="94" height="44" rx="5" fill="#f0fdf9" stroke="#065f46"/>
    <text x="427" y="88" text-anchor="middle" fill="#065f46" font-family="ui-monospace, monospace" font-size="9" font-weight="700">L0 Local</text>
    <text x="427" y="103" text-anchor="middle" fill="#44403c" font-family="system-ui, sans-serif" font-size="8.5">Origin/Dest</text>
    <rect x="486" y="70" width="96" height="44" rx="5" fill="#f0fdf9" stroke="#065f46"/>
    <text x="534" y="88" text-anchor="middle" fill="#065f46" font-family="ui-monospace, monospace" font-size="9" font-weight="700">L1 Arterial</text>
    <text x="534" y="103" text-anchor="middle" fill="#44403c" font-family="system-ui, sans-serif" font-size="8.5">City bridges</text>
    <rect x="594" y="70" width="94" height="44" rx="5" fill="#f0fdf9" stroke="#b45309"/>
    <text x="641" y="88" text-anchor="middle" fill="#92400e" font-family="ui-monospace, monospace" font-size="9" font-weight="700">L2 Highway</text>
    <text x="641" y="103" text-anchor="middle" fill="#44403c" font-family="system-ui, sans-serif" font-size="8.5">CRP shortcuts</text>

    <line x1="700" y1="83" x2="726" y2="83" stroke="#0f766e" stroke-width="1.8" marker-end="url(#mapGreen)"/>

    <!-- GNN ETA -->
    <rect x="730" y="46" width="184" height="74" rx="8" fill="#f5f1e8" stroke="#0f766e"/>
    <text x="822" y="66" text-anchor="middle" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">ML ETA Service (GNN)</text>
    <text x="822" y="83" text-anchor="middle" fill="#065f46" font-family="system-ui, sans-serif" font-size="9">Supersegment graph net</text>
    <text x="822" y="98" text-anchor="middle" fill="#44403c" font-family="system-ui, sans-serif" font-size="8.5">Live probes + history +</text>
    <text x="822" y="111" text-anchor="middle" fill="#44403c" font-family="system-ui, sans-serif" font-size="8.5">intersection turn delays</text>

    <line x1="914" y1="83" x2="940" y2="83" stroke="#0f766e" stroke-width="1.8" marker-end="url(#mapPurple)"/>

    <!-- Ranker -->
    <rect x="944" y="46" width="166" height="74" rx="8" fill="#f5f1e8" stroke="#b45309"/>
    <text x="1027" y="66" text-anchor="middle" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">Route Ranker</text>
    <text x="1027" y="83" text-anchor="middle" fill="#44403c" font-family="system-ui, sans-serif" font-size="9">Avoid tolls / highways</text>
    <text x="1027" y="98" text-anchor="middle" fill="#44403c" font-family="system-ui, sans-serif" font-size="9">Eco-fuel / fastest sort</text>
    <text x="1027" y="112" text-anchor="middle" fill="#57534e" font-family="ui-monospace, monospace" font-size="8.5">Encoded Polyline</text>

    <!-- CRP vs CH comparison strip -->
    <rect x="18" y="138" width="1092" height="60" rx="8" fill="#f5f1e8" stroke="#d6d0c4"/>
    <text x="30" y="160" fill="#0f766e" font-family="ui-monospace, monospace" font-size="10" font-weight="700">CH vs. CRP KEY DISTINCTION:</text>
    <text x="224" y="160" fill="#44403c" font-family="system-ui, sans-serif" font-size="10">Contraction Hierarchies (CH) gives &lt;1 ms static queries but needs slow hours-long full rebuilds when traffic weights change.</text>
    <text x="30" y="182" fill="#44403c" font-family="system-ui, sans-serif" font-size="10">Customizable Route Planning (CRP) separates static cell partitioning from &lt;1 s metric customization so live incidents update continental routes immediately.</text>
  </g>

  <!-- PANEL 4 (BOTTOM): Adaptive ETA & Super-Tile Rerouting -->
  <g transform="translate(36, 540)">
    <rect width="1128" height="192" rx="6" fill="#f5f1e8" stroke="#0f766e" stroke-width="1.5"/>
    <rect width="1128" height="28" rx="6" fill="#f5f1e8"/>
    <text x="14" y="19" fill="#065f46" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">4. ADAPTIVE ETA &amp; LIVE REROUTING: HIERARCHICAL SUPER-TILE INDEX + WEBSOCKET PUSH</text>

    <!-- Box 1: Incident -->
    <rect x="18" y="44" width="236" height="130" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="30" y="65" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">A. TRAFFIC INCIDENT EVENT</text>
    <text x="30" y="86" fill="#991b1b" font-family="system-ui, sans-serif" font-size="10">Accident spikes edge delay 10x</text>
    <text x="30" y="103" fill="#991b1b" font-family="system-ui, sans-serif" font-size="10">inside routing tile r_k</text>
    <text x="30" y="126" fill="#44403c" font-family="system-ui, sans-serif" font-size="9.5">Naive scan of 100M active users</text>
    <text x="30" y="142" fill="#44403c" font-family="system-ui, sans-serif" font-size="9.5">x K flat route tiles explodes RAM</text>
    <text x="30" y="160" fill="#991b1b" font-family="ui-monospace, monospace" font-size="9">O(Users * K) unscalable</text>

    <line x1="254" y1="109" x2="280" y2="109" stroke="#0f766e" stroke-width="1.8" marker-end="url(#mapPurple)"/>

    <!-- Box 2: Super-Tile Hierarchy -->
    <rect x="284" y="44" width="332" height="130" rx="8" fill="#f5f1e8" stroke="#0f766e"/>
    <text x="296" y="65" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">B. SUPER-TILE PYRAMID INDEX (O(log L))</text>
    <text x="296" y="86" fill="#1c1917" font-family="ui-monospace, monospace" font-size="9.5">user_1: [r_1, super(r_1), super^2(r_1) ...]</text>
    <text x="296" y="105" fill="#44403c" font-family="system-ui, sans-serif" font-size="10">Store nested parent tiles until root encloses</text>
    <text x="296" y="121" fill="#44403c" font-family="system-ui, sans-serif" font-size="10">origin + dest (6-9 metro; &lt;= z_base+1 max).</text>
    <text x="296" y="143" fill="#0f766e" font-family="system-ui, sans-serif" font-size="10">Incident on r_k -&gt; walk ancestors in O(depth)</text>
    <text x="296" y="160" fill="#0f766e" font-family="system-ui, sans-serif" font-size="10">to prefilter candidates, then check exact edge.</text>

    <line x1="616" y1="109" x2="642" y2="109" stroke="#0f766e" stroke-width="1.8" marker-end="url(#mapPurple)"/>

    <!-- Box 3: Anti-Herd Reroute -->
    <rect x="646" y="44" width="222" height="130" rx="8" fill="#f5f1e8" stroke="#b45309"/>
    <text x="658" y="65" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">C. ANTI-HERD REROUTING</text>
    <text x="658" y="86" fill="#44403c" font-family="system-ui, sans-serif" font-size="10">Re-score ETA only if savings</text>
    <text x="658" y="102" fill="#44403c" font-family="system-ui, sans-serif" font-size="10">exceed threshold (&gt;3-5 min).</text>
    <text x="658" y="125" fill="#92400e" font-family="system-ui, sans-serif" font-size="9.5">Stochastic / capacity-aware</text>
    <text x="658" y="141" fill="#92400e" font-family="system-ui, sans-serif" font-size="9.5">split prevents flooding one</text>
    <text x="658" y="157" fill="#92400e" font-family="system-ui, sans-serif" font-size="9.5">residential detour street.</text>

    <line x1="868" y1="109" x2="894" y2="109" stroke="#0f766e" stroke-width="1.8" marker-end="url(#mapCyan)"/>

    <!-- Box 4: WebSocket Push -->
    <rect x="898" y="44" width="212" height="130" rx="8" fill="#f5f1e8" stroke="#0f766e"/>
    <text x="910" y="65" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">D. WEBSOCKET PUSH</text>
    <text x="910" y="86" fill="#44403c" font-family="system-ui, sans-serif" font-size="10">Full-duplex persistent</text>
    <text x="910" y="102" fill="#44403c" font-family="system-ui, sans-serif" font-size="10">connection per navigator</text>
    <text x="910" y="124" fill="#57534e" font-family="system-ui, sans-serif" font-size="9.5">Beats APNs/FCM payload</text>
    <text x="910" y="139" fill="#57534e" font-family="system-ui, sans-serif" font-size="9.5">limits &amp; polling overhead;</text>
    <text x="910" y="156" fill="#0f766e" font-family="system-ui, sans-serif" font-size="9.5">jittered drain on deploys.</text>
  </g>
</svg>
