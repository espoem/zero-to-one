<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" width="1120" height="580" role="img" aria-labelledby="title desc">
  <title id="title">Multi-Window Multi-Burn-Rate SLO Alerting and Gorilla TSDB Compression</title>
  <desc id="desc">Animated step-by-step visualization of Google SRE Multi-Window Multi-Burn-Rate SLO alerting (14.4x over 1h/5m and 6x over 6h/30m with 1/12 short-window reset), alongside Facebook Gorilla TSDB double-delta timestamp encoding (~1.1 bits/sample) and IEEE-754 float64 XOR bit-window compression achieving 11.7x combined compression (1.37 bytes per sample).</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* 12s cycle:
       0-42%:  Phase 1 — Transient 1m spike: w_s (5m) spikes at/above 14.4x, w_l (1h) below 14.4x -> FILTERED (No Page)
       46-94%: Phase 2 — Real outage (52s TTD) fires AND gate, then recovers within 5m TTR when w_s clears
    */
    @keyframes blip-phase {
      0%, 44% { opacity: 1; }
      48%, 94% { opacity: 0.86; }
      98%, 100% { opacity: 1; }
    }
    @keyframes real-phase {
      0%, 44% { opacity: 0.86; }
      48%, 94% { opacity: 1; }
      98%, 100% { opacity: 0.86; }
    }
    @keyframes xor-stream {
      0%, 15% { opacity: 0.86; }
      30%, 85% { opacity: 1; }
      95%, 100% { opacity: 0.86; }
    }

    .ph-blip { animation: blip-phase 12s ease-in-out infinite; }
    .ph-real { animation: real-phase 12s ease-in-out infinite; }
    .bit-pack { animation: xor-stream 12s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .ph-blip, .ph-real, .bit-pack {
        animation: none !important;
      }
      .ph-blip, .ph-real, .bit-pack { opacity: 1 !important; }
    }
  </style>

  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1120" height="580" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>

  <!-- Header -->
  <line x1="24" y1="62" x2="1096" y2="62" stroke="#1c1917" stroke-width="1.2"/>
  
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#1c1917" font-family="Georgia, 'Times New Roman', serif">Multi-Window Multi-Burn-Rate SLOs &amp; Gorilla TSDB Compression</text>
  <text x="24" y="47" class="sans" font-size="12" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">99.9% SLO (30d): 14.4× (1h/5m) &amp; 6× (6h/30m) AND gate · Gorilla compresses 16-byte samples down to 1.37 bytes (11.7×)</text>

  <!-- LEFT PANEL: MULTI-WINDOW BURN RATE -->
  <rect x="24" y="76" width="524" height="426" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="42" y="102" class="sans" font-size="14" font-weight="700" fill="#1c1917">1. Multi-Window Multi-Burn-Rate Alerting (w_s = w_l / 12)</text>

  <!-- Tier Reference Table Strip -->
  <rect x="42" y="114" width="488" height="64" rx="7" fill="#faf8f5" stroke="#d6d0c4"/>
  <text x="54" y="134" class="mono" font-size="10.5" font-weight="700" fill="#991b1b">Page Fast: r=14.4× (e=1.44%) · w_l=1h, w_s=5m · 2% budget · TTR≤5m</text>
  <text x="54" y="152" class="mono" font-size="10.5" font-weight="700" fill="#b45309">Page Slow: r=6.0×  (e=0.60%) · w_l=6h, w_s=30m · 5% budget · TTR≤30m</text>
  <text x="54" y="170" class="mono" font-size="10.5" fill="#065f46">Ticket:    r=1.0×  (e=0.10%) · w_l=3d, w_s=6h  · 10% budget · TTR≤6h</text>

  <!-- Scenario A: 1-min blip filtered -->
  <g class="ph-blip">
    <rect x="42" y="190" width="488" height="122" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
    <text x="56" y="212" class="sans" font-size="12" font-weight="700" fill="#92400e">Scenario A: 1-min 10% Error Blip (Impulse Rejection)</text>
    <rect x="56" y="224" width="166" height="44" rx="5" fill="#fef2f2" stroke="#dc2626"/>
    <text x="139" y="242" class="mono" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">w_s (5m): 20× ≥ 14.4×</text>
    <text x="139" y="258" class="mono" font-size="10" fill="#991b1b" text-anchor="middle">TRUE (short spike)</text>

    <text x="238" y="250" class="mono" font-size="11" font-weight="700" fill="#44403c" text-anchor="middle">AND</text>

    <rect x="254" y="224" width="166" height="44" rx="5" fill="#f0fdf9" stroke="#0f766e"/>
    <text x="337" y="242" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">w_l (1h): 1.67× &lt; 14.4×</text>
    <text x="337" y="258" class="mono" font-size="10" fill="#065f46" text-anchor="middle">FALSE (0.23% budget)</text>

    <rect x="430" y="224" width="88" height="44" rx="5" fill="#0f766e"/>
    <text x="474" y="244" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">NO PAGE</text>
    <text x="474" y="259" class="mono" font-size="10" fill="#f0fdf9" text-anchor="middle">filtered!</text>
    <text x="56" y="294" class="sans" font-size="10.5" fill="#92400e">A 5-min spike must average ≥ 17.28% errors (2% monthly budget) to page.</text>
  </g>

  <!-- Scenario B: Real Outage + Fast 5m Reset -->
  <g class="ph-real">
    <rect x="42" y="326" width="488" height="160" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
    <text x="56" y="348" class="sans" font-size="12" font-weight="700" fill="#991b1b">Scenario B: 100% Outage (t=0..5m) → TTD ≈ 52s &amp; TTR ≤ 5m</text>

    <rect x="56" y="362" width="218" height="50" rx="5" fill="#ffffff" stroke="#dc2626"/>
    <text x="165" y="382" class="mono" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">t=52s: w_l ≥ 14.4× AND w_s ≥ 14.4×</text>
    <text x="165" y="400" class="mono" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">→ PAGE ON-CALL IMMEDIATELY</text>

    <line x1="274" y1="387" x2="306" y2="387" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-green)"/>

    <rect x="312" y="362" width="206" height="50" rx="5" fill="#f0fdf9" stroke="#0f766e"/>
    <text x="415" y="382" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">t=10m (5m post-fix): w_s = 0</text>
    <text x="415" y="400" class="mono" font-size="10" font-weight="700" fill="#0f766e" text-anchor="middle">→ AUTO-RESETS (not stuck 1h!)</text>

    <text x="56" y="438" class="mono" font-size="10" fill="#44403c">TTD = w_l · r·(1−R)/e = 60m · (14.4 × 0.001) / 1.0 = 51.8s</text>
    <text x="56" y="458" class="sans" font-size="10.5" fill="#991b1b">Without w_s, w_l stays &gt; 14.4× for 60 minutes after outage recovery!</text>
  </g>

  <!-- RIGHT PANEL: GORILLA TSDB COMPRESSION -->
  <rect x="572" y="76" width="524" height="426" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="590" y="102" class="sans" font-size="14" font-weight="700" fill="#1c1917">2. Gorilla TSDB Compression (Double-Delta + Float64 XOR)</text>

  <!-- Double-Delta Timestamp Box -->
  <rect x="590" y="118" width="488" height="168" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.5"/>
  <text x="606" y="140" class="sans" font-size="12.5" font-weight="700" fill="#065f46">A. Double-Delta Timestamp Encoding (64b → ~1.1 bits)</text>
  <text x="606" y="160" class="mono" font-size="10.5" fill="#44403c">D = (t_n − t_{n-1}) − (t_{n-1} − t_{n-2})   [10s scrape interval]</text>

  <g class="bit-pack">
    <rect x="606" y="172" width="128" height="38" rx="5" fill="#ffffff" stroke="#99f6e4"/>
    <text x="670" y="189" class="mono" font-size="10" fill="#44403c" text-anchor="middle">t=[10, 20, 30]</text>
    <text x="670" y="203" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">Δt=10, 10 → D=0</text>

    <line x1="734" y1="191" x2="764" y2="191" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-blue)"/>

    <rect x="770" y="172" width="124" height="38" rx="5" fill="#0f766e"/>
    <text x="832" y="195" class="mono" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Emit '0' (1 bit!)</text>

    <rect x="904" y="172" width="160" height="38" rx="5" fill="#f0fdf9" stroke="#0f766e"/>
    <text x="984" y="189" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">&gt;96% of samples = 1 bit</text>
    <text x="984" y="203" class="mono" font-size="10" fill="#065f46" text-anchor="middle">avg ~1.1–1.2 b/ts</text>
  </g>

  <text x="606" y="234" class="mono" font-size="10" fill="#065f46">Jitter tiers: D∈[-63,64]→'10'+7b (9b) | [-255,256]→'110'+9b (12b)</text>
  <text x="606" y="252" class="mono" font-size="10" fill="#065f46">[-2047,2048]→'1110'+12b (16b) | otherwise→'1111'+32b (36b)</text>
  <text x="606" y="272" class="sans" font-size="10.5" fill="#44403c">Replaces 64-bit Unix timestamps with 1-bit deltas during steady scrapes.</text>

  <!-- Float64 XOR Value Box -->
  <rect x="590" y="300" width="488" height="186" rx="8" fill="#f5f1e8" stroke="#0f766e" stroke-width="1.5"/>
  <text x="606" y="322" class="sans" font-size="12.5" font-weight="700" fill="#065f46">B. Float64 XOR Value Compression (X = v_n ⊕ v_{n-1})</text>

  <g class="bit-pack">
    <rect x="606" y="336" width="456" height="32" rx="5" fill="#ffffff" stroke="#d6d0c4"/>
    <text x="618" y="356" class="mono" font-size="10" fill="#065f46" font-weight="700">1. X == 0 (identical value): emit single '0' bit (1 bit total)</text>

    <rect x="606" y="374" width="456" height="36" rx="5" fill="#ffffff" stroke="#d6d0c4"/>
    <text x="618" y="390" class="mono" font-size="10" fill="#065f46" font-weight="700">2. X != 0, fits prev zero-window: '10' + meaningful bits</text>
    <text x="618" y="404" class="mono" font-size="10" fill="#44403c">(shares identical IEEE-754 sign + exponent + high mantissa zeros)</text>

    <rect x="606" y="416" width="456" height="32" rx="5" fill="#ffffff" stroke="#d6d0c4"/>
    <text x="618" y="436" class="mono" font-size="10" fill="#065f46" font-weight="700">3. New window: '11' + 5b leadingZeros + 6b len + bits</text>
  </g>

  <rect x="606" y="454" width="456" height="24" rx="4" fill="#065f46"/>
  <text x="834" y="470" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Combined (ts, val): 16 Bytes → 1.37 Bytes (11 bits) = 11.7× Ratio</text>

  <!-- FOOTER -->
  <rect x="24" y="516" width="1072" height="46" rx="8" fill="#f0fdf9" stroke="#99f6e4" stroke-width="1"/>
  <text x="42" y="544" class="sans" font-size="11.5" font-weight="600" fill="#065f46">Takeaway: Dual-window burn rates eliminate false pages &amp; slow resets, while Gorilla keeps 10M+ active metrics in RAM at 1.37 B/sample.</text>
</svg>
