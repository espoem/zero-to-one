<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Stage 4b: CDN Edge, Origin Shield, and Combined Dynamic/Static Topology</title>
  <desc id="desc">Two-tier animated schematic: the top half demonstrates User A experiencing a cold CDN Edge PoP miss coalesced by an Origin Shield to the Object Store (TTL 3600s) while User B gets a 10ms Edge HIT; the bottom half shows the combined Stage 4 production topology splitting static traffic to the CDN and dynamic API traffic through the Load Balancer, Web Tier, Valkey Cache, and PostgreSQL Primary/Replicas.</desc>
  <defs>
    <style>
      .flow-green { stroke-dasharray: 8 6; animation: dash-flow 1.3s linear infinite; }
      .flow-amber { stroke-dasharray: 8 6; animation: dash-flow 1.6s linear infinite; }
      .flow-blue { stroke-dasharray: 8 6; animation: dash-flow 1.4s linear infinite; }
      .pulse-badge { animation: badge-pulse 2.2s ease-in-out infinite; }
      @keyframes dash-flow { to { stroke-dashoffset: -28; } }
      @keyframes badge-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.72; } }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
        .smil-packet { display: none !important; }
      }
    </style>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1120" height="600" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="1120" height="62" rx="12" fill="#0f172a"/>
  <rect x="0" y="46" width="1120" height="16" fill="#0f172a"/>
  <text x="24" y="29" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Stage 4 · CDN Edge PoP, Origin Shield &amp; Combined Dynamic/Static Topology</text>
  <text x="24" y="49" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Edge PoPs serve static media in ~10 ms over Anycast HTTP/3 while Origin Shield collapses global cold misses into a single origin fetch</text>

  <!-- ==================== TOP HALF: CDN EDGE FLOW ==================== -->
  <g transform="translate(24, 76)">
    <rect x="0" y="0" width="1072" height="222" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="14" y="10" width="320" height="22" rx="11" fill="#0f172a"/>
    <text x="174" y="25" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#f8fafc">PART A · EDGE CACHE HIT VS. ORIGIN SHIELD MISS</text>

    <!-- User A (Cold Miss) -->
    <rect x="20" y="46" width="176" height="68" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="34" y="68" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#92400e">User A (Cold Miss)</text>
    <text x="34" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#b45309">GET /hero.webp</text>
    <text x="34" y="102" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#78350f">1st request in region</text>

    <!-- User B (Warm Hit) -->
    <rect x="20" y="132" width="176" height="72" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
    <text x="34" y="154" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#065f46">User B (~10 ms HIT)</text>
    <text x="34" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#047857">GET /hero.webp</text>
    <text x="34" y="189" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#059669">Served directly by PoP!</text>

    <!-- CDN Edge PoP -->
    <rect x="276" y="46" width="218" height="158" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="385" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">CDN Edge PoP</text>
    <text x="385" y="88" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#2563eb">Anycast HTTP/3 (QUIC)</text>
    <rect x="292" y="102" width="186" height="40" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="385" y="120" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#92400e">1. User A -&gt; MISS (fill)</text>
    <text x="385" y="134" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#78350f">Stores object TTL = 3600s</text>
    <rect x="292" y="150" width="186" height="40" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="385" y="168" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#065f46">3. User B -&gt; Edge HIT</text>
    <text x="385" y="182" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#047857">0 origin egress · ~10 ms RTT</text>

    <!-- Origin Shield -->
    <rect x="572" y="54" width="204" height="142" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
    <text x="674" y="78" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#92400e">Origin Shield</text>
    <text x="674" y="96" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#78350f">Regional Mid-Tier Cache</text>
    <rect x="588" y="108" width="172" height="72" rx="6" fill="#ffffff" stroke="#fcd34d"/>
    <text x="674" y="128" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#92400e">Request Coalescing</text>
    <text x="674" y="145" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">Collapses 200+ PoP misses</text>
    <text x="674" y="161" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">into 1 origin fetch</text>

    <!-- Object Store / Origin -->
    <rect x="852" y="54" width="200" height="142" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="952" y="78" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#4c1d95">Object Store / Origin</text>
    <text x="952" y="96" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#6d28d9">S3 / R2 / Origin Bucket</text>
    <rect x="868" y="108" width="168" height="72" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="952" y="128" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#4c1d95">Cache-Control: public,</text>
    <text x="952" y="143" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#4c1d95">max-age=3600</text>
    <text x="952" y="163" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#9f1239">Never cache Set-Cookie!</text>

    <!-- Top Animated Arrows -->
    <path d="M 196 80 L 272 80" fill="none" stroke="#d97706" stroke-width="2" class="flow-amber" marker-end="url(#arr-amber)"/>
    <path d="M 494 106 L 568 106" fill="none" stroke="#d97706" stroke-width="2" class="flow-amber" marker-end="url(#arr-amber)"/>
    <path d="M 776 106 L 848 106" fill="none" stroke="#d97706" stroke-width="2" class="flow-amber" marker-end="url(#arr-amber)"/>
    <!-- Return fill from Origin -> PoP -->
    <path d="M 848 142 L 498 142" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr-violet)"/>
    <!-- User B <-> Edge PoP HIT -->
    <path d="M 196 168 L 272 168" fill="none" stroke="#059669" stroke-width="2.4" class="flow-green" marker-end="url(#arr-green)"/>
    <path d="M 272 184 L 196 184" fill="none" stroke="#059669" stroke-width="2.4" class="flow-green" marker-end="url(#arr-green)"/>

    <circle class="smil-packet" r="4.5" fill="#d97706" opacity="0">
      <animateMotion dur="2.6s" repeatCount="indefinite" path="M 196 80 L 272 80 L 494 106 L 568 106 L 848 106"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle class="smil-packet" r="5" fill="#059669" opacity="0">
      <animateMotion dur="1.4s" repeatCount="indefinite" path="M 272 184 L 196 184"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>

    <g class="pulse-badge" transform="translate(234, 60)">
      <circle cx="0" cy="0" r="10" fill="#d97706"/>
      <text x="0" y="3.5" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">1</text>
    </g>
    <g class="pulse-badge" transform="translate(531, 86)">
      <circle cx="0" cy="0" r="10" fill="#d97706"/>
      <text x="0" y="3.5" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">2</text>
    </g>
    <g class="pulse-badge" transform="translate(234, 202)">
      <circle cx="0" cy="0" r="10" fill="#059669"/>
      <text x="0" y="3.5" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">3</text>
    </g>
  </g>

  <!-- ==================== BOTTOM HALF: COMBINED FULL TOPOLOGY ==================== -->
  <g transform="translate(24, 314)">
    <rect x="0" y="0" width="1072" height="206" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="14" y="10" width="356" height="22" rx="11" fill="#1e293b"/>
    <text x="192" y="25" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#f8fafc">PART B · COMBINED STATIC CDN + DYNAMIC API TOPOLOGY</text>

    <!-- DNS + Clients -->
    <rect x="20" y="54" width="144" height="126" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="92" y="80" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Clients + DNS</text>
    <text x="92" y="102" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#059669">cdn.example.com</text>
    <text x="92" y="120" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#475569">-&gt; Static Assets</text>
    <text x="92" y="144" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#2563eb">api.example.com</text>
    <text x="92" y="162" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#475569">-&gt; Dynamic VIP</text>

    <!-- Top track: CDN -> Object Store -->
    <rect x="234" y="46" width="210" height="58" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
    <text x="339" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#065f46">CDN Edge + Shield</text>
    <text x="339" y="89" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#047857">JS, CSS, Images, Video</text>

    <rect x="520" y="46" width="210" height="58" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="625" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#4c1d95">Origin Object Store</text>
    <text x="625" y="89" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#6d28d9">Immutable hashed bundles</text>

    <!-- Bottom track: LB -> Web Tier -> Cache & DB -->
    <rect x="234" y="124" width="136" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="302" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">L4 / L7 LB</text>
    <text x="302" y="169" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#2563eb">Public VIP (P2C)</text>

    <rect x="434" y="124" width="166" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="517" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">Web Tier Pool</text>
    <text x="517" y="169" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">Dynamic JSON / Auth</text>

    <rect x="668" y="124" width="174" height="62" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
    <text x="755" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#92400e">Valkey / Redis</text>
    <text x="755" y="169" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#b45309">Hot Reads &amp; Sessions</text>

    <rect x="884" y="46" width="168" height="140" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="968" y="76" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#4c1d95">PostgreSQL Cluster</text>
    <rect x="898" y="90" width="140" height="36" rx="5" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="968" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#5b21b6">Primary (Writes)</text>
    <rect x="898" y="136" width="140" height="36" rx="5" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="968" y="158" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#065f46">Replicas (Reads)</text>

    <!-- Bottom Connectors -->
    <path d="M 164 88 L 230 76" fill="none" stroke="#059669" stroke-width="2" class="flow-green" marker-end="url(#arr-green)"/>
    <path d="M 444 75 L 516 75" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr-violet)"/>
    <path d="M 164 148 L 230 154" fill="none" stroke="#2563eb" stroke-width="2.2" class="flow-blue" marker-end="url(#arr-blue)"/>
    <path d="M 370 155 L 430 155" fill="none" stroke="#2563eb" stroke-width="2.2" class="flow-blue" marker-end="url(#arr-blue)"/>
    <path d="M 600 155 L 664 155" fill="none" stroke="#d97706" stroke-width="2" class="flow-amber" marker-end="url(#arr-amber)"/>
    <path d="M 842 155 L 880 155" fill="none" stroke="#7c3aed" stroke-width="2" class="flow-blue" marker-end="url(#arr-violet)"/>

    <circle class="smil-packet" r="4" fill="#059669" opacity="0">
      <animateMotion dur="1.5s" repeatCount="indefinite" path="M 164 88 L 230 76"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle class="smil-packet" r="4.5" fill="#2563eb" opacity="0">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M 164 148 L 230 154 L 430 155 L 664 155 L 880 155"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Footer -->
  <rect x="24" y="534" width="1072" height="50" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="42" y="564" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#0f172a"><tspan font-weight="700">Takeaway:</tspan> Static content never hits web compute or PostgreSQL. Always set <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#be123c">Cache-Control: private, no-store</tspan> on Set-Cookie responses to prevent cross-user CDN leaks.</text>
</svg>
