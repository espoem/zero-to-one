<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Argon2id Hybrid Memory-Hard Hashing &amp; HIBP k-Anonymity Range Query</title>
  <desc id="desc">Animated step-by-step diagram of Argon2id password hashing (RFC 9106) combining data-independent Argon2i passes for cache-timing resistance and data-dependent Argon2d passes for GPU/ASIC resistance across a 19 MiB memory matrix, alongside HIBP k-Anonymity breached-password verification sending only a 5-hex SHA-1 prefix across the network.</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* 12s cycle:
       0-25%:   Step 1 — Argon2i Pass 1 (data-independent matrix fill)
       25-50%:  Step 2 — Argon2d Pass 2 (data-dependent jumps) -> PHC Hash
       50-75%:  Step 3 — HIBP SHA-1 split -> send 5-char prefix 8382E
       75-100%: Step 4 — Local suffix scan in memory (zero plaintext leak)
    */
    @keyframes pass-i-hl {
      0%, 24% { fill: #f0fdf9; stroke: #0f766e; stroke-width: 2; }
      25%, 100% { fill: #f5f1e8; stroke: #d6d0c4; stroke-width: 1; }
    }
    @keyframes pass-d-hl {
      0%, 24% { fill: #f5f1e8; stroke: #d6d0c4; stroke-width: 1; }
      25%, 49% { fill: #f5f1e8; stroke: #0f766e; stroke-width: 2; }
      50%, 100% { fill: #f5f1e8; stroke: #d6d0c4; stroke-width: 1; }
    }
    @keyframes cursor-i {
      0%   { transform: translate(0px, 0px); opacity: 1; }
      12%  { transform: translate(168px, 0px); opacity: 1; }
      24%  { transform: translate(252px, 38px); opacity: 1; }
      26%, 100% { opacity: 0; }
    }
    @keyframes cursor-d {
      0%, 25% { opacity: 0; }
      28%  { transform: translate(84px, 38px); opacity: 1; }
      38%  { transform: translate(252px, 0px); opacity: 1; }
      48%  { transform: translate(168px, 76px); opacity: 1; }
      52%, 100% { opacity: 0; }
    }
    @keyframes prefix-fly {
      0%, 48% { transform: translateX(0px); opacity: 0; }
      54%     { transform: translateX(0px); opacity: 1; }
      72%     { transform: translateX(100px); opacity: 1; }
      76%, 100% { transform: translateX(100px); opacity: 0; }
    }
    @keyframes suffix-match {
      0%, 74% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1; }
      78%, 98% { opacity: 1; stroke: #dc2626; stroke-width: 2.2; }
      100% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1; }
    }
    @keyframes panel-left {
      0%, 49% { stroke: #0f766e; stroke-width: 2.2; }
      50%, 100% { stroke: #d6d0c4; stroke-width: 1.4; }
    }
    @keyframes panel-right {
      0%, 49% { stroke: #d6d0c4; stroke-width: 1.4; }
      50%, 100% { stroke: #0f766e; stroke-width: 2.2; }
    }

    .p-left  { animation: panel-left 12s linear infinite; }
    .p-right { animation: panel-right 12s linear infinite; }
    .cell-i  { animation: pass-i-hl 12s linear infinite; }
    .cell-d  { animation: pass-d-hl 12s linear infinite; }
    .cur-i   { animation: cursor-i 12s ease-in-out infinite; }
    .cur-d   { animation: cursor-d 12s ease-in-out infinite; }
    .pfx-pkt { animation: prefix-fly 12s ease-in-out infinite; }
    .sfx-hit { animation: suffix-match 12s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .p-left, .p-right, .cell-i, .cell-d, .cur-i, .cur-d, .pfx-pkt, .sfx-hit {
        animation: none !important;
      }
      .p-left, .p-right { stroke: #d6d0c4 !important; stroke-width: 1.5 !important; }
      .cur-i, .cur-d, .pfx-pkt { opacity: 0 !important; }
      .sfx-hit { opacity: 1 !important; stroke: #dc2626 !important; stroke-width: 2 !important; }
    }
  </style>

  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1120" height="600" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>

  <!-- Header -->
  <line x1="24" y1="64" x2="1096" y2="64" stroke="#1c1917" stroke-width="1.2"/>
  
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#1c1917" font-family="Georgia, 'Times New Roman', serif">Password Defense — Argon2id Memory-Hard Matrix &amp; HIBP k-Anonymity</text>
  <text x="24" y="48" class="sans" font-size="12" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">Module 03 · RFC 9106 Argon2id (m=19 MiB, t=2, p=1) + Salt/Pepper · 5-Hex SHA-1 Prefix Privacy Query</text>

  <!-- LEFT PANEL: ARGON2ID HYBRID MATRIX -->
  <rect x="24" y="78" width="526" height="448" rx="10" fill="#ffffff" class="p-left"/>
  <text x="42" y="104" class="sans" font-size="14" font-weight="700" fill="#1c1917">1. Argon2id Hybrid Passes (RFC 9106)</text>

  <!-- Inputs bar -->
  <rect x="42" y="118" width="144" height="44" rx="6" fill="#f0fdf9" stroke="#0f766e"/>
  <text x="114" y="137" class="sans" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">Password (∞ len)</text>
  <text x="114" y="153" class="mono" font-size="10" fill="#065f46" text-anchor="middle">No 72B bcrypt cap</text>

  <rect x="198" y="118" width="154" height="44" rx="6" fill="#f0fdf9" stroke="#0f766e"/>
  <text x="275" y="137" class="sans" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">CSPRNG Salt (16B)</text>
  <text x="275" y="153" class="mono" font-size="10" fill="#065f46" text-anchor="middle">Stored in PHC hash</text>

  <rect x="364" y="118" width="168" height="44" rx="6" fill="#f5f1e8" stroke="#0f766e"/>
  <text x="448" y="137" class="sans" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">KMS Pepper (256b)</text>
  <text x="448" y="153" class="mono" font-size="10" fill="#065f46" text-anchor="middle">Never stored in DB</text>

  <!-- Memory Matrix 19 MiB -->
  <rect x="42" y="176" width="490" height="196" rx="8" fill="#faf8f5" stroke="#d6d0c4" stroke-width="1.2"/>
  <text x="56" y="197" class="mono" font-size="11" font-weight="700" fill="#1c1917">Memory Matrix: m = 19 MiB (19,456 KiB), p = 1, t = 2 passes</text>

  <!-- Pass badges -->
  <rect x="56" y="208" width="224" height="28" rx="5" fill="#f0fdf9" stroke="#0f766e"/>
  <text x="168" y="226" class="sans" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">Pass 1: Argon2i (Data-Independent)</text>

  <rect x="292" y="208" width="224" height="28" rx="5" fill="#f5f1e8" stroke="#0f766e"/>
  <text x="404" y="226" class="sans" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">Pass 2: Argon2d (Data-Dependent)</text>

  <!-- 4x3 Block Grid -->
  <rect x="92" y="248" width="76" height="30" rx="4" class="cell-i"/>
  <text x="130" y="267" class="mono" font-size="10" font-weight="700" fill="#1c1917" text-anchor="middle">B[0]</text>
  <rect x="176" y="248" width="76" height="30" rx="4" class="cell-i"/>
  <text x="214" y="267" class="mono" font-size="10" font-weight="700" fill="#1c1917" text-anchor="middle">B[1]</text>
  <rect x="260" y="248" width="76" height="30" rx="4" class="cell-i"/>
  <text x="298" y="267" class="mono" font-size="10" font-weight="700" fill="#1c1917" text-anchor="middle">B[2]</text>
  <rect x="344" y="248" width="76" height="30" rx="4" class="cell-i"/>
  <text x="382" y="267" class="mono" font-size="10" font-weight="700" fill="#1c1917" text-anchor="middle">B[3]</text>

  <rect x="92" y="286" width="76" height="30" rx="4" class="cell-d"/>
  <text x="130" y="305" class="mono" font-size="10" font-weight="700" fill="#1c1917" text-anchor="middle">B[4]</text>
  <rect x="176" y="286" width="76" height="30" rx="4" class="cell-d"/>
  <text x="214" y="305" class="mono" font-size="10" font-weight="700" fill="#1c1917" text-anchor="middle">B[5]</text>
  <rect x="260" y="286" width="76" height="30" rx="4" class="cell-d"/>
  <text x="298" y="305" class="mono" font-size="10" font-weight="700" fill="#1c1917" text-anchor="middle">B[6]</text>
  <rect x="344" y="286" width="76" height="30" rx="4" class="cell-d"/>
  <text x="382" y="305" class="mono" font-size="10" font-weight="700" fill="#1c1917" text-anchor="middle">B[7]</text>

  <rect x="92" y="324" width="76" height="30" rx="4" class="cell-d"/>
  <text x="130" y="343" class="mono" font-size="10" font-weight="700" fill="#1c1917" text-anchor="middle">B[8]</text>
  <rect x="176" y="324" width="76" height="30" rx="4" class="cell-d"/>
  <text x="214" y="343" class="mono" font-size="10" font-weight="700" fill="#1c1917" text-anchor="middle">B[9]</text>
  <rect x="260" y="324" width="76" height="30" rx="4" class="cell-d"/>
  <text x="298" y="343" class="mono" font-size="10" font-weight="700" fill="#1c1917" text-anchor="middle">B[10]</text>
  <rect x="344" y="324" width="76" height="30" rx="4" class="cell-d"/>
  <text x="382" y="343" class="mono" font-size="10" font-weight="700" fill="#1c1917" text-anchor="middle">B[m-1]</text>

  <!-- Animated block cursors -->
  <rect x="92" y="248" width="76" height="30" rx="4" fill="none" stroke="#0f766e" stroke-width="3" class="cur-i"/>
  <rect x="92" y="248" width="76" height="30" rx="4" fill="none" stroke="#0f766e" stroke-width="3" class="cur-d"/>

  <!-- Explanation Cards -->
  <rect x="42" y="386" width="490" height="58" rx="7" fill="#f0fdf9" stroke="#99f6e4"/>
  <text x="56" y="406" class="sans" font-size="11" font-weight="700" fill="#065f46">Why Hybrid? Pass 1 (i) + Pass 2 (d)</text>
  <text x="56" y="424" class="sans" font-size="10.5" fill="#065f46">• Pass 1 (Argon2i): fixed index order defeats cache-timing side-channels.</text>
  <text x="56" y="438" class="sans" font-size="10.5" fill="#065f46">• Pass 2 (Argon2d): hash-dependent jumps defeat parallel GPU/ASICs.</text>

  <rect x="42" y="454" width="490" height="56" rx="7" fill="#f0fdf9" stroke="#99f6e4"/>
  <text x="56" y="474" class="mono" font-size="10" font-weight="700" fill="#065f46">$argon2id$v=19$m=19456,t=2,p=1$&lt;16B-salt&gt;$&lt;32B-tag&gt;</text>
  <text x="56" y="494" class="sans" font-size="10" fill="#065f46">Output stored in DB (optionally wrapped via HMAC_Pepper).</text>

  <!-- RIGHT PANEL: HIBP K-ANONYMITY -->
  <rect x="570" y="78" width="526" height="448" rx="10" fill="#ffffff" class="p-right"/>
  <text x="588" y="104" class="sans" font-size="14" font-weight="700" fill="#1c1917">2. Breached Password Check via k-Anonymity (HIBP)</text>

  <!-- Local SHA-1 Split -->
  <rect x="588" y="118" width="490" height="108" rx="8" fill="#faf8f5" stroke="#d6d0c4"/>
  <text x="602" y="138" class="sans" font-size="11.5" font-weight="700" fill="#1c1917">Step A (Local App): Hash &amp; Split SHA-1(password)</text>
  <text x="602" y="158" class="mono" font-size="10.5" fill="#44403c">SHA-1("P@ssw0rd1") → 40 hex chars:</text>

  <rect x="602" y="168" width="94" height="32" rx="5" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.8"/>
  <text x="649" y="188" class="mono" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">8382E</text>

  <rect x="704" y="168" width="358" height="32" rx="5" fill="#f5f1e8" stroke="#d6d0c4" stroke-dasharray="4 3"/>
  <text x="883" y="188" class="mono" font-size="11" font-weight="600" fill="#44403c" text-anchor="middle">094246E26601D9D994EAE352B118CD75EB4 (Kept Local!)</text>
  <text x="649" y="216" class="sans" font-size="10" font-weight="700" fill="#0f766e" text-anchor="middle">5-char Prefix</text>
  <text x="883" y="216" class="sans" font-size="10" font-weight="700" fill="#57534e" text-anchor="middle">35-char Suffix — NEVER sent over network</text>

  <!-- Wire Transfer -->
  <rect x="588" y="238" width="214" height="66" rx="7" fill="#f0fdf9" stroke="#0f766e"/>
  <text x="695" y="258" class="sans" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">App Backend</text>
  <text x="695" y="276" class="mono" font-size="10" fill="#065f46" text-anchor="middle">GET /range/8382E</text>
  <text x="695" y="292" class="sans" font-size="10" fill="#0f766e" text-anchor="middle">16^5 = 1,048,576 buckets</text>

  <line x1="806" y1="262" x2="878" y2="262" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="878" y1="282" x2="806" y2="282" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Flying 5-char packet -->
  <g transform="translate(780, 252)">
    <g class="pfx-pkt">
      <rect x="0" y="0" width="54" height="20" rx="4" fill="#0f766e"/>
      <text x="27" y="14" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">8382E</text>
    </g>
  </g>

  <rect x="884" y="238" width="194" height="66" rx="7" fill="#f0fdf9" stroke="#0f766e"/>
  <text x="981" y="258" class="sans" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">HIBP Range API</text>
  <text x="981" y="276" class="mono" font-size="10" fill="#065f46" text-anchor="middle">Returns ~500 suffixes</text>
  <text x="981" y="292" class="sans" font-size="10" fill="#0f766e" text-anchor="middle">Zero user password info</text>

  <!-- Local Suffix Scan -->
  <rect x="588" y="318" width="490" height="192" rx="8" fill="#ffffff" stroke="#d6d0c4"/>
  <text x="602" y="340" class="sans" font-size="11.5" font-weight="700" fill="#1c1917">Step B (Local RAM): Scan Returned Suffixes for Exact Match</text>

  <rect x="602" y="352" width="462" height="28" rx="4" fill="#faf8f5" stroke="#e7e2d8"/>
  <text x="614" y="370" class="mono" font-size="10.5" fill="#57534e">0018A45C4D1DEF81644B54AB7F969B88D65 : 21</text>

  <rect x="602" y="386" width="462" height="32" rx="5" fill="#fef2f2" class="sfx-hit"/>
  <text x="614" y="406" class="mono" font-size="10.5" font-weight="700" fill="#991b1b">094246E26601D9D994EAE352B118CD75EB4 : 241892  ← MATCH!</text>

  <rect x="602" y="424" width="462" height="28" rx="4" fill="#faf8f5" stroke="#e7e2d8"/>
  <text x="614" y="442" class="mono" font-size="10.5" fill="#57534e">0A3C911F884B2E170A676A45B09B2214910 : 7</text>

  <rect x="602" y="462" width="462" height="36" rx="6" fill="#fef2f2" stroke="#fda4af"/>
  <text x="833" y="484" class="sans" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">REJECT: Compromised in 241,892 breaches (API never saw hash!)</text>

  <!-- Footer -->
  <rect x="24" y="540" width="1072" height="44" rx="8" fill="#f0fdf9" stroke="#99f6e4" stroke-width="1"/>
  <text x="42" y="567" class="sans" font-size="11.5" font-weight="600" fill="#065f46">Takeaway: Check candidate passwords privately via k-Anonymity first, then persist hashes with Argon2id (m=19 MiB, t=2) + random salt + HSM pepper.</text>
</svg>
