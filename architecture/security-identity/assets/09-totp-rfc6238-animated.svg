<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" role="img" aria-labelledby="title desc">
  <title id="title">TOTP (RFC 6238) Step-by-Step Time-Based One-Time Password Generation</title>
  <desc id="desc">Animated RFC 6238 TOTP pipeline: dividing Unix epoch by 30-second step size to produce 8-byte counter T, computing 20-byte HMAC-SHA1(K, T), extracting the low 4-bit offset from byte 19 for 4-byte dynamic truncation with 31-bit MSB masking, and reducing modulo 10^6 to yield a 6-digit OTP code with T +/- 1 clock skew tolerance.</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* 12s cycle across 4 pipeline stages:
       0-25%:   Stage 1 — 30s time step T = floor(now / 30)
       25-50%:  Stage 2 — HMAC-SHA1(K, T) -> 20-byte digest
       50-75%:  Stage 3 — Dynamic truncation (offset = B[19] &amp; 0x0f -> 4 bytes &amp; 0x7fffffff)
       75-100%: Stage 4 — mod 10^6 -> 6-digit OTP code
    */
    @keyframes st1 { 0%, 24% { stroke: #0f766e; stroke-width: 2.5; opacity: 1; } 25%, 100% { stroke: #d6d0c4; stroke-width: 1.4; opacity: 0.72; } }
    @keyframes st2 { 0%, 24% { stroke: #d6d0c4; stroke-width: 1.4; opacity: 0.72; } 25%, 49% { stroke: #0f766e; stroke-width: 2.5; opacity: 1; } 50%, 100% { stroke: #d6d0c4; stroke-width: 1.4; opacity: 0.72; } }
    @keyframes st3 { 0%, 49% { stroke: #d6d0c4; stroke-width: 1.4; opacity: 0.72; } 50%, 74% { stroke: #b45309; stroke-width: 2.5; opacity: 1; } 75%, 100% { stroke: #d6d0c4; stroke-width: 1.4; opacity: 0.72; } }
    @keyframes st4 { 0%, 74% { stroke: #d6d0c4; stroke-width: 1.4; opacity: 0.72; } 75%, 100% { stroke: #0f766e; stroke-width: 2.5; opacity: 1; } }

    @keyframes bar-drain {
      0%   { transform: scaleX(1); }
      95%  { transform: scaleX(0.05); }
      100% { transform: scaleX(1); }
    }
    @keyframes slice-pop {
      0%, 49% { opacity: 0.86; }
      54%, 74% { opacity: 1; }
      78%, 100% { opacity: 0.6; }
    }

    .s1 { animation: st1 12s linear infinite; }
    .s2 { animation: st2 12s linear infinite; }
    .s3 { animation: st3 12s linear infinite; }
    .s4 { animation: st4 12s linear infinite; }
    .timer-bar { transform-box: fill-box; transform-origin: left center; animation: bar-drain 12s linear infinite; }
    .dash { stroke-dasharray: 6 6;  }
    .slice-hl { animation: slice-pop 12s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .s1, .s2, .s3, .s4, .timer-bar, .dash, .slice-hl { animation: none !important; }
      .s1, .s2, .s3, .s4 { opacity: 1 !important; stroke-width: 1.8 !important; }
      .timer-bar { transform: scaleX(0.7) !important; }
      .slice-hl { opacity: 1 !important; }
    }
  </style>

  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#44403c"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1120" height="560" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>

  <!-- Header -->
  <line x1="24" y1="64" x2="1096" y2="64" stroke="#1c1917" stroke-width="1.2"/>
  
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#1c1917" font-family="Georgia, 'Times New Roman', serif">TOTP (RFC 6238) — Counter, HMAC, Dynamic Truncation &amp; Modulo</text>
  <text x="24" y="48" class="sans" font-size="12" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">Module 09 · T = ⌊now / 30⌋ → HMAC-SHA1(K, T) → 4-Byte Dynamic Offset Truncation → mod 10⁶ (6-Digit OTP)</text>

  <!-- STAGE 1: TIME-STEP COUNTER -->
  <rect x="24" y="80" width="234" height="236" rx="10" fill="#ffffff" class="s1"/>
  <rect x="38" y="94" width="66" height="22" rx="5" fill="#0f766e"/>
  <text x="71" y="109" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">STEP 1</text>
  <text x="114" y="109" class="sans" font-size="13" font-weight="700" fill="#1c1917">30s Time Step</text>

  <rect x="38" y="128" width="206" height="58" rx="6" fill="#f0fdf9" stroke="#99f6e4"/>
  <text x="141" y="148" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">now = 1795342987 s</text>
  <text x="141" y="168" class="mono" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle">T = ⌊now / 30⌋ = 59844766</text>

  <text x="38" y="208" class="sans" font-size="10.5" font-weight="600" fill="#44403c">30-Second Window Remaining:</text>
  <rect x="38" y="216" width="206" height="14" rx="7" fill="#e7e2d8"/>
  <rect x="38" y="216" width="206" height="14" rx="7" fill="#0f766e" class="timer-bar"/>

  <rect x="38" y="244" width="206" height="56" rx="6" fill="#faf8f5" stroke="#d6d0c4"/>
  <text x="141" y="264" class="mono" font-size="10" font-weight="700" fill="#1c1917" text-anchor="middle">Encode T as 8B Big-Endian</text>
  <text x="141" y="283" class="mono" font-size="10" fill="#44403c" text-anchor="middle">00 00 00 00 03 91 2C BE</text>

  <line x1="262" y1="198" x2="290" y2="198" stroke="#44403c" stroke-width="2" class="dash" marker-end="url(#arr-slate)"/>

  <!-- STAGE 2: HMAC-SHA1 -->
  <rect x="294" y="80" width="250" height="236" rx="10" fill="#ffffff" class="s2"/>
  <rect x="308" y="94" width="66" height="22" rx="5" fill="#0f766e"/>
  <text x="341" y="109" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">STEP 2</text>
  <text x="384" y="109" class="sans" font-size="13" font-weight="700" fill="#1c1917">HMAC-SHA1(K, T)</text>

  <rect x="308" y="128" width="222" height="58" rx="6" fill="#f5f1e8" stroke="#d6d0c4"/>
  <text x="419" y="148" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">Shared Secret K (Base32)</text>
  <text x="419" y="168" class="mono" font-size="10" fill="#065f46" text-anchor="middle">Digest = HMAC(K, T_bytes)</text>

  <rect x="308" y="198" width="222" height="102" rx="6" fill="#faf8f5" stroke="#d6d0c4"/>
  <text x="419" y="218" class="mono" font-size="10.5" font-weight="700" fill="#1c1917" text-anchor="middle">20-Byte Output B[0..19]</text>
  <text x="419" y="239" class="mono" font-size="10" fill="#44403c" text-anchor="middle">0..4:  1f 86 98 69 0e</text>
  <text x="419" y="256" class="mono" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">5..8:  [2e 4a 1c 73]  ← slice</text>
  <text x="419" y="273" class="mono" font-size="10" fill="#44403c" text-anchor="middle">9..18: a2 91 ... 4d 02</text>
  <text x="419" y="290" class="mono" font-size="10" font-weight="700" fill="#0f766e" text-anchor="middle">19:    0x75 (low nibble = 5)</text>

  <line x1="548" y1="198" x2="576" y2="198" stroke="#44403c" stroke-width="2" class="dash" marker-end="url(#arr-slate)"/>

  <!-- STAGE 3: DYNAMIC TRUNCATION -->
  <rect x="580" y="80" width="276" height="236" rx="10" fill="#ffffff" class="s3"/>
  <rect x="594" y="94" width="66" height="22" rx="5" fill="#b45309"/>
  <text x="627" y="109" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">STEP 3</text>
  <text x="670" y="109" class="sans" font-size="13" font-weight="700" fill="#1c1917">Dynamic Truncation</text>

  <rect x="594" y="128" width="248" height="48" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="718" y="148" class="mono" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="middle">offset = B[19] &amp; 0x0f = 5</text>
  <text x="718" y="166" class="sans" font-size="10" fill="#92400e" text-anchor="middle">Offset ∈ [0..15] picks 4-byte window</text>

  <!-- 4-byte slice visual -->
  <g class="slice-hl">
    <rect x="594" y="188" width="58" height="42" rx="5" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
    <text x="623" y="206" class="mono" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">0x2e</text>
    <text x="623" y="222" class="mono" font-size="10" fill="#b45309" text-anchor="middle">B[5] &amp; 7f</text>

    <rect x="657" y="188" width="58" height="42" rx="5" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
    <text x="686" y="206" class="mono" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">0x4a</text>
    <text x="686" y="222" class="mono" font-size="10" fill="#b45309" text-anchor="middle">B[6]</text>

    <rect x="720" y="188" width="58" height="42" rx="5" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
    <text x="749" y="206" class="mono" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">0x1c</text>
    <text x="749" y="222" class="mono" font-size="10" fill="#b45309" text-anchor="middle">B[7]</text>

    <rect x="783" y="188" width="59" height="42" rx="5" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
    <text x="812" y="206" class="mono" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">0x73</text>
    <text x="812" y="222" class="mono" font-size="10" fill="#b45309" text-anchor="middle">B[8]</text>
  </g>

  <rect x="594" y="242" width="248" height="58" rx="6" fill="#faf8f5" stroke="#d6d0c4"/>
  <text x="718" y="262" class="mono" font-size="10" font-weight="700" fill="#1c1917" text-anchor="middle">Mask MSB (&amp; 0x7fffffff)</text>
  <text x="718" y="282" class="mono" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="middle">bin_code = 0x2e4a1c73 = 776608883</text>

  <line x1="860" y1="198" x2="888" y2="198" stroke="#44403c" stroke-width="2" class="dash" marker-end="url(#arr-slate)"/>

  <!-- STAGE 4: MOD 10^6 -->
  <rect x="892" y="80" width="204" height="236" rx="10" fill="#ffffff" class="s4"/>
  <rect x="906" y="94" width="66" height="22" rx="5" fill="#0f766e"/>
  <text x="939" y="109" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">STEP 4</text>
  <text x="982" y="109" class="sans" font-size="13" font-weight="700" fill="#1c1917">mod 10⁶</text>

  <rect x="906" y="128" width="176" height="62" rx="6" fill="#f0fdf9" stroke="#99f6e4"/>
  <text x="994" y="149" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">776608883 mod 10⁶</text>
  <text x="994" y="170" class="sans" font-size="10" fill="#065f46" text-anchor="middle">Zero-pad to 6 digits</text>

  <rect x="906" y="204" width="176" height="64" rx="8" fill="#0f766e"/>
  <text x="994" y="227" class="sans" font-size="10.5" font-weight="700" fill="#f0fdf9" text-anchor="middle">6-DIGIT OTP CODE</text>
  <text x="994" y="254" class="mono" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">608883</text>

  <text x="994" y="294" class="mono" font-size="10" fill="#065f46" text-anchor="middle">Verify: T - 1, T, T + 1</text>

  <!-- BOTTOM PANEL: SECURITY PROPERTIES & COMPARISON -->
  <rect x="24" y="332" width="1072" height="156" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="42" y="358" class="sans" font-size="13.5" font-weight="700" fill="#1c1917">Production Invariants &amp; Operational Boundaries (TOTP vs WebAuthn)</text>

  <rect x="42" y="372" width="336" height="98" rx="7" fill="#f0fdf9" stroke="#99f6e4"/>
  <text x="56" y="393" class="sans" font-size="11.5" font-weight="700" fill="#065f46">1. Clock Skew &amp; Replay Prevention</text>
  <text x="56" y="413" class="sans" font-size="10" fill="#065f46">• Server checks T - 1, T, and T + 1 (±30s drift).</text>
  <text x="56" y="431" class="sans" font-size="10" fill="#065f46">• Store last accepted time-step T_used per user</text>
  <text x="56" y="447" class="sans" font-size="10" fill="#065f46">  so the same 6-digit code cannot replay in 30s.</text>

  <rect x="392" y="372" width="336" height="98" rx="7" fill="#fffbeb" stroke="#fde68a"/>
  <text x="406" y="393" class="sans" font-size="11.5" font-weight="700" fill="#92400e">2. MSB Sign-Bit Masking (0x7fffffff)</text>
  <text x="406" y="413" class="sans" font-size="10" fill="#92400e">• Prevents signed vs unsigned integer bugs</text>
  <text x="406" y="431" class="sans" font-size="10" fill="#92400e">  across Java, C, and JavaScript runtimes when</text>
  <text x="406" y="447" class="sans" font-size="10" fill="#92400e">  bit 31 of B[offset] happens to be 1.</text>

  <rect x="742" y="372" width="336" height="98" rx="7" fill="#fef2f2" stroke="#fda4af"/>
  <text x="756" y="393" class="sans" font-size="11.5" font-weight="700" fill="#991b1b">3. Phishing Posture vs WebAuthn</text>
  <text x="756" y="413" class="sans" font-size="10" fill="#7f1d1d">• TOTP has NO origin binding: Evilginx MITM</text>
  <text x="756" y="431" class="sans" font-size="10" fill="#7f1d1d">  proxies can relay codes in real time.</text>
  <text x="756" y="447" class="sans" font-size="10" fill="#7f1d1d">• Prefer FIDO2/WebAuthn Passkeys where possible.</text>

  <!-- Footer -->
  <rect x="24" y="502" width="1072" height="44" rx="8" fill="#f0fdf9" stroke="#99f6e4" stroke-width="1"/>
  <text x="42" y="529" class="sans" font-size="11.5" font-weight="600" fill="#065f46">Takeaway: TOTP derives a deterministic 6-digit code from shared secret K and 30s step T; enforce single-use T_used tracking and rate-limiting.</text>
</svg>
