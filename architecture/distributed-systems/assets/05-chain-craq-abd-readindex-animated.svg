<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" role="img" aria-labelledby="title desc">
  <title id="title">Chain Replication / CRAQ, ABD Quorum Register, and SMR ReadIndex vs. Lease Reads</title>
  <desc id="desc">Animated replication and linearizable read protocols. Top-left shows Chain Replication and CRAQ: writes propagate Head to Middle (marked DIRTY) to Tail (committed CLEAN and ACKed); CRAQ reads on Middle query Tail for committed version when DIRTY. Bottom-left shows the ABD protocol fixing R+W&gt;N non-linearizability via a mandatory two-phase read (query R quorum for max version v, then write-back (v, val) to W quorum before returning). Right panel contrasts SMR ReadIndex (leader checks heartbeat quorum before reading from RAM at applied &gt;= readIndex) with clock-bounded Leader Lease reads.</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    @keyframes ph1 { 0%, 4% { opacity: 0.86; } 10%, 96% { opacity: 1; } 100% { opacity: 0.86; } }
    @keyframes ph2 { 0%, 24% { opacity: 0.86; } 30%, 96% { opacity: 1; } 100% { opacity: 0.86; } }
    @keyframes ph3 { 0%, 49% { opacity: 0.86; } 55%, 96% { opacity: 1; } 100% { opacity: 0.86; } }
    @keyframes ph4 { 0%, 74% { opacity: 0.86; } 80%, 96% { opacity: 1; } 100% { opacity: 0.86; } }

    @keyframes s1 { 0%, 24% { opacity: 1; stroke: #b45309; stroke-width: 2.2; } 25%, 100% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1; } }
    @keyframes s2 { 0%, 24% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1; } 25%, 49% { opacity: 1; stroke: #0f766e; stroke-width: 2.2; } 50%, 100% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1; } }
    @keyframes s3 { 0%, 49% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1; } 50%, 74% { opacity: 1; stroke: #0f766e; stroke-width: 2.2; } 75%, 100% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1; } }
    @keyframes s4 { 0%, 74% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1; } 75%, 100% { opacity: 1; stroke: #0f766e; stroke-width: 2.2; } }

    .p1 { animation: ph1 16s ease-in-out infinite; }
    .p2 { animation: ph2 16s ease-in-out infinite; }
    .p3 { animation: ph3 16s ease-in-out infinite; }
    .p4 { animation: ph4 16s ease-in-out infinite; }
    .st1 { animation: s1 16s linear infinite; }
    .st2 { animation: s2 16s linear infinite; }
    .st3 { animation: s3 16s linear infinite; }
    .st4 { animation: s4 16s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .p1, .p2, .p3, .p4, .st1, .st2, .st3, .st4 { animation: none !important; opacity: 1 !important; }
    }
  </style>

  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="620" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>

  <!-- Header -->
  <line x1="24" y1="64" x2="1096" y2="64" stroke="#1c1917" stroke-width="1.2"/>
  
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#1c1917" font-family="Georgia, 'Times New Roman', serif">Chain Replication (CRAQ), ABD Register, and SMR ReadIndex / Lease</text>
  <text x="24" y="47" class="sans" font-size="12" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">Linearizable Pipelines (Head→Tail) · Quorum Two-Phase Write-Back (ABD) · Leader Heartbeat ReadIndex vs. Clock Lease</text>

  <!-- TOP-LEFT: CHAIN REPLICATION & CRAQ -->
  <rect x="24" y="76" width="540" height="222" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="42" y="100" class="sans" font-size="13.5" font-weight="700" fill="#1c1917">1. Chain Replication &amp; CRAQ (DIRTY / CLEAN Versioning)</text>

  <g class="p1">
    <rect x="42" y="122" width="104" height="58" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.8"/>
    <text x="94" y="143" class="sans" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">Head</text>
    <text x="94" y="160" class="mono" font-size="10" fill="#b45309" text-anchor="middle">v2: DIRTY</text>
    <text x="94" y="172" class="mono" font-size="10" fill="#57534e" text-anchor="middle">Write enters</text>

    <line x1="146" y1="151" x2="188" y2="151" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-blue)"/>

    <rect x="192" y="122" width="128" height="58" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
    <text x="256" y="143" class="sans" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Middle (CRAQ)</text>
    <text x="256" y="160" class="mono" font-size="10" fill="#b45309" text-anchor="middle">v1 CLEAN | v2 DIRTY</text>
    <text x="256" y="172" class="mono" font-size="10" fill="#57534e" text-anchor="middle">Queries Tail if DIRTY</text>

    <line x1="320" y1="151" x2="362" y2="151" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-blue)"/>

    <rect x="366" y="122" width="104" height="58" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.8"/>
    <text x="418" y="143" class="sans" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">Tail</text>
    <text x="418" y="160" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">v2: CLEAN</text>
    <text x="418" y="172" class="mono" font-size="10" fill="#065f46" text-anchor="middle">Commits &amp; ACKs</text>

    <rect x="484" y="130" width="66" height="42" rx="6" fill="#0f766e"/>
    <text x="517" y="149" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">ACK</text>
    <text x="517" y="162" class="mono" font-size="10" fill="#f0fdf9" text-anchor="middle">Client</text>
    <line x1="470" y1="151" x2="482" y2="151" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-emerald)"/>
  </g>

  <!-- CRAQ read query arc -->
  <path d="M 256 180 Q 337 224 416 182" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr-amber)"/>
  <text x="337" y="216" class="mono" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">CRAQ version check (no full payload)</text>

  <rect x="42" y="234" width="504" height="50" rx="6" fill="#faf8f5" stroke="#d6d0c4"/>
  <text x="56" y="254" class="sans" font-size="10.5" font-weight="700" fill="#1c1917">Tail commits v2 → back-propagates CLEAN ACKs; CLEAN reads scale O(N)</text>
  <text x="56" y="272" class="sans" font-size="10" fill="#44403c">Standard Chain routes all reads to Tail; CRAQ offloads CLEAN reads across all nodes.</text>

  <!-- BOTTOM-LEFT: ABD PROTOCOL -->
  <rect x="24" y="312" width="540" height="228" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="42" y="336" class="sans" font-size="13.5" font-weight="700" fill="#1c1917">2. ABD Two-Phase Quorum Register (Fixes R+W &gt; N Time-Travel)</text>

  <g class="p2">
    <rect x="42" y="352" width="242" height="106" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.5"/>
    <text x="56" y="374" class="mono" font-size="11" font-weight="700" fill="#065f46">Phase 1: Read Quorum R</text>
    <text x="56" y="394" class="mono" font-size="10" fill="#44403c">N1: (v=2, "X")  [New]</text>
    <text x="56" y="410" class="mono" font-size="10" fill="#44403c">N3: (v=1, "0")  [Old]</text>
    <text x="56" y="432" class="sans" font-size="10" font-weight="700" fill="#065f46">Pick highest timestamp (v=2, "X")</text>
    <text x="56" y="448" class="sans" font-size="10" fill="#44403c">Cannot return yet! N2 still has v=1.</text>

    <line x1="284" y1="405" x2="306" y2="405" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr-emerald)"/>

    <rect x="310" y="352" width="236" height="106" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.5"/>
    <text x="324" y="374" class="mono" font-size="11" font-weight="700" fill="#065f46">Phase 2: Write-Back W</text>
    <text x="324" y="394" class="mono" font-size="10" fill="#44403c">Write (v=2, "X") to N1, N2</text>
    <text x="324" y="410" class="mono" font-size="10" fill="#065f46">Wait for W=2 ACKs</text>
    <text x="324" y="432" class="sans" font-size="10" font-weight="700" fill="#065f46">NOW return "X" to client</text>
    <text x="324" y="448" class="sans" font-size="10" fill="#065f46">Next reader (R∩W≠∅) sees v≥2!</text>
  </g>

  <rect x="42" y="472" width="504" height="52" rx="6" fill="#fef2f2" stroke="#fda4af"/>
  <text x="56" y="492" class="mono" font-size="10" font-weight="700" fill="#991b1b">Without Write-Back: Reader B hitting {N2, N3} sees v=1 AFTER Reader A saw v=2!</text>
  <text x="56" y="510" class="sans" font-size="10" fill="#991b1b">ABD Read-Repair guarantees real-time monotonicity without a leader.</text>

  <!-- RIGHT PANEL: SMR READINDEX VS LEASE READS -->
  <rect x="580" y="76" width="516" height="464" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="598" y="102" class="sans" font-size="14" font-weight="700" fill="#1c1917">3. Linearizable Reads in Leader SMR</text>
  <text x="598" y="120" class="mono" font-size="10.5" fill="#44403c">Avoids disk-heavy WAL log writes while preventing stale deposed-leader reads</text>

  <!-- ReadIndex Box -->
  <g class="p3">
    <rect x="598" y="138" width="480" height="196" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.6"/>
    <text x="614" y="162" class="sans" font-size="13" font-weight="700" fill="#065f46">A. ReadIndex Protocol (Clock-Free, Raft / etcd / TiKV)</text>

    <rect x="614" y="176" width="136" height="58" rx="6" fill="#ffffff" stroke="#0f766e"/>
    <text x="682" y="198" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">1. Snapshot Index</text>
    <text x="682" y="216" class="mono" font-size="10" fill="#44403c" text-anchor="middle">readIdx = commitIdx</text>

    <line x1="750" y1="205" x2="774" y2="205" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-emerald)"/>

    <rect x="778" y="176" width="144" height="58" rx="6" fill="#ffffff" stroke="#0f766e"/>
    <text x="850" y="198" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">2. Heartbeat Quorum</text>
    <text x="850" y="216" class="mono" font-size="10" fill="#44403c" text-anchor="middle">Prove still Leader</text>

    <line x1="922" y1="205" x2="946" y2="205" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-emerald)"/>

    <rect x="950" y="176" width="114" height="58" rx="6" fill="#0f766e"/>
    <text x="1007" y="198" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">3. Serve RAM</text>
    <text x="1007" y="216" class="mono" font-size="10" fill="#f0fdf9" text-anchor="middle">applied ≥ readIdx</text>

    <text x="614" y="260" class="sans" font-size="10.5" fill="#065f46">· Zero disk fsync for reads; immune to clock skew or GC pauses.</text>
    <text x="614" y="280" class="sans" font-size="10.5" fill="#065f46">· Follower Reads: follower fetches readIdx from leader, waits local apply.</text>
    <text x="614" y="300" class="mono" font-size="10" font-weight="700" fill="#065f46">Cost: 1 light heartbeat RTT (batchable across concurrent reads)</text>
  </g>

  <!-- Lease Read Box -->
  <g class="p4">
    <rect x="598" y="348" width="480" height="176" rx="8" fill="#f5f1e8" stroke="#0f766e" stroke-width="1.6"/>
    <text x="614" y="372" class="sans" font-size="13" font-weight="700" fill="#065f46">B. Leader Lease Reads (0-RTT, Bounded Clock Assumption)</text>

    <rect x="614" y="388" width="212" height="54" rx="6" fill="#ffffff" stroke="#0f766e"/>
    <text x="720" y="408" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">Followers grant lease τ</text>
    <text x="720" y="426" class="mono" font-size="10" fill="#44403c" text-anchor="middle">No elections until t &gt; τ</text>

    <line x1="826" y1="415" x2="854" y2="415" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-blue)"/>

    <rect x="858" y="388" width="206" height="54" rx="6" fill="#f0fdf9" stroke="#0f766e"/>
    <text x="961" y="408" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">if now &lt; leaseExpiry:</text>
    <text x="961" y="426" class="mono" font-size="10" fill="#065f46" text-anchor="middle">Serve RAM in 0 RTT!</text>

    <rect x="614" y="454" width="450" height="54" rx="6" fill="#fffbeb" stroke="#b45309"/>
    <text x="628" y="475" class="mono" font-size="10" font-weight="700" fill="#92400e">Hazard: Unbounded NTP clock jump or VM pause can cause split-brain reads!</text>
    <text x="628" y="494" class="sans" font-size="10" fill="#b45309">Safe only when physical clock drift bound ε is enforced (e.g. Spanner / hardware clocks).</text>
  </g>

  <!-- FOOTER STEP BAR -->
  <rect x="24" y="554" width="256" height="48" rx="8" fill="#fffbeb" class="st1"/>
  <text x="38" y="574" class="mono" font-size="10.5" font-weight="700" fill="#92400e">1. Chain &amp; CRAQ</text>
  <text x="38" y="591" class="sans" font-size="10" fill="#44403c">Head→Tail commits; DIRTY checks Tail</text>

  <rect x="296" y="554" width="256" height="48" rx="8" fill="#f0fdf9" class="st2"/>
  <text x="310" y="574" class="mono" font-size="10.5" font-weight="700" fill="#065f46">2. ABD Two-Phase Read</text>
  <text x="310" y="591" class="sans" font-size="10" fill="#44403c">Read R max v, then Write-Back to W</text>

  <rect x="568" y="554" width="256" height="48" rx="8" fill="#f0fdf9" class="st3"/>
  <text x="582" y="574" class="mono" font-size="10.5" font-weight="700" fill="#065f46">3. SMR ReadIndex</text>
  <text x="582" y="591" class="sans" font-size="10" fill="#44403c">Quorum heartbeat verifies leadership</text>

  <rect x="840" y="554" width="256" height="48" rx="8" fill="#f5f1e8" class="st4"/>
  <text x="854" y="574" class="mono" font-size="10.5" font-weight="700" fill="#065f46">4. Leader Lease Read</text>
  <text x="854" y="591" class="sans" font-size="10" fill="#44403c">0-RTT RAM read if clock &lt; leaseExpiry</text>
</svg>
