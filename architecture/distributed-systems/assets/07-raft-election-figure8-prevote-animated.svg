<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" role="img" aria-labelledby="title desc">
  <title id="title">Raft Leader Election, Figure 8 Indirect Commit Rule, and Pre-Vote / Check-Quorum</title>
  <desc id="desc">Animated Raft safety and partition-resilience mechanics. Top-left shows RequestVote up-to-date log check (lastLogTerm, lastLogIndex) and AppendEntries prevLogIndex/prevLogTerm Log Matching plus fsync mandate for currentTerm, votedFor, and log[]. Bottom-left shows Pre-Vote blocking partitioned followers from inflating terms and Check-Quorum stepping down isolated leaders. Right panel animates Raft Figure 8 across nodes S1..S5: in Term 4, S1 replicates a Term 2 entry to S3 (majority S1,S2,S3) but cannot commit it directly because S5 could win Term 5 via S2,S3,S4 and overwrite it; only committing a current Term 4 entry indirectly commits the Term 2 entry safely.</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    @keyframes ph1 { 0%, 4% { opacity: 0.86; } 10%, 96% { opacity: 1; } 100% { opacity: 0.86; } }
    @keyframes ph2 { 0%, 24% { opacity: 0.86; } 30%, 96% { opacity: 1; } 100% { opacity: 0.86; } }
    @keyframes ph3 { 0%, 49% { opacity: 0.86; } 55%, 96% { opacity: 1; } 100% { opacity: 0.86; } }
    @keyframes ph4 { 0%, 74% { opacity: 0.86; } 80%, 96% { opacity: 1; } 100% { opacity: 0.86; } }

    @keyframes s1 { 0%, 24% { opacity: 1; stroke: #2563eb; stroke-width: 2.2; } 25%, 100% { opacity: 0.86; stroke: #cbd5e1; stroke-width: 1; } }
    @keyframes s2 { 0%, 24% { opacity: 0.86; stroke: #cbd5e1; stroke-width: 1; } 25%, 49% { opacity: 1; stroke: #e11d48; stroke-width: 2.2; } 50%, 100% { opacity: 0.86; stroke: #cbd5e1; stroke-width: 1; } }
    @keyframes s3 { 0%, 49% { opacity: 0.86; stroke: #cbd5e1; stroke-width: 1; } 50%, 74% { opacity: 1; stroke: #059669; stroke-width: 2.2; } 75%, 100% { opacity: 0.86; stroke: #cbd5e1; stroke-width: 1; } }
    @keyframes s4 { 0%, 74% { opacity: 0.86; stroke: #cbd5e1; stroke-width: 1; } 75%, 100% { opacity: 1; stroke: #7c3aed; stroke-width: 2.2; } }

    .p1 { animation: ph1 16s ease-in-out infinite; }
    .p2 { animation: ph2 16s ease-in-out infinite; }
    .p3 { animation: ph3 16s ease-in-out infinite; }
    .p4 { animation: ph4 16s ease-in-out infinite; }
    .st1 { animation: s1 16s linear infinite; }
    .st2 { animation: s2 16s linear infinite; }
    .st3 { animation: s3 16s linear infinite; }
    .st4 { animation: s4 16s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .p1, .p2, .p3, .p4, .st1, .st2, .st3, .st4 { animation: none !important; opacity: 1 !important; }
    }
  </style>

  <rect x="0" y="0" width="1120" height="620" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="1120" height="62" rx="12" fill="#0f172a"/>
  <rect x="0" y="46" width="1120" height="16" fill="#0f172a"/>
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#f8fafc">Raft: Leader Election, Figure 8 Commit Rule, &amp; Pre-Vote</text>
  <text x="24" y="47" class="sans" font-size="12" fill="#94a3b8">RequestVote Log Completeness · AppendEntries Log Matching · Current-Term Indirect Commit · Pre-Vote &amp; Check-Quorum</text>

  <!-- TOP-LEFT: RPCS & LOG MATCHING -->
  <rect x="24" y="76" width="510" height="236" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="42" y="100" class="sans" font-size="13.5" font-weight="700" fill="#0f172a">1. Election &amp; Replication RPCs (fsync Mandate)</text>

  <g class="p1">
    <rect x="42" y="114" width="474" height="82" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="56" y="134" class="mono" font-size="11" font-weight="700" fill="#1e3a8a">RequestVote(term, candidateId, lastLogIdx, lastLogTerm)</text>
    <text x="56" y="154" class="mono" font-size="10" fill="#334155">Grant iff: (votedFor == null || candidateId) &amp;&amp;</text>
    <text x="56" y="170" class="mono" font-size="10" font-weight="700" fill="#1e40af">(lastLogTerm &gt; myTerm) || (== &amp;&amp; lastLogIdx &gt;= myIdx)</text>
    <text x="56" y="186" class="sans" font-size="10" fill="#475569">fsync(currentTerm, votedFor, log[]) before replying prevents double-vote.</text>

    <rect x="42" y="206" width="474" height="90" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="56" y="226" class="mono" font-size="11" font-weight="700" fill="#5b21b6">AppendEntries(term, prevLogIdx, prevLogTerm, entries[], commit)</text>
    <text x="56" y="246" class="sans" font-size="10.5" fill="#334155">Log Matching: If two logs agree on (index, term), they are identical</text>
    <text x="56" y="263" class="sans" font-size="10.5" fill="#334155">for all indices 1..index. Mismatching followers decrement nextIndex.</text>
    <text x="56" y="282" class="mono" font-size="10" font-weight="700" fill="#5b21b6">Randomized election timeout (150–300ms) avoids split votes.</text>
  </g>

  <!-- BOTTOM-LEFT: PRE-VOTE & CHECK-QUORUM -->
  <rect x="24" y="326" width="510" height="214" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="42" y="350" class="sans" font-size="13.5" font-weight="700" fill="#0f172a">2. Partition Guards: Pre-Vote &amp; Check-Quorum</text>

  <g class="p4">
    <rect x="42" y="366" width="474" height="76" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="56" y="388" class="mono" font-size="11" font-weight="700" fill="#92400e">Pre-Vote (Stops Partitioned Node Term Inflation)</text>
    <text x="56" y="408" class="sans" font-size="10.5" fill="#334155">Isolated follower probes peers WITHOUT incrementing currentTerm.</text>
    <text x="56" y="426" class="sans" font-size="10" fill="#b45309">Healthy peers receiving leader heartbeats reject Pre-Vote → no disruption!</text>

    <rect x="42" y="452" width="474" height="72" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="56" y="474" class="mono" font-size="11" font-weight="700" fill="#065f46">Check-Quorum (Deposes Partitioned Leader)</text>
    <text x="56" y="494" class="sans" font-size="10.5" fill="#334155">Leader checks heartbeat ACKs from majority each election window.</text>
    <text x="56" y="512" class="sans" font-size="10" fill="#047857">If quorum lost, leader voluntarily steps down to Follower.</text>
  </g>

  <!-- RIGHT PANEL: FIGURE 8 COMMIT RULE -->
  <rect x="550" y="76" width="546" height="464" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="568" y="102" class="sans" font-size="14" font-weight="700" fill="#0f172a">3. The Figure 8 Indirect Commit Rule (S1..S5)</text>
  <text x="568" y="120" class="mono" font-size="10.5" fill="#e11d48">NEVER commit an earlier-term entry merely by majority replica count!</text>

  <!-- Step (b): Danger state -->
  <g class="p2">
    <rect x="568" y="134" width="510" height="196" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.6"/>
    <text x="582" y="156" class="mono" font-size="11" font-weight="700" fill="#9f1239">UNSAFE if S1 commits Term-2 entry in Term 4 (Majority S1,S2,S3)</text>

    <!-- 5 server rows: S1..S5 -->
    <text x="584" y="184" class="mono" font-size="10.5" font-weight="700" fill="#0f172a">S1 (L, t=4):</text>
    <rect x="676" y="168" width="44" height="22" rx="4" fill="#e2e8f0" stroke="#64748b"/><text x="698" y="183" class="mono" font-size="10" text-anchor="middle">1</text>
    <rect x="724" y="168" width="44" height="22" rx="4" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/><text x="746" y="183" class="mono" font-size="10" font-weight="700" text-anchor="middle">2</text>

    <text x="584" y="212" class="mono" font-size="10.5" fill="#334155">S2:</text>
    <rect x="676" y="196" width="44" height="22" rx="4" fill="#e2e8f0" stroke="#64748b"/><text x="698" y="211" class="mono" font-size="10" text-anchor="middle">1</text>
    <rect x="724" y="196" width="44" height="22" rx="4" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/><text x="746" y="211" class="mono" font-size="10" font-weight="700" text-anchor="middle">2</text>

    <text x="584" y="240" class="mono" font-size="10.5" fill="#334155">S3:</text>
    <rect x="676" y="224" width="44" height="22" rx="4" fill="#e2e8f0" stroke="#64748b"/><text x="698" y="239" class="mono" font-size="10" text-anchor="middle">1</text>
    <rect x="724" y="224" width="44" height="22" rx="4" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/><text x="746" y="239" class="mono" font-size="10" font-weight="700" text-anchor="middle">2</text>

    <text x="584" y="268" class="mono" font-size="10.5" fill="#334155">S4:</text>
    <rect x="676" y="252" width="44" height="22" rx="4" fill="#e2e8f0" stroke="#64748b"/><text x="698" y="267" class="mono" font-size="10" text-anchor="middle">1</text>

    <text x="584" y="296" class="mono" font-size="10.5" font-weight="700" fill="#9f1239">S5 (t=5!):</text>
    <rect x="676" y="280" width="44" height="22" rx="4" fill="#e2e8f0" stroke="#64748b"/><text x="698" y="295" class="mono" font-size="10" text-anchor="middle">1</text>
    <rect x="724" y="280" width="44" height="22" rx="4" fill="#fecdd3" stroke="#e11d48" stroke-width="1.8"/><text x="746" y="295" class="mono" font-size="10" font-weight="700" fill="#9f1239" text-anchor="middle">3</text>

    <rect x="786" y="170" width="278" height="130" rx="6" fill="#ffffff" stroke="#fda4af"/>
    <text x="800" y="192" class="sans" font-size="11" font-weight="700" fill="#9f1239">Why Overwrite Happens:</text>
    <text x="800" y="212" class="sans" font-size="10" fill="#334155">1. S1 replicates Term 2 to S3 (3/5).</text>
    <text x="800" y="230" class="sans" font-size="10" fill="#334155">2. S1 crashes before committing Term 4.</text>
    <text x="800" y="248" class="sans" font-size="10" fill="#334155">3. S5 has lastLogTerm=3 &gt; 2!</text>
    <text x="800" y="266" class="sans" font-size="10" fill="#be123c">4. S5 gets votes from S2,S3,S4 in Term 5</text>
    <text x="800" y="284" class="sans" font-size="10" font-weight="700" fill="#9f1239">   and OVERWRITES Term 2 with Term 3!</text>
  </g>

  <!-- Step (c): Safe rule -->
  <g class="p3">
    <rect x="568" y="344" width="510" height="182" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
    <text x="582" y="366" class="mono" font-size="11" font-weight="700" fill="#065f46">SAFE: S1 Replicates &amp; Commits Current-Term Entry (Term 4)</text>

    <text x="584" y="396" class="mono" font-size="10.5" font-weight="700" fill="#065f46">S1 (L, t=4):</text>
    <rect x="676" y="380" width="42" height="22" rx="4" fill="#e2e8f0" stroke="#64748b"/><text x="697" y="395" class="mono" font-size="10" text-anchor="middle">1</text>
    <rect x="722" y="380" width="42" height="22" rx="4" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/><text x="743" y="395" class="mono" font-size="10" font-weight="700" text-anchor="middle">2</text>
    <rect x="768" y="380" width="42" height="22" rx="4" fill="#059669"/><text x="789" y="395" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>

    <text x="584" y="424" class="mono" font-size="10.5" fill="#334155">S2:</text>
    <rect x="676" y="408" width="42" height="22" rx="4" fill="#e2e8f0" stroke="#64748b"/><text x="697" y="423" class="mono" font-size="10" text-anchor="middle">1</text>
    <rect x="722" y="408" width="42" height="22" rx="4" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/><text x="743" y="423" class="mono" font-size="10" font-weight="700" text-anchor="middle">2</text>
    <rect x="768" y="408" width="42" height="22" rx="4" fill="#059669"/><text x="789" y="423" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>

    <text x="584" y="452" class="mono" font-size="10.5" fill="#334155">S3:</text>
    <rect x="676" y="436" width="42" height="22" rx="4" fill="#e2e8f0" stroke="#64748b"/><text x="697" y="451" class="mono" font-size="10" text-anchor="middle">1</text>
    <rect x="722" y="436" width="42" height="22" rx="4" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/><text x="743" y="451" class="mono" font-size="10" font-weight="700" text-anchor="middle">2</text>
    <rect x="768" y="436" width="42" height="22" rx="4" fill="#059669"/><text x="789" y="451" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>

    <rect x="824" y="380" width="240" height="82" rx="6" fill="#ffffff" stroke="#059669"/>
    <text x="836" y="400" class="sans" font-size="10.5" font-weight="700" fill="#065f46">Leader Completeness Holds:</text>
    <text x="836" y="418" class="sans" font-size="10" fill="#334155">Term 4 &gt; Term 3 ⇒ S5 CANNOT</text>
    <text x="836" y="434" class="sans" font-size="10" fill="#334155">win votes from {S1, S2, S3}.</text>
    <text x="836" y="450" class="sans" font-size="10" font-weight="700" fill="#047857">Term 2 is indirectly committed!</text>

    <text x="582" y="492" class="mono" font-size="10.5" font-weight="700" fill="#065f46">Commit Rule: matchIndex[maj] &gt;= N  AND  log[N].term == currentTerm</text>
    <text x="582" y="510" class="sans" font-size="10" fill="#047857">New leaders append a no-op entry in currentTerm to flush prior uncommitted entries.</text>
  </g>

  <!-- FOOTER STEP BAR -->
  <rect x="24" y="554" width="256" height="48" rx="8" fill="#eff6ff" class="st1"/>
  <text x="38" y="574" class="mono" font-size="10.5" font-weight="700" fill="#1e3a8a">1. RequestVote &amp; fsync</text>
  <text x="38" y="591" class="sans" font-size="10" fill="#334155">Up-to-date log check + durable vote</text>

  <rect x="296" y="554" width="256" height="48" rx="8" fill="#fff1f2" class="st2"/>
  <text x="310" y="574" class="mono" font-size="10.5" font-weight="700" fill="#9f1239">2. Figure 8 Danger</text>
  <text x="310" y="591" class="sans" font-size="10" fill="#334155">S5 (term 3) can overwrite Term 2</text>

  <rect x="568" y="554" width="256" height="48" rx="8" fill="#ecfdf5" class="st3"/>
  <text x="582" y="574" class="mono" font-size="10.5" font-weight="700" fill="#065f46">3. Current-Term Commit</text>
  <text x="582" y="591" class="sans" font-size="10" fill="#334155">Committing Term 4 locks Term 2 safely</text>

  <rect x="840" y="554" width="256" height="48" rx="8" fill="#f5f3ff" class="st4"/>
  <text x="854" y="574" class="mono" font-size="10.5" font-weight="700" fill="#5b21b6">4. Pre-Vote &amp; CheckQuorum</text>
  <text x="854" y="591" class="sans" font-size="10" fill="#334155">Isolates partitioned nodes cleanly</text>
</svg>
