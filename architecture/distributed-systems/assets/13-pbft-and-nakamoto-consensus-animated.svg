<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" role="img" aria-labelledby="title desc">
  <title id="title">PBFT (3f+1 Quorum Phases) and Nakamoto Proof-of-Work Consensus</title>
  <desc id="desc">Animated comparison of permissioned Byzantine Fault Tolerance (PBFT) and permissionless Nakamoto consensus. Left panel animates PBFT with N equals 3f+1 equals 4 nodes (Primary P, Backups B1, B2, and Traitor B3): Client sends Request(op) to P; Phase 1 Pre-Prepare broadcasts (view, seq, digest); Phase 2 all-to-all Prepare collects 2f matching Prepares; Phase 3 all-to-all Commit collects 2f+1 matching Commits before executing and returning f+1 identical replies to the client. Right panel animates Nakamoto Proof-of-Work longest/heaviest chain convergence resolving a transient fork (Work 100 on 3A vs Work 350 on 3B-&gt;4) and Sybil resistance via 1 CPU cycle, 1 vote.</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    @keyframes ph1 { 0%, 4% { opacity: 0.86; } 10%, 96% { opacity: 1; } 100% { opacity: 0.86; } }
    @keyframes ph2 { 0%, 24% { opacity: 0.86; } 30%, 96% { opacity: 1; } 100% { opacity: 0.86; } }
    @keyframes ph3 { 0%, 49% { opacity: 0.86; } 55%, 96% { opacity: 1; } 100% { opacity: 0.86; } }
    @keyframes ph4 { 0%, 74% { opacity: 0.86; } 80%, 96% { opacity: 1; } 100% { opacity: 0.86; } }

    @keyframes s1 { 0%, 24% { opacity: 1; stroke: #2563eb; stroke-width: 2.2; } 25%, 100% { opacity: 0.86; stroke: #cbd5e1; stroke-width: 1; } }
    @keyframes s2 { 0%, 24% { opacity: 0.86; stroke: #cbd5e1; stroke-width: 1; } 25%, 49% { opacity: 1; stroke: #7c3aed; stroke-width: 2.2; } 50%, 100% { opacity: 0.86; stroke: #cbd5e1; stroke-width: 1; } }
    @keyframes s3 { 0%, 49% { opacity: 0.86; stroke: #cbd5e1; stroke-width: 1; } 50%, 74% { opacity: 1; stroke: #059669; stroke-width: 2.2; } 75%, 100% { opacity: 0.86; stroke: #cbd5e1; stroke-width: 1; } }
    @keyframes s4 { 0%, 74% { opacity: 0.86; stroke: #cbd5e1; stroke-width: 1; } 75%, 100% { opacity: 1; stroke: #d97706; stroke-width: 2.2; } }

    .p1 { animation: ph1 16s ease-in-out infinite; }
    .p2 { animation: ph2 16s ease-in-out infinite; }
    .p3 { animation: ph3 16s ease-in-out infinite; }
    .p4 { animation: ph4 16s ease-in-out infinite; }
    .st1 { animation: s1 16s linear infinite; }
    .st2 { animation: s2 16s linear infinite; }
    .st3 { animation: s3 16s linear infinite; }
    .st4 { animation: s4 16s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .p1, .p2, .p3, .p4, .st1, .st2, .st3, .st4 { animation: none !important; opacity: 1 !important; }
    }
  </style>

  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="620" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="1120" height="62" rx="12" fill="#0f172a"/>
  <rect x="0" y="46" width="1120" height="16" fill="#0f172a"/>
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#f8fafc">Byzantine Fault Tolerance: PBFT (3f+1) vs. Nakamoto PoW</text>
  <text x="24" y="47" class="sans" font-size="12" fill="#94a3b8">Permissioned Quorum (Pre-Prepare → 2f Prepare → 2f+1 Commit) · Permissionless Sybil Resistance (Heaviest PoW Chain)</text>

  <!-- LEFT PANEL: PBFT -->
  <rect x="24" y="76" width="546" height="464" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="42" y="102" class="sans" font-size="14" font-weight="700" fill="#0f172a">1. PBFT Protocol (N = 3f + 1 = 4, f = 1 Traitor B3)</text>
  <text x="42" y="120" class="mono" font-size="10.5" fill="#475569">Honest outvote traitors: (N − 2f) &gt; f ⇒ N ≥ 3f + 1 · O(N²) msgs</text>

  <!-- Participants -->
  <rect x="40" y="134" width="66" height="28" rx="5" fill="#f8fafc" stroke="#475569"/>
  <text x="73" y="152" class="mono" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">Client</text>

  <rect x="130" y="134" width="84" height="28" rx="5" fill="#eff6ff" stroke="#2563eb"/>
  <text x="172" y="152" class="mono" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">Primary P</text>

  <rect x="238" y="134" width="84" height="28" rx="5" fill="#ecfdf5" stroke="#059669"/>
  <text x="280" y="152" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">Backup B1</text>

  <rect x="346" y="134" width="84" height="28" rx="5" fill="#ecfdf5" stroke="#059669"/>
  <text x="388" y="152" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">Backup B2</text>

  <rect x="454" y="134" width="98" height="28" rx="5" fill="#fff1f2" stroke="#e11d48"/>
  <text x="503" y="152" class="mono" font-size="10" font-weight="700" fill="#9f1239" text-anchor="middle">B3 (Traitor)</text>

  <!-- Lifelines -->
  <line x1="73" y1="162" x2="73" y2="480" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="172" y1="162" x2="172" y2="480" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="280" y1="162" x2="280" y2="480" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="388" y1="162" x2="388" y2="480" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="503" y1="162" x2="503" y2="480" stroke="#fecdd3" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Phase 1: Request & Pre-Prepare -->
  <g class="p1">
    <line x1="73" y1="186" x2="170" y2="186" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
    <text x="122" y="180" class="mono" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">Request(op)</text>

    <line x1="172" y1="210" x2="278" y2="210" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
    <line x1="172" y1="224" x2="386" y2="224" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
    <line x1="172" y1="238" x2="501" y2="238" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-blue)"/>
    <rect x="200" y="194" width="168" height="18" rx="4" fill="#eff6ff" stroke="#2563eb"/>
    <text x="284" y="207" class="mono" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">1. Pre-Prepare(v, seq, d)</text>
  </g>

  <!-- Phase 2: All-to-All Prepare (2f) -->
  <g class="p2">
    <rect x="126" y="256" width="320" height="58" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="286" y="274" class="mono" font-size="10" font-weight="700" fill="#5b21b6" text-anchor="middle">2. All-to-All Prepare Broadcast</text>
    <line x1="280" y1="286" x2="176" y2="286" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arr-violet)"/>
    <line x1="280" y1="286" x2="384" y2="286" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arr-violet)"/>
    <text x="286" y="304" class="mono" font-size="10" font-weight="700" fill="#4c1d95" text-anchor="middle">Collect ≥ 2f (=2) Prepares → PREPARED</text>
  </g>

  <!-- Phase 3: All-to-All Commit (2f+1) -->
  <g class="p3">
    <rect x="126" y="330" width="320" height="58" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="286" y="348" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">3. All-to-All Commit Broadcast</text>
    <line x1="174" y1="360" x2="384" y2="360" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-emerald)"/>
    <text x="286" y="378" class="mono" font-size="10" font-weight="700" fill="#047857" text-anchor="middle">Collect ≥ 2f+1 (=3) Commits → EXECUTE</text>

    <!-- Reply f+1 -->
    <line x1="280" y1="414" x2="75" y2="414" stroke="#059669" stroke-width="2" marker-end="url(#arr-emerald)"/>
    <line x1="388" y1="432" x2="75" y2="432" stroke="#059669" stroke-width="2" marker-end="url(#arr-emerald)"/>
    <rect x="96" y="400" width="166" height="20" rx="4" fill="#ecfdf5" stroke="#059669"/>
    <text x="179" y="414" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">Reply ≥ f+1 (=2) match</text>
  </g>

  <rect x="42" y="476" width="510" height="48" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="497" class="mono" font-size="10" font-weight="700" fill="#0f172a">Instant Deterministic Finality (Needs Known PKI Identity Set)</text>
  <text x="56" y="514" class="sans" font-size="10" fill="#475569">Vulnerable to Sybil attacks in open networks unless identities are scarce.</text>

  <!-- RIGHT PANEL: NAKAMOTO CONSENSUS -->
  <rect x="586" y="76" width="510" height="464" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="604" y="102" class="sans" font-size="14" font-weight="700" fill="#0f172a">2. Nakamoto Consensus (PoW &amp; Heaviest Chain)</text>
  <text x="604" y="120" class="mono" font-size="10.5" fill="#475569">SHA256(SHA256(header)) &lt; Target · 1 CPU cycle = 1 vote (Anti-Sybil)</text>

  <!-- Blockchain Fork DAG -->
  <g class="p4">
    <rect x="604" y="142" width="84" height="50" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="646" y="164" class="mono" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">Genesis</text>
    <text x="646" y="180" class="mono" font-size="10" fill="#64748b" text-anchor="middle">B0</text>

    <line x1="688" y1="167" x2="712" y2="167" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>

    <rect x="716" y="142" width="84" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="758" y="164" class="mono" font-size="10.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">Block 1</text>
    <text x="758" y="180" class="mono" font-size="10" fill="#1e40af" text-anchor="middle">Work: 50</text>

    <line x1="800" y1="167" x2="824" y2="167" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>

    <rect x="828" y="142" width="84" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="870" y="164" class="mono" font-size="10.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">Block 2</text>
    <text x="870" y="180" class="mono" font-size="10" fill="#1e40af" text-anchor="middle">Work: 100</text>

    <!-- Fork A (Orphaned) -->
    <line x1="870" y1="192" x2="820" y2="232" stroke="#e11d48" stroke-width="1.8" stroke-dasharray="4 3"/>
    <rect x="648" y="232" width="186" height="52" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
    <text x="741" y="254" class="mono" font-size="10.5" font-weight="700" fill="#9f1239" text-anchor="middle">Block 3A (Orphan Fork A)</text>
    <text x="741" y="271" class="mono" font-size="10" fill="#be123c" text-anchor="middle">Cumulative Work = 100</text>

    <!-- Fork B (Canonical Winner) -->
    <line x1="894" y1="192" x2="940" y2="232" stroke="#059669" stroke-width="2.2" marker-end="url(#arr-emerald)"/>
    <rect x="854" y="232" width="222" height="52" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="965" y="254" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">Block 3B (Fork B Winner)</text>
    <text x="965" y="271" class="mono" font-size="10" fill="#047857" text-anchor="middle">Cumulative Work = 250</text>

    <line x1="965" y1="284" x2="965" y2="310" stroke="#059669" stroke-width="2.2" marker-end="url(#arr-emerald)"/>

    <rect x="854" y="314" width="222" height="52" rx="6" fill="#059669"/>
    <text x="965" y="336" class="mono" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Block 4 (Canonical Tip)</text>
    <text x="965" y="353" class="mono" font-size="10" fill="#ecfdf5" text-anchor="middle">Work = 350 &gt; 100 ✓</text>
  </g>

  <rect x="604" y="384" width="472" height="140" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="620" y="408" class="sans" font-size="12" font-weight="700" fill="#92400e">Probabilistic Finality &amp; CFT vs. BFT Comparison:</text>
  <text x="620" y="430" class="sans" font-size="10.5" fill="#334155">· Honest nodes always mine on the branch with max cumulative PoW.</text>
  <text x="620" y="448" class="sans" font-size="10.5" fill="#334155">· Reorg probability drops exponentially with confirmations z (z = 6).</text>
  <text x="620" y="472" class="mono" font-size="10" font-weight="700" fill="#5b21b6">CFT (2f+1, O(N)) vs PBFT (3f+1, O(N²)) vs Nakamoto (Open PoW)</text>
  <text x="620" y="492" class="sans" font-size="10" fill="#475569">SUNDR Fork Consistency: untrusted server can fork views, never reconcile.</text>

  <!-- FOOTER STEP BAR -->
  <rect x="24" y="554" width="256" height="48" rx="8" fill="#eff6ff" class="st1"/>
  <text x="38" y="574" class="mono" font-size="10.5" font-weight="700" fill="#1e3a8a">1. PBFT Pre-Prepare</text>
  <text x="38" y="591" class="sans" font-size="10" fill="#334155">Primary assigns (view, seq, digest)</text>

  <rect x="296" y="554" width="256" height="48" rx="8" fill="#f5f3ff" class="st2"/>
  <text x="310" y="574" class="mono" font-size="10.5" font-weight="700" fill="#5b21b6">2. PBFT Prepare (2f)</text>
  <text x="310" y="591" class="sans" font-size="10" fill="#334155">All-to-all locks order within view</text>

  <rect x="568" y="554" width="256" height="48" rx="8" fill="#ecfdf5" class="st3"/>
  <text x="582" y="574" class="mono" font-size="10.5" font-weight="700" fill="#065f46">3. PBFT Commit (2f+1)</text>
  <text x="582" y="591" class="sans" font-size="10" fill="#334155">Executes &amp; sends f+1 client replies</text>

  <rect x="840" y="554" width="256" height="48" rx="8" fill="#fffbeb" class="st4"/>
  <text x="854" y="574" class="mono" font-size="10.5" font-weight="700" fill="#92400e">4. Nakamoto Heaviest Chain</text>
  <text x="854" y="591" class="sans" font-size="10" fill="#334155">PoW Fork B (350) beats Fork A (100)</text>
</svg>
