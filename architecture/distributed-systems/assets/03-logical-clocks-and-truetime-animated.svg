<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" role="img" aria-labelledby="title desc">
  <title id="title">Logical Clocks (Lamport, Vector, HLC) and Spanner TrueTime Commit-Wait</title>
  <desc id="desc">Animated timeline comparing four distributed ordering mechanisms. Top-left compares Lamport scalar clock L against Vector Clocks V across P1, P2, P3: message m1 establishes a happens-before b (V(a)=[1,0,0] &lt; V(b)=[1,1,0]) while c on P3 has V(c)=[0,0,1], proving a concurrent with c despite L(a)=1 equals L(c)=1. Bottom-left shows Hybrid Logical Clock (l, c) incrementing c within the same physical millisecond pt and tracking bounded drift. Right panel animates Spanner TrueTime interval [earliest, latest] of width 2 epsilon: T1 picks commit timestamp s1 equals latest and executes Commit-Wait until TT.now().earliest exceeds s1, guaranteeing T2 starts with s2 strictly greater than s1.</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    @keyframes causal-pop { 0%, 4% { opacity: 0.86; } 10%, 96% { opacity: 1; } 100% { opacity: 0.86; } }
    @keyframes conc-pop   { 0%, 24% { opacity: 0.86; } 30%, 96% { opacity: 1; } 100% { opacity: 0.86; } }
    @keyframes hlc-pop    { 0%, 49% { opacity: 0.86; } 55%, 96% { opacity: 1; } 100% { opacity: 0.86; } }
    @keyframes tt-slide   { 0%, 50% { transform: translateX(0px); } 75%, 96% { transform: translateX(170px); } 100% { transform: translateX(0px); } }
    @keyframes t2-pop     { 0%, 74% { opacity: 0.86; } 80%, 96% { opacity: 1; } 100% { opacity: 0.86; } }

    @keyframes s1 { 0%, 24% { opacity: 1; stroke: #0f766e; stroke-width: 2.2; } 25%, 100% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1; } }
    @keyframes s2 { 0%, 24% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1; } 25%, 49% { opacity: 1; stroke: #dc2626; stroke-width: 2.2; } 50%, 100% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1; } }
    @keyframes s3 { 0%, 49% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1; } 50%, 74% { opacity: 1; stroke: #0f766e; stroke-width: 2.2; } 75%, 100% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1; } }
    @keyframes s4 { 0%, 74% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1; } 75%, 100% { opacity: 1; stroke: #0f766e; stroke-width: 2.2; } }

    .c-pop  { animation: causal-pop 16s ease-in-out infinite; }
    .co-pop { animation: conc-pop 16s ease-in-out infinite; }
    .hl-pop { animation: hlc-pop 16s ease-in-out infinite; }
    .tt-box { animation: tt-slide 16s ease-in-out infinite; }
    .t2-box { animation: t2-pop 16s ease-in-out infinite; }
    .st1 { animation: s1 16s linear infinite; }
    .st2 { animation: s2 16s linear infinite; }
    .st3 { animation: s3 16s linear infinite; }
    .st4 { animation: s4 16s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .c-pop, .co-pop, .hl-pop, .tt-box, .t2-box, .st1, .st2, .st3, .st4 { animation: none !important; }
      .c-pop, .co-pop, .hl-pop, .t2-box, .st1, .st2, .st3, .st4 { opacity: 1 !important; }
      .tt-box { transform: translateX(170px) !important; }
    }
  </style>

  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="620" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>

  <!-- Header -->
  <line x1="24" y1="64" x2="1096" y2="64" stroke="#1c1917" stroke-width="1.2"/>
  
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#1c1917" font-family="Georgia, 'Times New Roman', serif">Logical Clocks (Lamport, Vector, HLC) &amp; Spanner TrueTime</text>
  <text x="24" y="47" class="sans" font-size="12" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">Happens-Before (a → b) · Concurrency Detection (a ∥ b) · O(1) Hybrid Logical Clock (l, c) · Commit-Wait Uncertainty [earliest, latest]</text>

  <!-- TOP-LEFT: LAMPORT VS VECTOR CLOCKS -->
  <rect x="24" y="76" width="534" height="248" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="42" y="100" class="sans" font-size="13.5" font-weight="700" fill="#1c1917">1. Lamport Scalar vs. Vector Clocks (O(N) Causal Tracking)</text>

  <!-- Lifelines P1, P2, P3 -->
  <text x="52" y="142" class="mono" font-size="11" font-weight="700" fill="#44403c">P1</text>
  <line x1="82" y1="138" x2="534" y2="138" stroke="#d6d0c4" stroke-width="2"/>

  <text x="52" y="198" class="mono" font-size="11" font-weight="700" fill="#44403c">P2</text>
  <line x1="82" y1="194" x2="534" y2="194" stroke="#d6d0c4" stroke-width="2"/>

  <text x="52" y="254" class="mono" font-size="11" font-weight="700" fill="#44403c">P3</text>
  <line x1="82" y1="250" x2="534" y2="250" stroke="#d6d0c4" stroke-width="2"/>

  <g class="c-pop">
    <circle cx="150" cy="138" r="8" fill="#0f766e"/>
    <text x="150" y="122" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">a: L=1, V=[1,0,0]</text>

    <line x1="158" y1="142" x2="294" y2="188" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-blue)"/>
    <text x="236" y="156" class="mono" font-size="10" font-weight="700" fill="#0f766e">m1</text>

    <circle cx="304" cy="194" r="8" fill="#0f766e"/>
    <text x="304" y="178" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">b: L=2, V=[1,1,0]</text>

    <rect x="388" y="176" width="144" height="34" rx="6" fill="#f0fdf9" stroke="#0f766e"/>
    <text x="460" y="191" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">a → b (Causal)</text>
    <text x="460" y="204" class="mono" font-size="10" fill="#065f46" text-anchor="middle">[1,0,0] &lt; [1,1,0]</text>
  </g>

  <g class="co-pop">
    <circle cx="210" cy="250" r="8" fill="#dc2626"/>
    <text x="210" y="274" class="mono" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">c: L=1, V=[0,0,1]</text>

    <rect x="330" y="264" width="208" height="44" rx="6" fill="#fef2f2" stroke="#dc2626"/>
    <text x="434" y="282" class="mono" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">a ∥ c (Concurrent Sibling!)</text>
    <text x="434" y="298" class="mono" font-size="10" fill="#991b1b" text-anchor="middle">[1,0,0] vs [0,0,1] · L(a)&lt;L(b) ≠&gt; a→b</text>
  </g>

  <!-- BOTTOM-LEFT: HYBRID LOGICAL CLOCK -->
  <rect x="24" y="338" width="534" height="202" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="42" y="362" class="sans" font-size="13.5" font-weight="700" fill="#1c1917">2. Hybrid Logical Clock (HLC: 64-bit (l, c), |l − pt| ≤ ε)</text>

  <g class="hl-pop">
    <rect x="42" y="380" width="150" height="66" rx="8" fill="#f5f1e8" stroke="#0f766e" stroke-width="1.5"/>
    <text x="117" y="401" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">pt = 100ms (Local 1)</text>
    <text x="117" y="420" class="mono" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">HLC = (100, 0)</text>
    <text x="117" y="436" class="sans" font-size="10" fill="#57534e" text-anchor="middle">l = max(l, pt)</text>

    <line x1="192" y1="413" x2="212" y2="413" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-blue)"/>

    <rect x="216" y="380" width="150" height="66" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.5"/>
    <text x="291" y="401" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">pt = 100ms (Same ms!)</text>
    <text x="291" y="420" class="mono" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">HLC = (100, 1)</text>
    <text x="291" y="436" class="sans" font-size="10" fill="#57534e" text-anchor="middle">c increments: c + 1</text>

    <line x1="366" y1="413" x2="386" y2="413" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-emerald)"/>

    <rect x="390" y="380" width="150" height="66" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.5"/>
    <text x="465" y="401" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">Recv msg l_m = 102</text>
    <text x="465" y="420" class="mono" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">HLC = (102, 0)</text>
    <text x="465" y="436" class="sans" font-size="10" fill="#57534e" text-anchor="middle">l_new = 102 &gt; pt, c=0</text>
  </g>

  <rect x="42" y="462" width="498" height="60" rx="6" fill="#faf8f5" stroke="#d6d0c4"/>
  <text x="56" y="483" class="mono" font-size="10.5" font-weight="700" fill="#1c1917">O(1) Size (vs O(N) Vector Clocks) · Used by CockroachDB &amp; MongoDB</text>
  <text x="56" y="502" class="sans" font-size="10.5" fill="#44403c">Guarantees e1 → e2 ⇒ HLC(e1) &lt; HLC(e2) while tracking real wall-clock time.</text>

  <!-- RIGHT PANEL: SPANNER TRUETIME -->
  <rect x="576" y="76" width="520" height="464" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="594" y="102" class="sans" font-size="14" font-weight="700" fill="#1c1917">3. Google Spanner TrueTime &amp; Commit-Wait</text>
  <text x="594" y="120" class="mono" font-size="10.5" fill="#44403c">GPS + Atomic Clocks bound ε ≤ 7ms · TT.now() = [earliest, latest]</text>

  <!-- Real-time axis -->
  <line x1="600" y1="264" x2="1072" y2="264" stroke="#44403c" stroke-width="2"/>
  <text x="610" y="284" class="mono" font-size="10" fill="#44403c">0ms</text>
  <text x="720" y="284" class="mono" font-size="10" fill="#44403c">7ms</text>
  <text x="830" y="284" class="mono" font-size="10" fill="#44403c">14ms</text>
  <text x="940" y="284" class="mono" font-size="10" fill="#44403c">21ms</text>
  <text x="1038" y="284" class="mono" font-size="10" fill="#44403c">t_real</text>

  <!-- T1 commit timestamp s1 -->
  <line x1="760" y1="150" x2="760" y2="274" stroke="#b45309" stroke-width="2.5" stroke-dasharray="4 3"/>
  <rect x="706" y="136" width="108" height="24" rx="5" fill="#fffbeb" stroke="#b45309"/>
  <text x="760" y="152" class="mono" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="middle">s1 = latest (10)</text>

  <!-- Sliding TrueTime Uncertainty Window [earliest, latest] -->
  <g class="tt-box">
    <rect x="630" y="182" width="130" height="66" rx="8" fill="#f5f1e8" fill-opacity="0.88" stroke="#0f766e" stroke-width="2"/>
    <text x="695" y="204" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">TT.now() Window</text>
    <text x="695" y="221" class="mono" font-size="10" fill="#065f46" text-anchor="middle">width = 2ε ≤ 14ms</text>
    <text x="632" y="242" class="mono" font-size="10" font-weight="700" fill="#065f46">earliest</text>
    <text x="722" y="242" class="mono" font-size="10" font-weight="700" fill="#065f46">latest</text>
  </g>

  <!-- Commit-Wait Zone -->
  <rect x="600" y="302" width="472" height="96" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <text x="616" y="324" class="sans" font-size="12" font-weight="700" fill="#92400e">Commit-Wait Rule for T1:</text>
  <text x="616" y="344" class="mono" font-size="10.5" fill="#44403c">1. Coordinator picks commit timestamp s1 = TT.now().latest</text>
  <text x="616" y="362" class="mono" font-size="10.5" fill="#44403c">2. Sleep (hold locks) until TT.now().earliest &gt; s1  (~2ε wait)</text>
  <text x="616" y="382" class="sans" font-size="10.5" font-weight="600" fill="#b45309">Ensures s1 is strictly in the real-time past before T1 publishes!</text>

  <!-- T2 Strict Serializability -->
  <g class="t2-box">
    <rect x="600" y="414" width="472" height="106" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.5"/>
    <text x="616" y="438" class="sans" font-size="12.5" font-weight="700" fill="#065f46">External Consistency (Strict Serializability):</text>
    <text x="616" y="460" class="mono" font-size="11" fill="#44403c">T2 starts after T1 commits ⇒ T2.start &gt; T1.commit</text>
    <text x="616" y="480" class="mono" font-size="11" font-weight="700" fill="#065f46">⇒ s2 ≥ TT.now().latest &gt; TT.now().earliest &gt; s1</text>
    <text x="616" y="502" class="sans" font-size="10.5" fill="#065f46">Global real-time transaction order preserved with zero vector clocks.</text>
  </g>

  <!-- FOOTER STEP BAR -->
  <rect x="24" y="554" width="256" height="48" rx="8" fill="#f0fdf9" class="st1"/>
  <text x="38" y="574" class="mono" font-size="10.5" font-weight="700" fill="#065f46">1. Happens-Before (a → b)</text>
  <text x="38" y="591" class="sans" font-size="10" fill="#44403c">V(a)=[1,0,0] &lt; V(b)=[1,1,0]</text>

  <rect x="296" y="554" width="256" height="48" rx="8" fill="#fef2f2" class="st2"/>
  <text x="310" y="574" class="mono" font-size="10.5" font-weight="700" fill="#991b1b">2. Concurrency (a ∥ c)</text>
  <text x="310" y="591" class="sans" font-size="10" fill="#44403c">Scalar L ties, Vector Clocks detect ∥</text>

  <rect x="568" y="554" width="256" height="48" rx="8" fill="#f5f1e8" class="st3"/>
  <text x="582" y="574" class="mono" font-size="10.5" font-weight="700" fill="#065f46">3. HLC &amp; TrueTime [e, l]</text>
  <text x="582" y="591" class="sans" font-size="10" fill="#44403c">HLC(l,c) &amp; T1 waits out 2ε uncertainty</text>

  <rect x="840" y="554" width="256" height="48" rx="8" fill="#f0fdf9" class="st4"/>
  <text x="854" y="574" class="mono" font-size="10.5" font-weight="700" fill="#065f46">4. Commit-Wait Satisfied</text>
  <text x="854" y="591" class="sans" font-size="10" fill="#44403c">TT.earliest &gt; s1 ⇒ s2 &gt; s1 globally</text>
</svg>
