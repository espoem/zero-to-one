<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" role="img" aria-labelledby="title desc">
  <title id="title">Jitter Backoff, Phi-Accrual Failure Detector, and SWIM Gossip</title>
  <desc id="desc">Animated failure-handling and membership pipeline. Top-left compares No Jitter synchronized retry spikes against Full Jitter and Decorrelated Jitter spread. Bottom-left plots Phi-Accrual suspicion Phi equals minus log10(P_later) crossing warn threshold 3 and suspect threshold 8 as heartbeat silence grows. Right panel animates SWIM round: direct ping A to B drops on a degraded edge, indirect ping-req via helpers C and D recovers ACK(B) in O(1) messages per period, preventing gray-failure false suspicion, followed by gossiped SUSPECT and ALIVE(incarnation+1) refutation.</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* 16s loop:
       0-25%  (0-4s):  Step 1 — Direct PING A->B fails; No Jitter spikes vs Full Jitter spread
       25-50% (4-8s):  Step 2 — Indirect PING-REQ via C,D reaches B -> ACK(B) returns
       50-75% (8-12s): Step 3 — Phi-Accrual silence crosses Phi=3 (Warn) -> Phi=8 (Suspect)
       75-100%(12-16s):Step 4 — SWIM gossip SUSPECT(i) refuted by B's ALIVE(i+1)
    */

    @keyframes pkt-ping-fail {
      0%, 4%   { transform: translate(0px, 0px); opacity: 0; }
      6%       { transform: translate(0px, 0px); opacity: 1; }
      18%      { transform: translate(110px, 0px); opacity: 1; }
      22%, 100%{ transform: translate(110px, 0px); opacity: 0; }
    }
    @keyframes pkt-pingreq {
      0%, 24%  { opacity: 0; }
      28%, 46% { opacity: 1; }
      52%, 100%{ opacity: 0; }
    }
    @keyframes phi-cursor {
      0%, 46%  { transform: translateX(0px); }
      60%      { transform: translateX(135px); }
      72%, 94% { transform: translateX(250px); }
      100%     { transform: translateX(0px); }
    }
    @keyframes gossip-show {
      0%, 72%  { opacity: 0.86; }
      78%, 96% { opacity: 1; }
      100%     { opacity: 0.86; }
    }

    @keyframes s1 { 0%, 24% { opacity: 1; stroke: #dc2626; stroke-width: 2.2; } 25%, 100% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1; } }
    @keyframes s2 { 0%, 24% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1; } 25%, 49% { opacity: 1; stroke: #0f766e; stroke-width: 2.2; } 50%, 100% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1; } }
    @keyframes s3 { 0%, 49% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1; } 50%, 74% { opacity: 1; stroke: #b45309; stroke-width: 2.2; } 75%, 100% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1; } }
    @keyframes s4 { 0%, 74% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1; } 75%, 100% { opacity: 1; stroke: #0f766e; stroke-width: 2.2; } }

    .p-fail  { animation: pkt-ping-fail 16s ease-in-out infinite; }
    .p-ind   { animation: pkt-pingreq 16s ease-in-out infinite; }
    .phi-cur { animation: phi-cursor 16s ease-in-out infinite; }
    .gos-box { animation: gossip-show 16s ease-in-out infinite; }
    .st1 { animation: s1 16s linear infinite; }
    .st2 { animation: s2 16s linear infinite; }
    .st3 { animation: s3 16s linear infinite; }
    .st4 { animation: s4 16s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .p-fail, .p-ind, .phi-cur, .jit-dot, .gos-box, .st1, .st2, .st3, .st4 { animation: none !important; }
      .p-fail { opacity: 0 !important; }
      .p-ind, .jit-dot, .gos-box, .st1, .st2, .st3, .st4 { opacity: 1 !important; }
      .phi-cur { transform: translateX(250px) !important; }
    }
  </style>

  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1120" height="620" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>

  <!-- Header -->
  <line x1="24" y1="64" x2="1096" y2="64" stroke="#1c1917" stroke-width="1.2"/>
  
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#1c1917" font-family="Georgia, 'Times New Roman', serif">Jitter Backoff, Phi-Accrual Detector, and SWIM Gossip</text>
  <text x="24" y="47" class="sans" font-size="12" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">Retry Budget Amplification Control · Continuous Suspicion Φ = −log₁₀(P_later) · O(1) Indirect Ping-Req &amp; Incarnation Refutation</text>

  <!-- TOP-LEFT: BACKOFF JITTER -->
  <rect x="24" y="76" width="524" height="222" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="42" y="100" class="sans" font-size="13.5" font-weight="700" fill="#1c1917">1. Exponential Backoff &amp; Jitter (Marc Brooker / AWS)</text>

  <!-- No Jitter Row -->
  <text x="42" y="132" class="mono" font-size="10.5" font-weight="700" fill="#991b1b">No Jitter:</text>
  <text x="42" y="146" class="mono" font-size="10" fill="#57534e">min(cap, b·2^a)</text>
  <line x1="156" y1="138" x2="524" y2="138" stroke="#d6d0c4" stroke-width="1.5"/>
  <g class="jit-dot">
    <circle cx="220" cy="138" r="5" fill="#dc2626"/><circle cx="223" cy="133" r="5" fill="#dc2626"/><circle cx="226" cy="143" r="5" fill="#dc2626"/>
    <circle cx="320" cy="138" r="5" fill="#dc2626"/><circle cx="323" cy="133" r="5" fill="#dc2626"/><circle cx="326" cy="143" r="5" fill="#dc2626"/>
    <rect x="352" y="126" width="166" height="22" rx="4" fill="#fef2f2" stroke="#dc2626"/>
    <text x="435" y="141" class="mono" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">Synchronized Retry Spike!</text>
  </g>

  <!-- Full Jitter Row -->
  <text x="42" y="182" class="mono" font-size="10.5" font-weight="700" fill="#065f46">Full Jitter:</text>
  <text x="42" y="196" class="mono" font-size="10" fill="#57534e">rand(0, b·2^a)</text>
  <line x1="156" y1="188" x2="524" y2="188" stroke="#d6d0c4" stroke-width="1.5"/>
  <g class="jit-dot">
    <circle cx="176" cy="188" r="4.5" fill="#0f766e"/><circle cx="206" cy="188" r="4.5" fill="#0f766e"/>
    <circle cx="242" cy="188" r="4.5" fill="#0f766e"/><circle cx="278" cy="188" r="4.5" fill="#0f766e"/>
    <circle cx="318" cy="188" r="4.5" fill="#0f766e"/><circle cx="364" cy="188" r="4.5" fill="#0f766e"/>
    <rect x="394" y="176" width="124" height="22" rx="4" fill="#f0fdf9" stroke="#0f766e"/>
    <text x="456" y="191" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">Flat Load Spread</text>
  </g>

  <!-- Decorrelated Jitter Row -->
  <text x="42" y="232" class="mono" font-size="10.5" font-weight="700" fill="#065f46">Decorrelated:</text>
  <text x="42" y="246" class="mono" font-size="10" fill="#57534e">rand(b, prev·3)</text>
  <line x1="156" y1="238" x2="524" y2="238" stroke="#d6d0c4" stroke-width="1.5"/>
  <g class="jit-dot">
    <circle cx="188" cy="238" r="4.5" fill="#0f766e"/><circle cx="228" cy="238" r="4.5" fill="#0f766e"/>
    <circle cx="268" cy="238" r="4.5" fill="#0f766e"/><circle cx="312" cy="238" r="4.5" fill="#0f766e"/>
    <circle cx="354" cy="238" r="4.5" fill="#0f766e"/>
    <rect x="384" y="226" width="134" height="22" rx="4" fill="#f0fdf9" stroke="#0f766e"/>
    <text x="451" y="241" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">Low Queue Contention</text>
  </g>

  <rect x="42" y="260" width="484" height="26" rx="5" fill="#f5f1e8" stroke="#d6d0c4"/>
  <text x="284" y="277" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">Budget b = 0.1 over L = 3 hops caps amplification at (1+b)^L = 1.33x (vs 27x)</text>

  <!-- BOTTOM-LEFT: PHI-ACCRUAL DETECTOR -->
  <rect x="24" y="312" width="524" height="228" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="42" y="336" class="sans" font-size="13.5" font-weight="700" fill="#1c1917">2. Φ-Accrual Failure Detector (Window W = 1,000, μ, σ²)</text>

  <!-- Plot axes -->
  <line x1="76" y1="494" x2="516" y2="494" stroke="#44403c" stroke-width="1.5"/>
  <line x1="76" y1="354" x2="76" y2="494" stroke="#44403c" stroke-width="1.5"/>
  <text x="46" y="424" class="mono" font-size="10.5" font-weight="700" fill="#44403c" text-anchor="middle">Φ(t)</text>
  <text x="296" y="514" class="mono" font-size="10" fill="#44403c" text-anchor="middle">Elapsed silence Δt = t − t_last</text>

  <!-- Threshold lines -->
  <line x1="76" y1="444" x2="516" y2="444" stroke="#b45309" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="512" y="440" class="mono" font-size="10" font-weight="700" fill="#92400e" text-anchor="end">Φ = 3 (Warn · 10⁻³)</text>

  <line x1="76" y1="384" x2="516" y2="384" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="512" y="378" class="mono" font-size="10" font-weight="700" fill="#991b1b" text-anchor="end">Φ = 8 (Suspect · 10⁻⁸)</text>

  <!-- Curve Phi = -log10(P_later) -->
  <path d="M 80 492 Q 180 486, 250 444 T 380 384 T 470 356" fill="none" stroke="#0f766e" stroke-width="2.5"/>

  <!-- Sliding Cursor -->
  <g class="phi-cur">
    <line x1="120" y1="358" x2="120" y2="494" stroke="#0f766e" stroke-width="2"/>
    <circle cx="120" cy="482" r="5" fill="#0f766e"/>
    <rect x="88" y="346" width="84" height="20" rx="4" fill="#0f766e"/>
    <text x="130" y="360" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">t − t_last</text>
  </g>

  <text x="86" y="370" class="mono" font-size="10" fill="#065f46">Φ = −log₁₀(P_later(t − t_last))</text>
  <text x="296" y="530" class="sans" font-size="10" fill="#57534e" text-anchor="middle">Cassandra: Φ = t / (μ·ln10); Φ=8 after 18.4× mean interval</text>

  <!-- RIGHT PANEL: SWIM GOSSIP -->
  <rect x="572" y="76" width="524" height="464" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="590" y="102" class="sans" font-size="14" font-weight="700" fill="#1c1917">3. SWIM Indirect Probing &amp; Lifeguard Refutation</text>
  <text x="590" y="120" class="mono" font-size="10.5" fill="#44403c">Load &lt;= 1 + 4k msgs/period (O(1) per node) · Detection ~ 1.58 periods</text>

  <!-- Node A (Prober) -->
  <rect x="606" y="160" width="96" height="58" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="2"/>
  <text x="654" y="185" class="sans" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">Node A</text>
  <text x="654" y="203" class="mono" font-size="10" fill="#065f46" text-anchor="middle">Prober</text>

  <!-- Node B (Suspect / Degraded link) -->
  <rect x="954" y="160" width="112" height="58" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="1010" y="185" class="sans" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">Node B</text>
  <text x="1010" y="203" class="mono" font-size="10" fill="#b45309" text-anchor="middle">Target (inc=4)</text>

  <!-- Direct degraded edge A -> B -->
  <line x1="702" y1="189" x2="950" y2="189" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-rose)"/>
  <rect x="752" y="150" width="152" height="22" rx="4" fill="#fef2f2" stroke="#dc2626"/>
  <text x="828" y="165" class="mono" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">1. Direct PING (80% loss)</text>

  <g class="p-fail">
    <circle cx="720" cy="189" r="9" fill="#dc2626"/>
    <text x="720" y="193" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">✕</text>
  </g>

  <!-- Helper Nodes C and D -->
  <rect x="656" y="308" width="104" height="52" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.8"/>
  <text x="708" y="331" class="sans" font-size="12.5" font-weight="700" fill="#065f46" text-anchor="middle">Helper C</text>
  <text x="708" y="347" class="mono" font-size="10" fill="#065f46" text-anchor="middle">Random Peer</text>

  <rect x="902" y="308" width="104" height="52" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.8"/>
  <text x="954" y="331" class="sans" font-size="12.5" font-weight="700" fill="#065f46" text-anchor="middle">Helper D</text>
  <text x="954" y="347" class="mono" font-size="10" fill="#065f46" text-anchor="middle">Random Peer</text>

  <!-- Indirect probe arrows -->
  <g class="p-ind">
    <line x1="654" y1="218" x2="696" y2="306" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-blue)"/>
    <text x="614" y="272" class="mono" font-size="10" font-weight="700" fill="#065f46">PING-REQ(B)</text>

    <line x1="760" y1="334" x2="900" y2="334" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="3 3"/>

    <line x1="744" y1="308" x2="964" y2="220" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-emerald)"/>
    <line x1="954" y1="308" x2="994" y2="220" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-emerald)"/>
    <text x="844" y="278" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">2. Indirect PING / ACK(B) OK!</text>
  </g>

  <!-- Precedence & Gossip Refutation Box -->
  <g class="gos-box">
    <rect x="594" y="384" width="480" height="138" rx="8" fill="#f5f1e8" stroke="#0f766e" stroke-width="1.5"/>
    <text x="610" y="408" class="sans" font-size="12" font-weight="700" fill="#065f46">4. Piggybacked Suspicion &amp; Incarnation Precedence</text>
    <text x="610" y="430" class="mono" font-size="10.5" fill="#44403c">· If indirect probes fail -&gt; gossip SUSPECT(B, inc=4)</text>
    <text x="610" y="450" class="mono" font-size="10.5" fill="#065f46">· B refutes by broadcasting ALIVE(B, inc=5)  [i &gt; j overrides]</text>
    <text x="610" y="470" class="mono" font-size="10.5" fill="#991b1b">· Precedence: dead &gt; suspect(i) &gt;= alive(j) &lt; alive(i+1)</text>
    <text x="610" y="494" class="sans" font-size="10.5" fill="#065f46">Lifeguard adds Local Health Multiplier + Dogpile + Buddy System</text>
    <text x="610" y="510" class="sans" font-size="10.5" fill="#065f46">to stop CPU-starved probers from accusing healthy peers.</text>
  </g>

  <!-- FOOTER STEP BAR -->
  <rect x="24" y="554" width="256" height="48" rx="8" fill="#fef2f2" class="st1"/>
  <text x="38" y="574" class="mono" font-size="10.5" font-weight="700" fill="#991b1b">1. Direct Ping &amp; Retry Risk</text>
  <text x="38" y="591" class="sans" font-size="10" fill="#44403c">A-&gt;B drops; Full Jitter avoids spikes</text>

  <rect x="296" y="554" width="256" height="48" rx="8" fill="#f0fdf9" class="st2"/>
  <text x="310" y="574" class="mono" font-size="10.5" font-weight="700" fill="#065f46">2. SWIM Indirect Ping-Req</text>
  <text x="310" y="591" class="sans" font-size="10" fill="#44403c">C, D reach B despite bad edge A-B</text>

  <rect x="568" y="554" width="256" height="48" rx="8" fill="#fffbeb" class="st3"/>
  <text x="582" y="574" class="mono" font-size="10.5" font-weight="700" fill="#92400e">3. Phi-Accrual Thresholds</text>
  <text x="582" y="591" class="sans" font-size="10" fill="#44403c">Silence scales Φ=3 warn to Φ=8 suspect</text>

  <rect x="840" y="554" width="256" height="48" rx="8" fill="#f0fdf9" class="st4"/>
  <text x="854" y="574" class="mono" font-size="10.5" font-weight="700" fill="#065f46">4. Incarnation Refutation</text>
  <text x="854" y="591" class="sans" font-size="10" fill="#44403c">B gossips ALIVE(inc+1) before DEAD</text>
</svg>
