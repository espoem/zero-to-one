<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" role="img" aria-labelledby="title desc">
  <title id="title">Atomic Commit: 2PC, 3PC, Percolator, Spanner, and Sagas</title>
  <desc id="desc">Animated comparison of distributed transaction protocols. Top-left contrasts 2PC blocking (coordinator crashes after Prepare leaving P1 and P2 stuck holding locks in PREPARED) with 3PC PreCommit split-brain under network partitions. Bottom-left shows modern non-blocking designs: Google Percolator primary/secondary lock pointers with TSO roll-forward/roll-back, and Google Spanner 2PC over Paxos groups with TrueTime. Right panel animates the Saga pattern forward sequence T1 (Create Order) -&gt; T2 (Charge $100) -&gt; T3 (Inventory Out of Stock failure) followed by compensating transactions C2 (Refund $100) -&gt; C1 (Cancel Order).</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    @keyframes ph1 { 0%, 4% { opacity: 0.86; } 10%, 96% { opacity: 1; } 100% { opacity: 0.86; } }
    @keyframes ph2 { 0%, 24% { opacity: 0.86; } 30%, 96% { opacity: 1; } 100% { opacity: 0.86; } }
    @keyframes ph3 { 0%, 49% { opacity: 0.86; } 55%, 96% { opacity: 1; } 100% { opacity: 0.86; } }
    @keyframes ph4 { 0%, 74% { opacity: 0.86; } 80%, 96% { opacity: 1; } 100% { opacity: 0.86; } }

    @keyframes s1 { 0%, 24% { opacity: 1; stroke: #e11d48; stroke-width: 2.2; } 25%, 100% { opacity: 0.86; stroke: #cbd5e1; stroke-width: 1; } }
    @keyframes s2 { 0%, 24% { opacity: 0.86; stroke: #cbd5e1; stroke-width: 1; } 25%, 49% { opacity: 1; stroke: #059669; stroke-width: 2.2; } 50%, 100% { opacity: 0.86; stroke: #cbd5e1; stroke-width: 1; } }
    @keyframes s3 { 0%, 49% { opacity: 0.86; stroke: #cbd5e1; stroke-width: 1; } 50%, 74% { opacity: 1; stroke: #2563eb; stroke-width: 2.2; } 75%, 100% { opacity: 0.86; stroke: #cbd5e1; stroke-width: 1; } }
    @keyframes s4 { 0%, 74% { opacity: 0.86; stroke: #cbd5e1; stroke-width: 1; } 75%, 100% { opacity: 1; stroke: #d97706; stroke-width: 2.2; } }

    .p1 { animation: ph1 16s ease-in-out infinite; }
    .p2 { animation: ph2 16s ease-in-out infinite; }
    .p3 { animation: ph3 16s ease-in-out infinite; }
    .p4 { animation: ph4 16s ease-in-out infinite; }
    .st1 { animation: s1 16s linear infinite; }
    .st2 { animation: s2 16s linear infinite; }
    .st3 { animation: s3 16s linear infinite; }
    .st4 { animation: s4 16s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .p1, .p2, .p3, .p4, .st1, .st2, .st3, .st4 { animation: none !important; opacity: 1 !important; }
    }
  </style>

  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="620" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="1120" height="62" rx="12" fill="#0f172a"/>
  <rect x="0" y="46" width="1120" height="16" fill="#0f172a"/>
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#f8fafc">Atomic Commit: 2PC, 3PC, Percolator, Spanner &amp; Sagas</text>
  <text x="24" y="47" class="sans" font-size="12" fill="#94a3b8">2PC Blocking Window · 3PC Partition Split-Brain · Percolator Primary Lock · Spanner 2PC-over-Paxos · Saga Compensating Rollback</text>

  <!-- TOP-LEFT: 2PC vs 3PC -->
  <rect x="24" y="76" width="540" height="222" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="42" y="100" class="sans" font-size="13.5" font-weight="700" fill="#0f172a">1. Classic 2PC Blocking Window vs. 3PC Split-Brain</text>

  <g class="p1">
    <rect x="42" y="114" width="246" height="168" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
    <text x="56" y="136" class="mono" font-size="11" font-weight="700" fill="#9f1239">2PC Blocking Flaw</text>
    <text x="56" y="156" class="mono" font-size="10" fill="#334155">1. Coord → P1,P2: PREPARE</text>
    <text x="56" y="174" class="mono" font-size="10" fill="#334155">2. P1,P2 → Coord: VOTE_COMMIT</text>
    <rect x="56" y="186" width="218" height="26" rx="5" fill="#e11d48"/>
    <text x="165" y="203" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">✕ Coordinator CRASHES!</text>
    <text x="56" y="232" class="sans" font-size="10" fill="#9f1239">P1, P2 stuck in PREPARED holding</text>
    <text x="56" y="248" class="sans" font-size="10" fill="#9f1239">row locks (cannot commit or abort)!</text>
    <text x="56" y="268" class="mono" font-size="10" font-weight="700" fill="#be123c">Blocked until Coord recovers.</text>

    <rect x="302" y="114" width="246" height="168" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="316" y="136" class="mono" font-size="11" font-weight="700" fill="#92400e">3PC Partition Failure (Unused)</text>
    <text x="316" y="156" class="mono" font-size="10" fill="#334155">1. CAN_COMMIT? → YES</text>
    <text x="316" y="174" class="mono" font-size="10" fill="#334155">2. PRE_COMMIT (Assumes Sync!)</text>
    <rect x="316" y="186" width="218" height="26" rx="5" fill="#d97706"/>
    <text x="425" y="203" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">⚡ Network Partition Splits!</text>
    <text x="316" y="232" class="sans" font-size="10" fill="#92400e">Side A times out → ABORT</text>
    <text x="316" y="248" class="sans" font-size="10" fill="#92400e">Side B in PRE_COMMIT → COMMIT</text>
    <text x="316" y="268" class="mono" font-size="10" font-weight="700" fill="#b45309">Fatal Split-Brain Corruption!</text>
  </g>

  <!-- BOTTOM-LEFT: PERCOLATOR & SPANNER -->
  <rect x="24" y="312" width="540" height="228" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="42" y="336" class="sans" font-size="13.5" font-weight="700" fill="#0f172a">2. Fault-Tolerant Commit: Percolator &amp; Spanner</text>

  <g class="p2">
    <rect x="42" y="352" width="246" height="172" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="56" y="374" class="mono" font-size="11" font-weight="700" fill="#5b21b6">Google Percolator (TSO)</text>
    <text x="56" y="394" class="sans" font-size="10" fill="#334155">· Designates 1 Primary Lock Cell.</text>
    <text x="56" y="412" class="sans" font-size="10" fill="#334155">· Secondary Locks point to Primary.</text>
    <rect x="56" y="424" width="218" height="44" rx="5" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="165" y="442" class="mono" font-size="10" font-weight="700" fill="#5b21b6" text-anchor="middle">Client crashes mid-commit?</text>
    <text x="165" y="458" class="sans" font-size="10" fill="#4c1d95" text-anchor="middle">Readers check Primary: roll-fwd/back!</text>
    <text x="56" y="492" class="mono" font-size="10" font-weight="700" fill="#5b21b6">Snapshot Isolation over Bigtable.</text>
    <text x="56" y="510" class="sans" font-size="10" fill="#64748b">Used by TiKV / CockroachDB txn intent.</text>

    <rect x="302" y="352" width="246" height="172" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="316" y="374" class="mono" font-size="11" font-weight="700" fill="#065f46">Google Spanner (2PC + Paxos)</text>
    <text x="316" y="394" class="sans" font-size="10" fill="#334155">· Every shard is a Paxos Group.</text>
    <text x="316" y="412" class="sans" font-size="10" fill="#334155">· 2PC runs between Paxos leaders.</text>
    <rect x="316" y="424" width="218" height="44" rx="5" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="425" y="442" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">Coordinator leader crashes?</text>
    <text x="425" y="458" class="sans" font-size="10" fill="#047857" text-anchor="middle">Paxos elects replacement in ms!</text>
    <text x="316" y="492" class="mono" font-size="10" font-weight="700" fill="#065f46">+ TrueTime Commit-Wait</text>
    <text x="316" y="510" class="sans" font-size="10" fill="#047857">Non-blocking Strict Serializability.</text>
  </g>

  <!-- RIGHT PANEL: SAGA PATTERN -->
  <rect x="580" y="76" width="516" height="464" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="598" y="102" class="sans" font-size="14" font-weight="700" fill="#0f172a">3. The Sagas Pattern (Forward Tᵢ &amp; Compensating Cᵢ)</text>
  <text x="598" y="120" class="mono" font-size="10.5" fill="#475569">No distributed locks held across microservices · Semantic Undo</text>

  <!-- Forward Row -->
  <g class="p3">
    <text x="598" y="146" class="mono" font-size="11" font-weight="700" fill="#1e3a8a">Forward Execution (T₁ → T₂ → T₃):</text>

    <rect x="598" y="158" width="136" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="666" y="180" class="sans" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Order Service</text>
    <text x="666" y="198" class="mono" font-size="10.5" fill="#1e40af" text-anchor="middle">T1: PENDING</text>
    <text x="666" y="216" class="mono" font-size="10" fill="#059669" text-anchor="middle">Local Commit ✓</text>

    <line x1="734" y1="194" x2="764" y2="194" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>

    <rect x="768" y="158" width="136" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="836" y="180" class="sans" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Payment Svc</text>
    <text x="836" y="198" class="mono" font-size="10.5" fill="#1e40af" text-anchor="middle">T2: Charge $100</text>
    <text x="836" y="216" class="mono" font-size="10" fill="#059669" text-anchor="middle">Local Commit ✓</text>

    <line x1="904" y1="194" x2="934" y2="194" stroke="#e11d48" stroke-width="2" marker-end="url(#arr-rose)"/>

    <rect x="938" y="158" width="140" height="72" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
    <text x="1008" y="180" class="sans" font-size="12" font-weight="700" fill="#9f1239" text-anchor="middle">Inventory Svc</text>
    <text x="1008" y="198" class="mono" font-size="10.5" fill="#be123c" text-anchor="middle">T3: Reserve SKU</text>
    <text x="1008" y="216" class="mono" font-size="10" font-weight="700" fill="#e11d48" text-anchor="middle">✕ OUT OF STOCK</text>
  </g>

  <!-- Backward Compensation Row -->
  <g class="p4">
    <line x1="1008" y1="230" x2="1008" y2="276" stroke="#d97706" stroke-width="2" stroke-dasharray="4 3"/>
    <line x1="1008" y1="276" x2="908" y2="276" stroke="#d97706" stroke-width="2.2" marker-end="url(#arr-amber)"/>
    <text x="962" y="266" class="mono" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">Abort Trigger</text>

    <text x="598" y="274" class="mono" font-size="11" font-weight="700" fill="#92400e">Compensating Rollback (C₂ → C₁):</text>

    <rect x="768" y="292" width="136" height="72" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="836" y="314" class="sans" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Compensate C2</text>
    <text x="836" y="332" class="mono" font-size="10.5" fill="#b45309" text-anchor="middle">Refund $100</text>
    <text x="836" y="350" class="mono" font-size="10" fill="#059669" text-anchor="middle">Idempotent ✓</text>

    <line x1="768" y1="328" x2="738" y2="328" stroke="#d97706" stroke-width="2.2" marker-end="url(#arr-amber)"/>

    <rect x="598" y="292" width="136" height="72" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="666" y="314" class="sans" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Compensate C1</text>
    <text x="666" y="332" class="mono" font-size="10.5" fill="#b45309" text-anchor="middle">Order CANCELLED</text>
    <text x="666" y="350" class="mono" font-size="10" fill="#059669" text-anchor="middle">Idempotent ✓</text>
  </g>

  <rect x="598" y="384" width="480" height="140" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="614" y="408" class="sans" font-size="12" font-weight="700" fill="#0f172a">Saga Engineering Guarantees &amp; Trade-Offs:</text>
  <text x="614" y="430" class="sans" font-size="10.5" fill="#334155">· ACD without Isolation (I): Intermediate states (PENDING / $100 charged)</text>
  <text x="614" y="446" class="sans" font-size="10.5" fill="#334155">  are visible before T3 completes (mitigate via semantic reservations).</text>
  <text x="614" y="468" class="sans" font-size="10.5" fill="#334155">· Orchestration (Temporal / Step Functions) &gt; Choreography for large flows.</text>
  <text x="614" y="490" class="mono" font-size="10" font-weight="700" fill="#5b21b6">· Pair with Transactional Outbox (DB + outbox table in 1 ACID txn)</text>
  <text x="614" y="508" class="sans" font-size="10" fill="#4c1d95">  to eliminate Dual-Write DB/Kafka divergence crashes.</text>

  <!-- FOOTER STEP BAR -->
  <rect x="24" y="554" width="256" height="48" rx="8" fill="#fff1f2" class="st1"/>
  <text x="38" y="574" class="mono" font-size="10.5" font-weight="700" fill="#9f1239">1. 2PC Blocking / 3PC Split</text>
  <text x="38" y="591" class="sans" font-size="10" fill="#334155">Single coordinator crash blocks locks</text>

  <rect x="296" y="554" width="256" height="48" rx="8" fill="#ecfdf5" class="st2"/>
  <text x="310" y="574" class="mono" font-size="10.5" font-weight="700" fill="#065f46">2. Percolator &amp; Spanner</text>
  <text x="310" y="591" class="sans" font-size="10" fill="#334155">Primary lock &amp; 2PC-over-Paxos survive</text>

  <rect x="568" y="554" width="256" height="48" rx="8" fill="#eff6ff" class="st3"/>
  <text x="582" y="574" class="mono" font-size="10.5" font-weight="700" fill="#1e3a8a">3. Saga Forward T1→T2→T3</text>
  <text x="582" y="591" class="sans" font-size="10" fill="#334155">Local ACID commits; T3 fails on stock</text>

  <rect x="840" y="554" width="256" height="48" rx="8" fill="#fffbeb" class="st4"/>
  <text x="854" y="574" class="mono" font-size="10.5" font-weight="700" fill="#92400e">4. Compensate C2 → C1</text>
  <text x="854" y="591" class="sans" font-size="10" fill="#334155">Idempotent refund &amp; order cancellation</text>
</svg>
