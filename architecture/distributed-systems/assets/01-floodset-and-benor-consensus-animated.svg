<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" role="img" aria-labelledby="title desc">
  <title id="title">FloodSet (f+1 Rounds) vs. Ben-Or Asynchronous Randomized Consensus</title>
  <desc id="desc">Animated comparison of two FLP circumvention protocols. Left panel shows synchronous crash-stop FloodSet with f equals 2 and n equals 4 processes: p0 crashes in round 1 after telling p1, p1 crashes in round 2 after telling p2 leaving p2 with {0,1} and p3 with {1}, and crash-free round 3 (f+1) lets p2 relay {0,1} to p3 so all survivors decide min(W) equals 0. Right panel shows asynchronous Ben-Or binary consensus with n equals 5, f equals 2: split votes produce bot proposals in Phase P, triggering local coin flips until Phase R reaches a strict majority and Phase P sees at least f+1 matching proposals to decide 1.</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* 16s loop across 4 phases:
       0-25%  (0-4s):   Step 1 — FloodSet Round 1 (p0 -> p1, p0 crashes) &amp; Ben-Or Round 1 Phase R (split -> bot)
       25-50% (4-8s):   Step 2 — FloodSet Round 2 (p1 -> p2, p1 crashes; f rounds diverge!) &amp; Ben-Or Phase P (coin flip)
       50-75% (8-12s):  Step 3 — FloodSet Round 3 = f+1 crash-free (p2 -> p3) &amp; Ben-Or Round 2 Phase R (coins align -> maj)
       75-100%(12-16s): Step 4 — Both protocols reach unanimous Agreement!
    */

    @keyframes p1-show {
      0%, 4%   { opacity: 0.86; }
      8%, 96%  { opacity: 1; }
      100%     { opacity: 0.86; }
    }
    @keyframes p2-show {
      0%, 24%  { opacity: 0.86; }
      30%, 96% { opacity: 1; }
      100%     { opacity: 0.86; }
    }
    @keyframes p3-show {
      0%, 49%  { opacity: 0.86; }
      55%, 96% { opacity: 1; }
      100%     { opacity: 0.86; }
    }
    @keyframes p4-show {
      0%, 74%  { opacity: 0.86; }
      80%, 96% { opacity: 1; }
      100%     { opacity: 0.86; }
    }
    @keyframes coin-spin {
      0%, 25%  { transform: scaleX(1); }
      33%      { transform: scaleX(0.15); }
      40%      { transform: scaleX(1); }
      46%      { transform: scaleX(0.15); }
      52%, 100%{ transform: scaleX(1); }
    }

    @keyframes step1 { 0%, 24% { opacity: 1; stroke: #0f766e; stroke-width: 2.2; } 25%, 100% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1; } }
    @keyframes step2 { 0%, 24% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1; } 25%, 49% { opacity: 1; stroke: #dc2626; stroke-width: 2.2; } 50%, 100% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1; } }
    @keyframes step3 { 0%, 49% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1; } 50%, 74% { opacity: 1; stroke: #b45309; stroke-width: 2.2; } 75%, 100% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1; } }
    @keyframes step4 { 0%, 74% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1; } 75%, 100% { opacity: 1; stroke: #0f766e; stroke-width: 2.2; } }

    .ph1 { animation: p1-show 16s ease-in-out infinite; }
    .ph2 { animation: p2-show 16s ease-in-out infinite; }
    .ph3 { animation: p3-show 16s ease-in-out infinite; }
    .ph4 { animation: p4-show 16s ease-in-out infinite; }
    .coin { transform-box: fill-box; transform-origin: center; animation: coin-spin 16s ease-in-out infinite; }
    .s1 { animation: step1 16s linear infinite; }
    .s2 { animation: step2 16s linear infinite; }
    .s3 { animation: step3 16s linear infinite; }
    .s4 { animation: step4 16s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .ph1, .ph2, .ph3, .ph4, .coin, .s1, .s2, .s3, .s4 { animation: none !important; }
      .ph1, .ph2, .ph3, .ph4, .s1, .s2, .s3, .s4 { opacity: 1 !important; }
      .coin { transform: none !important; }
    }
  </style>

  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
    <marker id="arr-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1120" height="620" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>

  <!-- Header -->
  <line x1="24" y1="64" x2="1096" y2="64" stroke="#1c1917" stroke-width="1.2"/>
  
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#1c1917" font-family="Georgia, 'Times New Roman', serif">Circumventing FLP: FloodSet (f+1 Rounds) vs. Ben-Or Randomized Consensus</text>
  <text x="24" y="47" class="sans" font-size="12" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">Synchrony (Crash-Stop, f = 2, n = 4, f+1 = 3 rounds) vs. Randomization (Async, n = 5 &gt; 2f, Prob. 1 Termination)</text>

  <!-- LEFT PANEL: FLOODSET -->
  <rect x="24" y="76" width="524" height="464" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="42" y="102" class="sans" font-size="14" font-weight="700" fill="#1c1917">1. Synchronous FloodSet (f = 2 crashes, f+1 = 3 rounds)</text>
  <text x="42" y="120" class="mono" font-size="10.5" fill="#44403c">W_p &lt;- {x_p}; for r = 1..f+1: W_p &lt;- W_p U W_q; decide min(W_p)</text>

  <!-- Process column headers -->
  <rect x="116" y="136" width="84" height="32" rx="6" fill="#f0fdf9" stroke="#0f766e"/>
  <text x="158" y="156" class="mono" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">p0 (x=0)</text>

  <rect x="220" y="136" width="84" height="32" rx="6" fill="#f0fdf9" stroke="#0f766e"/>
  <text x="262" y="156" class="mono" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">p1 (x=1)</text>

  <rect x="324" y="136" width="84" height="32" rx="6" fill="#f0fdf9" stroke="#0f766e"/>
  <text x="366" y="156" class="mono" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">p2 (x=1)</text>

  <rect x="428" y="136" width="84" height="32" rx="6" fill="#f0fdf9" stroke="#0f766e"/>
  <text x="470" y="156" class="mono" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">p3 (x=1)</text>

  <!-- Round 1 -->
  <rect x="40" y="182" width="492" height="84" rx="8" fill="#faf8f5" stroke="#d6d0c4"/>
  <text x="52" y="204" class="mono" font-size="11" font-weight="700" fill="#1c1917">r = 1</text>
  <text x="52" y="220" class="sans" font-size="10" fill="#57534e">Partial</text>
  <text x="52" y="233" class="sans" font-size="10" fill="#57534e">crash</text>
  <g class="ph1">
    <rect x="116" y="194" width="84" height="34" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="158" y="210" class="mono" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">{0} CRASH</text>
    <text x="158" y="223" class="mono" font-size="10" fill="#dc2626" text-anchor="middle">sent to p1</text>

    <line x1="200" y1="211" x2="218" y2="211" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-blue)"/>

    <rect x="220" y="194" width="84" height="34" rx="5" fill="#f0fdf9" stroke="#0f766e"/>
    <text x="262" y="215" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">W={0, 1}</text>

    <rect x="324" y="194" width="84" height="34" rx="5" fill="#f5f1e8" stroke="#d6d0c4"/>
    <text x="366" y="215" class="mono" font-size="10.5" fill="#44403c" text-anchor="middle">W={1}</text>

    <rect x="428" y="194" width="84" height="34" rx="5" fill="#f5f1e8" stroke="#d6d0c4"/>
    <text x="470" y="215" class="mono" font-size="10.5" fill="#44403c" text-anchor="middle">W={1}</text>

    <text x="366" y="250" class="sans" font-size="10" fill="#44403c" text-anchor="middle">p0 told ONLY p1 before crashing</text>
  </g>

  <!-- Round 2 (= f) -->
  <rect x="40" y="276" width="492" height="90" rx="8" fill="#faf8f5" stroke="#d6d0c4"/>
  <text x="52" y="298" class="mono" font-size="11" font-weight="700" fill="#1c1917">r = 2</text>
  <text x="52" y="314" class="sans" font-size="10" fill="#dc2626">(r = f)</text>
  <g class="ph2">
    <rect x="116" y="288" width="84" height="34" rx="5" fill="#f5f1e8" stroke="#d6d0c4" stroke-dasharray="3 2"/>
    <text x="158" y="309" class="mono" font-size="10" fill="#57534e" text-anchor="middle">DEAD</text>

    <rect x="220" y="288" width="84" height="34" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="262" y="304" class="mono" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">{0,1} CRASH</text>
    <text x="262" y="317" class="mono" font-size="10" fill="#dc2626" text-anchor="middle">sent to p2</text>

    <line x1="304" y1="305" x2="322" y2="305" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-blue)"/>

    <rect x="324" y="288" width="84" height="34" rx="5" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
    <text x="366" y="309" class="mono" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="middle">W={0, 1}</text>

    <rect x="428" y="288" width="84" height="34" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="470" y="309" class="mono" font-size="10.5" font-weight="700" fill="#991b1b" text-anchor="middle">W={1}</text>

    <text x="366" y="346" class="sans" font-size="10.5" font-weight="600" fill="#991b1b" text-anchor="middle">Stop at f=2? DISAGREE! min(p2)=0 vs min(p3)=1</text>
  </g>

  <!-- Round 3 (= f+1) -->
  <rect x="40" y="376" width="492" height="90" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.2"/>
  <text x="52" y="398" class="mono" font-size="11" font-weight="700" fill="#065f46">r = 3</text>
  <text x="52" y="414" class="mono" font-size="10" fill="#065f46">(f+1)</text>
  <g class="ph3">
    <rect x="116" y="388" width="84" height="34" rx="5" fill="#f5f1e8" stroke="#d6d0c4" stroke-dasharray="3 2"/>
    <text x="158" y="409" class="mono" font-size="10" fill="#57534e" text-anchor="middle">DEAD</text>

    <rect x="220" y="388" width="84" height="34" rx="5" fill="#f5f1e8" stroke="#d6d0c4" stroke-dasharray="3 2"/>
    <text x="262" y="409" class="mono" font-size="10" fill="#57534e" text-anchor="middle">DEAD</text>

    <rect x="324" y="388" width="84" height="34" rx="5" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.8"/>
    <text x="366" y="409" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">W={0, 1}</text>

    <line x1="408" y1="405" x2="426" y2="405" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr-emerald)"/>

    <rect x="428" y="388" width="84" height="34" rx="5" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.8"/>
    <text x="470" y="409" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">W={0, 1}</text>

    <text x="366" y="446" class="sans" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">Crash-free round r*! Both decide min(W) = 0</text>
  </g>

  <!-- FloodSet Pigeonhole Box -->
  <rect x="40" y="476" width="492" height="48" rx="6" fill="#f5f1e8" stroke="#d6d0c4"/>
  <text x="54" y="497" class="mono" font-size="10.5" font-weight="700" fill="#065f46">Pigeonhole Invariant: &lt;= f crashes across f+1 rounds</text>
  <text x="54" y="514" class="sans" font-size="10.5" fill="#065f46">At least one round r* has zero crashes, syncing W across all live nodes.</text>

  <!-- RIGHT PANEL: BEN-OR RANDOMIZED CONSENSUS -->
  <rect x="572" y="76" width="524" height="464" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="590" y="102" class="sans" font-size="14" font-weight="700" fill="#1c1917">2. Ben-Or Async Randomized (n = 5, f = 2, wait n-f = 3)</text>
  <text x="590" y="120" class="mono" font-size="10.5" fill="#44403c">n &gt; 2f · Maj &gt; n/2 (3/5) · Decide if &gt;= f+1 (3) match · Else flip coin</text>

  <!-- Round 1 Phase R -->
  <rect x="590" y="136" width="488" height="106" rx="8" fill="#faf8f5" stroke="#d6d0c4"/>
  <text x="604" y="156" class="mono" font-size="11" font-weight="700" fill="#065f46">Round 1 · Phase R (Report x_p)</text>
  <g class="ph1">
    <rect x="604" y="168" width="76" height="32" rx="5" fill="#f0fdf9" stroke="#0f766e"/>
    <text x="642" y="188" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">p0: x=0</text>
    <rect x="688" y="168" width="76" height="32" rx="5" fill="#f0fdf9" stroke="#0f766e"/>
    <text x="726" y="188" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">p1: x=1</text>
    <rect x="772" y="168" width="76" height="32" rx="5" fill="#f0fdf9" stroke="#0f766e"/>
    <text x="810" y="188" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">p2: x=1</text>
    <rect x="856" y="168" width="60" height="32" rx="5" fill="#f5f1e8" stroke="#d6d0c4" stroke-dasharray="3 2"/>
    <text x="886" y="188" class="mono" font-size="10" fill="#57534e" text-anchor="middle">p3,4 down</text>

    <line x1="922" y1="184" x2="944" y2="184" stroke="#b45309" stroke-width="2" marker-end="url(#arr-amber)"/>
    <rect x="948" y="164" width="118" height="40" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
    <text x="1007" y="181" class="mono" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">Sample [0,1,1]</text>
    <text x="1007" y="196" class="mono" font-size="10" fill="#b45309" text-anchor="middle">prop &lt;- bot</text>

    <text x="604" y="226" class="sans" font-size="10.5" fill="#44403c">Count(1) = 2 &lt;= n/2 (2.5) -&gt; No strict majority; propose bot (⊥).</text>
  </g>

  <!-- Round 1 Phase P (Coin Flip) -->
  <rect x="590" y="252" width="488" height="104" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <text x="604" y="272" class="mono" font-size="11" font-weight="700" fill="#92400e">Round 1 · Phase P (Proposals &amp; Local Coin Flip)</text>
  <g class="ph2">
    <text x="604" y="294" class="mono" font-size="10.5" fill="#44403c">Received: [⊥, ⊥, ⊥]  -&gt;  0 &lt; 1 non-⊥  -&gt;  x_p &lt;- random bit</text>

    <g class="coin">
      <circle cx="642" cy="326" r="16" fill="#b45309" stroke="#ffffff" stroke-width="2"/>
      <text x="642" y="330" class="mono" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    </g>
    <text x="668" y="330" class="mono" font-size="10" fill="#92400e">p0 flips 1</text>

    <g class="coin">
      <circle cx="772" cy="326" r="16" fill="#b45309" stroke="#ffffff" stroke-width="2"/>
      <text x="772" y="330" class="mono" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    </g>
    <text x="798" y="330" class="mono" font-size="10" fill="#92400e">p1 flips 1</text>

    <g class="coin">
      <circle cx="902" cy="326" r="16" fill="#b45309" stroke="#ffffff" stroke-width="2"/>
      <text x="902" y="330" class="mono" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    </g>
    <text x="928" y="330" class="mono" font-size="10" fill="#92400e">p2 flips 1</text>

    <text x="1008" y="330" class="mono" font-size="10" font-weight="700" fill="#0f766e">P(all=1) &gt;= 2^-n</text>
  </g>

  <!-- Round 2 Phase R -> P (Decision) -->
  <rect x="590" y="366" width="488" height="100" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.2"/>
  <text x="604" y="386" class="mono" font-size="11" font-weight="700" fill="#065f46">Round 2 · Phase R &amp; Phase P (Quorum Intersection Locks Value)</text>
  <g class="ph3">
    <rect x="604" y="398" width="140" height="32" rx="6" fill="#ffffff" stroke="#0f766e"/>
    <text x="674" y="418" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">R: [1, 1, 1] &gt; n/2</text>

    <line x1="744" y1="414" x2="770" y2="414" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-emerald)"/>

    <rect x="774" y="398" width="144" height="32" rx="6" fill="#ffffff" stroke="#0f766e"/>
    <text x="846" y="418" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">P: 3 &gt;= f+1 (1s)</text>

    <line x1="918" y1="414" x2="944" y2="414" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-emerald)"/>
  </g>
  <g class="ph4">
    <rect x="948" y="396" width="118" height="36" rx="6" fill="#0f766e"/>
    <text x="1007" y="418" class="mono" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">DECIDE 1</text>
    <text x="604" y="452" class="sans" font-size="10.5" font-weight="600" fill="#065f46">Agreement: (n-f) + (f+1) &gt; n guarantees every peer adopts 1.</text>
  </g>

  <!-- Ben-Or Summary Box -->
  <rect x="590" y="476" width="488" height="48" rx="6" fill="#f5f1e8" stroke="#d6d0c4"/>
  <text x="604" y="497" class="mono" font-size="10.5" font-weight="700" fill="#065f46">Safety Always · Liveness w.p. 1 (Evades FLP Determinism)</text>
  <text x="604" y="514" class="sans" font-size="10.5" fill="#065f46">Local coins take O(2^n) worst-case; Rabin shared common coin gives O(1) rounds.</text>

  <!-- FOOTER STEP BAR -->
  <rect x="24" y="554" width="256" height="48" rx="8" fill="#f0fdf9" class="s1"/>
  <text x="38" y="574" class="mono" font-size="10.5" font-weight="700" fill="#065f46">1. Round 1 Partial Send</text>
  <text x="38" y="591" class="sans" font-size="10" fill="#44403c">FloodSet p0 crashes; Ben-Or hits ⊥</text>

  <rect x="296" y="554" width="256" height="48" rx="8" fill="#fef2f2" class="s2"/>
  <text x="310" y="574" class="mono" font-size="10.5" font-weight="700" fill="#991b1b">2. f Rounds Insufficient / Coin</text>
  <text x="310" y="591" class="sans" font-size="10" fill="#44403c">p2 vs p3 split at r=f; Ben-Or flips coin</text>

  <rect x="568" y="554" width="256" height="48" rx="8" fill="#fffbeb" class="s3"/>
  <text x="582" y="574" class="mono" font-size="10.5" font-weight="700" fill="#92400e">3. Crash-Free r* / Aligned R</text>
  <text x="582" y="591" class="sans" font-size="10" fill="#44403c">r=f+1 relays {0,1}; coins match &gt; n/2</text>

  <rect x="840" y="554" width="256" height="48" rx="8" fill="#f0fdf9" class="s4"/>
  <text x="854" y="574" class="mono" font-size="10.5" font-weight="700" fill="#065f46">4. Unanimous Agreement</text>
  <text x="854" y="591" class="sans" font-size="10" fill="#44403c">FloodSet decides 0; Ben-Or decides 1</text>
</svg>
