<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" role="img" aria-labelledby="title desc">
  <title id="title">TLS 1.3 1-RTT Handshake, X25519MLKEM768 Post-Quantum Hybrid, and HKDF Key Schedule</title>
  <desc id="desc">Animated illustration of TLS 1.3 (RFC 8446) with Post-Quantum Hybrid Key Exchange X25519MLKEM768 (RFC 10024) and the HKDF key schedule (RFC 5869). Top panel traces the 1-RTT handshake: ClientHello with hybrid key_share (32B X25519 + 1184B ML-KEM-768 = 1216B, spanning 2 TCP segments past 1500B MTU), ServerHello + encrypted EncryptedExtensions, Certificate, CertificateVerify, Finished, and Client Finished + 1-RTT application data. Bottom panel animates the 3-stage HKDF-Extract pipeline: Early Secret (from PSK or 0), Handshake Secret (mixing X25519_SS concatenated with MLKEM768_SS), and Master Secret (deriving bidirectional application traffic keys).</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* 16s loop:
       0-25%: Flight 1 ClientHello (X25519MLKEM768) + HKDF Stage 1 Early Secret
       25-55%: Flight 2 ServerHello + {EE, Cert, CertVerify, Fin} + HKDF Stage 2 Handshake Secret
       55-80%: Flight 3 Client {Finished} + {App Data} + HKDF Stage 3 Master Secret
       80-100%: 1-RTT Bidirectional Encrypted App Data
    */
    @keyframes msg-1 {
      0%, 2%   { transform: translateX(0px); opacity: 0; }
      5%       { transform: translateX(0px); opacity: 1; }
      22%      { transform: translateX(350px); opacity: 1; }
      25%, 100%{ transform: translateX(350px); opacity: 0; }
    }
    @keyframes msg-2 {
      0%, 26%  { transform: translateX(0px); opacity: 0; }
      29%      { transform: translateX(0px); opacity: 1; }
      48%      { transform: translateX(-350px); opacity: 1; }
      52%, 100%{ transform: translateX(-350px); opacity: 0; }
    }
    @keyframes msg-3 {
      0%, 54%  { transform: translateX(0px); opacity: 0; }
      57%      { transform: translateX(0px); opacity: 1; }
      74%      { transform: translateX(350px); opacity: 1; }
      78%, 100%{ transform: translateX(350px); opacity: 0; }
    }

    @keyframes hkdf-1 {
      0%, 24%  { stroke: #d97706; stroke-width: 2.5; opacity: 1; }
      25%, 100%{ stroke: #fcd34d; stroke-width: 1.2; opacity: 0.65; }
    }
    @keyframes hkdf-2 {
      0%, 24%  { stroke: #c4b5fd; stroke-width: 1.2; opacity: 0.65; }
      25%, 54% { stroke: #7c3aed; stroke-width: 2.5; opacity: 1; }
      55%, 100%{ stroke: #c4b5fd; stroke-width: 1.2; opacity: 0.65; }
    }
    @keyframes hkdf-3 {
      0%, 54%  { stroke: #6ee7b7; stroke-width: 1.2; opacity: 0.65; }
      55%, 100%{ stroke: #059669; stroke-width: 2.5; opacity: 1; }
    }

    .m1 { animation: msg-1 16s ease-in-out infinite; }
    .m2 { animation: msg-2 16s ease-in-out infinite; }
    .m3 { animation: msg-3 16s ease-in-out infinite; }
    .h1 { animation: hkdf-1 16s linear infinite; }
    .h2 { animation: hkdf-2 16s linear infinite; }
    .h3 { animation: hkdf-3 16s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .m1, .m2, .m3, .h1, .h2, .h3 { animation: none !important; }
      .m1, .m2, .m3 { opacity: 0 !important; }
      .h1, .h2, .h3 { opacity: 1 !important; }
    }
  </style>

  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1120" height="640" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="1120" height="60" rx="12" fill="#0f172a"/>
  <rect x="0" y="44" width="1120" height="16" fill="#0f172a"/>
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#f8fafc">Module 09 — TLS 1.3 1-RTT Handshake, HKDF Schedule &amp; X25519MLKEM768</text>
  <text x="24" y="47" class="sans" font-size="12" fill="#94a3b8">RFC 8446 Ephemeral PFS + Encrypted Handshake · RFC 10024 Post-Quantum Hybrid KEM · RFC 5869 Extract-and-Expand Key Schedule</text>

  <!-- TOP PANEL: 1-RTT HANDSHAKE + PQ HYBRID -->
  <rect x="24" y="74" width="1072" height="278" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="42" y="98" class="sans" font-size="14" font-weight="700" fill="#0f172a">1. TLS 1.3 1-RTT Handshake &amp; Post-Quantum Hybrid Key Exchange (X25519MLKEM768)</text>

  <!-- Client Box -->
  <rect x="44" y="118" width="224" height="214" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="156" y="140" class="sans" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">TLS 1.3 Client</text>
  <text x="58" y="164" class="mono" font-size="10" fill="#1e40af">Generates ephemeral keys:</text>
  <text x="58" y="180" class="mono" font-size="10" fill="#334155">• X25519 pub: 32 bytes</text>
  <text x="58" y="196" class="mono" font-size="10" fill="#5b21b6">• ML-KEM-768 ek: 1,184 bytes</text>
  <rect x="56" y="208" width="200" height="44" rx="5" fill="#fffbeb" stroke="#d97706"/>
  <text x="156" y="226" class="mono" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">ClientHello ~1.8 KB &gt; 1500B</text>
  <text x="156" y="242" class="sans" font-size="10" fill="#78350f" text-anchor="middle">Splits across 2 TCP segments!</text>
  <text x="58" y="274" class="mono" font-size="10" fill="#065f46">Derives Handshake &amp; App keys</text>
  <text x="58" y="290" class="mono" font-size="10" fill="#065f46">Verifies Cert + Finished HMAC</text>
  <text x="58" y="314" class="mono" font-size="10" font-weight="700" fill="#059669">Sends {Finished} + {HTTP/2}</text>

  <!-- Server Box -->
  <rect x="852" y="118" width="224" height="214" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="964" y="140" class="sans" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">TLS 1.3 Server</text>
  <text x="866" y="164" class="mono" font-size="10" fill="#047857">Encapsulates ML-KEM + X25519</text>
  <text x="866" y="180" class="mono" font-size="10" fill="#334155">• X25519 pub: 32 bytes</text>
  <text x="866" y="196" class="mono" font-size="10" fill="#5b21b6">• ML-KEM-768 ct: 1,088 bytes</text>
  <rect x="864" y="208" width="200" height="44" rx="5" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="964" y="226" class="mono" font-size="10" font-weight="700" fill="#5b21b6" text-anchor="middle">Shared Secret = X25519 || PQ</text>
  <text x="964" y="242" class="sans" font-size="10" fill="#4c1d95" text-anchor="middle">Encrypts Cert immediately!</text>
  <text x="866" y="274" class="mono" font-size="10" fill="#065f46">Sends ServerHello (plaintext)</text>
  <text x="866" y="290" class="mono" font-size="10" fill="#5b21b6">+ {EE, Cert, CertVerify, Fin}</text>
  <text x="866" y="314" class="mono" font-size="10" font-weight="700" fill="#059669">1-RTT complete -&gt; AEAD App</text>

  <!-- Flight Lanes -->
  <!-- Flight 1 -->
  <line x1="270" y1="156" x2="848" y2="156" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="559" y="144" class="mono" font-size="10.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">1. ClientHello + key_share: X25519MLKEM768 (1,216B) + SNI/ECH + ALPN</text>

  <!-- Flight 2 -->
  <line x1="850" y1="224" x2="272" y2="224" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-violet)"/>
  <text x="559" y="206" class="mono" font-size="10.5" font-weight="700" fill="#5b21b6" text-anchor="middle">2. ServerHello (key_share) + {EncryptedExtensions, Cert, CertVerify, Finished}</text>
  <text x="559" y="242" class="sans" font-size="10" fill="#6d28d9" text-anchor="middle">All messages in {braces} are AEAD-encrypted under Handshake Secret (hides Cert from passive sniffers)</text>

  <!-- Flight 3 -->
  <line x1="270" y1="298" x2="848" y2="298" stroke="#059669" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="559" y="286" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">3. {Finished} + {Application Data: GET /api}  (1-RTT Complete!)</text>

  <!-- Animated Flight Tokens -->
  <g class="m1">
    <rect x="290" y="145" width="150" height="22" rx="4" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
    <text x="365" y="160" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">ClientHello (1.8KB)</text>
  </g>
  <g class="m2">
    <rect x="650" y="213" width="176" height="22" rx="4" fill="#7c3aed" stroke="#ffffff" stroke-width="1.5"/>
    <text x="738" y="228" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">ServerHello + {Cert/Fin}</text>
  </g>
  <g class="m3">
    <rect x="290" y="287" width="166" height="22" rx="4" fill="#059669" stroke="#ffffff" stroke-width="1.5"/>
    <text x="373" y="302" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">{Finished} + {AppData}</text>
  </g>

  <!-- BOTTOM PANEL: HKDF KEY SCHEDULE -->
  <rect x="24" y="366" width="1072" height="206" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="42" y="390" class="sans" font-size="14" font-weight="700" fill="#0f172a">2. TLS 1.3 HKDF Key Schedule (Early Secret -&gt; Handshake Secret -&gt; Master Secret)</text>

  <!-- Stage 1: Early Secret -->
  <rect x="44" y="408" width="318" height="148" rx="8" fill="#fffbeb" class="h1"/>
  <text x="203" y="430" class="mono" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Stage 1: Early Secret</text>
  <rect x="62" y="442" width="282" height="44" rx="5" fill="#ffffff" stroke="#fcd34d"/>
  <text x="203" y="460" class="mono" font-size="10" fill="#78350f" text-anchor="middle">HKDF-Extract(salt=0, IKM=PSK or 0)</text>
  <text x="203" y="476" class="mono" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">-&gt; client_early_traffic_secret</text>
  <text x="203" y="510" class="sans" font-size="10" fill="#92400e" text-anchor="middle">Protects optional 0-RTT Early Data</text>
  <text x="203" y="528" class="mono" font-size="10" fill="#be123c" text-anchor="middle">Replay risk (RFC 8470: idempotent only)</text>

  <line x1="362" y1="482" x2="400" y2="482" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arr-violet)"/>

  <!-- Stage 2: Handshake Secret -->
  <rect x="402" y="408" width="320" height="148" rx="8" fill="#f5f3ff" class="h2"/>
  <text x="562" y="430" class="mono" font-size="12" font-weight="700" fill="#5b21b6" text-anchor="middle">Stage 2: Handshake Secret</text>
  <rect x="418" y="442" width="288" height="58" rx="5" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="562" y="460" class="mono" font-size="10" fill="#4c1d95" text-anchor="middle">salt = Derive-Secret(Early, "derived")</text>
  <text x="562" y="476" class="mono" font-size="10" font-weight="700" fill="#5b21b6" text-anchor="middle">IKM = X25519_SS || MLKEM768_SS</text>
  <text x="562" y="492" class="mono" font-size="10" fill="#6d28d9" text-anchor="middle">-&gt; client/server_handshake_secret</text>
  <text x="562" y="520" class="sans" font-size="10" fill="#4c1d95" text-anchor="middle">Encrypts Server Certificate, CertVerify,</text>
  <text x="562" y="536" class="sans" font-size="10" fill="#4c1d95" text-anchor="middle">&amp; Finished messages with fresh PFS</text>

  <line x1="722" y1="482" x2="760" y2="482" stroke="#059669" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <!-- Stage 3: Master Secret -->
  <rect x="762" y="408" width="316" height="148" rx="8" fill="#ecfdf5" class="h3"/>
  <text x="920" y="430" class="mono" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">Stage 3: Master Secret</text>
  <rect x="778" y="442" width="284" height="58" rx="5" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="920" y="460" class="mono" font-size="10" fill="#047857" text-anchor="middle">salt = Derive-Secret(HS, "derived")</text>
  <text x="920" y="476" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">HKDF-Extract(salt, IKM=0)</text>
  <text x="920" y="492" class="mono" font-size="10" fill="#047857" text-anchor="middle">-&gt; c/s_application_traffic_secret_0</text>
  <text x="920" y="520" class="sans" font-size="10" fill="#065f46" text-anchor="middle">+ resumption_master_secret (PSK)</text>
  <text x="920" y="536" class="mono" font-size="10" fill="#047857" text-anchor="middle">AEAD: AES-GCM / ChaCha20-Poly1305</text>

  <!-- FOOTER -->
  <rect x="24" y="584" width="1072" height="42" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="42" y="610" class="sans" font-size="11.5" font-weight="600" fill="#1e3a8a">Takeaway: TLS 1.3 combines X25519 + ML-KEM-768 secrets inside a 3-phase HKDF schedule to achieve 1-RTT Forward Secrecy and quantum resistance.</text>
</svg>
