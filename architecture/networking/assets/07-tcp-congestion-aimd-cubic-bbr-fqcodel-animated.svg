<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" width="1120" height="660" role="img" aria-labelledby="title desc">
  <title id="title">TCP Congestion Control: AIMD, CUBIC, Google BBR State Machine, and FQ-CoDel / tc-tbf</title>
  <desc id="desc">Four-quadrant animation of congestion control and queue management. Top-left plots AIMD sawtooth across Slow Start (exponential 2^n up to ssthresh), Congestion Avoidance (+1 MSS/RTT), and Fast Recovery (beta = 0.5) versus RTO reset to 1 MSS. Top-right plots TCP CUBIC (RFC 9438) W(t) = C(t-K)^3 + W_max showing the concave stability plateau before t=K and convex bandwidth probing after t=K with beta=0.7. Bottom-left animates Google BBR's 4-state cycle: STARTUP (2.89x gain), DRAIN (1/2.89x to 1 BDP), PROBE_BW (1.25x/0.75x/1.0x), and PROBE_RTT (every 10s, cwnd=4 for 200ms). Bottom-right illustrates FQ-CoDel per-flow sojourn time (>5ms over 100ms window) dropping heavy flows while interactive flows pass smoothly through tc-tbf token-bucket shaping.</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* 12s cycle */
    
    @keyframes bbr-s1 {
      0%, 24%  { stroke: #0f766e; stroke-width: 3; opacity: 1; }
      25%, 100%{ stroke: #99f6e4; stroke-width: 1.5; opacity: 0.65; }
    }
    @keyframes bbr-s2 {
      0%, 24%  { stroke: #fde68a; stroke-width: 1.5; opacity: 0.65; }
      25%, 49% { stroke: #b45309; stroke-width: 3; opacity: 1; }
      50%, 100%{ stroke: #fde68a; stroke-width: 1.5; opacity: 0.65; }
    }
    @keyframes bbr-s3 {
      0%, 49%  { stroke: #99f6e4; stroke-width: 1.5; opacity: 0.65; }
      50%, 74% { stroke: #0f766e; stroke-width: 3; opacity: 1; }
      75%, 100%{ stroke: #99f6e4; stroke-width: 1.5; opacity: 0.65; }
    }
    @keyframes bbr-s4 {
      0%, 74%  { stroke: #d6d0c4; stroke-width: 1.5; opacity: 0.65; }
      75%, 100%{ stroke: #0f766e; stroke-width: 3; opacity: 1; }
    }
    @keyframes codel-drop {
      0%, 45%  { transform: translateY(0px); opacity: 0.9; }
      55%, 80% { transform: translateY(24px); opacity: 1; }
      90%, 100%{ transform: translateY(0px); opacity: 0.9; }
    }

    .aimd-line  { stroke-dasharray: 560;  }
    .cubic-line { stroke-dasharray: 560;  }
    .bs1 { animation: bbr-s1 12s linear infinite; }
    .bs2 { animation: bbr-s2 12s linear infinite; }
    .bs3 { animation: bbr-s3 12s linear infinite; }
    .bs4 { animation: bbr-s4 12s linear infinite; }
    .cdrop { animation: codel-drop 12s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .aimd-line, .cubic-line, .bs1, .bs2, .bs3, .bs4, .cdrop { animation: none !important; }
      .aimd-line, .cubic-line { stroke-dashoffset: 0 !important; }
      .bs1, .bs2, .bs3, .bs4, .cdrop { opacity: 1 !important; }
      .cdrop { transform: none !important; }
    }
  </style>

  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#44403c"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1120" height="660" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>

  <!-- Header -->
  <line x1="24" y1="62" x2="1096" y2="62" stroke="#1c1917" stroke-width="1.2"/>
  
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#1c1917" font-family="Georgia, 'Times New Roman', serif">Module 07 — AIMD Sawtooth, TCP CUBIC, BBR State Machine &amp; FQ-CoDel / tc-tbf</text>
  <text x="24" y="47" class="sans" font-size="12" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">Loss-Based vs. Model-Based Kleinrock BDP Control · Active Queue Management (RFC 8290) · Linux Token Bucket Filter</text>

  <!-- QUADRANT 1: AIMD SAWTOOTH -->
  <rect x="24" y="74" width="526" height="256" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="42" y="98" class="sans" font-size="14" font-weight="700" fill="#1c1917">1. AIMD Sawtooth (Slow Start -&gt; CA -&gt; Fast Recovery)</text>

  <!-- Axes -->
  <line x1="66" y1="290" x2="520" y2="290" stroke="#44403c" stroke-width="1.8" marker-end="url(#arr-slate)"/>
  <line x1="66" y1="290" x2="66" y2="116" stroke="#44403c" stroke-width="1.8" marker-end="url(#arr-slate)"/>
  <text x="52" y="128" class="mono" font-size="10" font-weight="700" fill="#44403c" text-anchor="end">cwnd</text>
  <text x="506" y="306" class="mono" font-size="10" font-weight="700" fill="#44403c" text-anchor="end">RTT</text>

  <!-- ssthresh dashed line -->
  <line x1="66" y1="204" x2="510" y2="204" stroke="#b45309" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="74" y="198" class="mono" font-size="10" font-weight="700" fill="#92400e">ssthresh</text>

  <!-- AIMD Curve: Slow Start (66,282 -> 130,270 -> 158,204), CA (158,204 -> 266,142), 3 dupACK drop (266,216), CA (266,216 -> 368,142), RTO drop (368,282 -> 420,214 -> 496,170) -->
  <path d="M 66 282 Q 124 274 158 204 L 266 142 L 266 216 L 368 142 L 368 282 Q 406 268 424 216 L 496 170"
        fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="aimd-line"/>

  <!-- Annotations -->
  <rect x="86" y="232" width="66" height="18" rx="3" fill="#f0fdf9" stroke="#99f6e4"/>
  <text x="119" y="244" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">2^n SS</text>

  <text x="208" y="156" class="mono" font-size="10" font-weight="700" fill="#065f46">+1/RTT</text>
  <circle cx="266" cy="142" r="4.5" fill="#dc2626"/>
  <text x="274" y="140" class="mono" font-size="10" font-weight="700" fill="#991b1b">3 dupACK (-50%)</text>

  <circle cx="368" cy="142" r="4.5" fill="#dc2626"/>
  <text x="376" y="140" class="mono" font-size="10" font-weight="700" fill="#991b1b">RTO -&gt; 1 MSS</text>

  <text x="42" y="320" class="sans" font-size="10" fill="#44403c">Chiu &amp; Jain: +α additive increase &amp; ×β multiplicative decrease converge to fairness.</text>

  <!-- QUADRANT 2: TCP CUBIC -->
  <rect x="570" y="74" width="526" height="256" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="588" y="98" class="sans" font-size="14" font-weight="700" fill="#1c1917">2. TCP CUBIC Curve (RFC 9438) — RTT-Independent t</text>

  <line x1="612" y1="290" x2="1068" y2="290" stroke="#44403c" stroke-width="1.8" marker-end="url(#arr-slate)"/>
  <line x1="612" y1="290" x2="612" y2="116" stroke="#44403c" stroke-width="1.8" marker-end="url(#arr-slate)"/>
  <text x="598" y="128" class="mono" font-size="10" font-weight="700" fill="#44403c" text-anchor="end">W(t)</text>
  <text x="1056" y="306" class="mono" font-size="10" font-weight="700" fill="#44403c" text-anchor="end">Time t (s)</text>

  <!-- W_max plateau line & K marker -->
  <line x1="612" y1="184" x2="1058" y2="184" stroke="#0f766e" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="622" y="178" class="mono" font-size="10" font-weight="700" fill="#065f46">W_max (β=0.7 -&gt; 0.7·W_max)</text>
  <line x1="840" y1="184" x2="840" y2="290" stroke="#d6d0c4" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="840" y="304" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">t = K</text>

  <!-- Cubic S-curve passing inflection (840, 184) -->
  <path d="M 624 256 C 655 196, 735 184, 840 184 C 945 184, 1005 168, 1046 126"
        fill="none" stroke="#0f766e" stroke-width="3.2" stroke-linecap="round" class="cubic-line"/>
  <circle cx="840" cy="184" r="5" fill="#0f766e"/>

  <rect x="646" y="198" width="142" height="32" rx="5" fill="#f0fdf9" stroke="#99f6e4"/>
  <text x="717" y="212" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">t &lt; K: Concave</text>
  <text x="717" y="224" class="sans" font-size="10" fill="#065f46" text-anchor="middle">Stabilizes near W_max</text>

  <rect x="910" y="198" width="144" height="32" rx="5" fill="#f0fdf9" stroke="#99f6e4"/>
  <text x="982" y="212" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">t &gt; K: Convex</text>
  <text x="982" y="224" class="sans" font-size="10" fill="#065f46" text-anchor="middle">Probes new bandwidth</text>

  <text x="588" y="320" class="mono" font-size="10" fill="#065f46">W_cubic(t) = 0.4·(t − K)³ + W_max  |  K = ∛(W_max·(1−β)/C)</text>

  <!-- QUADRANT 3: GOOGLE BBR 4-STATE MACHINE -->
  <rect x="24" y="344" width="526" height="248" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="42" y="368" class="sans" font-size="14" font-weight="700" fill="#1c1917">3. Google BBR 4-State Machine (BDP = BtlBw × RTprop)</text>

  <!-- 4 states in 2x2 cycle -->
  <rect x="48" y="388" width="210" height="72" rx="8" fill="#f0fdf9" class="bs1"/>
  <text x="153" y="410" class="mono" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">1. STARTUP</text>
  <text x="153" y="428" class="mono" font-size="10" fill="#065f46" text-anchor="middle">Gain = 2/ln(2) ≈ 2.89×</text>
  <text x="153" y="444" class="sans" font-size="10" fill="#065f46" text-anchor="middle">Until BtlBw stops growing</text>

  <rect x="314" y="388" width="210" height="72" rx="8" fill="#fffbeb" class="bs2"/>
  <text x="419" y="410" class="mono" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle">2. DRAIN</text>
  <text x="419" y="428" class="mono" font-size="10" fill="#b45309" text-anchor="middle">Gain = 1 / 2.89 ≈ 0.35×</text>
  <text x="419" y="444" class="sans" font-size="10" fill="#92400e" text-anchor="middle">Drains queue back to 1 BDP</text>

  <rect x="314" y="494" width="210" height="78" rx="8" fill="#f0fdf9" class="bs3"/>
  <text x="419" y="516" class="mono" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">3. PROBE_BW (Steady)</text>
  <text x="419" y="534" class="mono" font-size="10" fill="#065f46" text-anchor="middle">8-phase: 1.25× / 0.75× / 1.0×</text>
  <text x="419" y="550" class="sans" font-size="10" fill="#065f46" text-anchor="middle">Paced at BtlBw; zero queue</text>

  <rect x="48" y="494" width="210" height="78" rx="8" fill="#f5f1e8" class="bs4"/>
  <text x="153" y="516" class="mono" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">4. PROBE_RTT (q10s)</text>
  <text x="153" y="534" class="mono" font-size="10" fill="#065f46" text-anchor="middle">Drop cwnd = 4 pkts (200ms)</text>
  <text x="153" y="550" class="sans" font-size="10" fill="#065f46" text-anchor="middle">Measures empty-pipe RTprop</text>

  <!-- Transitions -->
  <line x1="258" y1="424" x2="312" y2="424" stroke="#44403c" stroke-width="2" marker-end="url(#arr-slate)"/>
  <line x1="419" y1="460" x2="419" y2="492" stroke="#44403c" stroke-width="2" marker-end="url(#arr-slate)"/>
  <line x1="314" y1="524" x2="260" y2="524" stroke="#44403c" stroke-width="2" marker-end="url(#arr-slate)"/>
  <line x1="260" y1="544" x2="312" y2="544" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="286" y="516" class="mono" font-size="10" fill="#44403c" text-anchor="middle">10s</text>
  <text x="286" y="558" class="mono" font-size="10" fill="#065f46" text-anchor="middle">200ms</text>

  <!-- QUADRANT 4: FQ-CODEL + TC-TBF -->
  <rect x="570" y="344" width="526" height="248" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="588" y="368" class="sans" font-size="14" font-weight="700" fill="#1c1917">4. FQ-CoDel Sojourn Drop (RFC 8290) + tc-tbf Shaping</text>

  <!-- Flow Queues -->
  <rect x="588" y="388" width="224" height="58" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="700" y="408" class="mono" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">Bulk Queue (sojourn = 18ms)</text>
  <text x="700" y="425" class="mono" font-size="10" fill="#991b1b" text-anchor="middle">min &gt; 5ms over 100ms win</text>
  <text x="700" y="439" class="mono" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">CoDel Drop / ECN CE (11)</text>

  <g class="cdrop">
    <rect x="822" y="396" width="66" height="24" rx="4" fill="#dc2626"/>
    <text x="855" y="412" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">DROP/CE</text>
  </g>

  <rect x="588" y="458" width="224" height="56" rx="6" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.5"/>
  <text x="700" y="478" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">DNS/SSH Queue (sojourn 0.4ms)</text>
  <text x="700" y="495" class="sans" font-size="10" fill="#065f46" text-anchor="middle">Sparse flow priority; isolated</text>
  <text x="700" y="508" class="mono" font-size="10" font-weight="700" fill="#0f766e" text-anchor="middle">Zero Bufferbloat</text>

  <!-- tc-tbf Shaper -->
  <rect x="902" y="388" width="176" height="126" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.5"/>
  <text x="990" y="412" class="mono" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">tc-tbf Shaper</text>
  <text x="990" y="432" class="mono" font-size="10" fill="#065f46" text-anchor="middle">rate 20mbit</text>
  <text x="990" y="448" class="mono" font-size="10" fill="#065f46" text-anchor="middle">burst 10kb</text>
  <text x="990" y="464" class="mono" font-size="10" fill="#065f46" text-anchor="middle">latency 50ms</text>
  <text x="990" y="490" class="sans" font-size="10" font-weight="600" fill="#0f766e" text-anchor="middle">Smooths bursts into</text>
  <text x="990" y="504" class="sans" font-size="10" font-weight="600" fill="#0f766e" text-anchor="middle">bounded M(T)=B+r·T</text>

  <line x1="812" y1="486" x2="900" y2="466" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="588" y="526" width="490" height="52" rx="6" fill="#f5f1e8" stroke="#d6d0c4"/>
  <text x="602" y="546" class="mono" font-size="10" font-weight="700" fill="#065f46">ECN / L4S: Router sets CE (11) -&gt; Receiver echoes ECE -&gt; Sender sets CWR</text>
  <text x="602" y="564" class="sans" font-size="10" fill="#065f46">FQ-CoDel prevents bulk uploads from inflating latency on interactive RPCs.</text>

  <!-- FOOTER -->
  <rect x="24" y="604" width="1072" height="42" rx="8" fill="#f0fdf9" stroke="#99f6e4"/>
  <text x="42" y="630" class="sans" font-size="11.5" font-weight="600" fill="#065f46">Takeaway: CUBIC stabilizes loss-based scaling via real-time cubic curves, BBR paces at Kleinrock's BDP without filling queues, and FQ-CoDel keeps sojourn &lt; 5 ms.</text>
</svg>
