<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Heap-Reified TailRec Trampoline &amp; Rank-2 ST[S, A] In-Place Quicksort</title>
  <desc id="desc">Animated Module 12 runtime safety mechanisms: left panel depicts TailRec trampoline (Return, Suspend, FlatMap) interpreting deeply nested binds in an O(1)-stack flat while-loop by dynamically rotating left-nested FlatMap(FlatMap(x, f), g) into right-nested FlatMap(x, a =&gt; FlatMap(f(a), g)); right panel depicts Launchbury-Peyton Jones rank-2 polymorphism ST.runST([S] =&gt; () =&gt; ST[S, A]) permitting fast in-place STArray Quicksort locally while statically rejecting escaped STRef or STArray references.</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* 12s cycle:
       0-25%:   Step 1 — Naive IO/flatMap overflows stack vs TailRec reifies FlatMap on heap
       25-50%:  Step 2 — Associative rotation + flat @tailrec loop runs 10M steps in O(1) stack
       50-75%:  Step 3 — ST.runST allocates scoped STArray, runs in-place Quicksort, freezes List
       75-100%: Step 4 — Rank-2 quantifier forall A. (forall S. ST[S, A]) -> A blocks escape!
    */
    @keyframes p-left  { 0%, 49% { stroke: #0f766e; stroke-width: 2.2; } 50%, 100% { stroke: #d6d0c4; stroke-width: 1.4; } }
    @keyframes p-right { 0%, 49% { stroke: #d6d0c4; stroke-width: 1.4; } 50%, 100% { stroke: #0f766e; stroke-width: 2.2; } }
    @keyframes escape-deny {
      0%, 74%  { opacity: 0.86; }
      78%, 98% { opacity: 1; stroke: #dc2626; stroke-width: 2.4; }
      100%     { opacity: 0.86; }
    }
    @keyframes swap-bar {
      0%, 50%  { transform: translateX(0px); }
      62%, 72% { transform: translateX(68px); }
      80%, 100% { transform: translateX(68px); }
    }

    .pl   { animation: p-left 12s linear infinite; }
    .pr   { animation: p-right 12s linear infinite; }
    .esc  { animation: escape-deny 12s linear infinite; }
    .swp  { animation: swap-bar 12s ease-in-out infinite; }
    .flow { stroke-dasharray: 6 6;  }

    @media (prefers-reduced-motion: reduce) {
      .pl, .pr, .lp, .esc, .swp, .flow { animation: none !important; }
      .pl, .pr { stroke: #d6d0c4 !important; stroke-width: 1.5 !important; }
      .lp, .esc { opacity: 1 !important; }
      .swp { transform: none !important; }
    }
  </style>

  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1120" height="600" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>

  <!-- Header -->
  <line x1="24" y1="64" x2="1096" y2="64" stroke="#1c1917" stroke-width="1.2"/>
  
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#1c1917" font-family="Georgia, 'Times New Roman', serif">Trampolining (TailRec) &amp; Rank-2 Scoped Mutation (ST[S, A])</text>
  <text x="24" y="48" class="sans" font-size="12" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">Module 12 · Heap-Reified Return/Suspend/FlatMap O(1) Loop · Rank-2 runST Scoped In-Place STArray Quicksort</text>

  <!-- LEFT PANEL: TAILREC TRAMPOLINE -->
  <rect x="24" y="78" width="526" height="448" rx="10" fill="#ffffff" class="pl"/>
  <text x="42" y="104" class="sans" font-size="14" font-weight="700" fill="#1c1917">1. Heap-Reified TailRec Trampoline (O(1) Stack)</text>

  <!-- ADT Constructors -->
  <rect x="42" y="118" width="490" height="72" rx="7" fill="#f5f1e8" stroke="#d6d0c4"/>
  <text x="56" y="138" class="mono" font-size="10.5" font-weight="700" fill="#065f46">enum TailRec[+A]:  // Control flow as Heap Data</text>
  <text x="56" y="157" class="mono" font-size="10" fill="#065f46">Return(a)  |  Suspend(resume: () =&gt; A)  |  FlatMap(sub, k)</text>
  <text x="56" y="175" class="sans" font-size="10" fill="#065f46">Naive flatMap pushes 15,000 frames → StackOverflowError; TailRec uses 1 frame.</text>

  <!-- Flat @tailrec Loop & Re-association -->
  <rect x="42" y="204" width="490" height="214" rx="8" fill="#f0fdf9" class="lp"/>
  <text x="56" y="226" class="mono" font-size="11" font-weight="700" fill="#065f46">@tailrec def run[A](tr: TailRec[A]): A  (Flat while-loop)</text>

  <rect x="56" y="240" width="218" height="46" rx="6" fill="#ffffff" stroke="#0f766e"/>
  <text x="165" y="259" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">Return(a) / Suspend(r)</text>
  <text x="165" y="275" class="mono" font-size="10" fill="#065f46" text-anchor="middle">return a  /  return r()</text>

  <rect x="294" y="240" width="224" height="46" rx="6" fill="#ffffff" stroke="#0f766e"/>
  <text x="406" y="259" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">FlatMap(Return(a), f)</text>
  <text x="406" y="275" class="mono" font-size="10" fill="#065f46" text-anchor="middle">tail-call run(f(a))</text>

  <!-- Crucial Right-Rotation Rule -->
  <rect x="56" y="300" width="462" height="102" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
  <text x="70" y="321" class="sans" font-size="11" font-weight="700" fill="#065f46">Critical Left-Nested Re-Association (Monad Associativity):</text>
  <text x="70" y="342" class="mono" font-size="10.5" font-weight="700" fill="#991b1b">FlatMap( FlatMap(y, g), f )</text>
  <text x="280" y="342" class="mono" font-size="12" font-weight="700" fill="#0f766e">──▶</text>
  <text x="70" y="364" class="mono" font-size="10.5" font-weight="700" fill="#065f46">FlatMap( y, a =&gt; FlatMap(g(a), f) )</text>
  <text x="70" y="388" class="sans" font-size="10" fill="#44403c">Rotates arbitrary left-nested binds into right-nested heap thunks; tail-calls run(...).</text>

  <!-- Bottom note -->
  <rect x="42" y="430" width="490" height="78" rx="7" fill="#f0fdf9" stroke="#99f6e4"/>
  <text x="56" y="451" class="sans" font-size="11" font-weight="700" fill="#065f46">Generalises to Free[F[_], A] = Return | Suspend(F[A]) | FlatMap</text>
  <text x="56" y="471" class="mono" font-size="10" fill="#065f46">Swap interpreter F ~&gt; G: Console ~&gt; IO (prod) or Console ~&gt; State (test)</text>
  <text x="56" y="490" class="sans" font-size="10" fill="#065f46">10,000,000 steps execute in constant stack memory on JVM &amp; V8.</text>

  <!-- RIGHT PANEL: RANK-2 ST[S, A] QUICKSORT -->
  <rect x="570" y="78" width="526" height="448" rx="10" fill="#ffffff" class="pr"/>
  <text x="588" y="104" class="sans" font-size="14" font-weight="700" fill="#1c1917">2. Rank-2 ST[S, A] Scoped In-Place Quicksort</text>

  <!-- Rank-2 signature -->
  <rect x="588" y="118" width="490" height="66" rx="7" fill="#f5f1e8" stroke="#d6d0c4"/>
  <text x="602" y="138" class="mono" font-size="10.5" font-weight="700" fill="#065f46">runST[A](st: [S] =&gt; () =&gt; ST[S, A]): A</text>
  <text x="602" y="157" class="mono" font-size="10" fill="#065f46">Type: ∀A. (∀S. ST[S, A]) → A   (A is bound OUTSIDE ∀S!)</text>
  <text x="602" y="174" class="sans" font-size="10" fill="#065f46">Caller must work for every token S, so return type A cannot mention S.</text>

  <!-- Scoped Mutation Bubble -->
  <rect x="588" y="196" width="490" height="196" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.8" stroke-dasharray="6 3"/>
  <text x="602" y="217" class="sans" font-size="11.5" font-weight="700" fill="#065f46">Isolated Scope [S] — Contextually Pure Local Mutation:</text>

  <text x="602" y="239" class="mono" font-size="10" fill="#065f46">1. arr &lt;- STArray.fromList[S, Int](List(7, 2, 9, 4))</text>
  <text x="602" y="257" class="mono" font-size="10" fill="#065f46">2. qs(arr, 0, 3) mutates array in place via read/write/swap</text>

  <!-- Animated Array Cells -->
  <rect x="616" y="270" width="60" height="34" rx="5" fill="#ffffff" stroke="#0f766e" class="swp"/>
  <text x="646" y="292" class="mono" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">7</text>

  <rect x="684" y="270" width="60" height="34" rx="5" fill="#f0fdf9" stroke="#0f766e"/>
  <text x="714" y="292" class="mono" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">2</text>

  <rect x="752" y="270" width="60" height="34" rx="5" fill="#ffffff" stroke="#0f766e"/>
  <text x="782" y="292" class="mono" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">9</text>

  <rect x="820" y="270" width="60" height="34" rx="5" fill="#f0fdf9" stroke="#0f766e"/>
  <text x="850" y="292" class="mono" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">4</text>

  <text x="900" y="291" class="mono" font-size="11" font-weight="700" fill="#065f46">O(n log n) in-place</text>

  <text x="602" y="328" class="mono" font-size="10" font-weight="700" fill="#065f46">3. res &lt;- arr.freeze  →  returns immutable List(2, 4, 7, 9)</text>
  <rect x="602" y="342" width="462" height="36" rx="5" fill="#0f766e"/>
  <text x="833" y="364" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Pure Signature: quicksort(xs: List[Int]): List[Int]</text>

  <!-- Compile-Time Escape Rejection -->
  <rect x="588" y="404" width="490" height="104" rx="8" fill="#fef2f2" class="esc"/>
  <text x="602" y="425" class="sans" font-size="11.5" font-weight="700" fill="#991b1b">Compile-Time Rejection of Escaped References:</text>
  <text x="602" y="446" class="mono" font-size="10" font-weight="700" fill="#7f1d1d">val bad = ST.runST([S] =&gt; () =&gt; STRef[S, Int](0))  // ERROR!</text>
  <text x="602" y="466" class="sans" font-size="10" fill="#991b1b">Type checker rejects ST[S, STRef[S, Int]] because A cannot contain</text>
  <text x="602" y="484" class="sans" font-size="10" fill="#991b1b">the universally quantified state token S — zero runtime lock needed!</text>

  <!-- Footer -->
  <rect x="24" y="540" width="1072" height="44" rx="8" fill="#f0fdf9" stroke="#99f6e4" stroke-width="1"/>
  <text x="42" y="567" class="sans" font-size="11.5" font-weight="600" fill="#065f46">Takeaway: TailRec moves control flow to the heap for O(1) stack safety, while Rank-2 ST[S, A] proves local mutation cannot escape scope.</text>
</svg>
