<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Integrated Rose-Tree Shrinking — Finding Minimal Property Counterexamples</title>
  <desc id="desc">Animated Module 07 integrated Rose-Tree shrinking diagram: Tree(root, children) generated by intTree(0, 42).map(_ * 2) preserves even-number invariants across every shrunk candidate. When root 84 fails property p(x) = x &lt; 20, the shrinker scans failing children breadth-wise at each level (0 passes, 44 fails -> commit; then 0 passes, 22 fails -> commit; then 0, 12, 18 pass -> 1-minimal witness 22 reached).</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* 12s cycle:
       0-25%:   Step 1 — Root 84 falsifies prop(x): x lt 20 -> inspect level-1 children [0, 44, 64]
       25-50%:  Step 2 — 0 passes (prune), 44 FAILS -> commit and descend to 44
       50-75%:  Step 3 — Inspect level-2 children [0, 22, 34] -> 0 passes, 22 FAILS -> commit to 22
       75-100%: Step 4 — Inspect level-3 children [0, 12, 18] -> ALL PASS -> 22 is 1-minimal!
    */
    @keyframes lv1 { 0%, 24% { stroke: #dc2626; stroke-width: 2.5; opacity: 1; } 25%, 100% { stroke: #d6d0c4; stroke-width: 1.4; opacity: 0.72; } }
    @keyframes lv2 { 0%, 24% { stroke: #d6d0c4; stroke-width: 1.4; opacity: 0.72; } 25%, 49% { stroke: #b45309; stroke-width: 2.5; opacity: 1; } 50%, 100% { stroke: #d6d0c4; stroke-width: 1.4; opacity: 0.72; } }
    @keyframes lv3 { 0%, 49% { stroke: #d6d0c4; stroke-width: 1.4; opacity: 0.72; } 50%, 74% { stroke: #0f766e; stroke-width: 2.5; opacity: 1; } 75%, 100% { stroke: #d6d0c4; stroke-width: 1.4; opacity: 0.72; } }
    @keyframes lv4 { 0%, 74% { stroke: #d6d0c4; stroke-width: 1.4; opacity: 0.72; } 75%, 100% { stroke: #0f766e; stroke-width: 2.5; opacity: 1; } }

    @keyframes shrink-cursor {
      0%, 20%  { transform: translate(0px, 0px); }
      28%, 48% { transform: translate(0px, 98px); }
      54%, 72% { transform: translate(0px, 196px); }
      78%, 98% { transform: translate(0px, 196px); }
      100%     { transform: translate(0px, 0px); }
    }

    .s1 { animation: lv1 12s linear infinite; }
    .s2 { animation: lv2 12s linear infinite; }
    .s3 { animation: lv3 12s linear infinite; }
    .s4 { animation: lv4 12s linear infinite; }
    .scur { animation: shrink-cursor 12s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .s1, .s2, .s3, .s4, .scur { animation: none !important; }
      .s1, .s2, .s3, .s4 { opacity: 1 !important; stroke-width: 1.8 !important; }
      .scur { transform: translate(0px, 196px) !important; }
    }
  </style>

  <!-- Canvas -->
  <rect x="0" y="0" width="1120" height="600" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>

  <!-- Header -->
  <line x1="24" y1="64" x2="1096" y2="64" stroke="#1c1917" stroke-width="1.2"/>
  
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#1c1917" font-family="Georgia, 'Times New Roman', serif">Integrated Rose-Tree Shrinking — Invariant-Preserving Minimisation</text>
  <text x="24" y="48" class="sans" font-size="12" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">Module 07 · Tree(root, children: () =&gt; LazyList[Tree[A]]) · evenGen = intTree(0, 42).map(_ * 2) · Property: x &lt; 20</text>

  <!-- LEFT PANEL: ROSE TREE VISUALIZATION -->
  <rect x="24" y="78" width="600" height="448" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="42" y="104" class="sans" font-size="14" font-weight="700" fill="#1c1917">1. Lazy Rose-Tree Search (All Nodes Guaranteed Even)</text>

  <!-- Edges -->
  <!-- Root (324, 152) -> Level 1: (134, 250), (324, 250), (514, 250) -->
  <line x1="324" y1="172" x2="134" y2="230" stroke="#d6d0c4" stroke-width="1.8"/>
  <line x1="324" y1="172" x2="324" y2="230" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="324" y1="172" x2="514" y2="230" stroke="#d6d0c4" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Level 1 (324, 250) -> Level 2: (134, 348), (324, 348), (514, 348) -->
  <line x1="324" y1="270" x2="134" y2="328" stroke="#d6d0c4" stroke-width="1.8"/>
  <line x1="324" y1="270" x2="324" y2="328" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="324" y1="270" x2="514" y2="328" stroke="#d6d0c4" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Level 2 (324, 348) -> Level 3: (134, 446), (324, 446), (514, 446) -->
  <line x1="324" y1="368" x2="134" y2="426" stroke="#d6d0c4" stroke-width="1.8"/>
  <line x1="324" y1="368" x2="324" y2="426" stroke="#0f766e" stroke-width="2"/>
  <line x1="324" y1="368" x2="514" y2="426" stroke="#0f766e" stroke-width="2"/>

  <!-- Root Node -->
  <rect x="234" y="124" width="180" height="48" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="324" y="145" class="mono" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle">root: 84 (FAIL)</text>
  <text x="324" y="162" class="mono" font-size="10" fill="#991b1b" text-anchor="middle">42 * 2 · fails x &lt; 20</text>

  <!-- Level 1 Children -->
  <rect x="64" y="230" width="140" height="42" rx="7" fill="#f0fdf9" stroke="#0f766e"/>
  <text x="134" y="250" class="mono" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">0 (PASS)</text>
  <text x="134" y="264" class="sans" font-size="10" fill="#065f46" text-anchor="middle">Prune subtree</text>

  <rect x="254" y="230" width="140" height="42" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="324" y="250" class="mono" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="middle">44 (FAIL)</text>
  <text x="324" y="264" class="sans" font-size="10" fill="#991b1b" text-anchor="middle">22 * 2 · Commit!</text>

  <rect x="444" y="230" width="140" height="42" rx="7" fill="#f5f1e8" stroke="#d6d0c4"/>
  <text x="514" y="250" class="mono" font-size="11.5" font-weight="600" fill="#57534e" text-anchor="middle">64 (Skipped)</text>
  <text x="514" y="264" class="sans" font-size="10" fill="#57534e" text-anchor="middle">Lazy tail unforced</text>

  <!-- Level 2 Children -->
  <rect x="64" y="328" width="140" height="42" rx="7" fill="#f0fdf9" stroke="#0f766e"/>
  <text x="134" y="348" class="mono" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">0 (PASS)</text>
  <text x="134" y="362" class="sans" font-size="10" fill="#065f46" text-anchor="middle">Prune subtree</text>

  <rect x="242" y="326" width="164" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="324" y="347" class="mono" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">22 (1-MINIMAL!)</text>
  <text x="324" y="363" class="sans" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">11 * 2 · Smallest fail</text>

  <rect x="444" y="328" width="140" height="42" rx="7" fill="#f5f1e8" stroke="#d6d0c4"/>
  <text x="514" y="348" class="mono" font-size="11.5" font-weight="600" fill="#57534e" text-anchor="middle">34 (Skipped)</text>
  <text x="514" y="362" class="sans" font-size="10" fill="#57534e" text-anchor="middle">Lazy tail unforced</text>

  <!-- Level 3 Children (All pass!) -->
  <rect x="64" y="426" width="140" height="42" rx="7" fill="#f0fdf9" stroke="#0f766e"/>
  <text x="134" y="446" class="mono" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">0 (PASS)</text>
  <text x="134" y="460" class="sans" font-size="10" fill="#065f46" text-anchor="middle">0 &lt; 20</text>

  <rect x="254" y="426" width="140" height="42" rx="7" fill="#f0fdf9" stroke="#0f766e"/>
  <text x="324" y="446" class="mono" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">12 (PASS)</text>
  <text x="324" y="460" class="sans" font-size="10" fill="#065f46" text-anchor="middle">6 * 2 &lt; 20</text>

  <rect x="444" y="426" width="140" height="42" rx="7" fill="#f0fdf9" stroke="#0f766e"/>
  <text x="514" y="446" class="mono" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">18 (PASS)</text>
  <text x="514" y="460" class="sans" font-size="10" fill="#065f46" text-anchor="middle">9 * 2 &lt; 20</text>

  <!-- Animated Active Shrink Ring -->
  <rect x="242" y="122" width="164" height="52" rx="9" fill="none" stroke="#0f766e" stroke-width="3" stroke-dasharray="6 3" class="scur"/>

  <text x="324" y="502" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">Tree is a Monad: map &amp; flatMap preserve generator invariants automatically!</text>

  <!-- RIGHT PANEL: STEP TRACE & WHY TYPE-DIRECTED SHRINK[A] FAILS -->
  <rect x="644" y="78" width="452" height="448" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="662" y="104" class="sans" font-size="14" font-weight="700" fill="#1c1917">2. Step-by-Step Descent &amp; Invariant Proof</text>

  <rect x="662" y="120" width="416" height="66" rx="7" fill="#fef2f2" class="s1"/>
  <text x="676" y="140" class="mono" font-size="10.5" font-weight="700" fill="#991b1b">1. Initial Failure at root = 84</text>
  <text x="676" y="159" class="sans" font-size="10" fill="#7f1d1d">Test fails on 84; inspect lazy children [0, 44, 64].</text>
  <text x="676" y="175" class="mono" font-size="10" fill="#991b1b">All candidates mapped by (_ * 2) → never odd!</text>

  <rect x="662" y="196" width="416" height="66" rx="7" fill="#fffbeb" class="s2"/>
  <text x="676" y="216" class="mono" font-size="10.5" font-weight="700" fill="#92400e">2. Scan Level 1 → Commit to 44</text>
  <text x="676" y="235" class="sans" font-size="10" fill="#92400e">0 passes property (skip). 44 fails → descend immediately.</text>
  <text x="676" y="251" class="mono" font-size="10" fill="#b45309">64 is never forced from LazyList tail.</text>

  <rect x="662" y="272" width="416" height="66" rx="7" fill="#f0fdf9" class="s3"/>
  <text x="676" y="292" class="mono" font-size="10.5" font-weight="700" fill="#065f46">3. Scan Level 2 → Commit to 22</text>
  <text x="676" y="311" class="sans" font-size="10" fill="#065f46">0 passes property. 22 fails → descend to 22's children.</text>
  <text x="676" y="327" class="mono" font-size="10" fill="#0f766e">Candidate 21 (odd) is impossible in Tree!</text>

  <rect x="662" y="348" width="416" height="72" rx="7" fill="#f0fdf9" class="s4"/>
  <text x="676" y="368" class="mono" font-size="10.5" font-weight="700" fill="#065f46">4. Level 3 Children All Pass → Stop at 22</text>
  <text x="676" y="387" class="sans" font-size="10" fill="#065f46">0, 12, and 18 all satisfy (x &lt; 20). No smaller failing child exists.</text>
  <text x="676" y="405" class="mono" font-size="10" font-weight="700" fill="#065f46">Result: 22 (1-minimal valid even counterexample)</text>

  <!-- Comparison box -->
  <rect x="662" y="432" width="416" height="78" rx="7" fill="#f5f1e8" stroke="#d6d0c4"/>
  <text x="676" y="452" class="sans" font-size="11" font-weight="700" fill="#065f46">Why Separate Shrink[A] Fails:</text>
  <text x="676" y="470" class="sans" font-size="10" fill="#065f46">• Shrink[Int] proposes 41 or 21, violating evenGen invariant.</text>
  <text x="676" y="486" class="sans" font-size="10" fill="#065f46">• Hypothesis choice-sequence shrinking goes further across flatMap.</text>

  <!-- Footer -->
  <rect x="24" y="540" width="1072" height="44" rx="8" fill="#f0fdf9" stroke="#99f6e4" stroke-width="1"/>
  <text x="42" y="567" class="sans" font-size="11.5" font-weight="600" fill="#065f46">Takeaway: Integrated Rose-Tree shrinking couples generation and minimisation in a Monad so shrunk witnesses never break map/flatMap invariants.</text>
</svg>
