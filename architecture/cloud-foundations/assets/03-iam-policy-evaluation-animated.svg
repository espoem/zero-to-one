<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Cloud IAM Deterministic Policy Evaluation Pipeline</title>
  <desc id="desc">Animated step-by-step cloud IAM authorization evaluation pipeline from Module 03: every incoming request starts in an implicit default-deny state, checks all applicable policies for an absorbing Explicit Deny (short-circuiting immediately to DENIED_EXPLICIT), then checks for an Explicit Allow (granting ALLOWED, or requiring both identity and resource policies for cross-account access), and otherwise falls through to DENIED_DEFAULT.</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* 12s cycle:
       0-25%:   Step 1 — Request enters in Implicit Deny baseline
       25-50%:  Step 2 — Explicit Deny check (Absorbing element short-circuit)
       50-75%:  Step 3 — Explicit Allow check (Same-account union vs Cross-account intersection)
       75-100%: Step 4 — Default Implicit Deny fallback
    */
    @keyframes st-1 { 0%, 24% { stroke: #2563eb; stroke-width: 2.5; opacity: 1; } 25%, 100% { stroke: #cbd5e1; stroke-width: 1.4; opacity: 0.72; } }
    @keyframes st-2 { 0%, 24% { stroke: #cbd5e1; stroke-width: 1.4; opacity: 0.72; } 25%, 49% { stroke: #e11d48; stroke-width: 2.5; opacity: 1; } 50%, 100% { stroke: #cbd5e1; stroke-width: 1.4; opacity: 0.72; } }
    @keyframes st-3 { 0%, 49% { stroke: #cbd5e1; stroke-width: 1.4; opacity: 0.72; } 50%, 74% { stroke: #059669; stroke-width: 2.5; opacity: 1; } 75%, 100% { stroke: #cbd5e1; stroke-width: 1.4; opacity: 0.72; } }
    @keyframes st-4 { 0%, 74% { stroke: #cbd5e1; stroke-width: 1.4; opacity: 0.72; } 75%, 100% { stroke: #d97706; stroke-width: 2.5; opacity: 1; } }

    @keyframes dash { to { stroke-dashoffset: -24; } }
    @keyframes req-token {
      0%, 5%   { transform: translate(0px, 0px); opacity: 1; }
      25%, 46% { transform: translate(234px, 0px); opacity: 1; }
      52%, 72% { transform: translate(496px, 0px); opacity: 1; }
      78%, 96% { transform: translate(758px, 0px); opacity: 1; }
      100%     { transform: translate(0px, 0px); opacity: 0; }
    }

    .p1 { animation: st-1 12s linear infinite; }
    .p2 { animation: st-2 12s linear infinite; }
    .p3 { animation: st-3 12s linear infinite; }
    .p4 { animation: st-4 12s linear infinite; }
    .flow { stroke-dasharray: 6 6; animation: dash 1.2s linear infinite; }
    .tok  { animation: req-token 12s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .p1, .p2, .p3, .p4, .flow, .tok { animation: none !important; }
      .p1, .p2, .p3, .p4 { opacity: 1 !important; stroke-width: 1.8 !important; }
      .tok { opacity: 0 !important; }
    }
  </style>

  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1120" height="560" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="1120" height="62" rx="12" fill="#0f172a"/>
  <rect x="0" y="46" width="1120" height="16" fill="#0f172a"/>
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#f8fafc">Cloud IAM Policy Evaluation — Deterministic Decision Algebra</text>
  <text x="24" y="48" class="sans" font-size="12" fill="#94a3b8">Module 03 · Default-Deny Baseline · Explicit Deny Absorbing Short-Circuit → Explicit Allow → Implicit Deny Fallback</text>

  <!-- Stage 1: Incoming Request -->
  <rect x="24" y="88" width="212" height="166" rx="10" fill="#ffffff" class="p1"/>
  <rect x="38" y="102" width="66" height="22" rx="5" fill="#2563eb"/>
  <text x="71" y="117" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">STEP 1</text>
  <text x="114" y="117" class="sans" font-size="13" font-weight="700" fill="#0f172a">Request Tuple</text>
  <rect x="38" y="136" width="184" height="104" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="50" y="156" class="mono" font-size="10.5" font-weight="700" fill="#1e3a8a">Principal: role/app</text>
  <text x="50" y="175" class="mono" font-size="10.5" fill="#1e40af">Action: s3:GetObject</text>
  <text x="50" y="194" class="mono" font-size="10.5" fill="#1e40af">Resource: arn:bucket</text>
  <text x="50" y="213" class="mono" font-size="10.5" fill="#1e40af">Context: {srcIp, vpc}</text>
  <text x="50" y="231" class="sans" font-size="10" font-weight="700" fill="#2563eb">Starts in Deny state</text>

  <line x1="240" y1="171" x2="276" y2="171" stroke="#475569" stroke-width="2" class="flow" marker-end="url(#arr-slate)"/>

  <!-- Stage 2: Explicit Deny -->
  <rect x="280" y="88" width="234" height="166" rx="10" fill="#ffffff" class="p2"/>
  <rect x="294" y="102" width="66" height="22" rx="5" fill="#e11d48"/>
  <text x="327" y="117" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">STEP 2</text>
  <text x="370" y="117" class="sans" font-size="13" font-weight="700" fill="#0f172a">Explicit Deny?</text>
  <rect x="294" y="136" width="206" height="104" rx="6" fill="#fff1f2" stroke="#fda4af"/>
  <text x="397" y="158" class="sans" font-size="11" font-weight="700" fill="#9f1239" text-anchor="middle">Any matching Effect: Deny?</text>
  <text x="397" y="178" class="mono" font-size="10" fill="#881337" text-anchor="middle">SCPs · Boundary · Identity ·</text>
  <text x="397" y="194" class="mono" font-size="10" fill="#881337" text-anchor="middle">Resource Policy</text>
  <text x="397" y="216" class="sans" font-size="10" font-weight="700" fill="#e11d48" text-anchor="middle">Absorbing Element: overrides</text>
  <text x="397" y="230" class="sans" font-size="10" font-weight="700" fill="#e11d48" text-anchor="middle">ALL Allow statements!</text>

  <!-- YES branch down from Step 2 -->
  <line x1="397" y1="256" x2="397" y2="296" stroke="#e11d48" stroke-width="2" marker-end="url(#arr-rose)"/>
  <rect x="405" y="264" width="42" height="18" rx="4" fill="#e11d48"/>
  <text x="426" y="277" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">YES</text>
  <rect x="294" y="302" width="206" height="44" rx="7" fill="#e11d48"/>
  <text x="397" y="323" class="mono" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">DENIED_EXPLICIT</text>
  <text x="397" y="338" class="sans" font-size="10" fill="#ffe4e6" text-anchor="middle">Short-circuit halt immediately</text>

  <!-- NO branch from Step 2 to Step 3 -->
  <line x1="518" y1="171" x2="554" y2="171" stroke="#475569" stroke-width="2" class="flow" marker-end="url(#arr-slate)"/>
  <text x="536" y="162" class="mono" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">NO</text>

  <!-- Stage 3: Explicit Allow -->
  <rect x="558" y="88" width="246" height="166" rx="10" fill="#ffffff" class="p3"/>
  <rect x="572" y="102" width="66" height="22" rx="5" fill="#059669"/>
  <text x="605" y="117" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">STEP 3</text>
  <text x="648" y="117" class="sans" font-size="13" font-weight="700" fill="#0f172a">Explicit Allow?</text>
  <rect x="572" y="136" width="218" height="104" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="681" y="158" class="sans" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">Matching Effect: Allow?</text>
  <text x="681" y="178" class="mono" font-size="10" fill="#047857" text-anchor="middle">Same-Account: Id OR Res</text>
  <text x="681" y="196" class="mono" font-size="10" fill="#047857" text-anchor="middle">Cross-Account: Id AND Res</text>
  <text x="681" y="218" class="sans" font-size="10" fill="#065f46" text-anchor="middle">+ Permission Boundary &amp; SCP</text>
  <text x="681" y="232" class="sans" font-size="10" fill="#065f46" text-anchor="middle">must also allow action</text>

  <!-- YES branch down from Step 3 -->
  <line x1="681" y1="256" x2="681" y2="296" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="689" y="264" width="42" height="18" rx="4" fill="#059669"/>
  <text x="710" y="277" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">YES</text>
  <rect x="572" y="302" width="218" height="44" rx="7" fill="#059669"/>
  <text x="681" y="323" class="mono" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">ALLOWED</text>
  <text x="681" y="338" class="sans" font-size="10" fill="#d1fae5" text-anchor="middle">Request authorized &amp; logged</text>

  <!-- NO branch from Step 3 to Step 4 -->
  <line x1="808" y1="171" x2="844" y2="171" stroke="#475569" stroke-width="2" class="flow" marker-end="url(#arr-slate)"/>
  <text x="826" y="162" class="mono" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">NO</text>

  <!-- Stage 4: Implicit Deny Default -->
  <rect x="848" y="88" width="248" height="166" rx="10" fill="#ffffff" class="p4"/>
  <rect x="862" y="102" width="66" height="22" rx="5" fill="#d97706"/>
  <text x="895" y="117" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">STEP 4</text>
  <text x="938" y="117" class="sans" font-size="13" font-weight="700" fill="#0f172a">Implicit Deny</text>
  <rect x="862" y="136" width="220" height="104" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="972" y="158" class="mono" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">DENIED_DEFAULT</text>
  <text x="972" y="180" class="sans" font-size="10" fill="#78350f" text-anchor="middle">No Allow matched all constraints.</text>
  <text x="972" y="198" class="sans" font-size="10" fill="#78350f" text-anchor="middle">Fail-closed security posture:</text>
  <text x="972" y="216" class="sans" font-size="10" fill="#78350f" text-anchor="middle">omission never grants access.</text>

  <!-- Animated request cursor along the pipeline -->
  <g class="tok">
    <circle cx="130" cy="78" r="9" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
    <text x="130" y="82" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">R</text>
  </g>

  <!-- Bottom Precedence & Algebra Card -->
  <rect x="24" y="366" width="1072" height="122" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="42" y="392" class="sans" font-size="13.5" font-weight="700" fill="#0f172a">Evaluation Invariants: Single-Account Union vs. Cross-Account Intersection</text>

  <rect x="42" y="406" width="508" height="66" rx="7" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="56" y="427" class="mono" font-size="10.5" font-weight="700" fill="#5b21b6">Same Account: Decision = (IdAllow ∨ ResAllow) ∧ ¬AnyDeny</text>
  <text x="56" y="447" class="sans" font-size="10" fill="#4c1d95">Identity policy OR resource policy may allow; SCPs &amp; Boundaries still intersect.</text>

  <rect x="570" y="406" width="508" height="66" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="584" y="427" class="mono" font-size="10.5" font-weight="700" fill="#1e3a8a">Cross Account: Decision = IdAllow ∧ ResAllow ∧ ¬AnyDeny</text>
  <text x="584" y="447" class="sans" font-size="10" fill="#1e40af">Both Account A identity policy AND Account B resource policy must explicitly allow.</text>

  <!-- Footer -->
  <rect x="24" y="502" width="1072" height="44" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="42" y="529" class="sans" font-size="11.5" font-weight="600" fill="#065f46">Takeaway: IAM evaluation is order-independent and deterministic — Explicit Deny always absorbs, Explicit Allow grants if boundaries pass, default is Deny.</text>
</svg>
