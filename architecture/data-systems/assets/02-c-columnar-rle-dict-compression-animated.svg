<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Columnar Storage Compression: Dictionary and Run-Length Encoding</title>
  <desc id="desc">Animated columnar compression pipeline converting a contiguous Country column ['US','US','US','CZ','CZ'] via Dictionary Encoding ({'US':0, 'CZ':1} to [0,0,0,1,1]) into Run-Length Encoding pairs ((0, count=3), (1, count=2)) with an AVX-512 SIMD vectorized scan callout.</desc>

  <defs>
    <style>
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

      /* 8s pipeline highlight cycle */
      @keyframes pipe-1 {
        0%, 28% { opacity: 1; }
        36%, 100% { opacity: 0.9; }
      }
      @keyframes pipe-2 {
        0%, 24% { opacity: 0.9; }
        30%, 58% { opacity: 1; }
        66%, 100% { opacity: 0.9; }
      }
      @keyframes pipe-3 {
        0%, 54% { opacity: 0.9; }
        60%, 92% { opacity: 1; }
        100% { opacity: 0.9; }
      }
      @keyframes simd-scan {
        0%, 62% { opacity: 0.88; stroke-width: 1.5; }
        70%, 92% { opacity: 1; stroke-width: 2.4; }
        100% { opacity: 0.88; stroke-width: 1.5; }
      }
      @keyframes dash-flow {
        to { stroke-dashoffset: -24; }
      }

      .p1 { animation: pipe-1 8s ease-in-out infinite; }
      .p2 { animation: pipe-2 8s ease-in-out infinite; }
      .p3 { animation: pipe-3 8s ease-in-out infinite; }
      .simd { animation: simd-scan 8s ease-in-out infinite; }
      .flow-line { stroke-dasharray: 6 4; animation: dash-flow 1.4s linear infinite; }

      @media (prefers-reduced-motion: reduce) {
        .p1, .p2, .p3, .simd, .flow-line {
          animation: none !important;
        }
        .p1, .p2, .p3, .simd {
          opacity: 1 !important;
        }
      }
    </style>

    <marker id="arr-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1080" height="540" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="1080" height="58" rx="12" fill="#0f172a"/>
  <rect x="0" y="42" width="1080" height="16" fill="#0f172a"/>
  <text x="24" y="26" class="sans" font-size="18" font-weight="700" fill="#f8fafc">Columnar Compression: Dictionary + Run-Length Encoding</text>
  <text x="24" y="46" class="sans" font-size="12" fill="#94a3b8">Contiguous column encoding enabling zero-decode SIMD vectorized predicate scans</text>

  <!-- Main Card -->
  <rect x="24" y="72" width="1032" height="448" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="24" y="72" width="1032" height="32" rx="10" fill="#f1f5f9"/>
  <rect x="24" y="94" width="1032" height="10" fill="#f1f5f9"/>
  <text x="40" y="93" class="sans" font-size="13" font-weight="700" fill="#0f172a">Columnar Pipeline: Raw Column → Dictionary Codes → RLE Pairs → SIMD Scan</text>
  <text x="1040" y="93" class="mono" font-size="11.5" fill="#475569" text-anchor="end">OLAP Vertical Storage</text>

  <!-- STAGE 1: RAW CONTIGUOUS COLUMN -->
  <g class="p1">
    <text x="44" y="130" class="sans" font-size="13" font-weight="700" fill="#334155">1. Contiguous "Country" Column (5 sorted rows)</text>
    <rect x="44" y="142" width="188" height="42" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
    <text x="138" y="168" class="mono" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">'US'</text>

    <rect x="244" y="142" width="188" height="42" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
    <text x="338" y="168" class="mono" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">'US'</text>

    <rect x="444" y="142" width="188" height="42" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
    <text x="538" y="168" class="mono" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">'US'</text>

    <rect x="644" y="142" width="188" height="42" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
    <text x="738" y="168" class="mono" font-size="13.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">'CZ'</text>

    <rect x="844" y="142" width="192" height="42" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
    <text x="940" y="168" class="mono" font-size="13.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">'CZ'</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <line x1="540" y1="184" x2="540" y2="218" stroke="#7c3aed" stroke-width="2.4" class="flow-line" marker-end="url(#arr-violet)"/>

  <!-- STAGE 2: DICTIONARY ENCODING -->
  <g class="p2">
    <rect x="44" y="222" width="992" height="92" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
    <text x="64" y="246" class="sans" font-size="13" font-weight="700" fill="#5b21b6">2. Dictionary Encoding (Variable Strings → Fixed 1-Byte Integer Codes)</text>

    <rect x="64" y="258" width="320" height="42" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3"/>
    <text x="224" y="284" class="mono" font-size="12.5" font-weight="700" fill="#4c1d95" text-anchor="middle">Dict: {'US':0, 'CZ':1}</text>

    <line x1="384" y1="279" x2="434" y2="279" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arr-violet)"/>

    <rect x="444" y="258" width="104" height="42" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3"/>
    <text x="496" y="284" class="mono" font-size="13.5" font-weight="700" fill="#5b21b6" text-anchor="middle">0</text>

    <rect x="558" y="258" width="104" height="42" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3"/>
    <text x="610" y="284" class="mono" font-size="13.5" font-weight="700" fill="#5b21b6" text-anchor="middle">0</text>

    <rect x="672" y="258" width="104" height="42" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3"/>
    <text x="724" y="284" class="mono" font-size="13.5" font-weight="700" fill="#5b21b6" text-anchor="middle">0</text>

    <rect x="786" y="258" width="104" height="42" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
    <text x="838" y="284" class="mono" font-size="13.5" font-weight="700" fill="#4c1d95" text-anchor="middle">1</text>

    <rect x="900" y="258" width="104" height="42" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
    <text x="952" y="284" class="mono" font-size="13.5" font-weight="700" fill="#4c1d95" text-anchor="middle">1</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <line x1="314" y1="314" x2="314" y2="348" stroke="#059669" stroke-width="2.4" class="flow-line" marker-end="url(#arr-emerald)"/>

  <!-- STAGE 3: RUN-LENGTH ENCODING + SIMD CALLOUT -->
  <g class="p3">
    <rect x="44" y="352" width="540" height="148" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
    <text x="64" y="378" class="sans" font-size="13" font-weight="700" fill="#065f46">3. Run-Length Encoding (RLE Pairs)</text>

    <rect x="64" y="394" width="236" height="52" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
    <text x="182" y="425" class="mono" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">(0, count=3)</text>

    <rect x="324" y="394" width="236" height="52" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
    <text x="442" y="425" class="mono" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">(1, count=2)</text>

    <text x="64" y="476" class="sans" font-size="12" fill="#065f46">1M sorted 'US' rows compress to a single (0, 1000000) pair.</text>
  </g>

  <!-- SIMD Vectorized Scan Callout -->
  <g class="simd">
    <rect x="604" y="352" width="432" height="148" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="624" y="378" class="sans" font-size="13" font-weight="700" fill="#1e3a8a">4. Vectorized SIMD Scan (Zero-Decode)</text>

    <rect x="624" y="394" width="392" height="52" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/>
    <text x="820" y="425" class="mono" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">WHERE country = 'US'  ⇒  code == 0</text>

    <text x="624" y="476" class="sans" font-size="12" fill="#1e3a8a">AVX-512 evaluates 16 integer codes per CPU clock cycle.</text>
  </g>
</svg>
