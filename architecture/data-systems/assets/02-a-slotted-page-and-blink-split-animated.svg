<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Slotted Page Indirection and Lehman-Yao B-Link Concurrent Split</title>
  <desc id="desc">Two-part storage-engine diagram: top shows an 8KB slotted page updating slot 1 offset when a tuple moves in-page without breaking external ctid pointers; bottom shows a Lehman-Yao B-Link split where a concurrent reader hits splitting Node A with High Key 12, evaluates k=18 greater than 12, and hops via right_link to sibling Node B.</desc>

  <defs>
    <style>
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

      /* 8s synchronized cycle */
      @keyframes old-ptr-fade {
        0%, 28% { opacity: 0.95; }
        42%, 88% { opacity: 0.35; }
        96%, 100% { opacity: 0.95; }
      }
      @keyframes new-ptr-active {
        0%, 25% { opacity: 0.35; stroke-dashoffset: 18; }
        40%, 88% { opacity: 1; stroke-dashoffset: 0; }
        96%, 100% { opacity: 0.35; stroke-dashoffset: 18; }
      }
      @keyframes reader-hop {
        0%, 10% { opacity: 1; transform: translate(0px, 0px); }
        24%, 44% { opacity: 1; transform: translate(0px, 24px); }
        62%, 88% { opacity: 1; transform: translate(590px, 24px); }
        95%, 100% { opacity: 1; transform: translate(0px, 0px); }
      }
      @keyframes node-b-ready {
        0%, 15% { opacity: 0.88; }
        30%, 90% { opacity: 1; }
        100% { opacity: 0.88; }
      }

      .old-ptr { animation: old-ptr-fade 8s ease-in-out infinite; }
      .new-ptr { stroke-dasharray: 260; animation: new-ptr-active 8s ease-in-out infinite; }
      .reader-hop { animation: reader-hop 8s ease-in-out infinite; }
      .node-b { animation: node-b-ready 8s ease-in-out infinite; }
      .rlink-flow { stroke-dasharray: 7 5;  }

      @media (prefers-reduced-motion: reduce) {
        .old-ptr, .new-ptr, .tuple-new, .reader-hop, .node-b, .rlink-flow {
          animation: none !important;
        }
        .old-ptr { opacity: 0.45 !important; }
        .new-ptr { opacity: 1 !important; stroke-dashoffset: 0 !important; }
        .tuple-new, .node-b { opacity: 1 !important; }
        .reader-hop {
          opacity: 1 !important;
          transform: translate(590px, 24px) !important;
        }
      }
    </style>

    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d6d0c4"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1080" height="540" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>

  <!-- Header -->
  <line x1="24" y1="60" x2="1056" y2="60" stroke="#1c1917" stroke-width="1.2"/>
  
  <text x="24" y="26" class="sans" font-size="18" font-weight="700" fill="#1c1917" font-family="Georgia, 'Times New Roman', serif">Slotted Page Indirection &amp; Lehman-Yao B-Link Split</text>
  <text x="24" y="46" class="sans" font-size="12" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">In-page slot pointer stability on tuple relocation and lock-free horizontal right_link traversal</text>

  <!-- TOP PANEL: 8KB SLOTTED PAGE -->
  <rect x="24" y="72" width="1032" height="168" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <rect x="24" y="72" width="1032" height="30" rx="10" fill="#f5f1e8"/>
  <rect x="24" y="92" width="1032" height="10" fill="#f5f1e8"/>
  <text x="40" y="92" class="sans" font-size="13" font-weight="700" fill="#1c1917">1. 8KB Slotted Page: Slot Indirection Preserves External ctid Pointers</text>
  <text x="1040" y="92" class="mono" font-size="11.5" fill="#44403c" text-anchor="end">ctid = (blk, slot_idx)</text>

  <!-- Page Layout Sections -->
  <rect x="40" y="114" width="136" height="56" rx="4" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.3"/>
  <text x="108" y="137" class="mono" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">Header</text>
  <text x="108" y="155" class="mono" font-size="11" fill="#065f46" text-anchor="middle">LSN, lo, hi</text>

  <rect x="176" y="114" width="234" height="56" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.3"/>
  <text x="293" y="136" class="mono" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">Slots [0..n] →</text>
  <text x="293" y="155" class="mono" font-size="11" fill="#44403c" text-anchor="middle">slot[1] updates offset</text>

  <rect x="410" y="114" width="144" height="56" fill="#faf8f5" stroke="#d6d0c4" stroke-dasharray="4 3" stroke-width="1.3"/>
  <text x="482" y="137" class="sans" font-size="12" font-weight="700" fill="#57534e" text-anchor="middle">Free Gap</text>
  <text x="482" y="155" class="mono" font-size="11" fill="#57534e" text-anchor="middle">lower ↔ upper</text>

  <rect x="554" y="114" width="340" height="56" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.3"/>
  <text x="724" y="134" class="mono" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">← Tuple Heap (grows upward)</text>

  <rect x="568" y="142" width="146" height="22" rx="4" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.2" class="tuple-new"/>
  <text x="641" y="157" class="mono" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">T1' @ 7640 (new)</text>

  <rect x="728" y="142" width="152" height="22" rx="4" fill="#f5f1e8" stroke="#d6d0c4" stroke-width="1.1" class="old-ptr"/>
  <text x="804" y="157" class="mono" font-size="11" fill="#44403c" text-anchor="middle">T1 @ 7920 (dead)</text>

  <rect x="894" y="114" width="146" height="56" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/>
  <text x="967" y="137" class="mono" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Special</text>
  <text x="967" y="155" class="mono" font-size="11" fill="#b45309" text-anchor="middle">HK + RLink</text>

  <!-- Animated Indirection Arcs -->
  <path d="M 310 170 Q 557 224 804 170" fill="none" stroke="#d6d0c4" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr-slate)" class="old-ptr"/>
  <path d="M 290 170 Q 465 214 641 170" fill="none" stroke="#0f766e" stroke-width="2.4" marker-end="url(#arr-emerald)" class="new-ptr"/>

  <text x="40" y="226" class="sans" font-size="11.5" fill="#44403c">Indirection invariant: moving tuple T1 → T1' updates only slot[1] inside the page; secondary indexes keep ctid=(blk, 1).</text>

  <!-- BOTTOM PANEL: LEHMAN-YAO B-LINK CONCURRENT SPLIT -->
  <rect x="24" y="252" width="1032" height="272" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <rect x="24" y="252" width="1032" height="30" rx="10" fill="#f5f1e8"/>
  <rect x="24" y="272" width="1032" height="10" fill="#f5f1e8"/>
  <text x="40" y="272" class="sans" font-size="13" font-weight="700" fill="#1c1917">2. Lehman-Yao B-Link Concurrent Split (Lock-Free Reader Hop)</text>
  <text x="1040" y="272" class="mono" font-size="11.5" fill="#44403c" text-anchor="end">Split order: 1. link B  2. update parent</text>

  <!-- Stale Parent Node -->
  <rect x="350" y="294" width="380" height="36" rx="8" fill="#f5f1e8" stroke="#57534e" stroke-width="1.4"/>
  <text x="540" y="317" class="mono" font-size="12" font-weight="700" fill="#1c1917" text-anchor="middle">Parent (stale: no ptr to B yet)</text>

  <!-- Parent Pointers -->
  <line x1="430" y1="330" x2="290" y2="390" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="650" y1="330" x2="790" y2="390" stroke="#d6d0c4" stroke-width="1.8" stroke-dasharray="5 5"/>
  <text x="770" y="352" class="sans" font-size="11" fill="#57534e">parent ptr pending</text>

  <!-- Node A (Splitting) -->
  <rect x="60" y="396" width="340" height="112" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.8"/>
  <text x="80" y="421" class="sans" font-size="13" font-weight="700" fill="#065f46">Node A (Splitting)</text>
  <text x="80" y="445" class="mono" font-size="12" fill="#44403c">Keys: [5, 12]</text>
  <rect x="80" y="460" width="160" height="30" rx="5" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/>
  <text x="160" y="480" class="mono" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">High Key = 12</text>

  <!-- Horizontal right_link -->
  <line x1="400" y1="452" x2="672" y2="452" stroke="#0f766e" stroke-width="2.6" class="rlink-flow" marker-end="url(#arr-emerald)"/>
  <text x="540" y="438" class="mono" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">right_link</text>
  <text x="540" y="476" class="mono" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">k=18 &gt; 12 → hop right</text>

  <!-- Node B (New Right Sibling) -->
  <g class="node-b">
    <rect x="680" y="396" width="340" height="112" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.8"/>
    <text x="700" y="421" class="sans" font-size="13" font-weight="700" fill="#065f46">Node B (New Right Sibling)</text>
    <text x="700" y="445" class="mono" font-size="12" fill="#44403c">Keys: [15, 20]</text>
    <rect x="700" y="460" width="160" height="30" rx="5" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.3"/>
    <text x="780" y="480" class="mono" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">High Key = 30</text>
  </g>

  <!-- Animated Reader Pill -->
  <g class="reader-hop">
    <rect x="168" y="346" width="174" height="28" rx="14" fill="#0f766e" stroke="#ffffff" stroke-width="1.5"/>
    <text x="255" y="365" class="mono" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Reader: k=18 &gt; 12</text>
  </g>
</svg>
