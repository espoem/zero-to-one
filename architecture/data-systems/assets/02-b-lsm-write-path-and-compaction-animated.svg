<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540" role="img" aria-labelledby="title desc">
  <title id="title">LSM-Tree Write Path and Compaction Strategies</title>
  <desc id="desc">Top panel traces an LSM-Tree write PUT(k=42, v=9) appending to the on-disk WAL and in-memory SkipList Memtable, freezing into an Immutable Memtable, and flushing to an L0 SSTable. Bottom panel compares Leveled Compaction (LCS) with disjoint L1 ranges and low space amplification against Size-Tiered Compaction (STCS) merging equal-size SSTables with low write amplification.</desc>

  <defs>
    <style>
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

      /* 8s synchronized cycle */
      @keyframes stage-1 {
        0%, 22% { opacity: 1; }
        30%, 100% { opacity: 0.9; }
      }
      @keyframes stage-2 {
        0%, 20% { opacity: 0.9; }
        25%, 48% { opacity: 1; }
        56%, 100% { opacity: 0.9; }
      }
      @keyframes stage-3 {
        0%, 44% { opacity: 0.9; }
        50%, 74% { opacity: 1; }
        82%, 100% { opacity: 0.9; }
      }
      @keyframes stage-4 {
        0%, 70% { opacity: 0.9; }
        76%, 96% { opacity: 1; }
        100% { opacity: 0.9; }
      }
      @keyframes pkt-wal {
        0%, 6% { opacity: 0; transform: translateY(0px); }
        10% { opacity: 1; transform: translateY(4px); }
        22% { opacity: 1; transform: translateY(28px); }
        28%, 100% { opacity: 0; transform: translateY(28px); }
      }
      @keyframes pkt-pipe {
        0%, 16% { opacity: 0; transform: translateX(0px); }
        22% { opacity: 1; transform: translateX(12px); }
        46% { opacity: 1; transform: translateX(300px); }
        74% { opacity: 1; transform: translateX(610px); }
        84%, 100% { opacity: 0; transform: translateX(640px); }
      }

      .st1 { animation: stage-1 8s ease-in-out infinite; }
      .st2 { animation: stage-2 8s ease-in-out infinite; }
      .st3 { animation: stage-3 8s ease-in-out infinite; }
      .st4 { animation: stage-4 8s ease-in-out infinite; }
      .pkt-w { animation: pkt-wal 8s ease-in-out infinite; }
      .pkt-p { animation: pkt-pipe 8s ease-in-out infinite; }
      .flow-line { stroke-dasharray: 6 4;  }

      @media (prefers-reduced-motion: reduce) {
        .st1, .st2, .st3, .st4, .pkt-w, .pkt-p, .cmp, .flow-line {
          animation: none !important;
        }
        .st1, .st2, .st3, .st4, .cmp {
          opacity: 1 !important;
        }
        .pkt-w, .pkt-p {
          opacity: 0 !important;
        }
      }
    </style>

    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
    <marker id="arr-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1080" height="540" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>

  <!-- Header -->
  <line x1="24" y1="60" x2="1056" y2="60" stroke="#1c1917" stroke-width="1.2"/>
  
  <text x="24" y="26" class="sans" font-size="18" font-weight="700" fill="#1c1917" font-family="Georgia, 'Times New Roman', serif">LSM-Tree Write Path &amp; Compaction Strategies</text>
  <text x="24" y="46" class="sans" font-size="12" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">Sequential WAL + SkipList Memtable flush to L0 SSTables, and Leveled vs Size-Tiered merging</text>

  <!-- TOP PANEL: LSM WRITE PATH -->
  <rect x="24" y="72" width="1032" height="208" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <rect x="24" y="72" width="1032" height="30" rx="10" fill="#f5f1e8"/>
  <rect x="24" y="92" width="1032" height="10" fill="#f5f1e8"/>
  <text x="40" y="92" class="sans" font-size="13" font-weight="700" fill="#1c1917">1. LSM-Tree Write Path (Sequential Append → SSTable Flush)</text>
  <text x="1040" y="92" class="mono" font-size="11.5" fill="#44403c" text-anchor="end">O(log N) RAM + Sequential I/O</text>

  <!-- Client Write -->
  <g class="st1">
    <rect x="44" y="114" width="176" height="60" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.6"/>
    <text x="132" y="139" class="mono" font-size="12.5" font-weight="700" fill="#065f46" text-anchor="middle">PUT(k=42, v=9)</text>
    <text x="132" y="159" class="sans" font-size="11.5" fill="#44403c" text-anchor="middle">Client Mutation</text>
  </g>

  <!-- Arrow PUT -> WAL -->
  <line x1="132" y1="174" x2="132" y2="206" stroke="#b45309" stroke-width="2.2" class="flow-line" marker-end="url(#arr-amber)"/>

  <!-- 1. Disk WAL -->
  <g class="st1">
    <rect x="44" y="210" width="216" height="56" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
    <text x="152" y="233" class="sans" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="middle">1. Disk WAL (fsync)</text>
    <text x="152" y="252" class="mono" font-size="11" fill="#92400e" text-anchor="middle">[LSN 91: k=42, v=9]</text>
  </g>

  <!-- Arrow PUT -> Memtable -->
  <line x1="220" y1="144" x2="274" y2="144" stroke="#0f766e" stroke-width="2.2" class="flow-line" marker-end="url(#arr-blue)"/>

  <!-- 2. Memtable -->
  <g class="st2">
    <rect x="280" y="114" width="224" height="60" rx="8" fill="#f5f1e8" stroke="#0f766e" stroke-width="1.6"/>
    <text x="392" y="138" class="sans" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">2. Memtable (SkipList RAM)</text>
    <text x="392" y="158" class="mono" font-size="11" fill="#065f46" text-anchor="middle">12 → 42 → 77 (64 MB cap)</text>
  </g>

  <!-- Arrow Memtable -> Immutable -->
  <line x1="504" y1="144" x2="554" y2="144" stroke="#0f766e" stroke-width="2.2" class="flow-line" marker-end="url(#arr-violet)"/>

  <!-- 3. Immutable Memtable -->
  <g class="st3">
    <rect x="560" y="114" width="214" height="60" rx="8" fill="#f5f1e8" stroke="#57534e" stroke-width="1.6"/>
    <text x="667" y="138" class="sans" font-size="12" font-weight="700" fill="#1c1917" text-anchor="middle">3. Immutable Memtable</text>
    <text x="667" y="158" class="mono" font-size="11" fill="#44403c" text-anchor="middle">Frozen read-only snapshot</text>
  </g>

  <!-- Arrow Immutable -> L0 SSTable -->
  <line x1="774" y1="144" x2="824" y2="144" stroke="#0f766e" stroke-width="2.2" class="flow-line" marker-end="url(#arr-emerald)"/>

  <!-- 4. L0 SSTable -->
  <g class="st4">
    <rect x="830" y="114" width="210" height="60" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.6"/>
    <text x="935" y="138" class="sans" font-size="12.5" font-weight="700" fill="#065f46" text-anchor="middle">4. L0 SSTable (Disk)</text>
    <text x="935" y="158" class="mono" font-size="11" fill="#065f46" text-anchor="middle">Sorted immutable file</text>
  </g>

  <!-- L0 SSTable Anatomy Strip -->
  <rect x="280" y="210" width="760" height="56" rx="8" fill="#faf8f5" stroke="#d6d0c4" stroke-width="1.2"/>
  <text x="296" y="242" class="sans" font-size="11.5" font-weight="700" fill="#44403c">L0 SSTable Blocks:</text>
  <rect x="440" y="222" width="196" height="32" rx="5" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.2"/>
  <text x="538" y="242" class="mono" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">Data Blocks (LZ4/Zstd)</text>
  <rect x="650" y="222" width="174" height="32" rx="5" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.2"/>
  <text x="737" y="242" class="mono" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">Index Block (Offsets)</text>
  <rect x="838" y="222" width="186" height="32" rx="5" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.3"/>
  <text x="931" y="242" class="mono" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">Bloom Filter (0% FN)</text>

  <!-- Animated Write Packets -->
  <circle cx="132" cy="176" r="5" fill="#b45309" class="pkt-w"/>
  <circle cx="222" cy="144" r="5" fill="#0f766e" class="pkt-p"/>

  <!-- BOTTOM PANEL: LCS VS STCS COMPACTION -->
  <rect x="24" y="292" width="1032" height="232" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <rect x="24" y="292" width="1032" height="30" rx="10" fill="#f5f1e8"/>
  <rect x="24" y="312" width="1032" height="10" fill="#f5f1e8"/>
  <text x="40" y="312" class="sans" font-size="13" font-weight="700" fill="#1c1917">2. Background Compaction: Leveled (LCS) vs Size-Tiered (STCS)</text>
  <text x="1040" y="312" class="mono" font-size="11.5" fill="#44403c" text-anchor="end">RUM Trade-off: WAF vs SAF vs RAF</text>

  <!-- Leveled Compaction (LCS) -->
  <rect x="40" y="334" width="490" height="176" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.4"/>
  <text x="56" y="356" class="sans" font-size="12.5" font-weight="700" fill="#065f46">Leveled Compaction (LCS) — Low SAF (~1.1×)</text>

  <rect x="56" y="368" width="144" height="30" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="128" y="387" class="mono" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="middle">L0: [10..80]</text>
  <rect x="212" y="368" width="144" height="30" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="284" y="387" class="mono" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="middle">L0: [20..95]</text>
  <text x="370" y="387" class="sans" font-size="11.5" font-weight="700" fill="#991b1b">Overlapping L0</text>

  <line x1="284" y1="398" x2="284" y2="428" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr-blue)"/>

  <g class="cmp">
    <rect x="56" y="432" width="108" height="34" rx="5" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.3"/>
    <text x="110" y="454" class="mono" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">L1: 0..25</text>
    <rect x="172" y="432" width="108" height="34" rx="5" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.3"/>
    <text x="226" y="454" class="mono" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">L1: 26..50</text>
    <rect x="288" y="432" width="108" height="34" rx="5" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.3"/>
    <text x="342" y="454" class="mono" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">L1: 51..75</text>
    <rect x="404" y="432" width="110" height="34" rx="5" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.3"/>
    <text x="459" y="454" class="mono" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">L1: 76..100</text>
  </g>
  <text x="56" y="492" class="mono" font-size="11.5" fill="#065f46">Disjoint sorted runs · ≤1 file/level read · WAF 10–30</text>

  <!-- Size-Tiered Compaction (STCS) -->
  <rect x="550" y="334" width="490" height="176" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="566" y="356" class="sans" font-size="12.5" font-weight="700" fill="#92400e">Size-Tiered Compaction (STCS) — Low WAF (4–10)</text>

  <rect x="566" y="368" width="104" height="30" rx="5" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <text x="618" y="387" class="mono" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle">10 MB</text>
  <rect x="684" y="368" width="104" height="30" rx="5" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <text x="736" y="387" class="mono" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle">10 MB</text>
  <rect x="802" y="368" width="104" height="30" rx="5" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <text x="854" y="387" class="mono" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle">10 MB</text>
  <rect x="920" y="368" width="104" height="30" rx="5" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <text x="972" y="387" class="mono" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle">10 MB</text>

  <line x1="795" y1="398" x2="795" y2="428" stroke="#b45309" stroke-width="2.2" marker-end="url(#arr-amber)"/>

  <g class="cmp">
    <rect x="566" y="432" width="458" height="34" rx="5" fill="#fde68a" stroke="#b45309" stroke-width="1.4"/>
    <text x="795" y="454" class="mono" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Compacted Tier SSTable (40 MB)</text>
  </g>
  <text x="566" y="492" class="mono" font-size="11.5" fill="#92400e">Merges equal-size SSTables · High SAF (1.5–2×) · 50% headroom</text>
</svg>
