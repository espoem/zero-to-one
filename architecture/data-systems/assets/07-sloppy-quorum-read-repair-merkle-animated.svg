<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="title desc">
  <title id="title">Dynamo Leaderless Replication: Sloppy Quorum, Read Repair, and Merkle Tree Anti-Entropy</title>
  <desc id="desc">Animated three-panel diagram illustrating Dynamo-style leaderless replication mechanisms: (1) Sloppy Quorum accepting writes on reachable neighbor N4 via Hinted Handoff when primary replica N3 is partitioned, then replaying hints upon recovery; (2) Quorum Read (W + R &gt; N) detecting stale version v4 on N3 versus v5 on N1 and N2 and issuing asynchronous Read Repair; and (3) Merkle Tree top-down hash diff pruning matching subtrees and pinpointing divergent key range [K30..K40].</desc>

  <defs>
    <style>
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

      /* 12s cycle */
      @keyframes hint-write {
        0%, 24% { opacity: 1; }
        34%, 100% { opacity: 0.75; }
      }
      @keyframes hint-replay {
        0%, 26% { opacity: 0.86; transform: translateX(-10px); }
        36%, 100% { opacity: 1; transform: translateX(0px); }
      }
      @keyframes repair-put {
        0%, 46% { opacity: 0.86; transform: translateY(-8px); }
        56%, 100% { opacity: 1; transform: translateY(0px); }
      }
      @keyframes merkle-diff {
        0%, 66% { opacity: 0.86; }
        76%, 100% { opacity: 1; }
      }

      @keyframes st-1 { 0%, 24% { opacity: 1; stroke: #b45309; stroke-width: 2.5; } 25%, 100% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1.2; } }
      @keyframes st-2 { 0%, 24% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1.2; } 25%, 49% { opacity: 1; stroke: #0f766e; stroke-width: 2.5; } 50%, 100% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1.2; } }
      @keyframes st-3 { 0%, 49% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1.2; } 50%, 74% { opacity: 1; stroke: #0f766e; stroke-width: 2.5; } 75%, 100% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1.2; } }
      @keyframes st-4 { 0%, 74% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1.2; } 75%, 100% { opacity: 1; stroke: #dc2626; stroke-width: 2.5; } }

      .hw { animation: hint-write 12s linear infinite; }
      .hr { animation: hint-replay 12s ease-out infinite; }
      .rput { animation: repair-put 12s ease-out infinite; }
      .mdiff { animation: merkle-diff 12s ease-out infinite; }
      .dflow { stroke-dasharray: 6 4;  }

      .s1 { animation: st-1 12s linear infinite; }
      .s2 { animation: st-2 12s linear infinite; }
      .s3 { animation: st-3 12s linear infinite; }
      .s4 { animation: st-4 12s linear infinite; }

      @media (prefers-reduced-motion: reduce) {
        .hw, .hr, .rput, .mdiff, .dflow, .s1, .s2, .s3, .s4 {
          animation: none !important;
        }
        .hw, .hr, .rput, .mdiff, .s1, .s2, .s3, .s4 {
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>

    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1200" height="720" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>

  <!-- Header -->
  <line x1="24" y1="64" x2="1176" y2="64" stroke="#1c1917" stroke-width="1.2"/>
  
  <text x="24" y="28" class="sans" font-size="18" font-weight="700" fill="#1c1917" font-family="Georgia, 'Times New Roman', serif">Leaderless Replication: Sloppy Quorum, Read Repair &amp; Merkle Tree Anti-Entropy</text>
  <text x="24" y="48" class="sans" font-size="12" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">Maintaining Dynamo availability under network partitions (hinted handoff) and converging divergent replicas (W + R &gt; N)</text>

  <!-- PANEL 1 (LEFT): SLOPPY QUORUM & HINTED HANDOFF -->
  <rect x="24" y="78" width="368" height="458" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <rect x="24" y="78" width="368" height="34" rx="10" fill="#f5f1e8"/>
  <rect x="24" y="102" width="368" height="10" fill="#f5f1e8"/>
  <text x="38" y="100" class="sans" font-size="12.5" font-weight="700" fill="#1c1917">1. Sloppy Quorum &amp; Hinted Handoff</text>

  <!-- Coordinator -->
  <rect x="116" y="128" width="184" height="42" rx="7" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.6"/>
  <text x="208" y="147" class="sans" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">Coordinator: PUT(k, v5)</text>
  <text x="208" y="162" class="mono" font-size="10" fill="#065f46" text-anchor="middle">Pref List [N1, N2, N3], W=3</text>

  <!-- Arrows to N1, N2, N3 (partitioned), N4 (stand-in) -->
  <line x1="144" y1="170" x2="88" y2="218" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-emerald)"/>
  <line x1="208" y1="170" x2="208" y2="218" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-emerald)"/>
  <line x1="272" y1="170" x2="324" y2="218" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="314" y="196" class="mono" font-size="11" font-weight="700" fill="#dc2626">✕</text>

  <!-- N1, N2, N3 -->
  <rect x="42" y="224" width="96" height="58" rx="6" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.5"/>
  <text x="90" y="244" class="mono" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">Node 1</text>
  <text x="90" y="262" class="mono" font-size="10" fill="#065f46" text-anchor="middle">v5 OK ✓</text>

  <rect x="160" y="224" width="96" height="58" rx="6" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.5"/>
  <text x="208" y="244" class="mono" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">Node 2</text>
  <text x="208" y="262" class="mono" font-size="10" fill="#065f46" text-anchor="middle">v5 OK ✓</text>

  <rect x="278" y="224" width="96" height="58" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="326" y="244" class="mono" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">Node 3</text>
  <text x="326" y="262" class="mono" font-size="10" fill="#dc2626" text-anchor="middle">Partitioned!</text>

  <!-- Stand-in Node 4 storing Hint -->
  <g class="hw">
    <path d="M 272 170 Q 388 260 278 344" fill="none" stroke="#b45309" stroke-width="2" class="dflow" marker-end="url(#arr-amber)"/>
    <rect x="64" y="324" width="212" height="72" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
    <text x="170" y="346" class="sans" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle">Node 4 (Stand-in Neighbor)</text>
    <text x="170" y="364" class="mono" font-size="10" fill="#92400e" text-anchor="middle">Stores Hint: {target: N3, v5}</text>
    <text x="170" y="382" class="sans" font-size="10" fill="#b45309" text-anchor="middle">Write succeeds (Sloppy W=3)!</text>
  </g>

  <!-- Hinted Handoff Replay -->
  <g class="hr">
    <path d="M 276 356 L 326 356 L 326 288" fill="none" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr-emerald)"/>
    <rect x="284" y="370" width="92" height="36" rx="5" fill="#f0fdf9" stroke="#0f766e"/>
    <text x="330" y="386" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">Link heals →</text>
    <text x="330" y="399" class="mono" font-size="10" font-weight="700" fill="#0f766e" text-anchor="middle">Replay v5</text>
  </g>

  <rect x="40" y="436" width="336" height="84" rx="6" fill="#faf8f5" stroke="#d6d0c4"/>
  <text x="52" y="456" class="sans" font-size="10.5" font-weight="700" fill="#1c1917">Availability vs Consistency Trade-off:</text>
  <text x="52" y="474" class="sans" font-size="10" fill="#44403c">Sloppy quorums stay writable during partitions, but</text>
  <text x="52" y="490" class="sans" font-size="10" fill="#44403c">break strict W + R &gt; N until hinted handoff replays</text>
  <text x="52" y="506" class="sans" font-size="10" fill="#44403c">all hints back to home replica Node 3.</text>

  <!-- PANEL 2 (CENTER): QUORUM READ & READ REPAIR -->
  <rect x="408" y="78" width="384" height="458" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <rect x="408" y="78" width="384" height="34" rx="10" fill="#f5f1e8"/>
  <rect x="408" y="102" width="384" height="10" fill="#f5f1e8"/>
  <text x="422" y="100" class="sans" font-size="12.5" font-weight="700" fill="#1c1917">2. Quorum Read &amp; Read Repair (R = 3)</text>

  <!-- Client + Coordinator -->
  <rect x="498" y="128" width="204" height="46" rx="7" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.6"/>
  <text x="600" y="148" class="sans" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">Coordinator: GET(key)</text>
  <text x="600" y="164" class="mono" font-size="10" fill="#0f766e" text-anchor="middle">Returns v5 (highest) to client</text>

  <!-- Parallel Reads -->
  <line x1="530" y1="174" x2="474" y2="232" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <line x1="600" y1="174" x2="600" y2="232" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <line x1="670" y1="174" x2="726" y2="232" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- N1, N2, N3 Responses -->
  <rect x="424" y="238" width="104" height="72" rx="6" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.5"/>
  <text x="476" y="260" class="mono" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">Node 1</text>
  <text x="476" y="280" class="mono" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle">ver = 5</text>
  <text x="476" y="298" class="sans" font-size="10" fill="#065f46" text-anchor="middle">Fresh ✓</text>

  <rect x="548" y="238" width="104" height="72" rx="6" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.5"/>
  <text x="600" y="260" class="mono" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">Node 2</text>
  <text x="600" y="280" class="mono" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle">ver = 5</text>
  <text x="600" y="298" class="sans" font-size="10" fill="#065f46" text-anchor="middle">Fresh ✓</text>

  <rect x="672" y="238" width="104" height="72" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="724" y="260" class="mono" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">Node 3</text>
  <text x="724" y="280" class="mono" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">ver = 4</text>
  <text x="724" y="298" class="sans" font-size="10" fill="#991b1b" text-anchor="middle">Stale!</text>

  <!-- Async Read Repair to N3 -->
  <g class="rput">
    <path d="M 702 152 Q 778 176 746 234" fill="none" stroke="#0f766e" stroke-width="2.2" class="dflow" marker-end="url(#arr-emerald)"/>
    <rect x="442" y="340" width="316" height="76" rx="7" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.6"/>
    <text x="600" y="362" class="sans" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">Async Read Repair: PUT(key, v5) → Node 3</text>
    <text x="600" y="382" class="mono" font-size="10.5" fill="#065f46" text-anchor="middle">Node 3 updated: v4 → v5 (reconciled)</text>
    <text x="600" y="400" class="sans" font-size="10" fill="#44403c" text-anchor="middle">Sync mode repairs before client ACK; async repairs in background.</text>
  </g>

  <rect x="424" y="436" width="352" height="84" rx="6" fill="#faf8f5" stroke="#d6d0c4"/>
  <text x="436" y="456" class="mono" font-size="10.5" font-weight="700" fill="#065f46">Overlap = (W + R) - N ≥ 1</text>
  <text x="436" y="474" class="sans" font-size="10" fill="#44403c">Pigeonhole Principle guarantees at least one node</text>
  <text x="436" y="490" class="sans" font-size="10" fill="#44403c">in R holds v5, but read repair only fixes keys that</text>
  <text x="436" y="506" class="sans" font-size="10" fill="#44403c">are actively read — cold keys need Merkle trees.</text>

  <!-- PANEL 3 (RIGHT): MERKLE TREE ANTI-ENTROPY -->
  <rect x="808" y="78" width="368" height="458" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <rect x="808" y="78" width="368" height="34" rx="10" fill="#f5f1e8"/>
  <rect x="808" y="102" width="368" height="10" fill="#f5f1e8"/>
  <text x="822" y="100" class="sans" font-size="12.5" font-weight="700" fill="#1c1917">3. Merkle Tree Anti-Entropy Diff</text>

  <text x="822" y="128" class="sans" font-size="10.5" fill="#44403c">Replica A vs Replica B top-down hash comparison:</text>

  <!-- Root Hash Comparison -->
  <rect x="900" y="142" width="184" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="992" y="159" class="mono" font-size="10.5" font-weight="700" fill="#991b1b" text-anchor="middle">Root H_AB ≠ H'_AB</text>
  <text x="992" y="174" class="sans" font-size="10" fill="#dc2626" text-anchor="middle">Mismatch → descend</text>

  <!-- Branches -->
  <line x1="946" y1="182" x2="896" y2="220" stroke="#0f766e" stroke-width="1.8"/>
  <line x1="1038" y1="182" x2="1088" y2="220" stroke="#dc2626" stroke-width="2"/>

  <!-- Level 1 Left (Matches!) -->
  <rect x="824" y="222" width="144" height="44" rx="6" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.5"/>
  <text x="896" y="241" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">H_01 == H'_01</text>
  <text x="896" y="257" class="sans" font-size="10" fill="#065f46" text-anchor="middle">[K0..K20] PRUNE ✓</text>

  <!-- Level 1 Right (Diverges!) -->
  <rect x="1016" y="222" width="144" height="44" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="1088" y="241" class="mono" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">H_23 ≠ H'_23</text>
  <text x="1088" y="257" class="sans" font-size="10" fill="#dc2626" text-anchor="middle">[K21..K40] Descend</text>

  <!-- Leaves under Right Subtree -->
  <g class="mdiff">
    <line x1="1056" y1="266" x2="1030" y2="306" stroke="#0f766e" stroke-width="1.6"/>
    <line x1="1120" y1="266" x2="1126" y2="306" stroke="#dc2626" stroke-width="2"/>

    <rect x="970" y="308" width="90" height="46" rx="5" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.3"/>
    <text x="1015" y="328" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">K21..K30</text>
    <text x="1015" y="344" class="mono" font-size="10" fill="#065f46" text-anchor="middle">H2 == H'2 ✓</text>

    <rect x="1072" y="308" width="92" height="46" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
    <text x="1118" y="328" class="mono" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">K31..K40</text>
    <text x="1118" y="344" class="mono" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">SYNC ONLY!</text>

    <rect x="824" y="370" width="336" height="46" rx="6" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.3"/>
    <text x="992" y="390" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">O(log N) hash exchange locates exact bucket</text>
    <text x="992" y="406" class="sans" font-size="10" fill="#44403c" text-anchor="middle">Only divergent leaf [K31..K40] streams across WAN.</text>
  </g>

  <rect x="824" y="436" width="336" height="84" rx="6" fill="#faf8f5" stroke="#d6d0c4"/>
  <text x="836" y="456" class="sans" font-size="10.5" font-weight="700" fill="#1c1917">Background Anti-Entropy:</text>
  <text x="836" y="474" class="sans" font-size="10" fill="#44403c">Recovers cold/unread keys lost during outages</text>
  <text x="836" y="490" class="sans" font-size="10" fill="#44403c">without transferring entire SSTables; note that</text>
  <text x="836" y="506" class="sans" font-size="10" fill="#44403c">key-range splits require tree rebuilds (Cassandra).</text>

  <!-- BOTTOM 4 STEP CARDS -->
  <rect x="24" y="552" width="276" height="144" rx="8" fill="#fffbeb" class="s1"/>
  <rect x="38" y="566" width="56" height="22" rx="4" fill="#b45309"/>
  <text x="66" y="581" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Step 1</text>
  <text x="104" y="581" class="sans" font-size="12" font-weight="700" fill="#92400e">Sloppy Write Hint</text>
  <text x="38" y="608" class="sans" font-size="10.5" fill="#44403c">With N3 partitioned, N4 accepts a</text>
  <text x="38" y="624" class="sans" font-size="10.5" fill="#44403c">temporary hint so client writes</text>
  <text x="38" y="640" class="sans" font-size="10.5" fill="#44403c">succeed without stalling.</text>

  <rect x="316" y="552" width="276" height="144" rx="8" fill="#f0fdf9" class="s2"/>
  <rect x="330" y="566" width="56" height="22" rx="4" fill="#0f766e"/>
  <text x="358" y="581" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Step 2</text>
  <text x="396" y="581" class="sans" font-size="12" font-weight="700" fill="#065f46">Hinted Replay</text>
  <text x="330" y="608" class="sans" font-size="10.5" fill="#44403c">Once N3 reconnects, N4 forwards</text>
  <text x="330" y="624" class="sans" font-size="10.5" fill="#44403c">the hinted v5 payload back to N3</text>
  <text x="330" y="640" class="sans" font-size="10.5" fill="#44403c">and deletes its local hint.</text>

  <rect x="608" y="552" width="276" height="144" rx="8" fill="#f0fdf9" class="s3"/>
  <rect x="622" y="566" width="56" height="22" rx="4" fill="#0f766e"/>
  <text x="650" y="581" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Step 3</text>
  <text x="688" y="581" class="sans" font-size="12" font-weight="700" fill="#065f46">Read Repair</text>
  <text x="622" y="608" class="sans" font-size="10.5" fill="#44403c">Quorum read R=3 observes N3 has</text>
  <text x="622" y="624" class="sans" font-size="10.5" fill="#44403c">stale v4; returns v5 to caller and</text>
  <text x="622" y="640" class="sans" font-size="10.5" fill="#44403c">repairs N3 asynchronously.</text>

  <rect x="900" y="552" width="276" height="144" rx="8" fill="#fef2f2" class="s4"/>
  <rect x="914" y="566" width="56" height="22" rx="4" fill="#dc2626"/>
  <text x="942" y="581" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Step 4</text>
  <text x="980" y="581" class="sans" font-size="12" font-weight="700" fill="#991b1b">Merkle Tree Sync</text>
  <text x="914" y="608" class="sans" font-size="10.5" fill="#44403c">Top-down hash diff skips matching</text>
  <text x="914" y="624" class="sans" font-size="10.5" fill="#44403c">ranges and streams only divergent</text>
  <text x="914" y="640" class="sans" font-size="10.5" fill="#44403c">cold keys in [K31..K40].</text>
</svg>
