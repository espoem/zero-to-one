<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-labelledby="title desc">
  <title id="title">Concurrency Control: Strict 2PL, MVCC Snapshots, SSI, and OCC</title>
  <desc id="desc">Animated four-quadrant diagram comparing database concurrency control mechanisms: (1) Strict 2PL Wait-For Graph deadlock cycle detection (T1 to T2 to T1) and youngest-transaction abort; (2) MVCC tuple version chain visibility evaluation using t_xmin and t_xmax with zero read locks; (3) Serializable Snapshot Isolation (SSI) detecting two consecutive rw-antidependency edges (dangerous structure) and aborting before write skew commits; and (4) Optimistic Concurrency Control (OCC) Read, Validation, and Write phases.</desc>

  <defs>
    <style>
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

      /* 12s cycle */
      @keyframes dl-flash {
        0%, 16% { opacity: 0.86; }
        22%, 44% { opacity: 1; }
        52%, 100% { opacity: 0.86; }
      }
      @keyframes mvcc-scan {
        0%, 24% { transform: translateX(0px); opacity: 0.85; }
        34%, 92% { transform: translateX(174px); opacity: 1; }
        97%, 100% { transform: translateX(0px); opacity: 0.85; }
      }
      @keyframes ssi-edge {
        0%, 44% { opacity: 0.86; }
        52%, 82% { opacity: 1; }
        90%, 100% { opacity: 0.86; }
      }
      @keyframes occ-slide {
        0%, 15%   { transform: translateX(0px); }
        40%, 60%  { transform: translateX(172px); }
        76%, 94%  { transform: translateX(344px); }
        100%      { transform: translateX(0px); }
      }

      @keyframes st-1 { 0%, 24% { opacity: 1; stroke: #dc2626; stroke-width: 2.5; } 25%, 100% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1.2; } }
      @keyframes st-2 { 0%, 24% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1.2; } 25%, 49% { opacity: 1; stroke: #0f766e; stroke-width: 2.5; } 50%, 100% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1.2; } }
      @keyframes st-3 { 0%, 49% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1.2; } 50%, 74% { opacity: 1; stroke: #0f766e; stroke-width: 2.5; } 75%, 100% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1.2; } }
      @keyframes st-4 { 0%, 74% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1.2; } 75%, 100% { opacity: 1; stroke: #0f766e; stroke-width: 2.5; } }

      .dlf { animation: dl-flash 12s ease-in-out infinite; }
      .mvscan { animation: mvcc-scan 12s ease-in-out infinite; }
      .ssie { animation: ssi-edge 12s ease-in-out infinite; }
      .occs { animation: occ-slide 12s ease-in-out infinite; }

      .s1 { animation: st-1 12s linear infinite; }
      .s2 { animation: st-2 12s linear infinite; }
      .s3 { animation: st-3 12s linear infinite; }
      .s4 { animation: st-4 12s linear infinite; }

      @media (prefers-reduced-motion: reduce) {
        .dlf, .mvscan, .ssie, .occs, .s1, .s2, .s3, .s4 {
          animation: none !important;
        }
        .dlf, .ssie, .s1, .s2, .s3, .s4 {
          opacity: 1 !important;
        }
        .mvscan { transform: translateX(174px) !important; opacity: 1 !important; }
        .occs { transform: translateX(172px) !important; opacity: 1 !important; }
      }
    </style>

    <marker id="arr-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1200" height="740" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>

  <!-- Header -->
  <line x1="24" y1="64" x2="1176" y2="64" stroke="#1c1917" stroke-width="1.2"/>
  
  <text x="24" y="28" class="sans" font-size="18" font-weight="700" fill="#1c1917" font-family="Georgia, 'Times New Roman', serif">Concurrency Control: Strict 2PL, MVCC Snapshots, SSI &amp; OCC</text>
  <text x="24" y="48" class="sans" font-size="12" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">Pessimistic Wait-For deadlocks, non-blocking MVCC version chains, rw-antidependency dangerous structures, and optimistic validation</text>

  <!-- QUADRANT 1 (TOP-LEFT): STRICT 2PL WAIT-FOR GRAPH -->
  <rect x="24" y="78" width="564" height="236" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <rect x="24" y="78" width="564" height="32" rx="10" fill="#f5f1e8"/>
  <rect x="24" y="100" width="564" height="10" fill="#f5f1e8"/>
  <text x="40" y="99" class="sans" font-size="12.5" font-weight="700" fill="#1c1917">1. Strict 2PL (S2PL) &amp; Wait-For Graph Deadlock</text>
  <text x="572" y="99" class="mono" font-size="10.5" fill="#57534e" text-anchor="end">Hold X-locks until commit</text>

  <rect x="44" y="128" width="154" height="72" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.6"/>
  <text x="121" y="149" class="mono" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">Txn T1 (older)</text>
  <text x="121" y="168" class="mono" font-size="10" fill="#44403c" text-anchor="middle">Holds: X(Row A)</text>
  <text x="121" y="185" class="mono" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">Wants: X(Row B)</text>

  <rect x="386" y="128" width="182" height="72" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="477" y="149" class="mono" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">Txn T2 (youngest)</text>
  <text x="477" y="168" class="mono" font-size="10" fill="#44403c" text-anchor="middle">Holds: X(Row B)</text>
  <text x="477" y="185" class="mono" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">Wants: X(Row A)</text>

  <!-- Cycle Arrows -->
  <g class="dlf">
    <path d="M 198 148 Q 292 122 380 148" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-rose)"/>
    <text x="292" y="130" class="mono" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">waits for X(B)</text>
    <path d="M 386 184 Q 292 210 204 184" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-rose)"/>
    <text x="292" y="210" class="mono" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">waits for X(A)</text>

    <rect x="44" y="226" width="524" height="70" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
    <text x="60" y="248" class="sans" font-size="11.5" font-weight="700" fill="#991b1b">Cycle T1 → T2 → T1 Detected! Abort Youngest Victim (T2)</text>
    <text x="60" y="267" class="mono" font-size="10.5" fill="#44403c">T2 releases X(Row B) → T1 acquires X(B), finishes, commits.</text>
    <text x="60" y="284" class="sans" font-size="10" fill="#57534e">Alternative: Wait-Die / Wound-Wait timestamp prevention avoids cycles.</text>
  </g>

  <!-- QUADRANT 2 (TOP-RIGHT): MVCC VERSION CHAIN -->
  <rect x="608" y="78" width="568" height="236" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <rect x="608" y="78" width="568" height="32" rx="10" fill="#f5f1e8"/>
  <rect x="608" y="100" width="568" height="10" fill="#f5f1e8"/>
  <text x="624" y="99" class="sans" font-size="12.5" font-weight="700" fill="#1c1917">2. MVCC Tuple Version Chain &amp; Snapshot Visibility</text>
  <text x="1160" y="99" class="mono" font-size="10.5" fill="#57534e" text-anchor="end">Readers never block writers</text>

  <!-- Reader Snapshot Banner -->
  <rect x="626" y="122" width="532" height="30" rx="6" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.2"/>
  <text x="640" y="141" class="mono" font-size="10.5" font-weight="700" fill="#065f46">Reader Txn T14 Snapshot: xmin_max = 14, active_txns = {13, 15}</text>

  <!-- Version Chain: v3 -> v2 -> v1 -->
  <rect x="626" y="172" width="154" height="72" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="703" y="191" class="mono" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">v3: bal = $900</text>
  <text x="703" y="209" class="mono" font-size="10" fill="#44403c" text-anchor="middle">t_xmin=15, t_xmax=∞</text>
  <text x="703" y="227" class="sans" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">SKIP (15 active!)</text>

  <line x1="780" y1="208" x2="796" y2="208" stroke="#57534e" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <rect x="802" y="172" width="160" height="72" rx="7" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.8"/>
  <text x="882" y="191" class="mono" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">v2: bal = $500</text>
  <text x="882" y="209" class="mono" font-size="10" fill="#44403c" text-anchor="middle">t_xmin=12, t_xmax=15</text>
  <text x="882" y="227" class="sans" font-size="10" font-weight="700" fill="#0f766e" text-anchor="middle">VISIBLE TO T14 ✓</text>

  <line x1="962" y1="208" x2="978" y2="208" stroke="#d6d0c4" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="984" y="172" width="174" height="72" rx="7" fill="#faf8f5" stroke="#d6d0c4" stroke-width="1.4"/>
  <text x="1071" y="191" class="mono" font-size="11" font-weight="700" fill="#57534e" text-anchor="middle">v1: bal = $200</text>
  <text x="1071" y="209" class="mono" font-size="10" fill="#57534e" text-anchor="middle">t_xmin=5, t_xmax=12</text>
  <text x="1071" y="227" class="sans" font-size="10" fill="#57534e" text-anchor="middle">Superseded (VACUUM)</text>

  <!-- Animated Visibility Probe -->
  <g class="mvscan">
    <rect x="622" y="168" width="162" height="80" rx="9" fill="none" stroke="#0f766e" stroke-width="2.5"/>
  </g>
  <text x="626" y="274" class="sans" font-size="10.5" fill="#44403c">Write conflict rule: First-Committer-Wins; concurrent updaters abort on t_xmax race.</text>
  <text x="626" y="292" class="mono" font-size="10" fill="#065f46">Snapshot Isolation still permits Write Skew unless upgraded to SSI.</text>

  <!-- QUADRANT 3 (BOTTOM-LEFT): SSI RW-ANTIDEPENDENCY -->
  <rect x="24" y="330" width="564" height="236" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <rect x="24" y="330" width="564" height="32" rx="10" fill="#f5f1e8"/>
  <rect x="24" y="352" width="564" height="10" fill="#f5f1e8"/>
  <text x="40" y="351" class="sans" font-size="12.5" font-weight="700" fill="#1c1917">3. SSI (rw-Cycle Guard)</text>
  <text x="572" y="351" class="mono" font-size="10.5" fill="#57534e" text-anchor="end">Zero read locks · True Serializability</text>

  <rect x="42" y="380" width="136" height="72" rx="7" fill="#f5f1e8" stroke="#0f766e" stroke-width="1.5"/>
  <text x="110" y="402" class="mono" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">T1</text>
  <text x="110" y="420" class="mono" font-size="10" fill="#44403c" text-anchor="middle">Reads x (v1)</text>
  <text x="110" y="437" class="sans" font-size="10" fill="#065f46" text-anchor="middle">Committed</text>

  <rect x="234" y="380" width="144" height="72" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
  <text x="306" y="402" class="mono" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle">T2 (Pivot)</text>
  <text x="306" y="420" class="mono" font-size="10" fill="#44403c" text-anchor="middle">Writes x, Reads y</text>
  <text x="306" y="437" class="sans" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">in + out rw-edge!</text>

  <rect x="434" y="380" width="136" height="72" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="502" y="402" class="mono" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="middle">T3</text>
  <text x="502" y="420" class="mono" font-size="10" fill="#44403c" text-anchor="middle">Writes y (v2)</text>
  <text x="502" y="437" class="mono" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">ABORT T3!</text>

  <g class="ssie">
    <line x1="178" y1="416" x2="228" y2="416" stroke="#b45309" stroke-width="2.2" marker-end="url(#arr-amber)"/>
    <text x="203" y="406" class="mono" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">rw(x)</text>
    <line x1="378" y1="416" x2="428" y2="416" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-rose)"/>
    <text x="403" y="406" class="mono" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">rw(y)</text>

    <rect x="42" y="472" width="528" height="76" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
    <text x="58" y="494" class="sans" font-size="11.5" font-weight="700" fill="#991b1b">Dangerous Structure: Two Consecutive rw-Antidependencies (T1 →rw T2 →rw T3)</text>
    <text x="58" y="514" class="sans" font-size="10.5" fill="#44403c">SIREAD predicate locks track read sets without blocking; pivot T2 signals Write Skew risk.</text>
    <text x="58" y="532" class="mono" font-size="10" fill="#7f1d1d">Aborting T3 guarantees serializability (trade-off: occasional false-positive aborts).</text>
  </g>

  <!-- QUADRANT 4 (BOTTOM-RIGHT): OPTIMISTIC CONCURRENCY CONTROL (OCC) -->
  <rect x="608" y="330" width="568" height="236" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <rect x="608" y="330" width="568" height="32" rx="10" fill="#f5f1e8"/>
  <rect x="608" y="352" width="568" height="10" fill="#f5f1e8"/>
  <text x="624" y="351" class="sans" font-size="12.5" font-weight="700" fill="#1c1917">4. Optimistic Concurrency Control (OCC: Read → Validate → Write)</text>
  <text x="1160" y="351" class="mono" font-size="10.5" fill="#57534e" text-anchor="end">Turso · Redis WATCH</text>

  <!-- 3 OCC Phase Boxes -->
  <rect x="626" y="384" width="160" height="92" rx="7" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.5"/>
  <text x="706" y="404" class="sans" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">1. Read Phase</text>
  <text x="706" y="424" class="mono" font-size="10" fill="#44403c" text-anchor="middle">ReadSet = {K1@v4}</text>
  <text x="706" y="442" class="mono" font-size="10" fill="#44403c" text-anchor="middle">Buffer writes locally</text>
  <text x="706" y="460" class="sans" font-size="10" fill="#065f46" text-anchor="middle">Zero locks acquired</text>

  <line x1="786" y1="430" x2="804" y2="430" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <rect x="810" y="384" width="164" height="92" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="892" y="404" class="sans" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle">2. Validate Phase</text>
  <text x="892" y="424" class="mono" font-size="10" fill="#44403c" text-anchor="middle">RS ∩ WriteSet_other</text>
  <text x="892" y="442" class="mono" font-size="10" font-weight="700" fill="#0f766e" text-anchor="middle">= ∅ → PASS</text>
  <text x="892" y="460" class="mono" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">≠ ∅ → ABORT &amp; RETRY</text>

  <line x1="974" y1="430" x2="992" y2="430" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-emerald)"/>

  <rect x="998" y="384" width="160" height="92" rx="7" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1078" y="404" class="sans" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">3. Write Phase</text>
  <text x="1078" y="424" class="mono" font-size="10" fill="#44403c" text-anchor="middle">Flush workspace</text>
  <text x="1078" y="442" class="mono" font-size="10" fill="#065f46" text-anchor="middle">K1: v4 → v5</text>
  <text x="1078" y="460" class="sans" font-size="10" fill="#0f766e" text-anchor="middle">Atomic commit</text>

  <!-- Animated OCC Phase Highlight -->
  <rect x="622" y="380" width="168" height="100" rx="9" fill="none" stroke="#1c1917" stroke-width="2.4" class="occs"/>

  <rect x="626" y="492" width="532" height="56" rx="7" fill="#faf8f5" stroke="#d6d0c4"/>
  <text x="640" y="513" class="sans" font-size="10.5" font-weight="700" fill="#1c1917">Workload Fit:</text>
  <text x="640" y="531" class="sans" font-size="10.5" fill="#44403c">Excels under low contention; degrades via retry livelock when hot keys collide frequently.</text>

  <!-- BOTTOM 4 STEP CARDS -->
  <rect x="24" y="582" width="276" height="134" rx="8" fill="#fef2f2" class="s1"/>
  <rect x="38" y="594" width="56" height="22" rx="4" fill="#dc2626"/>
  <text x="66" y="609" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Step 1</text>
  <text x="104" y="609" class="sans" font-size="12" font-weight="700" fill="#991b1b">S2PL Deadlock</text>
  <text x="38" y="636" class="sans" font-size="10.5" fill="#44403c">Wait-For Graph detects T1↔T2</text>
  <text x="38" y="652" class="sans" font-size="10.5" fill="#44403c">cycle; aborts youngest T2 to</text>
  <text x="38" y="668" class="sans" font-size="10.5" fill="#44403c">unblock locks held until commit.</text>

  <rect x="316" y="582" width="276" height="134" rx="8" fill="#f0fdf9" class="s2"/>
  <rect x="330" y="594" width="56" height="22" rx="4" fill="#0f766e"/>
  <text x="358" y="609" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Step 2</text>
  <text x="396" y="609" class="sans" font-size="12" font-weight="700" fill="#065f46">MVCC Snapshot</text>
  <text x="330" y="636" class="sans" font-size="10.5" fill="#44403c">Reader T14 traverses version</text>
  <text x="330" y="652" class="sans" font-size="10.5" fill="#44403c">chain and picks v2 via t_xmin,</text>
  <text x="330" y="668" class="sans" font-size="10.5" fill="#44403c">t_xmax without blocking writers.</text>

  <rect x="608" y="582" width="276" height="134" rx="8" fill="#f5f1e8" class="s3"/>
  <rect x="622" y="594" width="56" height="22" rx="4" fill="#0f766e"/>
  <text x="650" y="609" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Step 3</text>
  <text x="688" y="609" class="sans" font-size="12" font-weight="700" fill="#065f46">SSI Guard</text>
  <text x="622" y="636" class="sans" font-size="10.5" fill="#44403c">Tracks rw-antidependency pairs;</text>
  <text x="622" y="652" class="sans" font-size="10.5" fill="#44403c">aborts T3 on dangerous pivot</text>
  <text x="622" y="668" class="sans" font-size="10.5" fill="#44403c">T2 to prevent Write Skew.</text>

  <rect x="900" y="582" width="276" height="134" rx="8" fill="#f0fdf9" class="s4"/>
  <rect x="914" y="594" width="56" height="22" rx="4" fill="#0f766e"/>
  <text x="942" y="609" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Step 4</text>
  <text x="980" y="609" class="sans" font-size="12" font-weight="700" fill="#065f46">OCC Commit</text>
  <text x="914" y="636" class="sans" font-size="10.5" fill="#44403c">Validates ReadSet at commit</text>
  <text x="914" y="652" class="sans" font-size="10.5" fill="#44403c">time; applies private workspace</text>
  <text x="914" y="668" class="sans" font-size="10.5" fill="#44403c">atomically when conflict-free.</text>
</svg>
