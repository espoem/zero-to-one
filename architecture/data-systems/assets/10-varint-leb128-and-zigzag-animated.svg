<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="title desc">
  <title id="title">Binary Wire Encoding: ZigZag Interleaving and LEB128 7-Bit Varint Packing</title>
  <desc id="desc">Animated two-panel diagram showing ZigZag signed-to-unsigned integer interleaving (0 to 0, -1 to 1, 1 to 2, -2 to 3, and 150 to 300) via (n &lt;&lt; 1) XOR (n &gt;&gt; 63), feeding LEB128 Base-128 Varint 7-bit chunk packing for unsigned 300 into two bytes: Byte 1 [MSB=1 | 0101100] (0xAC) and Byte 2 [MSB=0 | 0000010] (0x02).</desc>

  <defs>
    <style>
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

      /* 12s cycle */
      
      @keyframes chunk-split {
        0%, 24% { opacity: 0.86; transform: translateY(8px); }
        34%, 100% { opacity: 1; transform: translateY(0px); }
      }
      @keyframes byte-pack {
        0%, 50% { opacity: 0.86; transform: translateX(-8px); }
        60%, 100% { opacity: 1; transform: translateX(0px); }
      }
      @keyframes wire-emit {
        0%, 72% { opacity: 0.86; }
        82%, 100% { opacity: 1; }
      }

      @keyframes st-1 { 0%, 24% { opacity: 1; stroke: #0f766e; stroke-width: 2.5; } 25%, 100% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1.2; } }
      @keyframes st-2 { 0%, 24% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1.2; } 25%, 49% { opacity: 1; stroke: #0f766e; stroke-width: 2.5; } 50%, 100% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1.2; } }
      @keyframes st-3 { 0%, 49% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1.2; } 50%, 74% { opacity: 1; stroke: #b45309; stroke-width: 2.5; } 75%, 100% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1.2; } }
      @keyframes st-4 { 0%, 74% { opacity: 0.86; stroke: #d6d0c4; stroke-width: 1.2; } 75%, 100% { opacity: 1; stroke: #0f766e; stroke-width: 2.5; } }
      .cspl { animation: chunk-split 12s ease-out infinite; }
      .bpk { animation: byte-pack 12s ease-out infinite; }
      .wem { animation: wire-emit 12s ease-out infinite; }

      .s1 { animation: st-1 12s linear infinite; }
      .s2 { animation: st-2 12s linear infinite; }
      .s3 { animation: st-3 12s linear infinite; }
      .s4 { animation: st-4 12s linear infinite; }

      @media (prefers-reduced-motion: reduce) {
        .zzp, .cspl, .bpk, .wem, .s1, .s2, .s3, .s4 {
          animation: none !important;
        }
        .zzp, .cspl, .bpk, .wem, .s1, .s2, .s3, .s4 {
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>

    <marker id="arr-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1200" height="700" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>

  <!-- Header -->
  <line x1="24" y1="64" x2="1176" y2="64" stroke="#1c1917" stroke-width="1.2"/>
  
  <text x="24" y="28" class="sans" font-size="18" font-weight="700" fill="#1c1917" font-family="Georgia, 'Times New Roman', serif">Binary Wire Encoding: ZigZag Interleaving &amp; LEB128 Varint Packing</text>
  <text x="24" y="48" class="sans" font-size="12" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">Compressing signed integers (sint32/sint64) via ZigZag mapping and 7-bit little-endian Base-128 continuation chunks</text>

  <!-- LEFT PANEL: ZIGZAG INTERLEAVING -->
  <rect x="24" y="78" width="516" height="432" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <rect x="24" y="78" width="516" height="34" rx="10" fill="#f5f1e8"/>
  <rect x="24" y="102" width="516" height="10" fill="#f5f1e8"/>
  <text x="40" y="100" class="sans" font-size="12.5" font-weight="700" fill="#1c1917">1. ZigZag Signed-to-Unsigned Mapping</text>
  <text x="524" y="100" class="mono" font-size="10.5" fill="#57534e" text-anchor="end">Avoids 10-byte negative varints</text>

  <!-- Formula -->
  <rect x="42" y="124" width="480" height="44" rx="7" fill="#f5f1e8" stroke="#0f766e" stroke-width="1.5" class="zzp"/>
  <text x="282" y="146" class="mono" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">ZigZag(n) = (n &lt;&lt; 1) ⊕ (n &gt;&gt; 63)</text>
  <text x="282" y="162" class="sans" font-size="10" fill="#065f46" text-anchor="middle">Arithmetic sign-extension flips bits for negative n, placing sign in LSB</text>

  <!-- Mapping Table -->
  <rect x="42" y="182" width="480" height="26" rx="4" fill="#f5f1e8" stroke="#d6d0c4"/>
  <text x="96" y="199" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">Signed n</text>
  <text x="228" y="199" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">Raw Two's Comp.</text>
  <text x="366" y="199" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">ZigZag u</text>
  <text x="470" y="199" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">Varint</text>

  <!-- Rows -->
  <rect x="42" y="208" width="480" height="28" fill="#ffffff" stroke="#e7e2d8"/>
  <text x="96" y="226" class="mono" font-size="11" font-weight="700" fill="#1c1917" text-anchor="middle">0</text>
  <text x="228" y="226" class="mono" font-size="10.5" fill="#57534e" text-anchor="middle">0x0000...00</text>
  <text x="366" y="226" class="mono" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle">0 (0b000)</text>
  <text x="470" y="226" class="mono" font-size="10.5" fill="#0f766e" text-anchor="middle">1 B</text>

  <rect x="42" y="236" width="480" height="28" fill="#fef2f2" stroke="#fecdd3"/>
  <text x="96" y="254" class="mono" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">-1</text>
  <text x="228" y="254" class="mono" font-size="10.5" fill="#dc2626" text-anchor="middle">0xFFFF...FF (10B!)</text>
  <text x="366" y="254" class="mono" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle">1 (0b001)</text>
  <text x="470" y="254" class="mono" font-size="10.5" font-weight="700" fill="#0f766e" text-anchor="middle">1 B ✓</text>

  <rect x="42" y="264" width="480" height="28" fill="#ffffff" stroke="#e7e2d8"/>
  <text x="96" y="282" class="mono" font-size="11" font-weight="700" fill="#1c1917" text-anchor="middle">1</text>
  <text x="228" y="282" class="mono" font-size="10.5" fill="#57534e" text-anchor="middle">0x0000...01</text>
  <text x="366" y="282" class="mono" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle">2 (0b010)</text>
  <text x="470" y="282" class="mono" font-size="10.5" fill="#0f766e" text-anchor="middle">1 B</text>

  <rect x="42" y="292" width="480" height="28" fill="#fef2f2" stroke="#fecdd3"/>
  <text x="96" y="310" class="mono" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">-2</text>
  <text x="228" y="310" class="mono" font-size="10.5" fill="#dc2626" text-anchor="middle">0xFFFF...FE (10B!)</text>
  <text x="366" y="310" class="mono" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle">3 (0b011)</text>
  <text x="470" y="310" class="mono" font-size="10.5" font-weight="700" fill="#0f766e" text-anchor="middle">1 B ✓</text>

  <rect x="42" y="320" width="480" height="30" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.5"/>
  <text x="96" y="339" class="mono" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">+150</text>
  <text x="228" y="339" class="mono" font-size="10.5" fill="#44403c" text-anchor="middle">0x0000...96</text>
  <text x="366" y="339" class="mono" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">300 (0x012C)</text>
  <text x="470" y="339" class="mono" font-size="10.5" font-weight="700" fill="#0f766e" text-anchor="middle">2 B →</text>

  <!-- Interleaving explanation -->
  <rect x="42" y="366" width="480" height="126" rx="7" fill="#faf8f5" stroke="#d6d0c4"/>
  <text x="58" y="388" class="sans" font-size="11" font-weight="700" fill="#1c1917">Bitwise Walkthrough for n = -1 (64-bit):</text>
  <text x="58" y="408" class="mono" font-size="10" fill="#44403c">(n &lt;&lt; 1)  = 1111...1110</text>
  <text x="58" y="426" class="mono" font-size="10" fill="#44403c">(n &gt;&gt; 63) = 1111...1111  (arithmetic sign mask)</text>
  <text x="58" y="446" class="mono" font-size="10.5" font-weight="700" fill="#0f766e">XOR       = 0000...0001  = 1  (90% wire savings!)</text>
  <text x="58" y="472" class="sans" font-size="10" fill="#44403c">Even unsigned outputs encode ≥ 0; odd outputs encode &lt; 0.</text>

  <!-- Feed Arrow to Right Panel -->
  <line x1="522" y1="335" x2="574" y2="335" stroke="#0f766e" stroke-width="2.4" marker-end="url(#arr-blue)"/>

  <!-- RIGHT PANEL: LEB128 7-BIT VARINT PACKING -->
  <rect x="560" y="78" width="616" height="432" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <rect x="560" y="78" width="616" height="34" rx="10" fill="#f5f1e8"/>
  <rect x="560" y="102" width="616" height="10" fill="#f5f1e8"/>
  <text x="576" y="100" class="sans" font-size="12.5" font-weight="700" fill="#1c1917">2. LEB128 7-Bit Varint Packing (Value = 300 = 0x012C)</text>
  <text x="1160" y="100" class="mono" font-size="10.5" fill="#57534e" text-anchor="end">Little-Endian 7-bit groups</text>

  <!-- Step A: 14-bit Binary -->
  <rect x="578" y="126" width="580" height="72" rx="7" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.4"/>
  <text x="594" y="146" class="sans" font-size="11.5" font-weight="700" fill="#065f46">A. Unsigned 300 in Binary (256 + 44):</text>
  <rect x="594" y="156" width="246" height="30" rx="5" fill="#f0fdf9" stroke="#0f766e"/>
  <text x="717" y="176" class="mono" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">Upper 7 bits: 0000010 (= 2)</text>
  <rect x="854" y="156" width="286" height="30" rx="5" fill="#fffbeb" stroke="#b45309"/>
  <text x="997" y="176" class="mono" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Lower 7 bits: 0101100 (= 44)</text>

  <!-- Step B: Little-Endian Reorder + MSB Continuation Bit -->
  <g class="cspl">
    <line x1="717" y1="198" x2="1008" y2="232" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-blue)"/>
    <line x1="997" y1="198" x2="720" y2="232" stroke="#b45309" stroke-width="1.8" marker-end="url(#arr-blue)"/>
    <rect x="780" y="204" width="180" height="20" rx="10" fill="#faf8f5" stroke="#d6d0c4"/>
    <text x="870" y="218" class="sans" font-size="10" font-weight="700" fill="#44403c" text-anchor="middle">LSB chunk emitted first!</text>
  </g>

  <!-- Step C: Packed Bytes -->
  <g class="bpk">
    <!-- Byte 1 -->
    <rect x="578" y="238" width="280" height="122" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
    <text x="718" y="258" class="sans" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Byte 1 (0xAC = 172)</text>
    <rect x="594" y="270" width="56" height="44" rx="5" fill="#dc2626"/>
    <text x="622" y="290" class="mono" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="622" y="306" class="mono" font-size="10" fill="#fef2f2" text-anchor="middle">MSB=1</text>

    <rect x="656" y="270" width="186" height="44" rx="5" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
    <text x="749" y="291" class="mono" font-size="13" font-weight="700" fill="#1c1917" text-anchor="middle">0 1 0 1 1 0 0</text>
    <text x="749" y="307" class="mono" font-size="10" fill="#92400e" text-anchor="middle">7-bit payload = 44</text>
    <text x="718" y="340" class="sans" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">MSB = 1 → More bytes follow!</text>

    <!-- Byte 2 -->
    <rect x="878" y="238" width="280" height="122" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.6"/>
    <text x="1018" y="258" class="sans" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">Byte 2 (0x02 = 2)</text>
    <rect x="894" y="270" width="56" height="44" rx="5" fill="#0f766e"/>
    <text x="922" y="290" class="mono" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">0</text>
    <text x="922" y="306" class="mono" font-size="10" fill="#f0fdf9" text-anchor="middle">MSB=0</text>

    <rect x="956" y="270" width="186" height="44" rx="5" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/>
    <text x="1049" y="291" class="mono" font-size="13" font-weight="700" fill="#1c1917" text-anchor="middle">0 0 0 0 0 1 0</text>
    <text x="1049" y="307" class="mono" font-size="10" fill="#065f46" text-anchor="middle">7-bit payload = 2</text>
    <text x="1018" y="340" class="sans" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">MSB = 0 → Final byte (Stop!)</text>
  </g>

  <!-- Step D: Wire Output & Decoding Reconstruction -->
  <g class="wem">
    <rect x="578" y="378" width="580" height="114" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.6"/>
    <text x="594" y="400" class="sans" font-size="11.5" font-weight="700" fill="#065f46">Wire Payload Emitted:  [ 0xAC , 0x02 ]  (2 bytes instead of 8-byte int64 → 75% savings)</text>
    <text x="594" y="424" class="mono" font-size="10.5" fill="#44403c">Decode: (44 &lt;&lt; 0) | (2 &lt;&lt; 7) = 44 + 256 = 300</text>
    <text x="594" y="446" class="mono" font-size="10.5" font-weight="700" fill="#065f46">UnZigZag(u): (u &gt;&gt;&gt; 1) ^ -(u &amp; 1) = (300 &gt;&gt; 1) ^ 0 = +150</text>
    <text x="594" y="472" class="sans" font-size="10" fill="#065f46">Used across Protobuf, Thrift, Avro, SQLite4, and Lucene postings delta gaps.</text>
  </g>

  <!-- BOTTOM 4 STEP CARDS -->
  <rect x="24" y="526" width="276" height="148" rx="8" fill="#f5f1e8" class="s1"/>
  <rect x="38" y="540" width="56" height="22" rx="4" fill="#0f766e"/>
  <text x="66" y="555" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Step 1</text>
  <text x="104" y="555" class="sans" font-size="12" font-weight="700" fill="#065f46">ZigZag Map</text>
  <text x="38" y="582" class="mono" font-size="10" fill="#44403c">0→0, -1→1, 1→2, -2→3</text>
  <text x="38" y="602" class="sans" font-size="10.5" fill="#44403c">Interleaves negative integers next</text>
  <text x="38" y="618" class="sans" font-size="10.5" fill="#44403c">to zero so small negatives drop</text>
  <text x="38" y="634" class="sans" font-size="10.5" fill="#44403c">leading 1-bits before Varint.</text>

  <rect x="316" y="526" width="276" height="148" rx="8" fill="#f0fdf9" class="s2"/>
  <rect x="330" y="540" width="56" height="22" rx="4" fill="#0f766e"/>
  <text x="358" y="555" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Step 2</text>
  <text x="396" y="555" class="sans" font-size="12" font-weight="700" fill="#065f46">7-Bit Chunking</text>
  <text x="330" y="582" class="mono" font-size="10" fill="#44403c">300 = [0000010] [0101100]</text>
  <text x="330" y="602" class="sans" font-size="10.5" fill="#44403c">Splits unsigned value into 7-bit</text>
  <text x="330" y="618" class="sans" font-size="10.5" fill="#44403c">groups ordered least-significant</text>
  <text x="330" y="634" class="sans" font-size="10.5" fill="#44403c">chunk first (LEB128).</text>

  <rect x="608" y="526" width="276" height="148" rx="8" fill="#fffbeb" class="s3"/>
  <rect x="622" y="540" width="56" height="22" rx="4" fill="#b45309"/>
  <text x="650" y="555" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Step 3</text>
  <text x="688" y="555" class="sans" font-size="12" font-weight="700" fill="#92400e">Continuation MSB</text>
  <text x="622" y="582" class="mono" font-size="10" fill="#44403c">MSB=1: 0xAC · MSB=0: 0x02</text>
  <text x="622" y="602" class="sans" font-size="10.5" fill="#44403c">Sets bit 7 to 1 on intermediate</text>
  <text x="622" y="618" class="sans" font-size="10.5" fill="#44403c">bytes and 0 on the terminal byte</text>
  <text x="622" y="634" class="sans" font-size="10.5" fill="#44403c">for self-delimiting framing.</text>

  <rect x="900" y="526" width="276" height="148" rx="8" fill="#f0fdf9" class="s4"/>
  <rect x="914" y="540" width="56" height="22" rx="4" fill="#0f766e"/>
  <text x="942" y="555" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Step 4</text>
  <text x="980" y="555" class="sans" font-size="12" font-weight="700" fill="#065f46">Wire Decode</text>
  <text x="914" y="582" class="mono" font-size="10" fill="#0f766e">44 | (2 &lt;&lt; 7) = 300 → +150</text>
  <text x="914" y="602" class="sans" font-size="10.5" fill="#44403c">Compact 1–2 byte transport for</text>
  <text x="914" y="618" class="sans" font-size="10.5" fill="#44403c">small ints; large 64-bit ints cost</text>
  <text x="914" y="634" class="sans" font-size="10.5" fill="#44403c">up to 10 bytes (use fixed64).</text>
</svg>
