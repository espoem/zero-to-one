<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" role="img" aria-labelledby="title desc">
  <title id="title">End-to-End RAG Pipeline: Contextual Indexing, Pre-Filtered Hybrid Retrieval &amp; Evaluation</title>
  <desc id="desc">Static Editorial Paper diagram illustrating offline ingestion, small-to-big contextual chunking, MRL plus BM25 indexing, online ACL pre-filtered hybrid RRF retrieval, Cross-Encoder reranking, Validator Sandwich egress checks, and Ragas 0.4.4 evaluation.</desc>
  <defs>
    <marker id="ed-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,2 L9,5 L1,8" fill="none" stroke="#1c1917" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ed-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,2 L9,5 L1,8" fill="none" stroke="#0f766e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .ed-serif { font-family: Georgia, "Times New Roman", serif; }
    .ed-sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .ed-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .rag-s1 { animation: rag-hl-1 12s infinite; }
    .rag-s2 { animation: rag-hl-2 12s infinite; }
    .rag-s3 { animation: rag-hl-3 12s infinite; }
    .rag-s4 { animation: rag-hl-4 12s infinite; }
    .rag-s5 { animation: rag-hl-5 12s infinite; }
    .rag-s6 { animation: rag-hl-6 12s infinite; }
    .rag-s7 { animation: rag-hl-7 12s infinite; }
    .rag-s8 { animation: rag-hl-8 12s infinite; }
    @keyframes rag-hl-1 { 0%, 12.5%, 100% { stroke: #1c1917; stroke-width: 1.2; } 2%, 10.5% { stroke: #0f766e; stroke-width: 2.6; } }
    @keyframes rag-hl-2 { 0%, 12.5%, 25%, 100% { stroke: #1c1917; stroke-width: 1.2; } 14.5%, 23% { stroke: #0f766e; stroke-width: 2.6; } }
    @keyframes rag-hl-3 { 0%, 25%, 37.5%, 100% { stroke: #1c1917; stroke-width: 1.2; } 27%, 35.5% { stroke: #0f766e; stroke-width: 2.6; } }
    @keyframes rag-hl-4 { 0%, 37.5%, 50%, 100% { stroke: #0f766e; stroke-width: 1.2; } 39.5%, 48% { stroke: #0f766e; stroke-width: 2.6; } }
    @keyframes rag-hl-5 { 0%, 50%, 62.5%, 100% { stroke: #1c1917; stroke-width: 1; } 52%, 60.5% { stroke: #b45309; stroke-width: 2.4; } }
    @keyframes rag-hl-6 { 0%, 62.5%, 75%, 100% { stroke: #1c1917; stroke-width: 1; } 64.5%, 73% { stroke: #0f766e; stroke-width: 2.4; } }
    @keyframes rag-hl-7 { 0%, 75%, 87.5%, 100% { stroke: #b45309; stroke-width: 1.2; } 77%, 85.5% { stroke: #b45309; stroke-width: 2.4; } }
    @keyframes rag-hl-8 { 0%, 87.5%, 100% { stroke: #0f766e; stroke-width: 1.2; } 89.5%, 98% { stroke: #0f766e; stroke-width: 2.4; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect x="0" y="0" width="980" height="430" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>
  <text x="32" y="34" class="ed-mono" font-size="10.5" fill="#78716c" letter-spacing="1.4">RAG PIPELINE ARCHITECTURE · INGEST → CHUNK → EMBED → STORE → RETRIEVE → GENERATE → EVALUATE</text>
  <text x="32" y="58" class="ed-serif" font-size="19.5" font-weight="700" fill="#1c1917">Offline Contextual Indexing Feeds Pre-Filtered Hybrid Synthesis</text>
  <line x1="32" y1="72" x2="948" y2="72" stroke="#1c1917" stroke-width="1.2"/>

  <!-- Lane 1: Offline Indexing -->
  <text x="32" y="98" class="ed-mono" font-size="10.5" font-weight="700" fill="#0f766e" letter-spacing="1">A · OFFLINE INDEXING PLANE</text>
  <line x1="32" y1="106" x2="948" y2="106" stroke="#d6d0c4" stroke-width="0.8"/>

  <g transform="translate(32, 120)">
    <text x="0" y="14" class="ed-sans" font-size="13" font-weight="700" fill="#1c1917">1. Normalize &amp; ACL Tag</text>
    <line class="rag-s1" x1="0" y1="22" x2="188" y2="22" stroke="#1c1917" stroke-width="1.2"/>
    <text x="0" y="40" class="ed-sans" font-size="11.5" fill="#44403c">AST / table parse, SHA-256</text>
    <text x="0" y="56" class="ed-sans" font-size="11.5" fill="#44403c">Attach tenantId + docVer</text>

    <line x1="196" y1="36" x2="246" y2="36" stroke="#1c1917" stroke-width="1.2" marker-end="url(#ed-arr)"/>
    <text x="221" y="29" class="ed-mono" font-size="9.5" fill="#78716c" text-anchor="middle">split</text>

    <text x="256" y="14" class="ed-sans" font-size="13" font-weight="700" fill="#1c1917">2. Small-to-Big + Context</text>
    <line class="rag-s2" x1="256" y1="22" x2="454" y2="22" stroke="#1c1917" stroke-width="1.2"/>
    <text x="256" y="40" class="ed-sans" font-size="11.5" fill="#44403c">192t child → 1024t parent</text>
    <text x="256" y="56" class="ed-sans" font-size="11.5" fill="#0f766e">+60t LLM situating header</text>

    <line x1="462" y1="36" x2="512" y2="36" stroke="#1c1917" stroke-width="1.2" marker-end="url(#ed-arr)"/>
    <text x="487" y="29" class="ed-mono" font-size="9.5" fill="#78716c" text-anchor="middle">encode</text>

    <text x="522" y="14" class="ed-sans" font-size="13" font-weight="700" fill="#1c1917">3. Dual Representation</text>
    <line class="rag-s3" x1="522" y1="22" x2="696" y2="22" stroke="#1c1917" stroke-width="1.2"/>
    <text x="522" y="40" class="ed-sans" font-size="11.5" fill="#44403c">MRL 768d + L2 normalize</text>
    <text x="522" y="56" class="ed-sans" font-size="11.5" fill="#44403c">Okapi BM25 token counts</text>

    <line x1="704" y1="36" x2="752" y2="36" stroke="#1c1917" stroke-width="1.2" marker-end="url(#ed-arr)"/>
    <text x="728" y="29" class="ed-mono" font-size="9.5" fill="#78716c" text-anchor="middle">upsert</text>

    <rect class="rag-s4" x="756" y="0" width="160" height="68" rx="3" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.2"/>
    <text x="768" y="19" class="ed-sans" font-size="12.5" font-weight="700" fill="#0f766e">4. Versioned Store</text>
    <text x="768" y="38" class="ed-mono" font-size="10" fill="#1c1917">HNSW (int8) + BM25</text>
    <text x="768" y="55" class="ed-mono" font-size="10" fill="#57534e">ACL bitsets · index_vN</text>
  </g>

  <line x1="32" y1="212" x2="948" y2="212" stroke="#d6d0c4" stroke-dasharray="3 3"/>

  <!-- Lane 2: Online Plane -->
  <text x="32" y="238" class="ed-mono" font-size="10.5" font-weight="700" fill="#b45309" letter-spacing="1">B · ONLINE RETRIEVAL, BOUNDED GENERATION &amp; RAGAS EVALUATION</text>
  <line x1="32" y1="246" x2="948" y2="246" stroke="#d6d0c4" stroke-width="0.8"/>

  <g transform="translate(32, 260)">
    <rect class="rag-s5" x="0" y="0" width="198" height="84" rx="3" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
    <text x="12" y="20" class="ed-sans" font-size="12.5" font-weight="700" fill="#1c1917">5. Rewrite + ACL Pre-Filter</text>
    <text x="12" y="39" class="ed-sans" font-size="11" fill="#44403c">Step-back / MultiQuery</text>
    <text x="12" y="56" class="ed-mono" font-size="10" fill="#b45309">WHERE tenantId = session</text>
    <text x="12" y="72" class="ed-sans" font-size="10.5" fill="#78716c">HNSW pushdown avoids 1% trap</text>

    <line x1="198" y1="42" x2="250" y2="42" stroke="#1c1917" stroke-width="1.2" marker-end="url(#ed-arr)"/>
    <text x="224" y="33" class="ed-mono" font-size="9" fill="#78716c" text-anchor="middle">top-150</text>

    <rect class="rag-s6" x="254" y="0" width="206" height="84" rx="3" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
    <text x="266" y="20" class="ed-sans" font-size="12.5" font-weight="700" fill="#1c1917">6. RRF Fuse &amp; Rerank</text>
    <text x="266" y="39" class="ed-mono" font-size="10" fill="#0f766e">RRF = sum 1/(60 + rank)</text>
    <text x="266" y="56" class="ed-sans" font-size="11" fill="#44403c">Cross-Encoder 150 → 8 spans</text>
    <text x="266" y="72" class="ed-sans" font-size="10.5" fill="#78716c">Top-1/2 placed at edges</text>

    <line x1="460" y1="42" x2="500" y2="42" stroke="#1c1917" stroke-width="1.2" marker-end="url(#ed-arr)"/>
    <text x="480" y="33" class="ed-mono" font-size="9.5" fill="#78716c" text-anchor="middle">top-8</text>

    <rect class="rag-s7" x="504" y="0" width="216" height="84" rx="3" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
    <text x="516" y="20" class="ed-sans" font-size="12.5" font-weight="700" fill="#92400e">7. Validator Sandwich</text>
    <text x="516" y="39" class="ed-mono" font-size="10" fill="#44403c">&lt;untrusted_context&gt; + CFG</text>
    <text x="516" y="56" class="ed-sans" font-size="11" fill="#44403c">Verify citationIds + PII</text>
    <text x="516" y="72" class="ed-sans" font-size="10.5" fill="#92400e">Fail closed on ungrounded claim</text>

    <line x1="720" y1="42" x2="760" y2="42" stroke="#0f766e" stroke-width="1.2" marker-end="url(#ed-arr-teal)"/>
    <text x="740" y="33" class="ed-mono" font-size="9.5" fill="#0f766e" text-anchor="middle">eval</text>

    <rect class="rag-s8" x="764" y="0" width="152" height="84" rx="3" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/>
    <text x="776" y="20" class="ed-sans" font-size="12.5" font-weight="700" fill="#0f766e">8. Ragas 0.4.4 Gate</text>
    <text x="776" y="39" class="ed-sans" font-size="11" fill="#44403c">Faithfulness ≥ 0.92</text>
    <text x="776" y="56" class="ed-sans" font-size="11" fill="#44403c">Ctx Prec@K / Recall</text>
    <text x="776" y="72" class="ed-sans" font-size="10.5" fill="#78716c">Feeds CI golden corpus</text>
  </g>

  <line x1="32" y1="364" x2="948" y2="364" stroke="#e7e2d8"/>
  <circle cx="38" cy="384" r="3" fill="#b45309"/>
  <text x="48" y="388" class="ed-sans" font-size="11.5" fill="#57534e">Security boundary: untrusted PDFs stay wrapped inside &lt;untrusted_context&gt;, and session ACL predicates run strictly prior to HNSW/BM25 scoring.</text>
  <text x="32" y="409" class="ed-mono" font-size="10.5" fill="#78716c">Sources: Anthropic Contextual Retrieval (2024) · Cormack et al. RRF (SIGIR 2009) · Ragas 0.4.4 Spec</text>
</svg>
