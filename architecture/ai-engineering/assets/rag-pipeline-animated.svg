<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1020; }
      .panel { fill: #121a30; stroke: #2b3b66; stroke-width: 1.5; rx: 10; }
      .box-blue { fill: #152546; stroke: #4c8bf5; stroke-width: 1.6; rx: 8; }
      .box-green { fill: #122d26; stroke: #2ec486; stroke-width: 1.6; rx: 8; }
      .box-amber { fill: #2f2513; stroke: #f5a623; stroke-width: 1.6; rx: 8; }
      .box-purple { fill: #24193c; stroke: #a66bff; stroke-width: 1.6; rx: 8; }
      .box-red { fill: #33161e; stroke: #f05454; stroke-width: 1.6; rx: 8; }
      .title { font-family: 'Inter', -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: 'Inter', -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
      .sec-hdr { font-family: 'Inter', -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #e2e8f0; }
      .lbl { font-family: 'Inter', -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #f1f5f9; }
      .txt { font-family: 'Inter', -apple-system, sans-serif; font-size: 10.5px; fill: #cbd5e1; }
      .code { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 10px; fill: #93c5fd; }
      .code-green { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 10px; fill: #6ee7b7; }
      .code-amber { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 10px; fill: #fcd34d; }
      .flow { stroke: #60a5fa; stroke-width: 2; fill: none; marker-end: url(#arr-blue); }
      .flow-anim { stroke: #38bdf8; stroke-width: 2.2; stroke-dasharray: 8 6; fill: none; animation: dashMove 1.8s linear infinite; }
      .flow-green { stroke: #34d399; stroke-width: 2; fill: none; marker-end: url(#arr-green); }
      .flow-feedback { stroke: #a66bff; stroke-width: 1.8; stroke-dasharray: 6 4; fill: none; marker-end: url(#arr-purple); animation: dashMove 2.4s linear infinite; }
      @keyframes dashMove {
        to { stroke-dashoffset: -28; }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 0.4; r: 4; }
        50% { opacity: 1; r: 6; }
      }
      .pulse { animation: pulseDot 2s ease-in-out infinite; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#60a5fa"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#a66bff"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="540"/>

  <text class="title" x="24" y="34">End-to-End RAG Pipeline — Ingestion, Contextual Hybrid Indexing, Two-Stage Retrieval &amp; Ragas Evaluation</text>
  <text class="subtitle" x="24" y="54">Offline Indexing Plane (Ingest → Chunk → Embed → Store) + Online Query Plane (Pre-Filter → Hybrid RRF → Rerank → Validator Sandwich → Evaluate)</text>

  <!-- Offline Indexing Plane -->
  <rect class="panel" x="20" y="74" width="1240" height="170"/>
  <text class="sec-hdr" x="36" y="96">OFFLINE INDEXING PLANE</text>
  <circle class="pulse" cx="215" cy="91" r="4" fill="#34d399"/>

  <rect class="box-blue" x="36" y="112" width="250" height="114"/>
  <text class="lbl" x="48" y="134">1. Ingest &amp; Normalize</text>
  <text class="txt" x="48" y="154">• PDF / HTML / Markdown / Code AST</text>
  <text class="txt" x="48" y="172">• Attach tenantId, aclRoles, docVer</text>
  <text class="code" x="48" y="192">SHA-256 dedup + tombstone sync</text>
  <text class="txt" x="48" y="210">• Strip hidden injection markup</text>

  <rect class="box-amber" x="342" y="112" width="270" height="114"/>
  <text class="lbl" x="354" y="134">2. Chunk &amp; Contextualize</text>
  <text class="txt" x="354" y="154">• Structure-aware (200–800 tok, 15% ovlp)</text>
  <text class="txt" x="354" y="172">• Small-to-Big: child 192t → parent 1024t</text>
  <text class="code-amber" x="354" y="192">+ Anthropic Contextual Prefix (50–100t)</text>
  <text class="txt" x="354" y="210">• Preserves entity &amp; section provenance</text>

  <rect class="box-purple" x="668" y="112" width="260" height="114"/>
  <text class="lbl" x="680" y="134">3. MRL Embed &amp; Tokenize</text>
  <text class="txt" x="680" y="154">• gemini-embedding-2 / embed-v5.0-pro</text>
  <text class="code" x="680" y="174">MRL prefix: 3072 → 768/1536 dims</text>
  <text class="txt" x="680" y="192">• L2 normalize + BM25 lexical index</text>
  <text class="txt" x="680" y="210">• Versioned index_vN (no mixed spaces)</text>

  <rect class="box-green" x="984" y="112" width="256" height="114"/>
  <text class="lbl" x="996" y="134">4. Store (Hybrid + Graph)</text>
  <text class="txt" x="996" y="154">• HNSW Dense Index (int8 / binary PQ)</text>
  <text class="txt" x="996" y="172">• Inverted Index (Okapi BM25 k1, b)</text>
  <text class="code-green" x="996" y="192">• Payload ACL bitsets + Parent Store</text>
  <text class="txt" x="996" y="210">• Optional Leiden Entity Communities</text>

  <path class="flow" d="M 286 169 L 340 169"/>
  <path class="flow-anim" d="M 286 169 L 340 169"/>
  <path class="flow" d="M 612 169 L 666 169"/>
  <path class="flow-anim" d="M 612 169 L 666 169"/>
  <path class="flow" d="M 928 169 L 982 169"/>
  <path class="flow-anim" d="M 928 169 L 982 169"/>

  <!-- Online Query & Evaluation Plane -->
  <rect class="panel" x="20" y="264" width="1240" height="252"/>
  <text class="sec-hdr" x="36" y="286">ONLINE QUERY, GENERATION &amp; CONTINUOUS EVALUATION PLANE</text>
  <circle class="pulse" cx="468" cy="281" r="4" fill="#38bdf8"/>

  <rect class="box-blue" x="36" y="304" width="260" height="156"/>
  <text class="lbl" x="48" y="326">5a. Query Transform &amp; ACL Gate</text>
  <text class="txt" x="48" y="346">• Rewrite / MultiQuery / Step-Back / HyDE</text>
  <text class="code" x="48" y="366">Mandatory Pre-Filter: tenantId &amp; acl</text>
  <text class="txt" x="48" y="384">• HNSW Filter Pushdown (avoids 1%</text>
  <text class="txt" x="48" y="400">  post-filter recall collapse trap)</text>
  <text class="code-amber" x="48" y="422">Top-150 BM25 + Top-150 Dense</text>
  <text class="txt" x="48" y="442">• Parallel scatter across index shards</text>

  <rect class="box-purple" x="344" y="304" width="276" height="156"/>
  <text class="lbl" x="356" y="326">5b. Hybrid RRF, Rerank &amp; Compress</text>
  <text class="code" x="356" y="346">RRF(d) = Σ 1 / (60 + rank_r(d))</text>
  <text class="txt" x="356" y="366">• Cross-Encoder or ColBERT MaxSim</text>
  <text class="txt" x="356" y="384">• Top-150 fused → Top-20 → Top-8</text>
  <text class="txt" x="356" y="402">• Expand child hits → parent spans</text>
  <text class="code-amber" x="356" y="422">• Lost-in-the-Middle edge placement</text>
  <text class="txt" x="356" y="442">• Extractive context compression</text>

  <rect class="box-green" x="668" y="304" width="272" height="156"/>
  <text class="lbl" x="680" y="326">6. Generate (Validator Sandwich)</text>
  <text class="txt" x="680" y="346">• Top Bun: &lt;untrusted_context&gt; isolation</text>
  <text class="txt" x="680" y="364">• Static-first prompt for KV prefix cache</text>
  <text class="code-green" x="680" y="384">• CFG/FSM JSON Schema + citationIds</text>
  <text class="txt" x="680" y="404">• Bottom Bun: verify every citationId</text>
  <text class="txt" x="680" y="422">  exists in retrieved context + PII check</text>
  <text class="txt" x="680" y="442">• Fail closed on refusal or ungrounded claim</text>

  <rect class="box-red" x="988" y="304" width="252" height="156"/>
  <text class="lbl" x="1000" y="326">7. Evaluate (Ragas 0.4.4)</text>
  <text class="code-amber" x="1000" y="348">Faithfulness: supported / total claims</text>
  <text class="code" x="1000" y="368">Context Precision@K (rank-aware)</text>
  <text class="code" x="1000" y="388">Context Recall (ref attribution)</text>
  <text class="txt" x="1000" y="408">• Answer Relevancy + Noise Sensitivity</text>
  <text class="txt" x="1000" y="426">• CI regression gate blocks bad chunking</text>
  <text class="txt" x="1000" y="442">  or embedding upgrades before prod</text>

  <!-- Store to Retrieve link -->
  <path class="flow-green" d="M 1112 226 L 1112 252 L 166 252 L 166 302"/>

  <!-- Query plane flows -->
  <path class="flow" d="M 296 382 L 342 382"/>
  <path class="flow-anim" d="M 296 382 L 342 382"/>
  <path class="flow" d="M 620 382 L 666 382"/>
  <path class="flow-anim" d="M 620 382 L 666 382"/>
  <path class="flow" d="M 940 382 L 986 382"/>
  <path class="flow-anim" d="M 940 382 L 986 382"/>

  <!-- Continuous eval feedback -->
  <path class="flow-feedback" d="M 1114 460 L 1114 494 L 482 494 L 482 462"/>
  <text class="code" x="650" y="488">Eval telemetry drives chunk size, RRF weight &amp; reranker threshold tuning</text>
</svg>
