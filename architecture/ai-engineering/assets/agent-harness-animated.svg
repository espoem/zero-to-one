<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Bounded Agent Harness, MCP 2026-07-28 &amp; LangGraph Orchestration</title>
  <desc id="desc">Static Editorial Paper schematic of the deterministic agent harness envelope wrapping the Plan-Act-Observe-Learn loop, hard budget and cycle gates, MCP 2026-07-28 1:1 isolated client-server dispatch, BaseStore memory tiers, LangGraph HITL interrupts, and 8 operational metrics.</desc>
  <defs>
    <marker id="ed-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,2 L9,5 L1,8" fill="none" stroke="#1c1917" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ed-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,2 L9,5 L1,8" fill="none" stroke="#0f766e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ed-arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,2 L9,5 L1,8" fill="none" stroke="#b45309" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .ed-serif { font-family: Georgia, "Times New Roman", serif; }
    .ed-sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .ed-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .ag-s1 { animation: ag-hl-1 9s infinite; }
    .ag-s2 { animation: ag-hl-2 9s infinite; }
    .ag-s3 { animation: ag-hl-3 9s infinite; }
    .ag-s4 { animation: ag-hl-4 9s infinite; }
    .ag-s5 { animation: ag-hl-5 9s infinite; }
    @keyframes ag-hl-1 { 0%, 20%, 100% { stroke: #1c1917; stroke-width: 1.1; } 3%, 17% { stroke: #0f766e; stroke-width: 2.5; } }
    @keyframes ag-hl-2 { 0%, 20%, 40%, 100% { stroke: #1c1917; stroke-width: 1; } 23%, 37% { stroke: #0f766e; stroke-width: 2.5; } }
    @keyframes ag-hl-3 { 0%, 40%, 60%, 100% { stroke: #0f766e; stroke-width: 1; } 43%, 57% { stroke: #0f766e; stroke-width: 2.5; } }
    @keyframes ag-hl-4 { 0%, 60%, 80%, 100% { stroke: #b45309; stroke-width: 1; } 63%, 77% { stroke: #b45309; stroke-width: 2.5; } }
    @keyframes ag-hl-5 { 0%, 80%, 100% { stroke: #1c1917; stroke-width: 1; } 83%, 97% { stroke: #0f766e; stroke-width: 2.5; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect x="0" y="0" width="1120" height="560" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>
  <text x="32" y="34" class="ed-mono" font-size="10.5" fill="#78716c" letter-spacing="1.4">AGENT HARNESS &amp; LOOP ENGINEERING · MCP 2026-07-28 · LANGGRAPH BSP</text>
  <text x="32" y="58" class="ed-serif" font-size="19.5" font-weight="700" fill="#1c1917">Deterministic Containment Wraps the Probabilistic Agent Loop</text>
  <line x1="32" y1="72" x2="1088" y2="72" stroke="#1c1917" stroke-width="1.2"/>

  <!-- Column 1: Goal Ingress -->
  <rect class="ag-s1" x="32" y="182" width="152" height="148" rx="3" fill="#ffffff" stroke="#1c1917" stroke-width="1.1"/>
  <text x="44" y="206" class="ed-sans" font-size="13" font-weight="700" fill="#1c1917">User Goal</text>
  <line x1="44" y1="214" x2="172" y2="214" stroke="#d6d0c4"/>
  <text x="44" y="234" class="ed-sans" font-size="11" fill="#44403c">Verified principal</text>
  <text x="44" y="252" class="ed-sans" font-size="11" fill="#44403c">allowedTools ACL</text>
  <text x="44" y="274" class="ed-mono" font-size="10" fill="#0f766e">idempotencyKey</text>
  <text x="44" y="294" class="ed-mono" font-size="10" fill="#b45309">deadline + C_max</text>
  <text x="44" y="314" class="ed-mono" font-size="10" fill="#78716c">S_max · K_max</text>

  <line x1="184" y1="256" x2="218" y2="256" stroke="#1c1917" stroke-width="1.3" marker-end="url(#ed-arr)"/>

  <!-- Column 2–3: Deterministic Harness Envelope -->
  <rect x="222" y="88" width="668" height="444" rx="4" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/>
  <text x="238" y="110" class="ed-mono" font-size="10.5" font-weight="700" fill="#0f766e" letter-spacing="1">DETERMINISTIC HARNESS ENVELOPE (LANGGRAPH CHECKPOINTER)</text>

  <!-- Hard Budget Gate Bar -->
  <rect x="238" y="122" width="636" height="48" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="252" y="142" class="ed-sans" font-size="11.5" font-weight="700" fill="#991b1b">Pre-Step Invariants (Evaluated Deterministically Before Every Call):</text>
  <text x="252" y="159" class="ed-mono" font-size="10" fill="#7f1d1d">S ≤ S_max   |   K_tools ≤ K_max   |   Cost ≤ C_max   |   t &lt; T_max   |   SHA-256(tool+args) cycle &lt; threshold</text>

  <!-- Inner Loop 2x2 -->
  <text x="238" y="194" class="ed-mono" font-size="10" font-weight="700" fill="#78716c" letter-spacing="0.8">AGENT LOOP ENGINE</text>
  <line x1="238" y1="201" x2="572" y2="201" stroke="#d6d0c4"/>

  <rect class="ag-s2" x="238" y="212" width="152" height="68" rx="3" fill="#faf8f5" stroke="#1c1917"/>
  <text x="250" y="232" class="ed-sans" font-size="12" font-weight="700" fill="#1c1917">1. Plan</text>
  <text x="250" y="250" class="ed-sans" font-size="11" fill="#44403c">Budgeted context</text>
  <text x="250" y="266" class="ed-sans" font-size="11" fill="#44403c">+ next action</text>

  <line x1="390" y1="246" x2="416" y2="246" stroke="#1c1917" stroke-width="1.2" marker-end="url(#ed-arr)"/>

  <rect class="ag-s3" x="420" y="212" width="152" height="68" rx="3" fill="#f0fdf9" stroke="#0f766e"/>
  <text x="432" y="232" class="ed-sans" font-size="12" font-weight="700" fill="#0f766e">2. Act</text>
  <text x="432" y="250" class="ed-sans" font-size="11" fill="#44403c">Validate schema</text>
  <text x="432" y="266" class="ed-sans" font-size="11" fill="#44403c">or Send() fan-out</text>

  <line x1="496" y1="280" x2="496" y2="306" stroke="#0f766e" stroke-width="1.2" marker-end="url(#ed-arr-teal)"/>

  <rect class="ag-s4" x="420" y="310" width="152" height="68" rx="3" fill="#fffbeb" stroke="#b45309"/>
  <text x="432" y="330" class="ed-sans" font-size="12" font-weight="700" fill="#92400e">3. Observe</text>
  <text x="432" y="348" class="ed-sans" font-size="11" fill="#44403c">Handle isError /</text>
  <text x="432" y="364" class="ed-sans" font-size="11" fill="#44403c">MRTR input_req</text>

  <line x1="420" y1="344" x2="394" y2="344" stroke="#1c1917" stroke-width="1.2" marker-end="url(#ed-arr)"/>

  <rect class="ag-s5" x="238" y="310" width="152" height="68" rx="3" fill="#faf8f5" stroke="#1c1917"/>
  <text x="250" y="330" class="ed-sans" font-size="12" font-weight="700" fill="#1c1917">4. Learn &amp; Compact</text>
  <text x="250" y="348" class="ed-sans" font-size="11" fill="#44403c">Checkpoint state +</text>
  <text x="250" y="364" class="ed-sans" font-size="11" fill="#44403c">trim bloated outputs</text>

  <line x1="314" y1="310" x2="314" y2="284" stroke="#1c1917" stroke-width="1.2" marker-end="url(#ed-arr)"/>

  <!-- Memory Tier Box -->
  <rect x="238" y="400" width="334" height="114" rx="3" fill="#faf8f5" stroke="#d6d0c4"/>
  <text x="252" y="421" class="ed-sans" font-size="12" font-weight="700" fill="#1c1917">Memory Architecture (Token-Budgeted Retrieval)</text>
  <text x="252" y="442" class="ed-sans" font-size="10.5" fill="#44403c">• Short-Term: Thread Checkpointer + Compaction</text>
  <text x="252" y="460" class="ed-sans" font-size="10.5" fill="#44403c">• Episodic: Past trajectories tagged success / failed</text>
  <text x="252" y="478" class="ed-sans" font-size="10.5" fill="#44403c">• Semantic &amp; Procedural: Provenance-verified skills</text>
  <text x="252" y="499" class="ed-mono" font-size="10" fill="#0f766e">Query → Retrieve Top-K → Grounded Injection</text>
  <line x1="314" y1="378" x2="314" y2="397" stroke="#0f766e" stroke-width="1.2" marker-end="url(#ed-arr-teal)"/>

  <!-- Right Inner Column: MCP 2026-07-28 + HITL -->
  <rect x="594" y="186" width="280" height="166" rx="3" fill="#f0fdf9" stroke="#0f766e"/>
  <text x="608" y="207" class="ed-sans" font-size="12" font-weight="700" fill="#0f766e">MCP 2026-07-28 (1:1 Isolation)</text>
  <text x="608" y="226" class="ed-mono" font-size="9.5" fill="#1c1917">Stateless _meta (protocolVersion + caps)</text>
  <text x="608" y="245" class="ed-sans" font-size="11" fill="#44403c">• Host → Client (1:1) → Server</text>
  <text x="608" y="263" class="ed-sans" font-size="11" fill="#44403c">• Deterministic tools/list + subscribe</text>
  <text x="608" y="281" class="ed-mono" font-size="9.5" fill="#92400e">• MRTR input_required (fresh id!)</text>
  <text x="608" y="299" class="ed-sans" font-size="11" fill="#44403c">• JSON Schema 2020-12 (no remote $ref)</text>
  <text x="608" y="317" class="ed-sans" font-size="11" fill="#44403c">• W3C traceparent inside _meta</text>
  <text x="608" y="335" class="ed-mono" font-size="9.5" fill="#0f766e">• Peer &amp; full-history blindness</text>

  <line x1="572" y1="246" x2="590" y2="246" stroke="#0f766e" stroke-width="1.2" marker-end="url(#ed-arr-teal)"/>

  <rect x="594" y="366" width="280" height="148" rx="3" fill="#fffbeb" stroke="#b45309"/>
  <text x="608" y="387" class="ed-sans" font-size="12" font-weight="700" fill="#92400e">HITL &amp; Multi-Agent Control</text>
  <text x="608" y="406" class="ed-mono" font-size="10" fill="#1c1917">interrupt(payload) → Command(resume)</text>
  <text x="608" y="426" class="ed-sans" font-size="11" fill="#44403c">• Pauses before irreversible writes</text>
  <text x="608" y="444" class="ed-sans" font-size="11" fill="#44403c">• Queue sorted by impactUsd × uncert.</text>
  <text x="608" y="462" class="ed-sans" font-size="11" fill="#44403c">• Isolated sub-agents via Send()</text>
  <text x="608" y="480" class="ed-sans" font-size="11" fill="#44403c">• Action-hash bound requestState</text>
  <text x="608" y="499" class="ed-mono" font-size="9.5" fill="#b45309">• Human overrides → golden corpus</text>

  <line x1="572" y1="344" x2="590" y2="395" stroke="#b45309" stroke-width="1.2" marker-end="url(#ed-arr-amber)"/>

  <!-- Output & 8 Agent Metrics -->
  <line x1="890" y1="256" x2="914" y2="256" stroke="#0f766e" stroke-width="1.3" marker-end="url(#ed-arr-teal)"/>

  <rect x="918" y="122" width="170" height="316" rx="3" fill="#ffffff" stroke="#1c1917" stroke-width="1.1"/>
  <text x="932" y="146" class="ed-sans" font-size="12.5" font-weight="700" fill="#1c1917">Output &amp; 8 Metrics</text>
  <line x1="932" y1="154" x2="1074" y2="154" stroke="#1c1917"/>
  <text x="932" y="176" class="ed-mono" font-size="10.5" fill="#0f766e">1. Task Success Rate</text>
  <text x="932" y="198" class="ed-mono" font-size="10.5" fill="#0f766e">2. Tool Accuracy</text>
  <text x="932" y="220" class="ed-mono" font-size="10.5" fill="#44403c">3. Steps Per Task</text>
  <text x="932" y="242" class="ed-mono" font-size="10.5" fill="#44403c">4. Escalation Rate</text>
  <text x="932" y="264" class="ed-mono" font-size="10.5" fill="#b45309">5. Guardrail Hits</text>
  <text x="932" y="286" class="ed-mono" font-size="10.5" fill="#b45309">6. Override Rate</text>
  <text x="932" y="308" class="ed-mono" font-size="10.5" fill="#1c1917">7. Cost / Task (USD)</text>
  <text x="932" y="330" class="ed-mono" font-size="10.5" fill="#1c1917">8. TTR (p50 / p90)</text>
  <line x1="932" y1="348" x2="1074" y2="348" stroke="#d6d0c4"/>
  <text x="932" y="368" class="ed-sans" font-size="11" font-weight="700" fill="#1c1917">OTel GenAI Trace:</text>
  <text x="932" y="388" class="ed-mono" font-size="10" fill="#0f766e">invoke_agent {agent}</text>
  <text x="932" y="406" class="ed-mono" font-size="10" fill="#44403c">→ chat {model}</text>
  <text x="932" y="424" class="ed-mono" font-size="10" fill="#44403c">→ execute_tool {name}</text>
</svg>
