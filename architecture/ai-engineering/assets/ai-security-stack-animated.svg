<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" width="1120" height="580" role="img" aria-labelledby="title desc">
  <title id="title">8-Layer AI Security Stack and Governance Frameworks (2026)</title>
  <desc id="desc">Static Editorial Paper architecture of the 8-layer AI Security Stack: Red Teaming, Guardrails and Least-Privilege Permissions, Direct and Indirect Prompt Injection Isolation, Static Model Scanning, Secrets and CycloneDX 1.7 ML-BOM, Policy and Tenant Access, OTel GenAI Monitoring, and OWASP/NIST/MITRE ATLAS frameworks.</desc>
  <defs>
    <marker id="ed-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,2 L9,5 L1,8" fill="none" stroke="#1c1917" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ed-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,2 L9,5 L1,8" fill="none" stroke="#0f766e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ed-arr-danger" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,2 L9,5 L1,8" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .ed-serif { font-family: Georgia, "Times New Roman", serif; }
    .ed-sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .ed-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>

  <rect x="0" y="0" width="1120" height="580" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>
  <text x="32" y="34" class="ed-mono" font-size="10.5" fill="#78716c" letter-spacing="1.4">AI SECURITY STACK (2026) · OWASP LLM/AGENTIC · NIST AI RMF + 600-1 · MITRE ATLAS v2026.11</text>
  <text x="32" y="58" class="ed-serif" font-size="19.5" font-weight="700" fill="#1c1917">8-Layer Defense-in-Depth Across Prompt, Supply Chain &amp; Telemetry Boundaries</text>
  <line x1="32" y1="72" x2="1088" y2="72" stroke="#1c1917" stroke-width="1.2"/>

  <!-- Column 1: Runtime & Adversarial Defense -->
  <text x="32" y="96" class="ed-mono" font-size="10.5" font-weight="700" fill="#dc2626" letter-spacing="0.8">RUNTIME &amp; ADVERSARIAL DEFENSE (L1–L3)</text>
  <line x1="32" y1="103" x2="364" y2="103" stroke="#d6d0c4"/>

  <rect x="32" y="114" width="332" height="96" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.1"/>
  <text x="46" y="134" class="ed-sans" font-size="12" font-weight="700" fill="#991b1b">L1 · Continuous Red Teaming</text>
  <text x="46" y="152" class="ed-sans" font-size="11" fill="#44403c">• Probe RAG, PDFs, tool JSON &amp; memory</text>
  <text x="46" y="169" class="ed-sans" font-size="11" fill="#44403c">• Scope via MITRE ATLAS + ASI01–10</text>
  <text x="46" y="189" class="ed-mono" font-size="10" fill="#991b1b">Assert on tool traces (not surface prose)</text>

  <rect x="32" y="222" width="332" height="98" rx="3" fill="#fffbeb" stroke="#b45309" stroke-width="1.1"/>
  <text x="46" y="242" class="ed-sans" font-size="12" font-weight="700" fill="#92400e">L3 · Injection Isolation &amp; Screening</text>
  <text x="46" y="260" class="ed-mono" font-size="10" fill="#1c1917">&lt;untrusted_context&gt;...&lt;/untrusted_context&gt;</text>
  <text x="46" y="278" class="ed-sans" font-size="11" fill="#44403c">• NFKC + strip Unicode Tags (U+E0000–7F)</text>
  <text x="46" y="296" class="ed-sans" font-size="11" fill="#44403c">• Classifier + deterministic rules (AML.T0051)</text>

  <rect x="32" y="332" width="332" height="98" rx="3" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.1"/>
  <text x="46" y="352" class="ed-sans" font-size="12" font-weight="700" fill="#0f766e">L2 · Guardrails + Least Privilege</text>
  <text x="46" y="370" class="ed-sans" font-size="11" fill="#44403c">• Validator Sandwich on every egress path</text>
  <text x="46" y="388" class="ed-mono" font-size="10" fill="#0f766e">Host allowedTools + URL domain allowlist</text>
  <text x="46" y="406" class="ed-sans" font-size="11" fill="#44403c">• HITL interrupt() gates (LLM03/ASI02)</text>

  <!-- Connectors Col 1 -> Col 2 -->
  <line x1="364" y1="162" x2="390" y2="162" stroke="#dc2626" stroke-width="1.2" marker-end="url(#ed-arr-danger)"/>
  <line x1="364" y1="271" x2="390" y2="271" stroke="#1c1917" stroke-width="1.2" marker-end="url(#ed-arr)"/>
  <line x1="364" y1="381" x2="390" y2="381" stroke="#0f766e" stroke-width="1.2" marker-end="url(#ed-arr-teal)"/>

  <!-- Column 2: Supply Chain, Secrets & Access -->
  <text x="394" y="96" class="ed-mono" font-size="10.5" font-weight="700" fill="#0f766e" letter-spacing="0.8">SUPPLY CHAIN &amp; ACCESS CONTROL (L4–L6)</text>
  <line x1="394" y1="103" x2="726" y2="103" stroke="#d6d0c4"/>

  <rect x="394" y="114" width="332" height="104" rx="3" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="408" y="134" class="ed-sans" font-size="12" font-weight="700" fill="#1c1917">L4 · Model Scanning &amp; Serialization</text>
  <text x="408" y="152" class="ed-mono" font-size="10" fill="#dc2626">Pickle VM GLOBAL/REDUCE → RCE vector</text>
  <text x="408" y="170" class="ed-mono" font-size="10" fill="#0f766e">Use safetensors + weights_only=True</text>
  <text x="408" y="188" class="ed-sans" font-size="11" fill="#44403c">• ModelScan 0.8.8 opcode scan (exit 1 fail)</text>
  <text x="408" y="205" class="ed-sans" font-size="11" fill="#44403c">• Audit GGUF Jinja &amp; hub rug-pulls</text>

  <rect x="394" y="228" width="332" height="98" rx="3" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="408" y="248" class="ed-sans" font-size="12" font-weight="700" fill="#1c1917">L5 · Secrets Hygiene &amp; CycloneDX 1.7</text>
  <text x="408" y="266" class="ed-sans" font-size="11" fill="#44403c">• Pre-egress PII/token scrub; zero secrets</text>
  <text x="408" y="284" class="ed-mono" font-size="10" fill="#0f766e">modelCard + data[type="dataset"]</text>
  <text x="408" y="302" class="ed-sans" font-size="11" fill="#44403c">• technicalLimitations + CVE/ML-BOM lineage</text>

  <rect x="394" y="336" width="332" height="94" rx="3" fill="#fffbeb" stroke="#b45309" stroke-width="1"/>
  <text x="408" y="356" class="ed-sans" font-size="12" font-weight="700" fill="#92400e">L6 · Policy &amp; Tenant Isolation</text>
  <text x="408" y="374" class="ed-sans" font-size="11" fill="#44403c">• Bind tenantId strictly from session JWT</text>
  <text x="408" y="392" class="ed-mono" font-size="10" fill="#b45309">Pre-filter HNSW ACLs + Cedar/OPA policy</text>
  <text x="408" y="410" class="ed-sans" font-size="11" fill="#44403c">• Stop semantic cache tenant bleed</text>

  <!-- Connectors Col 2 -> Col 3 -->
  <line x1="726" y1="166" x2="752" y2="166" stroke="#1c1917" stroke-width="1.2" marker-end="url(#ed-arr)"/>
  <line x1="726" y1="383" x2="752" y2="383" stroke="#0f766e" stroke-width="1.2" marker-end="url(#ed-arr-teal)"/>

  <!-- Column 3: Monitoring & Responsible AI -->
  <text x="756" y="96" class="ed-mono" font-size="10.5" font-weight="700" fill="#1c1917" letter-spacing="0.8">MONITORING &amp; RESPONSIBLE AI (L7+)</text>
  <line x1="756" y1="103" x2="1088" y2="103" stroke="#d6d0c4"/>

  <rect x="756" y="114" width="332" height="164" rx="3" fill="#ffffff" stroke="#0f766e" stroke-width="1.1"/>
  <text x="770" y="134" class="ed-sans" font-size="12" font-weight="700" fill="#0f766e">L7 · OTel GenAI Anomaly Telemetry</text>
  <text x="770" y="153" class="ed-mono" font-size="10" fill="#1c1917">invoke_agent → chat → execute_tool</text>
  <text x="770" y="172" class="ed-mono" font-size="9.2" fill="#44403c">OTEL_INSTRUMENTATION_GENAI_CAPTURE_</text>
  <text x="770" y="187" class="ed-mono" font-size="9.5" fill="#b45309">MESSAGE_CONTENT = NO_CONTENT (default)</text>
  <text x="770" y="207" class="ed-sans" font-size="11" fill="#44403c">• Alert on guardrail spikes, scope drift,</text>
  <text x="770" y="224" class="ed-sans" font-size="11" fill="#44403c">  cost harvesting (AML.T0034), model swap</text>
  <text x="770" y="244" class="ed-mono" font-size="10" fill="#0f766e">MITRE ATLAS AML.M0024 monitoring</text>

  <rect x="756" y="290" width="332" height="140" rx="3" fill="#faf8f5" stroke="#d6d0c4"/>
  <text x="770" y="310" class="ed-sans" font-size="12" font-weight="700" fill="#1c1917">Responsible AI &amp; Fairness Metrics</text>
  <text x="770" y="330" class="ed-sans" font-size="11" fill="#44403c">• Demographic Parity / Equalized Odds /</text>
  <text x="770" y="346" class="ed-sans" font-size="11" fill="#44403c">  Calibration (KMR impossibility trade-off)</text>
  <text x="770" y="366" class="ed-sans" font-size="11" fill="#44403c">• Consent, copyright, PII minimization</text>
  <text x="770" y="385" class="ed-sans" font-size="11" fill="#44403c">• AI disclosure &amp; human appeal workflow</text>
  <text x="770" y="405" class="ed-mono" font-size="10" fill="#0f766e">Per-cohort error audits + immutable logs</text>

  <!-- Bottom L8 Governance Rule Strip -->
  <line x1="32" y1="452" x2="1088" y2="452" stroke="#1c1917" stroke-width="1.2"/>
  <text x="32" y="472" class="ed-mono" font-size="10.5" font-weight="700" fill="#1c1917" letter-spacing="0.8">L8 · SECURITY FRAMEWORKS &amp; TAXONOMIES</text>

  <g transform="translate(32, 484)">
    <rect x="0" y="0" width="254" height="68" rx="3" fill="#ffffff" stroke="#d6d0c4"/>
    <text x="12" y="20" class="ed-sans" font-size="11.5" font-weight="700" fill="#991b1b">OWASP LLM Top 10 (2025/2026)</text>
    <text x="12" y="38" class="ed-mono" font-size="9.5" fill="#44403c">LLM01–07 + 2026 LLM08 Hidden Context</text>
    <text x="12" y="54" class="ed-mono" font-size="9.5" fill="#78716c">LLM09 Vector · LLM10 Output Handling</text>

    <rect x="267" y="0" width="254" height="68" rx="3" fill="#ffffff" stroke="#d6d0c4"/>
    <text x="279" y="20" class="ed-sans" font-size="11.5" font-weight="700" fill="#92400e">OWASP Agentic Top 10 (2026)</text>
    <text x="279" y="38" class="ed-mono" font-size="9.5" fill="#44403c">ASI01 Goal Hijack · ASI02 Tool Misuse</text>
    <text x="279" y="54" class="ed-mono" font-size="9.5" fill="#78716c">ASI06 Context Poison · ASI10 Rogue Agents</text>

    <rect x="534" y="0" width="254" height="68" rx="3" fill="#ffffff" stroke="#d6d0c4"/>
    <text x="546" y="20" class="ed-sans" font-size="11.5" font-weight="700" fill="#0f766e">NIST AI RMF 1.0 + AI 600-1</text>
    <text x="546" y="38" class="ed-mono" font-size="9.5" fill="#44403c">GOVERN · MAP · MEASURE · MANAGE</text>
    <text x="546" y="54" class="ed-mono" font-size="9.5" fill="#78716c">7 Trust Traits · 12 GenAI Risk Cats</text>

    <rect x="801" y="0" width="255" height="68" rx="3" fill="#ffffff" stroke="#d6d0c4"/>
    <text x="813" y="20" class="ed-sans" font-size="11.5" font-weight="700" fill="#1c1917">MITRE ATLAS v2026.11</text>
    <text x="813" y="38" class="ed-mono" font-size="9.5" fill="#44403c">16 Tactics · 137 Techs · 44 Mitigations</text>
    <text x="813" y="54" class="ed-mono" font-size="9.5" fill="#78716c">AML.T0051 · T0110 · M0028/M0029</text>
  </g>
</svg>
