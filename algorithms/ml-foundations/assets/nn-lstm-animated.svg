<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="100%" role="img" aria-label="LSTM Cell: Gated Memory and Constant-Error Carousel">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1c1917"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#b45309"/>
    </marker>
  </defs>
  <style>
    .lstm-s1 { animation: lstm-st1 8s infinite; }
    .lstm-s2 { animation: lstm-st2 8s infinite; }
    .lstm-s3 { animation: lstm-st3 8s infinite; }
    .lstm-s4 { animation: lstm-st4 8s infinite; }
    @keyframes lstm-st1 { 0%, 25%, 100% { stroke-width: 1.4; } 3%, 22% { stroke: #b45309; stroke-width: 2.8; } }
    @keyframes lstm-st2 { 0%, 25%, 50%, 100% { stroke-width: 1.3; } 28%, 47% { stroke: #0f766e; stroke-width: 2.6; } }
    @keyframes lstm-st3 { 0%, 50%, 75%, 100% { stroke-width: 1.2; } 53%, 72% { stroke: #0f766e; stroke-width: 2.6; } }
    @keyframes lstm-st4 { 0%, 75%, 100% { stroke-width: 1.3; } 78%, 97% { stroke: #0f766e; stroke-width: 2.8; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="920" height="430" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>
  <text x="28" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" fill="#1c1917">LSTM Cell: Gated Memory &amp; Constant-Error Carousel</text>
  <text x="28" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#57534e">c_t = f_t * c_{t-1} + i_t * c_tilde_t   |   h_t = o_t * tanh(c_t)   |   dc_t / dc_{t-1} = diag(f_t)</text>
  <line x1="28" y1="66" x2="892" y2="66" stroke="#1c1917" stroke-width="1.2"/>

  <!-- Outer LSTM cell frame -->
  <rect x="132" y="84" width="692" height="296" rx="6" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.2"/>
  <text x="148" y="103" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#57534e" letter-spacing="0.6">RECURRENT STEP t  (CELL BOUNDARY)</text>
  <text x="806" y="103" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0f766e">Constant-Error Carousel (linear gradient path)</text>

  <!-- Constant-Error Carousel (top highway) -->
  <rect class="lstm-s3" x="150" y="112" width="656" height="30" rx="4" fill="#f0fdf9" stroke="#99f6e4" stroke-width="1"/>

  <text x="28" y="131" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#0f766e">c_{t-1}</text>
  <line x1="92" y1="127" x2="239" y2="127" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr-teal)"/>
  <line x1="275" y1="127" x2="469" y2="127" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr-teal)"/>
  <line x1="505" y1="127" x2="854" y2="127" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr-teal)"/>
  <text x="864" y="131" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#0f766e">c_t</text>

  <!-- Pointwise ops on highway -->
  <circle class="lstm-s1" cx="257" cy="127" r="14" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
  <text x="257" y="132" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#b45309">&#215;</text>

  <circle class="lstm-s3" cx="487" cy="127" r="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
  <text x="487" y="132" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f766e">+</text>

  <!-- Input concat bus (bottom) -->
  <text x="28" y="340" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#1c1917">h_{t-1}</text>
  <text x="58" y="366" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#1c1917">x_t</text>
  <path d="M 92 336 L 745 336" fill="none" stroke="#44403c" stroke-width="1.8"/>
  <path d="M 88 362 L 170 362 L 188 336" fill="none" stroke="#44403c" stroke-width="1.8"/>
  <text x="196" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#57534e">[h_{t-1}, x_t]</text>

  <!-- Gate branches up from bus -->
  <line x1="257" y1="336" x2="257" y2="278" stroke="#44403c" stroke-width="1.5" marker-end="url(#arr-ink)"/>
  <line x1="397" y1="336" x2="397" y2="278" stroke="#44403c" stroke-width="1.5" marker-end="url(#arr-ink)"/>
  <line x1="527" y1="336" x2="527" y2="278" stroke="#44403c" stroke-width="1.5" marker-end="url(#arr-ink)"/>
  <line x1="657" y1="336" x2="657" y2="278" stroke="#44403c" stroke-width="1.5" marker-end="url(#arr-ink)"/>

  <!-- Hidden state skip out -->
  <path d="M 745 127 L 745 162" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-teal)"/>

  <!-- 4 Gate boxes -->
  <rect class="lstm-s1" x="212" y="232" width="90" height="40" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/>
  <text x="257" y="250" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#92400e">f_t = sig</text>
  <text x="257" y="265" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#57534e">Forget Gate</text>

  <rect class="lstm-s2" x="352" y="232" width="90" height="40" rx="4" fill="#f5f1e8" stroke="#d6d0c4" stroke-width="1.3"/>
  <text x="397" y="250" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#1c1917">i_t = sig</text>
  <text x="397" y="265" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#57534e">Input Gate</text>

  <rect class="lstm-s2" x="482" y="232" width="90" height="40" rx="4" fill="#f5f1e8" stroke="#d6d0c4" stroke-width="1.3"/>
  <text x="527" y="250" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#1c1917">c~ = tanh</text>
  <text x="527" y="265" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#57534e">Candidate</text>

  <rect class="lstm-s4" x="612" y="232" width="90" height="40" rx="4" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.3"/>
  <text x="657" y="250" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#0f766e">o_t = sig</text>
  <text x="657" y="265" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#57534e">Output Gate</text>

  <!-- Gate upward routing -->
  <line x1="257" y1="232" x2="257" y2="146" stroke="#b45309" stroke-width="1.6" marker-end="url(#arr-amber)"/>

  <circle cx="487" cy="190" r="13" fill="#ffffff" stroke="#1c1917" stroke-width="1.4"/>
  <text x="487" y="195" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1c1917">&#215;</text>

  <path d="M 397 232 L 397 190 L 468 190" fill="none" stroke="#44403c" stroke-width="1.5" marker-end="url(#arr-ink)"/>
  <path d="M 527 232 L 527 190 L 506 190" fill="none" stroke="#44403c" stroke-width="1.5" marker-end="url(#arr-ink)"/>
  <line x1="487" y1="177" x2="487" y2="146" stroke="#0f766e" stroke-width="1.7" marker-end="url(#arr-teal)"/>

  <!-- Output tanh + multiply -> h_t -->
  <rect class="lstm-s4" x="713" y="166" width="64" height="28" rx="4" fill="#f0fdf9" stroke="#99f6e4" stroke-width="1.2"/>
  <text x="745" y="184" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#0f766e">tanh</text>
  <line x1="745" y1="194" x2="745" y2="213" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arr-teal)"/>

  <circle class="lstm-s4" cx="745" cy="230" r="13" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
  <text x="745" y="235" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f766e">&#215;</text>
  <path d="M 702 252 L 722 252 L 733 240" fill="none" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arr-teal)"/>

  <line x1="758" y1="230" x2="854" y2="230" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-teal)"/>
  <text x="864" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#0f766e">h_t</text>

  <!-- Footer -->
  <rect x="28" y="392" width="864" height="26" rx="4" fill="#f5f1e8" stroke="#e7e2d8" stroke-width="1"/>
  <text x="460" y="409" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#44403c">4 parameter matrices [W_f, W_i, W_c, W_o] = 4(d_x d_h + d_h^2 + d_h) weights; bias init b_f = +1 prevents early forgetting</text>
</svg>
