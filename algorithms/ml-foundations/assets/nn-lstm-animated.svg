<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="title desc">
  <title id="title">LSTM Cell and Constant-Error Carousel</title>
  <desc id="desc">Animated schematic of an LSTM cell showing the linear cell state highway c_{t-1} to c_t modulated by forget gate f_t, input gate i_t, candidate c_tilde_t, and output gate o_t.</desc>
  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes carousel-move {
      0%   { transform: translateX(0px); opacity: 0; }
      10%  { opacity: 1; }
      90%  { transform: translateX(740px); opacity: 1; }
      100% { transform: translateX(740px); opacity: 0; }
    }
    @keyframes gate-pulse {
      0%, 100% { stroke-width: 2; }
      50%      { stroke-width: 3.5; }
    }
    .cec { animation: carousel-move 5s linear infinite; }
    .gate { animation: gate-pulse 2.5s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .cec, .gate { animation: none !important; }
      .cec { opacity: 1; transform: translateX(370px); }
    }
  </style>
  <defs>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="440" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="0" y="0" width="960" height="56" rx="12" fill="#0f172a"/>
  <rect x="0" y="40" width="960" height="16" fill="#0f172a"/>
  <text x="24" y="26" class="sans" font-size="17" font-weight="700" fill="#f8fafc">LSTM Cell: Gated Memory &amp; Constant-Error Carousel</text>
  <text x="24" y="45" class="mono" font-size="12" fill="#94a3b8">c_t = f_t * c_{t-1} + i_t * c_tilde_t   |   h_t = o_t * tanh(c_t)   |   dc_t/dc_{t-1} = diag(f_t)</text>

  <!-- Main cell box -->
  <rect x="130" y="82" width="700" height="296" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>

  <!-- Cell State Highway (top) -->
  <line x1="56" y1="126" x2="896" y2="126" stroke="#059669" stroke-width="4" marker-end="url(#arr-emerald)"/>
  <text x="54" y="114" class="mono" font-size="13" font-weight="700" fill="#065f46">c_{t-1}</text>
  <text x="886" y="114" class="mono" font-size="13" font-weight="700" fill="#065f46">c_t</text>
  <text x="480" y="106" class="sans" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">Constant-Error Carousel (Additive Gradient Path)</text>
  <circle cx="105" cy="126" r="7" fill="#10b981" stroke="#ffffff" stroke-width="2" class="cec"/>

  <!-- Highway ops -->
  <circle cx="255" cy="126" r="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="255" y="131" class="mono" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">x</text>
  <circle cx="485" cy="126" r="16" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="485" y="131" class="mono" font-size="15" font-weight="700" fill="#065f46" text-anchor="middle">+</text>

  <!-- Bottom h_{t-1} and x_t bus -->
  <line x1="56" y1="336" x2="680" y2="336" stroke="#334155" stroke-width="2.5"/>
  <text x="54" y="324" class="mono" font-size="13" font-weight="700" fill="#1e293b">h_{t-1}</text>
  <line x1="165" y1="406" x2="165" y2="336" stroke="#2563eb" stroke-width="2.5"/>
  <text x="165" y="424" class="mono" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">x_t</text>

  <!-- Gate 1: Forget f_t -->
  <line x1="255" y1="336" x2="255" y2="144" stroke="#64748b" stroke-width="2"/>
  <rect x="215" y="238" width="80" height="44" rx="8" fill="#fef3c7" stroke="#d97706" class="gate"/>
  <text x="255" y="257" class="mono" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">f_t = sig</text>
  <text x="255" y="273" class="sans" font-size="10" fill="#b45309" text-anchor="middle">Forget</text>

  <!-- Gate 2: Input i_t -->
  <line x1="395" y1="336" x2="395" y2="196" stroke="#64748b" stroke-width="2"/>
  <rect x="355" y="238" width="80" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" class="gate"/>
  <text x="395" y="257" class="mono" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">i_t = sig</text>
  <text x="395" y="273" class="sans" font-size="10" fill="#1d4ed8" text-anchor="middle">Input</text>

  <!-- Candidate c_tilde_t -->
  <line x1="525" y1="336" x2="525" y2="196" stroke="#64748b" stroke-width="2"/>
  <rect x="485" y="238" width="80" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" class="gate"/>
  <text x="525" y="257" class="mono" font-size="12" font-weight="700" fill="#4c1d95" text-anchor="middle">c~ = tanh</text>
  <text x="525" y="273" class="sans" font-size="10" fill="#6d28d9" text-anchor="middle">Candidate</text>

  <!-- Multiply i_t * c~ -> + -->
  <circle cx="485" cy="196" r="15" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="485" y="201" class="mono" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">x</text>
  <line x1="395" y1="196" x2="470" y2="196" stroke="#64748b" stroke-width="2"/>
  <line x1="525" y1="196" x2="500" y2="196" stroke="#64748b" stroke-width="2"/>
  <line x1="485" y1="181" x2="485" y2="142" stroke="#059669" stroke-width="2"/>

  <!-- Gate 4: Output o_t -->
  <line x1="655" y1="336" x2="655" y2="210" stroke="#64748b" stroke-width="2"/>
  <rect x="615" y="238" width="80" height="44" rx="8" fill="#fce7f3" stroke="#db2777" class="gate"/>
  <text x="655" y="257" class="mono" font-size="12" font-weight="700" fill="#831843" text-anchor="middle">o_t = sig</text>
  <text x="655" y="273" class="sans" font-size="10" fill="#be185d" text-anchor="middle">Output</text>

  <!-- tanh(c_t) * o_t -> h_t -->
  <line x1="745" y1="126" x2="745" y2="162" stroke="#059669" stroke-width="2"/>
  <rect x="713" y="162" width="64" height="28" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="745" y="180" class="mono" font-size="11" font-weight="700" fill="#4c1d95" text-anchor="middle">tanh</text>
  <line x1="745" y1="190" x2="745" y2="210" stroke="#64748b" stroke-width="2"/>
  <circle cx="745" cy="226" r="15" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="745" y="231" class="mono" font-size="13" font-weight="700" fill="#831843" text-anchor="middle">x</text>
  <line x1="655" y1="226" x2="730" y2="226" stroke="#64748b" stroke-width="2"/>
  <line x1="760" y1="226" x2="896" y2="226" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arr-dark)"/>
  <text x="884" y="214" class="mono" font-size="13" font-weight="700" fill="#0f172a">h_t</text>

  <text x="480" y="402" class="sans" font-size="11" fill="#475569" text-anchor="middle">4x parameter matrices [W_f, W_i, W_c, W_o] = 4(d_x d_h + d_h^2 + d_h) weights; bias init b_f = +1 prevents early forgetting</text>
</svg>
