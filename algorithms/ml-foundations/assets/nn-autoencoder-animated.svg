<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="title desc">
  <title id="title">Variational Autoencoder (VAE) ELBO and Reparameterization Trick</title>
  <desc id="desc">Animated VAE architecture compressing input x via encoder q_phi(z|x) to mu and sigma, sampling z = mu + sigma * epsilon, and reconstructing x_hat via decoder p_theta(x|z).</desc>
  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes latent-flow {
      0%   { transform: translateX(0px); opacity: 0; }
      10%  { opacity: 1; }
      90%  { transform: translateX(730px); opacity: 1; }
      100% { transform: translateX(730px); opacity: 0; }
    }
    .pulse { animation: latent-flow 6s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none !important; }
      .pulse { opacity: 1; transform: translateX(365px); }
    }
  </style>
  <defs>
    <marker id="arr-v" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="440" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="0" y="0" width="960" height="56" rx="12" fill="#0f172a"/>
  <rect x="0" y="40" width="960" height="16" fill="#0f172a"/>
  <text x="24" y="26" class="sans" font-size="17" font-weight="700" fill="#f8fafc">Autoencoder / VAE: ELBO &amp; Reparameterization Trick</text>
  <text x="24" y="45" class="mono" font-size="12" fill="#94a3b8">L(theta,phi;x) = E_q[log p_theta(x|z)] - D_KL(q_phi(z|x) || p(z))   |   z = mu + sigma * eps</text>

  <!-- Input x -->
  <rect x="34" y="138" width="76" height="164" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="72" y="216" class="mono" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">x</text>
  <text x="72" y="236" class="mono" font-size="10" fill="#1d4ed8" text-anchor="middle">R^D</text>

  <!-- Encoder trapezoid -->
  <polygon points="140,126 290,174 290,266 140,314" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="212" y="214" class="sans" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle">Encoder</text>
  <text x="212" y="234" class="mono" font-size="11" fill="#6d28d9" text-anchor="middle">q_phi(z|x)</text>
  <line x1="110" y1="220" x2="136" y2="220" stroke="#4f46e5" stroke-width="2" marker-end="url(#arr-v)"/>

  <!-- mu and sigma -->
  <line x1="290" y1="194" x2="338" y2="170" stroke="#4f46e5" stroke-width="2" marker-end="url(#arr-v)"/>
  <line x1="290" y1="246" x2="338" y2="270" stroke="#4f46e5" stroke-width="2" marker-end="url(#arr-v)"/>

  <rect x="342" y="142" width="84" height="44" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="384" y="169" class="mono" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle">mu</text>

  <rect x="342" y="254" width="84" height="44" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="384" y="281" class="mono" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle">log var</text>

  <!-- Noise eps -->
  <rect x="342" y="334" width="160" height="40" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="422" y="359" class="mono" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">eps ~ N(0, I)</text>

  <!-- Latent z -->
  <line x1="426" y1="164" x2="480" y2="206" stroke="#4f46e5" stroke-width="2" marker-end="url(#arr-v)"/>
  <line x1="426" y1="276" x2="480" y2="234" stroke="#4f46e5" stroke-width="2" marker-end="url(#arr-v)"/>
  <line x1="465" y1="334" x2="508" y2="262" stroke="#d97706" stroke-width="2" stroke-dasharray="4 3"/>

  <rect x="484" y="182" width="110" height="76" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2.2"/>
  <text x="539" y="214" class="mono" font-size="14" font-weight="700" fill="#065f46" text-anchor="middle">z = mu +</text>
  <text x="539" y="236" class="mono" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">sigma * eps</text>

  <!-- Decoder trapezoid -->
  <line x1="594" y1="220" x2="640" y2="220" stroke="#4f46e5" stroke-width="2" marker-end="url(#arr-v)"/>
  <polygon points="644,174 794,126 794,314 644,266" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="720" y="214" class="sans" font-size="13" font-weight="700" fill="#0c4a6e" text-anchor="middle">Decoder</text>
  <text x="720" y="234" class="mono" font-size="11" fill="#0369a1" text-anchor="middle">p_theta(x|z)</text>

  <!-- Reconstruction x_hat -->
  <line x1="794" y1="220" x2="838" y2="220" stroke="#4f46e5" stroke-width="2" marker-end="url(#arr-v)"/>
  <rect x="842" y="138" width="76" height="164" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="880" y="216" class="mono" font-size="14" font-weight="700" fill="#065f46" text-anchor="middle">x_hat</text>
  <text x="880" y="236" class="mono" font-size="10" fill="#047857" text-anchor="middle">R^D</text>

  <!-- KL penalty callout -->
  <rect x="316" y="76" width="290" height="44" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="461" y="96" class="sans" font-size="11" font-weight="700" fill="#9f1239" text-anchor="middle">KL Regularizer pulls q_phi(z|x) -&gt; N(0, I)</text>
  <text x="461" y="112" class="sans" font-size="10" fill="#be123c" text-anchor="middle">(Plain AE is sigma -&gt; 0 limit with no KL term)</text>

  <line x1="90" y1="396" x2="880" y2="396" stroke="#cbd5e1" stroke-width="3"/>
  <circle cx="90" cy="396" r="7" fill="#7c3aed" class="pulse"/>
  <text x="480" y="422" class="sans" font-size="11" fill="#475569" text-anchor="middle">Reparameterization isolates stochasticity in eps so gradients dL/d(mu) and dL/d(sigma) flow deterministically</text>
</svg>
