<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="100%" role="img" aria-label="Autoencoder and VAE: ELBO Objective and Reparameterization Trick">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1c1917"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#b45309"/>
    </marker>
  </defs>
  <style>
    .ae-s1 { animation: ae-st1 7.5s infinite; }
    .ae-s2 { animation: ae-st2 7.5s infinite; }
    .ae-s3 { animation: ae-st3 7.5s infinite; }
    @keyframes ae-st1 { 0%, 33.3%, 100% { stroke-width: 1.4; } 4%, 29% { stroke: #0f766e; stroke-width: 2.8; } }
    @keyframes ae-st2 { 0%, 33.3%, 66.6%, 100% { stroke-width: 1.4; } 37%, 63% { stroke: #b45309; stroke-width: 2.8; } }
    @keyframes ae-st3 { 0%, 66.6%, 100% { stroke-width: 1.4; } 70%, 96% { stroke: #0f766e; stroke-width: 2.8; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="920" height="430" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>
  <text x="28" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" fill="#1c1917">Autoencoder / VAE: ELBO &amp; Reparameterization Trick</text>
  <text x="28" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#57534e">L(theta,phi;x) = E_q[log p_theta(x|z)] - D_KL(q_phi(z|x) || p(z))   |   z = mu + sigma * eps</text>
  <line x1="28" y1="66" x2="892" y2="66" stroke="#1c1917" stroke-width="1.2"/>

  <!-- Input x -->
  <rect x="28" y="144" width="80" height="160" rx="4" fill="#ffffff" stroke="#1c1917" stroke-width="1.4"/>
  <text x="68" y="216" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#1c1917">x</text>
  <text x="68" y="236" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#57534e">R^D</text>

  <line x1="108" y1="224" x2="140" y2="224" stroke="#1c1917" stroke-width="1.8" marker-end="url(#arr-ink)"/>

  <!-- Encoder Trapezoid -->
  <polygon class="ae-s1" points="148,136 300,174 300,274 148,312" fill="#f5f1e8" stroke="#1c1917" stroke-width="1.4"/>
  <text x="224" y="218" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#1c1917">Encoder</text>
  <text x="224" y="238" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#44403c">q_phi(z|x)</text>

  <!-- mu and log var -->
  <path d="M 300 200 L 336 174" fill="none" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arr-teal)"/>
  <path d="M 300 248 L 336 274" fill="none" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arr-teal)"/>

  <rect class="ae-s2" x="342" y="148" width="96" height="46" rx="4" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.3"/>
  <text x="390" y="169" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#0f766e">mu</text>
  <text x="390" y="185" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#57534e">Mean vector</text>

  <rect class="ae-s2" x="342" y="254" width="96" height="46" rx="4" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.3"/>
  <text x="390" y="275" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" fill="#0f766e">log sigma^2</text>
  <text x="390" y="291" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#57534e">Log variance</text>

  <!-- KL Regularizer callout at top -->
  <rect x="320" y="82" width="286" height="46" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="463" y="101" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">KL Regularizer pulls q_phi(z|x) -&gt; N(0, I)</text>
  <text x="463" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#7f1d1d">(Plain AE is sigma -&gt; 0 limit with no KL term)</text>
  <line x1="390" y1="148" x2="390" y2="132" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="4 3"/>

  <!-- Reparameterization Noise -->
  <rect x="342" y="330" width="166" height="42" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/>
  <text x="425" y="349" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#b45309">eps ~ N(0, I)</text>
  <text x="425" y="365" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#92400e">External noise (no grad)</text>

  <!-- Latent z box -->
  <rect class="ae-s2" x="484" y="182" width="114" height="84" rx="5" fill="#ffffff" stroke="#0f766e" stroke-width="1.7"/>
  <text x="541" y="210" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" fill="#0f766e">z = mu +</text>
  <text x="541" y="229" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" fill="#0f766e">sigma * eps</text>
  <text x="541" y="251" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#57534e">Latent sample</text>

  <path d="M 438 171 L 478 206" fill="none" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arr-teal)"/>
  <path d="M 438 277 L 478 242" fill="none" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arr-teal)"/>
  <path d="M 508 351 L 541 351 L 541 272" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-amber)"/>

  <!-- Decoder Trapezoid -->
  <line x1="598" y1="224" x2="622" y2="224" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <polygon class="ae-s3" points="628,174 776,136 776,312 628,274" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.4"/>
  <text x="702" y="218" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#0f766e">Decoder</text>
  <text x="702" y="238" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#065f46">p_theta(x|z)</text>

  <!-- Reconstruction x_hat -->
  <line x1="776" y1="224" x2="806" y2="224" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <rect x="812" y="144" width="80" height="160" rx="4" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
  <text x="852" y="216" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#0f766e">x_hat</text>
  <text x="852" y="236" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#57534e">R^D</text>

  <!-- Footer -->
  <rect x="28" y="392" width="864" height="26" rx="4" fill="#f5f1e8" stroke="#e7e2d8" stroke-width="1"/>
  <text x="460" y="409" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#44403c">Reparameterization isolates stochastic eps so backprop flows deterministically through dL/d(mu) and dL/d(sigma)</text>
</svg>
