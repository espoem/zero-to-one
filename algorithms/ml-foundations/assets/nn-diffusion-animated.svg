<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="100%" role="img" aria-label="Diffusion DDPM: Forward Noising and Learned Reverse Denoising">
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#b45309"/>
    </marker>
  </defs>
  <style>
    .diff-fwd { animation: diff-f 6s infinite; }
    .diff-rev { animation: diff-r 6s infinite; }
    @keyframes diff-f { 0%, 50%, 100% { stroke-width: 1.2; } 5%, 45% { stroke: #b45309; stroke-width: 2.5; } }
    @keyframes diff-r { 0%, 50%, 100% { stroke-width: 1.2; } 55%, 95% { stroke: #0f766e; stroke-width: 2.5; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="920" height="430" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>
  <text x="28" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" fill="#1c1917">Diffusion (DDPM): Forward Noising &amp; Learned Reverse Denoising</text>
  <text x="28" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#57534e">x_t = sqrt(alpha_bar_t) x_0 + sqrt(1 - alpha_bar_t) eps   |   L_simple = E[||eps - eps_theta(x_t, t)||^2]</text>
  <line x1="28" y1="66" x2="892" y2="66" stroke="#1c1917" stroke-width="1.2"/>

  <!-- Forward label -->
  <rect class="diff-fwd" x="190" y="84" width="540" height="26" rx="4" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="460" y="101" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#92400e">Forward Chain (fixed): q(x_t | x_{t-1}) = N(sqrt(alpha_t) x_{t-1}, beta_t I)</text>

  <!-- State boxes -->
  <rect x="44" y="162" width="144" height="90" rx="6" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.6"/>
  <text x="116" y="196" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" fill="#0f766e">x_0</text>
  <text x="116" y="219" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1c1917">Clean Data</text>
  <text x="116" y="237" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#57534e">x_0 ~ q(x)</text>

  <rect x="274" y="162" width="144" height="90" rx="6" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.4"/>
  <text x="346" y="196" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" fill="#1c1917">x_{t-1}</text>
  <text x="346" y="219" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#44403c">Partially Noisy</text>
  <text x="346" y="237" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#57534e">alpha_bar_{t-1}</text>

  <rect x="504" y="162" width="144" height="90" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="576" y="196" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" fill="#92400e">x_t</text>
  <text x="576" y="219" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#44403c">Closed-Form Jump</text>
  <text x="576" y="237" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#b45309">O(1) from x_0</text>

  <rect x="734" y="162" width="144" height="90" rx="6" fill="#f5f1e8" stroke="#1c1917" stroke-width="1.5"/>
  <text x="806" y="196" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" fill="#1c1917">x_T</text>
  <text x="806" y="219" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#44403c">Pure Isotropic</text>
  <text x="806" y="237" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#1c1917">N(0, I)</text>

  <!-- Curved forward arcs (top) -->
  <path d="M 150 156 Q 231 114 312 156" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#arr-amber)"/>
  <path d="M 380 156 Q 461 114 542 156" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#arr-amber)"/>
  <path d="M 610 156 Q 691 114 772 156" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#arr-amber)"/>

  <!-- Curved reverse arcs (bottom) -->
  <path d="M 772 258 Q 691 300 610 258" fill="none" stroke="#0f766e" stroke-width="1.9" marker-end="url(#arr-teal)"/>
  <path d="M 542 258 Q 461 300 380 258" fill="none" stroke="#0f766e" stroke-width="1.9" marker-end="url(#arr-teal)"/>
  <path d="M 312 258 Q 231 300 150 258" fill="none" stroke="#0f766e" stroke-width="1.9" marker-end="url(#arr-teal)"/>

  <!-- Reverse label -->
  <rect class="diff-rev" x="148" y="294" width="624" height="26" rx="4" fill="#f0fdf9" stroke="#99f6e4" stroke-width="1"/>
  <text x="460" y="311" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e">Reverse Denoising (learned): p_theta(x_{t-1} | x_t) via U-Net / DiT predicting eps_theta(x_t, t)</text>

  <!-- Explanatory detail strip -->
  <rect x="44" y="334" width="834" height="44" rx="4" fill="#ffffff" stroke="#e7e2d8" stroke-width="1"/>
  <text x="461" y="352" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#44403c">Training samples t ~ Unif{1..T} in O(1) via cumulative product alpha_bar_t = prod_{s=1..t} (1 - beta_s)</text>
  <text x="461" y="369" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#44403c">Ancestral sampling iterates t = T..1 subtracting scaled eps_theta(x_t, t); DDIM skips steps deterministically</text>

  <!-- Footer -->
  <rect x="28" y="392" width="864" height="26" rx="4" fill="#f5f1e8" stroke="#e7e2d8" stroke-width="1"/>
  <text x="460" y="409" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#44403c">L_simple drops ELBO step-dependent weights for stable perceptual quality; latent diffusion operates in VAE z-space</text>
</svg>
