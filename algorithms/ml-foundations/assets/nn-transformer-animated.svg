<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="title desc">
  <title id="title">Transformer Multi-Head Attention with RoPE</title>
  <desc id="desc">Animated Transformer block showing token embeddings split into Q, K, V projections, Rotary Position Embedding (RoPE) rotation on Q and K, scaled dot-product softmax(QK^T/sqrt(d_k))V, multi-head concatenation, residual connections, and FFN.</desc>
  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes flow-x {
      0%   { transform: translateX(0px); opacity: 0; }
      10%  { opacity: 1; }
      90%  { transform: translateX(760px); opacity: 1; }
      100% { transform: translateX(760px); opacity: 0; }
    }
    @keyframes attn-beat {
      0%, 100% { stroke-width: 2; }
      50%      { stroke-width: 3.5; }
    }
    .tok { animation: flow-x 6s ease-in-out infinite; }
    .attn-box { animation: attn-beat 3s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .tok, .attn-box { animation: none !important; }
      .tok { opacity: 1; transform: translateX(380px); }
    }
  </style>
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="440" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="0" y="0" width="960" height="56" rx="12" fill="#0f172a"/>
  <rect x="0" y="40" width="960" height="16" fill="#0f172a"/>
  <text x="24" y="26" class="sans" font-size="17" font-weight="700" fill="#f8fafc">Transformer Block: RoPE + Multi-Head Attention + Residual FFN</text>
  <text x="24" y="45" class="mono" font-size="12" fill="#94a3b8">Attn(Q,K,V) = softmax(Q K^T / sqrt(d_k)) V   |   &lt;q_m, k_n&gt; = &lt;W_q x_m, R_{n-m} W_k x_n&gt;</text>

  <!-- Residual bypass -->
  <path d="M 95 230 L 95 92 L 642 92 L 642 212" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-slate)"/>
  <text x="368" y="84" class="sans" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Pre-Norm Residual Stream (x + MHA(RMSNorm(x)))</text>

  <!-- Input X -->
  <rect x="34" y="190" width="82" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="75" y="226" class="mono" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">X</text>
  <text x="75" y="246" class="mono" font-size="10" fill="#1d4ed8" text-anchor="middle">[B, n, d]</text>

  <!-- Q, K, V projections -->
  <line x1="116" y1="210" x2="176" y2="146" stroke="#334155" stroke-width="1.8" marker-end="url(#arr-slate)"/>
  <line x1="116" y1="230" x2="176" y2="230" stroke="#334155" stroke-width="1.8" marker-end="url(#arr-slate)"/>
  <line x1="116" y1="250" x2="176" y2="314" stroke="#334155" stroke-width="1.8" marker-end="url(#arr-slate)"/>

  <rect x="180" y="122" width="118" height="48" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="239" y="143" class="mono" font-size="12" font-weight="700" fill="#4c1d95" text-anchor="middle">Q = X W_Q</text>
  <text x="239" y="160" class="mono" font-size="10" fill="#6d28d9" text-anchor="middle">+ RoPE(m)</text>

  <rect x="180" y="206" width="118" height="48" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="239" y="227" class="mono" font-size="12" font-weight="700" fill="#4c1d95" text-anchor="middle">K = X W_K</text>
  <text x="239" y="244" class="mono" font-size="10" fill="#6d28d9" text-anchor="middle">+ RoPE(n)</text>

  <rect x="180" y="290" width="118" height="48" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="239" y="311" class="mono" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">V = X W_V</text>
  <text x="239" y="328" class="mono" font-size="10" fill="#b45309" text-anchor="middle">(no RoPE)</text>

  <!-- Scaled Dot Product Attention -->
  <line x1="298" y1="146" x2="354" y2="198" stroke="#334155" stroke-width="1.8" marker-end="url(#arr-slate)"/>
  <line x1="298" y1="230" x2="354" y2="230" stroke="#334155" stroke-width="1.8" marker-end="url(#arr-slate)"/>
  <line x1="298" y1="314" x2="354" y2="262" stroke="#334155" stroke-width="1.8" marker-end="url(#arr-slate)"/>

  <rect x="358" y="152" width="190" height="156" rx="10" fill="#ecfdf5" stroke="#059669" class="attn-box"/>
  <text x="453" y="182" class="sans" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">Scaled Dot-Product</text>
  <text x="453" y="206" class="mono" font-size="11" fill="#047857" text-anchor="middle">S = Q K^T / sqrt(d_k)</text>
  <text x="453" y="228" class="mono" font-size="11" fill="#047857" text-anchor="middle">+ Causal Mask (-inf)</text>
  <text x="453" y="250" class="mono" font-size="11" fill="#047857" text-anchor="middle">P = softmax(S)</text>
  <text x="453" y="274" class="mono" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">head_i = P V</text>
  <text x="453" y="296" class="sans" font-size="10" fill="#065f46" text-anchor="middle">O(n^2 d) per layer</text>

  <!-- Concat + W_O + Add -->
  <line x1="548" y1="230" x2="618" y2="230" stroke="#334155" stroke-width="2" marker-end="url(#arr-slate)"/>
  <circle cx="642" cy="230" r="18" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="642" y="235" class="mono" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">+</text>
  <text x="583" y="218" class="mono" font-size="10" fill="#334155" text-anchor="middle">W^O</text>

  <!-- FFN + Output -->
  <line x1="660" y1="230" x2="704" y2="230" stroke="#334155" stroke-width="2" marker-end="url(#arr-slate)"/>
  <rect x="708" y="176" width="132" height="108" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text x="774" y="208" class="sans" font-size="12" font-weight="700" fill="#9f1239" text-anchor="middle">SwiGLU / FFN</text>
  <text x="774" y="232" class="mono" font-size="10" fill="#be123c" text-anchor="middle">RMSNorm + MLP</text>
  <text x="774" y="254" class="mono" font-size="10" fill="#be123c" text-anchor="middle">+ Residual</text>

  <line x1="840" y1="230" x2="884" y2="230" stroke="#334155" stroke-width="2" marker-end="url(#arr-slate)"/>
  <text x="908" y="234" class="mono" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Y</text>

  <!-- Token progress bar -->
  <line x1="80" y1="385" x2="880" y2="385" stroke="#cbd5e1" stroke-width="3"/>
  <circle cx="80" cy="385" r="7" fill="#2563eb" class="tok"/>
  <text x="480" y="414" class="sans" font-size="11" fill="#475569" text-anchor="middle">Self-attention computes all-pairs interactions in O(1) sequential depth; decode caches K, V to drop per-step attention from O(n^2) to O(n)</text>
</svg>
