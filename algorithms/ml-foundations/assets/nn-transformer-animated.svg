<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="100%" role="img" aria-label="Transformer Block: RoPE, Multi-Head Attention, and Residual FFN">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1c1917"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#b45309"/>
    </marker>
  </defs>
  <style>
    .tr-s1 { animation: tr-st1 8s infinite; }
    .tr-s2 { animation: tr-st2 8s infinite; }
    .tr-s3 { animation: tr-st3 8s infinite; }
    .tr-s4 { animation: tr-st4 8s infinite; }
    @keyframes tr-st1 { 0%, 25%, 100% { stroke-width: 1.3; } 3%, 22% { stroke: #0f766e; stroke-width: 2.6; } }
    @keyframes tr-st2 { 0%, 25%, 50%, 100% { stroke-width: 1.6; } 28%, 47% { stroke: #0f766e; stroke-width: 2.8; } }
    @keyframes tr-st3 { 0%, 50%, 75%, 100% { stroke-width: 1.6; } 53%, 72% { stroke: #b45309; stroke-width: 2.8; } }
    @keyframes tr-st4 { 0%, 75%, 100% { stroke-width: 1.4; } 78%, 97% { stroke: #0f766e; stroke-width: 2.6; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="920" height="430" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>
  <text x="28" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" fill="#1c1917">Transformer Block: RoPE + Multi-Head Attention + Residual FFN</text>
  <text x="28" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#57534e">Attn(Q,K,V) = softmax(Q K^T / sqrt(d_k)) V   |   &lt;q_m, k_n&gt; = &lt;W_q x_m, R_{n-m} W_k x_n&gt;</text>
  <line x1="28" y1="66" x2="892" y2="66" stroke="#1c1917" stroke-width="1.2"/>

  <!-- Pre-Norm Residual Stream -->
  <path d="M 102 232 L 102 96 L 644 96 L 644 212" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arr-amber)"/>
  <rect x="224" y="83" width="320" height="24" rx="4" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="384" y="99" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#b45309">Pre-Norm Residual Stream (x + Sublayer(Norm(x)))</text>

  <!-- Input Tensor -->
  <rect x="28" y="192" width="90" height="80" rx="4" fill="#ffffff" stroke="#1c1917" stroke-width="1.4"/>
  <text x="73" y="226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#1c1917">X</text>
  <text x="73" y="246" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#57534e">[B, n, d]</text>

  <!-- Split to Q, K, V -->
  <line x1="118" y1="232" x2="148" y2="232" stroke="#44403c" stroke-width="1.6"/>
  <path d="M 148 156 L 148 308" fill="none" stroke="#44403c" stroke-width="1.5"/>
  <line x1="148" y1="156" x2="176" y2="156" stroke="#44403c" stroke-width="1.5" marker-end="url(#arr-ink)"/>
  <line x1="148" y1="232" x2="176" y2="232" stroke="#44403c" stroke-width="1.5" marker-end="url(#arr-ink)"/>
  <line x1="148" y1="308" x2="176" y2="308" stroke="#44403c" stroke-width="1.5" marker-end="url(#arr-ink)"/>

  <!-- Q, K, V Boxes -->
  <rect class="tr-s1" x="182" y="128" width="128" height="56" rx="4" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.3"/>
  <text x="246" y="152" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" fill="#0f766e">Q = X W_Q</text>
  <text x="246" y="170" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#065f46">+ RoPE(m)</text>

  <rect class="tr-s1" x="182" y="204" width="128" height="56" rx="4" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.3"/>
  <text x="246" y="228" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" fill="#0f766e">K = X W_K</text>
  <text x="246" y="246" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#065f46">+ RoPE(n)</text>

  <rect class="tr-s1" x="182" y="280" width="128" height="56" rx="4" fill="#f5f1e8" stroke="#d6d0c4" stroke-width="1.3"/>
  <text x="246" y="304" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" fill="#1c1917">V = X W_V</text>
  <text x="246" y="322" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#57534e">(no RoPE)</text>

  <!-- Inputs into Attention box -->
  <path d="M 310 156 L 354 196" fill="none" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arr-teal)"/>
  <line x1="310" y1="232" x2="354" y2="232" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arr-teal)"/>
  <path d="M 310 308 L 354 268" fill="none" stroke="#44403c" stroke-width="1.6" marker-end="url(#arr-ink)"/>

  <!-- Attention Box -->
  <rect class="tr-s2" x="360" y="148" width="194" height="168" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
  <rect x="360" y="148" width="194" height="30" rx="6" fill="#0f766e"/>
  <rect x="360" y="170" width="194" height="8" fill="#0f766e"/>
  <text x="457" y="168" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Scaled Dot-Product</text>

  <text x="457" y="200" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#1c1917">S = Q K^T / sqrt(d_k)</text>
  <text x="457" y="222" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#b45309">+ Causal Mask (-inf)</text>
  <text x="457" y="244" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#0f766e">P = softmax(S)</text>
  <text x="457" y="266" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#1c1917">head_i = P V</text>
  <line x1="376" y1="280" x2="538" y2="280" stroke="#e7e2d8" stroke-width="1"/>
  <text x="457" y="300" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#57534e">O(n^2 d) per layer</text>

  <!-- Projection W^O -> Residual sum -->
  <line x1="554" y1="232" x2="622" y2="232" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <text x="588" y="222" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#0f766e">W^O</text>

  <circle class="tr-s3" cx="644" cy="232" r="14" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
  <text x="644" y="237" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#b45309">+</text>

  <!-- SwiGLU / FFN -->
  <line x1="658" y1="232" x2="700" y2="232" stroke="#1c1917" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <rect class="tr-s4" x="706" y="176" width="134" height="112" rx="6" fill="#f5f1e8" stroke="#1c1917" stroke-width="1.4"/>
  <text x="773" y="208" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1c1917">SwiGLU / FFN</text>
  <text x="773" y="230" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#44403c">RMSNorm + MLP</text>
  <line x1="722" y1="246" x2="824" y2="246" stroke="#d6d0c4" stroke-width="1"/>
  <text x="773" y="268" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#b45309">+ Residual Add</text>

  <!-- Output Y -->
  <line x1="840" y1="232" x2="868" y2="232" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-teal)"/>
  <text x="880" y="237" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#0f766e">Y</text>

  <!-- Footer -->
  <rect x="28" y="392" width="864" height="26" rx="4" fill="#f5f1e8" stroke="#e7e2d8" stroke-width="1"/>
  <text x="460" y="409" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#44403c">Every token interacts with all prior tokens at O(1) path length; KV caching reduces incremental decode from O(n^2) to O(n)</text>
</svg>
