<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="100%" role="img" aria-label="GAN: Two-Player Minimax Game and Jensen-Shannon Equilibrium">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1c1917"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#b45309"/>
    </marker>
  </defs>
  <style>
    .gan-s1 { animation: gan-st1 7.5s infinite; }
    .gan-s2 { animation: gan-st2 7.5s infinite; }
    .gan-s3 { animation: gan-st3 7.5s infinite; }
    @keyframes gan-st1 { 0%, 33.3%, 100% { stroke-width: 1.6; } 4%, 29% { stroke: #b45309; stroke-width: 2.9; } }
    @keyframes gan-st2 { 0%, 33.3%, 66.6%, 100% { stroke-width: 1.6; } 37%, 63% { stroke: #0f766e; stroke-width: 2.9; } }
    @keyframes gan-st3 { 0%, 66.6%, 100% { stroke-width: 1.2; } 70%, 96% { stroke: #b45309; stroke-width: 2.6; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="920" height="430" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>
  <text x="28" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" fill="#1c1917">GAN: Two-Player Minimax Game &amp; Jensen-Shannon Equilibrium</text>
  <text x="28" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#57534e">min_G max_D V(D,G) = E[log D(x)] + E[log(1 - D(G(z)))]   |   V(D*,G) = -log 4 + 2 JSD(p_data || p_g)</text>
  <line x1="28" y1="66" x2="892" y2="66" stroke="#1c1917" stroke-width="1.2"/>

  <!-- Latent Noise z -->
  <rect x="28" y="132" width="124" height="68" rx="5" fill="#f5f1e8" stroke="#d6d0c4" stroke-width="1.3"/>
  <text x="90" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#1c1917">Latent Noise</text>
  <text x="90" y="181" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#57534e">z ~ p_z</text>

  <line x1="152" y1="166" x2="210" y2="166" stroke="#1c1917" stroke-width="1.8" marker-end="url(#arr-ink)"/>

  <!-- Generator G -->
  <rect class="gan-s1" x="218" y="122" width="170" height="88" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
  <text x="303" y="148" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Generator G(z)</text>
  <text x="303" y="169" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#44403c">G(z) ~ p_g</text>
  <text x="303" y="191" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#b45309">max E[log D(G(z))]</text>

  <!-- Real Data x -->
  <rect x="218" y="246" width="170" height="68" rx="6" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.5"/>
  <text x="303" y="275" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#0f766e">Real Data x</text>
  <text x="303" y="297" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#065f46">x ~ p_data</text>

  <!-- Arrows into Discriminator -->
  <path d="M 388 166 L 474 202" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#arr-amber)"/>
  <text x="436" y="170" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#b45309">Fake</text>

  <path d="M 388 280 L 474 244" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <text x="436" y="280" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f766e">Real</text>

  <!-- Discriminator D -->
  <rect class="gan-s2" x="480" y="168" width="190" height="110" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1.6"/>
  <rect x="480" y="168" width="190" height="30" rx="6" fill="#1c1917"/>
  <rect x="480" y="190" width="190" height="8" fill="#1c1917"/>
  <text x="575" y="188" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">Discriminator D(u)</text>
  <text x="575" y="220" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#1c1917">D(u) in (0, 1)</text>
  <line x1="496" y1="234" x2="654" y2="234" stroke="#e7e2d8" stroke-width="1"/>
  <text x="575" y="253" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#0f766e">D*(x) = p_data /</text>
  <text x="575" y="269" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#0f766e">(p_data + p_g)</text>

  <!-- Equilibrium Output -->
  <line x1="670" y1="223" x2="722" y2="223" stroke="#1c1917" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <rect x="728" y="180" width="164" height="86" rx="5" fill="#f5f1e8" stroke="#d6d0c4" stroke-width="1.3"/>
  <text x="810" y="207" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#1c1917">Real vs Fake</text>
  <text x="810" y="229" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#57534e">Nash Equilibrium:</text>
  <text x="810" y="250" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" fill="#0f766e">D*(x) = 0.5</text>

  <!-- Non-saturating gradient feedback -->
  <path class="gan-s3" d="M 575 278 L 575 352 L 303 352 L 303 218" fill="none" stroke="#b45309" stroke-width="1.7" stroke-dasharray="5 3" marker-end="url(#arr-amber)"/>
  <rect class="gan-s3" x="330" y="338" width="232" height="26" rx="4" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="446" y="355" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#92400e">Non-Saturating Gradient to G</text>

  <!-- Footer -->
  <rect x="28" y="392" width="864" height="26" rx="4" fill="#f5f1e8" stroke="#e7e2d8" stroke-width="1"/>
  <text x="460" y="409" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#44403c">If D becomes too sharp prematurely, grad log(1 - D(G(z))) vanishes; max log D(G(z)) + WGAN / spectral norm stabilize training</text>
</svg>
