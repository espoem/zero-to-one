<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="100%" role="img" aria-label="GNN: Neighborhood Message Passing, GCN Spectral vs GAT Attention">
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="920" height="430" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>
  <text x="28" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" fill="#1c1917">GNN: Neighborhood Message Passing (GCN Spectral vs GAT Attention)</text>
  <text x="28" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#57534e">GCN: H(l+1) = sigma(D~^{-1/2} A~ D~^{-1/2} H(l) W(l))   |   GAT: h_i' = sigma(sum_{j in N_i} alpha_{ij} W h_j)</text>
  <line x1="28" y1="66" x2="892" y2="66" stroke="#1c1917" stroke-width="1.2"/>

  <!-- Left panel: 1-hop graph -->
  <rect x="28" y="84" width="328" height="294" rx="6" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.2"/>
  <text x="192" y="106" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#1c1917">1-Hop Neighborhood Aggregation</text>

  <!-- Neighbor nodes -->
  <circle cx="96" cy="166" r="24" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.4"/>
  <text x="96" y="171" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#0f766e">h_j1</text>

  <circle cx="288" cy="166" r="24" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.4"/>
  <text x="288" y="171" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#0f766e">h_j2</text>

  <circle cx="192" cy="314" r="24" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.4"/>
  <text x="192" y="319" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#0f766e">h_j3</text>

  <!-- Target center node -->
  <circle cx="192" cy="230" r="28" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
  <text x="192" y="235" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#92400e">h_i'</text>

  <!-- Edges to center -->
  <line x1="116" y1="181" x2="165" y2="213" stroke="#b45309" stroke-width="2" marker-end="url(#arr-amber)"/>
  <line x1="268" y1="181" x2="219" y2="213" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-teal)"/>
  <line x1="192" y1="290" x2="192" y2="262" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-teal)"/>

  <text x="130" y="209" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700" fill="#b45309">a_i1</text>
  <text x="242" y="209" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700" fill="#0f766e">a_i2</text>
  <text x="200" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700" fill="#0f766e">a_i3</text>

  <text x="192" y="362" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#57534e">Permutation-equivariant over node order</text>

  <!-- Right Top: GCN -->
  <rect x="374" y="84" width="518" height="140" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/>
  <rect x="374" y="84" width="518" height="28" rx="6" fill="#0f766e"/>
  <rect x="374" y="104" width="518" height="8" fill="#0f766e"/>
  <text x="392" y="103" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">GCN (Kipf &amp; Welling 2017): Fixed Degree Normalization</text>

  <text x="392" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#0f766e">A~ = A + I</text>
  <text x="492" y="136" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#44403c">(self-loop preserves node i's own state)</text>
  <text x="392" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#1c1917">weight(i, j) = 1 / sqrt(deg_i * deg_j)</text>
  <text x="698" y="160" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#57534e">Isotropic, graph-static</text>
  <rect x="392" y="176" width="482" height="32" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="404" y="196" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">Risk: Over-smoothing collapses node features for depth L &gt; 4..6</text>

  <!-- Right Bottom: GAT -->
  <rect x="374" y="238" width="518" height="140" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
  <rect x="374" y="238" width="518" height="28" rx="6" fill="#b45309"/>
  <rect x="374" y="258" width="518" height="8" fill="#b45309"/>
  <text x="392" y="257" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">GAT (Velickovic et al. 2018): Learned Edge Attention</text>

  <text x="392" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#1c1917">e_{ij} = LeakyReLU(a^T [W h_i || W h_j])</text>
  <text x="392" y="314" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" fill="#b45309">alpha_{ij} = softmax_j(e_{ij})</text>
  <text x="634" y="314" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#44403c">Anisotropic per-edge weights</text>
  <rect x="392" y="330" width="482" height="32" rx="4" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="404" y="350" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#92400e">Inductive on unseen graphs; multi-head concat in hidden layers, average at output</text>

  <!-- Footer -->
  <rect x="28" y="392" width="864" height="26" rx="4" fill="#f5f1e8" stroke="#e7e2d8" stroke-width="1"/>
  <text x="460" y="409" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#44403c">Stacking L message-passing layers creates an L-hop receptive field; GraphSAGE samples fixed neighborhoods to curb hub blow-up</text>
</svg>
