<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="title desc">
  <title id="title">Multi-Layer Perceptron (MLP) Forward and Backpropagation Flow</title>
  <desc id="desc">Animated schematic of a 4-layer MLP showing forward activation passes from input x through two hidden layers with nonlinear activation sigma to output f(x), paired with reverse-mode gradient flow.</desc>
  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes fwd-pulse {
      0%   { transform: translateX(0px); opacity: 0; }
      10%  { opacity: 1; }
      45%  { transform: translateX(510px); opacity: 1; }
      50%, 100% { transform: translateX(510px); opacity: 0; }
    }
    @keyframes bwd-pulse {
      0%, 50% { transform: translateX(0px); opacity: 0; }
      55%     { opacity: 1; }
      92%     { transform: translateX(-510px); opacity: 1; }
      100%    { transform: translateX(-510px); opacity: 0; }
    }
    @keyframes node-glow {
      0%, 100% { stroke-width: 2; }
      50%      { stroke-width: 3.5; }
    }
    .fwd { animation: fwd-pulse 6s ease-in-out infinite; }
    .bwd { animation: bwd-pulse 6s ease-in-out infinite; }
    .glow { animation: node-glow 3s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .fwd, .bwd, .glow { animation: none !important; }
      .fwd { opacity: 1; transform: translateX(255px); }
      .bwd { opacity: 1; transform: translateX(-255px); }
    }
  </style>
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="440" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="0" y="0" width="960" height="56" rx="12" fill="#0f172a"/>
  <rect x="0" y="40" width="960" height="16" fill="#0f172a"/>
  <text x="24" y="26" class="sans" font-size="17" font-weight="700" fill="#f8fafc">Multi-Layer Perceptron (MLP): Universal Approximation &amp; Autodiff</text>
  <text x="24" y="45" class="mono" font-size="12" fill="#94a3b8">h(l) = sigma(W(l) h(l-1) + b(l))   |   f(x) = W(L) h(L-1) + b(L)</text>

  <!-- Edges -->
  <g stroke="#cbd5e1" stroke-width="1.4">
    <line x1="150" y1="130" x2="320" y2="105"/><line x1="150" y1="130" x2="320" y2="175"/><line x1="150" y1="130" x2="320" y2="245"/><line x1="150" y1="130" x2="320" y2="315"/>
    <line x1="150" y1="210" x2="320" y2="105"/><line x1="150" y1="210" x2="320" y2="175"/><line x1="150" y1="210" x2="320" y2="245"/><line x1="150" y1="210" x2="320" y2="315"/>
    <line x1="150" y1="290" x2="320" y2="105"/><line x1="150" y1="290" x2="320" y2="175"/><line x1="150" y1="290" x2="320" y2="245"/><line x1="150" y1="290" x2="320" y2="315"/>

    <line x1="360" y1="105" x2="530" y2="105"/><line x1="360" y1="105" x2="530" y2="175"/><line x1="360" y1="105" x2="530" y2="245"/><line x1="360" y1="105" x2="530" y2="315"/>
    <line x1="360" y1="175" x2="530" y2="105"/><line x1="360" y1="175" x2="530" y2="175"/><line x1="360" y1="175" x2="530" y2="245"/><line x1="360" y1="175" x2="530" y2="315"/>
    <line x1="360" y1="245" x2="530" y2="105"/><line x1="360" y1="245" x2="530" y2="175"/><line x1="360" y1="245" x2="530" y2="245"/><line x1="360" y1="245" x2="530" y2="315"/>
    <line x1="360" y1="315" x2="530" y2="105"/><line x1="360" y1="315" x2="530" y2="175"/><line x1="360" y1="315" x2="530" y2="245"/><line x1="360" y1="315" x2="530" y2="315"/>

    <line x1="570" y1="105" x2="720" y2="170"/><line x1="570" y1="105" x2="720" y2="250"/>
    <line x1="570" y1="175" x2="720" y2="170"/><line x1="570" y1="175" x2="720" y2="250"/>
    <line x1="570" y1="245" x2="720" y2="170"/><line x1="570" y1="245" x2="720" y2="250"/>
    <line x1="570" y1="315" x2="720" y2="170"/><line x1="570" y1="315" x2="720" y2="250"/>
  </g>

  <!-- Input nodes -->
  <g>
    <circle cx="130" cy="130" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="130" y="135" class="mono" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">x1</text>
    <circle cx="130" cy="210" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="130" y="215" class="mono" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">x2</text>
    <circle cx="130" cy="290" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="130" y="295" class="mono" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">x3</text>
    <text x="130" y="346" class="sans" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Input h(0)</text>
  </g>

  <!-- Hidden 1 -->
  <g>
    <circle cx="340" cy="105" r="20" fill="#ede9fe" stroke="#7c3aed" class="glow"/>
    <circle cx="340" cy="175" r="20" fill="#ede9fe" stroke="#7c3aed" class="glow"/>
    <circle cx="340" cy="245" r="20" fill="#ede9fe" stroke="#7c3aed" class="glow"/>
    <circle cx="340" cy="315" r="20" fill="#ede9fe" stroke="#7c3aed" class="glow"/>
    <text x="340" y="110" class="mono" font-size="11" font-weight="700" fill="#4c1d95" text-anchor="middle">sigma</text>
    <text x="340" y="180" class="mono" font-size="11" font-weight="700" fill="#4c1d95" text-anchor="middle">sigma</text>
    <text x="340" y="250" class="mono" font-size="11" font-weight="700" fill="#4c1d95" text-anchor="middle">sigma</text>
    <text x="340" y="320" class="mono" font-size="11" font-weight="700" fill="#4c1d95" text-anchor="middle">sigma</text>
    <text x="340" y="360" class="sans" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Hidden h(1)</text>
  </g>

  <!-- Hidden 2 -->
  <g>
    <circle cx="550" cy="105" r="20" fill="#ede9fe" stroke="#7c3aed" class="glow"/>
    <circle cx="550" cy="175" r="20" fill="#ede9fe" stroke="#7c3aed" class="glow"/>
    <circle cx="550" cy="245" r="20" fill="#ede9fe" stroke="#7c3aed" class="glow"/>
    <circle cx="550" cy="315" r="20" fill="#ede9fe" stroke="#7c3aed" class="glow"/>
    <text x="550" y="110" class="mono" font-size="11" font-weight="700" fill="#4c1d95" text-anchor="middle">sigma</text>
    <text x="550" y="180" class="mono" font-size="11" font-weight="700" fill="#4c1d95" text-anchor="middle">sigma</text>
    <text x="550" y="250" class="mono" font-size="11" font-weight="700" fill="#4c1d95" text-anchor="middle">sigma</text>
    <text x="550" y="320" class="mono" font-size="11" font-weight="700" fill="#4c1d95" text-anchor="middle">sigma</text>
    <text x="550" y="360" class="sans" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Hidden h(2)</text>
  </g>

  <!-- Output -->
  <g>
    <circle cx="740" cy="170" r="22" fill="#d1fae5" stroke="#059669" stroke-width="2.2"/>
    <text x="740" y="175" class="mono" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">y1</text>
    <circle cx="740" cy="250" r="22" fill="#d1fae5" stroke="#059669" stroke-width="2.2"/>
    <text x="740" y="255" class="mono" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">y2</text>
    <text x="740" y="305" class="sans" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Linear Head</text>
  </g>

  <!-- Loss box -->
  <rect x="810" y="166" width="118" height="88" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.8"/>
  <text x="869" y="198" class="sans" font-size="12" font-weight="700" fill="#9f1239" text-anchor="middle">Loss L(y, y^)</text>
  <text x="869" y="220" class="mono" font-size="11" fill="#be123c" text-anchor="middle">dL / dW(l)</text>
  <text x="869" y="238" class="sans" font-size="10" fill="#881337" text-anchor="middle">Reverse-Mode AD</text>
  <line x1="762" y1="210" x2="806" y2="210" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Forward & backward animation tracks -->
  <line x1="155" y1="395" x2="710" y2="395" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="430" y="388" class="sans" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">Forward Pass: Activations O(sum d_l d_{l-1})</text>
  <circle cx="170" cy="395" r="7" fill="#2563eb" class="fwd"/>

  <line x1="710" y1="420" x2="155" y2="420" stroke="#e11d48" stroke-width="2" marker-end="url(#arr-rose)"/>
  <text x="430" y="414" class="sans" font-size="11" font-weight="700" fill="#be123c" text-anchor="middle">Backpropagation: VJP Chain Rule dL/dh(l-1) = W(l)^T (dL/dz(l))</text>
  <circle cx="695" cy="420" r="7" fill="#e11d48" class="bwd"/>
</svg>
