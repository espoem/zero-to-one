<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="title desc">
  <title id="title">Multi-Layer Perceptron (MLP) Forward and Backpropagation Flow</title>
  <desc id="desc">Static Editorial Paper schematic of a 4-layer MLP showing forward affine plus nonlinear activations from x to y and reverse-mode vector-Jacobian gradient propagation from Loss L.</desc>
  <defs>
    <marker id="ed-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,2 L9,5 L1,8" fill="none" stroke="#1c1917" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ed-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,2 L9,5 L1,8" fill="none" stroke="#0f766e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ed-arr-danger" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,2 L9,5 L1,8" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .ed-serif { font-family: Georgia, "Times New Roman", serif; }
    .ed-sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .ed-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>

  <rect x="0" y="0" width="960" height="440" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>
  <text x="32" y="32" class="ed-mono" font-size="10.5" fill="#78716c" letter-spacing="1.4">MLP ARCHITECTURE · h(l) = σ(W(l) h(l-1) + b(l))   |   f(x) = W(L) h(L-1) + b(L)</text>
  <text x="32" y="56" class="ed-serif" font-size="19" font-weight="700" fill="#1c1917">Multi-Layer Perceptron: Forward Composition &amp; Reverse-Mode AD</text>
  <line x1="32" y1="68" x2="928" y2="68" stroke="#1c1917" stroke-width="1.2"/>

  <!-- Edges -->
  <g stroke="#d6d0c4" stroke-width="1.1">
    <line x1="150" y1="130" x2="320" y2="105"/><line x1="150" y1="130" x2="320" y2="170"/><line x1="150" y1="130" x2="320" y2="235"/><line x1="150" y1="130" x2="320" y2="300"/>
    <line x1="150" y1="205" x2="320" y2="105"/><line x1="150" y1="205" x2="320" y2="170"/><line x1="150" y1="205" x2="320" y2="235"/><line x1="150" y1="205" x2="320" y2="300"/>
    <line x1="150" y1="280" x2="320" y2="105"/><line x1="150" y1="280" x2="320" y2="170"/><line x1="150" y1="280" x2="320" y2="235"/><line x1="150" y1="280" x2="320" y2="300"/>

    <line x1="360" y1="105" x2="520" y2="105"/><line x1="360" y1="105" x2="520" y2="170"/><line x1="360" y1="105" x2="520" y2="235"/><line x1="360" y1="105" x2="520" y2="300"/>
    <line x1="360" y1="170" x2="520" y2="105"/><line x1="360" y1="170" x2="520" y2="170"/><line x1="360" y1="170" x2="520" y2="235"/><line x1="360" y1="170" x2="520" y2="300"/>
    <line x1="360" y1="235" x2="520" y2="105"/><line x1="360" y1="235" x2="520" y2="170"/><line x1="360" y1="235" x2="520" y2="235"/><line x1="360" y1="235" x2="520" y2="300"/>
    <line x1="360" y1="300" x2="520" y2="105"/><line x1="360" y1="300" x2="520" y2="170"/><line x1="360" y1="300" x2="520" y2="235"/><line x1="360" y1="300" x2="520" y2="300"/>

    <line x1="560" y1="105" x2="700" y2="168"/><line x1="560" y1="105" x2="700" y2="244"/>
    <line x1="560" y1="170" x2="700" y2="168"/><line x1="560" y1="170" x2="700" y2="244"/>
    <line x1="560" y1="235" x2="700" y2="168"/><line x1="560" y1="235" x2="700" y2="244"/>
    <line x1="560" y1="300" x2="700" y2="168"/><line x1="560" y1="300" x2="700" y2="244"/>
  </g>

  <!-- Input layer -->
  <circle cx="130" cy="130" r="20" fill="#ffffff" stroke="#1c1917" stroke-width="1.3"/>
  <text x="130" y="135" class="ed-mono" font-size="12" font-weight="700" fill="#1c1917" text-anchor="middle">x1</text>
  <circle cx="130" cy="205" r="20" fill="#ffffff" stroke="#1c1917" stroke-width="1.3"/>
  <text x="130" y="210" class="ed-mono" font-size="12" font-weight="700" fill="#1c1917" text-anchor="middle">x2</text>
  <circle cx="130" cy="280" r="20" fill="#ffffff" stroke="#1c1917" stroke-width="1.3"/>
  <text x="130" y="285" class="ed-mono" font-size="12" font-weight="700" fill="#1c1917" text-anchor="middle">x3</text>
  <text x="130" y="330" class="ed-sans" font-size="11.5" font-weight="700" fill="#44403c" text-anchor="middle">Input h(0)</text>

  <!-- Hidden 1 -->
  <g>
    <circle cx="340" cy="105" r="19" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.3"/>
    <circle cx="340" cy="170" r="19" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.3"/>
    <circle cx="340" cy="235" r="19" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.3"/>
    <circle cx="340" cy="300" r="19" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.3"/>
    <text x="340" y="110" class="ed-mono" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">σ</text>
    <text x="340" y="175" class="ed-mono" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">σ</text>
    <text x="340" y="240" class="ed-mono" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">σ</text>
    <text x="340" y="305" class="ed-mono" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">σ</text>
    <text x="340" y="340" class="ed-sans" font-size="11.5" font-weight="700" fill="#0f766e" text-anchor="middle">Hidden h(1)</text>
  </g>

  <!-- Hidden 2 -->
  <g>
    <circle cx="540" cy="105" r="19" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.3"/>
    <circle cx="540" cy="170" r="19" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.3"/>
    <circle cx="540" cy="235" r="19" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.3"/>
    <circle cx="540" cy="300" r="19" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.3"/>
    <text x="540" y="110" class="ed-mono" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">σ</text>
    <text x="540" y="175" class="ed-mono" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">σ</text>
    <text x="540" y="240" class="ed-mono" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">σ</text>
    <text x="540" y="305" class="ed-mono" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">σ</text>
    <text x="540" y="340" class="ed-sans" font-size="11.5" font-weight="700" fill="#0f766e" text-anchor="middle">Hidden h(2)</text>
  </g>

  <!-- Linear Output -->
  <circle cx="720" cy="168" r="21" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="720" y="173" class="ed-mono" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">y1</text>
  <circle cx="720" cy="244" r="21" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="720" y="249" class="ed-mono" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">y2</text>
  <text x="720" y="294" class="ed-sans" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle">Linear Head</text>

  <!-- Loss Box -->
  <line x1="744" y1="206" x2="788" y2="206" stroke="#1c1917" stroke-width="1.3" marker-end="url(#ed-arr)"/>
  <rect x="794" y="162" width="134" height="88" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="861" y="190" class="ed-sans" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">Loss L(y, ŷ)</text>
  <text x="861" y="212" class="ed-mono" font-size="11" fill="#dc2626" text-anchor="middle">∇_W(l) L</text>
  <text x="861" y="232" class="ed-sans" font-size="10" fill="#7f1d1d" text-anchor="middle">Reverse-Mode AD</text>

  <!-- Forward & Backward static dimension tracks -->
  <line x1="130" y1="376" x2="720" y2="376" stroke="#0f766e" stroke-width="1.5" marker-end="url(#ed-arr-teal)"/>
  <text x="425" y="368" class="ed-sans" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle">Forward Pass: cache activations z(l) · O(sum d_l d_{l-1}) MACs</text>

  <line x1="720" y1="406" x2="130" y2="406" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ed-arr-danger)"/>
  <text x="425" y="399" class="ed-sans" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">Backprop VJP: δ(l) = ((W(l+1))^T δ(l+1)) ⊙ σ'(z(l))</text>
</svg>
