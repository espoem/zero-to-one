<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" role="img" aria-labelledby="title desc">
  <title id="title">8 Ways to Shrink the LLM KV Cache</title>
  <desc id="desc">Static Editorial Paper chart and taxonomy of the 8 KV-cache compression methods reducing M_KV = 2 L n_kv d_h b T B across four axes: heads and latents (MQA, GQA, MLA), sequence horizon (Sliding Window, Attention Sinks), allocator and prefix sharing (PagedAttention, RadixAttention), and bit-width (FP8/INT8/KIVI KV Quantization).</desc>
  <style>
    .ed-serif { font-family: Georgia, "Times New Roman", serif; }
    .ed-sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .ed-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>

  <rect x="0" y="0" width="980" height="430" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>
  <text x="32" y="32" class="ed-mono" font-size="10.5" fill="#78716c" letter-spacing="1.4">TRANSFORMER DECODING MEMORY BUDGET · M_KV = 2 · L · n_kv · d_h · b · T · B</text>
  <text x="32" y="56" class="ed-serif" font-size="19.5" font-weight="700" fill="#1c1917">Proportional Per-Token KV Footprint &amp; 8 Compression Levers</text>
  <line x1="32" y1="68" x2="948" y2="68" stroke="#1c1917" stroke-width="1.2"/>

  <!-- Proportional Footprint Bars -->
  <text x="32" y="94" class="ed-mono" font-size="10.5" font-weight="700" fill="#1c1917" letter-spacing="0.8">PER-TOKEN BF16 FOOTPRINT (7B–8B CLASS L=32 MHA/GQA · DEEPSEEK-V2 MLA L=60)</text>

  <g transform="translate(32, 108)">
    <text x="0" y="14" class="ed-sans" font-size="11.5" font-weight="700" fill="#1c1917">MHA-32 Baseline</text>
    <rect x="170" y="3" width="600" height="14" rx="2" fill="#d6d0c4"/>
    <text x="782" y="14" class="ed-mono" font-size="11" fill="#1c1917">512 KiB / tok (1.0×)</text>

    <text x="0" y="38" class="ed-sans" font-size="11.5" font-weight="700" fill="#1c1917">GQA-8 (Llama-3)</text>
    <rect x="170" y="27" width="150" height="14" rx="2" fill="#0f766e"/>
    <text x="332" y="38" class="ed-mono" font-size="11" fill="#0f766e">128 KiB / tok (4.0× smaller)</text>

    <text x="0" y="62" class="ed-sans" font-size="11.5" font-weight="700" fill="#1c1917">MLA (DeepSeek-V2)</text>
    <rect x="170" y="51" width="79" height="14" rx="2" fill="#0f766e"/>
    <text x="261" y="62" class="ed-mono" font-size="11" fill="#0f766e">67.5 KiB / tok (576 elems/layer)</text>

    <text x="0" y="86" class="ed-sans" font-size="11.5" font-weight="700" fill="#1c1917">GQA-8 + KIVI 2-bit</text>
    <rect x="170" y="75" width="22" height="14" rx="2" fill="#b45309"/>
    <text x="204" y="86" class="ed-mono" font-size="11" fill="#b45309">~16–19 KiB / tok (16×–32× total cut)</text>
  </g>

  <line x1="32" y1="214" x2="948" y2="214" stroke="#1c1917" stroke-width="1"/>

  <!-- 4 Clean Vertical Taxonomy Columns -->
  <g transform="translate(32, 232)">
    <text x="0" y="12" class="ed-mono" font-size="10.5" font-weight="700" fill="#0f766e">AXIS 1 · HEADS &amp; LATENTS</text>
    <line x1="0" y1="20" x2="210" y2="20" stroke="#0f766e"/>
    <text x="0" y="40" class="ed-sans" font-size="12" font-weight="700" fill="#1c1917">1. MQA (n_kv = 1)</text>
    <text x="0" y="56" class="ed-sans" font-size="11" fill="#57534e">Single K/V shared across Q heads.</text>
    <text x="0" y="80" class="ed-sans" font-size="12" font-weight="700" fill="#1c1917">2. GQA (n_kv = n_h / G)</text>
    <text x="0" y="96" class="ed-sans" font-size="11" fill="#57534e">Group mean uptrain (5%); 4× cut.</text>
    <text x="0" y="120" class="ed-sans" font-size="12" font-weight="700" fill="#1c1917">3. MLA (c_t^KV + k_t^R)</text>
    <text x="0" y="136" class="ed-sans" font-size="11" fill="#57534e">Low-rank latent; absorb W^UK/UV.</text>

    <text x="236" y="12" class="ed-mono" font-size="10.5" font-weight="700" fill="#b45309">AXIS 2 · HORIZON T</text>
    <line x1="236" y1="20" x2="446" y2="20" stroke="#b45309"/>
    <text x="236" y="40" class="ed-sans" font-size="12" font-weight="700" fill="#1c1917">4. Sliding Window (SWA)</text>
    <text x="236" y="56" class="ed-sans" font-size="11" fill="#57534e">Rolling O(W) ring buffer.</text>
    <text x="236" y="80" class="ed-sans" font-size="12" font-weight="700" fill="#1c1917">5. Attention Sinks</text>
    <text x="236" y="96" class="ed-sans" font-size="11" fill="#57534e">Pin t=0..3 tokens + W window;</text>
    <text x="236" y="112" class="ed-sans" font-size="11" fill="#57534e">stable to 4M tokens (22.2× faster).</text>

    <text x="472" y="12" class="ed-mono" font-size="10.5" font-weight="700" fill="#1c1917">AXIS 3 · ALLOCATOR</text>
    <line x1="472" y1="20" x2="682" y2="20" stroke="#1c1917"/>
    <text x="472" y="40" class="ed-sans" font-size="12" font-weight="700" fill="#1c1917">6. PagedAttention (vLLM)</text>
    <text x="472" y="56" class="ed-sans" font-size="11" fill="#57534e">&lt; 4% waste via virtual KV pages</text>
    <text x="472" y="72" class="ed-sans" font-size="11" fill="#57534e">+ CoW beam sharing (2–4× batch).</text>
    <text x="472" y="96" class="ed-sans" font-size="12" font-weight="700" fill="#1c1917">7. Prefix / RadixAttention</text>
    <text x="472" y="112" class="ed-sans" font-size="11" fill="#57534e">Radix trie reuses shared prefixes;</text>
    <text x="472" y="128" class="ed-sans" font-size="11" fill="#57534e">up to 6.4× multi-turn speed.</text>

    <text x="708" y="12" class="ed-mono" font-size="10.5" font-weight="700" fill="#b45309">AXIS 4 · PRECISION b</text>
    <line x1="708" y1="20" x2="916" y2="20" stroke="#b45309"/>
    <text x="708" y="40" class="ed-sans" font-size="12" font-weight="700" fill="#1c1917">8. KV Quantization (KIVI)</text>
    <text x="708" y="56" class="ed-sans" font-size="11" fill="#57534e">FP8 / INT8 halves KV bytes;</text>
    <text x="708" y="72" class="ed-sans" font-size="11" fill="#57534e">KIVI 2-bit quantizes K per-channel</text>
    <text x="708" y="88" class="ed-sans" font-size="11" fill="#57534e">and V per-token (2.6× peak cut).</text>
  </g>

  <line x1="32" y1="392" x2="948" y2="392" stroke="#e7e2d8"/>
  <text x="32" y="413" class="ed-mono" font-size="10.5" fill="#78716c">Methods 1–3 &amp; 6–8 increase batch concurrency B (throughput); Methods 4–5 bound context footprint T for infinite streaming.</text>
</svg>
