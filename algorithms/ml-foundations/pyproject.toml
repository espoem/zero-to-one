[project]
name = "zero-to-one-ml-foundations"
version = "0.1.0"
description = "Zero-to-One ML Foundations: NumPy internals, scikit-learn pipelines, neural architectures, KV-cache math, quantization, and production drift"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.5", "scipy==1.18.1", "scikit-learn==1.9.1", "pydantic==2.14.4"]

[dependency-groups]
dev = ["mypy>=1.19.0", "pytest>=9.0.0", "ruff>=0.14.0"]

[tool.pytest.ini_options]
testpaths = ["examples/py"]

[tool.mypy]
strict = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
