<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="title desc">
  <title id="title">Insertion Sort CLRS Loop Invariant: Sorted Prefix, Key Extraction, and Rightward Shift</title>
  <desc id="desc">Animated step-by-step visualization of CLRS 1-indexed INSERTION-SORT(A, n) at iteration i = 5, showing the sorted prefix A[1..i-1], key = A[5] = 1 extraction, rightward shifts A[j+1] = A[j], inner invariant A[j+2..i] &gt; key, and final placement at A[1].</desc>
  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    @keyframes f1 { 0%, 22% { opacity: 1; } 25%, 97% { opacity: 0.86; } 100% { opacity: 1; } }
    @keyframes f2 { 0%, 22% { opacity: 0.86; } 25%, 47% { opacity: 1; } 50%, 100% { opacity: 0.86; } }
    @keyframes f3 { 0%, 47% { opacity: 0.86; } 50%, 72% { opacity: 1; } 75%, 100% { opacity: 0.86; } }
    @keyframes f4 { 0%, 72% { opacity: 0.86; } 75%, 97% { opacity: 1; } 100% { opacity: 0.86; } }
    @keyframes keyGlide {
      0%, 22% { transform: translate(0px, 0px); }
      25%, 47% { transform: translate(-180px, 0px); }
      50%, 72% { transform: translate(-360px, 0px); }
      75%, 97% { transform: translate(-360px, 44px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes shiftArrow {
      0% { stroke-dashoffset: 18; }
      100% { stroke-dashoffset: 0; }
    }

    .p1 { animation: f1 12s ease-in-out infinite; }
    .p2 { animation: f2 12s ease-in-out infinite; }
    .p3 { animation: f3 12s ease-in-out infinite; }
    .p4 { animation: f4 12s ease-in-out infinite; }
    .key-box { animation: keyGlide 12s ease-in-out infinite; }
    .shift-arc { stroke-dasharray: 5 3; animation: shiftArrow 1.8s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
      .p1, .p2, .p3, .p4 { opacity: 1 !important; }
      .key-box { transform: none !important; }
    }
  </style>

  <defs>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1200" height="780" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="1200" height="64" rx="12" fill="#0f172a"/>
  <rect x="0" y="48" width="1200" height="16" fill="#0f172a"/>
  <text x="24" y="28" class="sans" font-size="18" font-weight="700" fill="#f8fafc">Insertion Sort Loop Invariant (CLRS 4e §2.1): Outer &amp; Inner Proofs</text>
  <text x="24" y="49" class="sans" font-size="12" fill="#94a3b8">Outer invariant: A[1 : i-1] is sorted permutation · Inner invariant: A[j+2 : i] holds shifted elements &gt; key</text>
  <rect x="944" y="16" width="232" height="32" rx="16" fill="#1e293b" stroke="#334155"/>
  <text x="1060" y="36" class="mono" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">Trace: i = 5, key = A[5] = 1</text>

  <!-- ==================== LEFT: 4-PHASE ANIMATION ==================== -->
  <rect x="20" y="80" width="710" height="584" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="20" y="80" width="710" height="36" rx="10" fill="#f1f5f9"/>
  <rect x="20" y="106" width="710" height="10" fill="#f1f5f9"/>
  <text x="36" y="103" class="sans" font-size="13" font-weight="700" fill="#0f172a">Step-by-Step Invariant Preservation on A[1..6] = [5, 2, 4, 6, 1, 3]</text>

  <!-- Floating Animated Key Indicator at Top -->
  <rect x="36" y="128" width="678" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="52" y="148" class="sans" font-size="11" font-weight="700" fill="#0f172a">Live Key Extraction &amp; Insertion Track (i = 5)</text>
  <text x="698" y="148" class="mono" font-size="10.5" fill="#059669" text-anchor="end">Sorted prefix A[1..4] = [2, 4, 5, 6]</text>

  <!-- Base slots for floating track -->
  <rect x="86" y="176" width="76" height="34" rx="5" fill="#ecfdf5" stroke="#059669"/><text x="124" y="198" class="mono" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">A[1]: 2</text>
  <rect x="176" y="176" width="76" height="34" rx="5" fill="#ecfdf5" stroke="#059669"/><text x="214" y="198" class="mono" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">A[2]: 4</text>
  <rect x="266" y="176" width="76" height="34" rx="5" fill="#ecfdf5" stroke="#059669"/><text x="304" y="198" class="mono" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">A[3]: 5</text>
  <rect x="356" y="176" width="76" height="34" rx="5" fill="#ecfdf5" stroke="#059669"/><text x="394" y="198" class="mono" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">A[4]: 6</text>
  <rect x="446" y="176" width="76" height="34" rx="5" fill="#fffbeb" stroke="#d97706" stroke-dasharray="4 3"/><text x="484" y="198" class="mono" font-size="12" fill="#92400e" text-anchor="middle">hole [5]</text>
  <rect x="536" y="176" width="76" height="34" rx="5" fill="#f1f5f9" stroke="#94a3b8"/><text x="574" y="198" class="mono" font-size="13" fill="#475569" text-anchor="middle">A[6]: 3</text>

  <!-- Animated moving key badge -->
  <g class="key-box">
    <rect x="446" y="132" width="76" height="30" rx="6" fill="#d97706" stroke="#b45309" stroke-width="1.5"/>
    <text x="484" y="151" class="mono" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">key = 1</text>
  </g>

  <!-- Phase 1 -->
  <g class="p1">
    <rect x="36" y="236" width="678" height="96" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="48" y="246" width="144" height="22" rx="4" fill="#2563eb"/>
    <text x="120" y="261" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">1. Extract key = A[5]</text>
    <text x="204" y="261" class="mono" font-size="11" font-weight="700" fill="#1e3a8a">key = 1,  j = i - 1 = 4</text>

    <rect x="48" y="278" width="66" height="34" rx="4" fill="#ecfdf5" stroke="#059669"/><text x="81" y="300" class="mono" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">2</text>
    <rect x="122" y="278" width="66" height="34" rx="4" fill="#ecfdf5" stroke="#059669"/><text x="155" y="300" class="mono" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">4</text>
    <rect x="196" y="278" width="66" height="34" rx="4" fill="#ecfdf5" stroke="#059669"/><text x="229" y="300" class="mono" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">5</text>
    <rect x="270" y="278" width="66" height="34" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="303" y="300" class="mono" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">6 (j=4)</text>
    <rect x="344" y="278" width="66" height="34" rx="4" fill="#fffbeb" stroke="#d97706" stroke-dasharray="4 3"/><text x="377" y="300" class="mono" font-size="12" fill="#b45309" text-anchor="middle">gap</text>
    <rect x="418" y="278" width="66" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="451" y="300" class="mono" font-size="13" fill="#64748b" text-anchor="middle">3</text>
    <text x="500" y="294" class="sans" font-size="10.5" fill="#1e3a8a">A[1..4] sorted.</text>
    <text x="500" y="310" class="mono" font-size="10" fill="#2563eb">A[4]=6 &gt; key(1) ⇒ shift!</text>
  </g>

  <!-- Phase 2 -->
  <g class="p2">
    <rect x="36" y="342" width="678" height="96" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="48" y="352" width="144" height="22" rx="4" fill="#d97706"/>
    <text x="120" y="367" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">2. Shift Right (j=4,3)</text>
    <text x="204" y="367" class="mono" font-size="11" font-weight="700" fill="#92400e">A[5] = 6,  A[4] = 5,  j = 2</text>

    <rect x="48" y="384" width="66" height="34" rx="4" fill="#ecfdf5" stroke="#059669"/><text x="81" y="406" class="mono" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">2</text>
    <rect x="122" y="384" width="66" height="34" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="155" y="406" class="mono" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">4 (j=2)</text>
    <rect x="196" y="384" width="66" height="34" rx="4" fill="#fffbeb" stroke="#d97706" stroke-dasharray="4 3"/><text x="229" y="406" class="mono" font-size="12" fill="#b45309" text-anchor="middle">gap</text>
    <rect x="270" y="384" width="66" height="34" rx="4" fill="#ede9fe" stroke="#7c3aed"/><text x="303" y="406" class="mono" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">5</text>
    <rect x="344" y="384" width="66" height="34" rx="4" fill="#ede9fe" stroke="#7c3aed"/><text x="377" y="406" class="mono" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">6</text>
    <rect x="418" y="384" width="66" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="451" y="406" class="mono" font-size="13" fill="#64748b" text-anchor="middle">3</text>
    <path d="M 244 382 Q 266 368 288 382" fill="none" stroke="#d97706" stroke-width="1.8" class="shift-arc" marker-end="url(#arr-amber)"/>
    <text x="500" y="400" class="mono" font-size="10" font-weight="700" fill="#5b21b6">Inner inv: A[4..5] &gt; key</text>
    <text x="500" y="416" class="sans" font-size="10" fill="#475569">[5, 6] shifted right intact</text>
  </g>

  <!-- Phase 3 -->
  <g class="p3">
    <rect x="36" y="448" width="678" height="96" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="48" y="458" width="144" height="22" rx="4" fill="#7c3aed"/>
    <text x="120" y="473" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">3. Shift Right (j=2,1)</text>
    <text x="204" y="473" class="mono" font-size="11" font-weight="700" fill="#5b21b6">A[3] = 4,  A[2] = 2,  j = 0 (loop stops)</text>

    <rect x="48" y="490" width="66" height="34" rx="4" fill="#fffbeb" stroke="#d97706" stroke-dasharray="4 3"/><text x="81" y="512" class="mono" font-size="12" fill="#b45309" text-anchor="middle">gap</text>
    <rect x="122" y="490" width="66" height="34" rx="4" fill="#ede9fe" stroke="#7c3aed"/><text x="155" y="512" class="mono" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">2</text>
    <rect x="196" y="490" width="66" height="34" rx="4" fill="#ede9fe" stroke="#7c3aed"/><text x="229" y="512" class="mono" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">4</text>
    <rect x="270" y="490" width="66" height="34" rx="4" fill="#ede9fe" stroke="#7c3aed"/><text x="303" y="512" class="mono" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">5</text>
    <rect x="344" y="490" width="66" height="34" rx="4" fill="#ede9fe" stroke="#7c3aed"/><text x="377" y="512" class="mono" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">6</text>
    <rect x="418" y="490" width="66" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="451" y="512" class="mono" font-size="13" fill="#64748b" text-anchor="middle">3</text>
    <text x="500" y="506" class="mono" font-size="10" font-weight="700" fill="#5b21b6">j == 0 exits while loop</text>
    <text x="500" y="522" class="sans" font-size="10" fill="#475569">A[2..5] = [2,4,5,6] &gt; key</text>
  </g>

  <!-- Phase 4 -->
  <g class="p4">
    <rect x="36" y="554" width="678" height="96" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <rect x="48" y="564" width="144" height="22" rx="4" fill="#059669"/>
    <text x="120" y="579" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">4. Write A[j+1] = key</text>
    <text x="204" y="579" class="mono" font-size="11" font-weight="700" fill="#065f46">A[1] = 1  ⇒  A[1..5] sorted!</text>

    <rect x="48" y="596" width="66" height="34" rx="4" fill="#059669"/><text x="81" y="618" class="mono" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1 ★</text>
    <rect x="122" y="596" width="66" height="34" rx="4" fill="#ecfdf5" stroke="#059669"/><text x="155" y="618" class="mono" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">2</text>
    <rect x="196" y="596" width="66" height="34" rx="4" fill="#ecfdf5" stroke="#059669"/><text x="229" y="618" class="mono" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">4</text>
    <rect x="270" y="596" width="66" height="34" rx="4" fill="#ecfdf5" stroke="#059669"/><text x="303" y="618" class="mono" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">5</text>
    <rect x="344" y="596" width="66" height="34" rx="4" fill="#ecfdf5" stroke="#059669"/><text x="377" y="618" class="mono" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">6</text>
    <rect x="418" y="596" width="66" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="451" y="618" class="mono" font-size="13" fill="#64748b" text-anchor="middle">3</text>
    <text x="500" y="612" class="mono" font-size="10" font-weight="700" fill="#065f46">Outer invariant restored</text>
    <text x="500" y="628" class="sans" font-size="10" fill="#047857">Next iteration: i = 6 (n+1 halts)</text>
  </g>

  <!-- ==================== RIGHT: CLRS PSEUDOCODE + PROOF ==================== -->
  <rect x="746" y="80" width="434" height="584" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="746" y="80" width="434" height="36" rx="10" fill="#0f172a"/>
  <rect x="746" y="106" width="434" height="10" fill="#0f172a"/>
  <text x="762" y="103" class="sans" font-size="13" font-weight="700" fill="#f8fafc">CLRS Pseudocode &amp; Formal Proof</text>

  <rect x="762" y="130" width="402" height="218" rx="8" fill="#0f172a"/>
  <text x="776" y="152" class="mono" font-size="11" font-weight="700" fill="#38bdf8">INSERTION-SORT(A, n)</text>
  <text x="776" y="174" class="mono" font-size="10.5" fill="#e2e8f0">1  for i = 2 to n</text>
  <text x="776" y="196" class="mono" font-size="10.5" fill="#fbbf24">2      key = A[i]</text>
  <text x="776" y="218" class="mono" font-size="10.5" fill="#94a3b8">3      // insert into sorted A[1 : i-1]</text>
  <text x="776" y="240" class="mono" font-size="10.5" fill="#e2e8f0">4      j = i - 1</text>
  <text x="776" y="262" class="mono" font-size="10.5" fill="#c084fc">5      while j &gt; 0 and A[j] &gt; key</text>
  <text x="776" y="284" class="mono" font-size="10.5" fill="#c084fc">6          A[j+1] = A[j]</text>
  <text x="776" y="306" class="mono" font-size="10.5" fill="#c084fc">7          j = j - 1</text>
  <text x="776" y="328" class="mono" font-size="10.5" fill="#34d399">8      A[j+1] = key</text>

  <rect x="762" y="362" width="402" height="142" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="776" y="384" class="sans" font-size="11.5" font-weight="700" fill="#0f172a">3-Part Induction Verification</text>
  <text x="776" y="406" class="sans" font-size="10.5" fill="#1e3a8a"><tspan font-weight="700">1. Init (i=2):</tspan> A[1:1] has 1 item, trivially sorted.</text>
  <text x="776" y="428" class="sans" font-size="10.5" fill="#5b21b6"><tspan font-weight="700">2. Maint:</tspan> Inner loop preserves A[j+2:i] &gt; key;</text>
  <text x="776" y="446" class="sans" font-size="10.5" fill="#5b21b6">   stops when j=0 or A[j] ≤ key ⇒ A[1:i] sorted.</text>
  <text x="776" y="468" class="sans" font-size="10.5" fill="#065f46"><tspan font-weight="700">3. Term (i=n+1):</tspan> A[1:n] is sorted original multiset.</text>
  <text x="776" y="492" class="mono" font-size="10" fill="#be123c">Pitfall: A[j] &gt;= key breaks stability on equal keys!</text>

  <rect x="762" y="518" width="402" height="132" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="776" y="540" class="sans" font-size="11.5" font-weight="700" fill="#92400e">Exact Comparison Counts &amp; Hybrid Role</text>
  <text x="776" y="562" class="mono" font-size="10.5" fill="#065f46">• Best case (sorted):       n - 1  = Θ(n)</text>
  <text x="776" y="582" class="mono" font-size="10.5" fill="#be123c">• Worst case (decreasing): n(n-1)/2 = Θ(n^2)</text>
  <text x="776" y="602" class="mono" font-size="10.5" fill="#1e3a8a">• Small-n cache winner:    n ≤ 16..64</text>
  <text x="776" y="626" class="sans" font-size="10" fill="#475569">Used as base-case sorter inside Introsort &amp; TimSort.</text>

  <!-- Bottom Summary Banner -->
  <rect x="20" y="678" width="1160" height="82" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="36" y="704" class="sans" font-size="12" font-weight="700" fill="#0f172a">Executable Proof Strategy (Module 01 §9):</text>
  <text x="36" y="726" class="sans" font-size="11" fill="#334155">Asserting sorted(A[0..i-1]) AND multisetEqual(A[0..i-1], orig[0..i-1]) inside every outer iteration turns the paper loop-invariant proof into a deterministic regression test.</text>
  <text x="36" y="746" class="mono" font-size="10.5" fill="#059669">In-place O(1) auxiliary space · Strictly stable (&gt; not &gt;=) · Adaptive O(n + inversions) runtime on nearly sorted inputs.</text>
</svg>
