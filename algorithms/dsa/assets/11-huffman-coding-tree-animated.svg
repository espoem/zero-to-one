<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 650" width="1160" height="650" role="img" aria-labelledby="title desc">
  <title id="title">Huffman Coding: Min-Heap Merge &amp; Prefix-Free Binary Tree</title>
  <desc id="desc">Left panel animates the Min-Priority Queue extracting the two smallest frequency nodes, merging them into parent f1 + f2, and pushing back across 3 rounds on alphabet {D:5, C:9, B:12, A:45}. Right panel animates bottom-up Huffman tree assembly and 0/1 edge labeling yielding prefix-free codes A=1, B=00, D=010, C=011.</desc>
  <style><![CDATA[
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* 10s 4-phase animation */
    @keyframes h1 { 0%, 24% { opacity: 1; } 25%, 100% { opacity: 0.86; } }
    @keyframes h2 { 0%, 24% { opacity: 0.86; } 25%, 49% { opacity: 1; } 50%, 100% { opacity: 0.86; } }
    @keyframes h3 { 0%, 49% { opacity: 0.86; } 50%, 74% { opacity: 1; } 75%, 100% { opacity: 0.86; } }
    @keyframes h4 { 0%, 74% { opacity: 0.86; } 75%, 100% { opacity: 1; } }

    @keyframes build1 { 0%, 22% { opacity: 0.86; } 25%, 100% { opacity: 1; } }
    @keyframes build2 { 0%, 47% { opacity: 0.86; } 50%, 100% { opacity: 1; } }
    @keyframes build3 { 0%, 72% { opacity: 0.86; } 75%, 100% { opacity: 1; } }

    .hs1 { animation: h1 10s infinite; }
    .hs2 { animation: h2 10s infinite; }
    .hs3 { animation: h3 10s infinite; }
    .hs4 { animation: h4 10s infinite; }
    .tb1 { animation: build1 10s infinite; }
    .tb2 { animation: build2 10s infinite; }
    .tb3 { animation: build3 10s infinite; }

    @media (prefers-reduced-motion: reduce) {
      .hs1, .hs2, .hs3, .hs4, .tb1, .tb2, .tb3 {
        animation: none !important;
        opacity: 1 !important;
      }
    }
  ]]></style>

  <!-- Canvas & Header -->
  <rect x="0" y="0" width="1160" height="650" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>
  <line x1="24" y1="62" x2="1136" y2="62" stroke="#1c1917" stroke-width="1.2"/>
  
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#1c1917" font-family="Georgia, 'Times New Roman', serif">Huffman Coding: Min-Heap Merge &amp; Optimal Prefix-Free Binary Tree</text>
  <text x="24" y="47" class="sans" font-size="12" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">Pop two minimum-weight nodes L, R; merge into parent wt(L) + wt(R); push back until 1 root remains; label edges 0 / 1</text>

  <!-- LEFT PANEL: Min-Heap Priority Queue Steps -->
  <rect x="20" y="76" width="446" height="486" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.2"/>
  <text x="38" y="100" class="sans" font-size="14" font-weight="700" fill="#1c1917">1. Min-Heap Priority Queue Trace</text>
  <text x="38" y="118" class="sans" font-size="11" fill="#44403c">Alphabet frequencies: {D:5, C:9, B:12, A:45} (Total = 71)</text>

  <!-- Round 0: Initial Heap -->
  <g class="hs1">
    <rect x="38" y="132" width="410" height="82" rx="8" fill="#faf8f5" stroke="#0f766e" stroke-width="1.5"/>
    <text x="52" y="152" class="sans" font-size="11.5" font-weight="700" fill="#065f46">Initial Min-Heap -&gt; Pop 2 Smallest (D:5, C:9)</text>
    <rect x="52" y="164" width="76" height="34" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="90" y="185" class="mono" font-size="12" font-weight="700" text-anchor="middle" fill="#991b1b">D:5</text>
    <rect x="138" y="164" width="76" height="34" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="176" y="185" class="mono" font-size="12" font-weight="700" text-anchor="middle" fill="#991b1b">C:9</text>
    <rect x="224" y="164" width="76" height="34" rx="6" fill="#f0fdf9" stroke="#99f6e4"/><text x="262" y="185" class="mono" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">B:12</text>
    <rect x="310" y="164" width="76" height="34" rx="6" fill="#f0fdf9" stroke="#99f6e4"/><text x="348" y="185" class="mono" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">A:45</text>
  </g>

  <!-- Round 1: Merge 5+9=14 -->
  <g class="hs2">
    <rect x="38" y="226" width="410" height="82" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
    <text x="52" y="246" class="sans" font-size="11.5" font-weight="700" fill="#92400e">Merge 1: Push N1 = 5 + 9 = 14 -&gt; Pop (B:12, N1:14)</text>
    <rect x="52" y="258" width="84" height="34" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="94" y="279" class="mono" font-size="12" font-weight="700" text-anchor="middle" fill="#991b1b">B:12</text>
    <rect x="148" y="258" width="96" height="34" rx="6" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.8"/><text x="196" y="279" class="mono" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">N1:14</text>
    <rect x="256" y="258" width="84" height="34" rx="6" fill="#f0fdf9" stroke="#99f6e4"/><text x="298" y="279" class="mono" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">A:45</text>
  </g>

  <!-- Round 2: Merge 12+14=26 -->
  <g class="hs3">
    <rect x="38" y="320" width="410" height="82" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
    <text x="52" y="340" class="sans" font-size="11.5" font-weight="700" fill="#92400e">Merge 2: Push N2 = 12 + 14 = 26 -&gt; Pop (N2:26, A:45)</text>
    <rect x="52" y="352" width="110" height="34" rx="6" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.8"/><text x="107" y="373" class="mono" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">N2:26</text>
    <rect x="176" y="352" width="110" height="34" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="231" y="373" class="mono" font-size="12" font-weight="700" text-anchor="middle" fill="#991b1b">A:45</text>
  </g>

  <!-- Round 3: Root 71 -->
  <g class="hs4">
    <rect x="38" y="414" width="410" height="82" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="2"/>
    <text x="52" y="434" class="sans" font-size="11.5" font-weight="700" fill="#065f46">Merge 3: Push Root = 26 + 45 = 71 (1 Root Remains!)</text>
    <rect x="52" y="446" width="160" height="34" rx="6" fill="#0f766e"/><text x="132" y="467" class="mono" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ffffff">Root : 71 (Done)</text>
  </g>

  <text x="38" y="524" class="sans" font-size="11" font-weight="700" fill="#065f46">CLRS Lemma 16.2-16.3: B(T) = B(T') + f(x) + f(y)</text>
  <text x="38" y="544" class="sans" font-size="10.2" fill="#44403c">Lowest frequencies sink to max depth; highest frequency (A:45) stays at depth 1.</text>

  <!-- RIGHT PANEL: Tree Construction & Prefix-Free Code Table -->
  <rect x="484" y="76" width="656" height="486" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.2"/>
  <text x="502" y="100" class="sans" font-size="14" font-weight="700" fill="#1c1917">2. Binary Huffman Tree &amp; Prefix-Free Binary Codewords</text>

  <!-- Tree Edges (drawn bottom-up) -->
  <!-- Merge 3: Root(790, 152) -> N2(680, 232) [0] and A(910, 232) [1] -->
  <g class="tb3">
    <line x1="790" y1="152" x2="680" y2="232" stroke="#0f766e" stroke-width="2.5"/>
    <rect x="716" y="176" width="22" height="20" rx="4" fill="#f0fdf9" stroke="#0f766e"/><text x="727" y="190" class="mono" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">0</text>

    <line x1="790" y1="152" x2="910" y2="232" stroke="#0f766e" stroke-width="2.5"/>
    <rect x="844" y="176" width="22" height="20" rx="4" fill="#f5f1e8" stroke="#0f766e"/><text x="855" y="190" class="mono" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">1</text>

    <circle cx="790" cy="152" r="24" fill="#0f766e"/><text x="790" y="157" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">71</text>
  </g>

  <!-- Leaf A:45 -->
  <rect x="872" y="214" width="76" height="40" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="2"/>
  <text x="910" y="239" class="mono" font-size="13" font-weight="700" text-anchor="middle" fill="#065f46">A : 45</text>

  <!-- Merge 2: N2(680, 232) -> B(585, 316) [0] and N1(775, 316) [1] -->
  <g class="tb2">
    <line x1="680" y1="232" x2="585" y2="316" stroke="#0f766e" stroke-width="2.5"/>
    <rect x="612" y="258" width="22" height="20" rx="4" fill="#f0fdf9" stroke="#0f766e"/><text x="623" y="272" class="mono" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">0</text>

    <line x1="680" y1="232" x2="775" y2="316" stroke="#0f766e" stroke-width="2.5"/>
    <rect x="724" y="258" width="22" height="20" rx="4" fill="#f5f1e8" stroke="#0f766e"/><text x="735" y="272" class="mono" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">1</text>

    <circle cx="680" cy="232" r="22" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="680" y="237" class="mono" font-size="13" font-weight="700" text-anchor="middle" fill="#92400e">26</text>
  </g>

  <!-- Leaf B:12 -->
  <rect x="547" y="298" width="76" height="40" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.8"/>
  <text x="585" y="323" class="mono" font-size="13" font-weight="700" text-anchor="middle" fill="#065f46">B : 12</text>

  <!-- Merge 1: N1(775, 316) -> D(705, 404) [0] and C(845, 404) [1] -->
  <g class="tb1">
    <line x1="775" y1="316" x2="705" y2="404" stroke="#0f766e" stroke-width="2.5"/>
    <rect x="718" y="346" width="22" height="20" rx="4" fill="#f0fdf9" stroke="#0f766e"/><text x="729" y="360" class="mono" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">0</text>

    <line x1="775" y1="316" x2="845" y2="404" stroke="#0f766e" stroke-width="2.5"/>
    <rect x="810" y="346" width="22" height="20" rx="4" fill="#f5f1e8" stroke="#0f766e"/><text x="821" y="360" class="mono" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">1</text>

    <circle cx="775" cy="316" r="22" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="775" y="321" class="mono" font-size="13" font-weight="700" text-anchor="middle" fill="#92400e">14</text>
  </g>

  <!-- Leaves D:5 & C:9 -->
  <rect x="667" y="388" width="76" height="40" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.8"/>
  <text x="705" y="413" class="mono" font-size="13" font-weight="700" text-anchor="middle" fill="#065f46">D : 5</text>
  <rect x="807" y="388" width="76" height="40" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.8"/>
  <text x="845" y="413" class="mono" font-size="13" font-weight="700" text-anchor="middle" fill="#065f46">C : 9</text>

  <!-- Prefix-Free Code Table -->
  <rect x="502" y="446" width="620" height="98" rx="8" fill="#faf8f5" stroke="#d6d0c4"/>
  <text x="518" y="468" class="sans" font-size="12" font-weight="700" fill="#1c1917">Prefix-Free Codewords (Zero Ambiguity Without Delimiters):</text>
  <rect x="518" y="480" width="136" height="34" rx="6" fill="#f0fdf9" stroke="#99f6e4"/><text x="586" y="502" class="mono" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">A (45) -&gt; 1</text>
  <rect x="666" y="480" width="136" height="34" rx="6" fill="#f0fdf9" stroke="#99f6e4"/><text x="734" y="502" class="mono" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">B (12) -&gt; 00</text>
  <rect x="814" y="480" width="144" height="34" rx="6" fill="#f5f1e8" stroke="#d6d0c4"/><text x="886" y="502" class="mono" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">D (5) -&gt; 010</text>
  <rect x="970" y="480" width="138" height="34" rx="6" fill="#f5f1e8" stroke="#d6d0c4"/><text x="1039" y="502" class="mono" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">C (9) -&gt; 011</text>
  <text x="518" y="534" class="sans" font-size="11" fill="#44403c">Only leaves hold characters (full binary tree); thus no codeword can ever be a prefix of another.</text>

  <!-- Footer -->
  <rect x="20" y="576" width="1120" height="58" rx="10" fill="#f5f1e8" stroke="#d6d0c4"/>
  <text x="38" y="600" class="mono" font-size="11.5" font-weight="700" fill="#1c1917">Total Cost = 45*1 + 12*2 + 5*3 + 9*3 = 111 bits  (vs 71 * 2 = 142 fixed-width bits -&gt; 21.8% savings)</text>
  <text x="38" y="620" class="sans" font-size="11" fill="#44403c">Time Complexity: O(n log n) with binary min-heap (or O(n) if frequencies are pre-sorted using two queues).</text>
</svg>
