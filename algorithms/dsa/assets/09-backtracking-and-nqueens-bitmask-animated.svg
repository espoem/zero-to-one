<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 660" width="1160" height="660" role="img" aria-labelledby="title desc">
  <title id="title">Universal Backtracking Tree &amp; N-Queens O(1) Bitmask Pruning</title>
  <desc id="desc">Left panel animates the symmetrical Choose, Explore, Prune/Backtrack, and Unchoose cycle in a backtracking state-space tree with deep-copy recording. Right panel animates 4-Queens placement using O(1) bitwise masks cols, diag1, and diag2 to compute available = ~(cols | diag1 | diag2) &amp; ((1 &lt;&lt; N) - 1).</desc>
  <style><![CDATA[
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* 10s 5-phase cycle */
    @keyframes bt1 { 0%, 19% { opacity: 1; } 20%, 100% { opacity: 0; } }
    @keyframes bt2 { 0%, 19% { opacity: 0; } 20%, 39% { opacity: 1; } 40%, 100% { opacity: 0; } }
    @keyframes bt3 { 0%, 39% { opacity: 0; } 40%, 59% { opacity: 1; } 60%, 100% { opacity: 0; } }
    @keyframes bt4 { 0%, 59% { opacity: 0; } 60%, 79% { opacity: 1; } 80%, 100% { opacity: 0; } }
    @keyframes bt5 { 0%, 79% { opacity: 0; } 80%, 100% { opacity: 1; } }

    @keyframes dfsDot {
      0%, 19%   { transform: translate(290px, 178px); }
      20%, 39%  { transform: translate(165px, 266px); }
      40%, 59%  { transform: translate(105px, 362px); }
      60%, 79%  { transform: translate(225px, 362px); }
      80%, 100% { transform: translate(415px, 266px); }
    }

    @keyframes qRow2 { 0%, 39% { opacity: 0; } 40%, 100% { opacity: 1; } }
    @keyframes qRow3 { 0%, 79% { opacity: 0; } 80%, 100% { opacity: 1; } }

    .bt1 { animation: bt1 10s infinite; }
    .bt2 { animation: bt2 10s infinite; }
    .bt3 { animation: bt3 10s infinite; }
    .bt4 { animation: bt4 10s infinite; }
    .bt5 { animation: bt5 10s infinite; }
    .dfs-dot { animation: dfsDot 10s infinite; }
    .q-r2 { animation: qRow2 10s infinite; }
    .q-r3 { animation: qRow3 10s infinite; }

    @media (prefers-reduced-motion: reduce) {
      .bt1, .bt2, .bt3, .bt4, .dfs-dot {
        animation: none !important;
        opacity: 0 !important;
      }
      .bt5, .q-r2, .q-r3 {
        animation: none !important;
        opacity: 1 !important;
      }
    }
  ]]></style>

  <!-- Canvas & Header -->
  <rect x="0" y="0" width="1160" height="660" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>
  <line x1="24" y1="62" x2="1136" y2="62" stroke="#1c1917" stroke-width="1.2"/>
  
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#1c1917" font-family="Georgia, 'Times New Roman', serif">Universal Backtracking Tree &amp; N-Queens O(1) Bitmask Pruning</text>
  <text x="24" y="47" class="sans" font-size="12" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">Symmetrical Choose -&gt; Explore -&gt; Unchoose invariant paired with bitwise column/diagonal conflict elimination</text>

  <!-- LEFT PANEL: Universal Backtracking Decision Tree -->
  <rect x="20" y="76" width="548" height="492" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.2"/>
  <text x="38" y="100" class="sans" font-size="14" font-weight="700" fill="#1c1917">1. Universal State-Space Tree (Choose -&gt; Explore -&gt; Unchoose)</text>

  <!-- Step Banner -->
  <g class="bt1"><rect x="38" y="112" width="512" height="28" rx="6" fill="#f0fdf9" stroke="#99f6e4"/><text x="50" y="130" class="mono" font-size="11.5" font-weight="700" fill="#065f46">1. ROOT path=[] -&gt; iterate candidate choices for Row 0</text></g>
  <g class="bt2"><rect x="38" y="112" width="512" height="28" rx="6" fill="#f0fdf9" stroke="#99f6e4"/><text x="50" y="130" class="mono" font-size="11.5" font-weight="700" fill="#065f46">2. CHOOSE c=1 (path=[1]) -&gt; EXPLORE backtrack(row=1)</text></g>
  <g class="bt3"><rect x="38" y="112" width="512" height="28" rx="6" fill="#fef2f2" stroke="#fda4af"/><text x="50" y="130" class="mono" font-size="11.5" font-weight="700" fill="#991b1b">3. PRUNE! c=0/1/2 conflict at row 1 -&gt; skip subtree in O(1)</text></g>
  <g class="bt4"><rect x="38" y="112" width="512" height="28" rx="6" fill="#f0fdf9" stroke="#99f6e4"/><text x="50" y="130" class="mono" font-size="11.5" font-weight="700" fill="#065f46">4. CHOOSE c=3 -&gt; EXPLORE -&gt; GOAL! result.push([...path])</text></g>
  <g class="bt5"><rect x="38" y="112" width="512" height="28" rx="6" fill="#fffbeb" stroke="#fde68a"/><text x="50" y="130" class="mono" font-size="11.5" font-weight="700" fill="#92400e">5. UNCHOOSE path.pop() -&gt; revert state cleanly, explore c=2</text></g>

  <!-- Tree Edges -->
  <line x1="290" y1="196" x2="165" y2="250" stroke="#0f766e" stroke-width="2.5"/>
  <line x1="290" y1="196" x2="415" y2="250" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="165" y1="286" x2="105" y2="346" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="165" y1="286" x2="225" y2="346" stroke="#0f766e" stroke-width="2.5"/>
  <line x1="225" y1="382" x2="225" y2="432" stroke="#0f766e" stroke-width="2.5"/>
  <line x1="415" y1="286" x2="365" y2="346" stroke="#d6d0c4" stroke-width="1.8"/>
  <line x1="415" y1="286" x2="465" y2="346" stroke="#d6d0c4" stroke-width="1.8"/>

  <!-- Tree Nodes -->
  <rect x="232" y="158" width="116" height="40" rx="8" fill="#faf8f5" stroke="#44403c" stroke-width="1.8"/>
  <text x="290" y="176" class="mono" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1c1917">path = []</text>
  <text x="290" y="191" class="sans" font-size="10" text-anchor="middle" fill="#57534e">row = 0</text>

  <rect x="108" y="248" width="114" height="38" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="2"/>
  <text x="165" y="265" class="mono" font-size="11.5" font-weight="700" text-anchor="middle" fill="#065f46">[1]</text>
  <text x="165" y="280" class="sans" font-size="10" text-anchor="middle" fill="#0f766e">CHOOSE c=1</text>

  <rect x="358" y="248" width="114" height="38" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="415" y="265" class="mono" font-size="11.5" font-weight="700" text-anchor="middle" fill="#92400e">[2]</text>
  <text x="415" y="280" class="sans" font-size="10" text-anchor="middle" fill="#92400e">after UNCHOOSE</text>

  <rect x="44" y="344" width="122" height="38" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="105" y="361" class="mono" font-size="11" font-weight="700" text-anchor="middle" fill="#991b1b">[1, 0..2]</text>
  <text x="105" y="376" class="sans" font-size="10" font-weight="700" text-anchor="middle" fill="#dc2626">PRUNED (attack)</text>

  <rect x="176" y="344" width="98" height="38" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="2"/>
  <text x="225" y="361" class="mono" font-size="11" font-weight="700" text-anchor="middle" fill="#065f46">[1, 3]</text>
  <text x="225" y="376" class="sans" font-size="10" text-anchor="middle" fill="#0f766e">EXPLORE r=2</text>

  <rect x="148" y="432" width="154" height="36" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="2"/>
  <text x="225" y="454" class="mono" font-size="11" font-weight="700" text-anchor="middle" fill="#065f46">GOAL: [1, 3, 0, 2]</text>

  <rect x="330" y="344" width="70" height="34" rx="6" fill="#f5f1e8" stroke="#d6d0c4"/><text x="365" y="365" class="mono" font-size="10.5" text-anchor="middle" fill="#57534e">[2, 0]</text>
  <rect x="430" y="344" width="70" height="34" rx="6" fill="#f5f1e8" stroke="#d6d0c4"/><text x="465" y="365" class="mono" font-size="10.5" text-anchor="middle" fill="#57534e">[2, ...]</text>

  <!-- Animated DFS Focus Ring -->
  <circle cx="0" cy="0" r="14" fill="none" stroke="#0f766e" stroke-width="3" class="dfs-dot"/>

  <!-- Deep Copy Invariant Box -->
  <rect x="38" y="484" width="512" height="68" rx="8" fill="#f5f1e8" stroke="#d6d0c4"/>
  <text x="52" y="505" class="sans" font-size="12" font-weight="700" fill="#065f46">Critical Invariant: Snapshot Deep Copy Before Unchoose</text>
  <text x="52" y="524" class="mono" font-size="11" fill="#44403c">result.push([...path]); // NOT result.push(path)</text>
  <text x="52" y="542" class="sans" font-size="11" fill="#44403c">Because path is mutated in-place (push/pop), omitting a copy leaves all entries empty [].</text>

  <!-- RIGHT PANEL: N-Queens O(1) Bitmask Pruning -->
  <rect x="592" y="76" width="548" height="492" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.2"/>
  <text x="610" y="100" class="sans" font-size="14" font-weight="700" fill="#1c1917">2. N-Queens O(1) Bitmask Pruning (N = 4, evaluating Row r = 2)</text>
  <text x="610" y="118" class="sans" font-size="11.5" fill="#44403c">Queens at (0, 1) and (1, 3) project column, major (\), and minor (/) attack bits</text>

  <!-- 4x4 Chessboard (each cell 52x52 -> 208x208 at x=620, y=144) -->
  <text x="646" y="138" class="mono" font-size="11" font-weight="700" text-anchor="middle" fill="#44403c">c=0</text>
  <text x="698" y="138" class="mono" font-size="11" font-weight="700" text-anchor="middle" fill="#44403c">c=1</text>
  <text x="750" y="138" class="mono" font-size="11" font-weight="700" text-anchor="middle" fill="#44403c">c=2</text>
  <text x="802" y="138" class="mono" font-size="11" font-weight="700" text-anchor="middle" fill="#44403c">c=3</text>

  <text x="612" y="174" class="mono" font-size="11" font-weight="700" text-anchor="end" fill="#44403c">r0</text>
  <text x="612" y="226" class="mono" font-size="11" font-weight="700" text-anchor="end" fill="#44403c">r1</text>
  <text x="612" y="278" class="mono" font-size="11" font-weight="700" text-anchor="end" fill="#065f46">r2</text>
  <text x="612" y="330" class="mono" font-size="11" font-weight="700" text-anchor="end" fill="#44403c">r3</text>

  <!-- Row 0 -->
  <rect x="620" y="144" width="52" height="52" fill="#faf8f5" stroke="#d6d0c4"/>
  <rect x="672" y="144" width="52" height="52" fill="#f0fdf9" stroke="#0f766e" stroke-width="2"/>
  <text x="698" y="177" class="sans" font-size="22" font-weight="700" text-anchor="middle" fill="#065f46">Q</text>
  <rect x="724" y="144" width="52" height="52" fill="#faf8f5" stroke="#d6d0c4"/>
  <rect x="776" y="144" width="52" height="52" fill="#e7e2d8" stroke="#d6d0c4"/>

  <!-- Row 1 -->
  <rect x="620" y="196" width="52" height="52" fill="#e7e2d8" stroke="#d6d0c4"/>
  <rect x="672" y="196" width="52" height="52" fill="#f0fdf9" stroke="#99f6e4"/>
  <rect x="724" y="196" width="52" height="52" fill="#fffbeb" stroke="#fde68a"/>
  <rect x="776" y="196" width="52" height="52" fill="#f0fdf9" stroke="#0f766e" stroke-width="2"/>
  <text x="802" y="229" class="sans" font-size="22" font-weight="700" text-anchor="middle" fill="#065f46">Q</text>

  <!-- Row 2 (Active Target Row!) -->
  <rect x="620" y="248" width="52" height="52" fill="#f0fdf9" stroke="#0f766e" stroke-width="2.5"/>
  <text x="646" y="280" class="sans q-r2" font-size="22" font-weight="700" text-anchor="middle" fill="#065f46">Q</text>
  <rect x="672" y="248" width="52" height="52" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.5"/>
  <text x="698" y="278" class="mono" font-size="11" font-weight="700" text-anchor="middle" fill="#065f46">col</text>
  <rect x="724" y="248" width="52" height="52" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="750" y="278" class="mono" font-size="11" font-weight="700" text-anchor="middle" fill="#991b1b">d2 /</text>
  <rect x="776" y="248" width="52" height="52" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="802" y="278" class="mono" font-size="10.5" font-weight="700" text-anchor="middle" fill="#92400e">col+d1</text>

  <!-- Row 3 -->
  <rect x="620" y="300" width="52" height="52" fill="#e7e2d8" stroke="#d6d0c4"/>
  <rect x="672" y="300" width="52" height="52" fill="#faf8f5" stroke="#d6d0c4"/>
  <rect x="724" y="300" width="52" height="52" fill="#f0fdf9" stroke="#0f766e" stroke-width="2"/>
  <text x="750" y="333" class="sans q-r3" font-size="22" font-weight="700" text-anchor="middle" fill="#065f46">Q</text>
  <rect x="776" y="300" width="52" height="52" fill="#faf8f5" stroke="#d6d0c4"/>

  <!-- Diagonal Attack Rays -->
  <line x1="698" y1="170" x2="698" y2="274" stroke="#0f766e" stroke-width="2" stroke-dasharray="4 3" opacity="0.7"/>
  <line x1="698" y1="170" x2="802" y2="274" stroke="#b45309" stroke-width="2" stroke-dasharray="4 3" opacity="0.8"/>
  <line x1="802" y1="222" x2="750" y2="274" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3" opacity="0.8"/>
  <line x1="802" y1="222" x2="802" y2="274" stroke="#0f766e" stroke-width="2" stroke-dasharray="4 3" opacity="0.7"/>

  <!-- Bitwise Constraint Registers (right of board) -->
  <rect x="844" y="144" width="278" height="208" rx="8" fill="#faf8f5" stroke="#d6d0c4"/>
  <text x="858" y="166" class="sans" font-size="12" font-weight="700" fill="#1c1917">Bitmask Registers at Row r = 2</text>
  <text x="858" y="184" class="mono" font-size="10.5" fill="#57534e">bit order: [c=0  c=1  c=2  c=3]</text>

  <rect x="858" y="196" width="250" height="28" rx="5" fill="#f0fdf9" stroke="#99f6e4"/>
  <text x="868" y="214" class="mono" font-size="11.5" font-weight="700" fill="#065f46">cols  = 0  1  0  1  (c=1,3)</text>

  <rect x="858" y="230" width="250" height="28" rx="5" fill="#fffbeb" stroke="#fde68a"/>
  <text x="868" y="248" class="mono" font-size="11.5" font-weight="700" fill="#92400e">diag1 = 0  0  0  1  (\ r-c+N)</text>

  <rect x="858" y="264" width="250" height="28" rx="5" fill="#fef2f2" stroke="#fda4af"/>
  <text x="868" y="282" class="mono" font-size="11.5" font-weight="700" fill="#991b1b">diag2 = 0  0  1  0  (/ r+c)</text>

  <rect x="858" y="302" width="250" height="36" rx="6" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.5"/>
  <text x="868" y="324" class="mono" font-size="11.5" font-weight="700" fill="#065f46">avail = 1  0  0  0  -&gt; ONLY c=0!</text>

  <!-- Formula & LSB Extraction Box -->
  <rect x="610" y="368" width="512" height="184" rx="8" fill="#faf8f5" stroke="#d6d0c4"/>
  <text x="626" y="392" class="sans" font-size="12.5" font-weight="700" fill="#1c1917">O(1) Bitwise Transition (Zero Board Scanning)</text>
  <rect x="626" y="404" width="480" height="30" rx="6" fill="#1c1917"/>
  <text x="638" y="423" class="mono" font-size="11.5" font-weight="700" fill="#ffffff">available = ~(cols | diag1 | diag2) &amp; ((1 &lt;&lt; N) - 1)</text>
  <text x="626" y="454" class="mono" font-size="11" fill="#44403c">while (available) {</text>
  <text x="626" y="472" class="mono" font-size="11" fill="#065f46">  bit = available &amp; -available;      // extract lowest set bit</text>
  <text x="626" y="490" class="mono" font-size="11" fill="#065f46">  dfs(cols | bit, (diag1 | bit) &lt;&lt; 1, (diag2 | bit) &gt;&gt; 1);</text>
  <text x="626" y="508" class="mono" font-size="11" fill="#92400e">  available ^= bit;                  // clear tried bit (unchoose)</text>
  <text x="626" y="526" class="mono" font-size="11" fill="#44403c">}</text>
  <text x="626" y="544" class="sans" font-size="11" font-weight="700" fill="#065f46">Result: prunes &gt;99% of the N! search tree in single-cycle CPU ops.</text>

  <!-- Footer -->
  <rect x="20" y="582" width="1120" height="60" rx="10" fill="#f5f1e8" stroke="#d6d0c4"/>
  <text x="38" y="606" class="sans" font-size="11.5" font-weight="700" fill="#1c1917">Backtracking Complexities:</text>
  <text x="210" y="606" class="sans" font-size="11.5" fill="#44403c">Subsets: Theta(2^n) | Combinations C(n, k): Theta(n!/(k!(n-k)!)) | Permutations: Theta(n!) | N-Queens: O(N!) heavily pruned.</text>
  <text x="38" y="626" class="sans" font-size="11" fill="#44403c">Note: Shifts (diag1 | bit) &lt;&lt; 1 and (diag2 | bit) &gt;&gt; 1 automatically advance diagonal constraints to row r + 1 without arrays.</text>
</svg>
