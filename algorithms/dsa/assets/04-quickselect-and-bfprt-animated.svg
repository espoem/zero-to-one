<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="title desc">
  <title id="title">Quickselect Expected O(n), BFPRT Median-of-Medians &amp; Monotone Binary Search</title>
  <desc id="desc">Animated comparison of Hoare Quickselect single-branch partition discard, BFPRT Median-of-Medians 5-element column proof guaranteeing at least 30% below and 30% above pivot x for T(n) &lt;= T(n/5) + T(7n/10) + O(n), and Monotone Predicate Binary Search on Answer.</desc>
  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    @keyframes flowDash {
      0% { stroke-dashoffset: 24; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes bracketShrink {
      0%, 25% { transform: scaleX(1); opacity: 1; }
      45%, 65% { transform: scaleX(0.57); opacity: 1; }
      80%, 95% { transform: scaleX(0.28); opacity: 1; }
      100% { transform: scaleX(1); opacity: 1; }
    }
    @keyframes quadPulse {
      0%, 100% { opacity: 0.78; }
      50% { opacity: 1; }
    }

    .flow-edge { stroke-dasharray: 6 4; animation: flowDash 2s linear infinite; }
    .mono-span { transform-box: fill-box; transform-origin: right center; animation: bracketShrink 8s ease-in-out infinite; }
    .bfprt-quad { animation: quadPulse 3.5s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
      .mono-span { transform: none !important; }
      .bfprt-quad { opacity: 1 !important; }
    }
  </style>

  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arr-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1200" height="800" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="1200" height="64" rx="12" fill="#0f172a"/>
  <rect x="0" y="48" width="1200" height="16" fill="#0f172a"/>
  <text x="24" y="28" class="sans" font-size="18" font-weight="700" fill="#f8fafc">Linear-Time Selection (Quickselect vs BFPRT) &amp; Monotone Predicate Search</text>
  <text x="24" y="49" class="sans" font-size="12" fill="#94a3b8">Single-branch discard T(n) = T(n/2) + O(n), worst-case O(n) via groups of 5 (30%/70% split), and Binary Search on Answer</text>

  <!-- ==================== TOP LEFT: QUICKSELECT ==================== -->
  <rect x="20" y="80" width="490" height="390" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="20" y="80" width="490" height="36" rx="10" fill="#eff6ff"/>
  <rect x="20" y="106" width="490" height="10" fill="#eff6ff"/>
  <text x="36" y="103" class="sans" font-size="13" font-weight="700" fill="#1e3a8a">1. Quickselect (Hoare's Selection, Expected O(n))</text>

  <!-- Level 0 bar n -->
  <rect x="44" y="132" width="210" height="34" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="149" y="153" class="mono" font-size="10.5" fill="#64748b" text-anchor="middle">discarded (&lt; p)</text>
  <rect x="258" y="132" width="36" height="34" rx="5" fill="#d97706"/><text x="276" y="153" class="mono" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">p</text>
  <rect x="298" y="132" width="188" height="34" rx="5" fill="#2563eb"/><text x="392" y="153" class="mono" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">recurse ONLY here (k)</text>

  <path d="M 392 168 L 392 194" stroke="#2563eb" stroke-width="2" class="flow-edge" marker-end="url(#arr-blue)"/>

  <!-- Level 1 bar n/2 -->
  <rect x="298" y="198" width="90" height="32" rx="5" fill="#2563eb"/><text x="343" y="218" class="mono" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">keep n/4</text>
  <rect x="392" y="198" width="32" height="32" rx="5" fill="#d97706"/><text x="408" y="218" class="mono" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">p2</text>
  <rect x="428" y="198" width="58" height="32" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-dasharray="4 3"/><text x="457" y="218" class="mono" font-size="10" fill="#64748b" text-anchor="middle">drop</text>

  <path d="M 343 232 L 343 258" stroke="#059669" stroke-width="2" class="flow-edge" marker-end="url(#arr-emerald)"/>

  <!-- Level 2: k-th found -->
  <rect x="298" y="262" width="90" height="32" rx="5" fill="#059669"/><text x="343" y="282" class="mono" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">A[k] FOUND</text>

  <rect x="44" y="310" width="442" height="144" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="58" y="332" class="mono" font-size="11" font-weight="700" fill="#1e3a8a">Expected: T(n) = T(n/2) + O(n) = O(n)</text>
  <text x="58" y="352" class="sans" font-size="10.5" fill="#334155">Geometric series n + n/2 + n/4 + … = 2n (root-heavy Case 3).</text>
  <text x="58" y="372" class="sans" font-size="10.5" fill="#334155">Unlike Quicksort, Quickselect never recurses on both halves.</text>
  <text x="58" y="396" class="mono" font-size="10.5" font-weight="700" fill="#be123c">Worst case: O(n^2) if pivots peel 1 item per step.</text>
  <text x="58" y="418" class="mono" font-size="10" fill="#475569">Fix: random pivot (expected) or BFPRT / Introselect (worst-case).</text>

  <!-- ==================== TOP RIGHT: BFPRT MEDIAN-OF-MEDIANS ==================== -->
  <rect x="526" y="80" width="654" height="390" rx="10" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <rect x="526" y="80" width="654" height="36" rx="10" fill="#f5f3ff"/>
  <rect x="526" y="106" width="654" height="10" fill="#f5f3ff"/>
  <text x="542" y="103" class="sans" font-size="13" font-weight="700" fill="#5b21b6">2. BFPRT Median-of-Medians: Deterministic O(n) Worst-Case Split</text>
  <rect x="1034" y="87" width="130" height="22" rx="11" fill="#7c3aed"/>
  <text x="1099" y="102" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">≥30% / ≤70% Split</text>

  <!-- 7 columns of 5 elements (each column sorted top-to-bottom), x=556, dx=46, y=136, dy=26 -->
  <text x="546" y="132" class="sans" font-size="10.5" font-weight="700" fill="#0f172a">⌊n/5⌋ sorted columns of 5 (pivot x = median of middle row):</text>

  <!-- Highlight 30% strictly < x (top-left 3 rows x 4 cols) -->
  <rect x="550" y="144" width="176" height="82" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-dasharray="4 2" class="bfprt-quad"/>
  <text x="638" y="160" class="mono" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">Guaranteed &lt; x (≥ 30%)</text>

  <!-- Highlight 30% strictly > x (bottom-right 3 rows x 4 cols) -->
  <rect x="692" y="198" width="176" height="82" rx="6" fill="#fef3c7" stroke="#d97706" stroke-dasharray="4 2" class="bfprt-quad"/>
  <text x="780" y="274" class="mono" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">Guaranteed &gt; x (≥ 30%)</text>

  <!-- Draw 7 columns of 5 dots -->
  <!-- Col 1..3 (medians < x), Col 4 (median == x), Col 5..7 (medians > x) -->
  <circle cx="574" cy="172" r="7" fill="#2563eb"/><circle cx="574" cy="194" r="7" fill="#2563eb"/><circle cx="574" cy="216" r="7" fill="#2563eb"/><circle cx="574" cy="238" r="7" fill="#94a3b8"/><circle cx="574" cy="260" r="7" fill="#94a3b8"/>
  <circle cx="620" cy="172" r="7" fill="#2563eb"/><circle cx="620" cy="194" r="7" fill="#2563eb"/><circle cx="620" cy="216" r="7" fill="#2563eb"/><circle cx="620" cy="238" r="7" fill="#94a3b8"/><circle cx="620" cy="260" r="7" fill="#94a3b8"/>
  <circle cx="666" cy="172" r="7" fill="#2563eb"/><circle cx="666" cy="194" r="7" fill="#2563eb"/><circle cx="666" cy="216" r="7" fill="#2563eb"/><circle cx="666" cy="238" r="7" fill="#94a3b8"/><circle cx="666" cy="260" r="7" fill="#94a3b8"/>

  <!-- Col 4: Pivot x at middle -->
  <circle cx="712" cy="172" r="7" fill="#2563eb"/><circle cx="712" cy="194" r="7" fill="#2563eb"/>
  <circle cx="712" cy="216" r="10" fill="#7c3aed" stroke="#4c1d95" stroke-width="2"/><text x="712" y="220" class="mono" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">x</text>
  <circle cx="712" cy="238" r="7" fill="#d97706"/><circle cx="712" cy="260" r="7" fill="#d97706"/>

  <!-- Col 5..7 -->
  <circle cx="758" cy="172" r="7" fill="#94a3b8"/><circle cx="758" cy="194" r="7" fill="#94a3b8"/><circle cx="758" cy="216" r="7" fill="#d97706"/><circle cx="758" cy="238" r="7" fill="#d97706"/><circle cx="758" cy="260" r="7" fill="#d97706"/>
  <circle cx="804" cy="172" r="7" fill="#94a3b8"/><circle cx="804" cy="194" r="7" fill="#94a3b8"/><circle cx="804" cy="216" r="7" fill="#d97706"/><circle cx="804" cy="238" r="7" fill="#d97706"/><circle cx="804" cy="260" r="7" fill="#d97706"/>
  <circle cx="850" cy="172" r="7" fill="#94a3b8"/><circle cx="850" cy="194" r="7" fill="#94a3b8"/><circle cx="850" cy="216" r="7" fill="#d97706"/><circle cx="850" cy="238" r="7" fill="#d97706"/><circle cx="850" cy="260" r="7" fill="#d97706"/>

  <!-- Right explanation box -->
  <rect x="886" y="144" width="278" height="148" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="900" y="166" class="sans" font-size="11" font-weight="700" fill="#5b21b6">Recurrence Proof</text>
  <text x="900" y="188" class="mono" font-size="10" fill="#4c1d95">At least 3·(⌈(n/5)/2⌉ - 2)</text>
  <text x="900" y="206" class="mono" font-size="10" fill="#4c1d95">≥ 3n/10 - 6 items &lt; x (&amp; &gt; x).</text>
  <text x="900" y="230" class="mono" font-size="10.5" font-weight="700" fill="#065f46">T(n) ≤ T(n/5) + T(7n/10) + O(n)</text>
  <text x="900" y="252" class="mono" font-size="10.5" font-weight="700" fill="#7c3aed">1/5 + 7/10 = 9/10 &lt; 1 ⇒ O(n)!</text>
  <text x="900" y="274" class="sans" font-size="10" fill="#64748b">Converges geometrically to 10·cn.</text>

  <!-- Why Groups of 3 Fail -->
  <rect x="546" y="308" width="618" height="146" rx="8" fill="#fff1f2" stroke="#fda4af"/>
  <text x="560" y="330" class="sans" font-size="11.5" font-weight="700" fill="#9f1239">Interview Trap: Why Not Groups of 3?</text>
  <text x="560" y="352" class="mono" font-size="10.5" fill="#881337">With groups of 3: ≥ 2·(1/2)·(n/3) = n/3 excluded ⇒ remaining ≤ 2n/3.</text>
  <text x="560" y="374" class="mono" font-size="10.5" font-weight="700" fill="#be123c">Recurrence: T(n) = T(n/3) + T(2n/3) + O(n)</text>
  <text x="560" y="396" class="sans" font-size="10.5" fill="#475569">Because 1/3 + 2/3 = 1 (Akra-Bazzi exponent p = 1), the sum does NOT decay!</text>
  <text x="560" y="418" class="mono" font-size="10.5" font-weight="700" fill="#9f1239">Evaluates to Θ(n log n) — loses linear worst-case guarantee! (Groups ≥ 5 needed.)</text>

  <!-- ==================== BOTTOM: MONOTONE BINARY SEARCH ON ANSWER ==================== -->
  <rect x="20" y="486" width="1160" height="294" rx="10" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
  <rect x="20" y="486" width="1160" height="36" rx="10" fill="#ecfdf5"/>
  <rect x="20" y="512" width="1160" height="10" fill="#ecfdf5"/>
  <text x="36" y="509" class="sans" font-size="13" font-weight="700" fill="#065f46">3. Binary Search as a Monotone Predicate Boundary: binarySearchFirstTrue(low, high, P)</text>
  <text x="1164" y="509" class="mono" font-size="11" font-weight="700" fill="#059669" text-anchor="end">P(x) ⇒ P(x + 1)  (F…F T…T)</text>

  <!-- Predicate Domain Cells: x = 0..6 (F, F, F, T*, T, T, T) -->
  <!-- x starts at 48, width=82, gap=8 -> stride=90 -->
  <rect x="48" y="544" width="82" height="46" rx="6" fill="#fff1f2" stroke="#e11d48"/><text x="89" y="564" class="mono" font-size="11" font-weight="700" fill="#9f1239" text-anchor="middle">P(0) = F</text><text x="89" y="581" class="mono" font-size="10" fill="#be123c" text-anchor="middle">too small</text>
  <rect x="138" y="544" width="82" height="46" rx="6" fill="#fff1f2" stroke="#e11d48"/><text x="179" y="564" class="mono" font-size="11" font-weight="700" fill="#9f1239" text-anchor="middle">P(1) = F</text><text x="179" y="581" class="mono" font-size="10" fill="#be123c" text-anchor="middle">too small</text>
  <rect x="228" y="544" width="82" height="46" rx="6" fill="#fff1f2" stroke="#e11d48"/><text x="269" y="564" class="mono" font-size="11" font-weight="700" fill="#9f1239" text-anchor="middle">P(2) = F</text><text x="269" y="581" class="mono" font-size="10" fill="#be123c" text-anchor="middle">left=mid+1</text>

  <rect x="318" y="544" width="94" height="46" rx="6" fill="#059669" stroke="#047857" stroke-width="2"/><text x="365" y="564" class="mono" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">P(3) = T ★</text><text x="365" y="581" class="mono" font-size="10" font-weight="700" fill="#d1fae5" text-anchor="middle">FIRST TRUE</text>

  <rect x="420" y="544" width="82" height="46" rx="6" fill="#d1fae5" stroke="#059669"/><text x="461" y="564" class="mono" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">P(4) = T</text><text x="461" y="581" class="mono" font-size="10" fill="#047857" text-anchor="middle">right = mid</text>
  <rect x="510" y="544" width="82" height="46" rx="6" fill="#d1fae5" stroke="#059669"/><text x="551" y="564" class="mono" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">P(5) = T</text><text x="551" y="581" class="mono" font-size="10" fill="#047857" text-anchor="middle">feasible</text>
  <rect x="600" y="544" width="82" height="46" rx="6" fill="#d1fae5" stroke="#059669"/><text x="641" y="564" class="mono" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">P(6) = T</text><text x="641" y="581" class="mono" font-size="10" fill="#047857" text-anchor="middle">feasible</text>

  <!-- Animated contracting bracket [left, right] -->
  <rect x="48" y="598" width="634" height="10" rx="5" fill="#2563eb" class="mono-span"/>
  <text x="365" y="628" class="mono" font-size="10.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">Invariant: answer ∈ [left, right] · P(mid) ? right = mid : left = mid + 1 · terminates at left === right</text>

  <!-- Code & Applications -->
  <rect x="48" y="644" width="634" height="118" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="62" y="666" class="sans" font-size="11.5" font-weight="700" fill="#0f172a">"Binary Search on Answer" Pattern (Module 04 §5)</text>
  <text x="62" y="688" class="sans" font-size="10.5" fill="#334155">Whenever minimizing a maximum or maximizing a minimum (e.g., Ship Packages Within D Days,</text>
  <text x="62" y="706" class="sans" font-size="10.5" fill="#334155">Koko Eating Bananas, Split Array Largest Sum), test feasibility P(x) in O(n) to find the exact</text>
  <text x="62" y="724" class="sans" font-size="10.5" fill="#334155">threshold in O(n log(max - min)) time without enumerating candidate values.</text>
  <text x="62" y="746" class="mono" font-size="10" font-weight="700" fill="#059669">Also unifies lowerBound (A[i] &gt;= target) and upperBound (A[i] &gt; target): count = [lb, ub).</text>

  <!-- Right Code Block -->
  <rect x="702" y="540" width="462" height="222" rx="8" fill="#0f172a"/>
  <text x="718" y="564" class="mono" font-size="10.5" font-weight="700" fill="#34d399">function binarySearchFirstTrue(</text>
  <text x="718" y="584" class="mono" font-size="10.5" fill="#e2e8f0">  low: number, high: number,</text>
  <text x="718" y="604" class="mono" font-size="10.5" fill="#e2e8f0">  predicate: (x: number) =&gt; boolean</text>
  <text x="718" y="624" class="mono" font-size="10.5" fill="#34d399">): number {</text>
  <text x="718" y="644" class="mono" font-size="10.5" fill="#38bdf8">  let left = low, right = high;</text>
  <text x="718" y="664" class="mono" font-size="10.5" fill="#e2e8f0">  while (left &lt; right) {</text>
  <text x="718" y="684" class="mono" font-size="10.5" fill="#fbbf24">    const mid = left + Math.floor((right - left) / 2);</text>
  <text x="718" y="704" class="mono" font-size="10.5" fill="#34d399">    if (predicate(mid)) right = mid;</text>
  <text x="718" y="724" class="mono" font-size="10.5" fill="#f472b6">    else left = mid + 1;</text>
  <text x="718" y="744" class="mono" font-size="10.5" fill="#e2e8f0">  } return left; // first true in [low, high]</text>
</svg>
