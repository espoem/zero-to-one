<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 650" width="1160" height="650" role="img" aria-labelledby="title desc">
  <title id="title">Interval DP (len = 2..n) &amp; Held-Karp Bitmask TSP</title>
  <desc id="desc">Left panel animates Interval DP filling upper-triangular subproblem diagonals in increasing length order len = 1..4 across split points k (Matrix Chain Multiplication). Right panel animates Held-Karp Bitmask TSP transitions DP(mask, u) -&gt; DP(mask | (1 &lt;&lt; v), v) visiting 4 cities in O(n^2 * 2^n).</desc>
  <style><![CDATA[
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* 10s 4-step diagonal / subset progression */
    @keyframes d1 { 0%, 24% { opacity: 1; } 25%, 100% { opacity: 0.86; } }
    @keyframes d2 { 0%, 24% { opacity: 0.86; } 25%, 49% { opacity: 1; } 50%, 100% { opacity: 0.86; } }
    @keyframes d3 { 0%, 49% { opacity: 0.86; } 50%, 74% { opacity: 1; } 75%, 100% { opacity: 0.86; } }
    @keyframes d4 { 0%, 74% { opacity: 0.86; } 75%, 100% { opacity: 1; } }

    .d1 { animation: d1 10s infinite; }
    .d2 { animation: d2 10s infinite; }
    .d3 { animation: d3 10s infinite; }
    .d4 { animation: d4 10s infinite; }

    @media (prefers-reduced-motion: reduce) {
      .d1, .d2, .d3, .d4 {
        animation: none !important;
        opacity: 1 !important;
      }
    }
  ]]></style>

  <!-- Canvas & Header -->
  <rect x="0" y="0" width="1160" height="650" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="0" y="0" width="1160" height="60" rx="12" fill="#0f172a"/>
  <rect x="0" y="44" width="1160" height="16" fill="#0f172a"/>
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#f8fafc">Advanced DP Dimensions: Interval DP (len = 2..n) &amp; Held-Karp Bitmask TSP</text>
  <text x="24" y="47" class="sans" font-size="12" fill="#94a3b8">Expanding subproblem length diagonals over intervals [i, j] paired with exponential subset DAG transitions over (mask, u)</text>

  <!-- LEFT PANEL: Interval DP -->
  <rect x="20" y="76" width="548" height="484" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="38" y="100" class="sans" font-size="14" font-weight="700" fill="#0f172a">1. Interval DP: Expanding Subarray Length len = 2..n</text>
  <rect x="38" y="112" width="512" height="28" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="50" y="130" class="mono" font-size="11" font-weight="700" fill="#1e3a8a">dp[i][j] = min_{i &lt;= k &lt; j} (dp[i][k] + dp[k+1][j] + cost(i, k, j))</text>

  <!-- Upper-Triangular Matrix 4x4 (MCM dims [10,20,30,40,30]) at x=120, y=178 -->
  <text x="166" y="168" class="mono" font-size="11.5" font-weight="700" text-anchor="middle" fill="#475569">j=0</text>
  <text x="258" y="168" class="mono" font-size="11.5" font-weight="700" text-anchor="middle" fill="#475569">j=1</text>
  <text x="350" y="168" class="mono" font-size="11.5" font-weight="700" text-anchor="middle" fill="#475569">j=2</text>
  <text x="442" y="168" class="mono" font-size="11.5" font-weight="700" text-anchor="middle" fill="#475569">j=3</text>

  <text x="98" y="205" class="mono" font-size="11.5" font-weight="700" text-anchor="middle" fill="#475569">i=0</text>
  <text x="98" y="253" class="mono" font-size="11.5" font-weight="700" text-anchor="middle" fill="#475569">i=1</text>
  <text x="98" y="301" class="mono" font-size="11.5" font-weight="700" text-anchor="middle" fill="#475569">i=2</text>
  <text x="98" y="349" class="mono" font-size="11.5" font-weight="700" text-anchor="middle" fill="#475569">i=3</text>

  <!-- len=1 diagonal -->
  <g class="d1">
    <rect x="120" y="178" width="90" height="44" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="165" y="205" class="mono" font-size="12" font-weight="700" text-anchor="middle" fill="#0f172a">0</text>
    <rect x="212" y="226" width="90" height="44" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="257" y="253" class="mono" font-size="12" font-weight="700" text-anchor="middle" fill="#0f172a">0</text>
    <rect x="304" y="274" width="90" height="44" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="349" y="301" class="mono" font-size="12" font-weight="700" text-anchor="middle" fill="#0f172a">0</text>
    <rect x="396" y="322" width="90" height="44" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="441" y="349" class="mono" font-size="12" font-weight="700" text-anchor="middle" fill="#0f172a">0</text>
  </g>

  <!-- len=2 diagonal -->
  <g class="d2">
    <rect x="212" y="178" width="90" height="44" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="257" y="205" class="mono" font-size="12" font-weight="700" text-anchor="middle" fill="#1e3a8a">6,000</text>
    <rect x="304" y="226" width="90" height="44" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="349" y="253" class="mono" font-size="12" font-weight="700" text-anchor="middle" fill="#1e3a8a">24,000</text>
    <rect x="396" y="274" width="90" height="44" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="441" y="301" class="mono" font-size="12" font-weight="700" text-anchor="middle" fill="#1e3a8a">36,000</text>
  </g>

  <!-- len=3 diagonal -->
  <g class="d3">
    <rect x="304" y="178" width="90" height="44" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="349" y="205" class="mono" font-size="12" font-weight="700" text-anchor="middle" fill="#92400e">18,000</text>
    <rect x="396" y="226" width="90" height="44" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="441" y="253" class="mono" font-size="12" font-weight="700" text-anchor="middle" fill="#92400e">48,000</text>
  </g>

  <!-- len=4 corner dp[0][3] -->
  <g class="d4">
    <rect x="396" y="178" width="90" height="44" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/><text x="441" y="205" class="mono" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">30,000*</text>
  </g>

  <!-- Split Point k Bar -->
  <rect x="38" y="384" width="512" height="74" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="52" y="405" class="sans" font-size="12" font-weight="700" fill="#0f172a">Evaluating dp[0][3] Across Split Points k in {0, 1, 2}:</text>
  <rect x="52" y="416" width="150" height="30" rx="5" fill="#fff1f2" stroke="#fda4af"/><text x="127" y="435" class="mono" font-size="11" text-anchor="middle" fill="#9f1239">k=0: (A0)(A1..3)=54k</text>
  <rect x="212" y="416" width="150" height="30" rx="5" fill="#fff1f2" stroke="#fda4af"/><text x="287" y="435" class="mono" font-size="11" text-anchor="middle" fill="#9f1239">k=1: (A0..1)(A2..3)=51k</text>
  <rect x="372" y="416" width="164" height="30" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><text x="454" y="435" class="mono" font-size="11" font-weight="700" text-anchor="middle" fill="#065f46">k=2: (A0..2)(A3)=30k*</text>

  <rect x="38" y="470" width="512" height="74" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="52" y="492" class="sans" font-size="11.5" font-weight="700" fill="#0f172a">Why Length Loop Is Outermost: len = 2 .. n</text>
  <text x="52" y="512" class="sans" font-size="11" fill="#334155">Every interval [i, j] of length len merges two strictly shorter sub-intervals [i, k]</text>
  <text x="52" y="530" class="sans" font-size="11" fill="#334155">and [k+1, j] already finalized on earlier diagonals. Time: O(n^3) · Space: O(n^2).</text>

  <!-- RIGHT PANEL: Held-Karp Bitmask TSP -->
  <rect x="592" y="76" width="548" height="484" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="610" y="100" class="sans" font-size="14" font-weight="700" fill="#0f172a">2. Held-Karp Bitmask TSP: DP(mask, u)</text>
  <rect x="610" y="112" width="512" height="28" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="622" y="130" class="mono" font-size="11" font-weight="700" fill="#5b21b6">DP(mask, u) = min_{v not in mask} (D[u][v] + DP(mask | (1 &lt;&lt; v), v))</text>

  <!-- Subset Transition Chain -->
  <g class="d1">
    <rect x="610" y="156" width="512" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="626" y="178" class="mono" font-size="12" font-weight="700" fill="#1e3a8a">Step 1: mask = 0001 (visited {0}), current u = 0</text>
    <text x="626" y="198" class="sans" font-size="11" fill="#334155">Try unvisited v=1: transition to mask = 0001 | (1 &lt;&lt; 1) = 0011, city v = 1</text>
  </g>

  <g class="d2">
    <rect x="610" y="230" width="512" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="626" y="252" class="mono" font-size="12" font-weight="700" fill="#1e3a8a">Step 2: mask = 0011 (visited {0, 1}), current u = 1</text>
    <text x="626" y="272" class="sans" font-size="11" fill="#334155">Try unvisited v=2: transition to mask = 0011 | (1 &lt;&lt; 2) = 0111, city v = 2</text>
  </g>

  <g class="d3">
    <rect x="610" y="304" width="512" height="62" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
    <text x="626" y="326" class="mono" font-size="12" font-weight="700" fill="#92400e">Step 3: mask = 0111 (visited {0, 1, 2}), current u = 2</text>
    <text x="626" y="346" class="sans" font-size="11" fill="#334155">Try unvisited v=3: transition to mask = 0111 | (1 &lt;&lt; 3) = 1111, city v = 3</text>
  </g>

  <g class="d4">
    <rect x="610" y="378" width="512" height="62" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="626" y="400" class="mono" font-size="12" font-weight="700" fill="#065f46">Step 4: mask = (1 &lt;&lt; n) - 1 = 1111 (all visited!)</text>
    <text x="626" y="420" class="sans" font-size="11" fill="#334155">Base return cost: add D[u][0] back to origin city 0 -&gt; min tour found.</text>
  </g>

  <!-- Complexity Comparison Box -->
  <rect x="610" y="454" width="512" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="624" y="476" class="sans" font-size="12" font-weight="700" fill="#0f172a">Bitmask DP Exponential Compression (n = 20 Cities)</text>
  <text x="624" y="497" class="mono" font-size="11" fill="#9f1239">Brute Force O(n!)      : 20! ~ 2.4 x 10^18 ops (centuries)</text>
  <text x="624" y="516" class="mono" font-size="11" font-weight="700" fill="#065f46">Held-Karp O(n^2 · 2^n) : 400 x 10^6 ops (~1 second!)</text>
  <text x="624" y="534" class="sans" font-size="10.5" fill="#475569">Bitmask encodes visited set in 1 integer; bit k == 1 iff city k visited.</text>

  <!-- Footer -->
  <rect x="20" y="574" width="1120" height="60" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="38" y="598" class="sans" font-size="11.5" font-weight="700" fill="#0f172a">State-Space DAG Ordering:</text>
  <text x="210" y="598" class="sans" font-size="11.5" fill="#334155">Interval DP orders states by increasing interval length (len = 2..n); Bitmask DP orders states by increasing mask popcount / value.</text>
  <text x="38" y="618" class="sans" font-size="11" fill="#475569">Both convert cyclic/combinatorial structures into strictly acyclic topological sweeps.</text>
</svg>
