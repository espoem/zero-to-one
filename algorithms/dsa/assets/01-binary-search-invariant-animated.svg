<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Binary Search Loop Invariant: Half-Open [left, right) Lower Bound Proof</title>
  <desc id="desc">Animated step-by-step trace of lowerBound(A, x) on half-open interval [left, right) showing mid calculation, predicate A[mid] &lt; x branching, invariant maintenance A[i] &lt; x for i &lt; left and A[j] &gt;= x for j &gt;= right, and termination at left === right.</desc>
  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* 4-step cycle (12s): s0: 0-25%, s1: 25-50%, s2: 50-75%, s3: 75-100% */
    @keyframes step0 { 0%, 22% { opacity: 1; } 25%, 97% { opacity: 0.86; } 100% { opacity: 1; } }
    @keyframes step1 { 0%, 22% { opacity: 0.86; } 25%, 47% { opacity: 1; } 50%, 100% { opacity: 0.86; } }
    @keyframes step2 { 0%, 47% { opacity: 0.86; } 50%, 72% { opacity: 1; } 75%, 100% { opacity: 0.86; } }
    @keyframes step3 { 0%, 72% { opacity: 0.86; } 75%, 97% { opacity: 1; } 100% { opacity: 0.86; } }

    /* Moving bracket &amp; mid pointer across array cells (cell step = 74px, cell 0 x=60) */
    @keyframes moveLeft {
      0%, 47% { transform: translateX(0px); }
      50%, 100% { transform: translateX(222px); }
    }
    @keyframes moveRight {
      0%, 22% { transform: translateX(0px); }
      25%, 72% { transform: translateX(-296px); }
      75%, 100% { transform: translateX(-370px); }
    }
    @keyframes moveMid {
      0%, 22% { transform: translateX(0px); opacity: 1; }
      25%, 47% { transform: translateX(-148px); opacity: 1; }
      50%, 72% { transform: translateX(-74px); opacity: 1; }
      75%, 97% { transform: translateX(-74px); opacity: 0.86; }
      100% { transform: translateX(0px); opacity: 1; }
    }
    @keyframes activeSpan {
      0%, 22% { transform: scaleX(1); transform-origin: left center; }
      25%, 47% { transform: scaleX(0.5); transform-origin: left center; }
      50%, 72% { transform: scaleX(0.125); transform-origin: 37.5% center; }
      75%, 97% { transform: scaleX(0.01); transform-origin: 37.5% center; }
      100% { transform: scaleX(1); transform-origin: left center; }
    }

    .s0 { animation: step0 12s ease-in-out infinite; }
    .s1 { animation: step1 12s ease-in-out infinite; }
    .s2 { animation: step2 12s ease-in-out infinite; }
    .s3 { animation: step3 12s ease-in-out infinite; }
    .ptr-left { animation: moveLeft 12s ease-in-out infinite; }
    .ptr-right { animation: moveRight 12s ease-in-out infinite; }
    .ptr-mid { animation: moveMid 12s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
      .s0, .s1, .s2, .s3, .ptr-left, .ptr-right, .ptr-mid { opacity: 1 !important; transform: none !important; }
    }
  </style>

  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arr-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1200" height="760" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="1200" height="64" rx="12" fill="#0f172a"/>
  <rect x="0" y="48" width="1200" height="16" fill="#0f172a"/>
  <text x="24" y="28" class="sans" font-size="18" font-weight="700" fill="#f8fafc">Binary Search Loop Invariant: Half-Open [left, right) Lower Bound</text>
  <text x="24" y="49" class="sans" font-size="12" fill="#94a3b8">Proving lowerBound(A, x = 12) via Initialization, Maintenance, and Termination on sorted A[0..7]</text>
  <rect x="964" y="16" width="212" height="32" rx="16" fill="#1e293b" stroke="#334155"/>
  <text x="1070" y="36" class="mono" font-size="11" font-weight="700" fill="#60a5fa" text-anchor="middle">Target x = 12 → idx 3</text>

  <!-- ==================== TOP: INVARIANT ZONES + ARRAY ==================== -->
  <rect x="20" y="80" width="1160" height="260" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Three invariant zones legend -->
  <rect x="36" y="96" width="350" height="44" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="211" y="114" class="mono" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">∀ i &lt; left : A[i] &lt; x</text>
  <text x="211" y="131" class="sans" font-size="10" fill="#047857" text-anchor="middle">Strictly below target (excluded)</text>

  <rect x="404" y="96" width="392" height="44" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="600" y="114" class="mono" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">[left, right) : Active Candidate Window</text>
  <text x="600" y="131" class="sans" font-size="10" fill="#2563eb" text-anchor="middle">right - left strictly shrinks every step</text>

  <rect x="814" y="96" width="350" height="44" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="989" y="114" class="mono" font-size="11" font-weight="700" fill="#5b21b6" text-anchor="middle">∀ j ≥ right : A[j] ≥ x</text>
  <text x="989" y="131" class="sans" font-size="10" fill="#6d28d9" text-anchor="middle">At or above target (right=mid preserves)</text>

  <!-- Array Cells A[0..7] plus sentinel slot [8] for right=n -->
  <!-- x starts at 60, width=68, gap=6 -> stride=74 -->
  <text x="60" y="168" class="mono" font-size="10.5" fill="#64748b">Index:</text>

  <!-- Cell 0: 2 -->
  <text x="94" y="182" class="mono" font-size="10.5" fill="#64748b" text-anchor="middle">0</text>
  <rect x="60" y="190" width="68" height="48" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="94" y="220" class="mono" font-size="16" font-weight="700" fill="#065f46" text-anchor="middle">2</text>

  <!-- Cell 1: 5 -->
  <text x="168" y="182" class="mono" font-size="10.5" fill="#64748b" text-anchor="middle">1</text>
  <rect x="134" y="190" width="68" height="48" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="168" y="220" class="mono" font-size="16" font-weight="700" fill="#065f46" text-anchor="middle">5</text>

  <!-- Cell 2: 8 -->
  <text x="242" y="182" class="mono" font-size="10.5" fill="#64748b" text-anchor="middle">2</text>
  <rect x="208" y="190" width="68" height="48" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="242" y="220" class="mono" font-size="16" font-weight="700" fill="#065f46" text-anchor="middle">8</text>

  <!-- Cell 3: 12 (Answer: first >= 12) -->
  <text x="316" y="182" class="mono" font-size="10.5" font-weight="700" fill="#059669" text-anchor="middle">3 ★</text>
  <rect x="282" y="190" width="68" height="48" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="316" y="220" class="mono" font-size="16" font-weight="700" fill="#92400e" text-anchor="middle">12</text>

  <!-- Cell 4: 12 -->
  <text x="390" y="182" class="mono" font-size="10.5" fill="#64748b" text-anchor="middle">4</text>
  <rect x="356" y="190" width="68" height="48" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="390" y="220" class="mono" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">12</text>

  <!-- Cell 5: 16 -->
  <text x="464" y="182" class="mono" font-size="10.5" fill="#64748b" text-anchor="middle">5</text>
  <rect x="430" y="190" width="68" height="48" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="464" y="220" class="mono" font-size="16" font-weight="700" fill="#5b21b6" text-anchor="middle">16</text>

  <!-- Cell 6: 23 -->
  <text x="538" y="182" class="mono" font-size="10.5" fill="#64748b" text-anchor="middle">6</text>
  <rect x="504" y="190" width="68" height="48" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="538" y="220" class="mono" font-size="16" font-weight="700" fill="#5b21b6" text-anchor="middle">23</text>

  <!-- Cell 7: 38 -->
  <text x="612" y="182" class="mono" font-size="10.5" fill="#64748b" text-anchor="middle">7</text>
  <rect x="578" y="190" width="68" height="48" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="612" y="220" class="mono" font-size="16" font-weight="700" fill="#5b21b6" text-anchor="middle">38</text>

  <!-- Sentinel n = 8 -->
  <text x="686" y="182" class="mono" font-size="10.5" fill="#64748b" text-anchor="middle">8 (n)</text>
  <rect x="652" y="190" width="68" height="48" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="686" y="218" class="mono" font-size="11" fill="#94a3b8" text-anchor="middle">end</text>

  <!-- Animated Pointers below array -->
  <!-- left starts at index 0 (x=94) -->
  <g class="ptr-left">
    <line x1="94" y1="274" x2="94" y2="244" stroke="#059669" stroke-width="2.2" marker-end="url(#arr-emerald)"/>
    <rect x="64" y="276" width="60" height="22" rx="4" fill="#059669"/>
    <text x="94" y="291" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">left</text>
  </g>

  <!-- mid starts at index 4 (x=390) -->
  <g class="ptr-mid">
    <line x1="390" y1="274" x2="390" y2="244" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr-blue)"/>
    <rect x="360" y="276" width="60" height="22" rx="4" fill="#2563eb"/>
    <text x="390" y="291" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">mid</text>
  </g>

  <!-- right starts at index 8 (x=686) -->
  <g class="ptr-right">
    <line x1="686" y1="306" x2="686" y2="244" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arr-violet)"/>
    <rect x="654" y="308" width="64" height="22" rx="4" fill="#7c3aed"/>
    <text x="686" y="323" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">right</text>
  </g>

  <!-- Overflow Safety Callout on Right of Array -->
  <rect x="748" y="166" width="416" height="156" rx="8" fill="#fff1f2" stroke="#fda4af"/>
  <text x="764" y="190" class="sans" font-size="12" font-weight="700" fill="#9f1239">Word-RAM Overflow Guard</text>
  <text x="764" y="212" class="mono" font-size="10.5" fill="#065f46">SAFE:  left + Math.floor((right - left) / 2)</text>
  <text x="764" y="232" class="mono" font-size="10.5" fill="#be123c">BUG 1: (left + right) &gt;&gt; 1   (int32 sign-flip &gt;= 2^31)</text>
  <text x="764" y="252" class="mono" font-size="10.5" fill="#be123c">BUG 2: left + right &gt;= 2^53 (IEEE-754 rounding)</text>
  <line x1="764" y1="266" x2="1148" y2="266" stroke="#fecdd3"/>
  <text x="764" y="286" class="sans" font-size="10.5" fill="#334155">Why right = mid (not mid - 1)? Half-open [left, right)</text>
  <text x="764" y="304" class="sans" font-size="10.5" fill="#334155">excludes right itself while keeping mid as a valid >= x boundary.</text>

  <!-- ==================== BOTTOM LEFT: STEP-BY-STEP TRACE ==================== -->
  <rect x="20" y="356" width="690" height="384" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="20" y="356" width="690" height="36" rx="10" fill="#f1f5f9"/>
  <rect x="20" y="382" width="690" height="10" fill="#f1f5f9"/>
  <text x="36" y="379" class="sans" font-size="13" font-weight="700" fill="#0f172a">Step-by-Step Invariant Maintenance &amp; Contraction Trace</text>

  <!-- Step 0 -->
  <g class="s0">
    <rect x="36" y="406" width="658" height="72" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="48" y="416" width="124" height="22" rx="4" fill="#2563eb"/>
    <text x="110" y="431" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">1. INIT [0, 8)</text>
    <text x="184" y="431" class="mono" font-size="11" font-weight="700" fill="#1e3a8a">mid = 0 + ⌊8/2⌋ = 4  →  A[4] = 12 ≥ 12</text>
    <text x="48" y="460" class="sans" font-size="10.5" fill="#334155">Vacuously true at init (i &lt; 0, j ≥ 8 empty). Branch A[4] ≥ 12 ⇒ set right = 4 (all j ≥ 4 are ≥ 12).</text>
  </g>

  <!-- Step 1 -->
  <g class="s1">
    <rect x="36" y="488" width="658" height="72" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <rect x="48" y="498" width="124" height="22" rx="4" fill="#059669"/>
    <text x="110" y="513" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">2. ITER [0, 4)</text>
    <text x="184" y="513" class="mono" font-size="11" font-weight="700" fill="#065f46">mid = 0 + ⌊4/2⌋ = 2  →  A[2] = 8 &lt; 12</text>
    <text x="48" y="542" class="sans" font-size="10.5" fill="#334155">Since A is sorted, A[0..2] ≤ 8 &lt; 12 ⇒ set left = mid + 1 = 3. Invariant ∀i &lt; 3: A[i] &lt; 12 holds.</text>
  </g>

  <!-- Step 2 -->
  <g class="s2">
    <rect x="36" y="570" width="658" height="72" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="48" y="580" width="124" height="22" rx="4" fill="#7c3aed"/>
    <text x="110" y="595" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">3. ITER [3, 4)</text>
    <text x="184" y="595" class="mono" font-size="11" font-weight="700" fill="#5b21b6">mid = 3 + ⌊1/2⌋ = 3  →  A[3] = 12 ≥ 12</text>
    <text x="48" y="624" class="sans" font-size="10.5" fill="#334155">Midpoint floor stays inside [3, 4). A[3] ≥ 12 ⇒ set right = mid = 3. Range collapses cleanly.</text>
  </g>

  <!-- Step 3 -->
  <g class="s3">
    <rect x="36" y="652" width="658" height="72" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <rect x="48" y="662" width="124" height="22" rx="4" fill="#d97706"/>
    <text x="110" y="677" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">4. HALT [3, 3)</text>
    <text x="184" y="677" class="mono" font-size="11" font-weight="700" fill="#92400e">left === right === 3  →  return 3</text>
    <text x="48" y="706" class="sans" font-size="10.5" fill="#334155">Termination: A[0..2] &lt; 12 and A[3..7] ≥ 12. Index 3 is guaranteed to be the exact lowerBound.</text>
  </g>

  <!-- ==================== BOTTOM RIGHT: EXACT CODE + PROOF ==================== -->
  <rect x="730" y="356" width="450" height="384" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="730" y="356" width="450" height="36" rx="10" fill="#0f172a"/>
  <rect x="730" y="382" width="450" height="10" fill="#0f172a"/>
  <text x="746" y="379" class="sans" font-size="13" font-weight="700" fill="#f8fafc">TypeScript Contract (Module 01 §5)</text>

  <rect x="746" y="406" width="418" height="218" rx="8" fill="#0f172a"/>
  <text x="760" y="428" class="mono" font-size="10.5" fill="#94a3b8">function lowerBound(A: number[], x: number): number {</text>
  <text x="760" y="448" class="mono" font-size="10.5" fill="#38bdf8">  let left = 0, right = A.length; // [left, right)</text>
  <text x="760" y="470" class="mono" font-size="10.5" fill="#e2e8f0">  while (left &lt; right) {</text>
  <text x="760" y="490" class="mono" font-size="10.5" fill="#fbbf24">    const mid = left + Math.floor((right - left) / 2);</text>
  <text x="760" y="512" class="mono" font-size="10.5" fill="#34d399">    if (A[mid]! &lt; x) {</text>
  <text x="760" y="532" class="mono" font-size="10.5" fill="#34d399">      left = mid + 1; // A[0..mid] &lt; x</text>
  <text x="760" y="552" class="mono" font-size="10.5" fill="#c084fc">    } else {</text>
  <text x="760" y="572" class="mono" font-size="10.5" fill="#c084fc">      right = mid;    // A[mid..n-1] &gt;= x</text>
  <text x="760" y="592" class="mono" font-size="10.5" fill="#e2e8f0">    }</text>
  <text x="760" y="612" class="mono" font-size="10.5" fill="#94a3b8">  } return left;</text>

  <!-- Proof checklist -->
  <rect x="746" y="636" width="418" height="88" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="760" y="656" class="sans" font-size="11" font-weight="700" fill="#0f172a">Why It Never Loops Infinitely</text>
  <text x="760" y="676" class="sans" font-size="10.5" fill="#334155">• When right - left ≥ 1, mid ∈ [left, right - 1].</text>
  <text x="760" y="694" class="sans" font-size="10.5" fill="#334155">• Setting left = mid + 1 or right = mid strictly shrinks length.</text>
  <text x="760" y="712" class="mono" font-size="10" font-weight="700" fill="#2563eb">• Complexity: T(n) = T(n/2) + Θ(1) = Θ(log n), O(1) space.</text>
</svg>
