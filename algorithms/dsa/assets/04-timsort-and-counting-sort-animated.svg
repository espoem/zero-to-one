<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="title desc">
  <title id="title">TimSort Hybrid Pipeline (Natural Runs, Stack Invariants, Galloping) &amp; Counting Sort</title>
  <desc id="desc">Animated visualization of TimSort's natural run detection, binary insertion extension to minrun 32..64, run-stack balance invariants |A| &gt; |B| + |C| and |B| &gt; |C|, and Galloping Mode after 7 consecutive wins, paired with O(n + k) Counting Sort prefix-sum stable reverse placement.</desc>
  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    @keyframes stageFlow {
      0% { stroke-dashoffset: 24; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes gallopJump {
      0%, 20% { transform: translateX(0px); }
      40%, 60% { transform: translateX(88px); }
      80%, 100% { transform: translateX(198px); }
    }
    @keyframes placePulse {
      0%, 100% { opacity: 0.78; stroke-width: 1.5; }
      50% { opacity: 1; stroke-width: 2.8; }
    }

    .flow-edge { stroke-dasharray: 6 4; animation: stageFlow 2s linear infinite; }
    .gallop-cursor { animation: gallopJump 6s ease-in-out infinite; }
    .place-hl { animation: placePulse 3s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
      .gallop-cursor { transform: none !important; }
      .place-hl { opacity: 1 !important; }
    }
  </style>

  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1200" height="820" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="1200" height="64" rx="12" fill="#0f172a"/>
  <rect x="0" y="48" width="1200" height="16" fill="#0f172a"/>
  <text x="24" y="28" class="sans" font-size="18" font-weight="700" fill="#f8fafc">Industrial Hybrid &amp; Linear Sorts: TimSort &amp; Counting Sort</text>
  <text x="24" y="49" class="sans" font-size="12" fill="#94a3b8">TimSort (Python &amp; V8 v7.0+): adaptive O(n) best / O(n log n) worst, strictly stable · Counting Sort: O(n + k) prefix-sum placement</text>

  <!-- ==================== TOP: TIMSORT ==================== -->
  <rect x="20" y="80" width="1160" height="394" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="20" y="80" width="1160" height="36" rx="10" fill="#eff6ff"/>
  <rect x="20" y="106" width="1160" height="10" fill="#eff6ff"/>
  <text x="36" y="103" class="sans" font-size="13" font-weight="700" fill="#1e3a8a">1. TimSort Mechanics: Natural Runs → minrun → Run Stack Collapse → Galloping Merge</text>
  <rect x="1032" y="87" width="134" height="22" rx="11" fill="#2563eb"/>
  <text x="1099" y="102" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Stable · Adaptive</text>

  <!-- Stage 1: Natural Runs & Binary Insertion -->
  <rect x="36" y="130" width="356" height="160" rx="8" fill="#f8fafc" stroke="#93c5fd"/>
  <text x="50" y="152" class="sans" font-size="11.5" font-weight="700" fill="#1e3a8a">A. Natural Run Detection &amp; minrun</text>
  <rect x="50" y="166" width="102" height="34" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <text x="101" y="187" class="mono" font-size="10.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">[2, 5, 9, 14] ↑</text>
  <rect x="160" y="166" width="104" height="34" rx="5" fill="#fef3c7" stroke="#d97706"/>
  <text x="212" y="187" class="mono" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="middle">[18, 12, 7] ↓</text>
  <rect x="272" y="166" width="104" height="34" rx="5" fill="#ecfdf5" stroke="#059669"/>
  <text x="324" y="187" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">reverse → ↑</text>
  <text x="50" y="220" class="sans" font-size="10" fill="#334155">• Strictly descending runs reversed in-place</text>
  <text x="50" y="236" class="sans" font-size="10" fill="#334155">  (strict &gt; preserves stability on duplicates!).</text>
  <text x="50" y="256" class="mono" font-size="10" font-weight="700" fill="#2563eb">• Short runs extended via Binary Insertion</text>
  <text x="50" y="274" class="mono" font-size="10" fill="#1e3a8a">  Sort to minrun ∈ [32, 64] (n/minrun ≈ 2^k).</text>

  <path d="M 394 210 L 420 210" stroke="#2563eb" stroke-width="2" class="flow-edge" marker-end="url(#arr-blue)"/>

  <!-- Stage 2: Run Stack Invariants -->
  <rect x="424" y="130" width="332" height="160" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="438" y="152" class="sans" font-size="11.5" font-weight="700" fill="#92400e">B. Run Stack Balance Invariants</text>
  <!-- Visual bars A, B, C -->
  <rect x="442" y="170" width="190" height="22" rx="4" fill="#d97706"/><text x="537" y="185" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Run A (|A| = 128)</text>
  <rect x="442" y="198" width="110" height="22" rx="4" fill="#f59e0b"/><text x="497" y="213" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Run B (64)</text>
  <rect x="442" y="226" width="76" height="22" rx="4" fill="#fbbf24"/><text x="480" y="241" class="mono" font-size="10" font-weight="700" fill="#78350f" text-anchor="middle">Run C (48)</text>
  <text x="646" y="190" class="mono" font-size="10" font-weight="700" fill="#065f46">1. |A| &gt; |B| + |C|</text>
  <text x="646" y="212" class="mono" font-size="10" font-weight="700" fill="#065f46">2. |B| &gt; |C|</text>
  <text x="646" y="236" class="mono" font-size="10" fill="#be123c">128 &gt; 64+48 ✓</text>
  <text x="438" y="268" class="sans" font-size="10" fill="#475569">If violated: merge B with min(|A|, |C|).</text>
  <text x="438" y="282" class="mono" font-size="10" fill="#92400e">Fibonacci-like growth caps stack height O(log n).</text>

  <path d="M 758 210 L 784 210" stroke="#059669" stroke-width="2" class="flow-edge" marker-end="url(#arr-emerald)"/>

  <!-- Stage 3: Galloping Mode -->
  <rect x="788" y="130" width="376" height="160" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="802" y="152" class="sans" font-size="11.5" font-weight="700" fill="#065f46">C. Galloping Mode (MIN_GALLOP = 7)</text>
  <text x="802" y="172" class="sans" font-size="10" fill="#334155">If Run A wins 7 times in a row vs B[0]:</text>

  <!-- Exponential probe bar -->
  <rect x="802" y="186" width="346" height="44" rx="5" fill="#ffffff" stroke="#a7f3d0"/>
  <rect x="808" y="194" width="34" height="28" rx="3" fill="#d1fae5"/><text x="825" y="212" class="mono" font-size="10" fill="#065f46" text-anchor="middle">+1</text>
  <rect x="848" y="194" width="42" height="28" rx="3" fill="#a7f3d0"/><text x="869" y="212" class="mono" font-size="10" fill="#065f46" text-anchor="middle">+3</text>
  <rect x="896" y="194" width="54" height="28" rx="3" fill="#6ee7b7"/><text x="923" y="212" class="mono" font-size="10" fill="#064e3b" text-anchor="middle">+7</text>
  <rect x="956" y="194" width="74" height="28" rx="3" fill="#34d399"/><text x="993" y="212" class="mono" font-size="10" font-weight="700" fill="#064e3b" text-anchor="middle">2^k - 1</text>
  <rect x="1036" y="194" width="106" height="28" rx="3" fill="#059669"/><text x="1089" y="212" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">bsearch → bulk</text>
  <!-- Animated cursor -->
  <rect x="808" y="191" width="36" height="34" rx="4" fill="none" stroke="#e11d48" stroke-width="2.2" class="gallop-cursor"/>

  <text x="802" y="252" class="mono" font-size="10" font-weight="700" fill="#059669">Exponential probe 2^k - 1 + binary search</text>
  <text x="802" y="270" class="sans" font-size="10" fill="#334155">Copies entire slice via memmove in O(log k) comps.</text>

  <!-- TimSort Summary Bar -->
  <rect x="36" y="304" width="1128" height="154" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="52" y="328" class="sans" font-size="11.5" font-weight="700" fill="#0f172a">Why Python &amp; V8 Switched from Quicksort to TimSort (V8 v7.0, 2018)</text>
  <text x="52" y="350" class="sans" font-size="10.5" fill="#334155">1. <tspan font-weight="700">ECMAScript Stability:</tspan> ES2019 mandated stable Array.prototype.sort; Quicksort is unstable.</text>
  <text x="52" y="370" class="sans" font-size="10.5" fill="#334155">2. <tspan font-weight="700">Real-World Sortedness:</tspan> Pre-sorted or k-sorted UI/DB arrays hit O(n) fast-path with zero wasted swaps.</text>
  <text x="52" y="390" class="sans" font-size="10.5" fill="#334155">3. <tspan font-weight="700">Memory Bound:</tspan> Only allocates a temp buffer of size min(|A|, |B|) ≤ n/2 by copying the smaller run during merge.</text>
  <text x="52" y="414" class="mono" font-size="10" font-weight="700" fill="#1e3a8a">Note: Fixed bug in 2015 (de Groot et al.) added extra stack invariant check to guarantee stack depth ≤ 85 for n ≤ 2^64.</text>
  <text x="52" y="436" class="mono" font-size="10" fill="#059669">Best: O(n) · Average &amp; Worst: O(n log n) · Auxiliary Space: O(n)</text>

  <!-- ==================== BOTTOM: COUNTING SORT ==================== -->
  <rect x="20" y="490" width="1160" height="310" rx="10" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <rect x="20" y="490" width="1160" height="36" rx="10" fill="#f5f3ff"/>
  <rect x="20" y="516" width="1160" height="10" fill="#f5f3ff"/>
  <text x="36" y="513" class="sans" font-size="13" font-weight="700" fill="#5b21b6">2. Counting Sort: Non-Comparison O(n + k) Prefix-Sum Stable Placement</text>
  <text x="1164" y="513" class="mono" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="end">Discrete keys [0..k] only (no floats!)</text>

  <!-- Step 1: Input A[0..6] -->
  <rect x="36" y="542" width="330" height="146" rx="8" fill="#f8fafc" stroke="#c4b5fd"/>
  <text x="50" y="564" class="mono" font-size="11" font-weight="700" fill="#5b21b6">1. Input A[0..6] (k = 4)</text>
  <text x="50" y="586" class="mono" font-size="11" fill="#1e293b">A = [ 4_a, 2_a, 2_b, 1, 3, 2_c ]</text>
  <text x="50" y="614" class="mono" font-size="10.5" fill="#475569">Count C[0..4] (freq):</text>
  <text x="50" y="636" class="mono" font-size="11" font-weight="700" fill="#7c3aed">C = [ 0, 1, 3, 1, 1 ]</text>
  <text x="50" y="662" class="sans" font-size="10" fill="#64748b">Subscripts (_a, _b, _c) track duplicates.</text>

  <path d="M 368 615 L 398 615" stroke="#d97706" stroke-width="2" class="flow-edge" marker-end="url(#arr-amber)"/>

  <!-- Step 2: Prefix Sums -->
  <rect x="402" y="542" width="366" height="146" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="416" y="564" class="mono" font-size="11" font-weight="700" fill="#92400e">2. Prefix Sums: C[v] += C[v - 1]</text>
  <text x="416" y="590" class="mono" font-size="11" font-weight="700" fill="#b45309">C = [ 0, 1, 4, 5, 6 ]</text>
  <text x="416" y="616" class="sans" font-size="10.5" fill="#334155">C[v] = exact number of elements ≤ v,</text>
  <text x="416" y="634" class="sans" font-size="10.5" fill="#334155">so key v's last slot is index C[v] - 1!</text>
  <text x="416" y="662" class="mono" font-size="10" font-weight="700" fill="#92400e">e.g. C[2] = 4 ⇒ 2_c lands at out[3].</text>

  <path d="M 770 615 L 800 615" stroke="#059669" stroke-width="2" class="flow-edge" marker-end="url(#arr-emerald)"/>

  <!-- Step 3: Reverse Scan Stable Placement -->
  <rect x="804" y="542" width="360" height="146" rx="8" fill="#ecfdf5" stroke="#6ee7b7" class="place-hl"/>
  <text x="818" y="564" class="mono" font-size="11" font-weight="700" fill="#065f46">3. Reverse Scan i = n-1 down to 0</text>
  <text x="818" y="588" class="mono" font-size="10.5" fill="#064e3b">out[--C[A[i]]] = A[i]</text>
  <text x="818" y="614" class="mono" font-size="11" font-weight="700" fill="#059669">out = [ 1, 2_a, 2_b, 2_c, 3, 4_a ]</text>
  <text x="818" y="640" class="sans" font-size="10" fill="#047857">Backward scan places 2_c at [3], 2_b at [2],</text>
  <text x="818" y="656" class="sans" font-size="10" fill="#047857">2_a at [1] ⇒ STRICTLY STABLE!</text>

  <!-- Bottom note -->
  <rect x="36" y="702" width="1128" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="52" y="726" class="sans" font-size="11" font-weight="700" fill="#0f172a">Why Counting Sort Bypasses Ω(n log n) &amp; Where It Fails</text>
  <text x="52" y="746" class="sans" font-size="10.5" fill="#334155">Decision-tree Ω(n log n) only constrains comparison sorts. Counting Sort indexes directly in O(n + k) time and space — also the stable subroutine inside Radix Sort.</text>
  <text x="52" y="766" class="mono" font-size="10" fill="#be123c">Cannot sort arbitrary floats or huge sparse ranges (k = 10^12 exhausts RAM) without radix digit decomposition.</text>
</svg>
