<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="title desc">
  <title id="title">Circular Ring Buffer Deque, Two-Stack FIFO Queue, and O(1) Min-Stack</title>
  <desc id="desc">Animated data structure mechanics showing circular ring buffer wrap-around indexing (head + i) &amp; (cap - 1), CLRS 10.1-6 FIFO queue from two LIFO stacks inbox and outbox with potential Phi = |inbox|, and synchronized Min-Stack maintaining duplicate-safe minimums.</desc>
  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    @keyframes pulseSlot {
      0%, 100% { stroke-width: 1.5; opacity: 0.9; }
      50% { stroke-width: 3; opacity: 1; }
    }
    @keyframes wrapToken {
      0%, 20% { transform: translate(0px, 0px); }
      45%, 65% { transform: translate(-490px, 0px); }
      85%, 100% { transform: translate(0px, 0px); }
    }
    @keyframes stackTransfer {
      0%, 25% { transform: translate(0px, 0px); opacity: 1; }
      55%, 80% { transform: translate(232px, 0px); opacity: 1; }
      95%, 100% { transform: translate(0px, 0px); opacity: 0.9; }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 24; }
      100% { stroke-dashoffset: 0; }
    }

    .slot-wrap { animation: pulseSlot 3s ease-in-out infinite; }
    .wrap-badge { animation: wrapToken 8s ease-in-out infinite; }
    .xfer-item { animation: stackTransfer 8s ease-in-out infinite; }
    .flow-arc { stroke-dasharray: 6 4; animation: dashMove 2s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
      .wrap-badge, .xfer-item { transform: none !important; opacity: 1 !important; }
    }
  </style>

  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1200" height="820" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="1200" height="64" rx="12" fill="#0f172a"/>
  <rect x="0" y="48" width="1200" height="16" fill="#0f172a"/>
  <text x="24" y="28" class="sans" font-size="18" font-weight="700" fill="#f8fafc">Linear Queues &amp; Augmented Stacks: Ring Buffer, Two-Stack Queue &amp; Min-Stack</text>
  <text x="24" y="49" class="sans" font-size="12" fill="#94a3b8">Eliminating O(n) shift() stalls with power-of-two bitmask wrap-around, amortized stack reversal, and O(1) min tracking</text>

  <!-- ==================== TOP LEFT: CIRCULAR RING BUFFER ==================== -->
  <rect x="20" y="80" width="580" height="390" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="20" y="80" width="580" height="36" rx="10" fill="#eff6ff"/>
  <rect x="20" y="106" width="580" height="10" fill="#eff6ff"/>
  <text x="36" y="103" class="sans" font-size="13" font-weight="700" fill="#1e3a8a">1. Circular Ring-Buffer Deque (cap = 8 = 2^3, mask = 7)</text>
  <rect x="466" y="87" width="120" height="22" rx="11" fill="#2563eb"/>
  <text x="526" y="102" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">O(1) push/pop</text>

  <!-- Linear backing array representation (cap=8) -->
  <text x="36" y="138" class="sans" font-size="11" font-weight="700" fill="#0f172a">Backing Buffer [0..7] with Wrap-Around:</text>
  <text x="582" y="138" class="mono" font-size="10.5" fill="#2563eb" text-anchor="end">idx = (head + i) &amp; (cap - 1)</text>

  <!-- 8 slots: x starts 36, width=64, gap=6 -> stride=70 -->
  <text x="68" y="160" class="mono" font-size="10" fill="#64748b" text-anchor="middle">[0]</text>
  <rect x="36" y="166" width="64" height="44" rx="6" fill="#ecfdf5" stroke="#059669" class="slot-wrap"/>
  <text x="68" y="193" class="mono" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">D4</text>

  <text x="138" y="160" class="mono" font-size="10" fill="#64748b" text-anchor="middle">[1]</text>
  <rect x="106" y="166" width="64" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3 2"/>
  <text x="138" y="193" class="mono" font-size="11" fill="#94a3b8" text-anchor="middle">empty</text>

  <text x="208" y="160" class="mono" font-size="10" fill="#64748b" text-anchor="middle">[2]</text>
  <rect x="176" y="166" width="64" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3 2"/>
  <text x="208" y="193" class="mono" font-size="11" fill="#94a3b8" text-anchor="middle">empty</text>

  <text x="278" y="160" class="mono" font-size="10" fill="#64748b" text-anchor="middle">[3]</text>
  <rect x="246" y="166" width="64" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3 2"/>
  <text x="278" y="193" class="mono" font-size="11" fill="#94a3b8" text-anchor="middle">empty</text>

  <text x="348" y="160" class="mono" font-size="10" fill="#64748b" text-anchor="middle">[4]</text>
  <rect x="316" y="166" width="64" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3 2"/>
  <text x="348" y="193" class="mono" font-size="11" fill="#94a3b8" text-anchor="middle">empty</text>

  <text x="418" y="160" class="mono" font-size="10" font-weight="700" fill="#2563eb" text-anchor="middle">[5] head</text>
  <rect x="386" y="166" width="64" height="44" rx="6" fill="#2563eb"/>
  <text x="418" y="193" class="mono" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">D1</text>

  <text x="488" y="160" class="mono" font-size="10" fill="#64748b" text-anchor="middle">[6]</text>
  <rect x="456" y="166" width="64" height="44" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="488" y="193" class="mono" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">D2</text>

  <text x="558" y="160" class="mono" font-size="10" fill="#64748b" text-anchor="middle">[7]</text>
  <rect x="526" y="166" width="64" height="44" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="558" y="193" class="mono" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">D3</text>

  <!-- Animated wrap arc from [7] back to [0] -->
  <path d="M 558 214 C 558 258, 68 258, 68 214" fill="none" stroke="#059669" stroke-width="2.2" class="flow-arc" marker-end="url(#arr-emerald)"/>
  <g class="wrap-badge">
    <rect x="526" y="232" width="64" height="22" rx="11" fill="#059669"/>
    <text x="558" y="247" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">wrap &amp; 7</text>
  </g>

  <!-- Pointers &amp; Formula Card -->
  <rect x="36" y="272" width="548" height="182" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="50" y="294" class="mono" font-size="11" font-weight="700" fill="#1e3a8a">head = 5,  size = 4,  tail = (5 + 4) &amp; 7 = 1</text>
  <text x="50" y="316" class="mono" font-size="10.5" fill="#065f46">• pushBack(x):  buf[(head + size++) &amp; (cap - 1)] = x</text>
  <text x="50" y="336" class="mono" font-size="10.5" fill="#065f46">• pushFront(x): head = (head - 1) &amp; (cap - 1); buf[head] = x</text>
  <text x="50" y="356" class="mono" font-size="10.5" fill="#065f46">• popFront():   x = buf[head]; head = (head + 1) &amp; (cap - 1)</text>
  <line x1="50" y1="370" x2="568" y2="370" stroke="#e2e8f0"/>
  <text x="50" y="390" class="sans" font-size="10.5" font-weight="700" fill="#9f1239">Anti-Pattern: Array.prototype.shift()</text>
  <text x="50" y="408" class="sans" font-size="10" fill="#475569">Spec requires Θ(n) element shifts; V8 left-trims small arrays but degrades to O(n)</text>
  <text x="50" y="424" class="sans" font-size="10" fill="#475569">memmove in large object space (~512 KB+). Ring buffer guarantees O(1) everywhere.</text>
  <text x="50" y="442" class="mono" font-size="10" fill="#2563eb">Safe alternative: head-index + compact when 2*head &gt;= items.length (amortized O(1)).</text>

  <!-- ==================== TOP RIGHT: TWO-STACK QUEUE ==================== -->
  <rect x="620" y="80" width="560" height="390" rx="10" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
  <rect x="620" y="80" width="560" height="36" rx="10" fill="#fffbeb"/>
  <rect x="620" y="106" width="560" height="10" fill="#fffbeb"/>
  <text x="636" y="103" class="sans" font-size="13" font-weight="700" fill="#92400e">2. FIFO Queue from Two LIFO Stacks (CLRS 10.1-6)</text>
  <rect x="1044" y="87" width="122" height="22" rx="11" fill="#d97706"/>
  <text x="1105" y="102" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Φ = |inbox|</text>

  <!-- Inbox Stack -->
  <rect x="646" y="132" width="150" height="186" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="721" y="152" class="sans" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle">inbox (LIFO)</text>
  <text x="721" y="168" class="mono" font-size="10" fill="#b45309" text-anchor="middle">enqueue(x) → push</text>

  <rect x="671" y="268" width="100" height="34" rx="5" fill="#f59e0b"/>
  <text x="721" y="290" class="mono" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1 (oldest)</text>
  <rect x="671" y="226" width="100" height="34" rx="5" fill="#fbbf24"/>
  <text x="721" y="248" class="mono" font-size="12" font-weight="700" fill="#78350f" text-anchor="middle">2</text>
  <g class="xfer-item">
    <rect x="671" y="184" width="100" height="34" rx="5" fill="#d97706"/>
    <text x="721" y="206" class="mono" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3 (newest)</text>
  </g>

  <!-- Transfer Arrow -->
  <path d="M 804 205 L 986 205" fill="none" stroke="#d97706" stroke-width="2.5" class="flow-arc" marker-end="url(#arr-amber)"/>
  <rect x="814" y="154" width="164" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="896" y="172" class="mono" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">if outbox empty:</text>
  <text x="896" y="188" class="mono" font-size="10" fill="#78350f" text-anchor="middle">pop(inbox) → push(outbox)</text>
  <text x="896" y="232" class="sans" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">Reverses LIFO → FIFO!</text>

  <!-- Outbox Stack -->
  <rect x="996" y="132" width="156" height="186" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="1074" y="152" class="sans" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">outbox (LIFO)</text>
  <text x="1074" y="168" class="mono" font-size="10" fill="#047857" text-anchor="middle">dequeue() ← pop</text>

  <rect x="1024" y="268" width="100" height="34" rx="5" fill="#a7f3d0" stroke="#059669"/>
  <text x="1074" y="290" class="mono" font-size="12" font-weight="700" fill="#064e3b" text-anchor="middle">3 (newest)</text>
  <rect x="1024" y="226" width="100" height="34" rx="5" fill="#34d399"/>
  <text x="1074" y="248" class="mono" font-size="12" font-weight="700" fill="#064e3b" text-anchor="middle">2</text>
  <rect x="1024" y="184" width="100" height="34" rx="5" fill="#059669"/>
  <text x="1074" y="206" class="mono" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1 (front!)</text>

  <!-- Two-stack Invariant + Latency Caveat -->
  <rect x="646" y="330" width="506" height="124" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="660" y="352" class="sans" font-size="11" font-weight="700" fill="#0f172a">Invariant &amp; Amortized Bound (Module 02 §8.1)</text>
  <text x="660" y="372" class="sans" font-size="10.5" fill="#334155">Reading outbox top→bottom then inbox bottom→top yields exact FIFO order.</text>
  <text x="660" y="392" class="mono" font-size="10.5" fill="#065f46">Each item: 1 push(inbox) + ≤1 transfer + 1 pop(outbox) ≤ 3 ops ⇒ O(1) amort.</text>
  <rect x="660" y="406" width="478" height="36" rx="5" fill="#fff1f2" stroke="#fda4af"/>
  <text x="672" y="422" class="sans" font-size="10" font-weight="700" fill="#9f1239">Tail-Latency Caveat:</text>
  <text x="794" y="422" class="sans" font-size="10" fill="#881337">A single dequeue after n enqueues moves all n items in Θ(n) time!</text>
  <text x="672" y="436" class="mono" font-size="10" fill="#9f1239">Never hide Θ(n) batch transfer behind a lock on a p99 latency-sensitive path.</text>

  <!-- ==================== BOTTOM: MIN-STACK ==================== -->
  <rect x="20" y="486" width="1160" height="314" rx="10" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <rect x="20" y="486" width="1160" height="36" rx="10" fill="#f5f3ff"/>
  <rect x="20" y="512" width="1160" height="10" fill="#f5f3ff"/>
  <text x="36" y="509" class="sans" font-size="13" font-weight="700" fill="#5b21b6">3. O(1) Min-Stack: Synchronized Prefix-Minimum Array (Duplicate-Safe)</text>
  <rect x="974" y="493" width="192" height="22" rx="11" fill="#7c3aed"/>
  <text x="1070" y="508" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Invariant: mins.len == data.len</text>

  <!-- Parallel arrays across push(5), push(3), push(3), push(7), pop() -->
  <text x="40" y="556" class="mono" font-size="11" font-weight="700" fill="#1e3a8a">data[i]:</text>
  <text x="40" y="614" class="mono" font-size="11" font-weight="700" fill="#5b21b6">mins[i]:</text>
  <text x="40" y="662" class="sans" font-size="10.5" font-weight="700" fill="#475569">Op trace:</text>

  <!-- Slot 0: push(5) -->
  <rect x="130" y="534" width="120" height="40" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="190" y="559" class="mono" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">5</text>
  <rect x="130" y="590" width="120" height="40" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="190" y="615" class="mono" font-size="14" font-weight="700" fill="#5b21b6" text-anchor="middle">5</text>
  <text x="190" y="662" class="mono" font-size="10.5" fill="#334155" text-anchor="middle">push(5) → min=5</text>

  <!-- Slot 1: push(3) -->
  <rect x="274" y="534" width="120" height="40" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="334" y="559" class="mono" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">3</text>
  <rect x="274" y="590" width="120" height="40" rx="6" fill="#7c3aed"/>
  <text x="334" y="615" class="mono" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="334" y="662" class="mono" font-size="10.5" fill="#059669" text-anchor="middle">push(3) → new min 3</text>

  <!-- Slot 2: push(3) duplicate! -->
  <rect x="418" y="534" width="120" height="40" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="478" y="559" class="mono" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">3 (dup)</text>
  <rect x="418" y="590" width="120" height="40" rx="6" fill="#7c3aed"/>
  <text x="478" y="615" class="mono" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3 (dup!)</text>
  <text x="478" y="662" class="mono" font-size="10.5" fill="#5b21b6" text-anchor="middle">push(3) → keep 3!</text>

  <!-- Slot 3: push(7) -->
  <rect x="562" y="534" width="120" height="40" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="622" y="559" class="mono" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">7</text>
  <rect x="562" y="590" width="120" height="40" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="622" y="615" class="mono" font-size="14" font-weight="700" fill="#5b21b6" text-anchor="middle">3</text>
  <text x="622" y="662" class="mono" font-size="10.5" fill="#334155" text-anchor="middle">push(7) → min(7,3)=3</text>

  <!-- Pop indicator -->
  <rect x="710" y="534" width="150" height="96" rx="8" fill="#ecfdf5" stroke="#059669" class="slot-wrap"/>
  <text x="785" y="562" class="mono" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">pop() pops BOTH</text>
  <text x="785" y="584" class="mono" font-size="10.5" fill="#047857" text-anchor="middle">data.pop() &amp;</text>
  <text x="785" y="602" class="mono" font-size="10.5" fill="#047857" text-anchor="middle">mins.pop()</text>
  <text x="785" y="620" class="mono" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">getMin() = mins.at(-1)</text>

  <!-- Formula + Duplicate Pitfall Box -->
  <rect x="880" y="534" width="284" height="140" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="896" y="556" class="sans" font-size="11" font-weight="700" fill="#0f172a">Rule &amp; Duplicate Trap</text>
  <text x="896" y="576" class="mono" font-size="10" fill="#5b21b6">mins[i] = min(data[0..i])</text>
  <text x="896" y="596" class="sans" font-size="10" fill="#334155">Space-saving trick (push to mins</text>
  <text x="896" y="612" class="sans" font-size="10" fill="#334155">only on x &lt; min) FAILS on duplicates:</text>
  <text x="896" y="630" class="mono" font-size="10" fill="#be123c">popping one 3 would erase min=3</text>
  <text x="896" y="646" class="mono" font-size="10" fill="#be123c">while another 3 remains in data!</text>
  <text x="896" y="664" class="mono" font-size="10" font-weight="700" fill="#059669">Always push x &lt;= mins.at(-1) (or always).</text>

  <!-- Bottom note -->
  <rect x="36" y="690" width="1128" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="52" y="714" class="sans" font-size="11.5" font-weight="700" fill="#0f172a">Comparison Summary (Module 02 §3 &amp; §8)</text>
  <text x="52" y="736" class="mono" font-size="10.5" fill="#1e3a8a">• Ring-Buffer Deque: Worst-case O(1) push/pop both ends (except resize) · Contiguous cache-friendly memory · No pointer-chasing</text>
  <text x="52" y="756" class="mono" font-size="10.5" fill="#92400e">• Two-Stack Queue:   Amortized O(1) · Single dequeue can stall Θ(n) · Useful when only LIFO primitives exist</text>
  <text x="52" y="776" class="mono" font-size="10.5" fill="#5b21b6">• Min-Stack:         Strict worst-case O(1) push, pop, top, and getMin · 2× memory (or &lt;= guard for duplicates)</text>
</svg>
