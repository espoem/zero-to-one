<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="title desc">
  <title id="title">Lock-Free Treiber Stack: CAS Spin Loop, ABA Problem Race, and Tagged Pointer Defense</title>
  <desc id="desc">Three-panel animated diagram matching Module 14: Panel 1 shows the hardware Compare-And-Swap (CAS) spin loop on TreiberStack top; Panel 2 animates the ABA problem where Thread 1 reads top=A (next=B), is preempted while Thread 2 pops A and B and pushes A back (top-&gt;A-&gt;C), causing Thread 1's CAS(top, A, B) to succeed and corrupt the stack; Panel 3 shows double-width Tagged Version Pointers (ptr, tag+1) via CMPXCHG16B rejecting stale tag v0 != v3.</desc>
  <defs>
    <style>
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

      .cas-retry  {  stroke-dasharray: 5 4; }
      .aba-s1     { animation: a-s1 12s linear infinite; }
      .aba-s2     { animation: a-s2 12s linear infinite; }
      .aba-s3     { animation: a-s3 12s linear infinite; }
      .tag-bump   { animation: t-bmp 12s linear infinite; }

      
      @keyframes a-s1  { 0%, 30% { opacity: 1; } 36%, 100% { opacity: 0.86; } }
      @keyframes a-s2  { 0%, 30% { opacity: 0.86; } 36%, 66% { opacity: 1; } 72%, 100% { opacity: 0.86; } }
      @keyframes a-s3  { 0%, 66% { opacity: 0.86; } 72%, 100% { opacity: 1; } }
      @keyframes t-bmp { 0%, 34% { opacity: 0.86; } 40%, 100% { opacity: 1; } }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
        .aba-s1, .aba-s2, .aba-s3, .tag-bump { opacity: 1 !important; }
      }
    </style>

    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1200" height="720" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>

  <!-- Header -->
  <line x1="24" y1="64" x2="1176" y2="64" stroke="#1c1917" stroke-width="1.2"/>
  
  <text x="24" y="29" class="sans" font-size="18" font-weight="700" fill="#1c1917" font-family="Georgia, 'Times New Roman', serif">Lock-Free Treiber Stack · CAS Spin Loop, ABA Race &amp; Versioned Pointers</text>
  <text x="24" y="49" class="sans" font-size="12" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">Atomic CAS(&amp;top, old, new) mechanics, why raw pointer equality permits ABA corruption, and double-width (ptr, tag) defense</text>

  <!-- ==================== PANEL 1: CAS SPIN LOOP ==================== -->
  <g transform="translate(24, 78)">
    <rect x="0" y="0" width="372" height="618" rx="10" fill="#ffffff" stroke="#d6d0c4"/>
    <rect x="0" y="0" width="372" height="36" rx="10" fill="#f0fdf9"/>
    <rect x="0" y="26" width="372" height="10" fill="#f0fdf9"/>
    <text x="16" y="23" class="sans" font-size="13" font-weight="700" fill="#065f46">1. Treiber Stack CAS Spin Loop</text>
    <text x="356" y="23" class="mono" font-size="10.5" font-weight="700" fill="#0f766e" text-anchor="end">Lock-Free LIFO</text>

    <!-- Stack Pointer Diagram -->
    <g transform="translate(20, 52)">
      <rect x="0" y="8" width="54" height="32" rx="5" fill="#1c1917"/>
      <text x="27" y="28" class="mono" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">top</text>
      <line x1="54" y1="24" x2="86" y2="24" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-blue)"/>

      <rect x="90" y="4" width="66" height="40" rx="6" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.8"/>
      <text x="123" y="22" class="mono" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">A</text>
      <text x="123" y="36" class="mono" font-size="10" fill="#57534e" text-anchor="middle">0x100</text>
      <line x1="156" y1="24" x2="188" y2="24" stroke="#44403c" stroke-width="1.8" marker-end="url(#arr-blue)"/>

      <rect x="192" y="4" width="66" height="40" rx="6" fill="#faf8f5" stroke="#d6d0c4"/>
      <text x="225" y="22" class="mono" font-size="12" font-weight="700" fill="#44403c" text-anchor="middle">B</text>
      <text x="225" y="36" class="mono" font-size="10" fill="#57534e" text-anchor="middle">0x200</text>
      <line x1="258" y1="24" x2="290" y2="24" stroke="#44403c" stroke-width="1.8" marker-end="url(#arr-blue)"/>

      <text x="314" y="29" class="mono" font-size="11.5" font-weight="700" fill="#57534e" text-anchor="middle">null</text>
    </g>

    <!-- Spin Loop Flowchart -->
    <g transform="translate(36, 124)">
      <rect x="0" y="0" width="246" height="58" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.6"/>
      <text x="14" y="22" class="sans" font-size="12" font-weight="700" fill="#065f46">1. Read Snapshot</text>
      <text x="14" y="42" class="mono" font-size="11" fill="#44403c">oldTop = atomic_load(&amp;top)</text>

      <line x1="123" y1="58" x2="123" y2="88" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-blue)"/>

      <rect x="0" y="92" width="246" height="58" rx="8" fill="#f5f1e8" stroke="#0f766e" stroke-width="1.6"/>
      <text x="14" y="114" class="sans" font-size="12" font-weight="700" fill="#065f46">2. Compute Locally</text>
      <text x="14" y="134" class="mono" font-size="11" fill="#44403c">nextNode = oldTop.next (B)</text>

      <line x1="123" y1="150" x2="123" y2="180" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-blue)"/>

      <rect x="0" y="184" width="246" height="66" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
      <text x="14" y="206" class="sans" font-size="12" font-weight="700" fill="#92400e">3. Atomic Hardware Check</text>
      <text x="14" y="226" class="mono" font-size="11" font-weight="700" fill="#b45309">CAS(&amp;top, oldTop, nextNode)</text>
      <text x="14" y="242" class="sans" font-size="10" fill="#92400e">Single indivisible CPU instruction</text>

      <!-- Retry Loop Arrow (right side) -->
      <path class="cas-retry" d="M 246 217 L 304 217 L 304 29 L 250 29" fill="none" stroke="#b45309" stroke-width="2.2" marker-end="url(#arr-amber)"/>
      <rect x="260" y="108" width="66" height="36" rx="5" fill="#fffbeb" stroke="#b45309"/>
      <text x="293" y="123" class="mono" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">FAIL</text>
      <text x="293" y="136" class="sans" font-size="10" fill="#92400e" text-anchor="middle">retry</text>

      <!-- Success Output -->
      <line x1="123" y1="250" x2="123" y2="288" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr-emerald)"/>
      <rect x="0" y="292" width="246" height="58" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.8"/>
      <text x="123" y="315" class="sans" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">4. Success: return A.value</text>
      <text x="123" y="335" class="sans" font-size="10.5" fill="#0f766e" text-anchor="middle">System-wide progress guaranteed</text>
    </g>

    <rect x="16" y="494" width="340" height="106" rx="8" fill="#faf8f5" stroke="#d6d0c4"/>
    <text x="28" y="518" class="sans" font-size="12" font-weight="700" fill="#1c1917">Lock-Free Guarantee &amp; Hazard</text>
    <text x="28" y="540" class="sans" font-size="11" fill="#44403c">&#8226; If one thread stalls, others still complete.</text>
    <text x="28" y="560" class="sans" font-size="11" fill="#991b1b">&#8226; Danger: CAS checks ONLY address equality</text>
    <text x="28" y="578" class="mono" font-size="10.5" fill="#991b1b">  (*addr == expected) -&gt; ABA vulnerability!</text>
  </g>

  <!-- ==================== PANEL 2: THE ABA PROBLEM ==================== -->
  <g transform="translate(414, 78)">
    <rect x="0" y="0" width="372" height="618" rx="10" fill="#ffffff" stroke="#d6d0c4"/>
    <rect x="0" y="0" width="372" height="36" rx="10" fill="#fef2f2"/>
    <rect x="0" y="26" width="372" height="10" fill="#fef2f2"/>
    <text x="16" y="23" class="sans" font-size="13" font-weight="700" fill="#991b1b">2. The ABA Corruption Race</text>
    <text x="356" y="23" class="mono" font-size="10.5" font-weight="700" fill="#dc2626" text-anchor="end">Raw Pointer CAS</text>

    <!-- Step 1: T1 reads A, preempted -->
    <g class="aba-s1" transform="translate(16, 52)">
      <rect x="0" y="0" width="340" height="150" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.8"/>
      <rect x="12" y="10" width="96" height="22" rx="4" fill="#0f766e"/>
      <text x="60" y="25" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Step 1 · T1</text>
      <text x="118" y="25" class="sans" font-size="11.5" font-weight="700" fill="#065f46">Reads A, then PREEMPTED</text>

      <text x="14" y="54" class="mono" font-size="11.5" fill="#1c1917">Stack: top -&gt; A -&gt; B -&gt; C</text>
      <text x="14" y="78" class="mono" font-size="11" fill="#065f46">T1 loads: oldTop = A, next = B</text>
      <rect x="14" y="94" width="312" height="40" rx="5" fill="#fffbeb" stroke="#b45309"/>
      <text x="170" y="118" class="sans" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">OS pauses T1 right before CAS(&amp;top, A, B)!</text>
    </g>

    <!-- Step 2: T2 pops A, pops B, pushes A back -->
    <g class="aba-s2" transform="translate(16, 218)">
      <rect x="0" y="0" width="340" height="172" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
      <rect x="12" y="10" width="96" height="22" rx="4" fill="#b45309"/>
      <text x="60" y="25" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Step 2 · T2</text>
      <text x="118" y="25" class="sans" font-size="11.5" font-weight="700" fill="#92400e">Mutates A -&gt; B -&gt; A</text>

      <text x="14" y="52" class="mono" font-size="11" fill="#44403c">1. T2 pop()  -&gt; removes A</text>
      <text x="14" y="72" class="mono" font-size="11" fill="#991b1b">2. T2 pop()  -&gt; removes B (FREED!)</text>
      <text x="14" y="92" class="mono" font-size="11" fill="#44403c">3. T2 push(A)-&gt; reuses address A</text>

      <rect x="14" y="108" width="312" height="48" rx="5" fill="#ffffff" stroke="#fde68a"/>
      <text x="170" y="128" class="mono" font-size="11.5" font-weight="700" fill="#1c1917" text-anchor="middle">New Stack: top -&gt; A -&gt; C</text>
      <text x="170" y="146" class="sans" font-size="10.5" fill="#b45309" text-anchor="middle">Pointer address at top is A again (stale B gone!)</text>
    </g>

    <!-- Step 3: T1 wakes up and corrupts stack -->
    <g class="aba-s3" transform="translate(16, 406)">
      <rect x="0" y="0" width="340" height="194" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
      <rect x="12" y="10" width="96" height="22" rx="4" fill="#dc2626"/>
      <text x="60" y="25" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Step 3 · T1</text>
      <text x="118" y="25" class="sans" font-size="11.5" font-weight="700" fill="#991b1b">False CAS Success!</text>

      <text x="14" y="54" class="mono" font-size="11.5" font-weight="700" fill="#1c1917">T1 wakes: CAS(&amp;top, A, B)</text>
      <text x="14" y="76" class="mono" font-size="11" fill="#991b1b">Checks (*top == A): TRUE! (0x100 == 0x100)</text>
      <text x="14" y="98" class="mono" font-size="11.5" font-weight="700" fill="#991b1b">Sets top = B (DANGLING / FREED!)</text>

      <rect x="14" y="116" width="312" height="62" rx="6" fill="#ffffff" stroke="#fda4af"/>
      <text x="170" y="138" class="sans" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="middle">SILENT MEMORY CORRUPTION</text>
      <text x="170" y="158" class="sans" font-size="10.5" fill="#44403c" text-anchor="middle">Node C is orphaned/lost; top points to freed B!</text>
    </g>
  </g>

  <!-- ==================== PANEL 3: TAGGED VERSION POINTERS ==================== -->
  <g transform="translate(804, 78)">
    <rect x="0" y="0" width="372" height="618" rx="10" fill="#ffffff" stroke="#d6d0c4"/>
    <rect x="0" y="0" width="372" height="36" rx="10" fill="#f0fdf9"/>
    <rect x="0" y="26" width="372" height="10" fill="#f0fdf9"/>
    <text x="16" y="23" class="sans" font-size="13" font-weight="700" fill="#065f46">3. Tagged Version Pointer Defense</text>
    <text x="356" y="23" class="mono" font-size="10.5" font-weight="700" fill="#0f766e" text-anchor="end">CMPXCHG16B</text>

    <!-- 128-bit Atomic Word Layout -->
    <g transform="translate(16, 52)">
      <rect x="0" y="0" width="340" height="84" rx="8" fill="#f5f1e8" stroke="#0f766e" stroke-width="1.6"/>
      <text x="170" y="22" class="sans" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">128-bit Double-Width Atomic Head</text>
      <rect x="16" y="34" width="150" height="36" rx="5" fill="#ffffff" stroke="#0f766e"/>
      <text x="91" y="56" class="mono" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">64-bit ptr: A</text>
      <rect x="174" y="34" width="150" height="36" rx="5" fill="#f5f1e8" stroke="#0f766e"/>
      <text x="249" y="56" class="mono" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">64-bit tag: v++</text>
    </g>

    <!-- Same Race Replay with Tag Counter -->
    <g transform="translate(16, 152)">
      <rect x="0" y="0" width="340" height="92" rx="8" fill="#f0fdf9" stroke="#99f6e4"/>
      <text x="14" y="22" class="mono" font-size="11" font-weight="700" fill="#065f46">1. T1 reads top = (A, v0), next = B</text>
      <text x="14" y="44" class="sans" font-size="11" fill="#44403c">T1 intends: CAS128(&amp;top, (A, v0), (B, v1))</text>
      <text x="14" y="68" class="mono" font-size="10.5" fill="#57534e">Expected version tag captured: v0</text>
    </g>

    <g class="tag-bump" transform="translate(16, 258)">
      <rect x="0" y="0" width="340" height="114" rx="8" fill="#fffbeb" stroke="#fde68a"/>
      <text x="14" y="22" class="mono" font-size="11" font-weight="700" fill="#92400e">2. T2 mutates stack (monotonic tag):</text>
      <text x="14" y="46" class="mono" font-size="11" fill="#44403c">pop(A)  =&gt; top = (B, v1)</text>
      <text x="14" y="68" class="mono" font-size="11" fill="#44403c">pop(B)  =&gt; top = (C, v2)</text>
      <text x="14" y="90" class="mono" font-size="11" font-weight="700" fill="#b45309">push(A) =&gt; top = (A, v3)</text>
    </g>

    <g transform="translate(16, 386)">
      <rect x="0" y="0" width="340" height="122" rx="8" fill="#f0fdf9" stroke="#0f766e" stroke-width="2"/>
      <text x="14" y="24" class="mono" font-size="11.5" font-weight="700" fill="#065f46">3. T1 wakes: CAS128(&amp;top, (A,v0), (B,v1))</text>
      <text x="14" y="48" class="mono" font-size="11" fill="#44403c">Ptr matches (A == A), BUT tag v0 != v3!</text>
      <text x="14" y="72" class="mono" font-size="11.5" font-weight="700" fill="#0f766e">CAS FAILS CLEANLY -&gt; T1 loops &amp; reloads!</text>
      <text x="14" y="96" class="sans" font-size="10.5" fill="#065f46">Reloads fresh top = (A, v3) with next = C.</text>
    </g>

    <!-- Hazard Pointers Note -->
    <g transform="translate(16, 522)">
      <rect x="0" y="0" width="340" height="78" rx="8" fill="#faf8f5" stroke="#d6d0c4"/>
      <text x="14" y="22" class="sans" font-size="11.5" font-weight="700" fill="#1c1917">Complementary Defense: Hazard Pointers</text>
      <text x="14" y="42" class="sans" font-size="10.5" fill="#44403c">Threads publish active read pointers in TLS,</text>
      <text x="14" y="60" class="sans" font-size="10.5" fill="#44403c">deferring free(B) / EBR until no reader holds it.</text>
    </g>
  </g>
</svg>
