<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 640" width="1160" height="640" role="img" aria-labelledby="title desc">
  <title id="title">1D Knapsack Space Optimization: Reverse Sweep (0/1) vs Forward Sweep (Unbounded)</title>
  <desc id="desc">Side-by-side comparison of 1D DP array updates for item (w=2, v=5) and capacity W=6. Left panel animates 0/1 Knapsack sweeping right-to-left w=6..2 so dp[w-2] comes from the previous row, yielding [0,0,5,5,5,5,5]. Right panel animates Unbounded Knapsack sweeping left-to-right w=2..6 so dp[w-2] chains multiple copies, yielding [0,0,5,5,10,10,15].</desc>
  <style><![CDATA[
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* 9s 3-step sweep */
    @keyframes stepA { 0%, 32% { opacity: 1; } 33%, 100% { opacity: 0; } }
    @keyframes stepB { 0%, 32% { opacity: 0; } 33%, 65% { opacity: 1; } 66%, 100% { opacity: 0; } }
    @keyframes stepC { 0%, 65% { opacity: 0; } 66%, 100% { opacity: 1; } }

    .sa { animation: stepA 9s infinite; }
    .sb { animation: stepB 9s infinite; }
    .sc { animation: stepC 9s infinite; }

    @media (prefers-reduced-motion: reduce) {
      .sa, .sb { animation: none !important; opacity: 0 !important; }
      .sc { animation: none !important; opacity: 1 !important; }
    }
  ]]></style>

  <!-- Canvas & Header -->
  <rect x="0" y="0" width="1160" height="640" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="0" y="0" width="1160" height="60" rx="12" fill="#0f172a"/>
  <rect x="0" y="44" width="1160" height="16" fill="#0f172a"/>
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#f8fafc">1D Knapsack Space Optimization: Reverse Sweep (0/1) vs Forward Sweep (Unbounded)</text>
  <text x="24" y="47" class="sans" font-size="12" fill="#94a3b8">Why inner loop direction controls whether dp[w - weights[i]] reads previous state (i - 1) or current state (i)</text>

  <!-- Item Setup Banner -->
  <rect x="20" y="74" width="1120" height="44" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="38" y="101" class="mono" font-size="12.5" font-weight="700" fill="#5b21b6">Item i: weights[i] = 2, values[i] = 5   |   Capacity W = 6   |   Initial dp[0..6] = [0, 0, 0, 0, 0, 0, 0]</text>

  <!-- LEFT PANEL: 0/1 Knapsack (Right-to-Left) -->
  <rect x="20" y="132" width="548" height="416" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="38" y="158" class="sans" font-size="14" font-weight="700" fill="#0f172a">1. 0/1 Knapsack: Sweep RIGHT-to-LEFT (w = W .. weights[i])</text>
  <rect x="38" y="170" width="512" height="28" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="50" y="188" class="mono" font-size="11.5" font-weight="700" fill="#1e3a8a">for (let w = W; w &gt;= weights[i]; w--)   &lt;-- PREVENTS REUSE</text>

  <!-- Sweep Direction Arrow Left -->
  <line x1="520" y1="222" x2="210" y2="222" stroke="#2563eb" stroke-width="3"/>
  <polygon points="200,222 214,215 214,229" fill="#2563eb"/>
  <text x="365" y="214" class="sans" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">Reverse Sweep: w = 6 -&gt; 5 -&gt; 4 -&gt; 3 -&gt; 2</text>

  <!-- Array Labels w=0..6 (7 cells x 68px = 476px starting at x=54) -->
  <text x="88" y="250" class="mono" font-size="11" font-weight="700" text-anchor="middle" fill="#64748b">w=0</text>
  <text x="156" y="250" class="mono" font-size="11" font-weight="700" text-anchor="middle" fill="#64748b">w=1</text>
  <text x="224" y="250" class="mono" font-size="11" font-weight="700" text-anchor="middle" fill="#1e3a8a">w=2</text>
  <text x="292" y="250" class="mono" font-size="11" font-weight="700" text-anchor="middle" fill="#64748b">w=3</text>
  <text x="360" y="250" class="mono" font-size="11" font-weight="700" text-anchor="middle" fill="#1e3a8a">w=4</text>
  <text x="428" y="250" class="mono" font-size="11" font-weight="700" text-anchor="middle" fill="#64748b">w=5</text>
  <text x="496" y="250" class="mono" font-size="11" font-weight="700" text-anchor="middle" fill="#1e3a8a">w=6</text>

  <!-- Step A: w=6 reads dp[4]=0 -> dp[6]=5 -->
  <g class="sa">
    <rect x="56" y="260" width="64" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="88" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">0</text>
    <rect x="124" y="260" width="64" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="156" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">0</text>
    <rect x="192" y="260" width="64" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="224" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">0</text>
    <rect x="260" y="260" width="64" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="292" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">0</text>
    <rect x="328" y="260" width="64" height="46" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="360" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#92400e">0 (old)</text>
    <rect x="396" y="260" width="64" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="428" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">0</text>
    <rect x="464" y="260" width="64" height="46" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/><text x="496" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#065f46">5</text>

    <path d="M 360 308 Q 428 338 496 308" fill="none" stroke="#2563eb" stroke-width="2"/>
    <rect x="38" y="346" width="512" height="58" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="52" y="368" class="mono" font-size="12" font-weight="700" fill="#1e3a8a">w = 6: dp[6] = max(0, dp[4] + 5) = 0 + 5 = 5</text>
    <text x="52" y="389" class="sans" font-size="11.5" fill="#334155">dp[4] is untouched (still 0 from row i-1), so item is counted once.</text>
  </g>

  <!-- Step B: w=4 reads dp[2]=0 -> dp[4]=5 -->
  <g class="sb">
    <rect x="56" y="260" width="64" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="88" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">0</text>
    <rect x="124" y="260" width="64" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="156" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">0</text>
    <rect x="192" y="260" width="64" height="46" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="224" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#92400e">0 (old)</text>
    <rect x="260" y="260" width="64" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="292" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">0</text>
    <rect x="328" y="260" width="64" height="46" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/><text x="360" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#065f46">5</text>
    <rect x="396" y="260" width="64" height="46" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/><text x="428" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#065f46">5</text>
    <rect x="464" y="260" width="64" height="46" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/><text x="496" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#065f46">5</text>

    <path d="M 224 308 Q 292 338 360 308" fill="none" stroke="#2563eb" stroke-width="2"/>
    <rect x="38" y="346" width="512" height="58" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="52" y="368" class="mono" font-size="12" font-weight="700" fill="#1e3a8a">w = 4: dp[4] = max(0, dp[2] + 5) = 0 + 5 = 5</text>
    <text x="52" y="389" class="sans" font-size="11.5" fill="#334155">dp[2] is STILL 0 because w=2 has not been visited yet in reverse order!</text>
  </g>

  <!-- Step C: Final 0/1 array -->
  <g class="sc">
    <rect x="56" y="260" width="64" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="88" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">0</text>
    <rect x="124" y="260" width="64" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="156" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">0</text>
    <rect x="192" y="260" width="64" height="46" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="224" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#065f46">5</text>
    <rect x="260" y="260" width="64" height="46" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="292" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#065f46">5</text>
    <rect x="328" y="260" width="64" height="46" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="360" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#065f46">5</text>
    <rect x="396" y="260" width="64" height="46" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="428" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#065f46">5</text>
    <rect x="464" y="260" width="64" height="46" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="496" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#065f46">5</text>

    <rect x="38" y="346" width="512" height="58" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="52" y="368" class="mono" font-size="12" font-weight="700" fill="#065f46">Final 0/1 dp[] = [0, 0, 5, 5, 5, 5, 5]  (Max = 5, at most 1 copy)</text>
    <text x="52" y="389" class="sans" font-size="11.5" fill="#334155">w = 2: dp[2] = dp[0] + 5 = 5. Every w &gt;= 2 holds at most 1 copy.</text>
  </g>

  <rect x="38" y="420" width="512" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="52" y="444" class="sans" font-size="12" font-weight="700" fill="#0f172a">Why Reverse Order Preserves 2D Row Invariant</text>
  <text x="52" y="466" class="sans" font-size="11" fill="#334155">• 2D Recurrence: DP[i][w] = max(DP[i-1][w], DP[i-1][w - w[i]] + v[i]).</text>
  <text x="52" y="486" class="sans" font-size="11" fill="#334155">• Dependency is strictly to the LEFT (w - w[i] &lt; w) in the PREVIOUS row (i-1).</text>
  <text x="52" y="506" class="sans" font-size="11" fill="#1e3a8a">• Updating from right to left keeps all cells left of w untouched from row (i-1).</text>

  <!-- RIGHT PANEL: Unbounded Knapsack (Left-to-Right) -->
  <rect x="592" y="132" width="548" height="416" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="610" y="158" class="sans" font-size="14" font-weight="700" fill="#0f172a">2. Unbounded Knapsack: Sweep LEFT-to-RIGHT (w = weights[i] .. W)</text>
  <rect x="610" y="170" width="512" height="28" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="622" y="188" class="mono" font-size="11.5" font-weight="700" fill="#92400e">for (let w = weights[i]; w &lt;= W; w++)   &lt;-- ALLOWS UNLIMITED REUSE</text>

  <!-- Sweep Direction Arrow Right -->
  <line x1="770" y1="222" x2="1080" y2="222" stroke="#d97706" stroke-width="3"/>
  <polygon points="1090,222 1076,215 1076,229" fill="#d97706"/>
  <text x="930" y="214" class="sans" font-size="11.5" font-weight="700" text-anchor="middle" fill="#92400e">Forward Sweep: w = 2 -&gt; 3 -&gt; 4 -&gt; 5 -&gt; 6</text>

  <!-- Array Labels w=0..6 -->
  <text x="660" y="250" class="mono" font-size="11" font-weight="700" text-anchor="middle" fill="#64748b">w=0</text>
  <text x="728" y="250" class="mono" font-size="11" font-weight="700" text-anchor="middle" fill="#64748b">w=1</text>
  <text x="796" y="250" class="mono" font-size="11" font-weight="700" text-anchor="middle" fill="#92400e">w=2</text>
  <text x="864" y="250" class="mono" font-size="11" font-weight="700" text-anchor="middle" fill="#64748b">w=3</text>
  <text x="932" y="250" class="mono" font-size="11" font-weight="700" text-anchor="middle" fill="#92400e">w=4</text>
  <text x="1000" y="250" class="mono" font-size="11" font-weight="700" text-anchor="middle" fill="#64748b">w=5</text>
  <text x="1068" y="250" class="mono" font-size="11" font-weight="700" text-anchor="middle" fill="#92400e">w=6</text>

  <!-- Step A: w=2 reads dp[0]=0 -> dp[2]=5 -->
  <g class="sa">
    <rect x="628" y="260" width="64" height="46" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="660" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#92400e">0</text>
    <rect x="696" y="260" width="64" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="728" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">0</text>
    <rect x="764" y="260" width="64" height="46" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/><text x="796" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#065f46">5</text>
    <rect x="832" y="260" width="64" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="864" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">0</text>
    <rect x="900" y="260" width="64" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="932" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">0</text>
    <rect x="968" y="260" width="64" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="1000" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">0</text>
    <rect x="1036" y="260" width="64" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="1068" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">0</text>

    <path d="M 660 308 Q 728 338 796 308" fill="none" stroke="#d97706" stroke-width="2"/>
    <rect x="610" y="346" width="512" height="58" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="624" y="368" class="mono" font-size="12" font-weight="700" fill="#92400e">w = 2: dp[2] = max(0, dp[0] + 5) = 5  (1st copy stored in dp[2])</text>
    <text x="624" y="389" class="sans" font-size="11.5" fill="#334155">Now dp[2] is 5, visible to all larger capacities w &gt; 2 in this same pass!</text>
  </g>

  <!-- Step B: w=4 reads newly updated dp[2]=5 -> dp[4]=10 -->
  <g class="sb">
    <rect x="628" y="260" width="64" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="660" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">0</text>
    <rect x="696" y="260" width="64" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="728" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">0</text>
    <rect x="764" y="260" width="64" height="46" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="796" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#92400e">5 (new)</text>
    <rect x="832" y="260" width="64" height="46" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/><text x="864" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#065f46">5</text>
    <rect x="900" y="260" width="64" height="46" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/><text x="932" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#5b21b6">10</text>
    <rect x="968" y="260" width="64" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="1000" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">0</text>
    <rect x="1036" y="260" width="64" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="1068" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">0</text>

    <path d="M 796 308 Q 864 338 932 308" fill="none" stroke="#7c3aed" stroke-width="2"/>
    <rect x="610" y="346" width="512" height="58" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="624" y="368" class="mono" font-size="12" font-weight="700" fill="#5b21b6">w = 4: dp[4] = max(0, dp[2] + 5) = 5 + 5 = 10  (2nd copy chained!)</text>
    <text x="624" y="389" class="sans" font-size="11.5" fill="#334155">Reads newly written dp[2]=5 from pass i, compounding item i again.</text>
  </g>

  <!-- Step C: w=6 reads dp[4]=10 -> dp[6]=15 -->
  <g class="sc">
    <rect x="628" y="260" width="64" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="660" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">0</text>
    <rect x="696" y="260" width="64" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="728" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">0</text>
    <rect x="764" y="260" width="64" height="46" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="796" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#92400e">5</text>
    <rect x="832" y="260" width="64" height="46" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="864" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#92400e">5</text>
    <rect x="900" y="260" width="64" height="46" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="932" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#5b21b6">10</text>
    <rect x="968" y="260" width="64" height="46" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="1000" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#5b21b6">10</text>
    <rect x="1036" y="260" width="64" height="46" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/><text x="1068" y="288" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#065f46">15</text>

    <path d="M 932 308 Q 1000 338 1068 308" fill="none" stroke="#059669" stroke-width="2"/>
    <rect x="610" y="346" width="512" height="58" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="624" y="368" class="mono" font-size="12" font-weight="700" fill="#065f46">Final Unbounded dp[] = [0, 0, 5, 5, 10, 10, 15]  (3 copies!)</text>
    <text x="624" y="389" class="sans" font-size="11.5" fill="#334155">w = 6: dp[6] = dp[4] + 5 = 10 + 5 = 15 (three copies of weight 2).</text>
  </g>

  <rect x="610" y="420" width="512" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="624" y="444" class="sans" font-size="12" font-weight="700" fill="#0f172a">Why Forward Order Chains Unlimited Copies</text>
  <text x="624" y="466" class="sans" font-size="11" fill="#334155">• 2D Recurrence: DP[i][w] = max(DP[i-1][w], DP[i][w - w[i]] + v[i]).</text>
  <text x="624" y="486" class="sans" font-size="11" fill="#334155">• Dependency is to the LEFT in the CURRENT row (i), already updated earlier in loop.</text>
  <text x="624" y="506" class="sans" font-size="11" fill="#92400e">• Classic applications: Coin Change (min coins) and Rod Cutting use forward sweep.</text>

  <!-- Footer -->
  <rect x="20" y="562" width="1120" height="60" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="38" y="586" class="mono" font-size="11.5" font-weight="700" fill="#0f172a">Time: O(n · W)   |   Space: O(W) (reduced from O(n · W))</text>
  <text x="38" y="606" class="sans" font-size="11" fill="#475569">Interview Trap: Reversing the loop direction in 0/1 Knapsack silently turns it into Unbounded Knapsack and overcounts items!</text>
</svg>
