<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="title desc">
  <title id="title">Floyd's Tortoise and Hare Cycle Detection: Phase 1 Meeting &amp; Phase 2 Entry Proof</title>
  <desc id="desc">Animated rho-shaped linked list with tail mu = 3 and cycle length lambda = 5 demonstrating Phase 1 tortoise (+1) and hare (+2) meeting at step k = 5 on node 5 (not the entry node), followed by Phase 2 lock-step pointers from head 0 and meeting node 5 converging at cycle entry node 3 after mu = 3 steps.</desc>
  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* Phase 1 tortoise (+1) and hare (+2) path animations (10s cycle) */
    @keyframes tortStep {
      0%, 10% { transform: translate(0px, 0px); } /* node 0: (90, 270) */
      20% { transform: translate(110px, 0px); } /* node 1 */
      35% { transform: translate(220px, 0px); } /* node 2 */
      50% { transform: translate(330px, 0px); } /* node 3 (entry) */
      65% { transform: translate(430px, -85px); } /* node 4 */
      80%, 100% { transform: translate(555px, -55px); } /* node 5 (meet k=5!) */
    }
    @keyframes hareStep {
      0%, 10% { transform: translate(0px, 0px); } /* node 0 */
      20% { transform: translate(220px, 0px); } /* node 2 (k=1) */
      35% { transform: translate(430px, -85px); } /* node 4 (k=2) */
      50% { transform: translate(590px, 50px); } /* node 6 (k=3) */
      65% { transform: translate(330px, 0px); } /* node 3 (k=4) */
      80%, 100% { transform: translate(555px, -55px); } /* node 5 (k=5!) */
    }
    @keyframes p2A {
      0%, 15% { transform: translate(0px, 0px); } /* node 0 */
      40% { transform: translate(110px, 0px); } /* node 1 */
      65% { transform: translate(220px, 0px); } /* node 2 */
      85%, 100% { transform: translate(330px, 0px); } /* node 3 (entry!) */
    }
    @keyframes p2B {
      0%, 15% { transform: translate(555px, -55px); } /* node 5 */
      40% { transform: translate(590px, 50px); } /* node 6 */
      65% { transform: translate(465px, 95px); } /* node 7 */
      85%, 100% { transform: translate(330px, 0px); } /* node 3 (entry!) */
    }

    .tortoise-p1 { animation: tortStep 10s ease-in-out infinite; }
    .hare-p1 { animation: hareStep 10s ease-in-out infinite; }
    .ptr2-head { animation: p2A 10s ease-in-out infinite; }
    .ptr2-meet { animation: p2B 10s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
      .tortoise-p1, .hare-p1, .ptr2-head, .ptr2-meet { transform: none !important; }
      .meet-ring { opacity: 1 !important; }
    }
  </style>

  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#44403c"/>
    </marker>
    <marker id="arr-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1200" height="780" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>

  <!-- Header -->
  <line x1="24" y1="66" x2="1176" y2="66" stroke="#1c1917" stroke-width="1.2"/>
  
  <text x="24" y="28" class="sans" font-size="18" font-weight="700" fill="#1c1917" font-family="Georgia, 'Times New Roman', serif">Floyd's Tortoise &amp; Hare Cycle Detection (μ = 3 Tail, λ = 5 Cycle)</text>
  <text x="24" y="49" class="sans" font-size="12" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">Phase 1 meets at smallest k ≥ max(μ, 1) with λ | k (k = 5 ≠ entry!) · Phase 2 finds exact entry in μ steps · O(μ + λ) time, O(1) space</text>

  <!-- ==================== TOP: PHASE 1 GRAPH ==================== -->
  <rect x="20" y="80" width="760" height="340" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="20" y="80" width="760" height="36" rx="10" fill="#f0fdf9"/>
  <rect x="20" y="106" width="760" height="10" fill="#f0fdf9"/>
  <text x="36" y="103" class="sans" font-size="13" font-weight="700" fill="#065f46">Phase 1: Tortoise (+1) &amp; Hare (+2) Meet at k = 5 (Node 5)</text>
  <text x="764" y="103" class="mono" font-size="11" font-weight="700" fill="#0f766e" text-anchor="end">2k ≡ k (mod λ) ⇔ λ | k</text>

  <!-- Tail edges: 0 -> 1 -> 2 -> 3 -->
  <line x1="114" y1="270" x2="170" y2="270" stroke="#44403c" stroke-width="2" marker-end="url(#arr-slate)"/>
  <line x1="224" y1="270" x2="280" y2="270" stroke="#44403c" stroke-width="2" marker-end="url(#arr-slate)"/>
  <line x1="334" y1="270" x2="390" y2="270" stroke="#44403c" stroke-width="2" marker-end="url(#arr-slate)"/>

  <!-- Cycle edges: 3(420,270) -> 4(520,185) -> 5(645,215) -> 6(680,320) -> 7(555,365) -> 3(420,270) -->
  <line x1="440" y1="252" x2="497" y2="202" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-violet)"/>
  <line x1="546" y1="192" x2="617" y2="208" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-violet)"/>
  <line x1="654" y1="240" x2="672" y2="292" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-violet)"/>
  <line x1="654" y1="330" x2="583" y2="355" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-violet)"/>
  <line x1="532" y1="350" x2="444" y2="286" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-violet)"/>

  <!-- Nodes -->
  <circle cx="90" cy="270" r="24" fill="#f0fdf9" stroke="#0f766e" stroke-width="2"/><text x="90" y="275" class="mono" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">0</text>
  <text x="90" y="308" class="mono" font-size="10" fill="#57534e" text-anchor="middle">head</text>

  <circle cx="200" cy="270" r="24" fill="#f0fdf9" stroke="#0f766e" stroke-width="2"/><text x="200" y="275" class="mono" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">1</text>
  <circle cx="310" cy="270" r="24" fill="#f0fdf9" stroke="#0f766e" stroke-width="2"/><text x="310" y="275" class="mono" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">2</text>

  <!-- Entry node 3 -->
  <circle cx="420" cy="270" r="26" fill="#f0fdf9" stroke="#0f766e" stroke-width="2.5"/><text x="420" y="275" class="mono" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">3</text>
  <text x="420" y="314" class="mono" font-size="10" font-weight="700" fill="#0f766e" text-anchor="middle">ENTRY (μ=3)</text>

  <!-- Cycle nodes 4, 5, 6, 7 -->
  <circle cx="520" cy="185" r="24" fill="#f5f1e8" stroke="#0f766e" stroke-width="2"/><text x="520" y="190" class="mono" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">4</text>

  <!-- Meeting node 5 -->
  <circle cx="645" cy="215" r="32" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="4 3" class="meet-ring"/>
  <circle cx="645" cy="215" r="24" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="645" y="220" class="mono" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle">5</text>
  <text x="706" y="205" class="mono" font-size="10" font-weight="700" fill="#991b1b">MEET k=5</text>
  <text x="706" y="220" class="mono" font-size="10" fill="#991b1b">(≠ entry!)</text>

  <circle cx="680" cy="320" r="24" fill="#f5f1e8" stroke="#0f766e" stroke-width="2"/><text x="680" y="325" class="mono" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">6</text>
  <circle cx="555" cy="365" r="24" fill="#f5f1e8" stroke="#0f766e" stroke-width="2"/><text x="555" y="370" class="mono" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">7</text>

  <!-- Animated Phase 1 Pointers (origin at node 0: (90, 270)) -->
  <g class="tortoise-p1">
    <rect x="64" y="222" width="52" height="20" rx="10" fill="#0f766e"/>
    <text x="90" y="236" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">T (+1)</text>
  </g>
  <g class="hare-p1">
    <rect x="64" y="318" width="52" height="20" rx="10" fill="#b45309"/>
    <text x="90" y="332" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">H (+2)</text>
  </g>

  <!-- Brace labels for tail mu and cycle lambda -->
  <text x="200" y="146" class="mono" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">Tail length μ = 3</text>
  <text x="592" y="146" class="mono" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">Cycle length λ = 5</text>

  <!-- ==================== BOTTOM: PHASE 2 GRAPH ==================== -->
  <rect x="20" y="436" width="760" height="324" rx="10" fill="#ffffff" stroke="#f0fdf9" stroke-width="1.5"/>
  <rect x="20" y="436" width="760" height="36" rx="10" fill="#f0fdf9"/>
  <rect x="20" y="462" width="760" height="10" fill="#f0fdf9"/>
  <text x="36" y="459" class="sans" font-size="13" font-weight="700" fill="#065f46">Phase 2: Reset p1 to Head (0), Keep p2 at Meet (5), Advance +1</text>
  <text x="764" y="459" class="mono" font-size="11" font-weight="700" fill="#0f766e" text-anchor="end">Converge at Entry after μ = 3 steps!</text>

  <!-- Reuse same geometry shifted down by +350? Let's offset y by +350 (0 at 90, 620) -->
  <line x1="114" y1="620" x2="170" y2="620" stroke="#44403c" stroke-width="2" marker-end="url(#arr-slate)"/>
  <line x1="224" y1="620" x2="280" y2="620" stroke="#44403c" stroke-width="2" marker-end="url(#arr-slate)"/>
  <line x1="334" y1="620" x2="390" y2="620" stroke="#44403c" stroke-width="2" marker-end="url(#arr-slate)"/>

  <line x1="440" y1="602" x2="497" y2="552" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-violet)"/>
  <line x1="546" y1="542" x2="617" y2="558" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-violet)"/>
  <line x1="654" y1="590" x2="672" y2="642" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-violet)"/>
  <line x1="654" y1="680" x2="583" y2="705" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-violet)"/>
  <line x1="532" y1="700" x2="444" y2="636" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-violet)"/>

  <circle cx="90" cy="620" r="24" fill="#f0fdf9" stroke="#0f766e" stroke-width="2"/><text x="90" y="625" class="mono" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">0</text>
  <circle cx="200" cy="620" r="24" fill="#f0fdf9" stroke="#0f766e" stroke-width="2"/><text x="200" y="625" class="mono" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">1</text>
  <circle cx="310" cy="620" r="24" fill="#f0fdf9" stroke="#0f766e" stroke-width="2"/><text x="310" y="625" class="mono" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">2</text>

  <circle cx="420" cy="620" r="32" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="4 3" class="meet-ring"/>
  <circle cx="420" cy="620" r="24" fill="#0f766e"/><text x="420" y="625" class="mono" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="420" y="666" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">p1 = p2 = 3 ★</text>

  <circle cx="520" cy="535" r="24" fill="#f5f1e8" stroke="#0f766e" stroke-width="2"/><text x="520" y="540" class="mono" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">4</text>
  <circle cx="645" cy="565" r="24" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="645" y="570" class="mono" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle">5</text>
  <circle cx="680" cy="670" r="24" fill="#f5f1e8" stroke="#0f766e" stroke-width="2"/><text x="680" y="675" class="mono" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">6</text>
  <circle cx="555" cy="715" r="24" fill="#f5f1e8" stroke="#0f766e" stroke-width="2"/><text x="555" y="720" class="mono" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">7</text>

  <g class="ptr2-head">
    <rect x="64" y="572" width="52" height="20" rx="10" fill="#0f766e"/>
    <text x="90" y="586" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">p1 (+1)</text>
  </g>
  <g class="ptr2-meet">
    <rect x="64" y="668" width="52" height="20" rx="10" fill="#dc2626"/>
    <text x="90" y="682" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">p2 (+1)</text>
  </g>

  <!-- ==================== RIGHT: MATHEMATICAL PROOF &amp; TRACE ==================== -->
  <rect x="796" y="80" width="384" height="680" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <rect x="796" y="80" width="384" height="36" rx="10" fill="#1c1917"/>
  <rect x="796" y="106" width="384" height="10" fill="#1c1917"/>
  <text x="812" y="103" class="sans" font-size="13" font-weight="700" fill="#ffffff">Exact Modular Proof (Module 02 §9.2)</text>

  <!-- Phase 1 Trace Table -->
  <rect x="812" y="132" width="352" height="200" rx="8" fill="#faf8f5" stroke="#d6d0c4"/>
  <text x="826" y="154" class="sans" font-size="11.5" font-weight="700" fill="#065f46">Phase 1 Trace (μ = 3, λ = 5)</text>
  <text x="826" y="176" class="mono" font-size="10.5" fill="#44403c">Step k │ Tortoise (k) │ Hare (2k)</text>
  <line x1="826" y1="184" x2="1150" y2="184" stroke="#d6d0c4"/>
  <text x="826" y="202" class="mono" font-size="10.5" fill="#44403c">  k=0  │    node 0    │   node 0</text>
  <text x="826" y="220" class="mono" font-size="10.5" fill="#44403c">  k=1  │    node 1    │   node 2</text>
  <text x="826" y="238" class="mono" font-size="10.5" fill="#44403c">  k=2  │    node 2    │   node 4</text>
  <text x="826" y="256" class="mono" font-size="10.5" fill="#44403c">  k=3  │    node 3    │   node 6</text>
  <text x="826" y="274" class="mono" font-size="10.5" fill="#44403c">  k=4  │    node 4    │   node 3</text>
  <rect x="822" y="282" width="332" height="22" rx="4" fill="#fef2f2"/>
  <text x="826" y="297" class="mono" font-size="10.5" font-weight="700" fill="#991b1b">  k=5  │    node 5    │   node 5  ★ MEET</text>
  <text x="826" y="322" class="mono" font-size="10" fill="#57534e">Smallest k ≥ max(3, 1) with 5 | k is k = 5.</text>

  <!-- Phase 2 Proof -->
  <rect x="812" y="346" width="352" height="232" rx="8" fill="#f0fdf9" stroke="#99f6e4"/>
  <text x="826" y="368" class="sans" font-size="11.5" font-weight="700" fill="#065f46">Why Phase 2 Finds Cycle Entry</text>
  <text x="826" y="390" class="sans" font-size="10.5" fill="#44403c">At meeting step k:</text>
  <text x="826" y="410" class="mono" font-size="10.5" fill="#065f46">• Tortoise is (k - μ) steps past entry.</text>
  <text x="826" y="430" class="mono" font-size="10.5" fill="#065f46">• Since λ | k, advancing μ more steps:</text>
  <text x="826" y="450" class="mono" font-size="10.5" font-weight="700" fill="#0f766e">  (k - μ) + μ = k ≡ 0 (mod λ) ⇒ ENTRY!</text>
  <line x1="826" y1="464" x2="1150" y2="464" stroke="#f0fdf9"/>
  <text x="826" y="484" class="mono" font-size="10.5" fill="#44403c">Step 0: p1 = 0, p2 = 5 (2 steps in)</text>
  <text x="826" y="502" class="mono" font-size="10.5" fill="#44403c">Step 1: p1 = 1, p2 = 6 (3 steps in)</text>
  <text x="826" y="520" class="mono" font-size="10.5" fill="#44403c">Step 2: p1 = 2, p2 = 7 (4 steps in)</text>
  <text x="826" y="540" class="mono" font-size="10.5" font-weight="700" fill="#065f46">Step 3: p1 = 3, p2 = 3 (5≡0 mod 5) ★</text>
  <text x="826" y="564" class="mono" font-size="10" fill="#065f46">Walk cycle once from 3 to measure λ = 5.</text>

  <!-- Negative / Edge Notes -->
  <rect x="812" y="592" width="352" height="152" rx="8" fill="#fef2f2" stroke="#fda4af"/>
  <text x="826" y="614" class="sans" font-size="11.5" font-weight="700" fill="#991b1b">Common Traps &amp; Alternatives</text>
  <text x="826" y="636" class="sans" font-size="10" fill="#44403c">1. Returning meeting node (5) as entry is WRONG.</text>
  <text x="826" y="656" class="sans" font-size="10" fill="#44403c">2. Hash-set visited uses O(μ + λ) extra memory.</text>
  <text x="826" y="676" class="sans" font-size="10" fill="#44403c">3. Mutating nodes breaks concurrent readers.</text>
  <text x="826" y="698" class="mono" font-size="10" font-weight="700" fill="#991b1b">Floyd: O(μ + λ) time, strictly O(1) space,</text>
  <text x="826" y="716" class="mono" font-size="10" font-weight="700" fill="#991b1b">read-only traversal; max μ + λ steps.</text>
</svg>
