<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Topological Sort: Kahn's In-Degree Reduction vs DFS Post-Order Reversal</title>
  <desc id="desc">Animated side-by-side comparison of Kahn's BFS in-degree reduction queue producing [A, B, C, D] and DFS post-order traversal collecting finish times [D, B, C, A] then reversing to [A, C, B, D] on DAG A-&gt;B, A-&gt;C, B-&gt;D, C-&gt;D.</desc>
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <style>
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

      /* 4-step 10s cycle */
      @keyframes t1 { 0%, 23% { opacity: 1; } 25%, 100% { opacity: 0; } }
      @keyframes t2 { 0%, 23% { opacity: 0; } 25%, 48% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes t3 { 0%, 48% { opacity: 0; } 50%, 73% { opacity: 1; } 75%, 100% { opacity: 0; } }
      @keyframes t4 { 0%, 73% { opacity: 0; } 75%, 100% { opacity: 1; } }

      .tp-1 { animation: t1 10s linear infinite; }
      .tp-2 { animation: t2 10s linear infinite; }
      .tp-3 { animation: t3 10s linear infinite; }
      .tp-4 { animation: t4 10s linear infinite; }

      @media (prefers-reduced-motion: reduce) {
        .tp-1, .tp-2, .tp-3, .tp-4 { animation: none !important; }
        .tp-1, .tp-2, .tp-3 { opacity: 0; }
        .tp-4 { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1200" height="760" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="1200" height="60" rx="12" fill="#0f172a"/>
  <rect x="0" y="44" width="1200" height="16" fill="#0f172a"/>
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#f8fafc">Topological Sorting: Kahn&apos;s Algorithm vs DFS Post-Order Reversal</text>
  <text x="24" y="47" class="sans" font-size="12" fill="#94a3b8">Linearizing DAG Dependencies (u before v for every edge u -&gt; v) in Theta(V + E) Time</text>

  <!-- LEFT PANEL: Kahn's Algorithm -->
  <rect x="24" y="76" width="564" height="574" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="24" y="76" width="564" height="36" rx="10" fill="#f1f5f9"/>
  <rect x="24" y="102" width="564" height="10" fill="#f1f5f9"/>
  <text x="40" y="99" class="sans" font-size="13" font-weight="700" fill="#0f172a">1. Kahn&apos;s Algorithm (BFS In-Degree Reduction)</text>
  <text x="572" y="99" class="mono" font-size="11" fill="#059669" text-anchor="end">Result: [ A, B, C, D ]</text>

  <!-- DAG: A(120,235), B(290,170), C(290,300), D(460,235) -->
  <g stroke="#94a3b8" stroke-width="2.5" fill="none">
    <line x1="142" y1="226" x2="264" y2="178" marker-end="url(#arrow-slate)"/>
    <line x1="142" y1="244" x2="264" y2="292" marker-end="url(#arrow-slate)"/>
    <line x1="314" y1="178" x2="436" y2="226" marker-end="url(#arrow-slate)"/>
    <line x1="314" y1="292" x2="436" y2="244" marker-end="url(#arrow-slate)"/>
  </g>

  <!-- Step 1: Queue [A], pop A -> decrement B(1->0), C(1->0) -->
  <g class="tp-1">
    <g class="mono" font-size="14" font-weight="700" text-anchor="middle">
      <circle cx="120" cy="235" r="24" fill="#2563eb" stroke="#1d4ed8" stroke-width="2.5"/><text x="120" y="240" fill="#ffffff">A</text>
      <circle cx="290" cy="170" r="24" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="290" y="175" fill="#1d4ed8">B</text>
      <circle cx="290" cy="300" r="24" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="290" y="305" fill="#1d4ed8">C</text>
      <circle cx="460" cy="235" r="24" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="460" y="240" fill="#475569">D</text>
    </g>
    <!-- In-degree pills -->
    <g class="mono" font-size="11" font-weight="700" text-anchor="middle">
      <rect x="86" y="266" width="68" height="20" rx="4" fill="#ecfdf5" stroke="#6ee7b7"/><text x="120" y="280" fill="#047857">in: 0</text>
      <rect x="256" y="120" width="68" height="20" rx="4" fill="#fffbeb" stroke="#fcd34d"/><text x="290" y="134" fill="#b45309">in: 1-&gt;0</text>
      <rect x="256" y="330" width="68" height="20" rx="4" fill="#fffbeb" stroke="#fcd34d"/><text x="290" y="344" fill="#b45309">in: 1-&gt;0</text>
      <rect x="426" y="266" width="68" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="460" y="280" fill="#475569">in: 2</text>
    </g>
    <rect x="44" y="378" width="524" height="122" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="60" y="404" class="mono" font-size="12.5" font-weight="700" fill="#1d4ed8">Step 1: Pop A (in=0) -&gt; decrement B &amp; C to 0 -&gt; push B, C</text>
    <text x="60" y="432" class="mono" font-size="12" fill="#334155">Queue  : [ B, C ]</text>
    <text x="60" y="458" class="mono" font-size="12" font-weight="700" fill="#047857">Order  : [ A ]</text>
    <text x="60" y="484" class="sans" font-size="11" fill="#64748b">Only zero-in-degree vertices have all prerequisites satisfied.</text>
  </g>

  <!-- Step 2: Pop B -> decrement D(2->1) -->
  <g class="tp-2">
    <g class="mono" font-size="14" font-weight="700" text-anchor="middle">
      <circle cx="120" cy="235" r="24" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="120" y="240" fill="#047857">A</text>
      <circle cx="290" cy="170" r="24" fill="#2563eb" stroke="#1d4ed8" stroke-width="2.5"/><text x="290" y="175" fill="#ffffff">B</text>
      <circle cx="290" cy="300" r="24" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="290" y="305" fill="#1d4ed8">C</text>
      <circle cx="460" cy="235" r="24" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="460" y="240" fill="#475569">D</text>
    </g>
    <g class="mono" font-size="11" font-weight="700" text-anchor="middle">
      <rect x="86" y="266" width="68" height="20" rx="4" fill="#ecfdf5" stroke="#6ee7b7"/><text x="120" y="280" fill="#047857">done</text>
      <rect x="256" y="120" width="68" height="20" rx="4" fill="#eff6ff" stroke="#93c5fd"/><text x="290" y="134" fill="#1d4ed8">popped</text>
      <rect x="256" y="330" width="68" height="20" rx="4" fill="#eff6ff" stroke="#93c5fd"/><text x="290" y="344" fill="#1d4ed8">in: 0</text>
      <rect x="426" y="266" width="68" height="20" rx="4" fill="#fffbeb" stroke="#fcd34d"/><text x="460" y="280" fill="#b45309">in: 2-&gt;1</text>
    </g>
    <rect x="44" y="378" width="524" height="122" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="60" y="404" class="mono" font-size="12.5" font-weight="700" fill="#1d4ed8">Step 2: Pop B -&gt; decrement D (2 -&gt; 1, still not 0!)</text>
    <text x="60" y="432" class="mono" font-size="12" fill="#334155">Queue  : [ C ]</text>
    <text x="60" y="458" class="mono" font-size="12" font-weight="700" fill="#047857">Order  : [ A, B ]</text>
    <text x="60" y="484" class="sans" font-size="11" fill="#64748b">D waits because edge C -&gt; D is still unresolved (in[D] == 1).</text>
  </g>

  <!-- Step 3: Pop C -> decrement D(1->0) -> push D -->
  <g class="tp-3">
    <g class="mono" font-size="14" font-weight="700" text-anchor="middle">
      <circle cx="120" cy="235" r="24" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="120" y="240" fill="#047857">A</text>
      <circle cx="290" cy="170" r="24" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="290" y="175" fill="#047857">B</text>
      <circle cx="290" cy="300" r="24" fill="#2563eb" stroke="#1d4ed8" stroke-width="2.5"/><text x="290" y="305" fill="#ffffff">C</text>
      <circle cx="460" cy="235" r="24" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text x="460" y="240" fill="#1d4ed8">D</text>
    </g>
    <g class="mono" font-size="11" font-weight="700" text-anchor="middle">
      <rect x="86" y="266" width="68" height="20" rx="4" fill="#ecfdf5" stroke="#6ee7b7"/><text x="120" y="280" fill="#047857">done</text>
      <rect x="256" y="120" width="68" height="20" rx="4" fill="#ecfdf5" stroke="#6ee7b7"/><text x="290" y="134" fill="#047857">done</text>
      <rect x="256" y="330" width="68" height="20" rx="4" fill="#eff6ff" stroke="#93c5fd"/><text x="290" y="344" fill="#1d4ed8">popped</text>
      <rect x="426" y="266" width="68" height="20" rx="4" fill="#ecfdf5" stroke="#6ee7b7"/><text x="460" y="280" fill="#047857">in: 1-&gt;0</text>
    </g>
    <rect x="44" y="378" width="524" height="122" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="60" y="404" class="mono" font-size="12.5" font-weight="700" fill="#1d4ed8">Step 3: Pop C -&gt; decrement D (1 -&gt; 0) -&gt; push D!</text>
    <text x="60" y="432" class="mono" font-size="12" fill="#334155">Queue  : [ D ]</text>
    <text x="60" y="458" class="mono" font-size="12" font-weight="700" fill="#047857">Order  : [ A, B, C ]</text>
    <text x="60" y="484" class="sans" font-size="11" fill="#64748b">All predecessors of D are now processed; D enters queue.</text>
  </g>

  <!-- Step 4: Pop D -> Order [A, B, C, D] -->
  <g class="tp-4">
    <g class="mono" font-size="14" font-weight="700" text-anchor="middle">
      <circle cx="120" cy="235" r="24" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/><text x="120" y="240" fill="#047857">A</text>
      <circle cx="290" cy="170" r="24" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/><text x="290" y="175" fill="#047857">B</text>
      <circle cx="290" cy="300" r="24" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/><text x="290" y="305" fill="#047857">C</text>
      <circle cx="460" cy="235" r="24" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/><text x="460" y="240" fill="#047857">D</text>
    </g>
    <rect x="44" y="378" width="524" height="122" rx="8" fill="#ecfdf5" stroke="#86efac"/>
    <text x="60" y="404" class="mono" font-size="12.5" font-weight="700" fill="#047857">Step 4: Pop D -&gt; Queue Empty, len === 4 === |V| (Valid DAG!)</text>
    <text x="60" y="432" class="mono" font-size="12" fill="#065f46">Queue  : [ ]</text>
    <text x="60" y="458" class="mono" font-size="13" font-weight="700" fill="#047857">Order  : [ A, B, C, D ]</text>
    <text x="60" y="484" class="sans" font-size="11" fill="#059669">Cycle detection: if result.length &lt; |V|, a directed cycle blocked in-degree -&gt; 0.</text>
  </g>

  <rect x="44" y="514" width="524" height="116" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="60" y="538" class="sans" font-size="12" font-weight="700" fill="#1e40af">Kahn&apos;s Cycle &amp; Lexicographic Advantage</text>
  <text x="60" y="560" class="sans" font-size="11" fill="#1e3a8a">1. Naturally detects cycles via `order.length === V` check at completion.</text>
  <text x="60" y="580" class="sans" font-size="11" fill="#1e3a8a">2. Swap FIFO queue for a Min-Heap to get lexicographically smallest topo order.</text>
  <text x="60" y="600" class="sans" font-size="11" fill="#1e3a8a">3. Easily computes longest DAG path / parallel critical path via DP.</text>

  <!-- RIGHT PANEL: DFS Post-Order Reversal -->
  <rect x="612" y="76" width="564" height="574" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="612" y="76" width="564" height="36" rx="10" fill="#f1f5f9"/>
  <rect x="612" y="102" width="564" height="10" fill="#f1f5f9"/>
  <text x="628" y="99" class="sans" font-size="13" font-weight="700" fill="#0f172a">2. DFS Post-Order Reversal</text>
  <text x="1160" y="99" class="mono" font-size="11" fill="#7c3aed" text-anchor="end">Result: [ A, C, B, D ]</text>

  <!-- Same DAG at x+588 -->
  <g stroke="#94a3b8" stroke-width="2.5" fill="none">
    <line x1="730" y1="226" x2="852" y2="178" marker-end="url(#arrow-slate)"/>
    <line x1="730" y1="244" x2="852" y2="292" marker-end="url(#arrow-slate)"/>
    <line x1="902" y1="178" x2="1024" y2="226" marker-end="url(#arrow-slate)"/>
    <line x1="902" y1="292" x2="1024" y2="244" marker-end="url(#arrow-slate)"/>
  </g>

  <g class="tp-1">
    <g class="mono" font-size="14" font-weight="700" text-anchor="middle">
      <circle cx="708" cy="235" r="24" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/><text x="708" y="240" fill="#92400e">A</text>
      <circle cx="878" cy="170" r="24" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/><text x="878" y="175" fill="#92400e">B</text>
      <circle cx="878" cy="300" r="24" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="878" y="305" fill="#475569">C</text>
      <circle cx="1048" cy="235" r="24" fill="#1e293b" stroke="#0f172a" stroke-width="2.5"/><text x="1048" y="240" fill="#f8fafc">D</text>
    </g>
    <rect x="632" y="378" width="524" height="122" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="648" y="404" class="mono" font-size="12.5" font-weight="700" fill="#6d28d9">Step 1: DFS A -&gt; B -&gt; D. D has no children -&gt; finishes FIRST!</text>
    <text x="648" y="432" class="mono" font-size="12" fill="#334155">postOrder : [ D ]</text>
    <text x="648" y="458" class="mono" font-size="12" fill="#64748b">reversed  : (pending end of DFS)</text>
    <text x="648" y="484" class="sans" font-size="11" fill="#64748b">Every node u finishes strictly AFTER all nodes v reachable from u.</text>
  </g>

  <g class="tp-2">
    <g class="mono" font-size="14" font-weight="700" text-anchor="middle">
      <circle cx="708" cy="235" r="24" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/><text x="708" y="240" fill="#92400e">A</text>
      <circle cx="878" cy="170" r="24" fill="#1e293b" stroke="#0f172a" stroke-width="2.5"/><text x="878" y="175" fill="#f8fafc">B</text>
      <circle cx="878" cy="300" r="24" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="878" y="305" fill="#475569">C</text>
      <circle cx="1048" cy="235" r="24" fill="#1e293b" stroke="#0f172a" stroke-width="2"/><text x="1048" y="240" fill="#f8fafc">D</text>
    </g>
    <rect x="632" y="378" width="524" height="122" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="648" y="404" class="mono" font-size="12.5" font-weight="700" fill="#6d28d9">Step 2: Backtrack to B -&gt; all children done -&gt; B finishes!</text>
    <text x="648" y="432" class="mono" font-size="12" fill="#334155">postOrder : [ D, B ]</text>
    <text x="648" y="458" class="mono" font-size="12" fill="#64748b">reversed  : (pending end of DFS)</text>
    <text x="648" y="484" class="sans" font-size="11" fill="#64748b">Next, A explores its second branch C.</text>
  </g>

  <g class="tp-3">
    <g class="mono" font-size="14" font-weight="700" text-anchor="middle">
      <circle cx="708" cy="235" r="24" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/><text x="708" y="240" fill="#92400e">A</text>
      <circle cx="878" cy="170" r="24" fill="#1e293b" stroke="#0f172a" stroke-width="2"/><text x="878" y="175" fill="#f8fafc">B</text>
      <circle cx="878" cy="300" r="24" fill="#1e293b" stroke="#0f172a" stroke-width="2.5"/><text x="878" y="305" fill="#f8fafc">C</text>
      <circle cx="1048" cy="235" r="24" fill="#1e293b" stroke="#0f172a" stroke-width="2"/><text x="1048" y="240" fill="#f8fafc">D</text>
    </g>
    <rect x="632" y="378" width="524" height="122" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="648" y="404" class="mono" font-size="12.5" font-weight="700" fill="#6d28d9">Step 3: Enter C -&gt; D is already Black -&gt; C finishes!</text>
    <text x="648" y="432" class="mono" font-size="12" fill="#334155">postOrder : [ D, B, C ]</text>
    <text x="648" y="458" class="mono" font-size="12" fill="#64748b">reversed  : (pending end of DFS)</text>
    <text x="648" y="484" class="sans" font-size="11" fill="#64748b">Only A remains on the recursion stack.</text>
  </g>

  <g class="tp-4">
    <g class="mono" font-size="14" font-weight="700" text-anchor="middle">
      <circle cx="708" cy="235" r="24" fill="#7c3aed" stroke="#6d28d9" stroke-width="2.5"/><text x="708" y="240" fill="#ffffff">A</text>
      <circle cx="878" cy="170" r="24" fill="#7c3aed" stroke="#6d28d9" stroke-width="2.5"/><text x="878" y="175" fill="#ffffff">B</text>
      <circle cx="878" cy="300" r="24" fill="#7c3aed" stroke="#6d28d9" stroke-width="2.5"/><text x="878" y="305" fill="#ffffff">C</text>
      <circle cx="1048" cy="235" r="24" fill="#7c3aed" stroke="#6d28d9" stroke-width="2.5"/><text x="1048" y="240" fill="#ffffff">D</text>
    </g>
    <rect x="632" y="378" width="524" height="122" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="648" y="404" class="mono" font-size="12.5" font-weight="700" fill="#5b21b6">Step 4: A finishes last -&gt; Reverse postOrder!</text>
    <text x="648" y="432" class="mono" font-size="12" fill="#4c1d95">postOrder : [ D, B, C, A ]</text>
    <text x="648" y="458" class="mono" font-size="13" font-weight="700" fill="#047857">Reversed  : [ A, C, B, D ]  (valid topological order!)</text>
    <text x="648" y="484" class="sans" font-size="11" fill="#5b21b6">Because finish[u] &gt; finish[v] for every DAG edge u -&gt; v, reversing puts u first.</text>
  </g>

  <rect x="632" y="514" width="524" height="116" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="648" y="538" class="sans" font-size="12" font-weight="700" fill="#5b21b6">Non-Uniqueness &amp; Cycle Guard</text>
  <text x="648" y="560" class="sans" font-size="11" fill="#4c1d95">1. Topological order is NOT unique: [A, B, C, D] and [A, C, B, D] are both valid.</text>
  <text x="648" y="580" class="sans" font-size="11" fill="#4c1d95">2. DFS topological sort MUST track 3-color (Gray) state to reject cycles;</text>
  <text x="648" y="600" class="sans" font-size="11" fill="#4c1d95">   without a Gray check, post-order silently emits a broken order on cycles!</text>

  <!-- Bottom Legend -->
  <rect x="24" y="666" width="1152" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="44" y="692" class="sans" font-size="12" font-weight="700" fill="#0f172a">Comparison:</text>
  <rect x="148" y="678" width="14" height="14" rx="3" fill="#2563eb"/>
  <text x="168" y="690" class="sans" font-size="11" fill="#334155">Kahn active pop (in-degree == 0)</text>
  <rect x="404" y="678" width="14" height="14" rx="3" fill="#059669"/>
  <text x="424" y="690" class="sans" font-size="11" fill="#334155">Settled in topological order</text>
  <rect x="628" y="678" width="14" height="14" rx="3" fill="#1e293b"/>
  <text x="648" y="690" class="sans" font-size="11" fill="#334155">DFS post-order finished</text>
  <rect x="828" y="678" width="14" height="14" rx="3" fill="#7c3aed"/>
  <text x="848" y="690" class="sans" font-size="11" fill="#334155">Reversed final DFS order</text>
  <text x="44" y="722" class="sans" font-size="11" fill="#64748b">Both algorithms run in Theta(V + E) time and Theta(V) space. Prefer Kahn&apos;s iterative BFS when stack depth exceeds ~10,000 or lexicographic tie-breaking is needed.</text>
</svg>
