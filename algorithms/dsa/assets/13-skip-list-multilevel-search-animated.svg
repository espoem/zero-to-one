<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-labelledby="title desc">
  <title id="title">Skip List: Multi-Level Express-Lane Search and Probabilistic Promotion</title>
  <desc id="desc">Animated Skip List diagram across levels L3 to L0 showing search(42) hopping rightward along express lanes (-inf -&gt; 19 on L3, 19 -&gt; 34 on L2) and dropping down when the next node exceeds 42 (L3 -&gt; L2 -&gt; L1 -&gt; L0), locating 42 in O(log n) expected hops without tree rotations.</desc>
  <defs>
    <style>
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

      .sl-cursor { animation: sl-walk 12s ease-in-out infinite; }
      .sl-path-draw { animation: sl-path 12s linear infinite; stroke-dasharray: 6 4; }
      .sl-found-ring { animation: sl-found 12s linear infinite; }

      /* Walk path coordinates:
         L3(-inf):(150,155) -> L3(19):(558,155) -> L2(19):(558,235) -> L2(34):(762,235)
         -> L1(34):(762,315) -> L0(34):(762,395) -> L0(42):(864,395) */
      @keyframes sl-walk {
        0%, 10%   { transform: translate(150px, 155px); }
        16%, 24%  { transform: translate(558px, 155px); }
        30%, 38%  { transform: translate(558px, 235px); }
        44%, 52%  { transform: translate(762px, 235px); }
        58%, 66%  { transform: translate(762px, 315px); }
        72%, 80%  { transform: translate(762px, 395px); }
        86%, 100% { transform: translate(864px, 395px); }
      }

      @keyframes sl-path {
        0%, 100% { stroke-dashoffset: -40; }
      }

      @keyframes sl-found {
        0%, 82%   { opacity: 0.86; }
        88%, 100% { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
        .sl-cursor { transform: translate(864px, 395px); }
        .sl-found-ring { opacity: 1 !important; }
      }
    </style>

    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1200" height="680" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="1200" height="62" rx="12" fill="#0f172a"/>
  <rect x="0" y="46" width="1200" height="16" fill="#0f172a"/>
  <text x="24" y="29" class="sans" font-size="18" font-weight="700" fill="#f8fafc">Skip List · Multi-Level Express-Lane Search (Pugh, 1990)</text>
  <text x="24" y="49" class="sans" font-size="12" fill="#94a3b8">Randomized hierarchy where each element promotes upward with probability p = 1/2, achieving O(log n) expected search without rotations</text>

  <!-- Main Skip List Container -->
  <rect x="24" y="78" width="1152" height="394" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="24" y="78" width="1152" height="34" rx="10" fill="#f1f5f9"/>
  <rect x="24" y="104" width="1152" height="8" fill="#f1f5f9"/>
  <text x="40" y="100" class="sans" font-size="12.5" font-weight="700" fill="#0f172a">Target Query: search(42) — Scan Right While next.key &lt;= 42, Else Drop One Level</text>
  <text x="1160" y="100" class="mono" font-size="11" font-weight="700" fill="#059669" text-anchor="end">6 pointer hops across 4 levels</text>

  <!-- Level Row Backgrounds & Labels -->
  <rect x="42" y="128" width="1116" height="54" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="64" y="160" class="mono" font-size="13" font-weight="700" fill="#7c3aed">L3</text>

  <rect x="42" y="208" width="1116" height="54" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="64" y="240" class="mono" font-size="13" font-weight="700" fill="#2563eb">L2</text>

  <rect x="42" y="288" width="1116" height="54" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="64" y="320" class="mono" font-size="13" font-weight="700" fill="#059669">L1</text>

  <rect x="42" y="368" width="1116" height="54" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="64" y="400" class="mono" font-size="13" font-weight="700" fill="#0f172a">L0</text>

  <!-- Horizontal Base Links (Slate) -->
  <!-- L3: 150 -> 558 -> 1068 -->
  <line x1="184" y1="155" x2="522" y2="155" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arr-slate)"/>
  <line x1="592" y1="155" x2="1032" y2="155" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arr-slate)"/>

  <!-- L2: 150 -> 558 -> 762 -> 1068 -->
  <line x1="184" y1="235" x2="522" y2="235" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arr-slate)"/>
  <line x1="592" y1="235" x2="726" y2="235" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arr-slate)"/>
  <line x1="796" y1="235" x2="1032" y2="235" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arr-slate)"/>

  <!-- L1: 150 -> 354 -> 558 -> 660 -> 762 -> 966 -> 1068 -->
  <line x1="184" y1="315" x2="318" y2="315" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arr-slate)"/>
  <line x1="388" y1="315" x2="522" y2="315" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arr-slate)"/>
  <line x1="592" y1="315" x2="624" y2="315" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arr-slate)"/>
  <line x1="694" y1="315" x2="726" y2="315" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arr-slate)"/>
  <line x1="796" y1="315" x2="930" y2="315" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arr-slate)"/>
  <line x1="1000" y1="315" x2="1032" y2="315" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arr-slate)"/>

  <!-- L0: all 10 nodes -->
  <line x1="184" y1="395" x2="216" y2="395" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arr-slate)"/>
  <line x1="286" y1="395" x2="318" y2="395" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arr-slate)"/>
  <line x1="388" y1="395" x2="420" y2="395" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arr-slate)"/>
  <line x1="490" y1="395" x2="522" y2="395" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arr-slate)"/>
  <line x1="592" y1="395" x2="624" y2="395" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arr-slate)"/>
  <line x1="694" y1="395" x2="726" y2="395" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arr-slate)"/>
  <line x1="796" y1="395" x2="828" y2="395" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arr-slate)"/>
  <line x1="898" y1="395" x2="930" y2="395" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arr-slate)"/>
  <line x1="1000" y1="395" x2="1032" y2="395" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arr-slate)"/>

  <!-- Vertical Tower Links (down pointers) -->
  <line x1="150" y1="175" x2="150" y2="213" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="150" y1="255" x2="150" y2="293" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="150" y1="335" x2="150" y2="373" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="354" y1="335" x2="354" y2="373" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="558" y1="175" x2="558" y2="213" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="558" y1="255" x2="558" y2="293" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="558" y1="335" x2="558" y2="373" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="660" y1="335" x2="660" y2="373" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="762" y1="255" x2="762" y2="293" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="762" y1="335" x2="762" y2="373" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="966" y1="335" x2="966" y2="373" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="1068" y1="175" x2="1068" y2="213" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="1068" y1="255" x2="1068" y2="293" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="1068" y1="335" x2="1068" y2="373" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Highlighted Search Path for search(42) (Dashed Animated Blue -> Emerald) -->
  <path class="sl-path-draw" d="M 150 155 L 558 155 L 558 235 L 762 235 L 762 395 L 864 395" fill="none" stroke="#2563eb" stroke-width="3.2"/>

  <!-- Skip List Nodes (64x36 boxes centered at node coordinates) -->
  <!-- Sentinels -inf (x=150) & +inf (x=1068) -->
  <g fill="#0f172a">
    <rect x="118" y="137" width="64" height="36" rx="6"/><rect x="118" y="217" width="64" height="36" rx="6"/>
    <rect x="118" y="297" width="64" height="36" rx="6"/><rect x="118" y="377" width="64" height="36" rx="6"/>
    <rect x="1036" y="137" width="64" height="36" rx="6"/><rect x="1036" y="217" width="64" height="36" rx="6"/>
    <rect x="1036" y="297" width="64" height="36" rx="6"/><rect x="1036" y="377" width="64" height="36" rx="6"/>
  </g>
  <g class="mono" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">
    <text x="150" y="160">-&#8734;</text><text x="150" y="240">-&#8734;</text><text x="150" y="320">-&#8734;</text><text x="150" y="400">-&#8734;</text>
    <text x="1068" y="160">+&#8734;</text><text x="1068" y="240">+&#8734;</text><text x="1068" y="320">+&#8734;</text><text x="1068" y="400">+&#8734;</text>
  </g>

  <!-- Key 3 (L0) -->
  <rect x="220" y="377" width="64" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="252" y="400" class="mono" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">3</text>

  <!-- Key 7 (L1, L0) -->
  <rect x="322" y="297" width="64" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="322" y="377" width="64" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="354" y="320" class="mono" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">7</text>
  <text x="354" y="400" class="mono" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">7</text>

  <!-- Key 12 (L0) -->
  <rect x="424" y="377" width="64" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="456" y="400" class="mono" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">12</text>

  <!-- Key 19 (L3, L2, L1, L0) -->
  <rect x="526" y="137" width="64" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="526" y="217" width="64" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="526" y="297" width="64" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="526" y="377" width="64" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="558" y="160" class="mono" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">19</text>
  <text x="558" y="240" class="mono" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">19</text>
  <text x="558" y="320" class="mono" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">19</text>
  <text x="558" y="400" class="mono" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">19</text>

  <!-- Key 25 (L1, L0) -->
  <rect x="628" y="297" width="64" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="628" y="377" width="64" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="660" y="320" class="mono" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">25</text>
  <text x="660" y="400" class="mono" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">25</text>

  <!-- Key 34 (L2, L1, L0) -->
  <rect x="730" y="217" width="64" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="730" y="297" width="64" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="730" y="377" width="64" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="762" y="240" class="mono" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">34</text>
  <text x="762" y="320" class="mono" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">34</text>
  <text x="762" y="400" class="mono" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">34</text>

  <!-- Key 42 (L0) TARGET -->
  <rect x="832" y="377" width="64" height="36" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2.4"/>
  <text x="864" y="400" class="mono" font-size="14" font-weight="700" fill="#065f46" text-anchor="middle">42</text>
  <g class="sl-found-ring">
    <rect x="824" y="422" width="80" height="22" rx="4" fill="#059669"/>
    <text x="864" y="437" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">FOUND 42!</text>
  </g>

  <!-- Key 58 (L1, L0) -->
  <rect x="934" y="297" width="64" height="36" rx="6" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
  <rect x="934" y="377" width="64" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="966" y="320" class="mono" font-size="13" font-weight="700" fill="#be123c" text-anchor="middle">58</text>
  <text x="966" y="400" class="mono" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">58</text>

  <!-- Animated Search Cursor -->
  <g class="sl-cursor">
    <rect x="-36" y="-22" width="72" height="44" rx="8" fill="none" stroke="#d97706" stroke-width="3.2"/>
    <circle cx="34" cy="-20" r="6" fill="#d97706"/>
  </g>

  <!-- Bottom 3 Cards: Trace, Coin-Flip Promotion, Complexity Comparison -->
  <g transform="translate(24, 490)">
    <rect x="0" y="0" width="372" height="166" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="16" y="26" class="sans" font-size="12.5" font-weight="700" fill="#1e3a8a">1. Step-by-Step Search Trace (target = 42)</text>
    <text x="16" y="50" class="mono" font-size="11" fill="#334155">L3: -inf -&gt; 19  (next +inf &gt; 42, drop L2)</text>
    <text x="16" y="72" class="mono" font-size="11" fill="#334155">L2: 19 -&gt; 34    (next +inf &gt; 42, drop L1)</text>
    <text x="16" y="94" class="mono" font-size="11" fill="#be123c">L1: at 34       (next 58 &gt; 42, drop L0)</text>
    <text x="16" y="116" class="mono" font-size="11" font-weight="700" fill="#065f46">L0: 34 -&gt; 42    (match found!)</text>
    <text x="16" y="144" class="sans" font-size="10.5" fill="#64748b">Skipped keys 3, 7, 12, 25 completely.</text>

    <rect x="390" y="0" width="372" height="166" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="406" y="26" class="sans" font-size="12.5" font-weight="700" fill="#6d28d9">2. Probabilistic Promotion (p = 1/2)</text>
    <text x="406" y="50" class="sans" font-size="11.5" fill="#334155">On insert, flip fair coins (p = 0.5) to</text>
    <text x="406" y="70" class="sans" font-size="11.5" fill="#334155">determine node tower height:</text>
    <text x="406" y="94" class="mono" font-size="11" fill="#6d28d9">E[levels] = log_2(n), E[nodes] = 2n</text>
    <text x="406" y="116" class="mono" font-size="11" fill="#334155">Search / Insert / Delete = O(log n) exp.</text>
    <text x="406" y="144" class="sans" font-size="10.5" fill="#64748b">Zero rebalancing rotations on insert/delete!</text>

    <rect x="780" y="0" width="372" height="166" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="796" y="26" class="sans" font-size="12.5" font-weight="700" fill="#065f46">3. Concurrency &amp; Production Use</text>
    <text x="796" y="50" class="sans" font-size="11.5" fill="#334155">Why Redis ZSET &amp; LevelDB MemTable</text>
    <text x="796" y="70" class="sans" font-size="11.5" fill="#334155">prefer Skip Lists over Red-Black Trees:</text>
    <text x="796" y="94" class="mono" font-size="11" fill="#065f46">&#8226; Lock-free CAS insert (local pointers)</text>
    <text x="796" y="116" class="mono" font-size="11" fill="#065f46">&#8226; Fast range scans along L0</text>
    <text x="796" y="144" class="sans" font-size="10.5" fill="#64748b">Simple pointer splice vs global tree lock.</text>
  </g>
</svg>
