<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 630" width="1160" height="630" role="img" aria-labelledby="title desc">
  <title id="title">Flexbox Free-Space Distribution and CSS Grid Dense Auto-Placement</title>
  <desc id="desc">Animated step-by-step comparison of CSS Flexbox 1D free-space distribution (flex-grow positive space distribution, flex-shrink negative overflow weighted by flex-basis, and the min-width: auto overflow trap fixed by min-width: 0) and CSS Grid 2D grid-auto-flow: dense cursor backtracking that fills earlier empty gaps left by spanning items.</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* 12s animation loop:
       0-50%  : Flexbox flex-grow expands A (+60px) and B (+120px) into 180px positive space; Grid shows sparse gap
       50-100%: Flexbox flex-shrink + min-width:0; Grid dense cursor backtracks Item 4 and 5 into Row 1 gaps!
    */
    @keyframes grow-a {
      0%, 10%  { width: 80px; }
      28%, 48% { width: 128px; }
      60%, 92% { width: 80px; }
      100%     { width: 80px; }
    }
    @keyframes grow-b-pos {
      0%, 10%  { transform: translateX(0px); width: 160px; }
      28%, 48% { transform: translateX(48px); width: 256px; }
      60%, 92% { transform: translateX(0px); width: 160px; }
      100%     { transform: translateX(0px); width: 160px; }
    }
    @keyframes grow-c-pos {
      0%, 10%  { transform: translateX(0px); }
      28%, 48% { transform: translateX(144px); }
      60%, 92% { transform: translateX(0px); }
      100%     { transform: translateX(0px); }
    }

    @keyframes flex-phase-1 {
      0%, 49% { stroke: #0f766e; stroke-width: 2.5; opacity: 1; }
      50%, 100% { stroke: #d6d0c4; stroke-width: 1.2; opacity: 0.6; }
    }
    @keyframes flex-phase-2 {
      0%, 49% { stroke: #d6d0c4; stroke-width: 1.2; opacity: 0.6; }
      50%, 100% { stroke: #dc2626; stroke-width: 2.5; opacity: 1; }
    }

    /* Dense Grid Item 4 and Item 5 backtracking from Row 2/3 into Row 1 Cols 3 and 4 */
    @keyframes dense-item4 {
      0%, 35%  { transform: translate(0px, 0px); }
      58%, 92% { transform: translate(-118px, -74px); }
      100%     { transform: translate(0px, 0px); }
    }
    @keyframes dense-item5 {
      0%, 42%  { transform: translate(0px, 0px); }
      65%, 92% { transform: translate(354px, -148px); }
      100%     { transform: translate(0px, 0px); }
    }
    @keyframes backtrack-arrow {
      0%, 35% { opacity: 0; }
      45%, 85% { opacity: 1; }
      95%, 100% { opacity: 0; }
    }

    .ga { animation: grow-a 12s ease-in-out infinite; }
    .gb { animation: grow-b-pos 12s ease-in-out infinite; }
    .gc { animation: grow-c-pos 12s ease-in-out infinite; }
    .fp1 { animation: flex-phase-1 12s linear infinite; }
    .fp2 { animation: flex-phase-2 12s linear infinite; }
    .di4 { animation: dense-item4 12s ease-in-out infinite; }
    .di5 { animation: dense-item5 12s ease-in-out infinite; }
    .btarr { animation: backtrack-arrow 12s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .ga, .gb, .gc, .fp1, .fp2, .di4, .di5, .btarr { animation: none !important; }
      .fp1, .fp2 { opacity: 1 !important; stroke-width: 1.5 !important; }
      .di4, .di5, .gb, .gc { transform: none !important; }
      .btarr { opacity: 1 !important; }
    }
  </style>

  <defs>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1160" height="630" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>

  <!-- Header -->
  <line x1="24" y1="62" x2="1136" y2="62" stroke="#1c1917" stroke-width="1.2"/>
  
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#1c1917" font-family="Georgia, 'Times New Roman', serif">Flexbox Free-Space Distribution &amp; CSS Grid Dense Auto-Placement</text>
  <text x="24" y="47" class="sans" font-size="12" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">1D Axis Sizing (flex-basis, flex-grow, flex-shrink, min-width: 0) · 2D Cursor Backtracking (grid-auto-flow: dense)</text>

  <!-- LEFT PANEL: FLEXBOX 1D FREE SPACE -->
  <rect x="24" y="76" width="548" height="474" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="42" y="102" class="sans" font-size="14" font-weight="700" fill="#1c1917">Part A — Flexbox Main-Axis Distribution (Container: 600px)</text>

  <!-- Positive Free Space (flex-grow) -->
  <rect x="42" y="118" width="512" height="196" rx="8" fill="#f0fdf9" class="fp1"/>
  <text x="58" y="140" class="sans" font-size="12.5" font-weight="700" fill="#065f46">1. Positive Free Space: flex-grow (Leftover = +180px)</text>
  <text x="58" y="158" class="mono" font-size="10.5" fill="#065f46">Extra = FreeSpace × (grow_i / Σ grow)  [Σ grow = 1 + 2 + 0 = 3]</text>

  <!-- Animated Flex Container (scaled visually to 500px box = 600px logical) -->
  <rect x="58" y="172" width="480" height="62" rx="6" fill="#ffffff" stroke="#44403c" stroke-width="1.6"/>
  <text x="456" y="207" class="mono" font-size="10" fill="#57534e">free space</text>

  <!-- Item A -->
  <rect x="64" y="180" width="80" height="46" rx="5" fill="#0f766e" class="ga"/>
  <text x="70" y="200" class="mono" font-size="10" font-weight="700" fill="#ffffff">A (grow:1)</text>
  <text x="70" y="216" class="mono" font-size="10" fill="#f0fdf9">100→160</text>

  <!-- Item B -->
  <g class="gb">
    <rect x="148" y="180" width="160" height="46" rx="5" fill="#0f766e"/>
    <text x="156" y="200" class="mono" font-size="10.5" font-weight="700" fill="#ffffff">B (grow:2)</text>
    <text x="156" y="216" class="mono" font-size="10" fill="#f0fdf9">200→320px (+2/3)</text>
  </g>

  <!-- Item C -->
  <g class="gc">
    <rect x="312" y="180" width="80" height="46" rx="5" fill="#44403c"/>
    <text x="320" y="200" class="mono" font-size="10" font-weight="700" fill="#ffffff">C (0)</text>
    <text x="320" y="216" class="mono" font-size="10" fill="#1c1917">120px</text>
  </g>

  <text x="58" y="256" class="mono" font-size="10.5" fill="#065f46">• A: 100 + 180×(1/3) = 160px   • B: 200 + 180×(2/3) = 320px</text>
  <text x="58" y="274" class="mono" font-size="10.5" fill="#065f46">• C: 120 + 0 = 120px (flex-grow: 0 keeps basis untouched)</text>
  <text x="58" y="294" class="sans" font-size="10.5" fill="#065f46">Tip: flex: 1 sets flex-basis: 0%, making shares purely proportional.</text>

  <!-- Negative Free Space (flex-shrink) + min-width: auto trap -->
  <rect x="42" y="328" width="512" height="206" rx="8" fill="#fef2f2" class="fp2"/>
  <text x="58" y="350" class="sans" font-size="12.5" font-weight="700" fill="#991b1b">2. Negative Space: flex-shrink &amp; min-width: auto Trap</text>
  <text x="58" y="368" class="mono" font-size="10.5" fill="#991b1b">ShrinkShare = (shrink_i × basis_i) / Σ (shrink_j × basis_j)</text>

  <!-- Overflow Comparison -->
  <rect x="58" y="382" width="480" height="62" rx="6" fill="#ffffff" stroke="#dc2626" stroke-dasharray="4 3"/>
  <rect x="64" y="390" width="206" height="46" rx="5" fill="#fef2f2" stroke="#dc2626"/>
  <text x="74" y="410" class="mono" font-size="10.5" font-weight="700" fill="#991b1b">Broken: min-width: auto</text>
  <text x="74" y="426" class="mono" font-size="10" fill="#991b1b">Clamped to min-content (URL)!</text>

  <rect x="276" y="390" width="272" height="46" rx="5" fill="#dc2626"/>
  <text x="286" y="410" class="mono" font-size="10.5" font-weight="700" fill="#ffffff">Overflows 600px container →</text>
  <text x="286" y="426" class="mono" font-size="10" fill="#fef2f2">https://very-long-unbreakable-url...</text>

  <rect x="58" y="456" width="480" height="62" rx="6" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.4"/>
  <text x="72" y="478" class="mono" font-size="11" font-weight="700" fill="#065f46">Fix: min-width: 0; overflow: hidden; /* or min-inline-size: 0 */</text>
  <text x="72" y="498" class="sans" font-size="10.5" fill="#065f46">Allows flex-shrink to compress items below min-content; same fix in Grid is</text>
  <text x="72" y="512" class="mono" font-size="10.5" font-weight="700" fill="#065f46">minmax(0, 1fr) instead of bare 1fr (= minmax(auto, 1fr)).</text>

  <!-- RIGHT PANEL: CSS GRID DENSE PLACEMENT -->
  <rect x="590" y="76" width="546" height="474" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="610" y="102" class="sans" font-size="14" font-weight="700" fill="#1c1917">Part B — CSS Grid: grid-auto-flow: dense Backtracking</text>
  <text x="610" y="120" class="mono" font-size="11" fill="#57534e">grid-template-columns: repeat(4, minmax(0, 1fr));  /* 4 cols */</text>

  <!-- Grid Cells Background (4 cols x 3 rows, cell=112x64, gap=6 -> col step=118, row step=74) -->
  <!-- Row 1: y=144 -->
  <rect x="634" y="144" width="112" height="64" rx="6" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.5"/>
  <text x="690" y="172" class="mono" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">Item 1</text>
  <text x="690" y="190" class="mono" font-size="10" fill="#065f46" text-anchor="middle">(1×1)</text>

  <rect x="752" y="144" width="112" height="64" rx="6" fill="#f0fdf9" stroke="#0f766e" stroke-width="1.5"/>
  <text x="808" y="172" class="mono" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">Item 2</text>
  <text x="808" y="190" class="mono" font-size="10" fill="#065f46" text-anchor="middle">(1×1)</text>

  <!-- Empty Gaps in Row 1 (c3, c4) -->
  <rect x="870" y="144" width="112" height="64" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="926" y="180" class="mono" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="middle">GAP (r1, c3)</text>

  <rect x="988" y="144" width="112" height="64" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="1044" y="180" class="mono" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="middle">GAP (r1, c4)</text>

  <!-- Row 2: y=218 -->
  <rect x="634" y="218" width="348" height="64" rx="6" fill="#f5f1e8" stroke="#0f766e" stroke-width="1.6"/>
  <text x="808" y="246" class="mono" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">Item 3 (grid-column: span 3)</text>
  <text x="808" y="265" class="sans" font-size="10.5" fill="#065f46" text-anchor="middle">Skipped Row 1 (only 2 cols left) → wrapped to Row 2!</text>

  <rect x="988" y="218" width="112" height="64" rx="6" fill="#faf8f5" stroke="#d6d0c4" stroke-dasharray="4 3"/>
  <text x="1044" y="254" class="mono" font-size="10" fill="#57534e" text-anchor="middle">(r2, c4)</text>

  <!-- Row 3: y=292 -->
  <rect x="634" y="292" width="112" height="64" rx="6" fill="#faf8f5" stroke="#d6d0c4" stroke-dasharray="4 3"/>
  <text x="690" y="328" class="mono" font-size="10" fill="#57534e" text-anchor="middle">(r3, c1)</text>
  <rect x="752" y="292" width="112" height="64" rx="6" fill="#faf8f5" stroke="#d6d0c4" stroke-dasharray="4 3"/>
  <text x="808" y="328" class="mono" font-size="10" fill="#57534e" text-anchor="middle">(r3, c2)</text>
  <rect x="870" y="292" width="112" height="64" rx="6" fill="#faf8f5" stroke="#d6d0c4" stroke-dasharray="4 3"/>
  <text x="926" y="328" class="mono" font-size="10" fill="#57534e" text-anchor="middle">(r3, c3)</text>
  <rect x="988" y="292" width="112" height="64" rx="6" fill="#faf8f5" stroke="#d6d0c4" stroke-dasharray="4 3"/>
  <text x="1044" y="328" class="mono" font-size="10" fill="#57534e" text-anchor="middle">(r3, c4)</text>

  <!-- Animated Items 4 & 5: Start at sparse positions (r2,c4) & (r3,c1), then backtrack to (r1,c3) & (r1,c4) -->
  <g class="di4">
    <rect x="988" y="218" width="112" height="64" rx="6" fill="#0f766e" stroke="#ffffff" stroke-width="1.5"/>
    <text x="1044" y="246" class="mono" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Item 4</text>
    <text x="1044" y="264" class="mono" font-size="10" fill="#f0fdf9" text-anchor="middle">DOM #4 → (r1,c3)</text>
  </g>

  <g class="di5">
    <rect x="634" y="292" width="112" height="64" rx="6" fill="#b45309" stroke="#ffffff" stroke-width="1.5"/>
    <text x="690" y="320" class="mono" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Item 5</text>
    <text x="690" y="338" class="mono" font-size="10" fill="#fffbeb" text-anchor="middle">DOM #5 → (r1,c4)</text>
  </g>

  <!-- Backtrack Indicator Path -->
  <g class="btarr">
    <path d="M 1010 218 Q 970 184 950 184" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr-amber)"/>
  </g>

  <!-- Grid Algorithm Explanation & Accessibility Note -->
  <rect x="610" y="372" width="506" height="82" rx="8" fill="#f0fdf9" stroke="#99f6e4"/>
  <text x="626" y="394" class="sans" font-size="12" font-weight="700" fill="#065f46">Sparse (Default) vs. Dense Cursor Behavior</text>
  <text x="626" y="414" class="sans" font-size="10.5" fill="#44403c">• Default (sparse): auto-placement cursor only moves forward → leaves Row 1 holes empty.</text>
  <text x="626" y="432" class="sans" font-size="10.5" fill="#065f46">• dense: resets cursor to (r1, c1) for each item → backfills Item 4 &amp; Item 5 into gaps!</text>
  <text x="626" y="446" class="mono" font-size="10" fill="#57534e">Eliminates 1 empty row &amp; packs mosaic grids in pure CSS.</text>

  <rect x="610" y="464" width="506" height="70" rx="8" fill="#fef2f2" stroke="#fda4af"/>
  <text x="626" y="485" class="sans" font-size="11.5" font-weight="700" fill="#991b1b">Accessibility Hazard: DOM Order ≠ Visual Order</text>
  <text x="626" y="503" class="sans" font-size="10.5" fill="#44403c">Item 4 &amp; 5 visually jump ahead of Item 3, scrambling keyboard Tab order.</text>
  <text x="626" y="520" class="mono" font-size="10.5" font-weight="700" fill="#991b1b">Modern fix: reading-flow: grid-rows; (CSS Display L4)</text>

  <!-- FOOTER -->
  <rect x="24" y="566" width="1112" height="46" rx="8" fill="#f0fdf9" stroke="#99f6e4" stroke-width="1"/>
  <text x="42" y="594" class="sans" font-size="11.5" font-weight="600" fill="#065f46">Takeaway: Use min-width: 0 / minmax(0, 1fr) to prevent min-content overflow; pair grid-auto-flow: dense with reading-flow for accessible packing.</text>
</svg>
