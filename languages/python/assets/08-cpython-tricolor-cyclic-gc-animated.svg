<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" width="1160" height="620" role="img" aria-labelledby="title desc">
  <title id="title">CPython Generational Cyclic Garbage Collector — Trial Deletion</title>
  <desc id="desc">Animated 4-phase trace of CPython's cyclic garbage collector on Generation 0 containers: (1) copying ob_refcnt to gc_refs, (2) trial-decrementing internal container references, (3) rescuing reachable objects where gc_refs &gt; 0 (root-linked X and Y) while isolating gc_refs == 0 cycles (unreachable A and B), and (4) sweeping the isolated cycle with tp_clear and promoting survivors to Generation 1.</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* 12s 4-phase loop:
       0-25%  : Phase 1 — Copy ob_refcnt -> gc_refs (X:2, Y:1; A:1, B:1)
       25-50% : Phase 2 — Trial-decrement internal container edges (X:2->1, Y:1->0; A:1->0, B:1->0)
       50-75% : Phase 3 — Resurrect X-Y (gc_refs gt 0) vs Isolate A-B (gc_refs == 0)
       75-100%: Phase 4 — Sweep A-B (tp_clear) and Promote X, Y to Gen 1
    */
    @keyframes ph1 {
      0%, 24% { stroke: #2563eb; stroke-width: 2.5; opacity: 1; }
      25%, 100% { stroke: #cbd5e1; stroke-width: 1.2; opacity: 0.86; }
    }
    @keyframes ph2 {
      0%, 24% { stroke: #cbd5e1; stroke-width: 1.2; opacity: 0.86; }
      25%, 49% { stroke: #d97706; stroke-width: 2.5; opacity: 1; }
      50%, 100% { stroke: #cbd5e1; stroke-width: 1.2; opacity: 0.86; }
    }
    @keyframes ph3 {
      0%, 49% { stroke: #cbd5e1; stroke-width: 1.2; opacity: 0.86; }
      50%, 74% { stroke: #7c3aed; stroke-width: 2.5; opacity: 1; }
      75%, 100% { stroke: #cbd5e1; stroke-width: 1.2; opacity: 0.86; }
    }
    @keyframes ph4 {
      0%, 74% { stroke: #cbd5e1; stroke-width: 1.2; opacity: 0.86; }
      75%, 100% { stroke: #e11d48; stroke-width: 2.5; opacity: 1; }
    }

    @keyframes cycle-fade {
      0%, 74% { opacity: 1; transform: scale(1); }
      82%, 96% { opacity: 0.86; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes sweep-badge {
      0%, 74% { opacity: 0; }
      78%, 96% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes live-badge {
      0%, 49% { opacity: 0.86; }
      54%, 96% { opacity: 1; }
      100% { opacity: 0.86; }
    }

    .p1 { animation: ph1 12s linear infinite; }
    .p2 { animation: ph2 12s linear infinite; }
    .p3 { animation: ph3 12s linear infinite; }
    .p4 { animation: ph4 12s linear infinite; }
    .dead-cycle { transform-box: fill-box; transform-origin: center; animation: cycle-fade 12s ease-in-out infinite; }
    .swept { animation: sweep-badge 12s ease-in-out infinite; }
    .resurrected { animation: live-badge 12s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .p1, .p2, .p3, .p4, .dead-cycle, .swept, .resurrected { animation: none !important; }
      .p1, .p2, .p3, .p4 { opacity: 1 !important; stroke-width: 1.5 !important; }
      .dead-cycle { opacity: 1 !important; transform: none !important; }
      .swept, .resurrected { opacity: 1 !important; }
    }
  </style>

  <defs>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1160" height="620" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="1160" height="60" rx="12" fill="#0f172a"/>
  <rect x="0" y="44" width="1160" height="16" fill="#0f172a"/>
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#f8fafc">CPython Cyclic Garbage Collector — Trial Deletion &amp; Generations</text>
  <text x="24" y="47" class="sans" font-size="12" fill="#94a3b8">Tracks container objects (list, dict, instance) · Copies ob_refcnt → gc_refs, subtracts internal cycles, sweeps gc_refs == 0</text>

  <!-- LEFT PANEL: GEN 0 CONTAINER GRAPH -->
  <rect x="24" y="76" width="584" height="464" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="42" y="102" class="sans" font-size="14" font-weight="700" fill="#0f172a">Generation 0 Container Heap Graph</text>

  <!-- Reachable Cluster Box -->
  <rect x="42" y="118" width="548" height="176" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.4"/>
  <text x="58" y="140" class="sans" font-size="12" font-weight="700" fill="#065f46">1. Reachable Cycle (Pinned by External Stack Root)</text>

  <!-- Stack Root -->
  <rect x="58" y="162" width="114" height="58" rx="8" fill="#0f172a"/>
  <text x="115" y="187" class="sans" font-size="11.5" font-weight="700" fill="#f8fafc" text-anchor="middle">Stack Frame</text>
  <text x="115" y="205" class="mono" font-size="10" fill="#94a3b8" text-anchor="middle">local var x</text>
  <line x1="172" y1="191" x2="210" y2="191" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Object X -->
  <rect x="214" y="152" width="150" height="78" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
  <text x="289" y="172" class="mono" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">Container X</text>
  <text x="289" y="191" class="mono" font-size="10.5" fill="#334155" text-anchor="middle">ob_refcnt = 2</text>
  <text x="289" y="208" class="mono" font-size="10.5" font-weight="700" fill="#047857" text-anchor="middle">gc_refs: 2 → 1 (&gt;0)</text>
  <text x="289" y="222" class="sans" font-size="10" fill="#059669" text-anchor="middle">LIVE (External ref)</text>

  <!-- X <-> Y internal cycle edges -->
  <path d="M 364 176 L 418 176" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#arr-green)"/>
  <path d="M 420 208 L 366 208" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#arr-green)"/>

  <!-- Object Y -->
  <rect x="422" y="152" width="150" height="78" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
  <text x="497" y="172" class="mono" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">Container Y</text>
  <text x="497" y="191" class="mono" font-size="10.5" fill="#334155" text-anchor="middle">ob_refcnt = 1</text>
  <text x="497" y="208" class="mono" font-size="10.5" font-weight="700" fill="#d97706" text-anchor="middle">gc_refs: 1 → 0</text>
  <text x="497" y="222" class="sans resurrected" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">Rescued via X → Y!</text>

  <text x="58" y="274" class="sans" font-size="11" fill="#065f46">Because X has gc_refs = 1 &gt; 0, GC traverses X's children and restores Y to LIVE.</text>

  <!-- Unreachable Cycle Box -->
  <rect x="42" y="310" width="548" height="214" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.4"/>
  <text x="58" y="332" class="sans" font-size="12" font-weight="700" fill="#9f1239">2. Isolated Reference Cycle (Scope Exited — Zero External Roots)</text>

  <!-- Severed Scope Root -->
  <rect x="58" y="358" width="114" height="58" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="115" y="382" class="sans" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">Exited Frame</text>
  <text x="115" y="400" class="mono" font-size="10" fill="#94a3b8" text-anchor="middle">link severed</text>
  <line x1="172" y1="387" x2="210" y2="387" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="191" y="381" class="mono" font-size="12" font-weight="700" fill="#e11d48" text-anchor="middle">×</text>

  <!-- Isolated A <-> B -->
  <g class="dead-cycle">
    <rect x="214" y="350" width="150" height="78" rx="8" fill="#ffffff" stroke="#e11d48" stroke-width="1.6"/>
    <text x="289" y="370" class="mono" font-size="12" font-weight="700" fill="#9f1239" text-anchor="middle">Container A</text>
    <text x="289" y="389" class="mono" font-size="10.5" fill="#334155" text-anchor="middle">ob_refcnt = 1 (from B)</text>
    <text x="289" y="406" class="mono" font-size="10.5" font-weight="700" fill="#e11d48" text-anchor="middle">gc_refs: 1 → 0</text>
    <text x="289" y="420" class="sans" font-size="10" fill="#be123c" text-anchor="middle">UNREACHABLE</text>

    <path d="M 364 374 L 418 374" fill="none" stroke="#e11d48" stroke-width="1.6" marker-end="url(#arr-rose)"/>
    <path d="M 420 406 L 366 406" fill="none" stroke="#e11d48" stroke-width="1.6" marker-end="url(#arr-rose)"/>

    <rect x="422" y="350" width="150" height="78" rx="8" fill="#ffffff" stroke="#e11d48" stroke-width="1.6"/>
    <text x="497" y="370" class="mono" font-size="12" font-weight="700" fill="#9f1239" text-anchor="middle">Container B</text>
    <text x="497" y="389" class="mono" font-size="10.5" fill="#334155" text-anchor="middle">ob_refcnt = 1 (from A)</text>
    <text x="497" y="406" class="mono" font-size="10.5" font-weight="700" fill="#e11d48" text-anchor="middle">gc_refs: 1 → 0</text>
    <text x="497" y="420" class="sans" font-size="10" fill="#be123c" text-anchor="middle">UNREACHABLE</text>
  </g>

  <g class="swept">
    <rect x="258" y="446" width="270" height="32" rx="6" fill="#e11d48"/>
    <text x="393" y="466" class="mono" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">tp_clear() breaks edges → FREED</text>
  </g>
  <text x="58" y="504" class="sans" font-size="11" fill="#9f1239">All refs to A &amp; B are internal: gc_refs == 0 across the entire component → garbage.</text>

  <!-- RIGHT PANEL: 4-PHASE ANIMATED ALGORITHM & GENERATIONAL QUEUES -->
  <rect x="626" y="76" width="510" height="464" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="646" y="102" class="sans" font-size="14" font-weight="700" fill="#0f172a">Trial-Deletion Algorithm Phases (12s Loop)</text>

  <!-- Phase 1 -->
  <rect x="646" y="118" width="470" height="76" rx="8" fill="#eff6ff" class="p1"/>
  <rect x="658" y="128" width="70" height="22" rx="5" fill="#2563eb"/>
  <text x="693" y="143" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Phase 1</text>
  <text x="740" y="143" class="sans" font-size="12.5" font-weight="700" fill="#1e3a8a">Copy ob_refcnt → gc_refs</text>
  <text x="658" y="166" class="mono" font-size="10.5" fill="#334155">Snapshot counts without mutating real ob_refcnt:</text>
  <text x="658" y="182" class="mono" font-size="10.5" fill="#1e40af">X:2, Y:1, A:1, B:1</text>

  <!-- Phase 2 -->
  <rect x="646" y="202" width="470" height="76" rx="8" fill="#fffbeb" class="p2"/>
  <rect x="658" y="212" width="70" height="22" rx="5" fill="#d97706"/>
  <text x="693" y="227" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Phase 2</text>
  <text x="740" y="227" class="sans" font-size="12.5" font-weight="700" fill="#92400e">Trial-Decrement Internal Container Edges</text>
  <text x="658" y="250" class="mono" font-size="10.5" fill="#334155">For each container c: for child in tp_traverse(c):</text>
  <text x="658" y="266" class="mono" font-size="10.5" fill="#b45309">child.gc_refs -= 1  →  X:1, Y:0, A:0, B:0</text>

  <!-- Phase 3 -->
  <rect x="646" y="286" width="470" height="82" rx="8" fill="#f5f3ff" class="p3"/>
  <rect x="658" y="296" width="70" height="22" rx="5" fill="#7c3aed"/>
  <text x="693" y="311" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Phase 3</text>
  <text x="740" y="311" class="sans" font-size="12.5" font-weight="700" fill="#5b21b6">Isolate Unreachable &amp; Resurrect Reachable</text>
  <text x="658" y="334" class="sans" font-size="10.5" fill="#334155">• Nodes with gc_refs &gt; 0 (X) are marked LIVE (black).</text>
  <text x="658" y="352" class="sans" font-size="10.5" fill="#6d28d9">• Traverse from X → rescues Y (gray → black). A, B stay 0.</text>

  <!-- Phase 4 -->
  <rect x="646" y="376" width="470" height="76" rx="8" fill="#fff1f2" class="p4"/>
  <rect x="658" y="386" width="70" height="22" rx="5" fill="#e11d48"/>
  <text x="693" y="401" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Phase 4</text>
  <text x="740" y="401" class="sans" font-size="12.5" font-weight="700" fill="#9f1239">Sweep Unreachable &amp; Promote Survivors</text>
  <text x="658" y="424" class="mono" font-size="10.5" fill="#334155">Call tp_clear() on A, B → ob_refcnt hits 0 → free().</text>
  <text x="658" y="440" class="sans" font-size="10.5" fill="#be123c">Survivors X, Y move from Gen 0 → Gen 1.</text>

  <!-- Generational Thresholds Bar -->
  <rect x="646" y="464" width="470" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="660" y="484" class="sans" font-size="11.5" font-weight="700" fill="#0f172a">Three-Generation Thresholds: gc.get_threshold() = (700, 10, 10)</text>
  <rect x="660" y="494" width="136" height="24" rx="5" fill="#eff6ff" stroke="#2563eb"/>
  <text x="728" y="510" class="mono" font-size="10.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">Gen 0 (700 allocs)</text>
  <rect x="812" y="494" width="140" height="24" rx="5" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="882" y="510" class="mono" font-size="10.5" font-weight="700" fill="#5b21b6" text-anchor="middle">Gen 1 (10 Gen0s)</text>
  <rect x="968" y="494" width="134" height="24" rx="5" fill="#ecfdf5" stroke="#059669"/>
  <text x="1035" y="510" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">Gen 2 (10 Gen1s)</text>

  <!-- FOOTER -->
  <rect x="24" y="556" width="1112" height="46" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="42" y="584" class="sans" font-size="11.5" font-weight="600" fill="#1e3a8a">Takeaway: CPython pairs deterministic O(1) reference counting (with PEP 683 immortal singletons) with generational trial-deletion to collect cyclic containers.</text>
</svg>
