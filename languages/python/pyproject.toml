[project]
name = "zero-to-one-python"
version = "0.1.0"
description = "Zero-to-One Python curriculum: Data model, CPython internals, typing, asyncio, and production systems"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "hypothesis>=6.170.0",
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.0",
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["examples"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
strict = true
warn_unused_configs = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
