<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" width="1160" height="620" role="img" aria-labelledby="title desc">
  <title id="title">ECMAScript Equality Algorithms — Decision Flow and Comparison</title>
  <desc id="desc">Animated step-by-step comparison of ECMAScript's four equality algorithms: IsLooselyEqual (==, section 7.2.13) showing coercion chains like [] == ![] and null == 0, IsStrictlyEqual (===, section 7.2.14), SameValue (Object.is, section 7.2.9), and SameValueZero (section 7.2.10), highlighting how each handles NaN, +0 vs -0, and type coercion.</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* 12s 4-phase loop:
       Phase 1 (0-25%):  Same-Type Fast Path (===) vs null/undefined pair
       Phase 2 (25-50%): Coercion Cascade ([] == ![] -> [] == false -> [] == 0 -> "" == 0 -> 0 === 0 -> true)
       Phase 3 (50-75%): NaN and Signed Zero divergence (=== vs Object.is vs SameValueZero)
       Phase 4 (75-100%): Map/Set/includes (SameValueZero) vs React/defineProperty (SameValue)
    */
    @keyframes phase1-hl {
      0%, 24% { stroke: #2563eb; stroke-width: 2.5; opacity: 1; }
      25%, 100% { stroke: #cbd5e1; stroke-width: 1.2; opacity: 0.6; }
    }
    @keyframes phase2-hl {
      0%, 24% { stroke: #cbd5e1; stroke-width: 1.2; opacity: 0.6; }
      25%, 49% { stroke: #d97706; stroke-width: 2.5; opacity: 1; }
      50%, 100% { stroke: #cbd5e1; stroke-width: 1.2; opacity: 0.6; }
    }
    @keyframes phase3-hl {
      0%, 49% { stroke: #cbd5e1; stroke-width: 1.2; opacity: 0.6; }
      50%, 74% { stroke: #7c3aed; stroke-width: 2.5; opacity: 1; }
      75%, 100% { stroke: #cbd5e1; stroke-width: 1.2; opacity: 0.6; }
    }
    @keyframes phase4-hl {
      0%, 74% { stroke: #cbd5e1; stroke-width: 1.2; opacity: 0.6; }
      75%, 100% { stroke: #059669; stroke-width: 2.5; opacity: 1; }
    }

    @keyframes trace-pulse-1 {
      0%, 24% { opacity: 1; }
      25%, 100% { opacity: 0.86; }
    }
    @keyframes trace-pulse-2 {
      0%, 24% { opacity: 0.86; }
      25%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.86; }
    }
    @keyframes trace-pulse-3 {
      0%, 49% { opacity: 0.86; }
      50%, 74% { opacity: 1; }
      75%, 100% { opacity: 0.86; }
    }
    @keyframes trace-pulse-4 {
      0%, 74% { opacity: 0.86; }
      75%, 100% { opacity: 1; }
    }

    @keyframes dot-travel {
      0%   { transform: translate(0px, 0px); opacity: 1; }
      22%  { transform: translate(0px, 76px); opacity: 1; }
      26%  { transform: translate(0px, 148px); opacity: 1; }
      48%  { transform: translate(0px, 224px); opacity: 1; }
      52%  { transform: translate(0px, 300px); opacity: 1; }
      72%  { transform: translate(0px, 368px); opacity: 1; }
      95%  { transform: translate(0px, 368px); opacity: 1; }
      100% { transform: translate(0px, 0px); opacity: 1; }
    }

    .p1 { animation: phase1-hl 12s linear infinite; }
    .p2 { animation: phase2-hl 12s linear infinite; }
    .p3 { animation: phase3-hl 12s linear infinite; }
    .p4 { animation: phase4-hl 12s linear infinite; }

    .t1 { animation: trace-pulse-1 12s linear infinite; }
    .t2 { animation: trace-pulse-2 12s linear infinite; }
    .t3 { animation: trace-pulse-3 12s linear infinite; }
    .t4 { animation: trace-pulse-4 12s linear infinite; }
    .tracer { animation: dot-travel 12s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .p1, .p2, .p3, .p4, .t1, .t2, .t3, .t4, .tracer {
        animation: none !important;
      }
      .p1, .p2, .p3, .p4 { opacity: 1 !important; stroke-width: 1.5 !important; }
      .t1, .t2, .t3, .t4 { opacity: 1 !important; }
      .tracer { opacity: 1 !important; transform: none !important; }
    }
  </style>

  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1160" height="620" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="1160" height="60" rx="12" fill="#0f172a"/>
  <rect x="0" y="44" width="1160" height="16" fill="#0f172a"/>
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#f8fafc">ECMAScript Equality Algorithms — Decision Flow &amp; Comparison</text>
  <text x="24" y="47" class="sans" font-size="12" fill="#94a3b8">IsLooselyEqual (==, §7.2.13) · IsStrictlyEqual (===, §7.2.14) · SameValue (Object.is, §7.2.9) · SameValueZero (§7.2.10)</text>

  <!-- LEFT PANEL: IsLooselyEqual Decision Tree + [] == ![] Coercion Trace -->
  <rect x="24" y="76" width="548" height="464" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="42" y="102" class="sans" font-size="14" font-weight="700" fill="#0f172a">IsLooselyEqual(x, y) — Ordered Coercion Flow</text>
  <text x="42" y="120" class="sans" font-size="11" fill="#64748b">Evaluates top-to-bottom; recurses after each type conversion</text>

  <!-- Decision Nodes (Left Column inside Left Panel) -->
  <!-- Node 1: Same Type -->
  <rect x="42" y="136" width="236" height="52" rx="8" fill="#eff6ff" class="p1"/>
  <text x="54" y="156" class="sans" font-size="11.5" font-weight="700" fill="#1e3a8a">1. Type(x) === Type(y)?</text>
  <text x="54" y="174" class="mono" font-size="10.5" fill="#1e40af">return IsStrictlyEqual(x, y)</text>
  <line x1="278" y1="162" x2="314" y2="162" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="318" y="144" width="110" height="36" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="373" y="166" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">x === y (fast)</text>

  <line x1="160" y1="188" x2="160" y2="210" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-slate)"/>
  <text x="168" y="203" class="mono" font-size="10" fill="#64748b">no</text>

  <!-- Node 2: null / undefined -->
  <rect x="42" y="212" width="236" height="52" rx="8" fill="#ecfdf5" class="p1"/>
  <text x="54" y="232" class="sans" font-size="11.5" font-weight="700" fill="#065f46">2. null &amp; undefined pair?</text>
  <text x="54" y="250" class="mono" font-size="10.5" fill="#047857">null == undefined → true</text>
  <line x1="278" y1="238" x2="314" y2="238" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="318" y="220" width="110" height="36" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="373" y="242" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">return true</text>

  <line x1="160" y1="264" x2="160" y2="286" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-slate)"/>
  <text x="168" y="279" class="mono" font-size="10" fill="#64748b">no</text>

  <!-- Node 3: Boolean -> ToNumber -->
  <rect x="42" y="288" width="236" height="58" rx="8" fill="#fffbeb" class="p2"/>
  <text x="54" y="308" class="sans" font-size="11.5" font-weight="700" fill="#92400e">3. Boolean involved?</text>
  <text x="54" y="325" class="mono" font-size="10.5" fill="#b45309">ToNumber(bool) → 1 or +0</text>
  <text x="54" y="339" class="sans" font-size="10" fill="#78350f">Recurse: [] == false → [] == 0</text>

  <line x1="160" y1="346" x2="160" y2="368" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-slate)"/>

  <!-- Node 4: Object -> ToPrimitive -->
  <rect x="42" y="370" width="236" height="58" rx="8" fill="#fffbeb" class="p2"/>
  <text x="54" y="390" class="sans" font-size="11.5" font-weight="700" fill="#92400e">4. Object vs Primitive?</text>
  <text x="54" y="407" class="mono" font-size="10.5" fill="#b45309">ToPrimitive(obj, default)</text>
  <text x="54" y="421" class="sans" font-size="10" fill="#78350f">Recurse: [] == 0 → "" == 0</text>

  <line x1="160" y1="428" x2="160" y2="450" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-slate)"/>

  <!-- Node 5: String/BigInt vs Number -->
  <rect x="42" y="452" width="236" height="68" rx="8" fill="#f5f3ff" class="p3"/>
  <text x="54" y="472" class="sans" font-size="11.5" font-weight="700" fill="#5b21b6">5. String / BigInt vs Number</text>
  <text x="54" y="489" class="mono" font-size="10.5" fill="#6d28d9">ToNumber(str) → 0 === 0</text>
  <text x="54" y="506" class="mono" font-size="10" fill="#9f1239">Else (e.g. null == 0) → false</text>

  <!-- Animated Tracer Dot -->
  <circle cx="54" cy="148" r="5" fill="#d97706" stroke="#ffffff" stroke-width="1.5" class="tracer"/>

  <!-- Live Coercion Trace Box (Right Column inside Left Panel) -->
  <rect x="304" y="276" width="250" height="244" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4" class="t2"/>
  <text x="318" y="298" class="sans" font-size="12" font-weight="700" fill="#92400e">Live Trace: [] == ![]</text>
  <rect x="318" y="310" width="222" height="28" rx="5" fill="#ffffff" stroke="#fcd34d"/>
  <text x="328" y="328" class="mono" font-size="10.5" fill="#334155">1. ![] → false (truthy obj)</text>
  <rect x="318" y="344" width="222" height="28" rx="5" fill="#ffffff" stroke="#fcd34d"/>
  <text x="328" y="362" class="mono" font-size="10.5" fill="#334155">2. ToNumber(false) → 0</text>
  <rect x="318" y="378" width="222" height="28" rx="5" fill="#ffffff" stroke="#fcd34d"/>
  <text x="328" y="396" class="mono" font-size="10.5" fill="#334155">3. ToPrimitive([]) → ""</text>
  <rect x="318" y="412" width="222" height="28" rx="5" fill="#ffffff" stroke="#fcd34d"/>
  <text x="328" y="430" class="mono" font-size="10.5" fill="#334155">4. ToNumber("") → 0 === 0</text>
  <rect x="318" y="448" width="222" height="28" rx="5" fill="#ecfdf5" stroke="#059669"/>
  <text x="429" y="466" class="mono" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">Result: true (Non-transitive!)</text>
  <text x="318" y="498" class="mono" font-size="10" fill="#9f1239">Trap: '0'==0 &amp;&amp; 0=='' but '0'!=''</text>
  <text x="318" y="512" class="mono" font-size="10" fill="#9f1239">Safe idiom: x == null only</text>

  <!-- RIGHT PANEL: The 4 Equality Algorithms Matrix -->
  <rect x="590" y="76" width="546" height="464" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="610" y="102" class="sans" font-size="14" font-weight="700" fill="#0f172a">Four Spec Algorithms Compared (Coercion, NaN, ±0)</text>
  <text x="610" y="120" class="sans" font-size="11" fill="#64748b">Animated phase spotlight highlights how each edge case diverges</text>

  <!-- Column Headers -->
  <rect x="610" y="132" width="506" height="28" rx="5" fill="#f1f5f9"/>
  <text x="622" y="150" class="sans" font-size="11" font-weight="700" fill="#334155">Algorithm / API</text>
  <text x="822" y="150" class="sans" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Coerces</text>
  <text x="908" y="150" class="sans" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">NaN == NaN</text>
  <text x="996" y="150" class="sans" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">+0 == -0</text>
  <text x="1076" y="150" class="sans" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Used By</text>

  <!-- Card 1: IsLooselyEqual -->
  <rect x="610" y="170" width="506" height="78" rx="8" fill="#fffbeb" class="p2"/>
  <text x="624" y="194" class="mono" font-size="12.5" font-weight="700" fill="#92400e">IsLooselyEqual (==)</text>
  <text x="624" y="213" class="sans" font-size="10.5" fill="#78350f">§7.2.13 · Coercive equality</text>
  <text x="624" y="232" class="mono" font-size="10" fill="#92400e">'1' == 1 → true · null == 0 → false</text>

  <rect x="794" y="182" width="56" height="24" rx="5" fill="#d97706"/>
  <text x="822" y="198" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">YES</text>
  <rect x="880" y="182" width="56" height="24" rx="5" fill="#ffe4e6" stroke="#e11d48"/>
  <text x="908" y="198" class="mono" font-size="10.5" font-weight="700" fill="#9f1239" text-anchor="middle">false</text>
  <rect x="968" y="182" width="56" height="24" rx="5" fill="#dcfce7" stroke="#059669"/>
  <text x="996" y="198" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">true</text>
  <text x="1076" y="198" class="mono" font-size="10.5" fill="#334155" text-anchor="middle">== / !=</text>

  <!-- Card 2: IsStrictlyEqual -->
  <rect x="610" y="258" width="506" height="78" rx="8" fill="#eff6ff" class="p1"/>
  <text x="624" y="282" class="mono" font-size="12.5" font-weight="700" fill="#1e3a8a">IsStrictlyEqual (===)</text>
  <text x="624" y="301" class="sans" font-size="10.5" fill="#1e40af">§7.2.14 · Different types → false</text>
  <text x="624" y="320" class="mono" font-size="10" fill="#1e3a8a">[NaN].indexOf(NaN) → -1</text>

  <rect x="794" y="270" width="56" height="24" rx="5" fill="#e2e8f0"/>
  <text x="822" y="286" class="mono" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">NO</text>
  <rect x="880" y="270" width="56" height="24" rx="5" fill="#ffe4e6" stroke="#e11d48"/>
  <text x="908" y="286" class="mono" font-size="10.5" font-weight="700" fill="#9f1239" text-anchor="middle">false</text>
  <rect x="968" y="270" width="56" height="24" rx="5" fill="#dcfce7" stroke="#059669"/>
  <text x="996" y="286" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">true</text>
  <text x="1076" y="284" class="mono" font-size="10" fill="#334155" text-anchor="middle">=== switch</text>
  <text x="1076" y="298" class="mono" font-size="10" fill="#334155" text-anchor="middle">indexOf</text>

  <!-- Card 3: SameValue -->
  <rect x="610" y="346" width="506" height="84" rx="8" fill="#f5f3ff" class="p3"/>
  <text x="624" y="370" class="mono" font-size="12.5" font-weight="700" fill="#5b21b6">SameValue (Object.is)</text>
  <text x="624" y="389" class="sans" font-size="10.5" fill="#6d28d9">§7.2.9 · True equivalence relation</text>
  <text x="624" y="408" class="mono" font-size="10" fill="#5b21b6">Object.is(NaN, NaN) → true · (+0, -0) → false</text>
  <text x="624" y="422" class="sans" font-size="10" fill="#4c1d95">Bit-exact: distinguishes IEEE 754 sign bit of zero</text>

  <rect x="794" y="358" width="56" height="24" rx="5" fill="#e2e8f0"/>
  <text x="822" y="374" class="mono" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">NO</text>
  <rect x="880" y="358" width="56" height="24" rx="5" fill="#dcfce7" stroke="#059669"/>
  <text x="908" y="374" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">true</text>
  <rect x="968" y="358" width="56" height="24" rx="5" fill="#ffe4e6" stroke="#e11d48"/>
  <text x="996" y="374" class="mono" font-size="10.5" font-weight="700" fill="#9f1239" text-anchor="middle">false</text>
  <text x="1076" y="372" class="mono" font-size="10" fill="#334155" text-anchor="middle">Object.is</text>
  <text x="1076" y="386" class="mono" font-size="10" fill="#334155" text-anchor="middle">React hooks</text>

  <!-- Card 4: SameValueZero -->
  <rect x="610" y="440" width="506" height="84" rx="8" fill="#ecfdf5" class="p4"/>
  <text x="624" y="464" class="mono" font-size="12.5" font-weight="700" fill="#065f46">SameValueZero</text>
  <text x="624" y="483" class="sans" font-size="10.5" fill="#047857">§7.2.10 · Collection key &amp; membership</text>
  <text x="624" y="502" class="mono" font-size="10" fill="#065f46">[NaN].includes(NaN) → true · Set([+0, -0]).size === 1</text>
  <text x="624" y="516" class="sans" font-size="10" fill="#047857">Matches NaN with NaN while collapsing +0 and -0</text>

  <rect x="794" y="452" width="56" height="24" rx="5" fill="#e2e8f0"/>
  <text x="822" y="468" class="mono" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">NO</text>
  <rect x="880" y="452" width="56" height="24" rx="5" fill="#dcfce7" stroke="#059669"/>
  <text x="908" y="468" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">true</text>
  <rect x="968" y="452" width="56" height="24" rx="5" fill="#dcfce7" stroke="#059669"/>
  <text x="996" y="468" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">true</text>
  <text x="1076" y="466" class="mono" font-size="10" fill="#334155" text-anchor="middle">Map / Set</text>
  <text x="1076" y="480" class="mono" font-size="10" fill="#334155" text-anchor="middle">.includes()</text>

  <!-- FOOTER -->
  <rect x="24" y="556" width="1112" height="46" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="42" y="584" class="sans" font-size="11.5" font-weight="600" fill="#1e3a8a">Takeaway: Default to ===; use x == null only for null/undefined checks; use Object.is when NaN or -0 matters; Map/Set/includes use SameValueZero.</text>
</svg>
