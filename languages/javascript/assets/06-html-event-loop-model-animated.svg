<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" width="1160" height="620" role="img" aria-labelledby="title desc">
  <title id="title">HTML Living Standard Section 8.1.7.3 Event Loop Processing Model</title>
  <desc id="desc">Animated step-by-step execution cycle of the browser HTML event loop: picking one runnable macrotask from task queues, draining the entire FIFO microtask queue including chained promise reactions during PERFORM-MICROTASK-CHECKPOINT, running requestAnimationFrame callbacks on rendering opportunity, and executing Style, Layout, Paint, and Composite before looping to the next macrotask.</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* 12s cycle across 4 phases:
       0-25%  : Step 1 — Dequeue and run 1 Macrotask (enqueues Promise #1)
       25-55% : Step 2 — Full Microtask Checkpoint drain (Promise #1 -> chained Promise #2 -> queueMicrotask)
       55-78% : Step 3 — Render Opportunity + requestAnimationFrame callbacks
       78-100%: Step 4 — Style -> Layout (ResizeObserver) -> Paint -> Composite -> loop
    */
    @keyframes st1 {
      0%, 24% { stroke: #0f766e; stroke-width: 2.5; opacity: 1; }
      25%, 100% { stroke: #d6d0c4; stroke-width: 1.2; opacity: 0.86; }
    }
    @keyframes st2 {
      0%, 24% { stroke: #d6d0c4; stroke-width: 1.2; opacity: 0.86; }
      25%, 54% { stroke: #b45309; stroke-width: 2.5; opacity: 1; }
      55%, 100% { stroke: #d6d0c4; stroke-width: 1.2; opacity: 0.86; }
    }
    @keyframes st3 {
      0%, 54% { stroke: #d6d0c4; stroke-width: 1.2; opacity: 0.86; }
      55%, 77% { stroke: #0f766e; stroke-width: 2.5; opacity: 1; }
      78%, 100% { stroke: #d6d0c4; stroke-width: 1.2; opacity: 0.86; }
    }
    @keyframes st4 {
      0%, 77% { stroke: #d6d0c4; stroke-width: 1.2; opacity: 0.86; }
      78%, 100% { stroke: #0f766e; stroke-width: 2.5; opacity: 1; }
    }

    @keyframes chained-appear {
      0%, 26% { opacity: 0.86; transform: scale(0.95); }
      32%, 52% { opacity: 1; transform: scale(1); }
      56%, 100% { opacity: 0.86; transform: scale(0.95); }
    }

    .s1 { animation: st1 12s linear infinite; }
    .s2 { animation: st2 12s linear infinite; }
    .s3 { animation: st3 12s linear infinite; }
    .s4 { animation: st4 12s linear infinite; }
    .chain { transform-box: fill-box; transform-origin: center; animation: chained-appear 12s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .s1, .s2, .s3, .s4, .chain, .cursor { animation: none !important; }
      .s1, .s2, .s3, .s4 { opacity: 1 !important; stroke-width: 1.5 !important; }
      .chain { opacity: 1 !important; transform: none !important; }
      .cursor { transform: none !important; }
    }
  </style>

  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1160" height="620" rx="4" fill="#faf8f5" stroke="#e7e2d8" stroke-width="1"/>

  <!-- Header -->
  <line x1="24" y1="62" x2="1136" y2="62" stroke="#1c1917" stroke-width="1.2"/>
  
  <text x="24" y="27" class="sans" font-size="18" font-weight="700" fill="#1c1917" font-family="Georgia, 'Times New Roman', serif">HTML §8.1.7.3 Event Loop &amp; Rendering Processing Model</text>
  <text x="24" y="47" class="sans" font-size="12" fill="#57534e" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">1 Macrotask → Exhaustive Microtask Checkpoint Drain → In-Parallel Render Opportunity → rAF → Style / Layout / Paint / Composite</text>

  <!-- LEFT PANEL: QUEUES & INVARIANT -->
  <rect x="24" y="76" width="358" height="464" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="42" y="102" class="sans" font-size="14" font-weight="700" fill="#1c1917">Host Task &amp; Microtask Queues</text>

  <!-- Macrotask Queues (Set) -->
  <rect x="42" y="116" width="322" height="148" rx="8" fill="#f0fdf9" stroke="#99f6e4" stroke-width="1.2"/>
  <text x="56" y="136" class="sans" font-size="12" font-weight="700" fill="#065f46">Task Queues (Set of Sources)</text>
  <text x="56" y="152" class="sans" font-size="10.5" fill="#065f46">FIFO within source; browser picks priority</text>

  <rect x="56" y="164" width="142" height="36" rx="6" fill="#0f766e"/>
  <text x="127" y="186" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Input / Click Task</text>
  <rect x="208" y="164" width="142" height="36" rx="6" fill="#ffffff" stroke="#99f6e4"/>
  <text x="279" y="186" class="mono" font-size="10.5" fill="#065f46" text-anchor="middle">setTimeout(fn, 0)</text>

  <rect x="56" y="210" width="142" height="38" rx="6" fill="#ffffff" stroke="#99f6e4"/>
  <text x="127" y="233" class="mono" font-size="10.5" fill="#065f46" text-anchor="middle">MessageChannel</text>
  <rect x="208" y="210" width="142" height="38" rx="6" fill="#f5f1e8" stroke="#0f766e" stroke-width="1.2"/>
  <text x="279" y="227" class="mono" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">Render Task</text>
  <text x="279" y="241" class="sans" font-size="10" fill="#065f46" text-anchor="middle">(queued at vsync)</text>

  <!-- Microtask Queue (FIFO) -->
  <rect x="42" y="278" width="322" height="154" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.4"/>
  <text x="56" y="298" class="sans" font-size="12" font-weight="700" fill="#92400e">Microtask Queue (Strict FIFO)</text>
  <text x="56" y="314" class="sans" font-size="10.5" fill="#b45309">Drained 100% before next Macrotask or Render</text>

  <rect x="56" y="326" width="294" height="28" rx="5" fill="#ffffff" stroke="#b45309"/>
  <text x="68" y="344" class="mono" font-size="10.5" fill="#92400e">1. PromiseReactionJob (.then #1)</text>

  <rect x="56" y="360" width="294" height="28" rx="5" fill="#ffffff" stroke="#b45309"/>
  <text x="68" y="378" class="mono" font-size="10.5" fill="#92400e">2. queueMicrotask(cb) / MutationObserver</text>

  <g class="chain">
    <rect x="56" y="394" width="294" height="28" rx="5" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
    <text x="68" y="412" class="mono" font-size="10.5" font-weight="700" fill="#92400e">3. Chained .then #2 (joins same drain!)</text>
  </g>

  <!-- Loop Invariant Box -->
  <rect x="42" y="446" width="322" height="78" rx="8" fill="#fef2f2" stroke="#fda4af" stroke-width="1.2"/>
  <text x="56" y="468" class="sans" font-size="11.5" font-weight="700" fill="#991b1b">Starvation Hazard &amp; Loop Invariant</text>
  <text x="56" y="486" class="sans" font-size="10.5" fill="#44403c">• Microtasks can starve tasks &amp; rendering forever.</text>
  <text x="56" y="502" class="sans" font-size="10.5" fill="#44403c">• Yield via setTimeout / MessageChannel /</text>
  <text x="56" y="516" class="mono" font-size="10.5" fill="#991b1b">  await scheduler.yield() to unblock frames.</text>

  <!-- RIGHT PANEL: 4-PHASE ANIMATED LOOP -->
  <rect x="402" y="76" width="734" height="464" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5"/>
  <text x="422" y="102" class="sans" font-size="14" font-weight="700" fill="#1c1917">Event Loop Iteration — Step-by-Step Execution Cycle</text>

  <!-- Active Phase Cursor -->
  <g class="cursor">
    <circle cx="428" cy="160" r="7" fill="#1c1917"/>
  </g>

  <!-- Phase 1: Macrotask -->
  <rect x="444" y="118" width="672" height="88" rx="8" fill="#f0fdf9" class="s1"/>
  <rect x="458" y="130" width="90" height="24" rx="5" fill="#0f766e"/>
  <text x="503" y="146" class="mono" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1. TASK</text>
  <text x="560" y="146" class="sans" font-size="13" font-weight="700" fill="#065f46">Dequeue &amp; Execute One Runnable Macrotask</text>
  <text x="458" y="170" class="mono" font-size="11" fill="#44403c">Run script/input callback → JS stack empties → enqueues Promise #1</text>
  <text x="458" y="190" class="sans" font-size="10.5" fill="#065f46">Long task warning (&gt; 50 ms) recorded for Long Animation Frames (LoAF).</text>
  <rect x="986" y="130" width="114" height="26" rx="5" fill="#0f766e"/>
  <text x="1043" y="147" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Stack Empty</text>

  <line x1="780" y1="206" x2="780" y2="224" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- Phase 2: Microtask Checkpoint -->
  <rect x="444" y="226" width="672" height="90" rx="8" fill="#fffbeb" class="s2"/>
  <rect x="458" y="238" width="90" height="24" rx="5" fill="#b45309"/>
  <text x="503" y="254" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">2. μTASK</text>
  <text x="560" y="254" class="sans" font-size="13" font-weight="700" fill="#92400e">PERFORM-MICROTASK-CHECKPOINT() — Full Drain</text>
  <text x="458" y="278" class="mono" font-size="11" fill="#44403c">while (!microtaskQueue.isEmpty) runOldest()  // drains chained Promises too!</text>
  <text x="458" y="298" class="sans" font-size="10.5" fill="#b45309">Then fires unhandledrejection events, cleans up IndexedDB, calls ClearKeptObjects().</text>
  <rect x="986" y="238" width="114" height="26" rx="5" fill="#b45309"/>
  <text x="1043" y="255" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Queue = 0</text>

  <line x1="780" y1="316" x2="780" y2="334" stroke="#b45309" stroke-width="1.8" marker-end="url(#arr-amber)"/>

  <!-- Phase 3: Render Opportunity & rAF -->
  <rect x="444" y="336" width="672" height="88" rx="8" fill="#f5f1e8" class="s3"/>
  <rect x="458" y="348" width="90" height="24" rx="5" fill="#0f766e"/>
  <text x="503" y="364" class="mono" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3. rAF</text>
  <text x="560" y="364" class="sans" font-size="13" font-weight="700" fill="#065f46">Render Task Queued (In Parallel) → requestAnimationFrame</text>
  <text x="458" y="388" class="mono" font-size="11" fill="#44403c">Resize / Scroll / MediaQuery / Animations → rAF(frameTimestamp)</text>
  <text x="458" y="408" class="sans" font-size="10.5" fill="#065f46">All rAF callbacks share 1 frame timestamp; microtasks drain between each rAF callback.</text>
  <rect x="986" y="348" width="114" height="26" rx="5" fill="#0f766e"/>
  <text x="1043" y="365" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">~16.7ms 60Hz</text>

  <line x1="780" y1="424" x2="780" y2="442" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-violet)"/>

  <!-- Phase 4: Style -> Layout -> Paint -> Composite -->
  <rect x="444" y="444" width="672" height="82" rx="8" fill="#f0fdf9" class="s4"/>
  <rect x="458" y="456" width="90" height="24" rx="5" fill="#0f766e"/>
  <text x="503" y="472" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">4. RENDER</text>
  <text x="560" y="472" class="sans" font-size="13" font-weight="700" fill="#065f46">Style → Layout → Paint → Composite (Frame Presented)</text>

  <!-- 4 Mini Pipeline Chips inside Phase 4 -->
  <rect x="458" y="488" width="118" height="28" rx="5" fill="#ffffff" stroke="#0f766e"/>
  <text x="517" y="506" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">Recalc Style</text>
  <line x1="576" y1="502" x2="594" y2="502" stroke="#0f766e" stroke-width="1.4" marker-end="url(#arr-green)"/>

  <rect x="598" y="488" width="168" height="28" rx="5" fill="#ffffff" stroke="#0f766e"/>
  <text x="682" y="506" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">Layout + ResizeObs</text>
  <line x1="766" y1="502" x2="784" y2="502" stroke="#0f766e" stroke-width="1.4" marker-end="url(#arr-green)"/>

  <rect x="788" y="488" width="144" height="28" rx="5" fill="#ffffff" stroke="#0f766e"/>
  <text x="860" y="506" class="mono" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">IntersectObs + Paint</text>
  <line x1="932" y1="502" x2="950" y2="502" stroke="#0f766e" stroke-width="1.4" marker-end="url(#arr-green)"/>

  <rect x="954" y="488" width="146" height="28" rx="5" fill="#0f766e"/>
  <text x="1027" y="506" class="mono" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">GPU Composite</text>

  <!-- Loop-back indicator on far right edge -->
  <path d="M 1116 485 L 1126 485 L 1126 160 L 1118 160" fill="none" stroke="#0f766e" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr-blue)"/>

  <!-- FOOTER -->
  <rect x="24" y="556" width="1112" height="46" rx="8" fill="#f0fdf9" stroke="#99f6e4" stroke-width="1"/>
  <text x="42" y="584" class="sans" font-size="11.5" font-weight="600" fill="#065f46">Takeaway: Every macrotask (and every real user click listener) drains all queued &amp; chained microtasks immediately; rendering runs via an in-parallel vsync task.</text>
</svg>
